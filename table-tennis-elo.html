  const legacy=[...reviewArr(r,'pain'), ...reviewArr(r,'worked'), ...reviewArr(r,'nextPlans'), ...reviewArr(r,'tags')];
  const axis=REVIEW_AXIS[key];
  if(!axis) return [];
  return [...new Set(legacy.filter(x=>axis.tags.includes(x)))];
}
function reviewAxes(r){
  if(r && Array.isArray(r.axes)) return r.axes.filter(k=>REVIEW_AXIS[k]);
  const legacy=[...reviewArr(r,'pain'), ...reviewArr(r,'worked'), ...reviewArr(r,'nextPlans'), ...reviewArr(r,'tags')];
  const out=[];
  REVIEW_AXES.forEach(a=>{
    if(legacy.includes(a.label) || legacy.some(x=>a.tags.includes(x))) out.push(a.key);
  });
  return [...new Set(out)];
}
function reviewMemo(r){ return (r&&r.memo) || [r&&r.oppNote, r&&r.plan, r&&r.good, r&&r.bad].filter(Boolean).join('\n'); }
function reviewFlatTags(r){
  const axes=reviewAxes(r);
  const out=[];
  axes.forEach(k=>reviewAxisTags(r,k).forEach(t=>out.push(t)));
  return [...new Set(out)];
}
function reviewSummary(r){
  const self=reviewSelfSummary(r);
  if(self) return self;
  const axes=reviewAxes(r).map(reviewAxisLabel);
  const tags=reviewFlatTags(r);
  const vals=[...axes.slice(0,2), ...tags.slice(0,2)];
  if(vals.length) return vals.slice(0,3).join(' · ');
  const m=reviewMemo(r);
  return m ? m.replace(/\s+/g,' ').slice(0,24) : '복기';
}
function reviewTopFrom(reviews, getter){
  const c={};
  reviews.forEach(r=>(getter(r)||[]).forEach(x=>{ if(x) c[x]=(c[x]||0)+1; }));
  return Object.entries(c).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,4);
}
function reviewTopBox(title, top){
  if(!top.length) return '';
  return `<div class="box"><b>${esc(title)}</b>${top.map(([k,n])=>`<span>${esc(k)} <i>${n}</i></span>`).join('')}</div>`;
}

function scoutPath(pid){ return 'scoutingStats/'+safeFbKey(pid||''); }
function scoutTagKey(tag){ return safeFbKey(String(tag||'').trim()).slice(0,60); }
function scoutPublic(r){
  if(!r || r.shareScout!==true) return {axes:[], axisTags:{}};
  const axes=reviewAxes(r);
  const axisTags={};
  axes.forEach(k=>{ axisTags[k]=reviewAxisTags(r,k).slice(0,12); });
  return {axes, axisTags};
}
function scoutHas(x){ return !!(x && (x.axes||[]).length); }
function scoutEachTag(x, fn){
  Object.entries((x&&x.axisTags)||{}).forEach(([axis,tags])=>{
    (tags||[]).forEach(tag=>{ const key=scoutTagKey(tag); if(key) fn(axis, key, tag); });
  });
}
async function applyScoutingDelta(targetId, prev, next){
  if(!FB || !FB.patchRaw || !FB.inc || !targetId) return false;
  const p=scoutPublic(prev), n=scoutPublic(next), patch={};
  const add=(path,d)=>{ if(d) patch[path]=FB.inc(d); };
  if(scoutHas(p)!==scoutHas(n)) add('total', scoutHas(n)?1:-1);
  (p.axes||[]).forEach(k=>add('axes/'+safeFbKey(k), -1));
  (n.axes||[]).forEach(k=>add('axes/'+safeFbKey(k), 1));
  scoutEachTag(p, (axis,key)=>add(`tags/${safeFbKey(axis)}/${key}/count`, -1));
  scoutEachTag(n, (axis,key,tag)=>{ add(`tags/${safeFbKey(axis)}/${key}/count`, 1); patch[`tags/${safeFbKey(axis)}/${key}/label`]=tag; });
  if(!Object.keys(patch).length) return true;
  try{ await FB.patchRaw(scoutPath(targetId), patch); return true; }
  catch(e){ S.lastError=e && (e.message||String(e)); return false; }
}
function scoutAxisPercents(stats, reveal){
  const total=Math.max(0, +(stats&&stats.total)||0), axes=(stats&&stats.axes)||{};
  return REVIEW_AXES.map(a=>{
    const n=Math.max(0, +(axes[a.key]||0));
    return {...a, n, pct:reveal&&total?Math.min(100, Math.round(n/total*100)):0};
  });
}
function radarPoint(v, i, r){
  const ang=(-90 + i*60) * Math.PI / 180, rr=(r||42) * Math.max(0, Math.min(108, +v||0)) / 100;
  return {x:(50+Math.cos(ang)*rr).toFixed(1), y:(50+Math.sin(ang)*rr).toFixed(1)};
}
function radarPoints(vals, r){ return vals.map((v,i)=>{ const p=radarPoint(v,i,r); return `${p.x},${p.y}`; }).join(' '); }
function scoutRadarHTML(stats, reveal){
  const data=scoutAxisPercents(stats, reveal), vals=data.map(x=>x.pct);
  const rings=[100,75,50,25].map(v=>`<polygon class="grid" points="${radarPoints([v,v,v,v,v,v],42)}"></polygon>`).join('');
  const spokes=[0,1,2,3,4,5].map(i=>{ const p=radarPoint(100,i,42); return `<line class="spoke" x1="50" y1="50" x2="${p.x}" y2="${p.y}"></line>`; }).join('');
  const dots=data.map((d,i)=>{ const p=radarPoint(d.pct,i,42); return `<circle class="dot" cx="${p.x}" cy="${p.y}" r="1.8"></circle>`; }).join('');
  const labels=data.map((d,i)=>{ const p=radarPoint(111,i,42); return `<text class="lab" x="${p.x}" y="${p.y}">${esc(d.short)}</text>`; }).join('');
  return `<div class="rvradar" aria-label="육각형 능력치">
    <div class="rvradar-plot"><svg viewBox="-4 -4 108 108" role="img" aria-label="육각형 능력치 레이더">${rings}${spokes}<polygon class="shape" points="${radarPoints(vals,42)}"></polygon>${dots}${labels}</svg></div>
    <div class="rvradar-list">${data.map(d=>`<div><span>${esc(d.label)}</span><i><span style="width:${d.pct}%"></span></i><b>${reveal?d.pct+'%':'--'}</b></div>`).join('')}</div>
  </div>`;
}
function scoutStatsHTML(id, stats, loading){
  const p=P(id), title=p&&S.me&&p.id===S.me.id?'남들이 보는 내 육각형':'익명 상대평';

  const total=Math.max(0, +(stats&&stats.total)||0), reveal=!!(stats && total>=SCOUT_MIN);
  if(!reveal) return `<div class="card"><div class="secttl">${title}</div>${scoutRadarHTML(stats,false)}<div class="rvpub-empty">아직 공개할 만큼 쌓이지 않았습니다. 최소 ${SCOUT_MIN}건 이상 익명 평가가 모이면 이 육각형에 채워집니다.${total?` 현재 ${total}건은 숨김 처리됩니다.`:''}</div></div>`;

async function saveReviewFor(mid, data){
  if(!S.me) return false;
  const key=safeFbKey(mid), now=new Date().toISOString();
  const prev=reviewOf(mid)||{};
  const rec={...prev, ...data, matchId:mid, ownerPlayerId:S.me.id, updatedAt:now, createdAt:prev.createdAt||now, v:5};
  const next={...ensureReviewLoaded(S.me.id), [key]:rec};
  S.privateReviews=next;
  localSet(privateReviewKey(S.me.id), next);
  if(!FB){ S.privateReviewState='local'; S.privateReviewMsg='Firebase 연결 전이라 이 기기에 먼저 저장했습니다.'; return false; }
  try{
    await FB.set(reviewCloudPath(S.me.id), next);
    await applyScoutingDelta(rec.oppId||prev.oppId, prev, rec);
    S.privateReviewState='synced'; S.privateReviewMsg='';
    return true;
  }catch(e){
    S.privateReviewState='local';
    S.privateReviewMsg='Firebase 동기화에 실패해 이 기기에만 저장했습니다.';
    S.lastError=e && (e.message||String(e));
    return false;
  }
}
async function deleteReviewFor(mid){
  if(!S.me) return false;
  const key=safeFbKey(mid), prev=reviewOf(mid)||null, next={...ensureReviewLoaded(S.me.id)};
  delete next[key];
  S.privateReviews=next;
  localSet(privateReviewKey(S.me.id), next);
  if(!FB){ S.privateReviewState='local'; S.privateReviewMsg='Firebase 연결 전이라 이 기기에서 먼저 삭제했습니다.'; return false; }
  try{
    await FB.set(reviewCloudPath(S.me.id), next);
    await applyScoutingDelta(prev&&prev.oppId, prev, null);
    S.privateReviewState='synced'; S.privateReviewMsg='';
    return true;
  }catch(e){
    S.privateReviewState='local';
    S.privateReviewMsg='Firebase 동기화에 실패해 이 기기에서만 삭제했습니다.';
    S.lastError=e && (e.message||String(e));
    return false;

}

async function trackVisit(force){
  if(!S.ready || !visitTrackingAllowed() || isAdmin()) return false;
  if(S._visitBusy && !force) return false;
  const nowMs=Date.now(), day=today(), tab=safeFbKey(S.tab||'rank');
  const who=S.me ? safeFbKey(S.me.id) : 'guest';
  const state = localGet(KEY.visitState) || {};
  const seen = state.seen && typeof state.seen==='object' ? state.seen : {};
  const throttleKey = day+'|'+tab+'|'+who;
  if(!force && nowMs-(seen[throttleKey]||0) < VISIT_THROTTLE_MS) return false;
  seen[throttleKey]=nowMs;
  Object.keys(seen).forEach(k=>{ if(!k.startsWith(day+'|')) delete seen[k]; });
  S._visitBusy = true;
  try{
    const vid=getVisitorId();
    const now=new Date().toISOString();
    const visitorPath=`daily/${day}/visitors/${vid}`;
    const rec=(await visitRead(visitorPath)) || {};
    const tabs=rec.tabs && typeof rec.tabs==='object' ? {...rec.tabs} : {};
    tabs[tab]=(+tabs[tab]||0)+1;
    const updates={
      v:1,
      [visitorPath]:{firstAt:rec.firstAt||now, lastAt:now, count:(+rec.count||0)+1, lastTab:tab, tabs}
    };
    if(S.me){
      const mid=safeFbKey(S.me.id);
      const mrec=(await visitRead(`members/${mid}`)) || {};
      const days=mrec.days && typeof mrec.days==='object' ? {...mrec.days} : {};
      const cutoff=dayAgo(VISIT_KEEP_DAYS);
      Object.keys(days).forEach(d=>{ if(d<cutoff) delete days[d]; });
      days[day]=true;
      updates[`members/${mid}`]={lastSeenAt:now, views:(+mrec.views||0)+1, days};
    }
    if(force || state.pruneDay!==day){
      const daily=(await visitRead('daily')) || {};
      const cutoff=dayAgo(VISIT_KEEP_DAYS);
      Object.keys(daily).forEach(d=>{ if(d<cutoff) updates[`daily/${safeFbKey(d)}`]=null; });
      const engagement=(await visitRead('engagement')) || {};
      Object.keys(engagement).forEach(d=>{if(d<cutoff)updates[`engagement/${safeFbKey(d)}`]=null;});
      state.pruneDay=day;
    }
    state.seen=seen;
    const ok=await visitPatch(updates);
    if(ok) localSet(KEY.visitState,state);
    return ok;
  }catch(e){ return false; }
  finally{ S._visitBusy=false; }
}

/* 변경 이력 — 날짜로 묶고 종류를 색점으로, 최근 것만 펼친다 */
function auditLogHTML(log){
  const list=(log||[]).filter(x=>x&&x.t);
  if(!list.length) return `<h2>변경 이력</h2><div class="card"><div class="tiny dim">아직 기록이 없습니다.</div></div>`;
  const kind = a => /삭제|정리/.test(a) ? 'del'
              : /선수|PIN|프로필|권한|명단|칭호|등록/.test(a) ? 'ppl'
              : /경기|입력|병합|날짜|확인|회차|대진/.test(a) ? 'mt' : 'cfg';
  const todayMd = fmtDateTime(new Date().toISOString()).slice(0,5);
  const yestMd  = fmtDateTime(new Date(Date.now()-864e5).toISOString()).slice(0,5);
  const dayTxt = md => md===todayMd?'오늘' : md===yestMd?'어제' : md;
  const row = x => `<div class="audr"><i class="ad ${kind(x.action||'')}"></i><time>${fmtDateTime(x.t).slice(6)}</time>
      <b>${esc(x.action)}</b><span class="by">${esc(x.by||'-')}</span>${x.detail?`<span class="ax">${esc(x.detail)}</span>`:''}</div>`;
  const groups=[];
  list.forEach(x=>{ const md=fmtDateTime(x.t).slice(0,5);
    if(!groups.length||groups[groups.length-1].md!==md) groups.push({md, rows:[]});
    groups[groups.length-1].rows.push(x); });
  const shown=[]; let gi=0;
  for(let acc=0; gi<groups.length && acc<15; gi++){ shown.push(groups[gi]); acc+=groups[gi].rows.length; }
  const rest=groups.slice(gi), restN=rest.reduce((a,g)=>a+g.rows.length,0);
  const block = g => `<div class="audd">${dayTxt(g.md)} <span>${g.rows.length}건</span></div>${g.rows.map(row).join('')}`;
  return `<h2>변경 이력</h2><div class="card">
    ${shown.map(block).join('')}
    ${rest.length?`<details class="advbox" style="margin:10px 0 0"><summary>이전 이력 ${restN}건</summary>
      <div class="advin">${rest.map(block).join('')}</div></details>`:''}
  </div>`;
}

function analysisSummary(ms,id){

  for(const m of ms){const won=winnerOf(m)===id,e=expFor(m,id);w+=+won;people.add(m.aId===id?m.bId:m.aId);dates.add(m.date);
    if(e!=null&&Number.isFinite(e)&&e>=0&&e<=1){en++;exp+=e;ew+=+won;}}

  for(const m of list){const lg=lgOf(m),rd=rdOf(m),me=buForMatch(id,m.date,lg,rd),other=buForMatch(m.aId===id?m.bId:m.aId,m.date,lg,rd);

function insightChart(points,kind){
  if(!points.length)return '<div class="chart-empty">이 기간에 표시할 기록이 없습니다.</div>';
  const w=620,h=230,pad={l:42,r:16,t:20,b:35},values=points.flatMap(p=>p.b==null?[p.a]:[p.a,p.b]);
  let lo=kind==='elo'?Math.floor((Math.min(...values)-10)/20)*20:0,hi=kind==='elo'?Math.ceil((Math.max(...values)+10)/20)*20:Math.max(1,Math.ceil(Math.max(...values)));
  if(hi===lo)hi=lo+1;
  const rough=(hi-lo)/3,power=Math.pow(10,Math.floor(Math.log10(rough))),step=([1,2,5,10].find(n=>n>=rough/power)||10)*power;
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const firstTime=Date.parse(points[0].d),lastTime=Date.parse(points[points.length-1].d);
  const x=i=>pad.l+(lastTime>firstTime?(Date.parse(points[i].d)-firstTime)/(lastTime-firstTime):i/Math.max(1,points.length-1))*(w-pad.l-pad.r),y=v=>h-pad.b-(v-lo)/(hi-lo)*(h-pad.t-pad.b);
  const path=k=>points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
  const main=path('a'),hasB=points.some(p=>p.b!=null),label=kind==='elo'?'누적 Elo':'누적 실제 승수와 기대 승수';
  const ticks=Array.from({length:Math.round((hi-lo)/step)+1},(_,i)=>lo+step*i);
  return `<svg class="insight-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} · ${points[0].d}부터 ${points[points.length-1].d}"><title>${label}. 마지막 값 ${points[points.length-1].a.toFixed(1)}${hasB?', 기대 '+points[points.length-1].b.toFixed(1):''}</title>
    ${ticks.map(v=>`<line class="plot-grid" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l-9}" y="${y(v)+4}" text-anchor="end">${kind==='elo'?Math.round(v):Number(v.toFixed(1))}</text>`).join('')}
    <path class="chart-area" d="${main} L${x(points.length-1)} ${h-pad.b} L${x(0)} ${h-pad.b}Z"/>
    ${hasB?`<path class="chart-expected" d="${path('b')}"/>`:''}<path class="chart-actual" d="${main}"/>
    ${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.a)}" r="${i===points.length-1?4:2}" class="chart-dot"><title>${p.d} · ${kind==='elo'?'Elo ': '실제 '}${p.a.toFixed(1)}${p.b==null?'':' / 기대 '+p.b.toFixed(1)}</title></circle>`).join('')}
    <text x="${pad.l}" y="${h-9}">${fmtDate(points[0].d)}</text><text x="${w-pad.r}" y="${h-9}" text-anchor="end">${fmtDate(points[points.length-1].d)}</text></svg>`;
}

/* 밴드에 내보내는 경기 결과는 모닝 리그만 사용한다. */
const BAND_RESULT_LEAGUE='morning';
function bandResultMatches(){
  return publicResultMatches().filter(m=>lgOf(m)===BAND_RESULT_LEAGUE&&m.date<=today());
}
function bandResultData(route={}){
  const lg=route.league||'all';
  if((lg!=='all'&&lg!==BAND_RESULT_LEAGUE)||!leagues().some(x=>x.id===BAND_RESULT_LEAGUE))return null;
  const p=route.player?P(route.player):null;
  if(route.player&&!p)return null;
  if(route.round&&!/^\d{4}(?:-\d{2})?-W\d{1,2}$/.test(route.round))return null;
  const list=bandResultMatches().filter(m=>(!route.round||rdOf(m)===route.round)&&(!p||m.aId===p.id||m.bId===p.id));
  const date=list.reduce((d,m)=>m.date>d?m.date:d,'');
  const selected=route.round?list:list.filter(m=>m.date===date);
  return {p,date,selected,route:{tab:'home',player:p?p.id:'',league:BAND_RESULT_LEAGUE,round:route.round||''}};
}
function canShareBandResult(route){const data=bandResultData(route);return !!(data&&data.selected.length);}
function shareResultText(route){
  const data=bandResultData(route);if(!data||!data.selected.length)return '';
  const {p,date,selected,route:scopeRoute}=data,lg=BAND_RESULT_LEAGUE;
  const title=p?`${p.name}님 모닝 경기 결과`:`${lgName(lg)} 모임 결과`;
  const scope=scopeRoute.round?roundLabel(scopeRoute.round):date;
  const wl=p?resultWL(selected,p.id):null;
  const result=wl?`${wl.w}승 ${wl.l}패`:`${selected.length}경기`;
  return `${title}\n${scope} · ${lgName(lg)} · ${result}\n상대별 결과는 로그인 없이 확인할 수 있어요.\n${appURL(scopeRoute,'band')}`;
}
/* 모든 밴드 복사 버튼은 입력 화면과 같은 상대별 승/패 댓글을 만든다. */
function bandCommentLines(matches,id){
  const win={},lose={};
  for(const m of matches){
    if(m.aId!==id&&m.bId!==id)continue;
    const opp=m.aId===id?m.bId:m.aId,box=winnerOf(m)===id?win:lose;
    box[opp]=(box[opp]||0)+1;
  }
  const fmt=box=>Object.keys(box).map(id=>'@'+(bandLabel(P(id))||nameOf(id))).join(' '),out=[];
  if(Object.keys(win).length)out.push(fmt(win)+' 님 상대 승');
  if(Object.keys(lose).length)out.push(fmt(lose)+' 님 상대 패');
  return out.join('\n');
}
function bandCommentText(route){
  const data=bandResultData(route);if(!data||!data.selected.length)return '';
  const {p,selected}=data,days=[...new Set(selected.map(m=>m.date))].sort();
  return days.map(date=>{
    const matches=selected.filter(m=>m.date===date);
    if(p)return (days.length>1?date+'\n':'')+bandCommentLines(matches,p.id);
    const ids=[...new Set(matches.flatMap(m=>[m.aId,m.bId]))];
    return date+'\n'+ids.map(id=>(bandLabel(P(id))||nameOf(id))+'\n'+bandCommentLines(matches,id)).join('\n\n');
  }).join('\n\n');
}
function selectCopyText(el){
  try{el.focus({preventScroll:true});el.select();el.setSelectionRange(0,el.value.length);}catch(e){}
}
function legacyCopyText(text,field){
  const previous=document.activeElement,el=field||document.createElement('textarea');
  if(!field){el.value=text;el.readOnly=true;el.setAttribute('aria-hidden','true');Object.assign(el.style,{position:'fixed',left:'0',top:'0',width:'1px',height:'1px',opacity:'0.01',fontSize:'16px'});document.body.appendChild(el);}
  selectCopyText(el);
  let ok=false;try{ok=!!document.execCommand('copy');}catch(e){}
  if(!field){el.remove();try{previous&&previous.focus({preventScroll:true});}catch(e){}}
  return ok;
}
async function writeClipboardText(text,field,legacyFirst=false){
  if(legacyFirst&&legacyCopyText(text,field))return true;
  try{if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){await navigator.clipboard.writeText(text);return true;}}catch(e){}
  return legacyFirst?false:legacyCopyText(text,field);
}
async function copyResultText(text,label,event){
  if(!text)return false;
  const done=()=>{toast(label+' 복사 완료. 밴드에 붙여 넣어 주세요.');if(event)trackAction(event);};
  if(await writeClipboardText(text)){done();return true;}
  const sh=sheet('결과 복사',`<p class="tiny dim" data-copy-status role="status">자동 복사가 차단되었습니다. 복사를 다시 누르거나 아래 내용을 길게 눌러 복사해 주세요.</p><textarea class="share-text" readonly aria-label="복사할 내용">${esc(text)}</textarea><div class="result-actions"><button class="btn sm" data-copy-retry>다시 복사</button><button class="btn ghost sm" data-copy-select>전체 선택</button></div>`);
  const el=sh.querySelector('textarea');selectCopyText(el);
  sh.querySelector('[data-copy-select]').onclick=()=>selectCopyText(el);
  sh.querySelector('[data-copy-retry]').onclick=async()=>{
    if(await writeClipboardText(text,el,true)){sh.querySelector('[data-copy-status]').textContent='복사했습니다. 밴드에 붙여 넣어 주세요.';done();}
    else{selectCopyText(el);sh.querySelector('[data-copy-status]').textContent='복사가 차단되어 있습니다. 선택된 내용을 길게 눌러 복사해 주세요.';}
  };
  el.addEventListener('copy',()=>{if(event)trackAction(event);});
  return false;
}
async function shareResult(route,native=false){
  const text=native?shareResultText(route):bandCommentText(route);
  if(!text){toast('복사할 모닝 경기 결과가 없습니다.',1);return false;}

    catch(e){if(e&&e.name==='AbortError') return false;}

}

/* 원시 URL, 이름, 선수 ID, 경기 내용은 이용 이벤트에 넣지 않는다. */
const ACTION_NAMES=['landing','name_select','result_view','player_detail','round_view','share_copy','share_native','missing_copy','save_success','analysis_view'];
function visitSource(){
  try{
    const q=new URL(window.location.href).searchParams;
    if(['band','naver_band'].includes((q.get('src')||q.get('utm_source')||'').toLowerCase())) return 'band';
    const ref=document.referrer?new URL(document.referrer):null;
    if(ref&&/(^|\.)band\.(us|com)$/i.test(ref.hostname)) return 'band';
    return ref&&ref.origin!==window.location.origin?'other':'direct';
  }catch(e){return 'direct';}
}
const entrySource=visitSource();
let actionQueue=Promise.resolve();
const actionSeen=new Map();
function trackAction(name,opts={}){
  if(!S.ready||!visitTrackingAllowed()||isAdmin()||!ACTION_NAMES.includes(name)) return Promise.resolve(false);
  const day=today(),source=entrySource,key=day+'|'+name+'|'+(opts.target||'');
  const now=Date.now();
  if(now-(actionSeen.get(key)||0)<VISIT_THROTTLE_MS) return Promise.resolve(false);
  actionSeen.set(key,now);
  actionQueue=actionQueue.catch(()=>false).then(async()=>{
    if(isAdmin()||!visitTrackingAllowed()) return false;
    const path=`engagement/${day}/${getVisitorId()}`;
    const rec=(await visitRead(path))||{};
    const events={...(rec.events||{})},sources={...(rec.sources||{})};
    events[name]=(+events[name]||0)+1;
    if(name==='landing') sources[source]=(+sources[source]||0)+1;
    const stamp=new Date().toISOString();
    const ok=await visitPatch({[path]:{firstAt:rec.firstAt||stamp,lastAt:stamp,events,sources}});
    if(!ok)actionSeen.delete(key);
    return ok;
  }).catch(()=>{actionSeen.delete(key);return false;});
  return actionQueue;
}

function dataSig(){
  let h=0;
  for(const m of S.matches){ const k=m.id+(m.rev||0)+(m.void?'v':''); for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; }
  for(const p of S.players){ const k=p.id+p.bu+JSON.stringify(p.buHist||[])+(p.active===false?'0':'1')+(p.name||''); for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; }
  return S.matches.length+':'+S.players.length+':'+h+':'+JSON.stringify(st());
}

async function doLogin(){
  const id=S.loginId||'', pin=($('#lpin').value||'').trim();

  const p=P(id); if(!p) return;
  if(!p.pinHash){                                  // 관리자가 만들어 둔 계정 넘겨받기
    if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
    const hash=await sha(pin);
    const ok=await savePlayers(map=>{const x=map.get(id); if(x)x.pinHash=hash;});
    if(!ok) return toast('설정에 실패했습니다. 다시 시도해주세요.',1);
    audit('PIN 설정', p.name);
  } else if(p.pinHash!==await sha(pin)) return toast('PIN이 맞지 않습니다.',1);
  S.me=P(id); await sSet(KEY.session,{playerId:id, at:Date.now()},false); localSet(VIEWING_KEY,id); goResults({player:id});
  const n=pendingForMe().length;
  toast(n ? `${S.me.name}님 반갑습니다. 확인할 경기가 ${n}건 있습니다.` : `${S.me.name}님 반갑습니다.`);
}
async function doJoin(){
  const name=($('#jname').value||'').trim();

  if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
  const p={ id:uid('p'), name, bu:+$('#jbu').value, hand:$('#jhand').value, rubber:$('#jrub').value,

/* 회원은 어제까지만 입력할 수 있다. 며칠 지난 기억으로 넣으면 서로 안 맞는 경우가 많아서다.

const minEntryDate = ()=> isAdmin() ? '' : dayAgo(1);
const dateOK = d => !!d && d<=today() && (isAdmin() || d>=dayAgo(1));
const shiftDate = (d,n)=>{ const [y,m,dd]=d.split('-').map(Number);
  const x=new Date(y,m-1,dd+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dateLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  const wk=['일','월','화','수','목','금','토'][new Date(y,m-1,dd).getDay()];
  const rel = d===today()?' · 오늘' : d===dayAgo(1)?' · 어제' : '';
  /* 해가 바뀌면 같은 날짜가 또 생긴다. 올해가 아니면 연도를 앞에 붙인다 */
  const yr = y===+today().slice(0,4) ? '' : `'${String(y).slice(2)} `;
  return `${yr}${m}월 ${dd}일 (${wk})${rel}`;
}
/* 화살표로도 바꾸고 달력으로도 고를 수 있게 둘 다 둔다 — 기기에 따라 달력이 안 열리는 경우가 있어서다 */
function dateField(id, val){
  /* 달력 입력창은 숨겨두고 화살표로 조작한다. 가운데 날짜를 누르면 달력이 뜨는 기기에서는 달력도 열린다. */
  return `<div class="field" style="position:relative">
    <div class="daterow">
      <button data-ds="-1" ${dateOK(shiftDate(val,-1))?'':'disabled'}>‹</button>
      <button class="dlab" data-dpick>${dateLabel(val)}</button>
      <button data-ds="1" ${dateOK(shiftDate(val,1))?'':'disabled'}>›</button>
    </div>
    <input type="date" id="${id}" value="${val}" max="${today()}" min="${minEntryDate()}"
           style="position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;padding:0;border:none">
    <p class="tiny dim" style="margin:7px 2px 0">${isAdmin()?'관리자는 지난 날짜도 넣을 수 있습니다.':'오늘과 어제까지 입력할 수 있습니다. 더 지난 경기는 관리자에게 요청하세요.'}</p>
  </div>`;
}
function bindDateField(id, get, apply){
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
    const nd=shiftDate(get(), +b.dataset.ds);
    if(dateOK(nd)) apply(nd);
  });
  const el=$('#'+id); if(!el) return;
  const pick=document.querySelector('[data-dpick]');
  if(pick) pick.onclick=()=>{ try{ el.showPicker ? el.showPicker() : el.focus(); }catch(e){} };
  el.onchange=e=>{ const v=e.target.value;
    if(!v){ e.target.value=get(); return; }
    if(!dateOK(v)){ e.target.value=get(); return toast('입력할 수 없는 날짜입니다.',1); }
    apply(v);
  };
}

/* 'A조: 홍길동, 김철수' 형태를 읽어 참가자와 조를 한 번에 정한다 */
function parseRoster(text, lg){
  const out=[]; const miss=[]; let g='A';
  const seenG={};
  let stop=false, first=true;
  for(const raw of String(text||'').split(/\n+/)){
    let line=raw.trim(); if(!line) continue;
    /* 첫 줄이 '점사모 참석' 같은 제목이면 건너뛴다 — 번호도 @도 없고 아는 이름도 없을 때 */
    if(first){
      first=false;
      const looksTitle = !/^\d/.test(line) && !line.includes('@') && !/조\s*[:：]/.test(line)
        && !line.split(/[\s,，/·、]+/).some(w=>matchPlayerByName(w.replace(/\([^)]*\)/,'')));
      if(looksTitle) continue;
    }
    /* '==이하 대기==' 아래는 참가자가 아니다 */
    if(/대기/.test(line) && /^[=\-\s]*[^=]*[=\-\s]*$/.test(line) && /[=\-]/.test(line)){ stop=true; continue; }
    if(stop) continue;
    if(/^[=\-\s]+$/.test(line)) continue;
    if(/^[=\-]+.*[=\-]+$/.test(line) && !/[가-힣]{2,}/.test(line.replace(/[=\-\s]/g,''))) continue;
    if(/^[=\-]*\s*이하\s*확정\s*[=\-]*$/.test(line)) continue;
    /* 앞머리가 조 이름이면 그 조로 */
    const m=line.match(/^([A-Za-z가-힣]{1,3})\s*조\s*[:：]?\s*(.*)$/);
    if(m){ g=m[1].toUpperCase(); line=m[2]; }
    if(!line) continue;
    /* 번호 매김을 먼저 떼어낸다 — '1.홍길동' '15,김현석' */
    line=line.replace(/^\s*\d+\s*[.,)、]\s*/, '');
    if(!line) continue;
    /* 괄호 안 메모는 부수만 뽑고 나머지는 버린다 — 이름(5부 운영진) */
    const parts=[];

function parseGridText(text, ids){
  const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const rows=[]; const miss=[];
  let seat=0;                                    // 이름 없는 줄은 지금 순서대로 배정한다
  for(const line of lines){
    /* 줄 앞머리의 한글 이름 — 부수 괄호가 붙어 있어도 잡는다 */
    const nameM=line.match(/^\s*\d{0,2}\s*[.,)、]?\s*([가-힣]{2,5})/);
    let nm=null, body=line, bu=null, hb=null;

      const pm=body.match(/^\s*\(([^)]*)\)/);
      if(pm){
        const note=pm[1];
        body=body.slice(pm[0].length);
        const bm=note.match(/(\d+)\s*부/);
        if(bm) bu=+bm[1];
        const hm=note.match(/\+\s*(\d+)/);
        if(hm) hb=+hm[1];
      }
    } else {
      /* 숫자만 있는 줄 — 앞머리 번호가 있으면 떼어낸다 */
      body=line.replace(/^\s*\d{1,2}\s*[.,)、]\s*/, '');

    const cells=(body.match(/[0-9]|[xX✕×]|[-–—·.]/g)||[]);
    if(!cells.length) continue;
    let id=null;
    if(nm){
      const p=matchPlayerByName(nm);
      if(!p){ miss.push({name:nm, bu}); continue; }
      id=p.id;
    } else {
      id=(ids||[])[seat];
      if(!id) continue;
    }
    seat++;
    const row={id, cells};
    if(bu!=null && bu>=BU_MIN && bu<=BU_MAX) row.bu=bu;
    if(hb!=null) row.hb=hb;
    rows.push(row);

}

  /* sets[a|b] = { [id]: 딴 세트 수 }  ·  '-' 면 성사되지 않은 경기 */
  gridE.sets = gridE.sets || {};
  gridE.wins = gridE.wins || {};

  const winOnlyOf=(a,b)=>{ const w=(gridE.wins&&gridE.wins[key(a,b)]) || savedWin[key(a,b)] || null;

  const ids=gridE.ids;
  /* 조별이면 같은 조끼리만, 순위 결정전은 조를 넘나든다 */
  const gOf=id=>gridE.grp[id]||'A';
  const groups=useGrp ? [...new Set(ids.map(gOf))].sort() : ['A'];
  const inGroup=g=>ids.filter(id=>!useGrp || gOf(id)===g);
  const pairsFor=g=>{ const list=inGroup(g), out=[];
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++) out.push([list[i],list[j]]);
    return out; };
  /* 순위 결정전 — 조별 순위가 같은 사람끼리.
     조별 순위도 미리보기·저장 기록과 같은 규칙(liveRank)으로 가린다 */
  const rankIn=g=>{
    /* 손으로 정한 조 순위가 있으면 그것부터 — 순위결정전 대진도 이 순서를 따른다 */

      const inG=inGroup(g);
      const out=ov.filter(id=>inG.includes(id));

      return out;
    }
    return liveRank(inGroup(g), getR, setOf).order;
  };
  /* 순위 결정전 — 손으로 짠 대진(koOv)이 있으면 그걸 쓴다.
     조 인원이 안 맞아 같은 조 5·6위가 붙는 식의 변형도 여기서 소화한다.
     같은 조 대진은 조별 경기와 별개의 판이라 본선 표시(placement)를 달아 저장한다. */
  const savedKoW={};
  roundMatches.filter(m=>m.br && m.br.kind==='placement').forEach(m=>{
    savedKoW[key(m.aId,m.bId)]=winnerOf(m);

  if(gridE._koRd!==rd){
    gridE._koRd=rd; gridE.kowins={}; gridE.koSel=null; gridE.koEdit=false;
    const savedKo=roundMatches.filter(m=>m.br && m.br.kind==='placement')
      .sort((a,b)=>((a.br&&a.br.order)||0)-((b.br&&b.br.order)||0));
    gridE.koOv = savedKo.length ? savedKo.map((m,i)=>({rank:(m.br&&m.br.order)||i+1, a:m.aId, b:m.bId})) : null;
  }
  gridE.kowins=gridE.kowins||{};
  const koPairs=()=>{
    if(fmt!=='groupko') return [];
    if(gridE.koOv) return gridE.koOv.filter(x=>P(x.a)&&P(x.b));
    if(groups.length<2) return [];
    const cols=groups.map(rankIn);
    const n=Math.min(...cols.map(c=>c.length));
    return Array.from({length:n},(_,k)=>({rank:k+1, a:cols[0][k], b:cols[1][k]}))
      .filter(x=>x.a&&x.b);
  };
  const kos=koPairs();
  const koSameG=x=>gOf(x.a)===gOf(x.b);
  const koWinOf=x=>{ const k=key(x.a,x.b);
    return gridE.kowins[k] || savedKoW[k] || (koSameG(x)?null:getR(x.a,x.b)); };
  const koSavedOf=x=>{ const k=key(x.a,x.b);
    if(editSaved) return false;
    if(savedKoW[k]!=null) return true;
    return koSameG(x) ? false : isSaved(x.a,x.b); };
  const kos2=kos.map(x=>({...x, w:koWinOf(x), lock:koSavedOf(x)}));
  const leaguePairs=groups.flatMap(pairsFor);
  const need=leaguePairs.length + kos.length;

    }});
  kos.forEach(x=>{
    const w=koWinOf(x); if(!w) return;
    const k=key(x.a,x.b);
    if(!editSaved && savedKoW[k]!=null) return;                               // 이미 저장된 순위전
    if(!editSaved && !koSameG(x) && isSaved(x.a,x.b) && !gridE.kowins[k]) return; // 예전 방식으로 저장된 교차 대진
    newOnes.push({a:x.a, b:x.b, w, sa:null, sb:null,

  if(fmtUsesManual(fmt)){
    const savedNode=editSaved ? new Set() : new Set(savedBr.map(m=>m.br&&m.br.node).filter(Boolean));
    bracketData(ensureBracket(ids)).matches.forEach(r=>{
      if(!savedNode.has(r.br.node)) newOnes.push(r);
    });

  /* 성사되지 않은 경기('-')도 채운 것으로 친다 */
  const doneN=leaguePairs.filter(([a,b])=>getR(a,b) || setOf(a,b)==='-').length
            + kos2.filter(x=>x.w).length;
  const canSave = editSaved || !!newOnes.length;
  const saveText = editSaved
    ? `회차 수정 저장 (${newOnes.length}경기)`

  const roundEditButtons = isAdmin()&&roundMatches.length ? ` · <button class="btn ghost sm" id="gEditRound"
          style="padding:3px 9px;font-size:11px">${editSaved?'수정 취소':'회차 수정'}</button> · <button class="btn ghost sm" id="gMoveRd"
          style="padding:3px 9px;font-size:11px">회차 날짜 옮기기</button>` : '';

  $('#view').innerHTML = `
    ${pageHeader('경기 입력','경기한 날짜와 상대를 선택해 결과를 입력하세요.','add')}
    ${addLgBar()}
    <div class="card">
      ${rdNavHTML(lg, rd)}

        <span class="tiny dim">참가자${Array.isArray(savedRound.ord)&&savedRound.ord.length?` ${savedRound.ord.length}명`:''}·조
          편성·대진 배치를 불러와 경기를 추가하거나 고칠 수 있습니다.

        <button class="btn ghost sm" id="gLoadSaved" style="margin-left:auto">불러오기</button>
        <button class="btn ghost sm" id="gEditSaved" style="margin-left:6px">수정하기</button>

      </div>` : ''}
      ${editSaved ? `<div class="notice warn" style="margin:0 0 10px"><b>회차 수정 모드</b><br>

      </div>
      ${gridE.step==='who' ? gridWhoHTML(pool, lg, useGrp)
        : gridBoardHTML(groups, inGroup, getR, isSaved, useGrp, kos2, rankIn, cellVal,
            new Set(checkGrid(ids, gridE.sets).map(x=>x.a<x.b?x.a+'|'+x.b:x.b+'|'+x.a)), fmt, savedBr)}`}
    </div>

    ${gridE.step==='grid' && !teamMode ? conflictHTML(checkGrid(ids, gridE.sets))
      + (fmt==='team' ? teamGridStandHTML(getR, ids) : gridStandHTML(groups, inGroup, getR, useGrp, setOf))
      + rankAdjustHTML()
      + `<button class="btn" id="gSave" ${canSave?'':'disabled'}>
        ${saveText}</button>
            <p class="tiny dim" style="margin:9px 2px 0">${editSaved?'수정 모드에서는 저장된 칸도 현재 화면 값으로 다시 저장됩니다. 승자가 없는 기존 경기는 삭제됩니다.':'이미 저장된 칸은 자물쇠로 표시되고 다시 저장되지 않습니다.'}

  const changeGridRound=date=>{

  };

  const rdSel=$('#gRdSel');

  if($('#gPickGo')) $('#gPickGo').onclick=()=>{

    if(!v) return toast('날짜를 고르세요.',1);

  };
  if($('#gPickX')) $('#gPickX').onclick=()=>{ gridE.datePick=false; viewAddGrid(lg); };
  /* 순위 직접 조정 — 조별 형식이면 조 단위로 */
  if($('#gRankInit')) $('#gRankInit').onclick=()=>{
    const byG={};
    (useGrp?groups:['A']).forEach(g=>{
      byG[g]=liveRank(useGrp?inGroup(g):gridE.ids.slice(), getR, setOf).order.filter(id=>P(id));
    });
    if(!Object.values(byG).some(a=>a.length)) return toast('순위를 매길 참가자가 없습니다.',1);
    gridE.rankOrders=byG;
    viewAddGrid(lg, window.scrollY);
  };
  const rkSwap=(g,i,d)=>{ const a=((gridE.rankOrders||{})[g]||[]).slice(); const j=i+d;
    if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]];
    gridE.rankOrders={...gridE.rankOrders, [g]:a}; viewAddGrid(lg, window.scrollY); };
  document.querySelectorAll('[data-rkup]').forEach(b=>b.onclick=()=>{
    const [g,i]=b.dataset.rkup.split('|'); rkSwap(g,+i,-1); });
  document.querySelectorAll('[data-rkdn]').forEach(b=>b.onclick=()=>{
    const [g,i]=b.dataset.rkdn.split('|'); rkSwap(g,+i,1); });
  if($('#gRankSave')) $('#gRankSave').onclick=async()=>{
    const rank={};
    Object.values(gridE.rankOrders||{}).forEach(a=>a.forEach((id,i)=>{ rank[id]=i+1; }));
    if(!Object.keys(rank).length) return toast('저장할 순위가 없습니다.',1);
    const ok=await saveRdMeta(lg, rd, gridE.tbu, gridE.hb, {rank});
    if(!ok) return toast('저장하지 못했습니다.',1);
    audit('순위 조정', `${lgName(lg)} ${roundLabel(rd)} · ${Object.keys(rank).length}명`);

  };
  if($('#gRankClear')) $('#gRankClear').onclick=async()=>{

    audit('순위 조정 해제', `${lgName(lg)} ${roundLabel(rd)}`);
    gridE._rkRd=null; gridE.rankOrders=null; recompute(); viewAddGrid(lg, window.scrollY); toast('자동 순위로 되돌렸습니다.');
  };
  if($('#gLoadSaved')) $('#gLoadSaved').onclick=()=>{
    gridE.loadSaved=true;

  };
  /* 팀 편성·팀 대진표 (팀 단위 회차) */
  document.querySelectorAll('[data-tsize]').forEach(b=>b.onclick=()=>{ gridE.psize=+b.dataset.tsize; viewAddGrid(lg, window.scrollY); });
  if($('#gTAuto')) $('#gTAuto').onclick=()=>{
    const ids2=gridE.ids.slice();
    if(ids2.length<4) return toast('참가자가 4명은 있어야 팀을 짭니다.',1);
    for(let i=ids2.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids2[i],ids2[j]]=[ids2[j],ids2[i]]; }
    ids2.sort((a,b)=>roundBu(a)-roundBu(b));
    const T=Math.max(2, Math.ceil(ids2.length/(gridE.psize||2)));
    /* 부수 순 뱀 배치 — 팀 전력이 고르게 */

  };

  document.querySelectorAll('[data-tset]').forEach(el=>{
    const [x,y]=el.dataset.tset.split('|');

      const k2=x<y?x+'|'+y:y+'|'+x;
      const raw=String(el.value||'').trim();

        const n=Math.max(0, Math.min(9, parseInt(raw,10)||0));
        cur[a]=n;
        /* 상대 칸이 비어 있으면 0으로 채워 승패가 정해지게 한다 */
        if(cur[b2]==null) cur[b2]=0;
        gridE.sets[k]=cur;
        delete gridE.wins[k];
      }
      viewAddGrid(lg, window.scrollY);
    };
    /* 한 글자 넣으면 바로 다음 칸으로 — 사진 보고 죽 옮겨 적을 수 있게 */
    const hop=()=>{
      commit();
      setTimeout(()=>{
        const all=[...document.querySelectorAll('[data-gset]')].filter(x=>!x.disabled);
        const at=all.findIndex(x=>x.dataset.gset===el.dataset.gset);
        const nx=all[at+1];
        if(nx){ nx.focus(); try{ nx.select(); }catch(x){} }
      }, 0);
    };
    el.oninput=()=>{
      const v=String(el.value||'').trim();
      /* 숫자 한 글자나 '-' 를 넣으면 그대로 다음 칸으로 넘어간다 */
      if(/^[0-9]$/.test(v) || v==='-' || v==='x' || v==='X' || v==='w' || v==='W' || v==='l' || v==='L') hop();
    };
    el.onchange=commit;
    el.onfocus=()=>{ try{ el.select(); }catch(x){} };
    el.onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); hop(); return; }
      if(e.key==='Backspace' && !el.value){
        e.preventDefault();
        const all=[...document.querySelectorAll('[data-gset]')].filter(x=>!x.disabled);
        const at=all.findIndex(x=>x.dataset.gset===el.dataset.gset);
        const pv=all[at-1];
        if(pv){ pv.focus(); try{ pv.select(); }catch(x){} }
      }
    };
  });
  const brRef=s=>{
    const [kind,i0]=String(s||'').split('|');
    if(kind!=='main' && kind!=='low') return null;
    const brk=ensureBracket(gridE.ids);
    const i=+i0, arr=kind==='low'?brk.low:brk.main;
    return (i>=0 && i<arr.length) ? {brk, kind, i, arr} : null;
  };
  const brClearWins=()=>{ if(gridE.brk) gridE.brk.win={}; };
  const brPlace=(toRef, id, fromRef)=>{
    const to=brRef(toRef); if(!to || !id) return;
    const from=fromRef ? brRef(fromRef) : null;
    if(from && from.arr[from.i]===id){
      const prev=to.arr[to.i]||'';
      to.arr[to.i]=id;
      from.arr[from.i]=prev;
    }else{
      const prev=to.arr[to.i]||'';
      const old=to.arr.indexOf(id);
      if(old>=0 && old!==to.i) to.arr[old]=prev;
      to.arr[to.i]=id;
    }
    gridE.brk.sel=''; brClearWins(); viewAddGrid(lg, window.scrollY);
  };
  const brFill=(mode)=>{
    const brk=ensureBracket(gridE.ids);
    let list=gridE.ids.slice();
    if(mode==='rank' && groups.length>=2){
      const ranked=groups.slice().sort().map(g=>rankIn(g));
      const max=Math.max(...ranked.map(x=>x.length));
      list=[];
      for(let i=0;i<max;i++) ranked.forEach(col=>{ if(col[i]) list.push(col[i]); });
    }
    brk.main=Array(16).fill('');
    list.slice(0,16).forEach((id,i)=>{ brk.main[i]=id; });
    brk.low=Array(4).fill('');
    list.slice(-4).forEach((id,i)=>{ brk.low[i]=id; });
    brk.win={}; brk.sel=''; gridE.brk=brk; gridE.tab='BR';
    viewAddGrid(lg, window.scrollY);
  };
  const brSaveLayout=async()=>{
    const fmt2=gridE.rfmt || rdFmt(lg, rd);
    const ok=await saveRdMeta(lg, rd, gridE.tbu, gridE.hb, {
      fmt:fmt2,
      grp:fmtUsesGroups(fmt2)?{...gridE.grp}:{},
      ord:gridE.ids.slice(),                       // 표 순서는 방식과 무관하게 남긴다
      brk:fmtUsesManual(fmt2)?cleanBracket(gridE.brk):null
    });
    if(ok) toast('대진표 배치를 저장했습니다.');
    else errorSheet('저장하지 못했습니다.', '대진표 배치를 저장하는 중 문제가 생겼습니다.');
  };
  if($('#gBrOrder')) $('#gBrOrder').onclick=()=>brFill('order');
  if($('#gBrSeed')) $('#gBrSeed').onclick=()=>brFill('rank');
  if($('#gBrClear')) $('#gBrClear').onclick=()=>{ gridE.brk=blankBracket(); viewAddGrid(lg, window.scrollY); };
  if($('#gBrSave')) $('#gBrSave').onclick=brSaveLayout;
  document.querySelectorAll('[data-bpool]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.bpool;
    const brk=ensureBracket(gridE.ids);
    brk.sel = brk.sel===id ? '' : id;
    gridE.brk=brk; gridE.tab='BR'; viewAddGrid(lg, window.scrollY);
  });
  document.querySelectorAll('[data-bslot]').forEach(el=>{
    el.onclick=e=>{
      if(e.target.closest && e.target.closest('[data-bclr]')) return;
      const r=brRef(el.dataset.bslot); if(!r) return;
      const cur=r.arr[r.i], sel=gridE.brk&&gridE.brk.sel;

    el.ondragstart=e=>{

    el.ondragover=e=>{ e.preventDefault(); };
    el.ondrop=e=>{
      e.preventDefault();
      const from=(e.dataTransfer&&e.dataTransfer.getData('text/plain')) || gridE.bdrag;
      const r=brRef(from); if(!r || !r.arr[r.i] || from===el.dataset.bslot) return;
      brPlace(el.dataset.bslot, r.arr[r.i], from);
    };
  });
  document.querySelectorAll('[data-bclr]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const r=brRef(b.dataset.bclr); if(!r) return;
    r.arr[r.i]=''; gridE.brk.sel=''; brClearWins(); viewAddGrid(lg, window.scrollY);
  });
  document.querySelectorAll('[data-bwin]').forEach(b=>b.onclick=()=>{
    const [key,id]=b.dataset.bwin.split('|');
    const brk=ensureBracket(gridE.ids);
    brk.win[key] = brk.win[key]===id ? '' : id;
    if(!brk.win[key]) delete brk.win[key];
    gridE.brk=brk; gridE.tab='BR'; viewAddGrid(lg, window.scrollY);
  });
  if($('#gCopyBrRank')) $('#gCopyBrRank').onclick=()=>{
    const s=bracketData(ensureBracket(gridE.ids)).summary;
    const lines=[
      ['1위', [s.first]],
      ['2위', [s.second]],
      ['공동 3위', s.thirds],
      ['하위 1위', [s.lowFirst]]
    ].filter(x=>x[1].filter(Boolean).length)
      .map(([lab,ids])=>`${lab} ${ids.filter(Boolean).map(nameOf).join(', ')}`);
    copyText(`${lgName(lg)} ${roundLabel(rd)} 최종 결과\n${lines.join('\n')}`);
  };
  const brRow=i=>{ gridE.br=gridE.br||[]; return gridE.br[i]; };
  const addBr=(kind, a, b, label)=>{
    gridE.br=gridE.br||[];
    gridE.br.push({kind:kind||'extra', label:label||'', a:a||'', b:b||'', sa:'', sb:'', w:''});
    gridE.tab='BR'; viewAddGrid(lg, window.scrollY);
  };
  if($('#gBrAdd')) $('#gBrAdd').onclick=()=>addBr('extra');
  if($('#gBrFinal')) $('#gBrFinal').onclick=()=>addBr('final');
  if($('#gBrRev')) $('#gBrRev').onclick=()=>addBr('revive');
  if($('#gBrTop4')) $('#gBrTop4').onclick=()=>{
    const gs=groups.slice().sort();
    if(gs.length<2) return;
    const A=rankIn(gs[0]), B=rankIn(gs[1]);
    if(A[0]&&B[1]) gridE.br.push({kind:'semi', label:'4강 1경기', a:A[0], b:B[1], sa:'', sb:'', w:''});
    if(B[0]&&A[1]) gridE.br.push({kind:'semi', label:'4강 2경기', a:B[0], b:A[1], sa:'', sb:'', w:''});
    gridE.tab='BR'; viewAddGrid(lg, window.scrollY);
  };
  document.querySelectorAll('[data-brrm]').forEach(b=>b.onclick=()=>{
    gridE.br.splice(+b.dataset.brrm,1); viewAddGrid(lg, window.scrollY);
  });
  document.querySelectorAll('[data-brkind]').forEach(el=>el.onchange=()=>{
    const r=brRow(+el.dataset.brkind); if(r) r.kind=el.value;
  });
  document.querySelectorAll('[data-brlabel]').forEach(el=>el.oninput=()=>{
    const r=brRow(+el.dataset.brlabel); if(r) r.label=el.value;
  });
  document.querySelectorAll('[data-bra],[data-brb]').forEach(el=>el.onchange=()=>{
    const i=+(el.dataset.bra ?? el.dataset.brb), r=brRow(i); if(!r) return;
    if(el.dataset.bra!=null) r.a=el.value; else r.b=el.value;
    if(r.w && r.w!==r.a && r.w!==r.b) r.w='';
    viewAddGrid(lg, window.scrollY);
  });
  const inferBrWinner=i=>{
    const r=brRow(i); if(!r) return;
    const sa=+r.sa||0, sb=+r.sb||0;
    if(sa!==sb && r.a && r.b) r.w = sa>sb ? r.a : r.b;
  };
  document.querySelectorAll('[data-brsa],[data-brsb]').forEach(el=>el.oninput=()=>{
    const i=+(el.dataset.brsa ?? el.dataset.brsb), r=brRow(i); if(!r) return;
    const v=String(el.value||'').trim();
    if(!/^\d?$/.test(v)){ el.value=''; return; }
    if(el.dataset.brsa!=null) r.sa=v; else r.sb=v;
    inferBrWinner(i);
  });
  document.querySelectorAll('[data-brwin]').forEach(b=>b.onclick=()=>{
    const [i0,w]=b.dataset.brwin.split('|'), i=+i0, r=brRow(i);

  });
  if($('#gSave')) $('#gSave').onclick=()=>{
    if(teamMode) return saveTeamRound(lg, rd);
    const bad=checkGrid(gridE.ids, gridE.sets);
    if(bad.length && !confirm(`앞뒤가 안 맞는 칸이 ${bad.length}개 있습니다.\n그래도 저장할까요?`)) return;
    if(gridE.editSaved && isAdmin()) replaceGridRound(lg, rd, newOnes);
    else saveGrid(lg, rd, newOnes);
  };
  if(_y!=null){

    const w2=document.querySelector('.ctwrap');
    if(w2 && _x) w2.scrollLeft=_x;
  }
  if($('#gCopyRank')) $('#gCopyRank').onclick=()=>{
    const lines=[];
    kos2.forEach(x=>{ if(!x.w) return;                       // 같은 조 순위전 승자도 함께 반영된다
      lines.push(nameOf(x.w)); lines.push(nameOf(x.w===x.a?x.b:x.a)); });
    const txt=`${lgName(lg)} ${roundLabel(rd)} 최종순위\n`
      + lines.map((n,i)=>`${i+1}위 ${n}`).join('\n');
    copyText(txt);
  };
  bindMatchActions();
}
/* 팀 단위 회차 저장 — 팀 편성·팀 간 대진을 회차 메타(teamEvent)에 남긴다. 개인 경기는 만들지 않는다. */
async function saveTeamRound(lg, rd){
  if(!isAdmin()) return toast('관리자만 저장할 수 있습니다.',1);
  const letters=[...new Set(gridE.ids.map(id=>gridE.grp[id]||'A'))].sort();
  if(letters.length<2) return toast('팀이 2개는 있어야 합니다.',1);
  const tn=l=>(letters.indexOf(l)+1)+'팀';
  const teams=letters.map(l=>({name:tn(l), members:gridE.ids.filter(id=>(gridE.grp[id]||'A')===l)}));
  if(teams.some(t=>!t.members.length)) return toast('빈 팀이 있습니다. 팀 편성을 확인하세요.',1);
  const games=Object.entries(gridE.tsets||{}).map(([k,v])=>{
    const [x,y]=k.split('|');
    if(!letters.includes(x)||!letters.includes(y)) return null;
    if(v[x]==null && v[y]==null) return null;
    const as=+v[x]||0, bs=+v[y]||0;
    if(as===bs) return null;                       // 동점·미완성 칸은 저장하지 않는다
    return {a:tn(x), b:tn(y), as, bs, w: as>bs?tn(x):tn(y)};
  }).filter(Boolean);
  const prev=rdMeta(lg,rd)||{}, ev0=prev.teamEvent||{};
  const ev={ teams, date:gridE.date, rating: ev0.rating===true,
    format: ev0.format || `${teams.length}팀 ${gridE.psize||2}인 팀전` };
  if(ev0.title) ev.title=ev0.title;
  if(ev0.note) ev.note=ev0.note;
  if(ev0.source) ev.source=ev0.source;
  if(games.length) ev.games=games;
  else if((ev0.standings||[]).length) ev.standings=ev0.standings;   // 대진 없이 순위만 아는 회차는 유지
  const ok=await saveRdMeta(lg, rd, gridE.tbu, gridE.hb,
    {fmt:'team', date:gridE.date, ord:gridE.ids.slice(), grp:{...gridE.grp}, teamEvent:ev});
  if(!ok) return errorSheet('저장하지 못했습니다','팀전 기록을 저장하는 중 문제가 생겼습니다.');
  audit('팀전 기록', `${lgName(lg)} ${roundLabel(rd)} · ${teams.length}팀 ${games.length}대진`);
  gridE._teRd=null;                                 // 다시 열면 저장본 기준으로
  recompute(); render(); toast('팀전 기록을 저장했습니다.');
}
function gridRowsFromList(lg, rd, list){
  const setVal=v=>v==null || v==='' ? null : +v;
  return (list||[]).filter(x=>P(x.a)&&P(x.b)&&(x.w===x.a||x.w===x.b)).map((x,i)=>{
    const A=P(x.a), B=P(x.b);
    /* 이번 회차 입력 부수 → 저장된 회차 부수 → 경기일 기준 승급 이력 순으로 핸디를 잡는다 */
    const hd = handiForMatch(x.a, x.b, gridE.date, lg, rd, {tbu:gridE.tbu, hb:gridE.hb});
    const br=x.br ? {...x.br} : null;
    return { id:uid('m'), rev:1, date:gridE.date, lg, rd,
      aId:x.a, bId:x.b, winnerId:x.w,
      aSets:setVal(x.sa), bSets:setVal(x.sb),
      handi:hd, note:br?brLabel(br):'', br,
      exp:null,
      enteredBy:(S.me&&S.me.id)||'system', enteredAt:new Date(Date.now()+i).toISOString(),
      confirmedBy:[x.a,x.b], status:'confirmed', void:false };
  });
}
async function replaceGridRound(lg, rd, list){
  if(!isAdmin()) return toast('관리자만 수정할 수 있습니다.',1);
  const fmt=gridE.rfmt || rdFmt(lg, rd);
  const rows=gridRowsFromList(lg, rd, list);
  const old=(S.matches||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd);
  if(old.length && !rows.length && !confirm('이 회차의 저장된 경기를 모두 지울까요?')) return;
  const before=S.matches.slice(), oldIds=new Set(old.map(m=>m.id));
  busyOn(`${roundLabel(rd)} 수정 저장 중`);
  let saved=rows, ok=true;
  try{
    if(FB){
      saved=await fbReplaceMatches([...oldIds], rows);
    }else{
      const touched=[...new Set([...old, ...rows].map(m=>KEY.shard(monthOf(m.date))))];
      for(const k of touched){
        const cur=(await sGet(k))||[];
        const map=new Map(cur.filter(m=>!oldIds.has(m.id)).map(m=>[m.id,m]));
        rows.filter(m=>KEY.shard(monthOf(m.date))===k).forEach(m=>map.set(m.id,m));
        if(!await sSet(k,[...map.values()])) throw new Error('저장 실패');
      }
    }
  }catch(e){ S.lastError=e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render();
    return errorSheet('수정하지 못했습니다.', '회차 경기 결과를 저장하는 중 문제가 생겼습니다.'); }
  const local=new Map(before.filter(m=>!oldIds.has(m.id)).map(m=>[m.id,m]));
  saved.forEach(m=>local.set(m.id,m));
  S.matches=[...local.values()];
  const metaOk=await saveRdMeta(lg, rd, gridE.tbu, gridE.hb, {
    fmt,
    grp:fmtUsesGroups(fmt)?{...gridE.grp}:{},
    ord:gridE.ids.slice(),
    brk:fmtUsesManual(fmt)?cleanBracket(gridE.brk):null
  });
  audit('회차 수정', `${lgName(lg)} ${roundLabel(rd)} · ${old.length}→${rows.length}경기`);
  gridE=null;
  recompute(); render();
  toast(metaOk ? `${rows.length}경기로 수정했습니다.` : '경기는 수정했지만 회차 배치 저장은 실패했습니다.');
}
async function saveGrid(lg, rd, list){
  if(!list.length) return;
  const fmt=gridE.rfmt || rdFmt(lg, rd);
  const rows=gridRowsFromList(lg, rd, list);
  const ok=await pushMatches(rows, `${rows.length}경기 저장 중…`);
  if(!ok) return errorSheet('저장하지 못했습니다','대진표를 저장하는 중 문제가 생겼습니다.');
  /* 이번 회차에만 쓰는 부수·보너스를 남겨 다시 열어도 유지되게 한다 */
  await saveRdMeta(lg, rd, gridE.tbu, gridE.hb, {
    fmt,
    grp:fmtUsesGroups(fmt)?{...gridE.grp}:{},
    ord:gridE.ids.slice(),
    brk:fmtUsesManual(fmt)?cleanBracket(gridE.brk):null
  });
  audit('대진표 입력', `${lgName(lg)} ${roundLabel(rd)} · ${rows.length}경기`);
  /* 저장 뒤에는 입력 버퍼를 통째로 버린다. 이어서 입력할 때는 저장된 회차 불러오기를 누른다. */
  gridE=null;
  recompute(); render();
  toast(`${rows.length}경기를 저장했습니다.`);
}
/* 회차 날짜 일괄 이동 — 잘못된 주차로 저장했을 때 관리자가 통째로 옮긴다 */
function moveRoundSheet(lg, rd){
  const ms=(S.matches||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd);
  if(!ms.length) return toast('이 회차에 저장된 경기가 없습니다.',1);
  const cur=ms[0].date;
  const sh=sheet('회차 날짜 옮기기', `
    <p class="tiny dim" style="margin:0 0 10px">${esc(lgName(lg))} <b>${esc(roundLabel(rd))}</b>에 저장된
      <b>${ms.length}경기</b>의 날짜를 한 번에 바꿉니다.</p>
    <div class="field"><label>새 날짜</label><input type="date" id="mvDate" value="${cur}"></div>
    <p class="tiny" id="mvHint" style="margin:0 0 10px;color:var(--mut)"></p>
    <p class="tiny dim" style="margin:0 0 12px">참가 부수·조 편성·토너먼트 배치도 새 회차로 함께 갑니다.
      옮긴 뒤 예상 승률과 Elo 증감은 새 경기 순서에 맞춰 자동으로 다시 계산됩니다.</p>
    <button class="btn" id="mvGo">옮기기</button>`);
  const dt=sh.querySelector('#mvDate'), hint=sh.querySelector('#mvHint'), go=sh.querySelector('#mvGo');
  const calc=()=>{
    const v=dt.value||cur;
    const nd=lgIsCup(lg)?weekDateOf(v, lg):v;
    const nrd=roundOf(nd, lg);
    const sameDate = nd===cur;
    hint.innerHTML = sameDate ? '지금과 같은 날짜입니다. 다른 날짜를 골라주세요.'
      : `${esc(fmtDate(nd))}로 저장되어 <b>${esc(roundLabel(nrd))}</b>가 됩니다.`;
    go.disabled = sameDate;
    go.textContent = sameDate ? '날짜가 그대로입니다' : `${ms.length}경기 옮기기`;
    return {nd, nrd};
  };
  dt.onchange=calc; dt.oninput=calc; calc();
  go.onclick=async()=>{
    const {nd, nrd}=calc(); if(nd===cur || S.busy) return;
    const meta=rdMeta(lg, rd)||{};
    const updates=ms.map(m=>{
      const hd=handiForMatch(m.aId, m.bId, nd, lg, nrd, {tbu:meta.bu, hb:meta.hb});
      return {...m, date:nd, rd:nrd, handi:hd, exp:null, rev:(m.rev||0)+1};
    });
    const ok=await pushMatches(updates, `${updates.length}경기 옮기는 중…`);
    if(!ok) return errorSheet('옮기지 못했습니다','경기를 저장하는 중 문제가 생겼습니다.');
    /* 회차 메타(부수·조·대진 배치)도 함께 — 새 회차에 이미 있으면 덮지 않는다 */
    const rounds={...((S.meta&&S.meta.rounds)||{})};
    const oldK=rdKey(lg,rd), newK=rdKey(lg,nrd);
    if(rounds[oldK] && !rounds[newK]){
      rounds[newK]=rounds[oldK]; delete rounds[oldK];
      S.meta={...S.meta, rounds};
      await sSet(KEY.meta, S.meta);
    }
    audit('회차 날짜 이동', `${lgName(lg)} ${roundLabel(rd)} → ${roundLabel(nrd)} · ${updates.length}경기`);
    if(sh.close) sh.close(); else sh.remove();
    if(gridE){ gridE.date=nd; gridE._rd=null; }
    recompute(); render();
    toast(`${updates.length}경기를 ${roundLabel(nrd)}로 옮겼습니다.`);
  };
}
/* 대회형 리그 입력 — 날짜 대신 회차로 고른다.
   빨리모이는 화요일, 루키리그는 목요일, 그 밖 대회형은 금요일처럼 리그 운영 요일에 맞춰 저장한다.
   경기마다 실제 날짜가 달라도 한 날짜로 몰아 넣는다 — 매일 나눠 넣기는 번거롭다. */
function cupRoundOffset(lg){
  const L=leagues().find(x=>x.id===lg)||{};
  const s=(String(lg||'')+' '+String(L.name||'')).toLowerCase();
  if(/quickmeet|빨리모이/.test(s)) return 1;         // 월요일 + 1 = 화요일
  return /rookie|루키/.test(s) ? 3 : 4;             // 월요일 + 3 = 목요일, +4 = 금요일
}
function weekDateOf(date, lg){
  const [Y,M,D]=String(date).split('-').map(Number);
  const d=new Date(Y,M-1,D);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+cupRoundOffset(lg));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* 회차 목록 재료 — 앞뒤 8주와 이미 기록이 있는 회차를 합친다 */
function rdNavData(lg){
  /* 기록이 있는 회차만 나열한다 — 빈 주차를 다 늘어놓지 않는다.
     새 입력을 위해 지난주·이번 주·다음 주와 지금 보고 있는 주만 함께 둔다. */
  const opts=[];
  const push=d=>{ if(d && !opts.some(o=>roundOf(o,lg)===roundOf(d,lg))) opts.push(weekDateOf(d, lg)); };
  push(gridE.date);
  push(shiftDate(today(),-7)); push(today()); push(shiftDate(today(),7));
  roundsOf(lg).forEach(r=>{
    const m=(S.matches||[]).find(x=>!x.void && lgOf(x)===lg && rdOf(x)===r);
    if(m) push(m.date);
  });
  metaRoundsOf(lg).forEach(r=>{
    const row=rdMeta(lg,r)||{};
    const d=row.date || (row.teamEvent&&row.teamEvent.date);
    if(d) push(d);
  });
  const uniq=[...new Set(opts.map(o=>roundOf(o,lg)))].sort();
  const dateOf={}; opts.forEach(o=>{ const r2=roundOf(o,lg); if(!dateOf[r2]) dateOf[r2]=o; });
  const cnt={};
  (S.matches||[]).filter(m=>!m.void && lgOf(m)===lg).forEach(m=>{ const r2=rdOf(m); cnt[r2]=(cnt[r2]||0)+1; });
  /* 팀 단위 회차 — 팀 간 대진의 세트 합이 그날 실제로 친 경기 수다 */
  metaRoundsOf(lg, row=>row.teamEvent).forEach(r=>{
    if(cnt[r]) return;
    const ev=(rdMeta(lg,r)||{}).teamEvent||{};
    const n=(ev.games||[]).reduce((a,g2)=>a+(+g2.as||0)+(+g2.bs||0),0);
    if(n) cnt[r]=n;
  });
  return {uniq, dateOf, cnt};
}

function gridParticipantSortEnabled(lg){
  return !!(lg && lgIsCup(lg));
}
function gridParticipantCount(lg,id){
  const seen=new Set();
  (S.matches||[]).forEach(m=>{
    if(!m || m.void || lgOf(m)!==lg) return;
    if(m.aId===id || m.bId===id) seen.add(rdOf(m)||m.date);
  });
  const rounds=(S.meta&&S.meta.rounds)||{};
  Object.keys(rounds).forEach(k=>{
    if(!k.startsWith(lg+'|')) return;
    const r=rounds[k]||{};
    if(Array.isArray(r.ord) && r.ord.includes(id)) seen.add(k.slice(lg.length+1));
  });
  return seen.size;
}

function teamGridStandHTML(getR, ids){
  const rd0=roundOf(gridE.date, gridE.lg);
  const tev=rdTeamEvent(gridE.lg, rd0);
  if(!tev || (tev.teams||[]).length<2) return '';
  const clean=n=>String(n||'').replace(/\s*\(승리\)/,'');
  const names=(tev.teams||[]).map(t=>clean(t.name));
  const tOf={}; (tev.teams||[]).forEach(t=>(t.members||[]).forEach(id=>tOf[id]=clean(t.name)));
  const w={}; names.forEach(n=>w[n]=0);
  let left=0;
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const a=ids[i], b=ids[j];
    if(!tOf[a]||!tOf[b]||tOf[a]===tOf[b]) continue;
    const win=getR(a,b);
    if(win) w[tOf[win]]++; else left++;
  }
  if(names.length===2){
    return `<div class="secttl" style="margin-top:14px">팀 스코어</div>
      <div class="card"><div class="tvs" style="border:none;background:none;padding:4px 0;margin:0">
        <span class="${w[names[0]]>w[names[1]]?'w':''}">${esc(names[0])}</span>
        <b>${w[names[0]]}</b><i>:</i><b>${w[names[1]]}</b>
        <span class="${w[names[1]]>w[names[0]]?'w':''}">${esc(names[1])}</span>
      </div>${left?`<p class="tiny dim" style="text-align:center;margin:4px 0 0">아직 ${left}경기 남았습니다</p>`:''}</div>`;
  }
  const order=names.slice().sort((a,b)=>w[b]-w[a]);
  return `<div class="secttl" style="margin-top:14px">팀 스코어</div>
    <div class="card">${order.map((n,i)=>`<div class="hof ${i===0?'m1':''}">
      <span class="md">${i+1}</span><span class="nm">${esc(n)}</span><span class="rt">${w[n]}승</span></div>`).join('')}
    ${left?`<p class="tiny dim" style="margin:6px 0 0">아직 ${left}경기 남았습니다</p>`:''}</div>`;

/* 빠른 입력 — 그날 붙은 상대를 한 번에 찍고 저장한다.
   칩을 누를 때마다 승 → 패 → 해제로 돌고, 오른쪽 숫자를 누르면 판수가 늘어난다. */
let pickOrder=null;
/* 오늘 나왔을 법한 사람 — 같은 요일 출석률과 최근 출석으로 어림한다 */
function likelyToday(date, lg){
  const [Y,M,D]=String(date).split('-').map(Number);
  const dow=new Date(Y,M-1,D).getDay();
  /* 그 리그의 기록만 본다 — 점사모(금요일) 출석이 모닝 입력 후보 순서에 섞이지 않게 */
  const all=(S._sorted||[]).filter(m=>m.date<date && (!lg || lgOf(m)===lg));
  /* 클럽이 모인 날들을 요일별로 센다 */
  const clubDays=[...new Set(all.map(m=>m.date))];
  const sameDow=clubDays.filter(d=>{ const [y,mo,dd]=d.split('-').map(Number);
    return new Date(y,mo-1,dd).getDay()===dow; });
  const recent=clubDays.slice(-8);
  const by={};
  const mark=(id,d)=>{ const b=by[id]=by[id]||{dow:new Set(), rec:new Set(), last:null};
    const [y,mo,dd]=d.split('-').map(Number);
    if(new Date(y,mo-1,dd).getDay()===dow) b.dow.add(d);
    if(recent.includes(d)) b.rec.add(d);
    if(!b.last || d>b.last) b.last=d; };
  all.forEach(m=>{ mark(m.aId,m.date); mark(m.bId,m.date); });
  return id=>{
    const b=by[id];
    if(!b) return {score:0, dowRate:0, days:0};
    const dowRate = sameDow.length ? b.dow.size/sameDow.length : 0;   // 이 요일 출석률
    const recRate = recent.length  ? b.rec.size/recent.length  : 0;   // 최근 8일 출석률
    const idle = b.last ? daysBetween(b.last, date) : 999;
    const fresh = idle<=7 ? 1 : idle<=21 ? .6 : idle<=60 ? .25 : 0;   // 최근에 나온 적 있나
    /* 이 요일 출석률을 가장 크게 본다. 한참 안 나왔으면 크게 깎는다 */
    return {score: (dowRate*0.55 + recRate*0.25 + fresh*0.2) * (idle>45 ? 0.4 : 1),
            dowRate, days:b.dow.size, sameDow:sameDow.length, idle};
  };
}
/* 상대 고르는 격자만 따로 그린다. 입력칸을 다시 그리지 않아야 한글 입력이 끊기지 않는다 */
function pickListHTML(opp, picks, q, date, sortBy, lg){
  const s2=String(q||'').trim();
  const hit=s2 ? opp.filter(p=>matchName(p, s2)) : opp;
  if(!hit.length) return `<div class="empty">'${esc(s2)}'와 맞는 사람이 없습니다.</div>`;
  const chip=p=>{ const k=picks[p.id];
    return `<button class="pk ${k?(k.r==='W'?'w':'l'):''}" data-pick="${p.id}">
      <span class="nm">${esc(p.name)}</span>
      ${k?`<span class="ct">${k.r==='W'?'승':'패'}</span>`:''}
    </button>`; };
  if(sortBy==='likely'){
    /* 순서는 한 번만 정하고 붙잡아 둔다. 고르는 중에 자리가 바뀌면 누르기 어렵다 */
    const key=(date||today())+'|'+opp.length+'|'+(lg||'');
    if(!pickOrder || pickOrder.key!==key){
      const f=likelyToday(date||today(), lg);
      pickOrder={key, list:opp.map(p=>({id:p.id, s:f(p.id).score}))
        .sort((a,b)=>b.s-a.s || ((P(a.id)||{}).bu||0)-((P(b.id)||{}).bu||0))};
    }
    const rank={}; pickOrder.list.forEach((x,i)=>rank[x.id]={i, s:x.s});
    const scored=hit.map(p=>({p, s:(rank[p.id]||{}).s||0, i:(rank[p.id]||{}).i ?? 999}))
      .sort((a,b)=>a.i-b.i);
    /* 이 요일에 온 적이 없거나 한참 안 나온 사람은 아래로 내린다 */
    const cut=scored.findIndex(x=>x.s<0.35);
    const head=cut<0?scored:scored.slice(0,cut), tail=cut<0?[]:scored.slice(cut);
    const D=['일','월','화','수','목','금','토'];
    const [Y,M,DD]=String(date||today()).split('-').map(Number);
    return `<div class="pkgrp"><div class="pg-h">${D[new Date(Y,M-1,DD).getDay()]}요일에 자주 나오는 사람
        <span>${head.length}명</span></div>
        <div class="picks">${head.map(x=>chip(x.p)).join('')}</div></div>
      ${tail.length?`<div class="pkgrp"><div class="pg-h">그 밖 <span>${tail.length}명</span></div>
        <div class="picks">${tail.map(x=>chip(x.p)).join('')}</div></div>`:''}`;
  }
  const byBu={}; hit.forEach(p=>(byBu[p.bu]=byBu[p.bu]||[]).push(p));
  return Object.keys(byBu).map(Number).sort((a,b)=>a-b).map(bu=>`
    <div class="pkgrp"><div class="pg-h">${bu}부 <span>${byBu[bu].length}명</span></div>
    <div class="picks">${byBu[bu].map(chip).join('')}</div></div>`).join('');
}

      <div class="savebar">

  if(opp.length){

        if(box){ box.innerHTML=pickListHTML(opp, picks, bulk.q, bulk.date, bulk.sort||'likely', bulk.lg||defLeague()); bindPicks(); }
        const x=$('#bClear');

      document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.pick, cur=picks[id];
        if(!cur) picks[id]={r:'W',n:1};
        else if(cur.r==='W') picks[id]={r:'L',n:1};

/* picks = { 상대id: {r:'W'|'L', n:판수} } — 중복은 건너뛰고 상대 입력분은 합친다 */
async function planAndSave(date, meId, picks, lg){
  /* 관리자가 입력한 경기는 본인이 뛴 것이든 아니든 바로 확정으로 본다.
     회원이 자기 경기를 넣은 경우에만 상대 확인을 기다린다. */
  const needConfirm = !isAdmin() && meId===S.me.id;
  const confirmIds = oppId => needConfirm ? [S.me.id] : [meId, oppId];
  const draftList = S.matches.slice();
  const scan = (oppId,iWon)=>{
    const same=draftList.filter(m=>!m.void && m.date===date &&
      ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
    /* 누가 적었든 승자가 같으면 같은 경기다 */
    const ok=m=>(winnerOf(m)===meId)===iWon;
    const cands=same.filter(ok), cb=m=>m.confirmedBy||[];
    /* 상대가 먼저 넣어둔 건 — 확인만 얹으면 되고 새로 만들지 않는다 */
    const byOpp = cands.find(m=>m.enteredBy!==meId && !cb(m).includes(meId) && !isConfirmed(m));
    /* 이미 확정됐거나 내가 넣은 건은 다시 만들 필요가 없다 */
    const mineCount = cands.filter(m=>m.enteredBy===meId || cb(m).includes(meId) || isConfirmed(m)).length;
    return { byOpp, mineCount };
  };
  const writes=[]; let created=0, merged=0, skipped=0;
  for(const [oppId,k] of Object.entries(picks)){
    if(!P(oppId) || oppId===meId) continue;
    const iWon = k.r==='W';
    const s0 = scan(oppId,iWon);
    let need = Math.max(0, k.n - s0.mineCount);
    skipped += k.n - need;
    while(need>0){
      const sc = scan(oppId,iWon);
      if(!sc.byOpp) break;
      const upd={...sc.byOpp, confirmedBy:[...new Set([...(sc.byOpp.confirmedBy||[]), ...confirmIds(oppId)])],
                 status:'confirmed', rev:(sc.byOpp.rev||0)+1};
      writes.push(upd);
      const i=draftList.findIndex(m=>m.id===upd.id); if(i>=0) draftList[i]=upd;
      merged++; need--;
    }
    const useLg = lg || defLeague();
    const baseHd = handiForMatch(meId, oppId, date, useLg);
    for(let i=0;i<need;i++){
      const hd = baseHd ? {...baseHd} : null;
      const m={ id:uid('m'), rev:1, date, lg: useLg,
                aId:meId, bId:oppId, winnerId: iWon?meId:oppId,
                handi: hd, note:'',
                /* 묶음 입력도 저장 후 시간순으로 계산한 승률을 표시한다. */
                exp:null,
                enteredBy:S.me.id, enteredAt:new Date(Date.now()+i).toISOString(),
                confirmedBy: confirmIds(oppId), status: needConfirm?'single':'confirmed', void:false };
      writes.push(m); draftList.push(m); created++;
    }
  }
  let ok=true;
  if(writes.length){ busyOn(`${writes.length}건 저장 중…`); ok=await commitMatches(writes); }
  return {ok, created, merged, skipped, count:writes.length};
}
async function submitBulk(){
  if(S.busy) return;
  const live=$('#bdate'); if(live&&live.value) bulk.date=live.value;
  const date=bulk.date, meId=bulk.meId;
  if(!dateOK(date)) return toast(date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);
  if(!Object.keys(bulk.picks).length) return;

  S.busy=true; busyOn('정리하는 중…');
  const r=await planAndSave(date, meId, bulk.picks, bulk.lg||defLeague());
  S.busy=false; busyOff();
  if(!r.ok) return errorSheet('저장하지 못했습니다','경기를 저장하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('빠른 입력', `${nameOf(meId)} · ${date} · 등록 ${r.created} / 합침 ${r.merged} / 건너뜀 ${r.skipped}`);
  /* 다음에 입력 탭을 열면 새 입력으로 시작한다 */
  bulk=null;
  render();
  const parts=[];
  if(r.created) parts.push(`${r.created}건 등록`);
  if(r.merged)  parts.push(`${r.merged}건 상대 입력과 합침`);
  if(r.skipped) parts.push(`${r.skipped}건 건너뜀`);
  toast(parts.length?parts.join(' · '):'새로 등록할 경기가 없었습니다.');
}

function matchCardHTML(m){
  const win=winnerOf(m), lose=loserOf(m);
  const mine=isMine(m), done=isConfirmed(m);
  const iWon = mine && win===S.me.id;
  const meMark = pid => pid===meId() ? '<i class="mem">나</i>' : '';
  const canDel = !!S.me && (isAdmin() || (m.enteredBy===S.me.id && !done));
  const canOk  = !!S.me && mine && !done && !(m.confirmedBy||[]).includes(S.me.id);
  const legacy = (m.enteredAt||'') < (st().legacyBefore||'');
  const proxy  = m.enteredBy!==m.aId && m.enteredBy!==m.bId;
  const byLabel = (legacy||proxy) ? '관리자 입력' : esc(nameOf(m.enteredBy))+' 입력';

  const dW = Math.round(Math.abs(win===m.aId ? (m._sA||0) : (m._sB||0)));
  const dL = Math.round(Math.abs(win===m.aId ? (m._sB||0) : (m._sA||0)));
  /* 점수가 오르는 건 이긴 쪽뿐이라, 최고 기록도 이긴 쪽에서만 나온다 */
  const peakW = win===m.aId ? m._peakA : m._peakB;

  let meta='';
  const mExp = expOf(m);
  if(mExp!=null){
    const favId = mExp>=0.5 ? m.aId : m.bId;
    const favP  = Math.min(99, Math.round(Math.max(mExp,1-mExp)*100));
    const up    = win!==favId && favP>=58;
    meta += up ? `<span class="ups">이변</span>` : '';
    meta += `<span class="${favP>=70?'hot':''}">예상 ${esc(nameOf(favId))} ${favP}%</span>`;
  }
  if(m.br) meta += `<span>${esc(brLabel(m.br))}</span>`;
  if(m.handi&&m.handi.pts) meta += `<span>핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}</span>`;

  if(!done) meta += `<span class="hot">${(m.confirmedBy||[]).includes(meId())?'상대 확인 대기':'내 확인 필요'}${st().confirmedOnly?' · 랭킹 미반영':''}</span>`;

  return `<div class="mt ${mine?(iWon?'mine mw':'mine ml'):''}">
    <button class="mrow" data-exp="${m.id}">
      <div class="side"><span class="rs w">승</span>
        <span class="pn ${win===meId()?'me':''}">${esc(nameOf(win))}${meMark(win)}${buOf(win)?`<em>(${buOf(win)}부)</em>`:''}</span>
        ${peakW?`<span class="pkin" title="${MODES.skill.label} 랭킹 기준, 이 경기로 본인 최고 레이팅을 넘어섰습니다">${peakW} 개인 최고</span>`:''}
        <span class="dl up">+${dW}</span></div>
      <div class="side"><span class="rs l">패</span>
        <span class="pn dim ${lose===meId()?'me':''}">${esc(nameOf(lose))}${meMark(lose)}${buOf(lose)?`<em>(${buOf(lose)}부)</em>`:''}</span>
        <span class="dl down">−${dL}</span></div>
      ${meta?`<div class="mmeta">${meta}</div>`:''}
    </button>
    <div class="macts" id="act_${m.id}" style="display:none">
      <div class="info">${m.date} · ${done?'상호 확인':'상대가 확인하면 랭킹에 반영됩니다'} · ${byLabel}${m.note?' · '+esc(m.note):''}</div>
      ${mine?`<button class="btn ghost sm" data-review="${m.id}">${reviewOf(m.id)?'복기 보기':'복기'}</button>`:''}
      ${canDel?`<button class="btn ghost sm" data-date="${m.id}">날짜 수정</button>
                <button class="btn ghost sm" data-void="${m.id}">삭제</button>`:''}
      ${canOk?`<button class="btn ghost sm" data-ok="${m.id}">이 경기 확인</button>`:''}
      ${(!canDel&&!canOk)?'<span class="tiny dim">수정 권한이 없습니다.</span>':''}
    </div>
  </div>`;
}
function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  /* 엔진이 계산한 순서(오래된 것부터)를 그대로 뒤집어 쓴다.
     화면 순서와 계산 순서가 어긋나면 '개인 최고' 같은 표시가 엉뚱한 줄에 붙는다. */
  const ord={}; (S._sorted||[]).forEach((m,i)=>ord[m.id]=i);
  const key=m=> ord[m.id]!=null ? ord[m.id]
    : 1e9 + (m.date+'|'+(m.enteredAt||'')).localeCompare('');
  const sorted=list.slice().sort((a,b)=>{
    const ka=ord[a.id], kb=ord[b.id];
    if(ka!=null && kb!=null) return kb-ka;                 // 최신이 위
    return (b.date+'|'+(b.enteredAt||'')).localeCompare(a.date+'|'+(a.enteredAt||''));
  });
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
/* 여러 건을 한 번에 지운다 — 하나씩 지우면 그때마다 전체 재계산이 돌아 느리다 */
async function deleteMatches(list){
  const ids=new Set(list.map(m=>m.id));
  if(!ids.size) return true;
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>!ids.has(m.id));
  recompute(); render();
  busyOn(`${ids.size}건 삭제 중…`);
  let ok=true;
  try{
    if(FB){
      await fbDeleteMatchIds([...ids]);
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>ids.has(x.id))) continue;
        if(!await sSet(k, cur.filter(x=>!ids.has(x.id)))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 경기 삭제 — 보관하지 않고 바로 지운다 */
async function deleteMatchById(id){
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>m.id!==id); recompute(); render();
  busyOn('삭제 중…');
  let ok=true;
  try{
    if(FB){ await fbDeleteMatchIds([id]); }
    else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>x.id===id)) continue;
        if(!await sSet(k, cur.filter(x=>x.id!==id))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 선수를 지울 때 그 사람 경기도 함께 지운다 */
async function deleteMatchesOf(pid){
  const targets=S.matches.filter(m=>m.aId===pid||m.bId===pid);
  if(!targets.length) return 0;
  try{
    if(FB){
      await fbDeleteMatchIds(targets.map(m=>m.id));
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        const next=cur.filter(m=>m.aId!==pid && m.bId!==pid);
        if(next.length!==cur.length) await sSet(k,next);
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); return 0; }
  S.matches=S.matches.filter(m=>m.aId!==pid && m.bId!==pid); recompute();
  return targets.length;
}
/* 날짜만 바꾼다. 개별 레코드 방식이라 옮길 필요가 없다 */
async function moveMatchDate(m, newDate){
  const lg=lgOf(m), rd=m.rd ? (lgIsCup(lg)?roundOf(newDate, lg):m.rd) : '';
  const hd=handiForMatch(m.aId, m.bId, newDate, lg, rd);
  const upd={...m, date:newDate, rd:rd||m.rd, handi:hd, exp:null, rev:(m.rev||0)+1, editedBy:S.me.id, editedAt:new Date().toISOString()};
  if(FB) return pushMatches([upd]);
  const newKey=KEY.shard(monthOf(newDate));
  if(!await commitMatch(upd)) return false;
  for(const k of (await sList(MPRE))){
    if(k===newKey) continue;
    const cur=(await sGet(k))||[];
    if(cur.some(x=>x.id===m.id)) await sSet(k, cur.filter(x=>x.id!==m.id));
  }
  await loadAll();
  return true;
}
function dateSheet(id){
  const m=S.matches.find(x=>x.id===id); if(!m) return;
  const sh=sheet('경기 날짜 수정', `
    <p class="tiny dim">${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))}</p>
    <div class="field" style="margin-top:12px"><label>날짜</label>
      <input type="date" id="mdNew" value="${m.date}" max="${today()}" min="${minEntryDate()}"></div>
    <p class="tiny dim">몰아서 기록하다 날짜가 밀린 경우에 쓰세요. 날짜를 바꾸면 그 순서대로 레이팅이 다시 계산됩니다.</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" id="mdNo">취소</button><button class="btn" id="mdYes">저장</button></div>`);
  sh.querySelector('#mdNo').onclick=()=>sh.remove();
  sh.querySelector('#mdYes').onclick=async()=>{
    const nd=sh.querySelector('#mdNew').value;
    if(!nd) return toast('날짜를 선택하세요.',1);
    if(!dateOK(nd)) return toast(nd>today()?'미래 날짜는 넣을 수 없습니다.':'오늘과 어제로만 옮길 수 있습니다.',1);
    sh.remove();
    if(nd===m.date) return;
    const ok=await moveMatchDate(m, nd);
    if(!ok) return errorSheet('수정하지 못했습니다','날짜를 옮기는 중 문제가 생겼습니다.');
    audit('날짜 수정', `${m.date} → ${nd}`);
    viewLog.month=nd.slice(0,7); if(viewLog.day) viewLog.day=nd;
    render(); toast('날짜를 바꿨습니다.');
  };
}
function bindMatchActions(){
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('act_'+b.dataset.exp); if(!el) return;
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>dateSheet(b.dataset.date));
  document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{

/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>expOf(m)!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = expFor(m, w);
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=UPSET) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

/* ── 내 정보 / 선수 상세 ── */
function sparkline(id,mode,ym){
  /* 시즌 첫날부터 오늘까지 매일 찍는다. 경기가 없던 날은 점수가 그대로 이어진다. */
  const p=P(id); if(!p) return '';
  const per = ym || (seasons().slice(-1)[0]) || monthOfNow();
  const hist=(trk(mode).H[id]||[]);
  const played=new Set((S._sorted||[]).filter(m=>m.aId===id||m.bId===id).map(m=>m.date));
  const byDay=new Map();
  for(const x of hist){ if(x.d && played.has(x.d)) byDay.set(x.d, x.r); }

  const addDay=(ds,n)=>{ const t=new Date(ds+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n);
    return t.toISOString().slice(0,10); };
  /* 시즌 키가 4자리면 그 해 전체, 7자리면 그 달 */
  const yearly = String(per).length===4;
  const start = yearly ? per+'-01-01' : per+'-01';
  const seasonEnd = yearly ? per+'-12-31' : addDay(shiftMonth(per,1)+'-01', -1);
  const end = today() < seasonEnd ? today() : seasonEnd;
  if(end < start) return '';

  /* 시즌 시작 시점의 점수 — 그 전 마지막 기록, 없으면 기준값 */
  let cur = mode==='form' ? st().formBase : baseFor(p.bu);
  [...byDay.keys()].sort().forEach(d=>{ if(d < start) cur = byDay.get(d); });

  const series=[]; let d=start, guard=0;
  while(d<=end && guard++<400){
    if(byDay.has(d)) cur=byDay.get(d);
    series.push([d, cur, byDay.has(d)]);
    d=addDay(d,1);
  }
  if(series.length<2) return '';
  const h=series.map(x=>x[1]);
  const w=300,ht=64;
  let lo=Math.min(...h), hi=Math.max(...h);
  if(hi-lo < 30){ const mid=(hi+lo)/2; lo=mid-15; hi=mid+15; }   // 변화가 작아도 납작하지 않게
  const sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const dd=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const dots=series.map((x,i)=> x[2]
    ? `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="2.2" fill="${col}">
        <title>${x[0]} · ${Math.round(x[1])}</title></circle>` : '').join('');
  const days=series.filter(x=>x[2]).length;
  const fmt=x=>yearly ? `${+x.slice(5,7)}/${+x.slice(8)}` : `${+x.slice(8)}일`;
  const rangeLabel=yearly ? `${seasonLabel(per)} ${fmt(start)}~${fmt(end)}`
    : `${+per.slice(5)}월 ${fmt(start)}~${fmt(end)}`;
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${dd} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${dd}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>
    <div class="split tiny dim"><span>${Math.round(Math.min(...h))}</span>
      <span>${rangeLabel} <span class="dim">· ${days}일 출전</span></span>
      <span>${Math.round(Math.max(...h))}</span></div>`;
}
const playDaysOf = (id, ym)=> new Set((S._sorted||[])
