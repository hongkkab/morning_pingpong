    /* 한눈용 히트맵 — 행은 핸디 받는 쪽 부수, 열은 부수 차 1~3 */
    const cellMap={};
    t.forEach(x=>{ if(x.d<=3) cellMap[x.lo+'|'+x.d]=x; });
    const bus=[...new Set(t.filter(x=>x.d<=3).map(x=>x.lo))].sort((a,b)=>a-b);
    const cell=(bu,g)=>{ const x=cellMap[bu+'|'+g];
      if(!x) return '<div class="hmc none"></div>';
      const cls=(x.en<30?'weak ':'')+(x.rate<0.42?'lo':x.rate>0.58?'hi':'ok');
      return `<div class="hmc ${cls}" title="${bu}부가 ${bu-g}부 상대 · ${x.n}경기 (상성 보정 후 유효 ${Math.round(x.en)}) · 평균 핸디 ${x.avgPts.toFixed(1)}점">
        <b>${pct(x.rate)}%</b><span>${x.n}</span></div>`; };
    const byD={};
    t.forEach(x=>(byD[x.d]=byD[x.d]||[]).push(x));
    return `<div class="secttl" style="margin-top:16px">부수 조합별</div>
      <p class="tiny dim" style="margin:0 0 8px">핸디 받는 쪽이 실제로 이긴 비율입니다.
        같은 1부수 차라도 위쪽 부수일수록 핸디가 박해지는지 볼 수 있습니다. 승급자의 옛 경기는 옛 부수로 셌고,
        같은 두 사람의 반복 대결(상성)은 ${st().repeatN0||5}번째부터 반씩 줄여 셌습니다 — 레이팅과 같은 기준입니다.</p>
      <div class="card hmw"><div class="hmap">
        <div class="hh"></div><div class="hh">1부수 위 상대</div><div class="hh">2부수 위</div><div class="hh">3부수 위</div>
        ${bus.map(bu=>`<div class="hr">${bu}부</div>${cell(bu,1)}${cell(bu,2)}${cell(bu,3)}`).join('')}
      </div>
      <p class="tiny dim" style="margin:8px 2px 0">
        <span style="color:#8fe0c2">초록</span> 핸디가 후함(약자 58%+) ·
        <span style="color:#a8d8ff">파랑</span> 대체로 맞음 ·
        <span style="color:#f0968e">빨강</span> 핸디가 박함(42% 미만) · 보정 후 유효 표본 30 미만은 흐리게</p></div>
      <details class="advbox" style="margin-top:8px"><summary>조합별 자세히 (핸디 점수·격차)</summary><div class="advin">
      ${Object.keys(byD).sort((a,b)=>a-b).map(d=>`<div class="card" style="margin-bottom:8px">
        <div class="secttl" style="margin:0 0 8px">부수 차 ${d}</div>
        ${byD[d].map(x=>`<div class="pr ${!x.solid?'weak':x.rate<0.42?'lo':x.rate>0.58?'hi':'ok'}">
          <div class="k">${x.hi}부 <i>vs</i> ${x.lo}부</div>
          <div class="track"><div class="mid"></div>
            <i style="${x.rate<0.5?'right:50%':'left:50%'};width:${Math.min(50,Math.abs(x.rate-0.5)*100)}%"></i></div>
          <div class="v"><b>${pct(x.rate)}%</b><span>${x.n}경기</span></div>
          <div class="o">핸디 ${x.avgPts.toFixed(1)}점 · 부수당 ${Math.round(x.own)}점 유리</div>
        </div>`).join('')}
      </div>`).join('')}</div></details>`;
  };
  const secBu=()=>{
    const cs=buCandidates();
    const up=cs.filter(c=>c.d>0), dn=cs.filter(c=>c.d<0);
    const col=(ttl, arr, cls)=>`<div class="bucol ${cls}">
      <div class="bc-h">${ttl}<span>${arr.length}명</span></div>
      ${arr.length?arr.map(c=>`<div class="bcr">
        <span class="n">${esc(c.p.name)}</span>
        <span class="v">${c.p.bu}<i>→</i><b>${c.felt.toFixed(1)}</b></span>
      </div>`).join(''):`<div class="bc-none">없음</div>`}</div>`;
    return `<div class="secttl" style="margin-top:16px">체감 부수 차이</div>
      <p class="tiny dim" style="margin:0 0 8px">등록 부수와 체감이 1부수 이상 벌어진 사람입니다. (8경기 이상)
        핸디를 정할 때 참고하시라고 보여드리는 값입니다. 부수 조정은 클럽에서 결정합니다.</p>
      ${cs.length?`<div class="bugrid">${col('등록보다 잘 치는 중', up, 'up')}${col('요즘 고전 중', dn, 'down')}</div>`
        :`<div class="empty">등록 부수와 크게 다른 사람이 없습니다.</div>`}`;
  };
  const secAtt=()=>{
    const a=attendance(), D=['일','월','화','수','목','금','토'];
    const mx=Math.max(...a.dow,1), mm=Math.max(...a.mon.map(x=>x[1]),1);
    const top=a.dow.indexOf(mx);
    const totG=a.dow.reduce((x,y)=>x+y,0);
    return `<div class="secttl" style="margin-top:16px">언제 많이 치나</div>
      <div class="atsum">
        <div><b>${a.days.length}</b><span>모인 날</span></div>
        <div><b>${D[top]}</b><span>가장 붐빔</span></div>
        <div><b>${a.avgPl.toFixed(1)}</b><span>하루 평균</span></div>
        <div><b>${totG?Math.round(totG/a.days.length):0}</b><span>하루 경기</span></div>
      </div>
      <div class="card" style="padding:10px 12px">
        <div class="dowgrid">${a.dow.map((n,i)=>`<div class="${i===0?'sun':''} ${n===mx&&n?'peak':''}">
          <em>${n||''}</em><div class="bar"><i style="height:${n?Math.max(6,Math.round(n/mx*100)):0}%"></i></div>
          <span>${D[i]}</span></div>`).join('')}</div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
        ${a.mon.map(([ym,n])=>`<div class="mrow2">
          <div class="k">${seasonLabel(ym)}</div>
          <div class="track"><i style="width:${Math.round(n/mm*100)}%"></i></div>
          <div class="v"><b>${n}</b><span>${a.days.filter(d=>d.slice(0,String(ym).length)===ym).length}일</span></div>
        </div>`).join('')}</div>
      </div>`;
  };

  const draw=()=>{
    const rs=roster().filter(p=>(S.G[p.id]||0)>0);
    /* 이 시트 안에서만 쓰는 기간 — 'all' 이면 통산 */
    const sl=seasons();
    if(clubPer!=='all' && !sl.includes(clubPer)) clubPer = sl.length ? sl[sl.length-1] : 'all';
    if(!matchPick.a) matchPick.a=(S.me&&S.me.id)||(rs[0]||{}).id||'';
    if(!matchPick.b) matchPick.b=(rs.find(p=>p.id!==matchPick.a)||{}).id||'';
    /* 기간이 의미 있는 탭에만 안쪽에 기간 줄을 둔다.
       연 시즌과 월 시즌을 한 줄에 섞지 않는다 — 통산/연도/월별을 먼저 고르게 한다. */
    const years=sl.filter(isYearSeason), months=sl.filter(x=>!isYearSeason(x));
    const perMode = clubPer==='all' ? 'all' : isYearSeason(clubPer) ? 'year' : 'month';
    const perPick = list => list.length>1 ? `<div class="ana-period-pick">${selectHTML('clubPerSel', list.slice().reverse().map(ym=>[ym, seasonLabel(ym)]), clubPer, {center:true, attrs:'data-cper-select', aria:'분석 기간 선택'})}</div>` : '';
    const perBar = sl.length>1 ? `
      <div class="ana-period">
        <div class="seg mini ana-period-mode">
          <button data-cmode="all" class="${perMode==='all'?'on':''}">통산</button>
          ${years.length?`<button data-cmode="year" class="${perMode==='year'?'on':''}">연도</button>`:''}
          ${months.length?`<button data-cmode="month" class="${perMode==='month'?'on':''}">월별</button>`:''}
        </div>
        ${perMode==='year'?perPick(years):perMode==='month'?perPick(months):''}
      </div>` : '';
    /* 리그를 골라 보고 있으면 그 리그에 뜻이 있는 탭만 남긴다.
       명예의 전당은 통합 전용, 승급전은 승급 기록과 대진표만. */
    const cTabs = curLg()!=='all'
      ? (curLg()==='promotion'
          ? [['lgrec','승급 기록'],['round','대진표']]
          : lgIsCup(curLg())
          ? [['lgrec','통산 성적'],['round','대진표'],['month','요약']]
          : [['month','요약']])   // 맞대결·부수별·진단은 통합에서만
      : [['month','요약'],['vs','맞대결'],['bu','부수별'],['hof','명예의 전당'],['diag','클럽 진단']];
    if(!cTabs.some(t=>t[0]===clubTab)) clubTab=cTabs[0][0];
    const body = clubTab==='month' ? perBar+clubPulseHTML()+'<details class="insight-panel club-digest"><summary>이번 주 리포트와 주요 선수</summary><div class="ana-overview">'+clubNewsHTML()+clubScoreboardHTML()+'</div></details><details class="insight-panel club-digest"><summary>다승·출석·시즌 순위 자세히</summary>'+secMonthly()+(clubPer==='all'?secHall():'')+'</details>'
               : clubTab==='lgrec' ? secLgRecord()
               : clubTab==='round' ? secRound()
               : clubTab==='vs'    ? allTime(()=>secMatch(rs)+secRival()+secCycle())
               : clubTab==='bu'    ? perBar+secBuMvp()+secSameBu()+secBuTrend()+secPromo()
               : clubTab==='hof'   ? secHof()
               :                     allTime(()=>secHandi()+secPairs()+secBu()+secAtt());
    return `<div class="ana">${lgBarHTML()}
      ${cTabs.length>1?`      <div class="seg ana-tabs" style="margin-bottom:12px">
      ${cTabs
        .map(([k,v])=>`<button data-ct="${k}" class="${clubTab===k?'on':''}">${v}</button>`).join('')}
    </div>`:""}${body}</div>`;
  };
  const bind=()=>{
    bindNameTaps(sh);
    sh.querySelectorAll('[data-goma]').forEach(b=>b.onclick=()=>gotoMatch(b.dataset.goma));
    const te=sh.querySelector('#teEdit'); if(te) te.onclick=()=>teamEventSheet(cupLg, cupRd);
    sh.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ clubTab=b.dataset.ct; redraw(); });
    sh.querySelectorAll('[data-cper]').forEach(b=>b.onclick=()=>{ clubPer=b.dataset.cper; redraw(); });
    const cperSel=sh.querySelector('[data-cper-select]');
    if(cperSel) cperSel.onchange=e=>{ clubPer=e.target.value; redraw(); };
    sh.querySelectorAll('[data-cmode]').forEach(b=>b.onclick=()=>{
      const md=b.dataset.cmode;
      const sl2=seasons();
      clubPer = md==='all' ? 'all'
        : md==='year' ? (sl2.filter(isYearSeason).slice(-1)[0]||'all')
        : (sl2.filter(x=>!isYearSeason(x)).slice(-1)[0]||'all');
      redraw();
    });
    sh.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{
      S.lg=b.dataset.lg;
      cupLg=(S.lg!=='all'&&lgIsCup(S.lg))?S.lg:cupLg; cupRd='';
      /* 리그마다 있는 탭이 다르다. 없는 탭이면 첫 탭으로 되돌린다 */
      const ok = S.lg==='all' ? ['month','vs','bu','hof','diag']
               : S.lg==='promotion' ? ['lgrec','round']
               : lgIsCup(S.lg) ? ['lgrec','round','month']
               : ['month'];
      if(!ok.includes(clubTab)) clubTab=ok[0];
      recompute(); redraw(); });
    sh.querySelectorAll('[data-crdnav]').forEach(b=>b.onclick=()=>{
      if(b.dataset.crdnav){ cupRd=b.dataset.crdnav; redraw(); } });
    { const sel=sh.querySelector('[data-crdsel]');
      if(sel) sel.onchange=()=>{ cupRd=sel.value; redraw(); }; }
    sh.querySelectorAll('[data-cfrank]').forEach(b=>b.onclick=()=>{
      if(b.dataset.cfranktxt){ copyText(b.dataset.cfranktxt); return; }
      const ids=b.dataset.cfrank.split(',');
      copyText(`${lgName(cupLg)} ${roundLabel(cupRd)} 최종순위\n`
        + ids.map((id,i)=>`${i+1}위 ${nameOf(id)}`).join('\n'));
    });
    bindCombo(sh, 'mpA', id=>{ if(id){ matchPick.a=id; redraw(); } });
    bindCombo(sh, 'mpB', id=>{ if(id){ matchPick.b=id; redraw(); } });
    bindCombo(sh, 'cycWho', id=>{ cycleWho=id||'*'; redraw(); },
      [{id:'*', label:'전체 보기'}], {clearable:true});
  };
  const redraw=()=>{
    if(host){ host.innerHTML=draw(); bind(); return; }
    const o=sh; sh=sheet('클럽 분석', draw()); o.remove(); bind();
  };
  if(host){ host.innerHTML=draw(); bind(); return; }
  sh=sheet('클럽 분석', draw()); bind();
}
/* 대회 시뮬레이터 화면 */
let simCfg=null;
function simSheet(host){
  const MIN=st().provisional||0;
  /* 시뮬레이터는 리그와 무관하게 클럽 전원을 대상으로 본다.
     S.G 는 지금 보고 있는 리그로 걸러진 값이라 여기서는 쓰지 않는다. */
  const gAll={};
  (S.matches||[]).filter(m=>!m.void).forEach(m=>{ gAll[m.aId]=(gAll[m.aId]||0)+1; gAll[m.bId]=(gAll[m.bId]||0)+1; });
  const pool=roster().filter(p=>(gAll[p.id]||0)>0);
  simCfg = simCfg || { ids:pool.filter(p=>(gAll[p.id]||0)>=MIN).map(p=>p.id),
                       mode:'skill', handi:true, format:'both', groups:2, adv:2, q:'' };
  if(simCfg.q==null) simCfg.q='';
  let sh;
  const roundName = n => n<=2?'결승':n<=4?'4강':n<=8?'8강':n<=16?'16강':n+'강';

  /* 방식에 따른 안내 — 이 부분만 따로 갈아끼운다 */
  const noteHTML=()=>{
    const c=simCfg, n=c.ids.length;
    if(c.format==='league')
      return `${n}명 풀리그 — 서로 한 번씩, 한 사람당 ${Math.max(0,n-1)}경기 (총 ${n*(n-1)/2}경기). 승수로 순위를 매깁니다.`;
    if(c.format==='cup')
      return `${n}명 → ${roundName(nextPow2(n))}부터, 남는 자리는 부전승입니다.`;
    const sz=groupSizes(n, c.gsize);
    const distribution=Object.entries(sz.reduce((acc,size)=>{acc[size]=(acc[size]||0)+1;return acc;},{})).map(([size,count])=>size+'명 × '+count+'개 조').join(' / ');
    const kn=sz.length*c.adv;
    const tot=sz.reduce((a,x)=>a+x*(x-1)/2,0);
    return `${c.gsize?`${c.gsize}명씩`:'4명씩을 기본으로'} <b>${sz.length}개 조</b> — ${distribution}`
      + `<br>각 조 ${c.adv}명씩 <b>${kn}명</b>이 올라가 ${roundName(nextPow2(kn))}부터 시작합니다.`
      + (n?` 조별리그는 총 ${tot}경기.`:'');
  };
  /* 참가자 격자 — 부수로 묶고 검색으로 좁힌다 */
  const pickHTML=()=>{
    const q=(simCfg.q||'').trim();
    const hit=q ? pool.filter(p=>matchName(p,q)) : pool;
    if(!hit.length) return `<div class="empty">'${esc(q)}'와 맞는 사람이 없습니다.</div>`;
    const byBu={}; hit.forEach(p=>(byBu[p.bu]=byBu[p.bu]||[]).push(p));
    return Object.keys(byBu).map(Number).sort((a,b)=>a-b).map(bu=>{
      const on=byBu[bu].filter(p=>simCfg.ids.includes(p.id)).length;
      return `<div class="pkgrp">
        <div class="pg-h">${bu}부 <span>${on}/${byBu[bu].length}</span>
          <button class="btn ghost sm" data-bua="${bu}" style="margin-left:auto;padding:2px 8px;font-size:10px">
            ${on===byBu[bu].length?'해제':'전체'}</button></div>
        <div class="picks">${byBu[bu].map(p=>`<button class="pk ${simCfg.ids.includes(p.id)?'w':''}" data-tog="${p.id}">
          <span class="nm">${esc(p.name)}</span></button>`).join('')}</div>
      </div>`;}).join('');
  };
  const headHTML=()=>`참가자 <b>${simCfg.ids.length}명</b>`;

  const draw=()=>{
    const c=simCfg;
    return `
      <p class="tiny dim">대진을 무작위로 뽑아 실제 대회처럼 치러 봅니다. 다시 뽑을 때마다 결과가 달라집니다.</p>
      <p class="tiny dim">승률은 ${curLg()==='all'?'전체 리그':esc(lgName(curLg()))}의 누적 Elo를 기준으로 계산합니다.
        핸디는 ${esc(lgName(predictionLeague()))} 규칙을 적용합니다.
        ${st().handiOn?'':'현재 핸디 보정이 꺼져 있어 핸디에 따른 승률 보정은 적용하지 않습니다.'}</p>
      <div class="secttl" style="margin-top:14px">방식</div>
      <div class="seg">
        <button data-f="league" class="${c.format==='league'?'on':''}">리그전</button>
        <button data-f="cup" class="${c.format==='cup'?'on':''}">토너먼트</button>
        <button data-f="both" class="${c.format==='both'?'on':''}">리그+토너먼트</button>
      </div>
      <div id="simGrp" style="${c.format==='both'?'':'display:none'}">
        <div class="fgrid" style="margin-top:11px">
          <div class="field"><label>조당 인원</label>
            ${selectHTML('sgS', [[0,'자동 (4명 기준)'], ...[3,4,5,6,8].map(n=>[n, `${n}명씩`])], c.gsize||0)}</div>
          <div class="field"><label>조당 진출</label>
            ${selectHTML('sgA', [1,2,3,4].map(n=>[n, `${n}명`]), c.adv)}</div>
        </div>
      </div>
      <p class="tiny dim" id="simNote" style="margin:6px 2px 0">${noteHTML()}</p>

      <div class="secttl" style="margin-top:16px">경기 조건</div>
      <div class="seg">
        <button data-h="1" class="${c.handi?'on':''}">핸디 적용</button>
        <button data-h="0" class="${!c.handi?'on':''}">노핸디</button>
      </div>

      <div class="split" style="align-items:center;margin-top:16px">
        <div class="secttl" style="margin:0" id="simHead">${headHTML()}</div>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm" data-all>전체</button>
          <button class="btn ghost sm" data-none>해제</button>
        </div>
      </div>
      <div class="findbox" style="margin:8px 0 10px">
        <input id="simFind" placeholder="이름 검색  예) 홍길동, ㅎㄱㄷ" value="${esc(c.q||'')}" autocomplete="off">
        <button class="fx" id="simClear" ${c.q?'':'style="display:none"'}>✕</button>
      </div>
      <div id="simPick">${pickHTML()}</div>
      <button class="btn" id="simGo" style="margin-top:16px" ${c.ids.length<3?'disabled':''}>
        ${c.ids.length<3?'3명 이상 선택하세요':'대진 뽑고 대회 열기'}</button>
      <div id="simOut"></div>`;
  };

  /* 참가자만 다시 그린다 — 시트 전체를 다시 만들면 스크롤이 튄다 */
  const refreshPicks=()=>{
    const box=sh.querySelector('#simPick'); if(box) box.innerHTML=pickHTML();
    const hd=sh.querySelector('#simHead'); if(hd) hd.innerHTML=headHTML();
    const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML();
    const go=sh.querySelector('#simGo');
    if(go){ go.disabled=simCfg.ids.length<3;
      go.textContent=simCfg.ids.length<3?'3명 이상 선택하세요':'대진 뽑고 대회 열기'; }
    const x=sh.querySelector('#simClear'); if(x) x.style.display=simCfg.q?'':'none';
    bindPicks();
  };
  const bindPicks=()=>{
    sh.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.tog, i=simCfg.ids.indexOf(id);
      if(i<0) simCfg.ids.push(id); else simCfg.ids.splice(i,1);
      refreshPicks();
    });
    sh.querySelectorAll('[data-bua]').forEach(b=>b.onclick=()=>{
      const bu=+b.dataset.bua, ms=pool.filter(p=>p.bu===bu);
      const all=ms.every(p=>simCfg.ids.includes(p.id));
      ms.forEach(p=>{ const i=simCfg.ids.indexOf(p.id);
        if(all){ if(i>=0) simCfg.ids.splice(i,1); } else if(i<0) simCfg.ids.push(p.id); });
      refreshPicks();
    });
  };
  const bind=()=>{
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
      simCfg.format=b.dataset.f;
      sh.querySelectorAll('[data-f]').forEach(x=>x.className = x.dataset.f===simCfg.format?'on':'');
      const g=sh.querySelector('#simGrp'); if(g) g.style.display = simCfg.format==='both'?'':'none';
      const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML();
    });
    sh.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{
      simCfg.handi=b.dataset.h==='1';
      sh.querySelectorAll('[data-h]').forEach(x=>x.className = (x.dataset.h==='1')===simCfg.handi?'on':'');
    });
    const a=sh.querySelector('[data-all]'); if(a) a.onclick=()=>{ simCfg.ids=pool.map(p=>p.id); refreshPicks(); };
    const n=sh.querySelector('[data-none]'); if(n) n.onclick=()=>{ simCfg.ids=[]; refreshPicks(); };
    const ga=sh.querySelector('#sgA'); if(ga) ga.onchange=()=>{ simCfg.adv=+ga.value;
      const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML(); };
    const gsz=sh.querySelector('#sgS'); if(gsz) gsz.onchange=()=>{ simCfg.gsize=+gsz.value||0;
      const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML(); };
    const f=sh.querySelector('#simFind');
    if(f) f.oninput=()=>{ simCfg.q=f.value; refreshPicks(); };
    const cx=sh.querySelector('#simClear');
    if(cx) cx.onclick=()=>{ simCfg.q=''; const el=sh.querySelector('#simFind');
      if(el){ el.value=''; el.focus(); } refreshPicks(); };
    const roll=()=>{
      busyOn('대진 뽑는 중…');
      setTimeout(()=>{
        const d=drawOnce({...simCfg, useHandi:simCfg.handi});
        busyOff();
        const out=sh.querySelector('#simOut');
        if(out){
          out.innerHTML=drawResultHTML(d, simCfg)
            + `<button class="btn ghost" id="simAgain" style="margin-top:12px">다시 뽑기</button>`;
          const ag=sh.querySelector('#simAgain'); if(ag) ag.onclick=roll;
          out.scrollIntoView({behavior:'smooth', block:'start'});
        }
      }, 30);
    };
    const go=sh.querySelector('#simGo');
    if(go) go.onclick=roll;
    bindPicks();
  };
  if(host){ sh=host; host.innerHTML=draw(); bind(); return; }
  sh=sheet('대회 시뮬레이터', draw()); bind();
}

function drawResultHTML(d, c){
  const roundName = n => n<=2?'결승':n<=4?'4강':n<=8?'8강':n<=16?'16강':n+'강';
  const nm = p => esc(p.name)+`<i>${p.bu}부</i>`;
  const champLine = p => p ? `<div class="simchamp"><span class="cup">${uiIcon('rank',24)}</span>
      <span class="t"><b>${esc(p.name)}</b><i>${p.bu}부 · Elo ${Math.round(p.r)}</i></span>
      <span class="lab">우승</span></div>` : '';
  const koHTML = ko => {
    if(!ko || !ko.log.length) return '<div class="empty">치를 경기가 없습니다.</div>';
    const by={};
    ko.log.forEach(x=>(by[x.size]=by[x.size]||[]).push(x));
    return Object.keys(by).map(Number).sort((a,b)=>b-a).map(size=>`
      <div class="kor"><div class="ko-h">${roundName(size)}</div>
        ${by[size].map(x=>{
          const W=P(x.win)||{}, L=P(x.lose)||{};
          return `<div class="komat">
            <span class="w">${esc(nameOf(x.win))}<i>${W.bu||'?'}부</i></span>
            <span class="vs">▸</span>
            <span class="l">${esc(nameOf(x.lose))}<i>${L.bu||'?'}부</i></span>
          </div>`;}).join('')}

  };
  if(d.format==='league'){
    return `<hr class="sep">${champLine(d.league[0])}
      <div class="secttl" style="margin-top:14px">풀리그 결과</div>
      <div class="card">${d.league.map((p,i)=>`<div class="gp ${i===0?'adv':''}">
        <span class="rk">${i+1}</span><span class="n">${nm(p)}</span>
        <span class="wl">${p.w}−${p.l}</span></div>`).join('')}</div>`;
  }
  if(d.format==='cup'){
    return `<hr class="sep">${champLine(d.champ)}
      <div class="secttl" style="margin-top:14px">대진 추첨 (${d.seeds.length}명)</div>
      <p class="tiny dim" style="margin:0 0 8px">뽑힌 순서대로 ${roundName(nextPow2(d.seeds.length))}부터 시작합니다. 빈자리는 부전승입니다.</p>
      <div class="card">${koHTML(d.ko)}</div>`;
  }
  const advIds=new Set((d.seeds||[]).map(p=>p.id));
  return `<hr class="sep">${champLine(d.champ)}
    <div class="secttl" style="margin-top:14px">조 편성 · 조별리그</div>
    <p class="tiny dim" style="margin:0 0 8px">조별 인원 ${d.groups.map(g=>g.length).join('·')}명. 각 조 ${d.adv}명이 본선에 오릅니다. 파란색이 진출자입니다.</p>
    <div class="ggrid">${d.groups.map((g,gi)=>`<div class="card gcard">
      <div class="gc-h">${String.fromCharCode(65+gi)}조</div>
      ${g.map((p,i)=>`<div class="gp ${advIds.has(p.id)?'adv':''}">
        <span class="rk">${i+1}</span><span class="n">${nm(p)}</span>
        <span class="wl">${p.w}−${p.l}</span></div>`).join('')}
    </div>`).join('')}</div>
    <div class="secttl" style="margin-top:16px">본선 토너먼트</div>
    <div class="card">${koHTML(d.ko)}</div>`;
}
/* 시즌별 요약 — 한 시즌이 카드 한 장 */
function seasonRowsHTML(id, mode){
  /* 연 시즌과 월 시즌을 한 목록에 섞지 않는다 — 보기(월별/연도별)로 나눈다 */
  const per=S.szPer||'month';
  const yms=seasons().slice().reverse()
    .filter(ym=> per==='year' ? isYearSeason(ym) : !isYearSeason(ym));
  const MIN=st().provisional||0;
  const other = mode==='skill' ? 'form' : 'skill';
  const rankIn=(ym,md)=>{
    const all=standings(ym,md).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    return i<0?0:i+1;
  };
  const out=yms.map((ym,idx)=>{
    const all=standings(ym,mode);
    const me=all.find(r=>r.p.id===id);
    if(!me || !me.g) return '';
    const oth=standings(ym,other).find(r=>r.p.id===id);
    const rank=rankIn(ym,mode);
    const prevYm=yms[idx+1];
    const prev=(prevYm && String(prevYm).length===String(ym).length)?rankIn(prevYm,mode):0;
    const mv=(rank&&prev)?prev-rank:0;
    const ss=seasonStats(id,ym,mode);
    const pct=me.g?Math.round(me.w/me.g*100):0;
    const hiN=ss?(ss.hiW+ss.hiL):0, loN=ss?(ss.loW+ss.loL):0;
    /* 빈 값은 숨기고, 의미 있는 것만 조용한 한 줄로 — 칩 일곱 개는 너무 시끄러웠다 */
    const parts=[];
    parts.push(`<span><i>출석</i><b>${playDaysOf(id, ym)}일</b></span>`);
    if(hiN) parts.push(`<span class="${ss.hiW>ss.hiL?'up':''}"><i>윗부수전</i><b>${ss.hiW}−${ss.hiL}</b></span>`);
    if(loN) parts.push(`<span><i>아랫부수전</i><b>${ss.loW}−${ss.loL}</b></span>`);
    if(ss&&ss.ups) parts.push(`<span class="hot"><i>이변</i><b>${ss.ups}번</b></span>`);
    if(ss&&ss.opps) parts.push(`<span><i>상대</i><b>${ss.opps}명${ss.avgBu?` · 평균 ${ss.avgBu.toFixed(1)}부`:''}</b></span>`);
    if(ss&&ss.best) parts.push(`<span><i>최강 격파</i><b>${esc(nameOf(ss.best.oid))} ${ss.best.bu}부</b></span>`);
    return `<div class="sez ${rank>=1&&rank<=3?'m'+rank:''}">
      <div class="sz-top">
        <div class="sz-rk">${rank?`<span class="rn">${rank}</span><span class="ru">위</span>`
          :`<span class="rn dim">–</span>`}${mv?`<span class="mv ${mv>0?'up':'down'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:''}</div>
        <div class="sz-tt">
          <b>${seasonLabel(ym)}</b>
          <span class="rec"><em>${me.w}−${me.l}</em><i>${pct}%</i></span>
        </div>
        <div class="sz-rt">
          <div class="on"><b>${Math.round(me.r)}</b><span>${MODES[mode].label}</span></div>
          ${oth?`<div class="off"><b>${Math.round(oth.r)}</b><span>${MODES[other].label}</span></div>`:''}
        </div>
      </div>
      <div class="sz-stats">${parts.join('<em>·</em>')}</div>
    </div>`;
  }).filter(Boolean);
  return out.length ? out.join('') : `<div class="empty">아직 시즌 기록이 없습니다.</div>`;
}
/* 대회형 리그 — 시즌표(연 한 줄) 대신 회차별 순위 이력을 보여준다 */

function leagueBreakdown(id){
  const rows={};
  const matches=(S.matches||[]).filter(m=>!m.void && (!st().confirmedOnly || isConfirmed(m))
    && (m.aId===id || m.bId===id));
  matches.forEach(m=>{
    const lg=lgOf(m);

    r.g++;
    if(winnerOf(m)===id) r.w++; else r.l++;

    if(lgIsCup(lg)) r.rounds.add(rdOf(m));

  const order={}; leagues().forEach((x,i)=>order[x.id]=i);

function nemesisPrey(id){
  const by={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const e=expFor(m,id);
    if(e==null) continue;
    const oid=m.aId===id?m.bId:m.aId;
    const b=by[oid]=by[oid]||{oid,n:0,w:0,exp:0};
    b.n++; b.exp+=e; if(winnerOf(m)===id) b.w++;
  }
  const rows=Object.values(by).filter(x=>x.n>=5)
    .map(x=>({...x, rate:x.w/x.n, eRate:x.exp/x.n, dev:(x.w-x.exp)/x.n}));
  return { nem: rows.filter(x=>x.dev<=-0.15).sort((a,b)=>a.dev-b.dev).slice(0,3),
           prey:rows.filter(x=>x.dev>= 0.15).sort((a,b)=>b.dev-a.dev).slice(0,3) };
}

function playerWindowStats(id, days, lg){
  const all=insightMatchesFor(id, lg);
  if(!all.length) return {days, g:0, w:0, l:0, exp:null, edge:null, delta:0, opps:0, playDays:0, base:today(), upset:null};
  const base=(all[all.length-1]||{}).date || today();
  const cut=shiftDate(base, -days+1);
  const ms=all.filter(m=>m.date>=cut && m.date<=base);
  let w=0, l=0, exp=0, en=0, delta=0, dn=0, upset=null;
  const opp=new Set(), play=new Set();
  for(const m of ms){
    const win=winnerOf(m), won=win===id, oid=m.aId===id?m.bId:m.aId;
    if(won) w++; else l++;
    opp.add(oid); play.add(m.date);
    const e=expFor(m,id);
    if(e!=null && Number.isFinite(e)){
      exp+=e; en++;
      if(won && (!upset || e<upset.e)) upset={m,e,oid};
    }
    const d=Number(m.aId===id?m._sA:m._sB);
    if(Number.isFinite(d)){ delta+=d; dn++; }
  }
  if(!dn) delta=deltaOf(id,'skill',days);
  return {days, g:ms.length, w, l, exp:en?exp:null, edge:en?w-exp:null, delta, opps:opp.size, playDays:play.size, base, upset};
}

function playerGoalsHTML(id, lg){

function tightRivals(id){

    .slice(0,3);
}

function clubNewsHTML(){
  const all=(typeof clubScope==='function'?clubScope():liveMatches()).filter(m=>!m.void && winnerOf(m)).slice()
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(all.length<3) return '';
  const latest=(all[all.length-1]||{}).date || today(), cut=shiftDate(latest,-6);
  const ms=all.filter(m=>m.date>=cut && m.date<=latest);
  if(ms.length<3) return '';
  const by={}, pair={}, peakWho=new Set(); let upset=null;
  const add=(id,m,won)=>{
    if(!P(id)) return;
    const b=by[id]=by[id]||{id,g:0,w:0,exp:0,en:0,d:0,opp:0,oppN:0};
    b.g++; if(won) b.w++;
    const e=expFor(m,id);
    if(e!=null && Number.isFinite(e)){ b.exp+=e; b.en++; }
    const d=Number(m.aId===id?m._sA:m._sB);
    if(Number.isFinite(d)) b.d+=d;
    const face=Number(m.aId===id ? m._faceA : m._faceB);
    if(Number.isFinite(face)){ b.opp+=face; b.oppN++; }
  };
  for(const m of ms){
    const win=winnerOf(m), lose=win===m.aId?m.bId:m.aId;
    add(m.aId,m,win===m.aId); add(m.bId,m,win===m.bId);
    const k=[m.aId,m.bId].sort().join('|'), p=pair[k]=pair[k]||{a:m.aId,b:m.bId,n:0,aw:0};
    p.n++; if(win===p.a) p.aw++;
    const e=expFor(m,win);
    if(e!=null && Number.isFinite(e) && (!upset || e<upset.e)) upset={e,w:win,l:lose,d:m.date};
    if(m._peakA) peakWho.add(m.aId); if(m._peakB) peakWho.add(m.bId);
  }
  const people=Object.values(by).filter(x=>x.g>0), stories=[], used=new Set();
  const nm=id=>`<span data-psheet="${id}" role="button">${esc(nameOf(id))}</span>`;
  const addStory=(x)=>{ if(!x || (x.key && used.has(x.key))) return; stories.push(x); if(x.key) used.add(x.key); };
  const leader=people.slice().sort((a,b)=>b.w-a.w || b.g-a.g || nameOf(a.id).localeCompare(nameOf(b.id),'ko'))[0];
  const busy=people.slice().sort((a,b)=>b.g-a.g || b.w-a.w || nameOf(a.id).localeCompare(nameOf(b.id),'ko'))[0];
  const edge=people.filter(x=>x.en>=3).map(x=>({...x,edge:x.w-x.exp})).filter(x=>x.edge>=1)
    .sort((a,b)=>b.edge-a.edge || b.g-a.g)[0];
  const gain=people.filter(x=>x.g>=3 && x.d>=8).sort((a,b)=>b.d-a.d || b.g-a.g)[0];
  const strength=people.filter(x=>x.oppN>=3).map(x=>({...x,avgOpp:x.opp/x.oppN}))
    .sort((a,b)=>b.avgOpp-a.avgOpp || b.g-a.g)[0];
  const hot=Object.values(pair).filter(x=>x.n>=2)
    .sort((a,b)=>b.n-a.n || Math.abs((a.aw/a.n)-0.5)-Math.abs((b.aw/b.n)-0.5))[0];
  addStory(edge && {key:edge.id, tag:'기대 대비', title:nm(edge.id), body:'예상보다 더 많이 이긴 흐름입니다. 단순 다승보다 경기 난도를 함께 반영합니다.', meta:`${edge.w}승 / 기대 ${edge.exp.toFixed(1)}승 · ${insightSigned(edge.edge,1)}`});
  addStory(upset && upset.e<0.35 && {key:upset.w+'|'+upset.l, tag:'이변', title:`${nm(upset.w)} 승리`, body:`${esc(nameOf(upset.l))} 상대로 뒤집은 경기입니다.`, meta:`${fmtDate(upset.d)} · 예상 승률 ${Math.round(upset.e*100)}%`});
  addStory(hot && {key:hot.a+'|'+hot.b, tag:'라이벌', title:`${nm(hot.a)} vs ${nm(hot.b)}`, body:'같은 기간에 반복해서 만난 대진입니다. 다음 만남도 이야기거리가 됩니다.', meta:`${hot.n}경기 · 전적 ${hot.aw}-${hot.n-hot.aw}`});
  addStory(strength && strength.g>=3 && {key:strength.id, tag:'상대강도', title:nm(strength.id), body:'상대 평균 레이팅이 가장 높았습니다. 승패보다 대진 난도를 보여줍니다.', meta:`경기 당시 평균 ${Math.round(strength.avgOpp)} · ${strength.g}경기`});
  addStory(gain && {key:gain.id, tag:'상승', title:nm(gain.id), body:'이번 기간 점수 흐름이 가장 뚜렷했습니다.', meta:`${insightSigned(gain.d,0)}점 · ${gain.g}경기 ${gain.w}승`});
  if(stories.length<3 && leader) addStory({key:leader.id, tag:'다승', title:nm(leader.id), body:'이번 기간 가장 많은 승리를 챙겼습니다.', meta:`${leader.w}승 · ${leader.g}경기`});
  if(stories.length<3 && busy && (!leader || busy.id!==leader.id)) addStory({key:busy.id, tag:'출전', title:nm(busy.id), body:'많이 뛰어야 데이터도 선명해집니다.', meta:`${busy.g}경기 · ${busy.w}승`});
  const focus=stories[0];
  const lead=focus ? `${ms.length}경기 중 가장 볼 만한 포인트는 ${focus.tag}입니다. 아래는 조건을 통과한 이야기만 추렸습니다.`
    : `${ms.length}경기와 ${people.length}명의 참여를 확인했습니다. 아직 뚜렷한 포인트는 적지만 표본이 쌓이면 자동으로 선별됩니다.`;
  return `<div class="card weekbrief">
    <div class="ins-head"><div><div class="secttl">이번 주 리포트</div>
      <p class="tiny dim">승패 확정 경기에서 볼 만한 변화만 골라냅니다.</p></div><span class="digest-range">${fmtDate(cut)}~${fmtDate(latest)}</span></div>
    <p class="digest-lead">${lead}</p>
    <div class="brief-kpis">
      <div><b>${ms.length}</b><span>경기</span></div>
      <div><b>${people.length}</b><span>참여</span></div>
      <div><b>${leader?esc(nameOf(leader.id)):'-'}</b><span>${leader?leader.w+'승':'다승'}</span></div>
      <div><b>${peakWho.size}</b><span>최고점 경신</span></div>
    </div>
    ${stories.length?`<div class="news-grid brief-stories">${stories.slice(0,3).map(x=>`<div class="news-item"><span class="news-tag">${x.tag}</span><b>${x.title}</b><p>${x.body}</p><div class="digest-meta">근거 ${x.meta}</div></div>`).join('')}</div>`:''}
    <p class="tiny dim digest-rule">기대승수와 상대강도는 경기 당시 Elo 기준입니다. 표본이 부족한 항목은 노출하지 않습니다.</p>
  </div>`;
}

/* 맞대결 상세 — 테니스 H2H처럼 두 사람을 고른 뒤에만 자세히 본다 */
function renderH2H(meIdStr, oppId, scopeLg){
  if(scopeLg && scopeLg!==(S.lg||'all'))
    return withLeagueView(scopeLg, ()=>renderH2H(meIdStr, oppId));
  const box=document.getElementById('h2hBox'); if(!box) return;
  if(!oppId){ box.innerHTML=''; return; }
  const a=h2hStats(meIdStr); if(!a) return;
  const o=a.list.find(x=>x.oid===oppId); if(!o){ box.innerHTML=''; return; }
  const g=o.w+o.l, pct=Math.round(o.w/g*100);
  const last=o.hist[0];
  box.innerHTML=`<div class="h2hcard">
    <div class="h2hnum"><b>${o.w}</b><span>−</span><b class="l">${o.l}</b></div>
    <div class="h2hbar"><i style="width:${pct}%"></i></div>
    <div class="split tiny dim" style="margin-top:7px"><span>내 승 ${o.w}</span><span>${esc(nameOf(oppId))} 승 ${o.l}</span></div>
    <div class="split tiny" style="margin-top:12px"><span class="dim">핸디</span>
      <span>${o.handi?`${o.handi.pts}점 ${o.handi.mine?'받음':'줌'}`:'없음'}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">최근 결과</span>
      <span class="form">${o.hist.map(x=>`<span class="${x.w?'w':'l'}" title="${x.d}">${x.w?'W':'L'}</span>`).join('')}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">마지막 경기</span><span>${last?last.d:'-'}</span></div>
  </div>`;
}
/* 내가 지금 갖고 있는 칭호 전부 — 통합과 각 리그, 이번 시즌과 통산을 훑는다.
   끈 칭호도 다시 켤 수 있어야 하니 숨김 설정은 잠시 무시하고 모은다. */
function myTitleKeys(id){
  const keep=S.lg;
  const pObj=P(id), savedHide=pObj&&pObj.hideTitles;
  if(pObj) delete pObj.hideTitles;
  const disp=new Map();                        // titleKey → 화면 표기(리그 이름 포함)
  try{
    for(const lg of ['all', ...leagues().map(x=>x.id)]){
      S.lg=lg; recompute();
      const season = lg!=='all' && lgIsCup(lg) ? String(today()).slice(0,4) : monthOfNow();
      for(const per of ['all', season]){
        const t=playerTitles(per,'skill')[id]||[];
        t.forEach(([x])=>{ const k=titleKey(x); if(!disp.has(k)) disp.set(k,x); });
      }
    }
  } finally {
    if(pObj && savedHide) pObj.hideTitles=savedHide;
    S.lg=keep; recompute();
  }
  return [...disp.entries()];
}

/* 승급 이력 — p.buHist: [{date(발효일), ev(승급전 경기일), from, bu, via}] 날짜 오름차순.
   발효일 이전 경기는 승급 전 부수(from)로 본다. */
function buHistDateOK(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||'') && d<=today(); }
function normBuHist(p){
  return ((p&&p.buHist)||[]).map(x=>{
    const to=x.bu!=null ? x.bu : x.to;
    return {date:String(x.date||'').slice(0,10), ev:String(x.ev||x.date||'').slice(0,10),
      from:+x.from, bu:+to, via:x.via||'승급'};
  }).filter(x=>buHistDateOK(x.date) && Number.isFinite(x.from) && Number.isFinite(x.bu)
    && x.from>=BU_MIN && x.from<=BU_MAX && x.bu>=BU_MIN && x.bu<=BU_MAX && x.from!==x.bu)
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function startBuOf(p){
  const h=normBuHist(p);
  return h.length ? h[0].from : (p&&p.bu);
}
function buOnDateOf(p, date){
  if(!p) return null;
  let bu=startBuOf(p);
  const d=String(date||today()).slice(0,10);
  for(const x of normBuHist(p)){ if(d>=x.date) bu=x.bu; else break; }
  return bu;
}
function buOnDate(id, date){ return buOnDateOf(P(id), date); }
function buForMatch(id, date, lg, rd, tbu){
  const p=P(id), useLg=lg||defLeague();
  const fromInput=tbu && tbu[id]!=null && tbu[id]!=='' ? +tbu[id] : null;
  if(Number.isFinite(fromInput)) return fromInput;
  const fromRound=rd ? rdBu(useLg, rd, id) : null;
  if(fromRound!=null && fromRound!=='') return +fromRound;
  const fromDate=buOnDate(id, date);
  return fromDate!=null ? +fromDate : (p?+p.bu:null);
}
function handiForMatch(aId, bId, date, lg, rd, opts){
  const useLg=lg||defLeague(), tbu=opts&&opts.tbu, hb=opts&&opts.hb;
  const ba=buForMatch(aId, date, useLg, rd, tbu), bb=buForMatch(bId, date, useLg, rd, tbu);
  if(!Number.isFinite(ba) || !Number.isFinite(bb) || ba===bb) return null;
  const toId=ba>bb?aId:bId, giver=toId===aId?bId:aId;
  const bonus=hb && giver ? (+hb[giver]||0) : 0;
  return {toId, pts:handiPtsIn(ba, bb, useLg, bonus)};
}
function sameHandi(a,b){
  if(!a && !b) return true;
  if(!a || !b) return false;
  return a.toId===b.toId && (+a.pts||0)===(+b.pts||0);
}
function matchHandiForCurrentRules(m){
  if(!m || m.void) return null;
  const lg=lgOf(m), rd=rdOf(m), meta=rd ? (rdMeta(lg,rd)||{}) : {};
  return handiForMatch(m.aId, m.bId, m.date, lg, rd, {tbu:meta.bu, hb:meta.hb});
}
async function refreshHandiForPlayer(id){
  const updates=[];
  for(const m of (S.matches||[])){
    if(!m || m.void || (m.aId!==id && m.bId!==id)) continue;
    const hd=matchHandiForCurrentRules(m);
    if(sameHandi(m.handi||null, hd)) continue;
    updates.push({...m, handi:hd, exp:null, rev:(m.rev||0)+1,
      editedBy:(S.me&&S.me.id)||'system', editedAt:new Date().toISOString()});
  }
  if(!updates.length) return 0;
  return await pushMatches(updates, `${updates.length}경기 핸디 재계산 중…`) ? updates.length : -1;
}
function rebuildBuHist(p, hist, startBu){
  let cur=+startBu;
  const out=[], seen=new Set();
  if(!Number.isFinite(cur) || cur<BU_MIN || cur>BU_MAX) cur=+p.bu || BU_MAX;
  hist.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).forEach(x=>{
    const d=String(x.date||'').slice(0,10), to=+(x.bu!=null?x.bu:x.to);
    if(!buHistDateOK(d) || seen.has(d) || !Number.isFinite(to) || to<BU_MIN || to>BU_MAX || cur===to) return;
    seen.add(d);
    out.push({date:d, ev:String(x.ev||d).slice(0,10), from:cur, bu:to, via:x.via||'승급'});
    cur=to;
  });
  p.bu=cur;
  if(out.length) p.buHist=out; else delete p.buHist;
}
function addBuChange(p, date, fromBu, toBu, via){
  const d=String(date||'').slice(0,10), from=+fromBu, to=+toBu;
  if(!buHistDateOK(d) || !Number.isFinite(from) || !Number.isFinite(to) || from<BU_MIN || from>BU_MAX || to<BU_MIN || to>BU_MAX || from===to) return false;
  const hist=normBuHist(p);
  let start=hist.length ? hist[0].from : from;
  if(!hist.length || d<hist[0].date) start=from;
  const next=hist.filter(x=>x.date!==d);
  next.push({date:d, ev:d, bu:to, via:via||'외부 승급'});
  rebuildBuHist(p, next, start);
  return true;
}
function removeBuChange(p, date){
  const hist=normBuHist(p);
  if(!hist.length) return false;
  rebuildBuHist(p, hist.filter(x=>x.date!==date), hist[0].from);
  return true;
}
function buHistAdminHTML(p){
  const h=normBuHist(p);
  if(!h.length) return `<p class="tiny dim" style="margin:8px 2px 0">아직 부수 변경 이력이 없습니다.</p>`;
  return `<div class="card" style="margin-top:10px">
    ${h.map(x=>`<div class="hof">
      <span class="md">${x.from}&rarr;${x.bu}</span>
      <span class="nm">${esc(x.via||'외부 승급')}<i>${fmtDate(x.date)}</i></span>
      <span class="rt"><button class="btn ghost sm" style="width:auto;padding:6px 10px" data-buhdel="${esc(x.date)}">삭제</button></span>
    </div>`).join('')}
  </div>`;
}
/* 부수별 성적 — 승급 전 기록과, 대회형 리그에서 그날그날 다른 부수로 뛴 기록.
   어느 부수로 뛰었을 때 잘했는지 따로 본다. */
function buSplit(id){
  const by={};
  (S._sorted||[]).forEach(m=>{
    if(m.aId!==id && m.bId!==id) return;
    const lg=lgOf(m);
    const bu = (lgIsCup(lg) ? rdBu(lg, rdOf(m), id) : null) || buOnDate(id, m.date);
    if(bu==null) return;
    const b=by[bu]=by[bu]||{bu, g:0, w:0, l:0, lgs:new Set()};
    b.g++; b.lgs.add(lg);
    if(winnerOf(m)===id) b.w++; else b.l++;
  });
  return Object.values(by).sort((a,b)=>a.bu-b.bu);
}
function buSplitHTML(id){
  const rows=buSplit(id);
  if(rows.length<2) return '';                 // 늘 같은 부수로 뛰었으면 보여줄 게 없다
  const p=P(id)||{}, reg=p.bu;
  const past=new Set(normBuHist(p).map(h=>h.from));   // 승급 전에 거쳐온 부수들
  const best=rows.reduce((a,b)=> (b.g>=3 && (b.w/b.g) > (a?a.w/a.g:-1)) ? b : a, null);
  return `<div class="secttl" style="margin-top:18px">부수별 성적</div>
    <p class="tiny dim" style="margin:0 0 8px">승급 전 기록과 회차마다 다른 부수로 뛴 기록을 나눠 봅니다. 지금은 ${reg}부입니다.</p>
    <div class="card">${rows.map(r=>{
      const pct=r.g?Math.round(r.w/r.g*100):0;
      const tag = r.bu===reg ? '지금 부수'
        : r.bu<reg ? '윗 부수'
        : past.has(r.bu) ? '승급 전' : '아랫 부수';
      return `<div class="hof ${best&&best.bu===r.bu?'m1':''}">
        <span class="md">${r.bu}부</span>
        <span class="nm">${tag}
          <i>${r.g}경기</i></span>
        <span class="rt">${r.w}−${r.l}<em>${pct}%</em></span>
      </div>`;}).join('')}</div>`;
}
/* 승급 여정 — 언제 어떤 승급전에서 올라왔는지, 그 부수 시절 전적과 함께 */
function buHistHTML(id){
  const p=P(id), h=p?normBuHist(p):[]; if(!h.length) return '';
  const split=buSplit(id);
  const recOf=bu=>{ const r=split.find(x=>x.bu===bu); return r?`${r.w}승 ${r.l}패`:''; };
  return `<div class="secttl" style="margin-top:18px">승급 여정</div>
    <div class="card">
      ${h.map(x=>`<div class="hof">
        <span class="md">${x.from}→${x.bu}</span>
        <span class="nm">${esc(x.via||'승급')}<i>${fmtDate(x.ev||x.date)}</i></span>
        <span class="rt">${recOf(x.from)||' '}<em>${x.from}부 시절</em></span>

      <p class="tiny dim" style="margin:8px 2px 0">승급 전 경기는 당시 부수 기준 핸디로 기록되어 있습니다.</p>
    </div>`;
}

function entryDiagHTML(){
  const {cnt, exp, act} = entryAccuracy();
  if(cnt<40) return `<p class="tiny dim" style="margin:0 2px 12px">새 회원 첫 10경기 표본이 ${cnt}건입니다. 40건은 넘어야 시작 레이팅이 맞는지 판단할 만합니다.</p>`;
  const diff = act-exp, per100 = diff/cnt*100;
  const verdict = per100 <= -6 ? '새 회원의 시작 레이팅이 후한 편입니다. 부수를 실제보다 높게 잡고 있거나 부수당 레이팅이 큽니다. 이대로면 기존 회원 점수가 조금씩 올라갑니다.'
                : per100 >= 6 ? '새 회원의 시작 레이팅이 박한 편입니다. 새로 들어온 분들이 예상보다 잘 치고 있습니다.'
                : '새 회원의 시작 레이팅이 실제와 잘 맞습니다.';
  return `<div class="notice ${Math.abs(per100)>=6?'warn':''}" style="margin:0 0 12px">
    새 회원 첫 10경기 ${cnt}건 · 기대 ${exp.toFixed(1)}승 vs 실제 ${act}승 (100경기당 ${diff>0?'+':''}${per100.toFixed(1)})<br>${verdict}</div>`;
}

async function reassignEntrant(fromId, toId){
  let n=0;
  if(FB){
    const updates=S.matches.filter(m=>m.enteredBy===fromId).map(m=>{
      n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(updates.length) applyMatches(await fbSaveMatches(updates));
    return n;
  }
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

/* ── 밴드 연동 ──────────────────────────────────────────────
   밴드 댓글은 "@이름 @이름 님 상대 승" 형태다.
   같은 상대와 여러 판이면 "@이름 ×2" 로 적는다. */
const bandNorm = n => String(n||'').replace(/\([^)]*\)/g,'').replace(/님$/,'').trim();
const bandLabel = p => (p && (p.bandName || p.name)) || '';
/* 한 줄 안에 승과 패가 같이 있을 수 있다.
   '@A 상대 패 @B @C 님 상대 승' → A는 패, B·C는 승.
   승/패 표시가 나올 때마다 그 앞의 이름들을 묶는다. */
function parseResultLine(line){
  const out=[];
  const re=/@([^\s@×xX*]+(?:\([^)]*\))?)|(승|패)/g;
  let m, buf=[];
  while((m=re.exec(line))){
    if(m[1]){ const raw=String(m[1]).trim(); const name=bandNorm(raw); if(name) buf.push({raw,name}); }
    else if(buf.length){
      const r = m[2]==='승' ? 'W' : 'L';
      buf.forEach(x=>out.push({...x, r}));
      buf=[];
    }
  }
  return out;
}
function parseBandText(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    parseResultLine(line).forEach(x=>rows.push(x));
  }
  const seen={};
  return rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; });
}
/* 댓글 전체를 붙여넣었을 때 — 글쓴이별로 나눠서 읽는다 */
const BAND_NOISE=/^(표정짓기|답글쓰기|댓글\s*(수정|삭제|신고)|더보기|수정됨|신고|번역|공유하기|좋아요)$/;
const BAND_TIME=/^(?:(\d{1,2})월\s*(\d{1,2})일)?\s*(?:오전|오후)?\s*\d{1,2}:\d{2}/;
function parseBandThread(text, year){
  const Y = year || +today().slice(0,4);
  const out=[]; let cur=null;
  const push=()=>{ if(cur && cur.rows.length) out.push(cur); cur=null; };
  for(const raw of String(text||'').split(/\n+/)){
    let line=raw.trim(); if(!line) continue;
    /* [멤버](주소)홍길동 → 홍길동 */
    line=line.replace(/^\[[^\]]*\]\([^)]*\)\s*/, '');
    if(!line || BAND_NOISE.test(line)) continue;
    const t=line.match(BAND_TIME);
    if(t){                                        // 시각 줄 — 한 사람 댓글이 끝난 자리
      if(cur && t[1]) cur.date=`${Y}-${String(+t[1]).padStart(2,'0')}-${String(+t[2]).padStart(2,'0')}`;
      push(); continue;
    }
    if(line.includes('@')){
      if(!cur) continue;                          // 글쓴이를 아직 모르면 건너뛴다
      parseResultLine(line).forEach(x=>cur.rows.push(x));
      continue;
    }
    /* 남은 건 글쓴이 이름 */
    push();
    cur={author:line, authorNorm:bandNorm(line), date:null, rows:[]};
  }
  push();
  /* 같은 사람이 같은 상대를 두 번 적었으면 한 번만 */
  out.forEach(c=>{ const seen={};
    c.rows=c.rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; }); });
  return out;
}
/* 한 번 알려준 밴드 이름은 선수에 별칭으로 남겨두고 다음부터 자동으로 맞춘다 */
function matchPlayerByName(raw){
  const r=String(raw||'').trim(), n=bandNorm(r);
  if(!n) return null;
  const A=x=>x.aliases||[];
  let p = S.players.find(x=>x.bandName===r)
       || S.players.find(x=>A(x).includes(r))
       || S.players.find(x=>x.name===n)
       || S.players.find(x=>A(x).some(a=>bandNorm(a)===n))
       || S.players.find(x=>bandNorm(x.name)===n);
  if(p) return p;
  const cands=S.players.filter(x=>x.name.startsWith(n)||n.startsWith(x.name));
  if(cands.length===1) return cands[0];
  /* 대진표 머리글처럼 이름 뒷부분만 적힌 경우 — '주형' → '이주형' */
  if(n.length>=2){
    const tail=S.players.filter(x=>x.name.endsWith(n));
    if(tail.length===1) return tail[0];
  }
  return null;
}

async function learnAliases(pairs){          // [{pid, raw}]
  const need=pairs.filter(({pid,raw})=>{
    const p=P(pid); if(!p || !raw) return false;
    return p.bandName!==raw && !(p.aliases||[]).includes(raw);
  });
  if(!need.length) return;
  await savePlayers(map=>{
    for(const {pid,raw} of need){
      const x=map.get(pid); if(!x) continue;
      x.aliases=[...new Set([...(x.aliases||[]), raw])].slice(0,6);
      if(!x.bandName) x.bandName=raw;         // 내보낼 때 쓸 대표 이름
    }
  });
}

      <div class="field"><label>밴드 댓글</label>

            : '@최종우 @안치훈 님 상대 패&#10;@홍은기 @정종연 님 상대 승'}">${esc(bandImp.text)}</textarea></div>
      <button class="btn ghost" id="biParse">읽어들이기</button>
      ${bandImp.mode==='all'&&bandImp.thread?threadPreviewHTML():''}
      ${rows?`
        <hr class="sep">
        <div class="secttl">알아본 이름 ${known.length}개</div>
        ${known.length?known.map(r=>{const p=matchPlayerByName(r.raw);
          return `<div class="split tiny" style="padding:5px 0">
            <span>${esc(r.raw)}${r.raw!==p.name?` <span class="dim">→ ${esc(p.name)}</span>`:''}</span>
            <span class="${r.r==='W'?'up':'down'}">${r.r==='W'?'승':'패'}</span></div>`;}).join('')
          :`<div class="tiny dim">알아본 이름이 없습니다.</div>`}
        ${unknown.length?`
          <hr class="sep">
          <div class="secttl" style="color:var(--warn)">누구인지 알려주세요 · ${unknown.length}개</div>
          ${unknown.map(r=>{ const i=rows.indexOf(r); const fx=bandImp.fix[i]||'';
            const hit=dirLookup(r.raw);
            if(hit && bandImp.bu[i]==null) bandImp.bu[i]=hit.bu;
            return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
              <div class="split tiny" style="margin-bottom:6px">
                <b style="font-size:14px">${esc(r.raw)}</b>
                <span class="${r.r==='W'?'up':'down'}">${r.r==='W'?'승':'패'}</span></div>
              ${hit ? (hit.ambiguous
                ? `<div class="dirhit warn">명단에 같은 이름이 ${hit.cand.length}명 있습니다 ·
                     ${hit.cand.map(c=>`<b>${esc(c.name)} ${c.bu}부</b>`).join(' / ')}
                     ${isAdmin()?hit.cand.map(c=>`<button class="btn ghost sm" data-dirnew="${i}" data-dirbu="${c.bu}">${c.bu}부로 추가</button>`).join(''):''}</div>`
                : `<div class="dirhit">동호회 명단에 <b>${esc(hit.as)}</b> · <b>${hit.bu}부</b>
                     ${isAdmin()?`<button class="btn ghost sm" data-dirnew="${i}" data-dirbu="${hit.bu}">이 부수로 추가</button>`:''}</div>`) : ''}
              <div class="row">
                <div style="flex:1;min-width:0">
                  ${fx==='__new__'
                    ? `<div class="cbpicked">새 선수로 추가 <button class="btn ghost sm" data-fixclr="${i}">바꾸기</button></div>`
                    : comboHTML('fix'+i, fx, {clearable:true, placeholder:'이름 검색  예) 홍길동, ㅎㄱㄷ'})}
                </div>
                ${fx==='__new__'?buSelectHTML('', bandImp.bu[i]||7, {class:'narrow', attrs:`data-newbu="${i}"`}):''}
              </div></div>`;}).join('')}
          <p class="tiny dim" style="margin:8px 2px 0">한 번 알려주면 그 이름을 기억해서 다음부터는 자동으로 맞춥니다. 내보낼 때도 이 이름으로 나갑니다.</p>
        `:''}
        <button class="btn" id="biGo" style="margin-top:14px">경기 등록</button>
      `:''}`;
  };
  const rebind=()=>{
    const bd=sh.querySelector('#biDate');
    if(bd) bd.onchange=e=>{ if(dateOK(e.target.value)) bandImp.date=e.target.value;
      else { e.target.value=bandImp.date; toast('입력할 수 없는 날짜입니다.',1);} };
    const bm=sh.querySelector('#biMe'); if(bm) bm.onchange=e=>{ bandImp.meId=e.target.value; };
    const tx=sh.querySelector('#biTxt'); if(tx) tx.oninput=e=>{ bandImp.text=e.target.value; };
    sh.querySelectorAll('[data-bim]').forEach(b=>b.onclick=()=>{
      bandImp.mode=b.dataset.bim; bandImp.rows=null; bandImp.thread=null; redraw(); });
    const bp=sh.querySelector('#biParse');
    if(bp) bp.onclick=()=>{
      bandImp.text=(sh.querySelector('#biTxt').value||'');
      if(bandImp.mode==='all'){
        const cs=parseBandThread(bandImp.text);
        if(!cs.length) return toast('글쓴이와 승패 줄을 찾지 못했습니다.',1);
        bandImp.thread=cs; bandImp.rows=null; redraw(); return;
      }
      const rows=parseBandText(bandImp.text);
      if(!rows.length) return toast('읽을 내용을 찾지 못했습니다. 줄에 승 또는 패가 있어야 합니다.',1);
      bandImp.rows=rows; bandImp.fix={}; bandImp.q={}; redraw();
    };
    /* 등록 안 된 이름을 바로 선수로 추가한다 */
    sh.querySelectorAll('[data-thnew]').forEach(el=>el.onclick=async()=>{
      if(!isAdmin()) return toast('관리자만 추가할 수 있습니다.',1);
      const nm=el.dataset.thnew;
      const sel=sh.querySelector(`[data-thbusel="${nm.replace(/"/g,'\\"')}"]`);
      const bu=+(el.dataset.thbu || (sel && sel.value) || 7);
      const np=await addQuickPlayer(nm, bu, '밴드 댓글에서'); if(!np) return;
      toast(`${np.name} ${bu}부로 추가했습니다.`);
      redraw();
    });
    /* 댓글 전체를 한 번에 저장 */
    const sa=sh.querySelector('#biSaveAll');
    if(sa) sa.onclick=async()=>{
      const cs=bandImp.thread||[];
      let created=0, merged=0, skipped=0, miss=0;
      for(const c of cs){
        const me=matchPlayerByName(c.author);
        if(!me){ miss+=c.rows.length; continue; }
        const picks={};
        c.rows.forEach(r=>{ const p=matchPlayerByName(r.raw);
          if(!p || p.id===me.id){ miss++; return; }
          picks[p.id]={r:r.r, n:1}; });
        if(!Object.keys(picks).length) continue;
        const res=await planAndSave(c.date||bandImp.date, me.id, picks, bandImp.lg||defLeague());
        if(!res) return errorSheet('저장하지 못했습니다','댓글을 등록하는 중 문제가 생겼습니다.');
        created+=res.created; merged+=res.merged; skipped+=res.skipped;
      }
      audit('밴드 댓글 일괄', `등록 ${created} / 합침 ${merged} / 건너뜀 ${skipped+miss}`);
      sh.remove(); bandImp=null; render();
      const dup=skipped+miss;
      toast(`${created}경기 등록${dup?` · 양쪽이 적은 ${dup}건은 하나로 정리`:''}`);
    };
    /* 이름으로 후보 좁히기 — 목록만 갈아끼워야 한글 입력이 끊기지 않는다 */
    bindCombo(sh, 'biMe', id=>{ bandImp.meId=id; });
    (bandImp.rows||[]).forEach((r,i)=>{
      bindCombo(sh, 'fix'+i, id=>{
        if(id) bandImp.fix[i]=id; else { delete bandImp.fix[i]; delete bandImp.bu[i]; }
        redraw();
      },
        isAdmin()?[{id:'__new__', label:'새 선수로 추가'}]:[],
        {clearable:true});
    });
    sh.querySelectorAll('[data-fixclr]').forEach(el=>el.onclick=()=>{
      const i=+el.dataset.fixclr; delete bandImp.fix[i]; delete bandImp.bu[i]; redraw();
    });
    sh.querySelectorAll('[data-dirnew]').forEach(el=>el.onclick=()=>{
      const i=+el.dataset.dirnew;
      bandImp.fix[i]='__new__'; bandImp.bu[i]=+el.dataset.dirbu; redraw();
    });
    sh.querySelectorAll('[data-newbu]').forEach(el=>el.onchange=()=>{ bandImp.bu[+el.dataset.newbu]=el.value; });
    const go=sh.querySelector('#biGo'); if(go) go.onclick=doBandImport;
  };
  const redraw=()=>{ sh.remove(); sh=sheet('밴드 글에서 가져오기', draw()); rebind(); };
  sh=sheet('밴드 글에서 가져오기', draw()); rebind();

  async function doBandImport(){
    if(S.busy) return;
    const date=bandImp.date, meIdStr=bandImp.meId, rows=bandImp.rows||[];
    if(!dateOK(date)) return toast('입력할 수 없는 날짜입니다.',1);
    const picks={}, learn=[]; let added=0;
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      let p=matchPlayerByName(r.raw);
      let explicit=false;
      if(!p){
        const fx=bandImp.fix[i];
        if(!fx) continue;
        explicit=true;
        if(fx==='__new__'){
          if(!isAdmin()) continue;
          const exist=S.players.find(x=>x.name===bandNorm(r.raw));
          if(exist) p=exist;
          else{
            const np={ id:uid('p'), name:bandNorm(r.raw), bu:+(bandImp.bu[i]||7), hand:'R', bio:'',
                       bandName:r.raw, aliases:[r.raw], pinHash:await defPin(), role:'member', active:true,
                       joinedAt:new Date().toISOString(), addedBy:S.me.id };
            if(!await savePlayers(map=>map.set(np.id,np)))
              return errorSheet('저장하지 못했습니다','새 선수를 추가하는 중 문제가 생겼습니다.');
            p=P(np.id); added++;
          }
        } else p=P(fx);
      }
      if(!p || p.id===meIdStr) continue;
      if(explicit || r.raw!==p.name) learn.push({pid:p.id, raw:r.raw});
      picks[p.id]={r:r.r, n:1};
    }
    if(!Object.keys(picks).length) return toast('등록할 경기가 없습니다.',1);
    sh.remove();
    S.busy=true; busyOn('정리하는 중…');
    await learnAliases(learn);
    const res=await planAndSave(date, meIdStr, picks, bandImp.lg||defLeague());
    S.busy=false; busyOff();
    if(!res.ok) return errorSheet('저장하지 못했습니다','밴드 글에서 읽은 경기를 저장하지 못했습니다.');
    audit('밴드 가져오기', `${nameOf(meIdStr)} · ${date} · 등록 ${res.created} / 합침 ${res.merged} / 건너뜀 ${res.skipped}`);
    bandImp=null; render();
    const parts=[];
    if(res.created) parts.push(`${res.created}건 등록`);
    if(res.merged)  parts.push(`${res.merged}건 합침`);
    if(res.skipped) parts.push(`${res.skipped}건 건너뜀`);
    if(added) parts.push(`선수 ${added}명 추가`);
    if(learn.length) parts.push(`이름 ${learn.length}개 기억`);
    toast(parts.join(' · ')||'등록할 경기가 없었습니다.');
  }
}
/* 확인 대기 처리 — 맞으면 확인, 아니면 반려 */
function confirmQueue(){
  const list=pendingForMe();
  if(!list.length) return toast('확인할 경기가 없습니다.');
  const sh=sheet(`확인 대기 ${list.length}건`, `
    <p class="tiny dim">상대가 올린 경기입니다. 맞으면 확인, 기억과 다르면 반려하세요. 확인해야 랭킹에 반영됩니다.</p>
    <div id="pendList" style="margin-top:12px">
      ${list.map(m=>{
        const win=winnerOf(m), iWon=win===S.me.id, opp=iWon?loserOf(m):win;
        return `<div class="pndc" id="pc_${m.id}">
          <div class="pw ${iWon?'w':'l'}">${iWon?'내 승':'내 패'}</div>
          <div class="pi"><b>${esc(nameOf(opp))}</b><small>${dateLabel(m.date)}${
            m.handi&&m.handi.pts?` · 핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}`:''}</small></div>
          <div class="pb">
            <button class="btn sm" data-yes="${m.id}">확인</button>
            <button class="btn ghost sm" data-no="${m.id}">반려</button>
          </div></div>`;
      }).join('')}
    </div>`);
  const refresh=()=>{ sh.remove(); render(); if(pendingForMe().length) confirmQueue(); else toast('확인 대기가 모두 처리됐습니다.'); };
  sh.querySelectorAll('[data-yes]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.yes); if(!m) return;
    const ok=await commitMatch({...m, confirmedBy:[...new Set([...(m.confirmedBy||[]),S.me.id])],
                                status:'confirmed', rev:(m.rev||0)+1});
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 확인', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`);
    refresh();
  });
  sh.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.no); if(!m) return;
    const ok=await deleteMatchById(m.id);
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 반려', `${nameOf(m.enteredBy)} 입력분 (${m.date})`);
    refresh();
  });
}

  };
  m.querySelector('#pmAct').onclick=async()=>{

    audit('선수 삭제', `${p.name} (경기 ${removed}건 제외)`);

  };
}
/* 같은 날 · 같은 두 사람 · 같은 승자 = 중복 의심.
   누가 넣었는지, 확정됐는지는 따지지 않는다. 진짜 두 판 쳤을 수도 있으니 판단은 사람이 한다. */
function findDuplicates(){
  const live=S.matches.filter(m=>!m.void);
  const by={};
  live.forEach(m=>{
    /* 대회의 본선·번외 경기(br)는 같은 날 조별리그에서 붙었던 상대와 다시 붙는
       재대결이라 중복이 아니다 — 어느 대진의 경기인지까지 같아야 중복으로 본다 */
    const br=m.br ? 'br:'+[m.br.node||'', m.br.kind||'', m.br.order!=null?m.br.order:'', m.br.label||''].join(':') : '';
    const k=[m.aId,m.bId].sort().join('|')+'|'+m.date+'|'+winnerOf(m)+'|'+lgOf(m)+'|'+br;
    (by[k]=by[k]||[]).push(m);
  });
  const out=[];
  Object.values(by).forEach(g=>{
    if(g.length<2) return;
    /* 넣은 순서대로 두고, 앞의 것을 남기고 뒤의 것을 지우게 한다 */
    g.sort((x,y)=>String(x.enteredAt||'').localeCompare(String(y.enteredAt||'')));
    for(let i=1;i<g.length;i++) out.push({a:g[0], b:g[i], n:g.length});
  });
  return out;
}

/* ── 시트 / 확인 ── */
function sheet(title, html, footer){
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="sheet">
    <div class="sh-bar ${title?'':'bare'}"><div class="grip"></div>
      ${title?`<h3>${esc(title)}</h3>`:''}
      <button class="sh-x" aria-label="닫기">✕</button></div>
    ${html}${footer||''}</div>`;
  const onKey=e=>{ if(e.key==='Escape') close(); };
  const close=()=>{ if(!mask.isConnected) return;
    mask.classList.add('out'); setTimeout(()=>mask.remove(), 140); };
  mask.close=close;
  mask.onclick=e=>{ if(e.target===mask) close(); };            // 바깥을 눌러도 닫힌다
  mask.querySelector('.sh-x').onclick=close;
  window.addEventListener('keydown', onKey);
  /* 시트가 떠 있는 동안 뒷화면이 같이 밀리지 않게 잠근다 */
  const lockY = window.scrollY || 0;
  const openCount = (S._sheets = (S._sheets||0) + 1);
  if(openCount===1){
    document.body.style.position='fixed';
    document.body.style.top = (-lockY)+'px';
    document.body.style.left='0'; document.body.style.right='0';
    document.body.style.width='100%';
    S._lockY = lockY;
  }
  const origRemove=mask.remove.bind(mask);
  mask.remove=()=>{
    window.removeEventListener('keydown', onKey);
    S._sheets = Math.max(0, (S._sheets||1) - 1);
    if(S._sheets===0){
      document.body.style.position='';
      document.body.style.top=''; document.body.style.left='';
      document.body.style.right=''; document.body.style.width='';
      window.scrollTo(0, S._lockY||0);
    }
    origRemove();
  };
  /* 위에서 아래로 밀어서 닫기 — 시트가 맨 위로 올라와 있을 때만 */
  const box=mask.querySelector('.sheet');
  let y0=null, dy=0;
  box.addEventListener('touchstart', e=>{ if(box.scrollTop>0){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; }, {passive:true});
  box.addEventListener('touchmove', e=>{ if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){ box.style.transition='none'; box.style.transform='translateY('+dy+'px)'; }
  }, {passive:true});
  box.addEventListener('touchend', ()=>{ if(y0==null) return;
    box.style.transition='transform .16s ease';
    if(dy>90) close(); else box.style.transform='';
    y0=null; });
  document.body.appendChild(mask);
  hydrateCardPhotos(mask).catch(()=>{});
  return mask;
}
function confirmSheet(title, html, okLabel, fn){
  const m=sheet(title,`<p class="tiny" style="line-height:1.7;color:var(--mut)">${html}</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" data-no>취소</button><button class="btn" data-yes>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-no]').onclick=()=>m.remove();
  m.querySelector('[data-yes]').onclick=async()=>{ m.remove(); await fn(); };
}

/* ─────────────────────────── 부팅 ─────────────────────────── */
try{ document.title='탁동 랭킹'; }catch(e){}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
/* 내가 쓴 뒤 남기는 신호 — 다른 기기만 이걸 보고 새로고침한다 */
function bumpSig(){ if(FB) FB.set('sig', {t:Date.now(), by:CLIENT}).catch(()=>{}); }
/* 새 확인 요청이 들어오면 화면에서만 알린다 (브라우저 알림은 쓰지 않는다) */
function notifyPending(added){ toast(`확인할 경기 ${added}건이 새로 들어왔습니다.`); }
/* 다른 사람이 경기를 넣으면 알아서 새로고침 — 입력 중일 때는 건드리지 않는다 */
function watchRemote(){
  if(!FB) return;
  let t=null, first=true;
  FB.watch(sig=>{
    if(first){ first=false; return; }
    if(sig && sig.by===CLIENT) return;          // 내가 쓴 변경은 이미 화면에 반영돼 있다
    clearTimeout(t);
    t=setTimeout(async()=>{
      if(S.busy) return;
      const a=document.activeElement;
      if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;   // 입력 중이면 다음 기회에
      if(document.querySelector('.mask')) return;                     // 확인창 떠 있으면 대기
      const before = pendingForMe().length;
      await loadFresh();
      if(S.me){ const me=P(S.me.id); if(me) S.me=me; }
      const after = pendingForMe().length;
      if(after>before) notifyPending(after-before);
      softRender();
    }, 500);
  });
}
(async()=>{
  const homeLogo=$('#homeLogo');
  if(homeLogo) homeLogo.onclick=goRankHome;
  resultRoute=readResultRoute();S.tab=resultRoute.tab;
  if(S.tab==='stat'){S.statTab=resultRoute.section||'personal';S.analysisId=resultRoute.player||'';S.analysisRange=resultRoute.range||'30';S.analysisOpponent=resultRoute.opponent||'';}
  if(S.tab!=='home')S.lg=resultRoute.league;
  render();
  const connection=initFirebase();
  await defPin();

  /* 1) 캐시가 있으면 네트워크를 기다리지 않고 바로 보여준다 */
  const cached = await loadCache();
  if(cached && cached.players){
    S.meta = normalizeMeta(cached.meta).meta;
    S.players = cached.players || [];
    S.matches = cached.matches || [];
    if(cached.sync && cached.sync.lastKey) localSet(SYNC_KEY, cached.sync);
    refreshLoadedRatings();
    const ses0 = await sGet(KEY.session,false);
    if(ses0 && ses0.playerId){ const p=P(ses0.playerId); if(p && p.active!==false) S.me=p; }
    S.ready = true; S.stale = true;
    render();
  }

  /* 2) 최신 데이터를 받아 갱신한다 */
  FB = await connection;
  S.connecting = false;
  await loadFresh();
  if(!S.matches.length) await migrateShards();      // 예전 저장 방식이 남아 있을 때만
  if(S.matches.length===0 && FB) await loadAll();
  const ses = await sGet(KEY.session,false);
  if(ses && ses.playerId){
    const p=P(ses.playerId);
    if(p && p.active!==false){ S.me=p; sSet(KEY.session,{playerId:p.id, at:Date.now()},false); }
    else if(!p){ S.me=null; sDel(KEY.session,false); }     // 계정이 지워진 경우
  }
  S.ready = true; S.stale = false;
  softRender();
  const np = pendingForMe().length;
  if(np) setTimeout(()=>toast(`확인할 경기가 ${np}건 있습니다.`), 700);
  watchRemote();
})();
