.atk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.atk.lv1::before{background:#c58b52}.atk.lv2::before{background:#c2ccd7}
.atk.lv3::before{background:#e8c25e}.atk.lv4::before{background:#a8e6ef}
.atk.lv5::before{background:#9fd4ff}
.atk.max{border-color:rgba(232,194,94,.45);
  background:linear-gradient(150deg,rgba(232,194,94,.14),rgba(255,255,255,.02))}
.ah{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ah .nm{flex:1;min-width:0}
.ah .nm b{display:block;font-size:13.5px;font-weight:700}
.ah .nm i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:2px}
.ah .lvb{flex:none;font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--dim);
  background:rgba(255,255,255,.07);border-radius:20px;padding:3px 8px;font-variant-numeric:tabular-nums}
.atk.max .lvb{color:#1b2026;background:linear-gradient(150deg,#ffe9a8,#e8c25e)}
.pips{display:flex;gap:3px;margin-bottom:6px}
.pip{flex:1;text-align:center;font-size:9px;font-weight:700;padding:3px 0;border-radius:5px;
  background:rgba(255,255,255,.04);color:var(--dim);font-variant-numeric:tabular-nums}
.pip.on{background:rgba(232,194,94,.18);color:#f2dea2}
.abar{height:5px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden}
.abar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6fd0ff);
  transition:width .4s ease}
.atk.max .abar i{background:linear-gradient(90deg,#e8c25e,#ffe9a8)}
.af{display:flex;justify-content:space-between;gap:8px;margin-top:6px;
  font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.af span:first-child{color:var(--mut);font-weight:700}
.ax{margin-top:5px;font-size:10px;color:#8fc8ee}
.sos{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg2);margin-bottom:8px}
.sos .big{flex:none;font-size:24px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.sos .tx b{display:block;font-size:13.5px;font-weight:700}
.sos .tx i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:2px}
.sos.hi{border-color:rgba(63,191,143,.3);background:rgba(63,191,143,.08)}
.sos.hi .big{color:#8fe0c2}
.sos.lo{border-color:rgba(224,75,63,.28);background:rgba(224,75,63,.07)}
.sos.lo .big{color:#f0968e}
.sos.ok .big{color:var(--mut)}
.sosr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 0;
  font-size:12.5px;font-variant-numeric:tabular-nums}
.sosr+.sosr{border-top:1px solid var(--line)}
.sosr .k{color:var(--dim);min-width:0}
.sosr .v{flex:none;font-weight:700;color:var(--mut)}
.sosr .v b{font-weight:800}
.sosr .v em{font-style:normal;font-size:11px;margin-left:5px}
.sosr .v .up{color:var(--ok)}
.sosr .v .down{color:var(--red)}
.eo-h{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.02em;margin:0 2px 5px}
.eo{display:grid;grid-template-columns:1fr 42px 56px 44px;align-items:center;gap:8px;padding:5px 0;
  font-size:12.5px;font-variant-numeric:tabular-nums}
.eo+.eo{border-top:1px solid var(--line)}
.eo .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.eo .n i{font-style:normal;font-size:10px;color:var(--dim);margin-left:4px;font-weight:500}
.eo .r{text-align:right;color:var(--dim);font-size:11.5px}
.eo .bar{height:6px;border-radius:20px;background:rgba(255,255,255,.05);overflow:hidden}
.eo .bar i{display:block;height:100%}
.eo.up .bar i{background:var(--ok)}
.eo.down .bar i{background:var(--red)}
.eo .v{text-align:right;font-weight:800}
.eo.up .v{color:var(--ok)}
.eo.down .v{color:var(--red)}
.upl{display:flex;flex-wrap:wrap;gap:4px}
.upl .u{font-size:12px;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.upl .u i{font-style:normal;font-size:10px;color:var(--dim);margin-left:4px}
.dirhit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--dim);
  background:rgba(47,146,218,.10);border:1px solid rgba(47,146,218,.28);
  border-radius:8px;padding:6px 8px;margin-bottom:6px}
.dirhit b{color:var(--blue);font-weight:700}
.dirhit.warn{background:rgba(224,165,63,.10);border-color:rgba(224,165,63,.32)}
.dirhit.warn b{color:var(--warn)}
.lk{display:grid;grid-template-columns:1fr 68px 46px 52px;align-items:baseline;gap:8px;
  padding:6px 0;font-size:12px;font-variant-numeric:tabular-nums}
.lk+.lk{border-top:1px solid var(--line)}
.lk.hd{font-size:10px;color:var(--dim);padding-bottom:4px;border:none}
.lk.sep{display:block;font-size:10px;color:var(--dim);padding:8px 0 4px;
  border-top:1px solid var(--line2);margin-top:4px}
.lk .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lk .e,.lk .a{text-align:right;color:var(--dim)}
.lk .a{color:var(--mut);font-weight:700}
.lk .d{text-align:right;font-weight:800}
.lk.up .d{color:var(--ok)}.lk.down .d{color:var(--red)}
.sc-dual>div{display:grid;grid-template-columns:1fr 68px 68px;align-items:baseline;gap:8px;padding:4px 0}
.sc-dual>div+div{border-top:1px solid var(--line)}
.sc-dual .hd{padding:0 0 4px;border:none}
.sc-dual .hd i{font-style:normal;font-size:10px;color:var(--dim);text-align:right}
.sc-dual span{font-size:12px;color:var(--mut)}
.sc-dual b{font-family:var(--body);font-weight:600;font-size:15px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.sc-dual b em{display:block;font-style:normal;font-size:9.5px;font-weight:500;
  color:var(--dim);margin-top:1px;letter-spacing:-.02em}
.rc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;
  font-variant-numeric:tabular-nums}
.rc-grid b{display:block;font-family:var(--body);font-weight:600;font-size:20px;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rc-grid b.up{color:var(--ok)}.rc-grid b.down{color:var(--red)}
.rc-grid span{display:block;font-size:10px;color:var(--dim);margin-top:4px}
.rc-form{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:12px}
.rc-form b{color:var(--txt);font-weight:700}
.rc-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.rc-charts{grid-template-columns:1fr}}
/* 시즌별 요약 카드 */
.sez{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px 10px 14px;margin-bottom:6px;background:var(--surf)}
.sez::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.sez.m1{border-color:#a5801f;background:linear-gradient(105deg,rgba(216,180,90,.16),var(--surf) 62%);
  box-shadow:0 0 0 1px rgba(216,180,90,.16), 0 8px 24px -14px rgba(216,180,90,.6)}
.sez.m2{border-color:#6f7b88;background:linear-gradient(105deg,rgba(194,204,215,.12),var(--surf) 62%)}
.sez.m3{border-color:#8a5b34;background:linear-gradient(105deg,rgba(194,137,90,.12),var(--surf) 62%)}
.sez.m1::before{background:linear-gradient(180deg,#f7e296,#a5801f)}
.sez.m2::before{background:linear-gradient(180deg,#f0f4f8,#8b97a4)}
.sez.m3::before{background:linear-gradient(180deg,#eec5a0,#8a5b34)}
@media (prefers-reduced-motion:no-preference){
  .sez.m1::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:34%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);
    transform:skewX(-18deg);animation:shine 5.5s ease-in-out infinite}
}
.sz-top{display:flex;align-items:center;gap:12px}
.sz-rk{flex:none;width:46px;text-align:center;line-height:1}
.sz-rk .rn{font-family:var(--body);font-weight:600;font-size:26px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sz-rk .ru{font-size:11px;color:var(--dim);margin-left:1px}
.sz-rk .mv{display:block;font-size:10px;font-weight:700;margin-top:2px}
.sez.m1 .sz-rk .rn{color:#f2dea2}.sez.m2 .sz-rk .rn{color:#e6ecf2}.sez.m3 .sz-rk .rn{color:#eccdae}
.sz-tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.sz-tt b{font-family:var(--body);font-weight:600;font-size:17px;letter-spacing:.03em;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.sz-tt .rec{display:inline-flex;align-items:baseline;gap:4px;min-width:0}
.sz-tt .rec em{font-style:normal;font-family:var(--body);font-weight:600;font-size:20px;color:var(--txt);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sz-tt .rec i{font-style:normal;font-size:11px;font-weight:700;color:var(--dim)}
.sz-rt{flex:none;display:flex;gap:12px;align-items:baseline}
.sz-rt div{text-align:right}
.sz-rt b{display:block;font-family:var(--body);font-weight:600;font-size:20px;line-height:1;color:var(--txt);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sz-rt span{display:block;font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
.sz-rt .off b{font-size:15px;color:var(--dim)}
.szhead{display:flex;align-items:center;justify-content:space-between;gap:8px;
  flex-wrap:nowrap;margin-bottom:11px}
.szhead .secttl{flex:none;white-space:nowrap;margin:0}
.seg.mini{width:auto;flex:none;padding:4px;gap:4px;white-space:nowrap}
.seg.mini button{padding:4px 8px;font-size:11px;white-space:nowrap}

.sez.m1 .sez.m2 .sez.m3 /* 매치 예측 */
.vs{padding:12px}
.vs-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:10px}
.vs-p{min-width:0}
.vs-p b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-p span{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.vs-p.r{text-align:right}
.vs-x{font-family:var(--body);font-weight:600;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.vs-bar{position:relative;height:30px;border-radius:8px;overflow:hidden;background:rgba(224,75,63,.28)}
.vs-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blue),rgba(47,146,218,.45))}
.vs-bar .l,.vs-bar .r{position:absolute;top:0;line-height:30px;font-size:13px;font-weight:800;
  font-family:var(--body);font-weight:600;font-variant-numeric:tabular-nums}
.vs-bar .l{left:10px}.vs-bar .r{right:10px}
.vs-note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.6}
.vs-fair{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:8px;
  background:rgba(47,146,218,.12);border:1px solid rgba(47,146,218,.3)}
.vs-fair span{flex:1;font-size:11px;color:var(--dim)}
.vs-fair b{font-size:13px}
.vs-fair em{font-style:normal;font-family:var(--body);font-weight:600;font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vs-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;
  margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.vs-foot b{display:block;font-family:var(--body);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vs-foot span{display:block;font-size:10px;color:var(--dim);margin-top:4px}
/* 핸디 표 — 50% 기준 좌우 편차 */
.dv{display:grid;grid-template-columns:60px 1fr 58px;align-items:center;gap:8px;padding:7px 0}
.dv+.dv{border-top:1px solid var(--line)}
.dv .k{font-size:12px;color:var(--mut);font-weight:600}
.dv .track{position:relative;height:22px;border-radius:8px;background:rgba(255,255,255,.05)}
.dv .track .mid{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--line2)}
.dv .track i{position:absolute;top:4px;bottom:4px;border-radius:8px;background:var(--line2)}
.dv.lo .track i{background:linear-gradient(90deg,rgba(224,75,63,.35),var(--red))}
.dv.hi .track i{background:linear-gradient(90deg,var(--ok),rgba(63,191,143,.35))}
.dv.ok .track i{background:var(--line2)}
.dv.weak{opacity:.45}
.dv .v{text-align:right}
.dv .v b{display:block;font-family:var(--body);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.dv .v span{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.pr{display:grid;grid-template-columns:88px 1fr 58px;align-items:center;gap:8px;padding:7px 0}
.pr+.pr{border-top:1px solid var(--line)}
.pr .k{font-size:12px;color:var(--mut);font-weight:600}
.pr .k i{font-style:normal;font-size:10px;color:var(--dim);margin:0 2px}
.pr .track{position:relative;height:20px;border-radius:8px;background:rgba(255,255,255,.05)}
.pr .track .mid{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--line2)}
.pr .track i{position:absolute;top:4px;bottom:4px;border-radius:8px;background:var(--line2)}
.pr.lo .track i{background:linear-gradient(90deg,rgba(224,75,63,.35),var(--red))}
.pr.hi .track i{background:linear-gradient(90deg,var(--ok),rgba(63,191,143,.35))}
.pr .v{text-align:right}
.pr .v b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pr .v span{display:block;font-size:9.5px;color:var(--dim)}
.pr .o{grid-column:1/-1;font-size:10px;color:var(--dim);margin-top:-2px}
.pr.weak{opacity:.42}
.atsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.atsum div{border:1px solid var(--line);border-radius:11px;background:var(--surf);
  padding:8px 4px;text-align:center;min-width:0}
.atsum b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.atsum span{display:block;font-size:9.5px;color:var(--dim);margin-top:2px}
.bugrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bucol{border:1px solid var(--line);border-radius:11px;background:var(--surf);padding:8px 10px;min-width:0}
.bucol.up{border-color:rgba(63,191,143,.3)}
.bucol.down{border-color:rgba(224,75,63,.28)}
.bc-h{display:flex;align-items:baseline;gap:5px;font-size:10.5px;font-weight:800;margin-bottom:5px}
.bucol.up .bc-h{color:#8fe0c2}
.bucol.down .bc-h{color:#f0968e}
.bc-h span{font-weight:500;color:var(--dim);font-size:9.5px}
.bcr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:3.5px 0;
  font-size:11.5px;font-variant-numeric:tabular-nums}
.bcr+.bcr{border-top:1px solid rgba(255,255,255,.04)}
.bcr .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--mut)}
.bcr .v{flex:none;color:var(--dim)}
.bcr .v i{font-style:normal;margin:0 2px;opacity:.6}
.bucol.up .bcr .v b{color:#8fe0c2}
.bucol.down .bcr .v b{color:#f0968e}
.bc-none{font-size:10.5px;color:var(--dim);padding:4px 0}
.dsum{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;margin-bottom:8px;
  border:1px solid var(--line);background:var(--surf)}
.dsum .big{flex:none;font-size:27px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.dsum .big em{font-style:normal;font-size:13px;margin-left:1px;opacity:.7}
.dsum .tx b{display:block;font-size:14px;font-weight:700}
.dsum .tx i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:2px}
.dsum.lo{background:rgba(224,75,63,.1);border-color:rgba(224,75,63,.3)}
.dsum.lo .big{color:#f0968e}
.dsum.hi{background:rgba(63,191,143,.1);border-color:rgba(63,191,143,.3)}
.dsum.hi .big{color:#8fe0c2}
.dsum.ok{background:rgba(47,146,218,.1);border-color:rgba(47,146,218,.3)}
.dsum.ok .big{color:#a8d8ff}
/* 부수 조합별 핸디 히트맵 */
.hmw{overflow-x:auto}
.hmap{display:grid;grid-template-columns:52px repeat(3,1fr);gap:4px;min-width:290px}
.hmap .hh{font-size:9.5px;color:var(--dim);text-align:center;font-weight:700;align-self:end;padding-bottom:2px}
.hmap .hr{font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center}
.hmc{border-radius:9px;padding:6px 2px 5px;text-align:center;border:1px solid var(--line);background:var(--surf)}
.hmc b{display:block;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hmc span{display:block;font-size:8.5px;color:var(--dim);margin-top:1px}
.hmc.lo{background:rgba(224,75,63,.12);border-color:rgba(224,75,63,.32)}.hmc.lo b{color:#f0968e}
.hmc.hi{background:rgba(63,191,143,.12);border-color:rgba(63,191,143,.32)}.hmc.hi b{color:#8fe0c2}
/* 토너먼트 대진표 — 참가자를 위에 세로 이름으로 늘어놓고 선이 아래로 모인다 */
.brkch{display:flex;align-items:center;gap:9px;padding:11px 13px;margin:0 0 12px;
  border:1px solid rgba(232,194,94,.34);border-radius:12px;
  background:linear-gradient(135deg,rgba(232,194,94,.16),rgba(232,194,94,0) 62%)}
.brkch .cup{font-size:19px;line-height:1}
.brkch b{font-size:15px;font-weight:800;cursor:pointer}
.brkch i{font-style:normal;font-size:11px;color:var(--dim);margin-left:auto}
.tbx{display:grid;width:100%;border:1px solid var(--line);border-radius:11px;
  background:var(--surf);padding:6px 4px 8px}
.lf{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding-top:6px;min-width:0}
/* 이름 위로 이어지는 짧은 선 — 대진선과 끊기지 않게 */
.lf::before{content:'';position:absolute;left:50%;top:0;height:6px;border-left:1px solid var(--line2)}
.lf .nm{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:0;
  font-weight:600;line-height:1.06;cursor:pointer;white-space:nowrap}
.lf em{font-style:normal;font-size:7.5px;color:var(--dim);font-weight:700}
.lf.ch .nm{color:#f2dea2}
.lf.ch em{color:#e8c25e}
.mgn{position:relative;height:20px}
.mgn i{position:absolute;display:block;border-color:var(--line2)}
.mgn .pu{top:0;height:50%;border-left:1px solid var(--line2)}
.mgn .cd{top:50%;height:50%;border-left:1px solid var(--line2)}
.mgn .cd.full{top:0;height:100%}
.mgn .bar{top:50%;border-top:1px solid var(--line2)}
.mgn .on{border-color:var(--ok)}
.brksub{font-size:10px;font-weight:900;letter-spacing:.06em;color:var(--dim);margin:16px 0 6px}
/* 순위 결정전 결과 — 한 대진이 곧 두 자리라 한 줄로 */
.plc{display:grid;grid-template-columns:46px minmax(0,1fr) 12px minmax(0,1fr);align-items:center;gap:7px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.plc:last-child{border-bottom:none}
.plc .pr{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.01em;white-space:nowrap}
.plc.m1 .pr{color:var(--warn)}
.plc .w,.plc .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plc .w{font-weight:700;color:var(--ok);cursor:pointer}
.plc .l{color:var(--mut);cursor:pointer}
.plc .l.dim{color:var(--dim);cursor:default}
.plc i{font-style:normal;font-size:10px;color:var(--dim);font-weight:500;margin-left:3px}
.plc .ar{color:var(--line2);font-size:11px;text-align:center}
/* 팀전 스코어·팀 배지 */
.tvs{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 8px;margin-bottom:4px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.tvs span{font-size:14px;font-weight:700;color:var(--dim)}
.tvs span.w{color:var(--ok)}
.tvs span.w::after{content:' 승';font-size:10px;font-weight:500}
.tvs b{font-family:var(--body);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tvs i{font-style:normal;color:var(--dim);font-size:18px}
.grank.tg0{background:rgba(47,146,218,.16);color:#8fc8ee;border-color:rgba(47,146,218,.35)}
.grank.tg1{background:rgba(224,75,63,.14);color:#f0968e;border-color:rgba(224,75,63,.32)}
/* 입력 격자 — 이름 옆 손잡이로 줄 순서를 끌어서 바꾼다 */
.geb .ggrip{display:inline-block;margin-right:5px;color:var(--dim);cursor:grab;touch-action:none;
  font-size:12px;user-select:none}
.geb tr.dragging{opacity:.45}
.geb tr.over th,.geb tr.over td{border-top:2px solid var(--blue)}
.geb .gteam{display:block;font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.04em;margin-top:2px}
.geb .gteam.t0{color:#8fc8ee}.geb .gteam.t1{color:#f0968e}
/* 방문 통계 */
.vzh{display:flex;align-items:baseline;gap:8px;font-size:12px}
.vzh b{font-size:16px}
.vzh .wk{margin-left:auto;font-size:11px;color:var(--mut)}
.vzh .wk i{font-style:normal;font-weight:700}
.vzh .wk i.up{color:var(--ok)}.vzh .wk i.down{color:var(--red)}
.vz{display:flex;align-items:flex-end;gap:3px;height:52px;margin:10px 0 4px}
.vz i{flex:1;border-radius:3px 3px 0 0;background:rgba(47,146,218,.35);min-height:2px}
.vz i.td{background:var(--blue)}
.vzlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}
.tbr{display:grid;grid-template-columns:76px 1fr 38px;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.tbr .tk{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden}
.tbr .tk i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,rgba(47,146,218,.5),var(--blue))}
.tbr b{text-align:right;font-variant-numeric:tabular-nums}
.vmr{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.vmr:last-child{border-bottom:none}
.vmr .nm{font-weight:600;cursor:pointer}
.vmr .nm i{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:500}
.vmr .tm{margin-left:auto;font-size:11px;color:var(--mut)}
.vmr b{font-size:11px;color:var(--dim);font-weight:500;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
/* 변경 이력 */
.audd{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--dim);margin:12px 0 2px}
.audd span{font-weight:500}
.audr{display:flex;align-items:baseline;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.audr .ad{width:6px;height:6px;border-radius:50%;flex:none;align-self:center}
.ad.mt{background:var(--blue)}.ad.ppl{background:var(--ok)}.ad.del{background:var(--red)}.ad.cfg{background:var(--warn)}
.audr time{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.audr b{font-weight:600;flex:none}
.audr .by{font-size:11px;color:var(--mut);flex:none}
.audr .ax{font-size:11px;color:var(--dim);flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.hmc.ok{background:rgba(47,146,218,.1);border-color:rgba(47,146,218,.28)}.hmc.ok b{color:#a8d8ff}
.hmc.weak{opacity:.45}
.hmc.none{opacity:.22;border-style:dashed;background:transparent}
/* 삼각관계 — 진짜 삼각형: 꼭짓점 이름, 변을 도는 화살표 */
.trigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tric{border:1px solid var(--line);border-radius:12px;background:var(--surf);padding:6px 4px 2px}
.tric svg{width:100%;height:auto;display:block}
.tric .edge{stroke:#3fbf8f;stroke-width:2;fill:none;opacity:.75}
.tric .nd{fill:var(--mut);font-size:13.5px;font-weight:700;cursor:pointer}
.tric .nd.me{fill:#a8d8ff}
.tric .rc{fill:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}
/* 라이벌 — 최근 흐름 한 줄 (rv는 grid라 전체 열로 걸친다) */
.rvsub{grid-column:1/-1;font-size:10.5px;color:var(--dim);margin-top:1px}
.rvsub b{color:var(--mut)}
/* 명예의 전당 — 지난 시즌 한 줄 요약 */
.hofline{display:flex;gap:10px;padding:6px 0;font-size:11.5px;align-items:baseline}
.hofline+.hofline{border-top:1px solid var(--line)}
.hofline .d{flex:none;color:var(--dim);font-weight:700;min-width:52px}
.hofline .w{min-width:0;color:var(--mut)}
/* 저장 바 — 긴 상대 목록을 스크롤해도 등록 버튼이 항상 보이게 카드 바닥에 붙어 다닌다 */
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom, 0px) + 62px);z-index:5;
  background:var(--surf);margin:0 -12px -12px;padding:9px 12px 12px;
  border-top:1px solid var(--line);border-radius:0 0 12px 12px;
  box-shadow:0 -10px 18px rgba(0,0,0,.28)}
.savebar .tally{margin-bottom:8px}
/* 시즌 카드 통계 줄 — 칩 대신 조용한 한 줄 */
.sz-stats{margin-top:7px;font-size:11px;color:var(--dim);line-height:1.9}
.sz-stats span{white-space:nowrap}
.sz-stats i{font-style:normal;margin-right:4px}
.sz-stats b{font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.sz-stats em{font-style:normal;margin:0 7px;opacity:.4}
.sz-stats .up b{color:#8fe0c2}
.sz-stats .hot b{color:#f0c987}
/* 승급 진행바 */
.promo .pb{height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.promo .pb i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,rgba(63,191,143,.5),var(--ok))}
/* 추천 매치업 */
.sug{display:flex;align-items:center;gap:8px;padding:8px 0}
.sug+.sug{border-top:1px solid var(--line)}
.sug .n{font-weight:700;font-size:13px;white-space:nowrap}
.sug .n i{font-style:normal;font-size:10px;color:var(--dim);margin-left:4px;font-weight:500}
.sug .tags{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.sug .tags em{font-style:normal;font-size:9.5px;font-weight:700;padding:2.5px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--mut)}
.sug .tags em.hot2{border-color:rgba(47,146,218,.4);color:#a8d8ff;background:rgba(47,146,218,.1)}
.sug .tags em.new2{border-color:rgba(63,191,143,.4);color:#8fe0c2;background:rgba(63,191,143,.1)}
.sug .tags em.rev{border-color:rgba(224,75,63,.4);color:#f0968e;background:rgba(224,75,63,.1)}
.sug .v{flex:none;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
/* 천적·밥 */
.nb{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;align-items:center;gap:8px;padding:7px 0}
.nb+.nb{border-top:1px solid var(--line)}
.nb .n{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .n i{font-style:normal;font-size:9.5px;color:var(--dim);margin-left:3px;font-weight:500}
.nb .track{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.05)}
.nb .track .e{position:absolute;top:2px;bottom:2px;width:2px;background:var(--line2);border-radius:2px}
.nb .track .a{position:absolute;top:4px;bottom:4px;border-radius:6px}
.nb.bad .track .a{background:rgba(224,75,63,.55)}
.nb.good .track .a{background:rgba(63,191,143,.55)}
.nb .v{font-size:10.5px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
.nb .v b{display:block;font-size:12px}
.nb.bad .v b{color:#f0968e}.nb.good .v b{color:#8fe0c2}
.nb-h{font-size:10.5px;font-weight:800;margin:2px 0 2px}
.nb-h.bad{color:#f0968e}.nb-h.good{color:#8fe0c2}
/* 주간 리캡 */
.recap{border:1px solid rgba(47,146,218,.3);background:linear-gradient(160deg,rgba(47,146,218,.10),var(--surf));
  border-radius:13px;padding:12px 14px;margin-bottom:10px}
.recap .rc-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.recap .rc-h b{font-size:13.5px}
.recap .rc-h span{font-size:10px;color:var(--dim)}
.recap .rc-line{font-size:11.5px;color:var(--mut);padding:2.5px 0;line-height:1.55}
.recap .rc-line b{color:var(--txt,#e8edf2)}
.recap .rc-line .dim{margin-left:3px}
/* 기록실 */
.rgrid{padding:4px 13px}
.ctgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ctop{border:1px solid var(--line);border-radius:11px;background:var(--surf);padding:8px 10px;min-width:0}
.ct-h{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:-.01em;margin-bottom:4px}
.ctr{display:grid;grid-template-columns:17px 1fr auto;align-items:center;gap:5px;
  padding:3px 0;font-size:11.5px;font-variant-numeric:tabular-nums}
.ctr+.ctr{border-top:1px solid rgba(255,255,255,.04)}
.ctr .i{font-size:10px;color:var(--dim);text-align:center}
.ctr.m1 .i,.ctr.m2 .i,.ctr.m3 .i{font-size:11px}
.ctr .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--mut)}
.ctr.m1 .n{color:#ffe9a8}
.ctr .v{color:var(--dim);font-weight:700}
.ctr.m1 .v{color:#f2dea2}
.rgrid .rtile:last-child:nth-child(odd){grid-column:1/-1}
.rtile{display:grid;grid-template-columns:58px 1fr auto;align-items:baseline;gap:10px;
  padding:8px 0;min-width:0}
.rtile+.rtile{border-top:1px solid var(--line)}
.rtile .k{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.rtile b{font-size:13.5px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile .v{text-align:right;font-size:13.5px;font-weight:700;color:var(--mut);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rtile i{font-style:normal;font-size:9.5px;color:var(--dim);margin-left:5px;font-weight:500}
.rlist+.rlist{margin-top:14px}
.rl-t{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.rl-r{display:grid;grid-template-columns:16px 1fr 56px 46px;align-items:center;gap:8px;padding:4px 0;
  font-size:12px;font-variant-numeric:tabular-nums}
.rl-r .i{color:var(--dim);font-size:10px}
.rl-r .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-r .b{height:5px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden}
.rl-r .b i{display:block;height:100%;background:var(--blue);opacity:.75}
.rl-r .v{text-align:right;color:var(--mut);font-weight:700}
/* 출석 */
.dowgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.dowgrid .bar{height:84px;display:flex;align-items:flex-end;background:rgba(255,255,255,.045);border-radius:8px}
.dowgrid .bar i{width:100%;border-radius:8px;background:linear-gradient(180deg,rgba(47,146,218,.85),rgba(47,146,218,.25))}
.dowgrid .peak .bar i{background:linear-gradient(180deg,var(--blue),rgba(47,146,218,.4))}
.dowgrid span{display:block;font-size:11px;color:var(--mut);margin-top:6px}
.dowgrid .sun span{color:var(--red)}
.dowgrid em{display:block;font-style:normal;font-family:var(--body);font-weight:600;font-size:13px;
  color:var(--mut);margin-bottom:5px;min-height:15px;font-variant-numeric:tabular-nums}
.mrow2{display:grid;grid-template-columns:78px 1fr 54px;align-items:center;gap:8px;padding:8px 0}
.mrow2+.mrow2{border-top:1px solid var(--line)}
.mrow2 .k{font-size:12px;color:var(--mut);font-weight:600}
.mrow2 .track{height:18px;border-radius:8px;background:rgba(255,255,255,.05);overflow:hidden}
.mrow2 .track i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),rgba(47,146,218,.35))}
.mrow2 .v{text-align:right}
.mrow2 .v b{font-family:var(--body);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.mrow2 .v span{display:block;font-size:10px;color:var(--dim)}
/* 이달의 기록 */
.mrpt{padding:14px;background:linear-gradient(140deg,rgba(47,146,218,.14),var(--surf) 60%)}
.mr-ttl{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.mr-hero{margin:8px 0 4px}
.mr-hero .cap{display:block;font-size:10px;color:var(--blue);letter-spacing:.08em;font-weight:700}
.mr-hero b{display:block;font-size:26px;font-weight:800;line-height:1.15;margin-top:3px}
.mr-hero .sub{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.mr-num{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.mr-num b{display:block;font-family:var(--body);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mr-num span{display:block;font-size:10px;color:var(--dim);margin-top:4px}
/* 분석 탭 공통 시각 언어 */
.ana{display:grid;gap:0}
.ana .card{border-color:rgba(126,161,180,.18);background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,.014));box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.ana .secttl{display:flex;align-items:center;gap:7px;margin:16px 2px 8px;color:#9fb6c5;letter-spacing:.07em}
.ana .secttl:first-child{margin-top:0}
.ana .secttl::before{content:"";width:3px;height:12px;border-radius:999px;background:linear-gradient(180deg,#77caff,var(--blue));box-shadow:0 0 10px rgba(47,146,218,.35)}
.ana .tiny.dim{line-height:1.55;color:#7f95a4}
.ana .seg{border-radius:12px;background:rgba(255,255,255,.026);border-color:rgba(126,161,180,.16);padding:4px;gap:4px}
.ana .seg button{border-radius:9px;font-weight:800;color:#8da5b4}
.ana .seg button.on{background:linear-gradient(180deg,#3aa6ee,#277fca);box-shadow:0 8px 18px -14px rgba(47,146,218,.9);color:#fff}
.ana .lgbar{gap:6px;margin-bottom:10px;padding-bottom:2px}
.ana .lgb{border-radius:10px;background:rgba(255,255,255,.028);border-color:rgba(126,161,180,.16);padding:7px 11px;color:#8da5b4}
.ana .lgb.on{background:rgba(47,146,218,.18);border-color:rgba(47,146,218,.48);color:#d8efff}
.ana-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:0 0 10px}
.ana-kpi{min-width:0;border:1px solid rgba(126,161,180,.18);border-radius:10px;background:linear-gradient(180deg,rgba(47,146,218,.075),rgba(255,255,255,.014));padding:10px 11px}
.ana-kpi span{display:block;font-size:10px;color:#7f95a4;font-weight:800;letter-spacing:.04em}
.ana-kpi b{display:block;margin-top:4px;font-family:var(--body);font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#edf7ff}
.ana-kpi em{display:block;margin-top:4px;font-style:normal;font-size:10px;color:#7f95a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ana-kpi i,.ana .mr-num i{display:block;height:5px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px}
.ana-kpi i u,.ana .mr-num i u{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#69c6ff,var(--blue));text-decoration:none}
.ana .ana-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ana .ana-tabs::-webkit-scrollbar{display:none}
.ana .ana-tabs button{flex:0 0 auto;min-width:82px;padding:8px 12px}
.ana-period{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:0 0 10px}
.ana-period .seg{margin:0}
.ana-period-pick{min-width:118px}
.ana-period-pick .selectbox{width:100%;height:34px;min-height:34px;font-size:13px}
.digest-section{margin:12px 2px 7px;color:#9fb6c5;font-size:10.5px;font-weight:900;letter-spacing:.06em}
.ana-overview{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.85fr);gap:10px;align-items:start;margin:0 0 10px}
.ana-overview .weekbrief,.ana-overview .ana-sidecard{margin:0}
.ana-overview .news-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ana-sidecard{min-width:0;border:1px solid rgba(126,161,180,.18);border-radius:12px;background:rgba(255,255,255,.014);padding:10px}
.ana-sidecard .digest-section{margin:0 0 8px}
.ana-sidecard .ana-board{grid-template-columns:1fr;margin:0}
.ana-sidecard .ana-metric{grid-template-columns:66px minmax(0,1fr);padding:8px 9px}
.ana-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 10px}
.ana-metric{min-width:0;display:grid;grid-template-columns:74px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 9px;
  border:1px solid rgba(126,161,180,.16);border-radius:10px;background:rgba(255,255,255,.018);padding:9px 10px;overflow:hidden}
.ana-metric.main{border-color:rgba(47,146,218,.24);background:rgba(47,146,218,.055)}
.ana-metric.warn,.ana-metric.bad{background:rgba(255,255,255,.018)}
.ana-metric .k{grid-row:1/3;align-self:center;display:block;font-size:10px;color:#7f95a4;font-weight:900;letter-spacing:.045em;white-space:nowrap}
.ana-metric b{display:block;font-family:var(--body);font-weight:800;font-size:14.5px;line-height:1.2;color:#edf7ff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ana-metric b [data-psheet]{cursor:pointer}
.ana-metric em{display:block;font-style:normal;font-size:11px;line-height:1.35;color:#7f95a4;white-space:normal;overflow:hidden}
.ana .ctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ana .ctop{border-color:rgba(126,161,180,.18);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.012));padding:10px 11px}
.ana .ct-h{font-size:10px;color:#7dcaff;margin-bottom:7px}
.ana .ctr{grid-template-columns:24px minmax(0,1fr) minmax(46px,.45fr) 48px;gap:7px;padding:5px 0;font-size:12px}
.ana .ctr .i{text-align:left}.ana .ctr .n{color:#c8d6df}.ana .ctr .v{text-align:right;color:#9fb6c5}
.ana .ctr .b{height:7px;border-radius:999px;background:rgba(255,255,255,.065);overflow:hidden}
.ana .ctr .b i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#65c3ff,rgba(47,146,218,.45))}
.ana .ctr.m1 .b i{background:linear-gradient(90deg,#f0c765,#ffeab0)}

.bslots-h{font-size:11px;font-weight:900;color:var(--blue);margin:0 0 7px}
.bslotgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bslotgrid.low{grid-template-columns:repeat(2,minmax(0,1fr))}
.bslot{position:relative;min-height:48px;border:1px dashed var(--line2);border-radius:9px;background:var(--bg2);
  padding:7px 22px 6px 8px;cursor:pointer;user-select:none;overflow:hidden}
.bslot.fill{border-style:solid;border-color:var(--line);background:rgba(255,255,255,.04)}
.bslot.pick{box-shadow:inset 0 0 0 2px var(--blue)}
.bslot .no{display:block;font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.bslot .nm{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslot .bu{display:block;font-size:9.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslot .x{position:absolute;right:4px;top:4px;width:18px;height:18px;padding:0;border:none;border-radius:9px;
  background:rgba(255,255,255,.08);color:var(--dim);font-size:12px;line-height:18px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:8px;overflow-x:auto;margin:10px 0}
.bracket.low{grid-template-columns:repeat(2,minmax(170px,1fr))}
.bround{border:1px solid var(--line);border-radius:11px;background:var(--surf);padding:8px;min-width:170px}
.bround-h{font-size:11px;font-weight:900;color:var(--blue);margin-bottom:7px}
.bmatch{border:1px solid var(--line);border-radius:9px;background:var(--bg2);padding:7px;margin-bottom:7px}
.bmatch:last-child{margin-bottom:0}
.bmatch.done{box-shadow:inset 0 0 0 1px rgba(63,191,143,.25)}
.bmatch.wait{min-height:62px;display:flex;flex-direction:column;justify-content:center}
.bmatch .tag{display:block;font-size:9.5px;font-weight:800;color:var(--dim);margin-bottom:5px}
.bmatch em{font-style:normal;font-size:12px;color:var(--dim)}
.bside{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:5px;
  padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--mut);
  font-size:12px;font-weight:700;text-align:left}
.bside span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bside i{font-style:normal;font-size:9.5px;color:var(--dim);font-weight:600}
.bside.on{background:rgba(63,191,143,.18);border-color:rgba(63,191,143,.48);color:#8fe0c2}
.bside.auto{opacity:.82}
.bside.empty{display:block;color:var(--dim);border-style:dashed;text-align:center}
.bsum{border:1px solid var(--line);border-radius:11px;background:var(--surf);padding:4px 10px}
.bsum div{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;padding:7px 0}
.bsum div+div{border-top:1px solid var(--line)}
.bsum span{font-size:11px;font-weight:900;color:var(--blue)}
.bsum b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.bsetup{grid-template-columns:1fr}.bslotgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:460px){.bracket,.bracket.low{grid-template-columns:repeat(2,minmax(152px,1fr))}.bround{min-width:152px}}
.geb td{padding:0}
.geb .gc{width:100%;min-width:40px;height:40px;padding:0;border:none;background:none;
  text-align:center;font-size:14px;font-weight:800;color:var(--txt);border-radius:0;
  font-variant-numeric:tabular-nums}
.geb .gc::placeholder{color:rgba(255,255,255,.12)}
.geb .gc:hover:not(:disabled){background:rgba(47,146,218,.07)}
.geb .gc:focus{outline:2px solid var(--blue);outline-offset:-2px;background:rgba(47,146,218,.14)}
.geb .gc:disabled{opacity:.55}
.geb thead th{font-size:10.5px;padding:8px 5px;letter-spacing:.01em}
.geb th.cn{font-size:12.5px;padding:0 10px}
.geb th.cn em{background:rgba(255,255,255,.07);border-radius:6px;padding:2px 6px;margin-left:6px;font-size:9.5px}
.geb th.cn em.tb{background:rgba(232,194,94,.15);color:#f2dea2}
.geb td.self{background:repeating-linear-gradient(-45deg,
  rgba(255,255,255,.055) 0 4px, transparent 4px 9px)}
.geb td.none{background:rgba(255,255,255,.015)}
.geb td.win .gc{color:#8fe0c2}
.geb td.win{background:rgba(63,191,143,.09)}
.geb td.lose .gc{color:#f0968e}
.geb td.lose{background:rgba(224,75,63,.06)}
.geb td.skip .gc{color:var(--line2)}
.geb td.lock{background:rgba(255,255,255,.045)}
.geb td.lock .gc{font-weight:700}
.tapname{cursor:pointer}
.tapname:active{opacity:.6}
.geb td.warn{background:rgba(224,150,60,.22);box-shadow:inset 0 0 0 2px rgba(224,150,60,.55)}
.geb td.warn .gc{color:#f0c98e}
.ctwrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--surf)}
.ctb{border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctb th,.ctb td{border:1px solid var(--line);padding:4px 5px;text-align:center;min-width:34px}
.ctb thead th{font-size:9.5px;color:var(--dim);font-weight:700;background:var(--bg2);
  position:sticky;top:0}
.ctb th.cn{text-align:left;min-width:96px;font-weight:600;font-size:11.5px;
  position:sticky;left:0;background:var(--surf);z-index:1}
.ctb th.cn i{font-style:normal;font-size:9.5px;color:var(--dim);margin-right:5px;font-weight:700}
.ctb th.cn em{font-style:normal;font-size:9px;color:var(--dim);margin-left:4px;font-weight:500}
.ctb thead th.cn{background:var(--bg2);z-index:2}
.ctb td.self{background:rgba(255,255,255,.06)}
.ctb td.none{color:var(--line2)}
.ctb td.win{background:rgba(63,191,143,.13);color:#8fe0c2;font-weight:700}
.ctb td.lose{background:rgba(224,75,63,.1);color:#f0968e}
.ctb td.rc,.ctb th.rc{background:var(--bg2);font-weight:700;min-width:48px}
/* 조별 대진표 — 가로 스크롤 없이 화면 안에. 열 머리는 줄 번호로 */
.ctb.fit{width:100%;table-layout:fixed}
.ctb.fit th,.ctb.fit td{min-width:0;padding:4px 1px;font-size:10.5px;overflow:hidden}
.ctb.fit th.cn{width:26%;padding:5px 6px;font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctb.fit th.cn i{font-style:normal;font-size:9px;color:var(--dim);font-weight:800;margin-right:4px}
.ctb.fit th.cn span{font-weight:600}
.ctb.fit th.cn em{margin-left:3px}
.ctb.fit td.rc,.ctb.fit th.rc{width:13%;min-width:0;font-size:10px}
.ctb.fit td.gr,.ctb.fit th.gr{width:14%;min-width:0}
.ctb.fit .grank{padding:1px 4px;font-size:9px}
.ctb.lgr.fit thead th{font-size:9px;line-height:1.25;padding:4px 0}
.ctb.lgr.fit th.cn{font-size:11px}
.ctb.lgr.fit td{font-size:10px}
.ctb td.gr,.ctb th.gr{min-width:62px}
.grank{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:22px;
  border-radius:12px;background:rgba(47,146,218,.12);color:var(--blue);font-size:11px;font-weight:900}
.grank.m1{background:rgba(232,194,94,.16);color:#f2dea2}
.grank.m2{background:rgba(226,232,240,.12);color:#e6ecf2}
.grank.m3{background:rgba(224,150,110,.14);color:#f0cdae}
.ctb.lgr td{font-weight:700}
.ctb.lgr td.m1{background:rgba(232,194,94,.16);color:#f2dea2}
.ctb.lgr td.m2{background:rgba(226,232,240,.1);color:#e6ecf2}
.ctb.lgr td.m3{background:rgba(224,150,110,.12);color:#f0cdae}
.ctb.lgr td.dim{color:var(--dim);font-weight:500}
.ctb td.rc b{color:var(--ok)}
.cupres{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:5px;margin-top:6px}
.cupres-r{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;background:var(--surf);padding:6px 7px}
.cupres-r.adv{background:rgba(47,146,218,.1)}
.cupres-k{flex:none;min-width:44px;color:var(--blue);font-size:9.5px;font-weight:900}
.cupres-n{min-width:0;color:var(--txt);font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cupres-n i{font-style:normal;font-size:8.5px;color:var(--dim);margin-left:3px;font-weight:600}
.lgline{display:grid;grid-template-columns:1fr auto 14px;align-items:center;gap:10px;
  padding:10px 0;cursor:pointer}
.lgline+.lgline{border-top:1px solid var(--line)}
.lgline .t{min-width:0}
.lgline .t b{font-size:14.5px;font-weight:700}
.lgline .t i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:2px}
.lgline .v{font-size:15px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.lgline .v em{font-style:normal;font-size:9.5px;color:var(--dim);margin-left:3px;font-weight:500}
.lgline .go{color:var(--line2);font-size:16px}
.lgchk{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;color:var(--mut)}
.lgchk input{width:auto;flex:none}
.advbox summary b.on{color:var(--blue);font-size:10px;margin-left:5px}
.advbox summary .dim{font-size:10px;margin-left:5px}
.lgbar{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;
  -webkit-overflow-scrolling:touch}
.lgbar::-webkit-scrollbar{display:none}
.lgbar.bubar{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));overflow:visible;gap:5px;padding:0}
.lgbar.bubar .lgb{width:100%;text-align:center;padding:7px 8px}
.pillsel{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;min-width:0;
  border:1px solid var(--line);border-radius:10px;background:var(--surf);cursor:pointer;font-size:14px}
.pillsel .pl{font-size:10.5px;font-weight:700;color:var(--dim);flex:0 0 auto}
.pillsel b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillsel i{margin-left:auto;font-style:normal;color:var(--dim);font-size:11px}
.pos .apos{display:block;font-size:8.5px;color:var(--dim);margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap}
.lgb.back{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--mut);font-weight:600}
.lgb{flex:none;padding:6px 13px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg2);color:var(--dim);font-size:12px;font-weight:700;white-space:nowrap}
.lgb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.findbox{position:relative;margin-bottom:10px}
.findbox input{width:100%;padding-right:38px}
.findbox .fx{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.09);
  color:var(--mut);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.pkgrp{margin-bottom:7px}
.pg-h{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.02em;margin:0 2px 4px}
.pg-h span{font-weight:500;opacity:.7;margin-left:3px}
.pk{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--line);border-radius:7px;background:var(--bg2);
  padding:7px 3px;min-width:0;color:var(--mut);font-size:11.5px;font-weight:600;
  letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.pk .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.w{border-color:#2c6b55;background:rgba(63,191,143,.16)}
.pk.w .nm,.pk.w .ct{color:#8fe0c2}
.pk.l{border-color:var(--red-d);background:rgba(224,75,63,.16)}
.pk.l .nm,.pk.l .ct{color:#f0968e}
.pk .ct{font-size:9px;font-weight:800;line-height:1;flex:none}
.tally{display:flex;gap:12px;font-size:12px;color:var(--dim);margin:8px 4px 0}
.tally b{font-family:var(--body);font-weight:600;font-size:15px;font-weight:400;margin-right:3px;font-variant-numeric:tabular-nums}
.mask{position:fixed;inset:0;background:rgba(5,8,10,.72);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;padding:0;overscroll-behavior:contain}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;
  max-width:760px;max-height:88vh;overflow:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:0 16px 24px;
  animation:shUp .18s ease;will-change:transform}
@keyframes shUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.mask.out{opacity:0;transition:opacity .14s ease}
.sh-bar{position:sticky;top:0;z-index:2;background:var(--bg2);padding:8px 0 10px;margin-bottom:4px;
  border-bottom:1px solid var(--line)}
.sh-bar .grip{width:36px;height:4px;border-radius:20px;background:var(--line2);margin:0 auto 10px}
.sh-bar.bare{border-bottom:none;padding-bottom:0;margin-bottom:0;min-height:34px}
.sh-bar.bare .grip{margin-bottom:0}
.sh-bar h3{margin:0;padding-right:36px}
.sh-x{position:absolute;right:-4px;top:14px;width:32px;height:32px;border-radius:50%;
  background:var(--surf);border:1px solid var(--line);color:var(--mut);font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center}
@media(min-width:620px){.mask{align-items:center;padding:20px}.sheet{border-radius:16px}}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
.busy{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:90;display:flex;align-items:center;gap:8px;
  background:var(--surf2);border:1px solid var(--line2);padding:12px 16px;border-radius:12px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.spin{width:11px;height:11px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 28%, #fff5e6, var(--tt) 55%, #c8761a);
  animation:sp .5s cubic-bezier(.35,0,.45,1) infinite alternate}
@keyframes sp{from{transform:translateY(2px) scaleY(.88)}to{transform:translateY(-7px) scaleY(1)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:80;background:var(--surf2);border:1px solid var(--line2);padding:8px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%}
.toast.err{border-color:var(--red-d)}
.empty{text-align:center;color:var(--dim);padding:24px 16px;font-size:13px;border:1px dashed var(--line2);border-radius:8px}
.empty::before{content:'';display:block;width:13px;height:13px;margin:0 auto 11px;border-radius:50%;opacity:.45;
  background:radial-gradient(circle at 32% 28%, #fff5e6, var(--tt) 55%, #c8761a)}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}
.notice{font-size:12px;color:var(--mut);background:rgba(47,146,218,.07);border:1px solid var(--blue-d);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.notice.warn{background:rgba(224,165,63,.07);border-color:#6d5522}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
@media (prefers-reduced-motion:no-preference){
  .rk,.mt{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}}
  /* 1위 카드에 천천히 지나가는 빛 */
  .rk.md1::after{content:'';position:absolute;top:0;bottom:0;left:-45%;width:38%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
    transform:skewX(-18deg);animation:shine 5s ease-in-out infinite}
  .rk.frozen.md1::after{inset:0;left:0;width:auto;top:0;bottom:0;transform:none;animation:none;
    background:
      linear-gradient(0deg,rgba(0,0,0,.12),rgba(255,255,255,.018)),
      radial-gradient(90px 26px at 16% 0,rgba(235,245,250,.11),transparent 72%)}
  @keyframes shine{0%{left:-45%}55%,100%{left:125%}}
  .medal.m1{animation:pop .5s ease both}
  @keyframes pop{from{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}to{transform:scale(1);opacity:1}}
}
.ins-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.ins-head .secttl{margin:0}
.ins-head p{margin:4px 0 0}
.ins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ins-panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border-radius:8px;padding:10px;min-width:0}
.ins-panel .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.ins-panel .ttl{font-size:12px;font-weight:800;color:var(--mut)}
.ins-panel .rec{font-family:var(--display);font-size:21px;color:var(--fg);letter-spacing:0}
.ins-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ins-kpi{border:1px solid rgba(255,255,255,.055);background:rgba(0,0,0,.12);border-radius:7px;padding:7px 6px;min-width:0}
.ins-kpi b{display:block;font-size:14px;font-family:var(--body);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-kpi span{display:block;margin-top:3px;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-note{margin:8px 2px 0;font-size:11px;color:var(--mut);line-height:1.45}
.goal-list{display:grid;gap:8px}
.goal{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);
  background:rgba(255,255,255,.025);border-radius:8px;padding:9px}
.goal .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:rgba(47,146,218,.12);border:1px solid rgba(47,146,218,.28);font-size:15px}
.goal b{display:block;font-size:13px}
.goal span{display:block;margin-top:3px;font-size:11px;color:var(--dim);line-height:1.35}
.goal em{font-style:normal;font-size:11px;color:var(--blue2);font-weight:800;white-space:nowrap}
.weekbrief{border-color:rgba(126,161,180,.20);background:rgba(255,255,255,.018)}
.digest-range{font-size:10.5px;color:#7f95a4;white-space:nowrap}
.digest-lead{margin:0 0 9px;color:#c8d6df;font-size:12px;line-height:1.5}
.brief-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 10px}
.brief-kpis div{border:1px solid rgba(126,161,180,.14);background:rgba(0,0,0,.10);border-radius:8px;padding:8px 7px;min-width:0}
.brief-kpis b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.brief-kpis span{display:block;margin-top:3px;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-stories{margin-top:8px}
.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.news-item{border:1px solid rgba(126,161,180,.16);border-radius:9px;background:rgba(255,255,255,.016);padding:10px;min-width:0}
.news-tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:999px;background:rgba(126,161,180,.10);border:1px solid rgba(126,161,180,.18);color:#9fb6c5;font-size:9.5px;font-weight:900}
.news-item b{display:block;margin-top:7px;font-size:13px;line-height:1.35;white-space:normal;overflow:visible}
.news-item p{margin:5px 0 0;font-size:11px;color:var(--dim);line-height:1.45}
.digest-meta{margin-top:7px;border-top:1px solid rgba(126,161,180,.11);padding-top:7px;color:#a9bdca;font-size:10.5px;line-height:1.35;font-variant-numeric:tabular-nums}
.digest-rule{margin:8px 2px 0}

<script>
/* ─────────────────────────── 저장소 계층 ───────────────────────────
   같은 키 인터페이스 뒤에 두 가지 저장소를 둔다.
   · Firebase 설정이 채워져 있으면 → 실시간 공유 DB (어디서 보든 같은 결과)
   · 아니면 → 이 기기 전용 임시 저장                                    */
const CFG  = window.TT_CONFIG || {};
const CLUB = String(CFG.clubId || 'morning').replace(/[.#$\[\]\/]/g,'-');
const KEY = {
  players:'tt:players', meta:'tt:meta', audit:'tt:audit', visits:'tt:visits',
  shard: m => 'tt:matches:'+m, session:'tt:session', visitor:'tt:visitor', visitState:'tt:visitState'
};
const MPRE = 'tt:matches:';
const mem = new Map();
const hasStore = typeof window!=='undefined' && !!window.storage;
let FB = null;                                   // 연결 성공 시에만 채워진다
const online = ()=> !!FB;
const clean  = v => JSON.parse(JSON.stringify(v===undefined?null:v));
const CLIENT = Math.random().toString(36).slice(2,10);   // 내 변경인지 구분하는 값
const asList = v => Array.isArray(v) ? v : (v && typeof v==='object' ? Object.values(v) : v);

const FBM='matches';                 // Firebase 에서는 경기를 개별 레코드로 저장한다
const FBC='matchChanges';            // 경기 변경 로그. 동기화 때 이 목록만 먼저 본다
function fbPath(k){
  if(k===KEY.players) return 'players';
  if(k===KEY.meta)    return 'meta';
  if(k===KEY.audit)   return 'audit';
  if(k===KEY.visits)  return 'visits';
  if(k.startsWith(MPRE)) return FBM;
  if(k.startsWith('tt:photo:')) return 'photos/'+k.slice(9);
  return 'misc/'+k.replace(/[.#$\[\]\/:]/g,'_');
}

/* 한쪽이 막힌 망에서도 붙도록 두 경로를 순서대로 시도한다 */
const SDK_SOURCES = [
  { app:'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js',
    db :'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js',
    au :'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js',
    st :'https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js' },
  { app:'https://esm.sh/firebase@10.12.5/app',
    db :'https://esm.sh/firebase@10.12.5/database',
    au :'https://esm.sh/firebase@10.12.5/auth',
    st :'https://esm.sh/firebase@10.12.5/storage' }
];
async function loadSDK(){
  let last=null;
  for(const src of SDK_SOURCES){
    try{
      const core = await Promise.all([import(src.app), import(src.db), import(src.au)]);
      let storage = null;
      try{ storage = await import(src.st); }
      catch(e){ console.warn('Firebase Storage SDK 로드 실패:', e); }
      return [...core, storage];
    }
    catch(e){ last=e; }
  }
  throw last;
}
async function initFirebase(){
  const c = CFG.firebase;
  if(!c || !c.databaseURL) return null;
  try{
    const [A,D,U,G] = await loadSDK();
    const app = A.initializeApp(c);
    const auth = U.getAuth(app);
    try{
      await new Promise(resolve=>{
        let done=false, unsub=null;
        const finish=()=>{ if(done) return; done=true; try{ if(unsub) unsub(); }catch(e){} resolve(); };
        try{ unsub=U.onAuthStateChanged(auth, finish); }catch(e){ finish(); }
        setTimeout(finish, 1200);
      });
      if(!auth.currentUser) await U.signInAnonymously(auth);
    }catch(e){ /* 익명 로그인 미사용이면 그대로 진행 */ }
    const db = D.getDatabase(app), storage = G ? G.getStorage(app) : null, base = 'clubs/'+CLUB;
    const privateBase = ()=>{
      const u = auth.currentUser && auth.currentUser.uid;
      if(!u) throw new Error('private auth unavailable');
      return base+'/privateReviews/'+u;
    };
    return {
      auth,
      authApi:U,
      storage,
      storageApi:G,
      uid(){ return auth.currentUser && auth.currentUser.uid; },
      email(){ return auth.currentUser && auth.currentUser.email; },
      async get(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? snap.val() : null; },
      async set(pth,v){ await D.set(D.ref(db, base+'/'+pth), clean(v)); return true; },
      async patch(pth,obj){ await D.update(D.ref(db, base+'/'+pth), clean(obj)); return true; },
      async patchRaw(pth,obj){ await D.update(D.ref(db, base+'/'+pth), obj); return true; },
      async patchRoot(obj){ await D.update(D.ref(db, base), clean(obj)); return true; },
      async del(pth){ await D.remove(D.ref(db, base+'/'+pth)); return true; },
      async pget(pth){ const snap = await D.get(D.ref(db, privateBase()+'/'+pth)); return snap.exists()? snap.val() : null; },
      async pset(pth,v){ await D.set(D.ref(db, privateBase()+'/'+pth), clean(v)); return true; },
      async pdel(pth){ await D.remove(D.ref(db, privateBase()+'/'+pth)); return true; },
      inc(n){ return D.increment(n); },
      async keys(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? Object.keys(snap.val()) : []; },
      async lastKey(pth){
        const q = D.query(D.ref(db, base+'/'+pth), D.orderByKey(), D.limitToLast(1));
        const snap = await D.get(q);
        return snap.exists() ? Object.keys(snap.val()).sort().slice(-1)[0] : '';
      },
      async changesAfter(key){
        const ref = D.ref(db, base+'/'+FBC);
        const q = key ? D.query(ref, D.orderByKey(), D.startAt(key)) : D.query(ref, D.orderByKey());
        const snap = await D.get(q);
        if(!snap.exists()) return [];
        return Object.entries(snap.val())
          .filter(([k])=>!key || k>key)
          .sort((a,b)=>a[0].localeCompare(b[0]))
          .map(([k,v])=>({...(v||{}), key:k}));
      },
      watch(cb){ D.onValue(D.ref(db, base+'/sig'), snap=>cb(snap.val())); }
    };
  }catch(e){ console.warn('Firebase 연결 실패:', e); S.fbError=String(e&&e.message||e); return null; }
}
const fbConfigured = ()=> !!(CFG.firebase && CFG.firebase.databaseURL);
/* 예전 버전은 경기를 월별 묶음(shards)으로 저장했다. 개별 레코드 방식으로 한 번 옮긴다.
   원본은 지우지 않고 그대로 둔다. */
async function migrateShards(){
  if(!FB) return;
  try{
    const flat = await FB.get(FBM);
    if(flat && Object.keys(flat).length) return;          // 이미 옮겨졌다
    const sh = await FB.get('shards');
    if(!sh) return;
    const obj={};
    Object.values(sh).forEach(list=>{
      const arr = Array.isArray(list) ? list : Object.values(list||{});
      arr.forEach(m=>{ if(m && m.id) obj[m.id]=m; });
    });
    const n=Object.keys(obj).length;
    if(n){ await FB.patch(FBM, obj); console.info('기존 경기 '+n+'건을 새 저장 방식으로 옮겼습니다.'); }
  }catch(e){ console.warn('기존 데이터 이전 실패:', e); }
}

/* 세션(로그인 상태)은 기기별로만 남는다 */
function localGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ const v=mem.get('p:'+k); return v?JSON.parse(v):null; } }
function localSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem.set('p:'+k,JSON.stringify(v)); } return true; }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){ mem.delete('p:'+k); } return true; }

async function sGet(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localGet(k);
    try{ const r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
  }
  if(FB){ try{ const v=await FB.get(fbPath(k));
                return (k===KEY.players || k.startsWith(MPRE) || k===KEY.audit) ? asList(v) : v; }

  const prev=rounds[rdKey(lg,rd)] || {};
  const row={...prev, ...(extra||{}), bu:bu||{}, hb:hb||{}};
  if(!row.fmt || row.fmt===lgFmt(lg)) delete row.fmt;
  if(row.grp && !Object.keys(row.grp).length) delete row.grp;
  if(row.ord && !row.ord.length) delete row.ord;
  if(row.brk) row.brk=cleanBracket(row.brk);
  if(!row.brk || bracketEmpty(row.brk)) delete row.brk;
  if(!row.teamEvent) delete row.teamEvent;
  if(!row.rank || !Object.keys(row.rank).length) delete row.rank;
  const has=Object.keys(row.bu||{}).length || Object.keys(row.hb||{}).length
         || row.fmt || row.grp || row.ord || row.brk || row.teamEvent || row.rank;
  if(has) rounds[rdKey(lg,rd)]=row;
  else delete rounds[rdKey(lg,rd)];
  S.meta={...S.meta, rounds};

}

function lgEligible(lg, p){

const lgPoolText = lg => { const L=leagues().find(x=>x.id===lg)||{};
  if(L.buMin==null && L.buMax==null) return '';

/* 회차 — 그 달 몇 주차인지. 8월 2일이면 '2026-08-W1' */
/* 그 해 몇 주차인가 (ISO 기준 — 목요일이 든 주가 그 해의 주) */
function isoWeek(date){
  const [Y,M,D]=String(date).split('-').map(Number);
  const d=new Date(Date.UTC(Y,M-1,D));
  const dow=(d.getUTCDay()+6)%7;                   // 월=0 … 일=6
  d.setUTCDate(d.getUTCDate()-dow+3);              // 그 주의 목요일
  const y=d.getUTCFullYear();
  const first=new Date(Date.UTC(y,0,4));
  const fdow=(first.getUTCDay()+6)%7;
  first.setUTCDate(first.getUTCDate()-fdow+3);
  const w=1+Math.round((d-first)/(7*24*3600*1000));
  return {y, w};
}
/* 회차 키 — 대회형 리그는 '그 해 몇 주차', 상시 리그는 '그 달 몇 주차' */
function roundOf(date, lg){
  if(lg && lgIsCup(lg)){ const {y,w}=isoWeek(date); return `${y}-W${String(w).padStart(2,'0')}`; }
  const [Y,M,D]=String(date).split('-').map(Number);
  /* 월요일을 주의 시작으로 본다. 1일이 무슨 요일이든 그 주가 1주차 */
  const off=(new Date(Y,M-1,1).getDay()+6)%7;      // 월=0 … 일=6
  const week=Math.floor((D+off-1)/7)+1;
  return `${String(Y)}-${String(M).padStart(2,'0')}-W${week}`;
}

    /* 주차 숫자만으로는 언제인지 감이 안 오니 그 주가 며칠부터 며칠까지인지 함께 보여준다 */

    const sun=new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
    const f=d=>`${d.getUTCMonth()+1}/${d.getUTCDate()}`;
    const range=mon.getUTCMonth()===sun.getUTCMonth() ? `${f(mon)}~${sun.getUTCDate()}` : `${f(mon)}~${f(sun)}`;
    return `'${yw[1].slice(2)} ${+yw[2]}주차 (${range})`;

  const [y,m,w]=s2.split('-');

};
/* 대회형 리그는 날짜에서 다시 센다 — 예전에 저장된 회차 키와 섞이지 않게 */
const rdOf = m => { if(!m) return '';
  const lg=lgOf(m);
  if(lgIsCup(lg)) return roundOf(m.date, lg);
  return m.rd || roundOf(m.date, lg); };

const liveMatches = ()=> S.matches.filter(m=>!m.void && inLg(m) && (!st().confirmedOnly || isConfirmed(m)));

const winnerOf = m => m.winnerId || (m.aSets>m.bSets ? m.aId : m.bId);
const loserOf  = m => winnerOf(m)===m.aId ? m.bId : m.aId;
const MODES = { skill:{label:'실력', note:'핸디가 없다고 가정했을 때의 순수 실력 점수입니다. 강한 상대를 이길수록 많이 오릅니다.'},

/* 한 트랙 계산 — mode: 'skill'=부수(부수 시작 + 핸디 보정) | 'form'=핸디포함(동일 시작 + 무보정) */
/* list(시간순 경기)와 full/pass 플래그를 인자로 받는다 — 안 주면 지금의 전역 상태.
   full: 전체 목록 계산일 때만 상대 강도 등 부가 정보를 경기에 남긴다.
   pass: 전체 이력 계산일 때만 개인 최고를 기록한다. */
function runEngine(mode, list, full, pass, players){
  list = list || S._sorted;
  full = full!=null ? full : S._fullList;
  pass = pass!=null ? pass : S._fullPass;
  players = players || S.players;
  const s=st(), skill=(mode==='skill');
  const dk = skill?['_sA','_sB']:['_fA','_fB'];
  const R={},H={},G={},LD={},PK={},RG={},PAIR={},PH={};
  players.forEach(p=>{
    PH[p.id]=normBuHist(p);
    R[p.id] = skill ? baseFor(PH[p.id].length ? PH[p.id][0].from : p.bu) : s.formBase;
    H[p.id] = [{d:p.joinedAt?p.joinedAt.slice(0,10):'', r:R[p.id]}];
    G[p.id] = 0; LD[p.id] = null; PK[p.id] = R[p.id]; RG[p.id] = 0;
  });
  const expAt = (id,m) => {                   // 이 경기 시점의 감쇠 경험치
    if(!LD[id]) return 0;
    return decayExp(G[id], daysBetween(LD[id], m.date));
  };
  const promotionFloor = (id,date)=>{
    if(!skill) return null;
    const h=PH[id]||[]; if(!h.length) return null;
    const prev=LD[id]; let ev=null;
    for(const x of h) if(x.date<=date && (!prev || x.date>prev)) ev=x;
    return ev ? baseFor(ev.bu) : null;
  };
  const applyPromotionFloor = (id,date)=>{
    const floor=promotionFloor(id,date);
    if(floor!=null && R[id]<floor){
      R[id]=floor;
      H[id].push({d:date,r:R[id],tag:'bu'});
      PK[id]=Math.max(PK[id],R[id]);
    }
  };
  for(const m of list){
    if(!(m.aId in R)||!(m.bId in R)){ m[dk[0]]=m[dk[1]]=0; continue; }
    applyPromotionFloor(m.aId,m.date); applyPromotionFloor(m.bId,m.date);
    const na=expAt(m.aId,m), nb=expAt(m.bId,m);
    /* 같은 사람을 100번 이기는 건 100개의 근거가 아니라 같은 근거의 반복이다.
       만날수록 한 경기가 주는 정보량을 줄인다. 오래 안 만났으면 다시 회복된다. */
    const pk = m.aId<m.bId ? m.aId+'|'+m.bId : m.bId+'|'+m.aId;
    let met = 0;
    if(PAIR[pk]) met = PAIR[pk].n * Math.pow(0.5, daysBetween(PAIR[pk].d, m.date)/(s.kHalfLife||30));
    const rep = s.repeatN0>0 ? 1/(1+met/s.repeatN0) : 1;
    PAIR[pk] = {n:met+1, d:m.date};
    const ra=R[m.aId], rb=R[m.bId];
    const {ea, eb, expA}=eloExpectation(ra,rb,m.aId,m.bId,m.handi,lgOf(m),mode);
    const sa = winnerOf(m)===m.aId ? 1 : 0;
    /* 세트 점수를 아는 경기(대회 격자 입력)는 이긴 폭도 반영한다 —
       완승(상대 0세트)은 1.2배, 한 세트 차 접전은 0.8배. 승패만 아는 경기는 그대로. */
    let mov=1;
    if(s.movOn && m.aSets!=null && m.bSets!=null){
      const mg=Math.abs(m.aSets-m.bSets), tot=Math.max(m.aSets,m.bSets);
      if(tot>=2 && mg>=1) mov = mg>=tot ? 1.2 : (mg===1 ? 0.8 : 1);
    }
    const dA = kFor(na)*rep*mov*(sa-expA);
    const dB = kFor(nb)*rep*mov*((1-sa)-(1-expA));
    R[m.aId]=ra+dA; R[m.bId]=rb+dB;
    if(skill && full){
      m._expA=expA;
      m._faceA = eb-(ea-ra);        // 내 원래 레이팅 기준으로 환산한 상대 강도
      m._faceB = ea-(eb-rb);
      if(pass){
        if(RG[m.aId]>=9 && R[m.aId]>PK[m.aId]){ m._peakA=Math.round(R[m.aId]); }
        if(RG[m.bId]>=9 && R[m.bId]>PK[m.bId]){ m._peakB=Math.round(R[m.bId]); }
      }
      PK[m.aId]=Math.max(PK[m.aId],R[m.aId]); PK[m.bId]=Math.max(PK[m.bId],R[m.bId]);
    }
    m[dk[0]]=dA; m[dk[1]]=dB;
    G[m.aId]=na+1; G[m.bId]=nb+1; RG[m.aId]++; RG[m.bId]++;
    LD[m.aId]=m.date; LD[m.bId]=m.date;
    H[m.aId].push({d:m.date,r:R[m.aId],id:m.id}); H[m.bId].push({d:m.date,r:R[m.bId],id:m.id});
  }
  return {R,H};
}
/* 문자열 지문 도우미 */
function calibMix(h, s){ s=String(s); for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))|0; return h; }
/* 보정 조건의 지문 — 부수·설정·보정 표본 범위·리그가 바뀌면 달라진다 */
function calibMetaSig(){
  let h=0;
  for(const p of S.players) h=calibMix(h, p.id+':'+p.bu+':'+JSON.stringify(normBuHist(p)));
  h=calibMix(h, JSON.stringify(st()));
  h=calibMix(h, typeof clubPer==='undefined'?'':clubPer);
  return (S.lg||'all')+'|'+h;
}
/* 시간순 경기 목록의 앞 n개 지문 — 과거 기록이 바뀌었는지 가려낸다 */
function calibPrefixHash(n){
  let h=0;
  for(let i=0;i<n;i++){ const m=S._sorted[i];
    h=calibMix(h, m.id+'|'+(m.rev||0)+'|'+m.date+'|'+winnerOf(m)
      +'|'+(m.handi?m.handi.pts+':'+m.handi.toId:'')+'|'+(m.lg||'')); }
  return h;
}
function recompute(){
  S.ratingsReady=false;
  S._mcache={};
  S._sorted = liveMatches().slice().sort((a,b)=>(a.date+'|'+a.enteredAt).localeCompare(b.date+'|'+b.enteredAt));
  S._fullList = true;                       // 지금 S._sorted 는 전체 경기 목록이다
  S._fullPass = true;                       // 전체 이력 계산일 때만 개인 최고를 기록한다
  S.matches.forEach(m=>{
    delete m._peakA; delete m._peakB;
    delete m._expA; delete m._faceA; delete m._faceB;
    delete m._sA; delete m._sB; delete m._fA; delete m._fB;
  });
  if(st().autoCalib){
    /* 보정은 시간이 아니라 데이터 기준으로 다시 한다.
       끝에 새 경기가 붙기만 한 동안은 calibEvery(기본 50)경기까지 직전 값을 쓰고,
       과거 수정·부수 변경·설정 변경이 감지되면 즉시 다시 계산한다.
       보정 자체는 늘 설정값에서 처음부터 수렴시키므로 알고리즘을 바꿔도 낡은 값이 남지 않는다. */
    const metaSig=calibMetaSig(), len=S._sorted.length;
    const store=localGet('tt:calib')||{}, key=S.lg||'all', rec=store[key];
    const fresh = rec && rec.metaSig===metaSig && rec.count<=len
               && (len-rec.count) < (st().calibEvery||50)
               && calibPrefixHash(rec.count)===rec.prefix;
    if(fresh) S._calib=rec.value;
    else{
      S._fullPass=false; S._calib=calibrateResidual(); S._fullPass=true;
      store[key]={metaSig, count:len, prefix:calibPrefixHash(len), value:S._calib};
      localSet('tt:calib', store);
    }
  }
  const G={},W={},L={},HH={};
  S.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;HH[p.id]={};});
  for(const m of S._sorted){
    if(!(m.aId in G)||!(m.bId in G)) continue;
    const aw = winnerOf(m)===m.aId;
    G[m.aId]++; G[m.bId]++;
    if(aw){ W[m.aId]++; L[m.bId]++; } else { W[m.bId]++; L[m.aId]++; }
    HH[m.aId][m.bId]=HH[m.aId][m.bId]||{w:0,l:0}; HH[m.bId][m.aId]=HH[m.bId][m.aId]||{w:0,l:0};
    if(aw){HH[m.aId][m.bId].w++;HH[m.bId][m.aId].l++;}else{HH[m.aId][m.bId].l++;HH[m.bId][m.aId].w++;}
  }
  const LAST={};
  S.players.forEach(p=>LAST[p.id]=null);
  for(const m of S._sorted){
    if(m.aId in LAST) LAST[m.aId] = !LAST[m.aId]||m.date>LAST[m.aId] ? m.date : LAST[m.aId];
    if(m.bId in LAST) LAST[m.bId] = !LAST[m.bId]||m.date>LAST[m.bId] ? m.date : LAST[m.bId];
  }
  S.G=G;S.W=W;S.L=L;S.HH=HH;S.LAST=LAST;
  S.tracks = { skill:runEngine('skill'), form:runEngine('form') };
  /* 상대 풀 천장 — 안 붙어본 수준까지 레이팅을 늘려 잡지 않는다.
     8부만 상대해서 전승했다고 3부로 올려버리면 근거가 없다. */
  S.cap = { skill:{}, form:{} };
  const ceilingRaw = Number(st().poolCeilingBu);
  const skillMarg = (Number.isFinite(ceilingRaw) ? Math.max(0, ceilingRaw) : 0) * perBu();
  const formMarg = ceilingRaw>0 ? ceilingRaw * perBu() : null;
  {
    /* 기준은 이겨본 상대다. 붙어보기만 한 건 근거가 되지 않는다.
       실력 천장은 상대의 레이팅이 아니라 그 경기에서 실제로 뛴 부수 기준이다.
       같은 10부만 이긴 기록이 8부·7부 수준까지 열리면 직관과 맞지 않는다. */
    const level = (oid,mode)=> Math.max(S.tracks[mode].R[oid] ?? -Infinity,
                                        mode==='skill' ? baseFor((P(oid)||{}).bu) : st().formBase);
    const bestOpp = {};
    for(const m of S._sorted){
      const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
      if(!(w in G) || !(l in G)) continue;
      const b = bestOpp[w] = bestOpp[w] || {skill:-Infinity, form:-Infinity};
      /* 핸디를 받고 이겼으면 그만큼 낮은 수준을 증명한 것이다 —
         핸디 1점 받고 9부를 이긴 건 '9부급'이 아니라 '9부 - 핸디 환산'급의 근거. */
      const disc = (m.handi && m.handi.pts>0 && m.handi.toId===w)
        ? m.handi.pts * (handiEloIn(lgOf(m)) || st().handiElo || 0) : 0;
      const oppBase = matchSkillCeilingBase(m, w);
      if(oppBase!=null) b.skill = Math.max(b.skill, oppBase - disc);   // 이긴 상대만 센다
      if(formMarg!=null) b.form = Math.max(b.form, level(l,'form')); // 핸디전 제한은 여유값을 켰을 때만
    }
    for(const p of S.players){
      const b=bestOpp[p.id];
      if(b && b.skill>-Infinity) S.cap.skill[p.id] = Math.max(baseFor(p.bu), b.skill + skillMarg);

function monthStand(ym, mode, until, state=S){

  if(state._mcache[key]) return state._mcache[key];
  /* 시즌 키가 4자리면 그 해 전체, 7자리면 그 달 */
  const n=String(ym).length;
  const list = state._sorted.filter(m=>m.date.slice(0,n)===ym && (!until || m.date<=until));
  const G={},W={},L={};
  state.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;});
  for(const m of list){
    if(!(m.aId in G)||!(m.bId in G)) continue;

      const own=byId[p.id]||[];

/* 최근 N일만으로 새로 계산한 순위 — 파워랭킹의 재료 */
function standings(period, mode, until, state=S){
  if(period==='all'){
    return state.players.filter(p=>p.active!==false)
      .map(p=>({p, r:rateOf(p.id,mode,state), g:state.G[p.id]||0, w:state.W[p.id]||0, l:state.L[p.id]||0}))
      .sort((a,b)=> b.r-a.r || b.g-a.g || a.p.name.localeCompare(b.p.name,'ko'));
  }

const rawRate = (id,mode,state=S)=>{ const v=trk(mode,state).R[id];

/* 경기가 적으면 아직 근거가 얇다. 부수 기준값 쪽으로 당겨서 초반 출렁임을 줄인다.

const rateOf = (id,mode,state=S)=>{ const r=shrunk(id,mode,state), c=capOf(id,mode,state);
  return (c!=null && r>c) ? c : r; };
function ranked(mode, state=S){

/* 요즘 변동: 최근 formDays일 동안 레이팅이 얼마나 움직였나 */
function deltaOf(id,mode,days){

  let base=h[0];

/* 몰아서 입력하면 같은 날 경기의 순서는 실제 순서가 아니다.

function dayRecords(id){
  const byDay={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const k=m.date; byDay[k]=byDay[k]||{d:k,w:0,l:0};

/* 최근 경기 결과 — 같은 날 안의 순서는 입력 순서라 참고용이다.

    .map(m=>({w:winnerOf(m)===id, opp:nameOf(m.aId===id?m.bId:m.aId), d:m.date}));

/* 최근 N경기도 날짜 경계에서 끊는다 — 하루 중간을 자르면 입력 순서에 따라 값이 달라진다 */

/* 특정 시점의 순위 — 리그 표처럼 순위 등락을 보여주기 위해 */

    return {id:p.id, r};

/* 퍼포먼스 레이팅 — 그 성적을 냈을 때 레이팅 변동이 0이 되는 값.

function perfRating(ms, id){
  const g=ms.map(m=>({f: m.aId===id?m._faceA:m._faceB, s: winnerOf(m)===id?1:0}))
            .filter(x=>x.f!=null);
  if(!g.length) return null;
  const score=g.reduce((a,x)=>a+x.s,0);
  const avg=g.reduce((a,x)=>a+x.f,0)/g.length;
  if(score===0)         return {rp:avg-400, n:g.length, score, avg, edge:'low'};
  if(score===g.length)  return {rp:avg+400, n:g.length, score, avg, edge:'high'};
  let lo=0, hi=4000;
  for(let i=0;i<64;i++){
    const mid=(lo+hi)/2;
    const exp=g.reduce((a,x)=>a+1/(1+Math.pow(10,(x.f-mid)/400)),0);
    if(exp<score) lo=mid; else hi=mid;

  return {rp:(lo+hi)/2, n:g.length, score, avg, edge:null};

function skillCeilingMargin(state=S){
  const v=Number(st(state).poolCeilingBu);

function matchSkillCeilingBu(m, id){
  const oid = m && (m.aId===id ? m.bId : m.bId===id ? m.aId : null);
  if(!oid) return null;
  const lg=lgOf(m);
  const p=P(oid);
  const bu = (lgIsCup(lg) ? rdBu(lg, rdOf(m), oid) : null) || buOnDateOf(p, m.date) || (p&&p.bu);
  const n=Number(bu);

function skillSeasonCeiling(ms, id, p, ym, state=S){
  const margin=skillCeilingMargin(state);

  for(const m of ms){
    if(winnerOf(m)!==id) continue;
    const base = matchSkillCeilingBase(m, id);
    if(base!=null && Number.isFinite(base)) best=Math.max(best, base);
  }
  if(best===-Infinity) return Infinity;
  const n=String(ym||'').length;
  const d=n===4 ? ym+'-12-31' : (n===7 ? ym+'-31' : today());

  return Math.max(floor, best + margin);

/* 상대 분석 — 표본이 적어도 뜻이 있게, 기대 승수 대비 실제 승수로 본다.

  if(!mine.length) return null;

  let best=null;
  for(const m of mine){
    const oid = m.aId===id ? m.bId : m.aId;
    const face = m.aId===id ? m._faceA : m._faceB;
    const won  = winnerOf(m)===id;
    const o=(opp[oid] = opp[oid] || {oid, w:0, l:0, face:0, n:0, hist:[], handi:null});

  for(const m of mine){

/* 새로 들어온 사람의 시작 레이팅이 실제 실력과 맞는지 진단.

function entryAccuracy(n=10){
  const seen={}; let exp=0, act=0, cnt=0;
  for(const m of (S._sorted||[])){
    for(const side of [0,1]){

/* 마지막으로 본 데이터를 기기에 남겨둔다. 다음 접속 때 네트워크를 기다리지 않고 바로 그린다. */
const CACHE_KEY='tt:cache:'+CLUB;

let _chgSeq=0;
const syncState = ()=> localGet(SYNC_KEY) || {};
function rememberSyncKey(key){
  if(!key) return;
  const cur=syncState();
  if(cur.lastKey && cur.lastKey>=key) return;
  localSet(SYNC_KEY, {...cur, lastKey:key, at:Date.now()});
}
function changeKey(t=Date.now()){
  return String(t).padStart(13,'0')+'_'+CLIENT+'_'+String(_chgSeq++).padStart(4,'0');
}
function baselineChangeKey(){
  return String(Math.max(0,Date.now()-30000)).padStart(13,'0')+'_baseline';
}
function matchChangePatch(ids, op, t=Date.now()){
  const obj={}, list=[...new Set((ids||[]).filter(Boolean))];
  let last='';
  list.forEach(id=>{
    const key=changeKey(t);
    last=key;
    obj[`${FBC}/${key}`]={id, op, t, by:CLIENT};
  });
  return {obj,last};
}
function stampMatch(m, t=Date.now()){

}
function idbCall(mode, fn){
  return new Promise((resolve,reject)=>{
    if(typeof indexedDB==='undefined') return reject(new Error('IndexedDB 없음'));
    const req=indexedDB.open(CACHE_DB,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(CACHE_STORE)) db.createObjectStore(CACHE_STORE); };
    req.onerror=()=>reject(req.error);
    req.onsuccess=()=>{
      const db=req.result, tx=db.transaction(CACHE_STORE, mode), st0=tx.objectStore(CACHE_STORE);
      let done=false;
      const finish=v=>{ if(done) return; done=true; resolve(v); };
      const fail=e=>{ if(done) return; done=true; reject(e); };
      tx.oncomplete=()=>db.close();
      tx.onerror=()=>{ const e=tx.error; db.close(); fail(e); };
      try{
        const op=fn(st0);
        op.onsuccess=()=>finish(op.result);
        op.onerror=()=>fail(op.error);
      }catch(e){ db.close(); fail(e); }
    };

async function loadDelta(){
  if(!FB || !S.matches.length) return false;
  const lastKey=syncState().lastKey;
  if(!lastKey) return false;
  try{
    const [meta0, players0, changes, sig] = await Promise.all([
      sGet(KEY.meta), sGet(KEY.players), FB.changesAfter(lastKey),
      FB.get('sig').catch(()=>null)
    ]);
    adoptMeta(meta0);
    S.players = players0 || [];
    /* 서버가 알려준 총 경기 수와 크게 어긋나면 증분을 포기하고 전체를 다시 받는다.

    const wantN = sig && sig.n;
    if(!changes.length){
      if(wantN && Math.abs(S.matches.length - wantN) > 2) return false;
      refreshLoadedRatings();
      saveCache();
      return true;
    }
    const latest=changes[changes.length-1].key;
    const byId=new Map();
    changes.forEach(c=>{ if(c&&c.id) byId.set(c.id,c); });
    const local=new Map(S.matches.map(m=>[m.id,m]));
    const fetchIds=[];
    byId.forEach(c=>{
      if(c.op==='del') local.delete(c.id);
      else fetchIds.push(c.id);
    });
    if(fetchIds.length){
      const got=await Promise.all(fetchIds.map(id=>FB.get(FBM+'/'+id).catch(()=>null)));
      got.forEach((m,i)=>{
        if(!m){ local.delete(fetchIds[i]); return; }
        const prev=local.get(m.id);
        if(!prev || (m.rev||0)>=(prev.rev||0)) local.set(m.id,m);
      });
    }
    if(wantN && Math.abs(local.size - wantN) > 2) return false;
    S.matches=[...local.values()];
    rememberSyncKey(latest);
    S._shards=1;
    refreshLoadedRatings();
    saveCache();
    return true;
  }catch(e){ S.lastError=e && (e.message||String(e)); return false; }
}

async function fbSaveMatches(list){

  ms.forEach(m=>{ patch[`${FBM}/${m.id}`]=m; });
  const delCh=matchChangePatch(dels,'del',t);
  const setCh=matchChangePatch(ms.map(m=>m.id),'set',t+1);

      for(const [k,ms] of Object.entries(byShard)){

      const local = new Map(S.matches.map(m=>[m.id,m]));
