/* 마감된 시즌만 통산 기록에 넣는다. 진행 중인 시즌은 순위가 아직 확정이 아니다. */
const closedSeasons = ()=> seasons().filter(isClosedSeason);
function careerRank(id, mode){
  const yms=closedSeasons();
  const MIN=st().provisional||0;
  const rs=[];                       // {ym, r}
  for(const ym of yms){
    const all=standings(ym,mode).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    if(i>=0) rs.push({ym, r:i+1});
  }
  if(!rs.length) return {n:0};
  const nums=rs.map(x=>x.r);
  const best=Math.min(...nums);
  const bestAt=rs.find(x=>x.r===best);
  const winSeasons=rs.filter(x=>x.r===1).map(x=>x.ym);
  return {n:rs.length, best, bestYm:bestAt?bestAt.ym:null,
          avg:nums.reduce((a,b)=>a+b,0)/nums.length,
          wins:winSeasons.length, winYms:winSeasons};
}
/* 통산 순위 기록 */
/* 시즌별 세부 기록 — 탁구에서 의미 있는 것들 */
function seasonStats(id, ym, mode){
  const me=P(id); if(!me) return null;
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,String(ym).length)===ym && (m.aId===id||m.bId===id));
  let ups=0, hiW=0, hiL=0, loW=0, loL=0, faceSum=0, fn=0, gave=0, gaveW=0, got=0, gotW=0, best=null;
  const opps=new Set();
  for(const m of ms){
    const oid = m.aId===id ? m.bId : m.aId, o=P(oid); if(!o) continue;
    opps.add(oid);
    const won = winnerOf(m)===id;
    const e = expFor(m, id);
    if(won && e!=null && e<UPSET) ups++;
    if(o.bu < me.bu){ won?hiW++:hiL++; } else if(o.bu > me.bu){ won?loW++:loL++; }
    /* 상대 강도는 상대의 등록 부수로 본다. 엔진 내부값(_face)은 모드에 따라 덮여서 쓰면 안 된다. */
    faceSum += o.bu; fn++;
    if(won && (!best || o.bu < best.bu)) best={bu:o.bu, oid};
    if(m.handi && m.handi.pts){
      if(m.handi.toId!==id){ gave++; if(won) gaveW++; } else { got++; if(won) gotW++; }
    }
  }
  return {n:ms.length, ups, hiW, hiL, loW, loL, gave, gaveW, got, gotW, best,
          avgBu: fn?faceSum/fn:null, opps:opps.size};
}
/* ── 클럽 분석 ──────────────────────────────────────────────
   손으로는 못 세는 것들: 팽팽한 매치업, 물고 물리는 삼각관계, 부수 조정 후보 */
function fairHandi(aId, bId){
  const A=P(aId), B=P(bId); if(!A||!B) return null;
  const ra=rawRate(aId,'skill'), rb=rawRate(bId,'skill'), lg=predictionLeague();
  const gap=ra-rb;
  const cur=(st().handiOn && A.bu!==B.bu) ? handiPtsIn(A.bu,B.bu,lg) : 0;
  const curTo=A.bu>B.bu?aId:(B.bu>A.bu?bId:null);
  const he=handiEloIn(lg);
  const need=st().handiOn && he>0 ? Math.round(Math.abs(gap)/he) : null;
  const needTo=gap>0?bId:aId;
  const hd=cur>0 ? {toId:curTo,pts:cur} : null;
  return {gap, cur, curTo, need, needTo, exp:eloExpectation(ra,rb,aId,bId,hd,lg).expA};
}
function pairStats(aId,bId){
  let w=0,l=0,last=null;
  for(const m of clubScope()){
    if((m.aId===aId&&m.bId===bId)||(m.aId===bId&&m.bId===aId)){
      (winnerOf(m)===aId)?w++:l++; last=m.date;
    }
  }
  return {w,l,n:w+l,last};
}
/* 물고 물리는 삼각관계 — A가 B를, B가 C를, C가 A를 이기는 고리 */
function findCycles(minGames){
  if(_cycCache && _cycCache.key===_cycKey(minGames)) return _cycCache.out;
  const ps=roster().filter(p=>(S.G[p.id]||0)>0);
  const ok=new Set(ps.map(p=>p.id));
  /* 쌍별 전적은 경기 목록을 한 번만 훑어 모은다 —
     쌍마다 전체를 다시 훑으면(1.1만 쌍 × 1.2만 경기) 탭이 몇 초씩 걸린다 */
  const pair={};
  for(const m of clubScope()){
    if(!ok.has(m.aId)||!ok.has(m.bId)) continue;
    const [x,y]=m.aId<m.bId?[m.aId,m.bId]:[m.bId,m.aId];
    const r=pair[x+'|'+y]=pair[x+'|'+y]||{x,y,xw:0,yw:0};
    if(winnerOf(m)===x) r.xw++; else r.yw++;
  }
  const edge={};      // edge[a][b] = true  (a가 b에게 우세)
  const info={};
  for(const k in pair){
    const r=pair[k];
    if(r.xw+r.yw<minGames || r.xw===r.yw) continue;
    const [w,l,wn,ln]=r.xw>r.yw?[r.x,r.y,r.xw,r.yw]:[r.y,r.x,r.yw,r.xw];
    (edge[w]=edge[w]||{})[l]=1; info[w+'>'+l]=`${wn}−${ln}`;
  }
  /* 고리 찾기는 이긴 관계(간선)만 따라간다 — 전체 세제곱 순회보다 수백 배 싸다 */
  const out=[];
  for(const a in edge) for(const b in edge[a]){
    const eb=edge[b]; if(!eb) continue;
    for(const c in eb){
      if(c===a || !edge[c] || !edge[c][a]) continue;
      if(a<b && a<c) out.push([a,b,c,info]);          // 회전 중복은 a가 최소일 때만 기록
    }
  }
  _cycCache={key:_cycKey(minGames), out};
  return out;
}
/* 탭을 오갈 때마다 다시 계산하지 않게 — 경기 수·리그·기간이 그대로면 재사용 */
let _cycCache=null;
const _cycKey=mg=>(S.lg||'all')+'|'+clubScope().length+'|'+(typeof clubPer==='undefined'?'':clubPer)+'|'+mg;
/* 부수 조정 후보 — 체감과 등록 부수가 벌어진 사람 */
function buCandidates(){
  const MIN=Math.max(st().provisional||0, 8);
  return roster().map(p=>{
    const g=S.G[p.id]||0; if(g<MIN) return null;
    const felt=buScale(rateOf(p.id,'skill'));
    const d=p.bu-felt;                                 // +면 체감이 더 강함(승격 후보)
    if(Math.abs(d)<1.0) return null;
    return {p, g, felt, d};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
/* ── 대회 시뮬레이터 ──────────────────────────────────────────
   실력은 부수 레이팅(핸디를 걷어낸 값)으로 보고,
   핸디 적용 여부는 경기 조건으로 따로 고른다. */
function simWinProb(a, b, useHandi, lg=predictionLeague()){
  let handi=null;
  if(useHandi && a.bu!==b.bu){
    handi={toId:a.bu>b.bu?a.id:b.id, pts:handiPtsIn(a.bu,b.bu,lg)};
  }
  return eloExpectation(a.r,b.r,a.id,b.id,handi,lg).expA;
}
const nextPow2 = n => { let k=1; while(k<n) k*=2; return k; };
function playLeague(members, useHandi, rnd){
  const rec={}; members.forEach(m=>rec[m.id]={w:0,l:0,h2h:{}});
  for(let i=0;i<members.length;i++) for(let j=i+1;j<members.length;j++){
    const A=members[i], B=members[j];
    const aw = rnd() < simWinProb(A,B,useHandi);
    if(aw){ rec[A.id].w++; rec[B.id].l++; rec[A.id].h2h[B.id]=1; rec[B.id].h2h[A.id]=0; }
    else  { rec[B.id].w++; rec[A.id].l++; rec[B.id].h2h[A.id]=1; rec[A.id].h2h[B.id]=0; }
  }
  return members.slice().sort((x,y)=>{
    const d=rec[y.id].w-rec[x.id].w; if(d) return d;
    const h=rec[x.id].h2h[y.id];                 // 승자승
    if(h===1) return -1; if(h===0) return 1;
    return rnd()-0.5;
  }).map(p=>({...p, w:rec[p.id].w, l:rec[p.id].l}));
}
/* 표준 대진 순서 — 1위와 최하위가 반대편에 서고, 부전승이 고르게 흩어진다 */
function seedOrder(size){
  let o=[1];
  while(o.length<size){
    const n=o.length*2, next=[];
    o.forEach(x=>{ next.push(x); next.push(n+1-x); });
    o=next;
  }
  return o;
}
function playKnockout(seeds, useHandi, rnd){
  const size=nextPow2(seeds.length);
  const order=seedOrder(size);
  const slots=order.map(seedNo => seeds[seedNo-1] || null);   // 빈 번호는 부전승
  const rounds=[];                                // 각 라운드를 시작할 때 살아 있는 사람
  const log=[];
  let round=slots;
  while(round.length>1){
    rounds.push(round.filter(Boolean).map(p=>p.id));
    const next=[];
    for(let i=0;i<round.length;i+=2){
      const A=round[i], B=round[i+1];
      if(!A && !B){ next.push(null); continue; }
      if(!A || !B){ next.push(A||B); continue; }  // 부전승도 다음 라운드 명단에 들어간다
      const aw = rnd() < simWinProb(A,B,useHandi);
      const win = aw?A:B, lose = aw?B:A;
      log.push({size:round.length, win:win.id, lose:lose.id});
      next.push(win);
    }
    round=next;
  }
  rounds.push(round.filter(Boolean).map(p=>p.id)); // 마지막은 우승자
  return {champ:round[0]||null, rounds, log};
}
/* 조별리그 통과자를 토너먼트 대진으로. 같은 조 1위끼리 일찍 만나지 않게 교차 배치한다. */
function bracketSeeds(tops, adv){
  const A=[], B=[];
  tops.forEach((order,gi)=>order.slice(0,adv).forEach((p,k)=>{
    ((gi+k)%2===0 ? A : B).push(p);
  }));
  const out=[], n=Math.max(A.length,B.length);
  for(let k=0;k<n;k++){ if(A[k]) out.push(A[k]); if(B[k]) out.push(B[k]); }
  return out;
}
/* 조 편성 — 4명씩을 기본으로, 남으면 3명 조를 섞는다 */
function groupSizes(n, want){
  if(want>=3 && n>=want){
    /* 지정 인원에 가장 가깝게 나눈다. 딱 떨어지지 않으면 한 명씩만 차이 나게 */
    const k=Math.max(1, Math.round(n/want));
    const base=Math.floor(n/k), r=n%k;
    const sz=Array.from({length:k},(_,i)=>base+(i<r?1:0));
    /* 조 인원이 지정값에서 2명 이상 벌어지면 조 수를 하나 늘려 다시 나눈다 */
    if(Math.max(...sz)-want>=2){
      const k2=k+1, b2=Math.floor(n/k2), r2=n%k2;
      return Array.from({length:k2},(_,i)=>b2+(i<r2?1:0)).sort((a,b)=>b-a);
    }
    return sz.sort((a,b)=>b-a);
  }
  if(n<3) return n?[n]:[];
  if(n===3) return [3];
  if(n===4) return [4];
  if(n===5) return [3,2];
  let a=Math.floor(n/4), b=0, r=n%4;
  if(r===1){ a-=2; b=3; }            // 4+4+1 → 3+3+3
  else if(r===2){ a-=1; b=2; }       // 4+2   → 3+3
  else if(r===3){ b=1; }
  if(a<0){ a=0; b=Math.ceil(n/3); }
  const sz=Array.from({length:a},()=>4).concat(Array.from({length:b},()=>3));
  let diff=n-sz.reduce((x,y)=>x+y,0);
  for(let i=0; diff>0 && i<sz.length; i++){ sz[i]++; diff--; }
  return sz.sort((x,y)=>y-x);
}
/* 한 번 뽑아서 실제로 치러 본다 — 조 편성, 조별 결과, 대진표를 그대로 남긴다 */
function drawOnce(opts){
  const {ids, useHandi, format, adv} = opts;
  const rnd=Math.random;
  const base=ids.map(id=>({id, r:rawRate(id,'skill'), bu:(P(id)||{}).bu||10, name:nameOf(id)}));
  const sh=base.slice();
  for(let i=sh.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [sh[i],sh[j]]=[sh[j],sh[i]]; }

  if(format==='league'){
    const order=playLeague(sh, useHandi, rnd);
    return {format, league:order, champ:order[0]||null};
  }
  if(format==='cup'){
    const ko=playKnockout(sh, useHandi, rnd);
    return {format, seeds:sh, ko, champ:ko.champ};
  }
  const sz=groupSizes(sh.length, opts.gsize);
  const gs=[]; let k=0;
  sz.forEach(n=>{ gs.push(sh.slice(k,k+n)); k+=n; });
  const tops=gs.map(g=>playLeague(g, useHandi, rnd));
  const seeds=bracketSeeds(tops, adv);
  const ko=playKnockout(seeds, useHandi, rnd);
  return {format, groups:tops, adv, seeds, ko, champ:ko.champ};
}
/* 핸디 표 진단 — 부수 차 구간별로
   ① 실제 승률  ② 그 승률이 우연일 수 있는 범위  ③ 5:5로 만드는 적정 핸디 점수 */
/* 반복 대결 감쇠 — 통계용. 같은 두 사람의 k번째 만남일수록 가중치를 줄인다.
   특정 몇 명만 반복해서 잡는 '상성'이 전체 통계를 흔들지 않게 한다.
   기준(repeatN0)은 레이팅 엔진과 공유하고, 시간에 따른 회복은 생략한 단순판. */
function repWeighter(){
  const meets={};
  const n0=st().repeatN0||0;
  return (aId,bId)=>{
    if(n0<=0) return 1;
    const pk = aId<bId ? aId+'|'+bId : bId+'|'+aId;
    const met = meets[pk]||0; meets[pk]=met+1;
    return 1/(1+met/n0);
  };
}
/* opt.raw — 레이팅 자동 보정용 원본 모드. 반복 대결 감쇠·시점 부수 없이
   예전 그대로 계산한다. 보정 알고리즘을 바꾸는 건 별도 결정으로 남겨둔다. */
function handiTable(opt){
  const raw = !!(opt && opt.raw);
  const rows={};
  const rw=repWeighter();
  for(const m of clubScope()){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    /* 화면용은 경기 시점 부수 — 승급자의 옛 경기는 옛 부수로 */
    const buA = raw ? A.bu : buOnDate(m.aId,m.date);
    const buB = raw ? B.bu : buOnDate(m.bId,m.date);
    const d=Math.abs(buA-buB); if(!d) continue;
    const recv = buA>buB ? m.aId : m.bId;           // 부수가 높은 쪽 = 약한 쪽 = 핸디 받는 쪽
    const give = recv===m.aId ? m.bId : m.aId;
    const wt = raw ? 1 : rw(m.aId,m.bId);
    const r=rows[d]=rows[d]||{n:0,en:0,w:0,ew:0,gap:0,pts:0,exp:0};
    r.n++; r.en+=wt;
    if(winnerOf(m)===recv){ r.w++; r.ew+=wt; }
    if(m._expA!=null) r.exp += (recv===m.aId ? m._expA : 1-m._expA);
    r.gap += rateOf(give,'skill') - rateOf(recv,'skill');   // 핸디 빼고 순수 실력차
    r.pts += (m.handi && m.handi.pts) ? m.handi.pts : d*st().ptsPerBu;
  }
  const he=st().handiElo||1;
  return Object.entries(rows).map(([d,r])=>{
    const rate=r.en?r.ew/r.en:0;                    // 상성 보정 승률 (반복 대결 감쇠)
    const se=Math.sqrt(rate*(1-rate)/Math.max(r.en,1));  // 유효 표본 기준 오차
    const gap=r.gap/r.n;                            // 이 구간 평균 실력차 (점)
    const cur=r.pts/r.n;                            // 이 구간에서 실제로 준 평균 핸디 점수
    const A=Math.min(.95,Math.max(.05,rate));
    /* 이 구간만 놓고 봤을 때의 '핸디 후 남는 부수당 격차' */
    const own = -400*Math.log10(A/(1-A)) / (+d);
    return {d:+d, n:r.n, en:r.en, w:r.w, rate, own, expAvg: r.exp/r.n,
      lo:Math.max(0,rate-1.96*se), hi:Math.min(1,rate+1.96*se),
      gap, cur, fair: gap/he,                       // 5:5로 만드는 데 필요한 점수
      solid: r.en>=15 && (rate-1.96*se>0.5 || rate+1.96*se<0.5) };
  }).sort((a,b)=>a.d-b.d);
}
/* ── 부수별 분석 ────────────────────────────────────────── */
/* 1) 같은 부수끼리 붙은 경기만 추려 그 안의 순위를 낸다 */
function sameBuTable(bu){
  const ids=new Set(roster().filter(p=>p.bu===bu).map(p=>p.id));
  const st1={};
  ids.forEach(id=>st1[id]={id,g:0,w:0,l:0});
  for(const m of clubScope()){
    if(!ids.has(m.aId) || !ids.has(m.bId)) continue;
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    st1[w].g++; st1[w].w++; st1[l].g++; st1[l].l++;
  }
  return Object.values(st1).filter(x=>x.g>0)
    .sort((a,b)=>(b.w-b.l)-(a.w-a.l) || b.w-a.w || a.g-b.g);
}
/* 2) 부수별 평균 퍼포먼스가 달마다 어떻게 움직였나 */
function buTrend(){
  const ms=monthSeasons();
  const out={};
  ms.forEach(ym=>{
    const t=monthStand(ym,'skill');
    const by={};
    roster().forEach(p=>{
      if((t.G[p.id]||0) < 3) return;
      (by[p.bu]=by[p.bu]||[]).push(t.R[p.id]);
    });
    Object.keys(by).forEach(bu=>{
      const arr=by[bu];
      (out[bu]=out[bu]||[]).push({ym, n:arr.length, avg:arr.reduce((a,x)=>a+x,0)/arr.length});
    });
  });
  return out;
}
/* 3) 부수마다 그 시즌의 선수 */
function buMvp(ym){
  const t=monthStand(ym,'skill');
  const by={};
  roster().forEach(p=>{
    const g=t.G[p.id]||0; if(g<3) return;
    const w=t.W[p.id]||0, l=t.L[p.id]||0;
    (by[p.bu]=by[p.bu]||[]).push({p,g,w,l,r:t.R[p.id]});
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(bu=>{
    const list=by[bu].sort((x,y)=>(y.w-y.l)-(x.w-x.l) || (y.w/y.g)-(x.w/x.g) || y.g-x.g);
    return {bu, top:list[0], n:list.length};
  });
}
/* 4) 체감 부수가 달마다 어디로 가고 있나 → 언제쯤 한 부수를 넘어설까 */
function promoTrend(id){
  const p=P(id); if(!p) return null;
  const hist=(trk('skill').H[id]||[]).filter(x=>x.d);
  if(hist.length<6) return null;
  const ms=monthSeasons().slice(-4);
  if(ms.length<2) return null;
  const pts=[];
  ms.forEach((ym,i)=>{
    const end=ym+'-31';
    let last=null;
    for(const x of hist){ if(x.d<=end) last=x; }
    if(last) pts.push({i, felt:buScale(last.r)});
  });
  if(pts.length<2) return null;
  const n=pts.length;
  const mx=pts.reduce((a,x)=>a+x.i,0)/n, my=pts.reduce((a,x)=>a+x.felt,0)/n;
  const den=pts.reduce((a,x)=>a+(x.i-mx)**2,0);
  if(!den) return null;
  const slope=pts.reduce((a,x)=>a+(x.i-mx)*(x.felt-my),0)/den;   // 달마다 체감 부수 변화(−면 강해짐)
  const cur=pts[n-1].felt;
  const target=p.bu-1;                                            // 한 부수 위
  if(slope>=-0.02) return {cur, slope, months:null};              // 좋아지는 추세가 아니다
  const months=Math.ceil((cur-target)/(-slope));
  return {cur, slope, months: (months>0&&months<=36)?months:null};
}
/* 부수 조합별 핸디 진단 — 같은 '차 1' 이라도 5↔6 과 9↔10 은 다르다 */
function handiPairs(){
  const rows={};
  const rw=repWeighter();
  for(const m of clubScope()){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    /* 경기 시점 부수 — 승급한 사람의 옛 경기는 옛 부수로 센다 */
    const buA=buOnDate(m.aId,m.date), buB=buOnDate(m.bId,m.date);
    if(buA===buB) continue;
    const hiBu=Math.min(buA,buB), loBu=Math.max(buA,buB);
    const loId = buA>buB ? m.aId : m.bId;         // 핸디 받는 쪽
    const wt=rw(m.aId,m.bId);
    const k = hiBu+'>'+loBu;
    const r = rows[k] = rows[k] || {hi:hiBu, lo:loBu, d:loBu-hiBu, n:0, en:0, w:0, ew:0, pts:0};
    r.n++; r.en+=wt;
    if(winnerOf(m)===loId){ r.w++; r.ew+=wt; }
    r.pts += (m.handi&&m.handi.pts) ? m.handi.pts : handiPtsIn(hiBu, loBu, lgOf(m));
  }
  return Object.values(rows).map(r=>{
    const rate=r.en?r.ew/r.en:0, A=Math.min(.95,Math.max(.05,rate));   // 상성 보정 승률
    return {...r, rate, avgPts:r.pts/r.n,
      own: -400*Math.log10(A/(1-A)) / r.d,
      solid: r.en>=10 };
  }).sort((a,b)=> a.d-b.d || a.hi-b.hi);
}
/* 기록실 */
function hallOfFame(){
  const pair={}, ups=[], byId={};
  for(const m of (S._sorted||[])){
    const k=[m.aId,m.bId].sort().join('|');
    pair[k]=(pair[k]||0)+1;
    const w=winnerOf(m), e=expFor(m, w);
    if(e!=null && e<0.5) ups.push({m, e, w});
    [m.aId,m.bId].forEach(id=>{ const b=byId[id]=byId[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
  }
  const topPairs=Object.entries(pair).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([k,n])=>({a:k.split('|')[0], b:k.split('|')[1], n}));
  const topUps=ups.sort((a,b)=>a.e-b.e).slice(0,5);
  const arr=Object.entries(byId).map(([id,b])=>({id, ...b, days:b.days.size}));
  return { topPairs, topUps,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g).slice(0,5),
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days).slice(0,5),
    mostWins:  arr.slice().sort((a,b)=>b.w-a.w).slice(0,5) };
}
/* 출석 — 요일별 · 월별 */
function attendance(){
  const dow=[0,0,0,0,0,0,0], mon={}, dayPl={};
  for(const m of clubScope()){
    const [y,mo,dd]=m.date.split('-').map(Number);
    dow[new Date(y,mo-1,dd).getDay()]++;
    mon[m.date.slice(0,7)]=(mon[m.date.slice(0,7)]||0)+1;
    (dayPl[m.date]=dayPl[m.date]||new Set()).add(m.aId).add(m.bId);
  }
  const days=Object.keys(dayPl).sort();
  return {dow, mon:Object.entries(mon).sort(), days,

function monthlyReport(ym){
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,String(ym).length)===ym);
  if(!ms.length) return null;
  const by={}, pair={}; let best=null;
  for(const m of ms){
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    [m.aId,m.bId].forEach(id=>{ const b=by[id]=by[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
    const k=[m.aId,m.bId].sort().join('|'); pair[k]=(pair[k]||0)+1;
    const e=expFor(m, w);
    if(e!=null && (!best || e<best.e)) best={m,e,w,l};
  }
  const arr=Object.entries(by).map(([id,b])=>({id,...b,days:b.days.size}));
  const rows=standings(ym,'skill').filter(r=>r.g>=(st().provisional||0));
  const pv=standings(ym,'skill',dayAgo(30)).filter(r=>r.g>=(st().provisional||0));
  const pvIdx={}; pv.forEach((r,i)=>pvIdx[r.p.id]=i+1);
  let rise=null;
  rows.forEach((r,i)=>{ const mv=pvIdx[r.p.id]?pvIdx[r.p.id]-(i+1):0;
    if(mv>0 && (!rise||mv>rise.mv)) rise={id:r.p.id, mv, rank:i+1}; });
  const tp=Object.entries(pair).sort((a,b)=>b[1]-a[1])[0];
  const MIN3=Math.max(3, Math.min(5, st().provisional||3));
  const mvp=arr.filter(x=>x.g>=MIN3).sort((a,b)=>
    (b.w-a.w) || ((b.w/b.g)-(a.w/a.g)) || (b.g-a.g))[0] || null;
  return { n:ms.length, days:new Set(ms.map(m=>m.date)).size, players:arr.length,
    mvp, minG:MIN3,
    champ: rows[0]||null,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g)[0],
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days)[0],
    bestWin:   arr.filter(x=>x.g>=3).sort((a,b)=>(b.w/b.g)-(a.w/a.g))[0],
    upset: best, rise,
    topPair: tp? {a:tp[0].split('|')[0], b:tp[0].split('|')[1], n:tp[1]} : null };
}

   매 경기 기대 승률을 더한 값이 '실력대로면 이랬을 승수'다. */
function luckTable(ym){
  const by={};
  for(const m of (S._sorted||[])){
    if(ym && m.date.slice(0,String(ym).length)!==ym) continue;
    const eA=expOf(m); if(eA==null) continue;
    const w=winnerOf(m);
    [[m.aId,eA],[m.bId,1-eA]].forEach(([id,e])=>{
      const b=by[id]=by[id]||{g:0,w:0,exp:0};
      b.g++; b.exp+=e; if(w===id) b.w++;
    });
  }
  return Object.entries(by).map(([id,b])=>({id, g:b.g, w:b.w, exp:b.exp,
      diff:b.w-b.exp, rate:(b.w-b.exp)/b.g}))
    .filter(x=>x.g>=5).sort((a,b)=>b.diff-a.diff);

/* 칭호 — 그 시즌의 성향을 한마디로. 한 사람당 최대 두 개만 붙인다. */
function playerTitles(period, mode){
  /* 시즌 키가 4자리(연 단위)일 수도 있다 — 대회형 리그는 해로 묶는다 */
  const inP = m => period==='all' ? true : m.date.slice(0,String(period).length)===period;
  /* 지금 보는 리그의 방식 — 통합 보기는 섞여 있으므로 거르지 않는다 */
  const lgKind = curLg()==='all' ? null : (lgIsCup(curLg()) ? 'cup' : 'daily');
  const st1={};
  const push=(id)=> st1[id] = st1[id] ||
    {g:0,w:0, hiG:0,hiW:0, loG:0,loW:0, pmG:0,pmW:0, pnG:0,pnW:0,
     ups:0, upsN:0, upsExp:0, days:new Set(), day:{}, opps:new Set(),
     sameG:0, sameW:0, dayWL:{}, favG:0, favW:0};
  for(const m of (S._sorted||[])){
    if(!inP(m)) continue;
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    const w=winnerOf(m);
    for(const [me,op] of [[A,B],[B,A]]){
      push(me.id); const b=st1[me.id];
      b.g++; b.days.add(m.date); if(w===me.id) b.w++;
      if(op.bu < me.bu){ b.hiG++; if(w===me.id) b.hiW++; }        // 상위 부수 상대
      else if(op.bu > me.bu){ b.loG++; if(w===me.id) b.loW++; }   // 하위 부수 상대
      if(isPimple(op)){ b.pmG++; if(w===me.id) b.pmW++; }
      if(isPen(op)){    b.pnG++; if(w===me.id) b.pnW++; }
      if(op.bu===me.bu){ b.sameG++; if(w===me.id) b.sameW++; }
      b.opps.add(op.id);
      const dw=b.dayWL[m.date]=b.dayWL[m.date]||{w:0,l:0};
      if(w===me.id) dw.w++; else dw.l++;
      const e = expFor(m, me.id);
      if(e!=null && e<UPSET){                     // 불리하게 시작한 판
        b.upsN++; b.upsExp+=e;
        if(w===me.id) b.ups++;
      }
      if(e!=null && e>=1-UPSET){                  // 유리하게 시작한 판
        b.favG++; if(w===me.id) b.favW++;
      }
      const d = m.aId===me.id ? m._sA : m._sB;         // 그 경기로 움직인 점수
      if(d!=null) b.day[m.date] = (b.day[m.date]||0) + d;
    }
  }
  const ids=Object.keys(st1);
  if(!ids.length) return {};
  /* 기복 = 그날그날 레이팅이 얼마나 출렁였나. 날짜별 변동폭의 표준편차로 본다. */
  const swingRank={};
  /* 터줏대감 — 그 부수 안에서 승률 1위. 부수마다 한 명씩 나온다.
     같은 부수끼리 붙는 판이 원래 많지 않아 3경기를 기준으로 잡는다. */
  const sameBest={};
  {
    const byBu={};
    ids.forEach(id=>{ const p=P(id); if(!p) return;
      if(st1[id].sameG>=3) (byBu[p.bu]=byBu[p.bu]||[]).push(id); });
    Object.values(byBu).forEach(list=>{
      /* 자격자가 혼자여도 그 부수 1위는 1위다 */
      /* 이긴 판에서 진 판을 뺀 값이 가장 큰 사람. 같으면 승률로 가린다 */
      const net=x=>st1[x].sameW*2 - st1[x].sameG;
      const top=list.slice().sort((a,b)=>
        net(b)-net(a) || (st1[b].sameW/st1[b].sameG)-(st1[a].sameW/st1[a].sameG))[0];
      const b2=st1[top];
      if(b2 && b2.sameW*2 > b2.sameG) sameBest[top]=1;
    });
  }
  const maxOpps=Math.max(...ids.map(i=>st1[i].opps.size), 0);
  const maxUps =Math.max(...ids.map(i=>st1[i].ups), 0);   // 대회형 '이변 제조기'용 — 시즌 최다
  /* 전체 승률 1위 · 러버/그립/손별 1위 · 하루 전승한 날 */
  const bestOf=(pick, minG)=>{
    const cand=ids.filter(id=>{ const p=P(id); return p && pick(p) && st1[id].g>=(minG||8); });
    if(cand.length<3) return null;
    const top=cand.slice().sort((a,b)=>(st1[b].w/st1[b].g)-(st1[a].w/st1[a].g) || st1[b].w-st1[a].w)[0];
    return (st1[top].w/st1[top].g >= 0.6) ? top : null;
  };
  const kingId = bestOf(()=>true, 10);
  /* 퍼펙트 — 5경기 이상 친 날을 한 판도 안 지고 마친 적이 있는가 */
  const perfect={};
  ids.forEach(id=>{
    perfect[id]=Object.values(st1[id].dayWL).filter(x=>x.l===0 && x.w>=5).length;
  });
  /* 불사조 — 오래 쉬었다 돌아온 날 5할 이상 */
  const phoenix={};
  ids.forEach(id=>{
    const all=[...new Set((S._sorted||[]).filter(m=>m.aId===id||m.bId===id).map(m=>m.date))].sort();
    const mine=[...st1[id].days].sort();
    mine.forEach(d=>{
      const k=all.indexOf(d); if(k<1) return;
      if(daysBetween(all[k-1], d) < 30) return;
      const x=st1[id].dayWL[d];
      if(x && x.w+x.l>=3 && x.w*2>=x.w+x.l) phoenix[id]=1;
    });
  });
  /* 체력왕 — 많이 친 날에도 승률이 안 떨어지는 사람 */
  const stamina={};
  ids.forEach(id=>{
    const b=st1[id], days=Object.values(b.dayWL);
    const heavy=days.filter(x=>x.w+x.l>=6);
    if(heavy.length<2 || b.g<10) return;
    const hw=heavy.reduce((a,x)=>a+x.w,0), hg=heavy.reduce((a,x)=>a+x.w+x.l,0);
    const rest=days.filter(x=>x.w+x.l<6);
    const rw=rest.reduce((a,x)=>a+x.w,0), rg=rest.reduce((a,x)=>a+x.w+x.l,0);
    /* 적게 친 날이 없으면 전체 승률과 견준다 */
    const base = rg>=3 ? rw/rg : b.w/b.g;
    /* 많이 친 날 승률이 평소보다 8%p 넘게 안 떨어지고, 그 자체로도 5할은 될 것 */
    if(hw/hg >= base - 0.08 && hw*2 >= hg) stamina[id]={days:heavy.length, rate:hw/hg, base};
  });
  /* ── 대회형 전용 — 회차 순위와 세트 기록을 재료로 쓴다 ── */
  /* 붙박이 — 대회형 리그가 주 무대인 사람.
     그 리그 안에서는 당연한 말이라, 여러 리그가 섞이는 통합 보기에서만 보여준다 */
  const homeBadge={};
  if(!lgKind){
    for(const L of leagues().filter(x=>x.cup)){
      const cnt={};
      for(const m of (S._sorted||[])){
        if(!inP(m) || lgOf(m)!==L.id) continue;
        cnt[m.aId]=(cnt[m.aId]||0)+1; cnt[m.bId]=(cnt[m.bId]||0)+1;
      }
      for(const pid of Object.keys(cnt))
        if(cnt[pid]>=12 && st1[pid] && cnt[pid]>=st1[pid].g*0.8)
          homeBadge[pid]=`${L.name} 붙박이`;
    }
  }
  /* 대회형 칭호 묶음 — 그 리그의 회차 순위·세트 기록으로 계산한다.
     대회형 리그 화면에선 그 리그 것만, 통합에선 모든 대회형 리그 것을 함께 보여준다.
     통합 시즌은 월 단위지만 대회형 칭호는 그 리그의 시즌(연) 기준으로 매긴다. */
  const cupBadge={};                                   // id → [[칭호, 색], ...]
  const addCupBadges=(lg, per)=>{
    const inC = m => per==='all' ? true : m.date.slice(0,String(per).length)===per;
    const byRd={};
    for(const m of (S._sorted||[])){
      if(!inC(m) || lgOf(m)!==lg) continue;
      (byRd[rdOf(m)]=byRd[rdOf(m)]||[]).push(m);
    }
    const giant={}, podium={}, thrill={}, streak={}, second={}, tourney={};
    const rankHist={}, sizes=[], champSeq=[];
    const addTourneyLift=(rd, ms)=>{
      if(rdFmt(lg,rd)!=='leagueko') return;
      const gs=roundGroups(lg, rd);
      if(gs.groups.length<2) return;
      const gRank={};
      gs.groups.forEach(ids=>{
        crossTable(lg, rd, ids).order.forEach((id,i)=>{ gRank[id]=i+1; });
      });
      const main=(ms||[]).filter(m=>m.br && (m.br.bracket||'main')!=='low');
      if(!main.some(m=>(m.br&&m.br.kind)==='final')) return;
      const place={};
      const setPlace=(id,v)=>{ if(id) place[id]=Math.min(place[id]||99, v); };
      const loser=m=>{ const w=winnerOf(m); return w===m.aId?m.bId:m.aId; };
      for(const m of main){
        const k=m.br&&m.br.kind, w=winnerOf(m), l=loser(m);
        if(k==='final'){ setPlace(w,1); setPlace(l,2); }
        else if(k==='semi') setPlace(l,3);
        else if(k==='quarter') setPlace(l,5);
        else if(k==='round16') setPlace(l,9);
      }
      const groupN=gs.groups.length;
      for(const [pid, p] of Object.entries(place)){
        const gr=gRank[pid]; if(!gr) continue;
        const seedPlace=(gr-1)*groupN+1;
        const lift=seedPlace-p;
        if(lift>0) tourney[pid]=(tourney[pid]||0)+lift;
      }
    };
    for(const rd of Object.keys(byRd)){
      const tb=crossTable(lg, rd);
      if(!tb.order.length) continue;
      sizes.push(tb.order.length);
      const champ=tb.order[0];
      champSeq.push(champ);
      if(tb.order[1]) second[tb.order[1]]=(second[tb.order[1]]||0)+1;
      tb.order.forEach((pid,i)=>(rankHist[pid]=rankHist[pid]||[]).push(i+1));
      tb.order.slice(0,3).forEach(pid=>podium[pid]=(podium[pid]||0)+1);
      for(const m of byRd[rd]){
        const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
        if(l===champ) giant[w]=(giant[w]||0)+1;
        if(m.aSets!=null && m.bSets!=null && Math.min(+m.aSets,+m.bSets)>0){
          thrill[m.aId]=(thrill[m.aId]||0)+1; thrill[m.bId]=(thrill[m.bId]||0)+1;
        }
      }
      addTourneyLift(rd, byRd[rd]);
    }
    /* 공동 1위는 함께 받는다. 문턱 — 시상대 3회, 우승자 잡기 2회, 풀세트 5경기 */
    const keepTop=(o,min)=>{ const mx=Math.max(0,...Object.values(o));
      for(const k of Object.keys(o)) if(o[k]<mx || o[k]<min) delete o[k]; };
    keepTop(podium,3); keepTop(giant,2); keepTop(tourney,2); keepTop(thrill,5);
    /* 꾸준왕 — 3회차 이상 나와 순위 출렁임(표준편차)이 가장 작은 사람.
       평균 순위가 중위권보다 아래면 세지 않는다 — 아래쪽에서 한결같은 건 꾸준함이 아니다 */
    const half=(sizes.reduce((a,b)=>a+b,0)/(sizes.length||1))/2;
    let steady=null;
    for(const pid of Object.keys(rankHist)){
      const h=rankHist[pid]; if(h.length<3) continue;
      const avg=h.reduce((a,b)=>a+b,0)/h.length;
      if(avg>half) continue;
      const sd=Math.sqrt(h.reduce((a,x)=>a+(x-avg)*(x-avg),0)/h.length);
      if(!steady || sd<steady.sd || (sd===steady.sd && avg<steady.avg)) steady={id:pid, sd, avg};
    }
    /* 왕좌 수성 — 회차 우승을 연속으로 지킨 사람 (×N = 최장 연속) */
    { let cur=null, n=0;
      for(const c of champSeq){
        if(c===cur) n++; else { cur=c; n=1; }
        if(n>=2) streak[c]=Math.max(streak[c]||0, n);
      } }
    /* 만년 2위 — 우승은 없는데 2위만 거듭한 사람 */
    const champSet=new Set(champSeq);
    for(const pid of Object.keys(second))
      if(second[pid]<2 || champSet.has(pid)) delete second[pid];
    /* 배지로 변환 */
    /* 칭호 자리가 좁아 ×N 같은 숫자는 붙이지 않는다 — 자세한 수치는 회차별 기록에서.
       대회형 칭호는 전부 리그 이름을 앞에 단다 — 통합에서 어느 리그 것인지 보이게 */
    const nm=x=>`${lgName(lg)} ${x}`;
    const add=(pid,x)=>(cupBadge[pid]=cupBadge[pid]||[]).push(x);
    for(const pid of Object.keys(podium)) add(pid, [nm('에이스'),'gold']);
    for(const pid of Object.keys(streak)) add(pid, [nm('왕좌 수성'),'gold']);
    for(const pid of Object.keys(giant))  add(pid, [nm('우승자 사냥꾼'),'warn']);
    for(const pid of Object.keys(tourney)) add(pid, [nm('토너먼트체질'),'purple']);
    if(steady) add(steady.id, [nm('꾸준왕'),'ok']);
    for(const pid of Object.keys(second)) add(pid, [nm('만년 2위'),'']);
    for(const pid of Object.keys(thrill)) add(pid, [nm('명승부 제조기'),'']);
  };
  if(lgKind==='cup') addCupBadges(curLg(), period);
  else if(!lgKind){
    /* 통합 — 모든 대회형 리그의 칭호를 그 리그 시즌(연) 기준으로 함께 */
    const cupPer = period==='all' ? 'all' : String(period).slice(0,4);
    leagues().filter(x=>x.cup).forEach(L=>addCupBadges(L.id, cupPer));
  }
  /* 이번 시즌 체감 부수가 가장 많이 좋아진 사람 */
  const riser=(()=>{
    let best=null;
    ids.forEach(id=>{
      const b=st1[id]; if(b.g<8) return;
      const v=Object.values(b.day);
      const gain=v.reduce((a,x)=>a+x,0);              // 그 시즌 순변동
      if(gain>=60 && (!best || gain>best.gain)) best={id, gain};
    });
    return best;
  })();
  const swings=ids.map(id=>{
    const b=st1[id], v=Object.values(b.day);
    if(v.length<4 || b.g<10) return null;
    const mean=v.reduce((a,x)=>a+x,0)/v.length;
    return {id, sd:Math.sqrt(v.reduce((a,x)=>a+(x-mean)**2,0)/v.length)};
  }).filter(Boolean).sort((a,b)=>a.sd-b.sd);
  swings.slice(0, Math.max(1, Math.round(swings.length/3))).forEach(x=>swingRank[x.id]='low');
  /* 그 기간에 클럽이 모인 날 전부 */
  const clubDays=new Set((S._sorted||[]).filter(inP).map(m=>m.date));
  const maxW=Math.max(...ids.map(i=>st1[i].w), 0);
  const out={};
  for(const id of ids){
    const b=st1[id], t=[];
    if(b.loG>=6 && b.loW/b.loG>=0.9)              t.push(['하위부 킬러','gold']);
    if(b.hiG>=5 && b.hiW/b.hiG>=0.5)              t.push(['고수 킬러','red']);
    if(b.pmG>=5 && b.pmW/b.pmG>=0.7)              t.push(['핌플 킬러','red']);
    if(b.pnG>=5 && b.pnW/b.pnG>=0.7)              t.push(['펜홀더 킬러','purple']);
    /* 대회형은 연 시즌이라 5회로는 흔해진다 — 다승왕처럼 '시즌 최다 1명'으로 가린다 */
    if(lgKind==='cup' ? (b.ups>=8 && b.ups===maxUps) : b.ups>=5)
                                                  t.push(['이변 제조기','warn']);
    /* 날마다 꾸준히 지는 것도 변동은 작다. 5할은 되어야 '기복 없음'이다 */
    if(swingRank[id]==='low' && b.w*2>=b.g)       t.push(['기복 없음','blue']);
    if(sameBest[id])                              t.push(['터줏대감','gold']);
    if(b.opps.size>=6 && b.opps.size===maxOpps)   t.push(['마당발','ok']);
    if(riser && riser.id===id)                    t.push(['상승폭 1위','red']);
    if(kingId===id)                               t.push(['승률왕','gold']);
    if(b.favG>=8 && b.favW/b.favG>=0.85)          t.push(['철벽','blue']);
    /* 강약약강 — 아랫 부수엔 강하고 윗 부수엔 유독 약하다 */
    if(b.loG>=6 && b.hiG>=5 && b.loW/b.loG>=0.80 && b.hiW/b.hiG<=0.25)
                                                  t.push(['강약약강','purple']);
    if(stamina[id])                               t.push(['체력왕','ok']);
    if(phoenix[id])                               t.push(['불사조','red']);
    (()=>{ const f=freshVsKnown(id);
      if(!f || f.fN<5 || f.kN<5) return;
      const d=(f.kRate??0)-(f.fRate??0);
      if(d>=0.15)      t.push(['적응형','purple']);
      else if(d<=-0.15) t.push(['초면 강자','warn']);
    })();
    if(perfect[id]>=1){
      const sx=sexOf(P(id));
      const nm=(sx==='m'?'Mr 퍼펙트':sx==='f'?'Ms 퍼펙트':'퍼펙트');
      t.push([nm,'warn']);
    }
    if(clubDays.size>=3 && b.days.size===clubDays.size)
                                                  t.push(['개근','ok']);
    if(b.w>=5 && b.w===maxW)                      t.push(['다승왕','gold']);
    /* 대회형 전용 — 회차 순위·세트 기록 기반 (통합에선 모든 대회형 리그 것) */
    (cupBadge[id]||[]).forEach(x=>t.push(x));
    if(homeBadge[id])    t.push([homeBadge[id],'ok']);
    /* 이 리그 방식에 안 맞는 칭호와, 본인이 내 정보에서 끈 칭호는
       자리(4개)를 차지하기 전에 뺀다 */
    const hide=(P(id)||{}).hideTitles||[];
    const t2 = (lgKind ? t.filter(([x])=>{
      const sc=TITLE_SCOPE[titleKey(x)]; return !sc || sc===lgKind; }) : t)
      .filter(([x])=>!hide.includes(titleKey(x)));
    /* 귀한 칭호가 먼저 오도록 줄을 세운 뒤 두 개만 남긴다 */
    if(t2.length) out[id]=t2.sort((a,b)=>
      TITLE_RANK.indexOf(titleKey(a[0]))-TITLE_RANK.indexOf(titleKey(b[0]))).slice(0,4);
  }
  return out;
}
/* 초면 vs 구면 — 처음 만난 상대와, 이미 여러 번 붙어본 상대의 성적을 가른다.
   처음에 강하면 '기세로 누르는 형', 나중에 강하면 '적응하는 형'이다. */
function freshVsKnown(id){
  const byOpp={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const o = m.aId===id ? m.bId : m.aId;
    (byOpp[o]=byOpp[o]||[]).push(m);
  }
  let fW=0,fL=0,kW=0,kL=0, fE=0, kE=0;
  for(const o in byOpp){
    byOpp[o].forEach((m,i)=>{
      const won = winnerOf(m)===id;
      const e = expFor(m, id);
      if(i===0){ won?fW++:fL++; if(e!=null) fE+=e; }
      else     { won?kW++:kL++; if(e!=null) kE+=e; }
    });
  }
  const f=fW+fL, k=kW+kL;
  return { fW,fL,kW,kL, fN:f, kN:k,
    fRate: f?fW/f:null, kRate: k?kW/k:null,
    fEdge: f?fW-fE:0, kEdge: k?kW-kE:0,      // 기대 대비
    opps: Object.keys(byOpp).length };
}
/* 현재 표시하는 Elo 증감과 같은 시간순 계산에서 얻은 경기 직전 승률.
   옛 exp 저장값은 다른 규칙·리그·랭킹 보정으로 만들어졌을 수 있어 사용하지 않는다.
   랭킹에 반영되지 않은 경기는 계산된 승률이 없으므로 표시하지 않는다. */
const expOf = m => m && m._expA!=null ? m._expA : null;
const expFor = (m, id) => {
  const e = expOf(m); if(e==null) return null;
  return m.aId===id ? e : 1-e;
};
/* 현재 예측도 Elo 엔진과 같은 내부 점수·리그 핸디 규칙을 따른다. */
function expNow(aId, bId, handi, lg=predictionLeague()){
  const a=P(aId), b=P(bId); if(!a||!b) return null;
  return eloExpectation(rawRate(aId,'skill'),rawRate(bId,'skill'),aId,bId,handi,lg).expA;
}
/* 이름 고르는 칸 — 치면 아래로 후보가 뜨고, 눌러야 선택된다 */
function comboHTML(key, curId, opts){
  const o=opts||{};
  const cur=P(curId);
  return `<div class="combo" data-combo="${key}">
    <input class="cbq" data-cbq="${key}" autocomplete="off"
      placeholder="${esc(o.placeholder||'이름 검색  예) 홍길동, ㅎㄱㄷ')}"
      value="${cur?esc(cur.name):''}">
    ${cur?`<button class="cbx" data-cbclr="${key}" aria-label="지우기">✕</button>`:''}
    <div class="cblist" data-cblist="${key}" hidden></div>
  </div>`;
}
function bindCombo(root, key, onPick, extra, opts){
  const R=root||document;
  const q=R.querySelector(`[data-cbq="${key}"]`);
  const box=R.querySelector(`[data-cblist="${key}"]`);
  if(!q||!box) return;
  const draw=()=>{
    const s2=q.value.trim();
    const hit=roster().filter(p=>matchName(p, s2)).slice(0,40);
    const ex=(extra||[]).filter(x=>!s2 || x.label.includes(s2));
    box.innerHTML = (hit.length||ex.length)
      ? hit.map(p=>`<button class="cbit" data-cbpick="${p.id}">${esc(p.name)}<i>${p.bu}부</i></button>`).join('')
        + ex.map(x=>`<button class="cbit alt" data-cbpick="${x.id}">${esc(x.label)}</button>`).join('')
      : `<div class="cbnone">맞는 사람이 없습니다</div>`;
    box.hidden=false;
    box.querySelectorAll('[data-cbpick]').forEach(b=>b.onmousedown=e=>{
      e.preventDefault();
      const id=b.dataset.cbpick, p=P(id);
      q.value = p ? p.name : b.textContent;
      box.hidden=true;
      onPick(id);
    });
  };
  q.onfocus=draw;
  q.oninput=draw;
  q.onblur=()=>setTimeout(()=>{ box.hidden=true; }, 120);
  const x=R.querySelector(`[data-cbclr="${key}"]`);
  if(x) x.onclick=()=>{
    q.value=''; q.focus(); draw();          // 비우고 바로 다시 찾을 수 있게
    if(opts && opts.clearable) onPick('');  // 건너뛰기가 가능한 칸만 선택도 푼다
  };
}
/* 이름 검색 — 초성만 쳐도 찾히게 */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function initials(str){
  return String(str||'').split('').map(ch=>{
    const c=ch.charCodeAt(0)-0xAC00;
    return (c>=0 && c<=11171) ? CHO[Math.floor(c/588)] : ch;
  }).join('');
}
function matchName(p, q){
  const s2=String(q||'').replace(/\s/g,'').toLowerCase();
  if(!s2) return true;
  const cand=[p.name, p.bandName, ...(p.aliases||[])].filter(Boolean);
  return cand.some(n=>{
    const x=String(n).replace(/\s/g,'').toLowerCase();
    return x.includes(s2) || initials(x).includes(s2);
  });
}
/* 요일별 성적 — 나는 어느 요일에 잘 치나 */
function dowStats(id, ym){
  const D=[0,0,0,0,0,0,0].map(()=>({g:0,w:0,exp:0,days:new Set()}));
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    if(ym && m.date.slice(0,String(ym).length)!==ym) continue;
    const [y,mo,dd]=m.date.split('-').map(Number);
    const k=new Date(y,mo-1,dd).getDay();
    const b=D[k];
    b.g++; b.days.add(m.date);
    if(winnerOf(m)===id) b.w++;
    const e = expFor(m, id);
    if(e!=null) b.exp+=e;
  }
  return D.map((b,i)=>({dow:i, g:b.g, w:b.w, l:b.g-b.w, days:b.days.size,
    rate: b.g?b.w/b.g:null, diff: b.g?b.w-b.exp:0}));
}
/* ── 업적 — 단계가 오르는 통산 기록 ──
   50경기를 깨면 다음 목표가 200경기로 바뀐다. 단계마다 등급 이름이 붙는다. */
const TIER_NAME = ['브론즈','실버','골드','플래티넘','다이아'];
function achieveTracks(id){
  const ms=(S._sorted||[]).filter(m=>m.aId===id||m.bId===id);
  const me=P(id)||{};
  let w=0, ups=0, maxGap=0, gapWho=null;
  const opps=new Set(), byDay={};
  for(const m of ms){
    const o=P(m.aId===id?m.bId:m.aId); if(!o) continue;
    opps.add(o.id);
    (byDay[m.date]=byDay[m.date]||[]).push(m);
    const won=winnerOf(m)===id;
    if(won){
      w++;
      const gap=me.bu - o.bu;
      if(gap>maxGap){ maxGap=gap; gapWho=o.id; }
    }
    const e=expFor(m, id);
    if(won && e!=null && e<UPSET) ups++;
  }
  const days=Object.keys(byDay);
  const dayMax=days.reduce((a,d)=>Math.max(a, byDay[d].length), 0);
  const perfect=days.filter(d=>byDay[d].length>=5 && byDay[d].every(m=>winnerOf(m)===id)).length;

  const T=(key,name,now,tiers,unit,extra)=>{
    const lv=tiers.filter(t=>now>=t).length;          // 깬 단계 수
    const done=lv>=tiers.length;
    const next=done?null:tiers[lv];
    const from=lv?tiers[lv-1]:0;
    return {key,name,now,tiers,unit,extra,lv,done,next,
      pct: done?100:Math.round((now-from)/(next-from)*100),
      tier: lv?TIER_NAME[Math.min(lv-1,TIER_NAME.length-1)]:null};
  };
  return [
    T('game','경기 수', ms.length, [10,50,200,500,1000], '경기'),
    T('win','승수', w, [5,25,100,300,700], '승'),
    T('day','출전 일수', days.length, [5,20,50,120,250], '일'),
    T('opp','만나본 사람', opps.size, [5,15,30,50,80], '명'),
    T('ups','이변', ups, [1,5,20,50,100], '회'),
    T('perf','퍼펙트 데이', perfect, [1,3,10,25,50], '회',
      perfect?`5경기 이상 친 날 전승 ${perfect}회`:null),
    T('dmax','하루 최다', dayMax, [5,8,10,14,18], '경기',
      dayMax?`최다 ${dayMax}경기`:null),
    T('gap','윗 부수 격파', maxGap, [1,2,3,4,5], '부수 위',
      maxGap&&gapWho?`${nameOf(gapWho)} (${(P(gapWho)||{}).bu}부)`:null)
  ];
}
/* 명예의 전당 — 마감된 시즌의 1~3위 */
function hallOfFame2(mode){

    const rs=standings(ym, mode).filter(r=>r.g>=(st().provisional||0));
    if(!rs.length) return null;

/* 개인 최고 레이팅 — 부수별로도 본다 */
function peakBoard(mode){
  const T=trk(mode);
  return roster().map(p=>{
    /* 첫 항목은 가입 시점의 출발점이라 기록으로 치지 않는다 */

/* 시즌 최고 퍼포먼스 — 부수 출발점 없이 그 시즌 성적만으로 매긴 값 */
function bestSeasons(mode){

  seasons().forEach(ym=>{

      .forEach(r=>out.push({ym, p:r.p, r:Math.round(r.r), g:r.g, w:r.w, l:r.l}));
  });

/* 같은 승수 무리를 가린다.
   2명 동률은 승자승, 3명 이상은 상대간 승패를 본 뒤 세트 기준으로 한 번에 줄 세운다.
   한 명씩 빼고 다시 승자승을 적용하면 3자 순환에서 2·3위 세트수가 묻힌다.
   bt(a,b): 맞대결 1/-1/0 · tail: 세트수 → 게임수 → 부수 같은 후순위 기준 */
function tieOrder(g, bt, tail){
  if(g.length<=1) return g.slice();
  if(g.length===2){
    const [x,y]=g, h=bt(x,y);
    return h>0 ? [x,y] : h<0 ? [y,x] : g.slice().sort(tail);
  }
  const sw={}, sd={};
  g.forEach(id=>{
    sw[id]=g.reduce((n,o)=>n+(bt(id,o)>0?1:0),0);
    sd[id]=g.reduce((n,o)=>n+bt(id,o),0);
  });
  return g.slice().sort((a,b)=> (sw[b]-sw[a]) || (sd[b]-sd[a]) || tail(a,b));
}
/* 격자 입력값만으로 순위를 매긴다 — 저장 전 미리보기·조별 순위 공용.
   getR(a,b): 이긴 쪽 id 또는 null · setOf(a,b): {id:세트수} 또는 '-'(불발) */
function liveRank(list, getR, setOf, pf=P){
  const rec={}; list.forEach(id=>rec[id]={w:0,l:0,g:0,sw:0,sl:0});
  const beat={};
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i], b=list[j], w=getR(a,b);
    if(!w) continue;
    const l=(w===a?b:a);
    rec[w].w++; rec[w].g++; rec[l].l++; rec[l].g++;
    /* 세트 수도 함께 센다 — 저장된 기록과 같은 기준으로 가리기 위해 */
    const s2=setOf && setOf(a,b), hasS=s2 && s2!=='-';
    const ws=hasS?(+s2[w]||0):1, ls=hasS?(+s2[l]||0):0;
    rec[w].sw+=ws; rec[w].sl+=ls; rec[l].sw+=ls; rec[l].sl+=ws;
    (beat[w]=beat[w]||{})[l]=1;
  }
  const bt=(a,b)=> (beat[a]&&beat[a][b]) ? 1 : (beat[b]&&beat[b][a]) ? -1 : 0;
  const byWin={};
  list.forEach(id=>(byWin[rec[id].w]=byWin[rec[id].w]||[]).push(id));
  const tail=(a,b)=> ((rec[b].sw-rec[b].sl)-(rec[a].sw-rec[a].sl))
                  || (rec[a].g-rec[b].g) || (pf(a).bu-pf(b).bu);
  const order=Object.keys(byWin).map(Number).sort((a,b)=>b-a).flatMap(w=>{
    const g=byWin[w];
    return g.length===1 ? g : tieOrder(g, bt, tail);
  });
  return {order, rec};
}
/* 대진표 — 그 회차에 누가 누구와 몇 대 몇이었나.
   all(전체 경기)·pf(선수 조회)를 인자로 받는다 — 안 주면 지금의 전역을 쓴다 */
function crossTable(lg, rd, only, all=S.matches, pf=P){
  let ms=(all||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd);
  const rf = (typeof rdFmt==='function') ? rdFmt(lg,rd) : 'league';
  if(rf==='leagueko' || rf==='groupko') ms=ms.filter(m=>!m.br);   // 본선·순위전은 조별표에서 뺀다
  if(only) ms=ms.filter(m=>only.includes(m.aId) && only.includes(m.bId));
  /* 경기가 들어온 순서를 그대로 쓴다 — 입력할 때의 명단 순서가 유지된다 */
  const ord=(typeof rdOrd==='function') ? rdOrd(lg,rd) : [];
  const ids=only ? only.filter(id=>pf(id))
                 : [...new Set([...(ord||[]), ...ms.flatMap(m=>[m.aId,m.bId])])].filter(id=>pf(id));
  const cell={}, rec={};
  ids.forEach(a=>{ rec[a]={w:0,l:0,g:0,sw:0,sl:0}; cell[a]={}; ids.forEach(b=>cell[a][b]=null); });
  ms.forEach(m=>{
    const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
    if(!rec[w]||!rec[l]) return;
    rec[w].w++; rec[w].g++; rec[l].l++; rec[l].g++;
    /* 세트 스코어가 있으면 함께 센다. 없으면 이긴 쪽 1:0 으로 본다 */
    const ws=(m.aId===w?m.aSets:m.bSets), ls=(m.aId===w?m.bSets:m.aSets);
    const a1=(ws==null?1:+ws), b1=(ls==null?0:+ls);
    rec[w].sw+=a1; rec[w].sl+=b1;
    rec[l].sw+=b1; rec[l].sl+=a1;
    (cell[w][l]=cell[w][l]||{w:0,l:0}).w++;
    (cell[l][w]=cell[l][w]||{w:0,l:0}).l++;
  });
  /* 순위: 승수 → 승자승 → 상대간 승패 → 세트수 → 게임수 → 부수 상위자.
     게임수는 적게 치고 같은 승수면 앞선다. */
  const beat=(a,b)=>{ const x=cell[a][b]; return x ? (x.w>x.l ? 1 : x.w<x.l ? -1 : 0) : 0; };
  const byWin={};
  ids.forEach(id=>(byWin[rec[id].w]=byWin[rec[id].w]||[]).push(id));
  /* 같은 승수 무리 안에서만 다음 기준으로 다시 가린다 —
     세트수(딴 세트 − 준 세트) → 게임수 → 부수 상위자 */
  const tail=(a,b)=> ((rec[b].sw-rec[b].sl)-(rec[a].sw-rec[a].sl))   // 세트 득실
                  || (rec[a].g-rec[b].g)                             // 게임수 — 적게 치고 같은 승수면 위
                  || (pf(a).bu-pf(b).bu);                            // 부수 상위자
  const order=Object.keys(byWin).map(Number).sort((a,b)=>b-a).flatMap(w=>{
    const g=byWin[w];
    return g.length===1 ? g : tieOrder(g, beat, tail);
  });
  const manualRank = id => (typeof rdRank==='function') ? rdRank(lg,rd,id) : null;
  const manualOK = (only || rf==='league') && ids.some(id=>manualRank(id)!=null);
  const pos={}; order.forEach((id,i)=>pos[id]=i);
  const finalOrder = manualOK ? ids.slice().sort((a,b)=>{
    const ra=manualRank(a), rb=manualRank(b);
    return (ra==null?999:ra) - (rb==null?999:rb) || (pos[a]??999) - (pos[b]??999);
  }) : order;
  const done=ms.length;
  const total=ids.length*(ids.length-1)/2;
  return {ids, order:finalOrder, cell, rec, done, total, players:ids.length};
}
/* 회차별 최종 순위 — 조별+순위전이면 그 결과대로, 아니면 승패 차 순 */
function roundStanding(lg, rd, all=S.matches, pf=P){
  /* 손으로 정한 전체 순위가 있으면 그것부터 — 값이 겹치면 조별 순위라는 뜻이라 여기선 안 쓴다 */
  const manual=(rdMeta(lg,rd)||{}).rank;
  if(manual && Object.keys(manual).length){
    const vals=Object.values(manual);
    if(new Set(vals).size===vals.length){
      const out=Object.entries(manual).sort((a,b)=>a[1]-b[1]).map(([id])=>id).filter(id=>pf(id));
      crossTable(lg, rd, null, all, pf).order.forEach(id=>{ if(!out.includes(id)) out.push(id); });
      return out;
    }
  }
  const gs=roundGroups(lg, rd, all, pf);
  const base=crossTable(lg, rd, null, all, pf).order;
  if(rdFmt(lg,rd)==='leagueko'){
    const ms=(all||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd && m.br);
    const byKind=k=>ms.filter(m=>(m.br&&m.br.kind)===k)
      .sort((a,b)=>((a.br&&a.br.order)||0)-((b.br&&b.br.order)||0) || (a.enteredAt||'').localeCompare(b.enteredAt||''));
    const out=[], add=id=>{ if(id && pf(id) && !out.includes(id)) out.push(id); };
    const loser=m=>{ const w=winnerOf(m); return w===m.aId?m.bId:m.aId; };
    const final=byKind('final').slice(-1)[0], third=byKind('third').slice(-1)[0];
    if(final){ const w=winnerOf(final); add(w); add(w===final.aId?final.bId:final.aId); }
    const semiLosers=byKind('semi').filter(m=>(m.br&&m.br.bracket)!=='low').map(loser);
    if(third){ const w=winnerOf(third); add(w); add(w===third.aId?third.bId:third.aId); }
    else if(semiLosers.length) semiLosers.forEach(add);
    const lowFinal=byKind('lowfinal').slice(-1)[0];
    if(lowFinal) add(winnerOf(lowFinal));
    base.forEach(add);
    return out;
  }
  if(gs.groups.length>1){
    const tabs=gs.groups.map(ids=>crossTable(lg,rd,ids,all,pf));
    const gOf={}; gs.groups.forEach((ids,gi)=>ids.forEach(id=>gOf[id]=gi));
    /* 조 순위 — 손으로 정해 저장한 값이 있으면 그것부터 (루키리그처럼 승자승을 안 쓰는 리그) */
    const seatOf=id=>{
      const gi=gOf[id]; if(gi==null) return 99;
      const saved=(rdMeta(lg,rd)||{}).rank;
      return (saved && saved[id]) || (tabs[gi].order.indexOf(id)+1) || 99;
    };
    const out=[], add=id=>{ if(id && pf(id) && !out.includes(id)) out.push(id); };
    const sorted=gs.ko.slice().sort((m1,m2)=>
      (((m1.br&&m1.br.order)||99)-((m2.br&&m2.br.order)||99))
      || Math.min(seatOf(m1.aId), seatOf(m1.bId)) - Math.min(seatOf(m2.aId), seatOf(m2.bId)));
    sorted.forEach(m=>{ const w=winnerOf(m); add(w); add(w===m.aId?m.bId:m.aId); });
    /* 순위 결정전을 안 치른 자리는 조 순위를 번갈아 이어 붙인다 (A조 3위, B조 3위, …).
       예전에는 여기서 끊겨 순위전에 나온 네 명만 기록에 남았다. */
    const rest=[];
    gs.groups.forEach((ids,gi)=>ids.forEach(id=>{
      if(pf(id) && !out.includes(id)) rest.push({id, s:seatOf(id), gi});
    }));
    rest.sort((a,b)=>a.s-b.s || a.gi-b.gi);
    rest.forEach(x=>add(x.id));
    return out;
  }
  return crossTable(lg, rd, null, all, pf).order;
}
/* 리그 통산 — 회차마다 몇 위였나, 그때 몇 부로 뛰었나, 1위를 이겼나 */
function lgRecord(lg, all=S.matches, pf=P, buOf=rdBu){
  const rds=roundsOf(lg, all);
  const by={};
  rds.forEach(rd=>{
    const order=roundStanding(lg, rd, all, pf);
    const champ=order[0];
    /* 그 회차 1위를 이긴 사람 */
    const beatChamp=new Set();
    if(champ) (all||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd)
      .forEach(m=>{ if(winnerOf(m)!==champ && (m.aId===champ||m.bId===champ))
        beatChamp.add(winnerOf(m)); });
    order.forEach((id,i)=>{
      const b=by[id]=by[id]||{id, n:0, sum:0, best:99, podium:[0,0,0],
                              topBu:99, beat:0, hist:[]};
      b.n++; b.sum+=i+1; b.best=Math.min(b.best,i+1);
      if(i<3) b.podium[i]++;
      /* 그 회차에 뛴 부수 — 숫자가 작을수록 윗 부수 */
      const bu=buOf(lg, rd, id) || (pf(id)||{}).bu || 99;
      b.topBu=Math.min(b.topBu, bu);
      if(beatChamp.has(id)) b.beat++;
      b.hist.push({rd, r:i+1, bu});
    });
  });
  const list=Object.values(by).map(b=>({...b, avg:b.n?b.sum/b.n:0,
    podiumN:b.podium[0]+b.podium[1]+b.podium[2]}));
  /* 금·은·동 순으로, 같으면 평균 순위가 좋은 쪽 */
  list.sort((a,b)=>b.podium[0]-a.podium[0] || b.podium[1]-a.podium[1] || b.podium[2]-a.podium[2]
    || a.avg-b.avg || b.n-a.n);
  return {list, rounds:rds.length};
}
/* 그 회차를 조로 나눈다 — 서로 붙은 사람끼리 한 덩어리 */
function roundGroups(lg, rd, all=S.matches, pf=P){
  /* 리그가 전체 풀리그로 설정돼 있으면 조를 나누지 않는다.
     경기 기록만 보고 추론하면, 서로 못 붙은 사람들이 조처럼 보일 수 있다. */
  const fmt=rdFmt(lg,rd);
  const allMs=(all||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd);
  const br=allMs.filter(m=>m.br);
  if(fmt==='league') return {groups:[], ko:[], br};
  const ms=(fmt==='leagueko'||fmt==='groupko') ? allMs.filter(m=>!m.br) : allMs;
  const ord=rdOrd(lg,rd), gm=rdGrp(lg,rd);
  const ids=[...new Set([...(ord||[]), ...ms.flatMap(m=>[m.aId,m.bId]), ...br.flatMap(m=>[m.aId,m.bId])])].filter(id=>pf(id));
  if(Object.keys(gm).length){
    const by={};
    ids.forEach(id=>{ const g=gm[id]||'A'; (by[g]=by[g]||[]).push(id); });
    const groups=Object.keys(by).sort().map(g=>by[g]);
    const gOf={}; groups.forEach((g,i)=>g.forEach(id=>gOf[id]=i));
    /* 순위 결정전 = 조를 가로지른 경기 + 본선 표시(placement)가 붙은 경기(같은 조 5·6위전 등) */
    const ko=fmt==='groupko'
      ? [...ms.filter(m=>gOf[m.aId]!=null && gOf[m.bId]!=null && gOf[m.aId]!==gOf[m.bId]),
         ...br.filter(m=>(m.br&&m.br.kind)==='placement')]
      : [];
    return groups.length>=2 ? {groups, ko, br} : {groups:[], ko:[], br};
  }
  if(ids.length<6) return {groups:[], ko:[], br};
  /* 상대 수가 많은 사람 기준으로 '조'를 찾는다.
     조별리그는 같은 조 안에서 서로 다 붙고, 순위 결정전은 딱 한 명씩만 붙는다. */
  const opp={}; ids.forEach(id=>opp[id]=new Set());
  ms.forEach(m=>{ opp[m.aId].add(m.bId); opp[m.bId].add(m.aId); });
  /* 서로 전부 붙은 덩어리 = 조 */
  const seen=new Set(), groups=[];
  ids.forEach(id=>{
    if(seen.has(id)) return;
    const cand=[id, ...opp[id]].filter(x=>!seen.has(x));
    /* 후보 중에서 서로 다 붙은 최대 묶음을 고른다 */
    const pick=[id];
    cand.filter(x=>x!==id).forEach(x=>{
      if(pick.every(y=>y===x || opp[x].has(y))) pick.push(x);
    });

/* 라이벌 — 양쪽 다 이겨봤고, 승률이 5:5 언저리이며, 많이 붙은 짝.

function rivalries(minG){
  const MIN=minG||3, seen={}, out=[];
  for(const m of clubScope()){
    const k=[m.aId,m.bId].sort().join('|');
    const b=seen[k]=seen[k]||{a:k.split('|')[0], b:k.split('|')[1], n:0, aw:0, last:'', hist:[]};
    b.n++; if(winnerOf(m)===b.a) b.aw++; b.last=m.date;
    b.hist.push({aWin:winnerOf(m)===b.a, d:m.date});    // 시간순 — 최근 흐름 표시용
  }
  for(const k in seen){
    const x=seen[k];
    if(x.n<MIN || !P(x.a) || !P(x.b)) continue;
    const lose=x.n-x.aw, gap=Math.abs(x.aw-lose);
    if(x.aw===0 || lose===0) continue;              // 한쪽이 전승이면 라이벌이 아니다
    const rate=x.aw/x.n;
    /* 박빙 기준: 승률 40~60%. 경기가 적으면 그 안에 떨어지는 조합이 없으므로

    if(!(gap<=1 || (rate>=0.40 && rate<=0.60))) continue;
    x.rate=rate;

          : '자동 보정이 꺼져 있어 이 표는 레이팅에 반영되지 않습니다.'}</p>
      ${secHandiPairs()}`;
  };
  /* 승급 신호 — 지금 부수로 뛰면서, 핸디 받고도 윗부수를 6할 이상 이기는 사람.
     승급 전 옛 부수 시절 경기는 세지 않고, 같은 상대 반복(상성)은 감쇠해 세며,
     서로 다른 윗부수 상대 5명 이상을 이겨봐야 신호로 인정한다. */
  const secHandiPairs=()=>{
    const riser={};
    const rw=repWeighter();
    for(const m of (S._sorted||[])){
      const buA=buOnDate(m.aId,m.date), buB=buOnDate(m.bId,m.date);
      if(buA==null||buB==null||buA===buB) continue;
      const weakId=buA>buB?m.aId:m.bId, weakBu=Math.max(buA,buB);
      const wt=rw(m.aId,m.bId);
      if(weakBu!==(P(weakId)||{}).bu) continue;    // 지금 부수로 뛴 경기만
      const oppId = weakId===m.aId ? m.bId : m.aId;
      const c=riser[weakId]=riser[weakId]||{n:0,en:0,ew:0,beat:new Set()};
      c.n++; c.en+=wt;
      if(winnerOf(m)===weakId){ c.ew+=wt; c.beat.add(oppId); }
    }
    const rs=Object.entries(riser)
      .map(([id,c])=>({id, n:c.n, beat:c.beat.size, rate:c.en?c.ew/c.en:0}))
      .filter(x=>x.n>=30 && x.beat>=5 && x.rate>=0.6 && P(x.id))
      .sort((a,b)=>b.rate-a.rate || b.n-a.n).slice(0,6);
    if(!rs.length) return '';
    return `<div class="secttl" style="margin-top:16px">승급 신호</div>
      <p class="tiny dim" style="margin:0 0 8px">지금 부수로 뛰면서 핸디를 받고도 윗부수를 6할 넘게 이기고 있습니다.
        같은 상대만 반복해서 잡은 건(상성) 줄여 세고, 서로 다른 윗부수 ${5}명 이상을 이겨본 사람만 올립니다.</p>
      <div class="card">${rs.map(x=>`<div class="hof">
        <span class="md">${(P(x.id)||{}).bu}부</span>
        <span class="nm"><span data-psheet="${x.id}" role="button" style="cursor:pointer">${esc(nameOf(x.id))}</span>
          <i>윗부수 ${x.beat}명 격파 · ${x.n}경기</i></span>
        <span class="rt">${pct(x.rate)}%<em>보정 승률</em></span>
      </div>`).join('')}</div>`;
  };
  /* 대회형 리그의 통산 성적 — 1위 몇 회, 2위 몇 회 */
  const secLgRecord=()=>{
    const lg=curLg();
    /* 승급전은 통산 랭킹이 무의미하다 — 회차(리그)별로 누가 몇 등으로 승급했는지만 보여준다 */
    if(lg==='promotion') return secPromoRecord();
    const {list, rounds}=lgRecord(lg);
    if(!rounds) return `<div class="empty">아직 기록된 회차가 없습니다.</div>`;
    /* 전원 나열 대신: 입상자 보드가 대표, 전체 성적표와 지난 우승은 접는다 */
    const md=(k,v)=>v?`<span class="medal m${k} sm" title="${['우승','준우승','3위'][k-1]} ${v}회">${v}</span>`:'';
    const medal=list.filter(x=>x.podiumN>0);
    const mrow=(x,i)=>`<div class="hof ${i<3?'m'+(i+1):''} tapname" data-psheet="${x.id}">
      <span class="md">${i+1}</span>
      <span class="nm">${esc(nameOf(x.id))}<i>참가 ${x.n}회 · 평균 ${x.avg.toFixed(1)}위</i></span>
      <span class="rt">${md(1,x.podium[0])}${md(2,x.podium[1])}${md(3,x.podium[2])}</span>
    </div>`;
    const rds=roundsOf(lg).slice().sort().reverse();   // 최신 회차부터
    const rline=rd=>{ const st2=roundStanding(lg, rd);
      const one=(k)=>st2[k-1]?`<span class="medal m${k} sm">${k}</span> ${esc(nameOf(st2[k-1]))}`:'';
      return `<div class="hofline"><span class="d">${roundLabel(rd)}</span>
        <span class="w">${one(1)}  ${one(2)}  ${one(3)}</span></div>`; };
    return `<div class="split" style="align-items:baseline;margin-bottom:8px">
        <div class="secttl" style="margin:0">${esc(lgName(lg))} 통산</div>
        <div class="tiny dim">${rounds}회차 · ${list.length}명</div>
      </div>
      ${medal.length?`<div class="card">${medal.slice(0,8).map(mrow).join('')}
        ${medal.length>8?`<p class="tiny dim" style="margin:8px 2px 0">외 입상자 ${medal.length-8}명 — 아래 전체 성적표에 있습니다.</p>`:''}
      </div>`:''}
      <details class="advbox"><summary>전체 성적표 (${list.length}명)</summary><div class="advin">
      <div class="ctwrap"><table class="ctb lgr fit">
        <thead><tr><th class="cn">선수</th>
          <th>1위</th><th>2위</th><th>3위</th><th>입상</th>
          <th>최고</th><th>평균</th><th>최고<br>부수</th><th>1위<br>격파</th><th class="rc">참가</th></tr></thead>
        <tbody>${list.map((x,i)=>`<tr>
          <th class="cn tapname" data-psheet="${x.id}"><i>${i+1}</i>${esc(nameOf(x.id))}<em>${(P(x.id)||{}).bu}부</em></th>
          ${x.podium.map((n,k)=>`<td class="${n?'m'+(k+1):'none'}">${n||'·'}</td>`).join('')}
          <td class="${x.podiumN?'':'none'}">${x.podiumN||'·'}</td>
          <td>${x.best}위</td>
          <td class="dim">${x.avg.toFixed(1)}</td>
          <td class="${x.topBu<((P(x.id)||{}).bu||99)?'m1':'dim'}">${x.topBu<99?x.topBu+'부':'·'}</td>
          <td class="${x.beat?'m2':'none'}">${x.beat||'·'}</td>
          <td class="rc">${x.n}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <p class="tiny dim" style="margin:8px 2px 0">회차마다의 최종 순위를 모은 것입니다.
        <b>최고 부수</b>는 지금까지 가장 윗 부수로 뛴 기록이고,
        <b>1위 격파</b>는 그 회차 우승자를 이긴 횟수입니다.</p>
      </div></details>
      <div class="secttl" style="margin-top:16px">최근 우승</div>
      <div class="card">${rds.slice(0,5).map(rline).join('')}</div>
      ${rds.length>5?`<details class="advbox"><summary>지난 회차 전체 (${rds.length-5}개)</summary><div class="advin">
        <div class="card">${rds.slice(5).map(rline).join('')}</div>
      </div></details>`:''}`;
  };
  /* 승급전 통산 — 회차(리그)별 승급자와 등수만. 승급자는 다시 참가하지 않으니
     참가 횟수·메달 집계 같은 통산 지표는 여기선 무의미하다. */
  const secPromoRecord=()=>{
    const lg='promotion';
    const rds=roundsOf(lg).slice().sort().reverse();
    if(!rds.length) return `<div class="empty">아직 승급전 기록이 없습니다.</div>`;
    const cards=rds.map(rd=>{
      const meta=rdMeta(lg,rd)||{};
      const st2=roundStanding(lg,rd)||[];
      const rankOf=id=>{ const i=st2.indexOf(id); return i<0?null:i+1; };
      const promoted=[];
      for(const p of S.players)
        for(const h of (p.buHist||[]))
          if(h.ev && roundOf(h.ev, lg)===rd) promoted.push({p, from:h.from, to:h.bu, via:h.via});
      promoted.sort((a,b)=>(rankOf(a.p.id)||99)-(rankOf(b.p.id)||99));
      const lab=i=>i===1?'우승':i===2?'준우승':i?i+'위':'승급';
      const title=meta.title || (promoted[0]&&promoted[0].via) || roundLabel(rd);
      return `<div class="card">
        <div class="hof-h">${esc(title)} <span class="dim" style="font-weight:400">${meta.date?fmtDate(meta.date):roundLabel(rd)}</span></div>
        ${promoted.length?promoted.map((x,i)=>`<div class="hof ${i===0?'m1':''} tapname" data-psheet="${x.p.id}">
          <span class="md">${x.from}→${x.to}</span>
          <span class="nm">${esc(x.p.name)}<i>${lab(rankOf(x.p.id))}</i></span>
          <span class="rt">${rankOf(x.p.id)===1?'<span class="medal m1 sm">1</span>':rankOf(x.p.id)===2?'<span class="medal m2 sm">2</span>':'승급'}</span>
        </div>`).join('')
        :`<div class="tiny dim">승급자 기록이 아직 연결되지 않았습니다.</div>`}
      </div>`;
    });
    return `<div class="split" style="align-items:baseline;margin-bottom:8px">
        <div class="secttl" style="margin:0">승급전 기록</div>
        <div class="tiny dim">${rds.length}회</div>
      </div>
      <p class="tiny dim" style="margin:0 0 8px">리그별 승급자와 그날의 등수입니다. 부수 숫자는 승급 전 → 후.</p>
      ${cards.join('')}`;
  };
  /* 대회형 리그의 회차별 대진표 */
  const secRound=()=>{
    if(curLg()!=='all' && lgIsCup(curLg())) cupLg=curLg();
    const cups=leagues().filter(x=>x.cup);
    if(!cups.length) return `<div class="empty">대회형 리그가 없습니다.<br>
      <span class="tiny dim">관리 · 리그에서 '대회형'을 켜면 여기에 대진표가 생깁니다.</span></div>`;
    if(!cups.some(x=>x.id===cupLg)) cupLg=cups[0].id;
    const rds=cupRoundsOf(cupLg);
    if(!rds.length) return `<div class="empty">아직 기록된 경기가 없습니다.</div>`;
    if(!rds.includes(cupRd)) cupRd=rds[0];
    const gs=roundGroups(cupLg, cupRd);
    const all=crossTable(cupLg, cupRd);
    /* 팀전이면 개인 순위 대신 소속 팀을 붙인다 */
    const teamOf=(()=>{
      const ev=rdTeamEvent(cupLg,cupRd);
      if(rdFmt(cupLg,cupRd)!=='team' || !ev) return null;
      const map={};
      (ev.teams||[]).forEach((t,i)=>(t.members||[]).forEach(id=>
        map[id]={n:(t.name||'').replace(/\s*\(승리\)/,''), i}));
      return id=>map[id];
    })();
    const oneTable=(t, title)=>{
      const rankHead = teamOf ? '팀' : title ? '조 순위' : '순위';
      return `
      ${title?`<div class="split" style="align-items:baseline;margin:14px 0 6px">
        <div class="secttl" style="margin:0">${title}</div>
        <div class="tiny dim">${t.players}명 · ${t.done}경기</div></div>`:''}
      <div class="ctwrap"><table class="ctb fit">
        <thead><tr><th class="cn"></th>
          ${t.ids.map((id,k)=>`<th title="${esc(nameOf(id))}">${k+1}</th>`).join("")}
          <th class="rc">전적</th><th class="rc gr">${rankHead}</th></tr></thead>
        <tbody>${t.ids.map((a,ai)=>`<tr>
          ${(()=>{ const rr=rdRank(cupLg,cupRd,a)||t.order.indexOf(a)+1;
            const tm=teamOf&&teamOf(a);
            return `<th class="cn"><i>${ai+1}</i><span>${esc(nameOf(a))}</span><em class="${rdBu(cupLg,cupRd,a)?'tb':''}">${rdBu(cupLg,cupRd,a)||P(a).bu}부</em></th>
          ${t.ids.map(b=>{
            if(a===b) return `<td class="self"></td>`;
            const x=t.cell[a][b];
            if(!x) return `<td class="none">·</td>`;
            /* 여러 판 붙어도 승패 글자로 통일 — 숫자로 쓰면 세트 스코어처럼 읽힌다 */
            const txt = (x.w+x.l)<=3 ? '승'.repeat(x.w)+'패'.repeat(x.l) : `${x.w}승${x.l}패`;
            return `<td class="${x.w>x.l?'win':x.w<x.l?'lose':''}">${txt}</td>`;
          }).join('')}
          <td class="rc"><b>${t.rec[a].w}</b>−${t.rec[a].l}</td>
          <td class="rc gr">${teamOf
            ? (tm?`<span class="grank tg${tm.i%2}">${esc(tm.n)}</span>`:'·')
            : `<span class="grank ${rr<=3?'m'+rr:''}">${rr}위</span>`}</td>`; })()}
        </tr>`).join('')}</tbody>
      </table></div>`;
    };
    const teamEventHTML=()=>{
      const ev=rdTeamEvent(cupLg,cupRd);
      if(!ev) return '';
      const pName=id=>`${esc(nameOf(id))}<i>${rdBu(cupLg,cupRd,id)||(P(id)||{}).bu||''}부</i>`;
      const members=ids=>(ids||[]).filter(id=>P(id)).map(pName).join(' · ');
      const podium=(ev.podium||[]).map(x=>`<div class="cupres-r adv">
          <span class="cupres-k">${esc(x.rank||'입상')}</span>
          <span class="cupres-n">${members(x.members)}</span>
        </div>`).join('');
      /* 두 팀 대항전은 팀 스코어를 크게 — 개인 순위보다 이게 그날의 결과다 */
      const res=ev.result;
      const scoreline = res ? `<div class="tvs">
          <span class="${res.winner===res.a?'w':''}">${esc(res.a)}</span>
          <b>${res.as}</b><i>:</i><b>${res.bs}</b>
          <span class="${res.winner===res.b?'w':''}">${esc(res.b)}</span>
        </div>` : '';
      /* 팀 간 대진이 저장돼 있으면 팀 대진표를 그리고, 순위가 따로 없으면 그걸로 계산한다 */
      const gnames=(ev.teams||[]).map(t=>String(t.name||'').replace(/\s*\(승리\)/,''));
      const games=(ev.games||[]).filter(g=>gnames.includes(g.a)&&gnames.includes(g.b));
      let standRows=(ev.standings||[]).slice();
      let gameTable='';
      if(games.length){
        const rec={}, cell={};
        gnames.forEach(n=>{ rec[n]={w:0,l:0,h2h:{}}; cell[n]={}; });
        games.forEach(g=>{
          const w=g.w===g.b?g.b:g.a, l=w===g.a?g.b:g.a;
          rec[w].w++; rec[l].l++; rec[w].h2h[l]=(rec[w].h2h[l]||0)+1;
          const t1=(g.as!=null&&g.bs!=null)?`${g.as}:${g.bs}`:null;
          cell[g.a][g.b]={win:w===g.a, txt:t1};
          cell[g.b][g.a]={win:w===g.b, txt:t1?`${g.bs}:${g.as}`:null};
        });
        const order=gnames.slice().sort((x,y)=> rec[y].w-rec[x].w
          || (rec[y].h2h[x]||0)-(rec[x].h2h[y]||0)                    // 승자승
          || gnames.indexOf(x)-gnames.indexOf(y));
        if(!standRows.length) standRows=order.map((n,i)=>({rank:i+1, team:n, w:rec[n].w, l:rec[n].l}));
        gameTable=`<div class="secttl" style="margin-top:12px">팀 대진표</div>
          <div class="ctwrap"><table class="ctb fit"><thead><tr><th class="cn"></th>
            ${order.map(n=>`<th>${esc(n.slice(0,4))}</th>`).join('')}<th class="rc">전적</th></tr></thead>
            <tbody>${order.map(a=>`<tr><th class="cn">${esc(a)}</th>
              ${order.map(b=>{ if(a===b) return '<td class="self"></td>';
                const x=cell[a][b]; if(!x) return '<td class="none">·</td>';
                return `<td class="${x.win?'win':'lose'}">${x.txt||(x.win?'승':'패')}</td>`; }).join('')}
              <td class="rc"><b>${rec[a].w}</b>−${rec[a].l}</td></tr>`).join('')}</tbody></table></div>`;
      }
      const stand=standRows.map(s=>{
        const tm=(ev.teams||[]).find(t=>(t.name||'').startsWith(s.team))||{};
        return `<div class="hof ${s.rank<=3?'m'+s.rank:''}">
          <span class="md">${s.rank<=3?`<span class="medal m${s.rank} sm">${s.rank}</span>`:s.rank}</span>
          <span class="nm">${esc(s.team)}<i>${members(tm.members)}</i></span>
          <span class="rt">${s.w!=null?`${s.w}승 ${s.l}패`:''}</span>
        </div>`; }).join('');
      const teams=stand?'':(ev.teams||[]).map(t=>`<div class="cupres-r">
          <span class="cupres-k">${esc(t.name||'팀')}</span>
          <span class="cupres-n">${members(t.members)}</span>
        </div>`).join('');
      return `<div class="card">
        <div class="split" style="align-items:baseline;margin-bottom:8px">
          <div><b>${esc(ev.title||'팀전 결과')}</b>
            <div class="tiny dim" style="margin-top:3px">${esc(ev.format||'팀전')} · ${ev.date?fmtDate(ev.date):roundLabel(cupRd)}${ev.source?` · ${esc(ev.source)}`:''}</div></div>
          ${ev.rating===false?'<span class="badge">Elo 미반영</span>':''}
        </div>
        ${scoreline}
        ${podium?`<div class="secttl" style="margin-top:4px">최종 결과</div><div class="cupres">${podium}</div>`:''}
        ${gameTable}
        ${stand?`<div class="secttl" style="margin-top:12px">팀 순위</div>${stand}`:''}
        ${teams?`<div class="secttl" style="margin-top:12px">팀 구성</div><div class="cupres">${teams}</div>`:''}
        ${ev.note?`<p class="tiny dim" style="margin:8px 2px 0">${esc(ev.note)}</p>`:''}
      </div>`;
    };
    /* 순위 결정전은 조별 순위가 같은 사람끼리 붙는다. 그 순서대로 최종 순위가 정해진다 */
    const koHTML = (()=>{
      if(!gs.ko.length) return '';
      const gTables=gs.groups.map(ids=>crossTable(cupLg,cupRd,ids));
      const seat={};                                   // 그 사람의 조별 등수
      gTables.forEach(t=>t.order.forEach((id,i)=>seat[id]=i));
      /* 저장된 순위전 차례(order)가 있으면 그대로, 없으면 조별 등수 순으로 */
      const sorted=gs.ko.slice().sort((m1,m2)=>
        (((m1.br&&m1.br.order)||99)-((m2.br&&m2.br.order)||99))
        || Math.min(seat[m1.aId]??99, seat[m1.bId]??99) - Math.min(seat[m2.aId]??99, seat[m2.bId]??99));
      const fin=[];
      sorted.forEach(m=>{ const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
        fin.push(w); fin.push(l); });
      /* 한 대진이 곧 두 자리 — 순위 목록을 따로 그리지 않고 한 줄로 합친다 */
      return `<div class="split" style="align-items:center;margin:16px 0 8px">
          <div class="secttl" style="margin:0">순위 결정전</div>
          <button class="btn ghost sm" data-cfrank="${fin.join(',')}">복사</button>
        </div>
        <div class="card">${sorted.map((m,i)=>{
          const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
          const nm2=id=>`${esc(nameOf(id))}<i>${(P(id)||{}).bu}부</i>`;
          return `<div class="plc ${i<3?'m'+(i+1):''}">
            <span class="pr">${i*2+1}·${i*2+2}위</span>
            <span class="w" data-psheet="${w}" role="button">${nm2(w)}</span>
            <span class="ar">›</span>
            <span class="l" data-psheet="${l}" role="button">${nm2(l)}</span>
          </div>`;
        }).join('')}</div>`;
    })();
    const brHTML = (()=>{
      const list=(gs.br||[]).slice().sort((a,b)=>((a.br&&a.br.order)||0)-((b.br&&b.br.order)||0)
        || (a.enteredAt||'').localeCompare(b.enteredAt||''));
      if(!list.length) return '';
      const byKind=k=>list.filter(m=>(m.br&&m.br.kind)===k);
      const loser=m=>{ const w=winnerOf(m); return w===m.aId?m.bId:m.aId; };
      const final=byKind('final').slice(-1)[0];

      const rows=[];
      if(final){ const w=winnerOf(final); rows.push(['1위', [w]]); rows.push(['2위', [w===final.aId?final.bId:final.aId]]); }

      /* 토너먼트 대진표 — 흔한 그 모양 그대로. 첫 라운드 참가자를 위에 세로 이름으로
         쭉 늘어놓고, 이긴 쪽 선이 아래로 모여 결승·우승으로 내려간다. */
      const bracketHTML=()=>{
        const bySort=(a,b)=>((a.br&&a.br.order)||0)-((b.br&&b.br.order)||0)

          || (a.enteredAt||'').localeCompare(b.enteredAt||'');
        const pick=(...ks)=>list.filter(m=>ks.includes((m.br&&m.br.kind))).sort(bySort);
        const bu=id=>rdBu(cupLg,cupRd,id)||(P(id)||{}).bu||'';
        const drawTree=(kinds)=>{
          const rounds=kinds.filter(k=>pick(k).length);
          if(!rounds.length) return '';
          const lv=rounds.map(k=>pick(k));
          let li=0;
          /* 결승에서 거꾸로 훑어 대진 나무를 세운다. 그 라운드에 경기가 없으면 부전승으로 통과 */
          const build=(l,pid)=>{
            if(l<0){ const i=li++; return {kind:'leaf', id:pid, span:[i,i], win:pid}; }
            const m=lv[l].find(x=>x.aId===pid||x.bId===pid);
            if(!m){ const k=build(l-1,pid); return {kind:'bye', lvl:l, kids:[k], span:k.span, win:k.win}; }
            const a=build(l-1,m.aId), b=build(l-1,m.bId);
            return {kind:'match', lvl:l, m, kids:[a,b], span:[a.span[0],b.span[1]], win:winnerOf(m)};
          };
          const top=rounds.length-1;
          const roots=lv[top].map(m=>{
            const a=build(top-1,m.aId), b=build(top-1,m.bId);
            return {kind:'match', lvl:top, m, kids:[a,b], span:[a.span[0],b.span[1]], win:winnerOf(m)};
          });
          const N=li; if(!N) return '';
          const leaves=[], nodes=[];
          const walk=n=>{ if(n.kind==='leaf'){ leaves.push(n); return; } nodes.push(n); n.kids.forEach(walk); };
          roots.forEach(walk);
          const champ=roots.length===1?roots[0].win:null;
          const mid=n=>(n.span[0]+n.span[1])/2+0.5;
          const fsz=N<=8?10:N<=14?9:N<=20?8:7.5;

            const s=n.span[0], e=n.span[1], w=e-s+1;

            const a=n.kids[0], b=n.kids[1];
            const ca=(mid(a)-s)/w*100, cb=(mid(b)-s)/w*100;
            const aw=a.win===n.win, bw=b.win===n.win;
            const barL='left:'+Math.min(ca,50)+'%;width:'+Math.abs(50-ca)+'%';
            const barR='left:'+Math.min(cb,50)+'%;width:'+Math.abs(50-cb)+'%';
            return '<div class="mgn"'+st+'>'
              + '<i class="pu on" style="left:50%"></i>'
              + '<i class="bar '+(aw?'on':'')+'" style="'+barL+'"></i>'
              + '<i class="bar '+(bw?'on':'')+'" style="'+barR+'"></i>'
              + '<i class="cd '+(aw?'on':'')+'" style="left:'+ca+'%"></i>'
              + '<i class="cd '+(bw?'on':'')+'" style="left:'+cb+'%"></i></div>';

              +'" style="grid-column:'+(l.span[0]+1)+';grid-row:'+(R+1)+'">'
              +'<span class="nm" data-psheet="'+l.id+'" role="button">'+esc(nameOf(l.id))+'</span>'
              +'<em>'+bu(l.id)+'</em></div>').join('');
          return '<div class="tbx" style="grid-template-columns:repeat('+N+',minmax(0,1fr));font-size:'+fsz+'px">'

        ${bracketHTML()}
        ${ranked?`<div class="split" style="align-items:baseline;margin:16px 0 8px">

          return `<div class="hof tapname ${rr<=3?'m'+rr:''}" data-psheet="${id}">
          <span class="md">${rr<=3?`<span class="medal m${rr} sm">${rr}</span>`:rr}</span>
          <span class="nm">${esc(nameOf(id))}<i>${rdBu(cupLg,cupRd,id)||P(id).bu}부</i></span>

    };
    const fmt=rdFmt(cupLg,cupRd);
    const teamHTML=teamEventHTML();
    const body = !all.done && teamHTML ? teamHTML : teamHTML + (fmt==='team'
      ? (all.done ? oneTable(all, '') : '')          // 팀전은 팀 결과가 주인공 — 개인 순위표는 없다
