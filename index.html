          <span class="nm">${esc(nameOf(id))}<i>${gridE.tbu[id]||P(id).bu}부</i></span>
          <button class="btn ghost sm" data-gup2="${at}" ${first?'disabled':''}>↑</button>
          <button class="btn ghost sm" data-gdn2="${at}" ${last?'disabled':''}>↓</button>
        </div>`;}).join('')}</div>
      <p class="tiny dim" style="margin:8px 2px 0">⠿ 를 잡고 끌어도 됩니다.</p></details>`;
    return paste + reorder + `<div class="ctwrap"><table class="ctb geb">
      <thead><tr><th class="cn"></th>${ord.map(id=>`<th>${sh(id)}</th>`).join('')}</tr></thead>
      <tbody>${ord.map(a=>`<tr>
        <th class="cn">${esc(nameOf(a))}<em class="${gridE.tbu[a]?'tb':''}">${gridE.tbu[a]||P(a).bu}부</em>${
          gridE.hb[a]?`<em class="tb">+${gridE.hb[a]}</em>`:''}</th>
        ${ord.map(b=>{
          if(a===b) return `<td class="self"></td>`;
          const w=getR(a,b), lock=isSaved(a,b);
          const v=cellVal(a,b);
          const warn=badSet.has(a<b?a+'|'+b:b+'|'+a);
          const cls = (warn?'warn ':'') + (v==='-' ? 'skip' : w===a ? 'win' : w===b ? 'lose' : 'none');
          return `<td class="${cls} ${lock?'lock':''}">
            <input class="gc" inputmode="text" maxlength="2" data-gset="${a}|${b}"
              value="${v}" ${lock?'disabled':''} placeholder="·"
              enterkeyhint="next" autocomplete="off"></td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>`;
  };
  /* 최종 순위 — 1위전 승자가 1위, 패자가 2위, 2위전 승자가 3위 … */
  const finalRank=()=>{
    const out=[];
    kos.forEach(x=>{
      const w=getR(x.a,x.b);
      if(!w){ out.push({a:x.a,b:x.b,rank:x.rank}); return; }   // 아직 안 침
      out.push({id:w, done:true});
      out.push({id:(w===x.a?x.b:x.a), done:true});
    });
    return out;
  };
  const koBoard=()=>{
    if(!kos.length) return `<div class="empty">조별리그를 마치면 순위 결정전 상대가 정해집니다.</div>`;
    return `<div class="card" style="margin:0">${kos.map(x=>{
      const w=getR(x.a,x.b), lock=isSaved(x.a,x.b);
      const cell=(id,other)=>`<button class="kop ${w===id?'on':''} ${lock?'lock':''}"
        data-gwin="${id}|${other}">${esc(nameOf(id))}<i>${P(id).bu}부</i></button>`;
      return `<div class="korow"><span class="rk">${x.rank}위전</span>
        ${cell(x.a,x.b)}<span class="vs">vs</span>${cell(x.b,x.a)}
        ${lock?'<span class="lk">🔒</span>':''}</div>`;
    }).join('')}</div>
    <p class="tiny dim" style="margin:8px 2px 0">이긴 쪽을 누르세요. 조별 순위가 같은 사람끼리 겨룹니다.</p>
    ${(()=>{ const fr=finalRank();
      const doneAll=fr.every(x=>x.done);
      return `<div class="split" style="align-items:baseline;margin:16px 0 8px">
        <div class="secttl" style="margin:0">최종 순위</div>
        ${doneAll?`<button class="btn ghost sm" id="gCopyRank">복사</button>`:'<span class="tiny dim">순위 결정전을 마치면 확정됩니다</span>'}
      </div>
      <div class="card">${fr.map((x,i)=>x.done
        ? `<div class="gp ${i<3?'adv':''}"><span class="rk">${i+1}</span>
            <span class="n">${esc(nameOf(x.id))}<i>${P(x.id).bu}부</i></span></div>`
        : `<div class="gp"><span class="rk">${x.rank*2-1}·${x.rank*2}</span>
            <span class="n dim">${esc(nameOf(x.a))} · ${esc(nameOf(x.b))} 경기 전</span></div>`).join('')}</div>`;
    })()}`;
  };
  if(!useGrp) return board(inGroup('A'))
    + `<p class="tiny dim" style="margin:8px 2px 0">칸을 누르면 <b>가로줄 기준</b>으로 승 → 패 → 해제 순으로 바뀝니다.</p>`;
  return `<div class="seg" style="margin-bottom:10px">
      ${tabs.map(([k,lab])=>`<button data-gtab="${k}" class="${gridE.tab===k?'on':''}">${lab}</button>`).join('')}
    </div>
    ${gridE.tab==='KO' ? koBoard() : board(inGroup(gridE.tab))
      + `<p class="tiny dim" style="margin:8px 2px 0">칸에 <b>딴 세트 수</b>를 적으세요. 성사되지 않은 경기는 <b>-</b>.</p>`}
    ${gridE.tab!=='KO' ? `<div class="secttl" style="margin-top:14px">${gridE.tab}조 순위</div>
      <div class="card">${rankIn(gridE.tab).map((id,i)=>`<div class="gp ${i===0?'adv':''}">
        <span class="rk">${i+1}</span><span class="n">${esc(nameOf(id))}<i>${P(id).bu}부</i></span>
      </div>`).join('')}</div>` : ''}`;
}

/* 리그 하나를 통째로 고치는 시트 — 다 바꾸고 한 번에 저장한다 */

  const draw=()=>`

      </select></div>

        <input type="number" id="lgMh" value="${d.rules.maxHandi ?? ''}" placeholder="${st().maxHandi||0}"></div>
      <div class="field"><label>1점당 레이팅</label>
        <input type="number" id="lgHe" value="${d.rules.handiElo ?? ''}" placeholder="${st().handiElo}"></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>낮은 부수 예외</label>
        <select id="lgLb"><option value="">없음</option>
          ${Array.from({length:BU_MAX-BU_MIN+1},(_,k)=>BU_MIN+k).map(b=>
            `<option value="${b}" ${String(d.rules.lowBu)===String(b)?'selected':''}>${b}부 이하</option>`).join('')}
        </select></div>
      <div class="field"><label>그때 최대 핸디</label>
        <input type="number" id="lgLm" value="${d.rules.lowMaxHandi ?? ''}" placeholder="—"></div>

    <label class="lgchk"><input type="checkbox" id="lgHo"
      ${(d.rules.handiOn ?? st().handiOn)?'checked':''}> 핸디 보정 적용</label>

      sh.remove(); render(); toast('리그를 지웠습니다.');
    };

  sh=sheet(isNew?'리그 추가':`${cur.name} 설정`, draw()); bind();

  const upset=m=>{ const e=expOf(m); if(e==null) return false;
    const fav=e>=0.5?m.aId:m.bId, p=Math.max(e,1-e);
    return winnerOf(m)!==fav && p>=1-UPSET; };
  const pass=m=>{

    ${isAdmin()&&cur.length?`<details class="advbox" style="margin-bottom:12px"><summary>이 회차 기록 정리</summary>
      <p class="tiny dim" style="margin:0 0 8px">${roundLabel(viewLog.rd)}에 등록된
        ${esc(lgName(lg))} <b>${cur.length}경기</b>를 한 번에 지웁니다. 되돌릴 수 없습니다.</p>
      <button class="btn ghost" id="rdWipe">이 회차 ${cur.length}경기 모두 삭제</button></details>`:''}
    <div class="field" style="margin:0 0 10px"><label>선수로 거르기</label>
      ${comboHTML('logWho', who, {placeholder:'이름 검색  예) 홍길동, ㅎㄱㄷ'})}</div>
    <div class="seg" style="margin:0 0 12px">

      <button data-f="upset" class="${f==='upset'?'on':''}">이변 ${cur.filter(upset).length}</button>
      ${S.me?`<button data-f="mine" class="${f==='mine'?'on':''}">내 경기 ${cur.filter(isMine).length}</button>`:''}
    </div>
    ${rows.length?matchListHTML(rows, {}):'<div class="empty">해당하는 경기가 없습니다.</div>'}`;
  bindLgBar();
  document.querySelectorAll('[data-lrdnav]').forEach(b=>b.onclick=()=>{
    if(b.dataset.lrdnav){ viewLog.rd=b.dataset.lrdnav; viewLog(); } });
  { const sel=document.querySelector('[data-lrdsel]');

/* 빠른 입력 — 그날 붙은 상대를 한 번에 찍고 저장한다.
   칩을 누를 때마다 승 → 패 → 해제로 돌고, 오른쪽 숫자를 누르면 판수가 늘어난다. */
let bulk = null;
let pickOrder=null;
/* 오늘 나왔을 법한 사람 — 같은 요일 출석률과 최근 출석으로 어림한다 */
function likelyToday(date){
  const [Y,M,D]=String(date).split('-').map(Number);
  const dow=new Date(Y,M-1,D).getDay();
  const all=(S._sorted||[]).filter(m=>m.date<date);
  /* 클럽이 모인 날들을 요일별로 센다 */
  const clubDays=[...new Set(all.map(m=>m.date))];
  const sameDow=clubDays.filter(d=>{ const [y,mo,dd]=d.split('-').map(Number);
    return new Date(y,mo-1,dd).getDay()===dow; });
  const recent=clubDays.slice(-8);
  const by={};
  const mark=(id,d)=>{ const b=by[id]=by[id]||{dow:new Set(), rec:new Set(), last:null};
    const [y,mo,dd]=d.split('-').map(Number);
    if(new Date(y,mo-1,dd).getDay()===dow) b.dow.add(d);
    if(recent.includes(d)) b.rec.add(d);
    if(!b.last || d>b.last) b.last=d; };
  all.forEach(m=>{ mark(m.aId,m.date); mark(m.bId,m.date); });
  return id=>{
    const b=by[id];
    if(!b) return {score:0, dowRate:0, days:0};
    const dowRate = sameDow.length ? b.dow.size/sameDow.length : 0;   // 이 요일 출석률
    const recRate = recent.length  ? b.rec.size/recent.length  : 0;   // 최근 8일 출석률
    const idle = b.last ? daysBetween(b.last, date) : 999;
    const fresh = idle<=7 ? 1 : idle<=21 ? .6 : idle<=60 ? .25 : 0;   // 최근에 나온 적 있나
    /* 이 요일 출석률을 가장 크게 본다. 한참 안 나왔으면 크게 깎는다 */
    return {score: (dowRate*0.55 + recRate*0.25 + fresh*0.2) * (idle>45 ? 0.4 : 1),
            dowRate, days:b.dow.size, sameDow:sameDow.length, idle};
  };
}
/* 상대 고르는 격자만 따로 그린다. 입력칸을 다시 그리지 않아야 한글 입력이 끊기지 않는다 */
function pickListHTML(opp, picks, q, date, sortBy){
  const s2=String(q||'').trim();
  const hit=s2 ? opp.filter(p=>matchName(p, s2)) : opp;
  if(!hit.length) return `<div class="empty">'${esc(s2)}'와 맞는 사람이 없습니다.</div>`;
  const chip=p=>{ const k=picks[p.id];
    return `<button class="pk ${k?(k.r==='W'?'w':'l'):''}" data-pick="${p.id}">
      <span class="nm">${esc(p.name)}</span>
      ${k?`<span class="ct">${k.r==='W'?'승':'패'}</span>`:''}
    </button>`; };
  if(sortBy==='likely'){
    /* 순서는 한 번만 정하고 붙잡아 둔다. 고르는 중에 자리가 바뀌면 누르기 어렵다 */
    const key=(date||today())+'|'+opp.length;
    if(!pickOrder || pickOrder.key!==key){
      const f=likelyToday(date||today());
      pickOrder={key, list:opp.map(p=>({id:p.id, s:f(p.id).score}))
        .sort((a,b)=>b.s-a.s || ((P(a.id)||{}).bu||0)-((P(b.id)||{}).bu||0))};
    }
    const rank={}; pickOrder.list.forEach((x,i)=>rank[x.id]={i, s:x.s});
    const scored=hit.map(p=>({p, s:(rank[p.id]||{}).s||0, i:(rank[p.id]||{}).i ?? 999}))
      .sort((a,b)=>a.i-b.i);
    /* 이 요일에 온 적이 없거나 한참 안 나온 사람은 아래로 내린다 */
    const cut=scored.findIndex(x=>x.s<0.35);
    const head=cut<0?scored:scored.slice(0,cut), tail=cut<0?[]:scored.slice(cut);
    const D=['일','월','화','수','목','금','토'];
    const [Y,M,DD]=String(date||today()).split('-').map(Number);
    return `<div class="pkgrp"><div class="pg-h">${D[new Date(Y,M-1,DD).getDay()]}요일에 자주 나오는 사람
        <span>${head.length}명</span></div>
        <div class="picks">${head.map(x=>chip(x.p)).join('')}</div></div>
      ${tail.length?`<div class="pkgrp"><div class="pg-h">그 밖 <span>${tail.length}명</span></div>
        <div class="picks">${tail.map(x=>chip(x.p)).join('')}</div></div>`:''}`;
  }
  const byBu={}; hit.forEach(p=>(byBu[p.bu]=byBu[p.bu]||[]).push(p));
  return Object.keys(byBu).map(Number).sort((a,b)=>a-b).map(bu=>`
    <div class="pkgrp"><div class="pg-h">${bu}부 <span>${byBu[bu].length}명</span></div>
    <div class="picks">${byBu[bu].map(chip).join('')}</div></div>`).join('');
}

/* picks = { 상대id: {r:'W'|'L', n:판수} } — 중복은 건너뛰고 상대 입력분은 합친다 */
async function planAndSave(date, meId, picks, lg){
  /* 관리자가 입력한 경기는 본인이 뛴 것이든 아니든 바로 확정으로 본다.
     회원이 자기 경기를 넣은 경우에만 상대 확인을 기다린다. */
  const needConfirm = !isAdmin() && meId===S.me.id;
  const confirmIds = oppId => needConfirm ? [S.me.id] : [meId, oppId];
  const draftList = S.matches.slice();
  const scan = (oppId,iWon)=>{
    const same=draftList.filter(m=>!m.void && m.date===date &&
      ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
    /* 누가 적었든 승자가 같으면 같은 경기다 */
    const ok=m=>(winnerOf(m)===meId)===iWon;
    const cands=same.filter(ok), cb=m=>m.confirmedBy||[];
    /* 상대가 먼저 넣어둔 건 — 확인만 얹으면 되고 새로 만들지 않는다 */
    const byOpp = cands.find(m=>m.enteredBy!==meId && !cb(m).includes(meId) && !isConfirmed(m));
    /* 이미 확정됐거나 내가 넣은 건은 다시 만들 필요가 없다 */
    const mineCount = cands.filter(m=>m.enteredBy===meId || cb(m).includes(meId) || isConfirmed(m)).length;
    return { byOpp, mineCount };
  };
  const writes=[]; let created=0, merged=0, skipped=0;
  for(const [oppId,k] of Object.entries(picks)){
    if(!P(oppId) || oppId===meId) continue;
    const iWon = k.r==='W';
    const s0 = scan(oppId,iWon);
    let need = Math.max(0, k.n - s0.mineCount);
    skipped += k.n - need;
    while(need>0){
      const sc = scan(oppId,iWon);
      if(!sc.byOpp) break;
      const upd={...sc.byOpp, confirmedBy:[...new Set([...(sc.byOpp.confirmedBy||[]), ...confirmIds(oppId)])],
                 status:'confirmed', rev:(sc.byOpp.rev||0)+1};
      writes.push(upd);
      const i=draftList.findIndex(m=>m.id===upd.id); if(i>=0) draftList[i]=upd;
      merged++; need--;
    }
    const a=P(meId), b=P(oppId);
    const hTo = a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';
    const hPts = hTo ? handiPtsFor(a.bu,b.bu) : 0;
    for(let i=0;i<need;i++){
      const hd = hTo?{toId:hTo, pts:hPts}:null;
      const m={ id:uid('m'), rev:1, date, lg: lg || defLeague(),
                aId:meId, bId:oppId, winnerId: iWon?meId:oppId,
                handi: hd, note:'',
                /* 과거 날짜로 넣는 경기는 비워 둔다.
                   전체를 시간순으로 다시 계산한 뒤 관리 화면에서 고정해야 값이 맞다. */
                exp: isBackfill(date) ? null : expNow(meId, oppId, hd),
                enteredBy:S.me.id, enteredAt:new Date(Date.now()+i).toISOString(),
                confirmedBy: confirmIds(oppId), status: needConfirm?'single':'confirmed', void:false };
      writes.push(m); draftList.push(m); created++;
    }
  }
  let ok=true;
  if(writes.length){ busyOn(`${writes.length}건 저장 중…`); ok=await commitMatches(writes); }
  return {ok, created, merged, skipped, count:writes.length};
}

function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  /* 엔진이 계산한 순서(오래된 것부터)를 그대로 뒤집어 쓴다.
     화면 순서와 계산 순서가 어긋나면 '개인 최고' 같은 표시가 엉뚱한 줄에 붙는다. */
  const ord={}; (S._sorted||[]).forEach((m,i)=>ord[m.id]=i);
  const key=m=> ord[m.id]!=null ? ord[m.id]
    : 1e9 + (m.date+'|'+(m.enteredAt||'')).localeCompare('');
  const sorted=list.slice().sort((a,b)=>{
    const ka=ord[a.id], kb=ord[b.id];
    if(ka!=null && kb!=null) return kb-ka;                 // 최신이 위
    return (b.date+'|'+(b.enteredAt||'')).localeCompare(a.date+'|'+(a.enteredAt||''));
  });
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
/* 여러 건을 한 번에 지운다 — 하나씩 지우면 그때마다 전체 재계산이 돌아 느리다 */
async function deleteMatches(list){
  const ids=new Set(list.map(m=>m.id));
  if(!ids.size) return true;
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>!ids.has(m.id));
  recompute(); render();
  busyOn(`${ids.size}건 삭제 중…`);
  let ok=true;
  try{
    if(FB){
      for(const id of ids) await FB.del(FBM+'/'+id);
      bumpSig();
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>ids.has(x.id))) continue;
        if(!await sSet(k, cur.filter(x=>!ids.has(x.id)))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 경기 삭제 — 보관하지 않고 바로 지운다 */
async function deleteMatchById(id){
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>m.id!==id); recompute(); render();
  busyOn('삭제 중…');
  let ok=true;
  try{
    if(FB){ await FB.del(FBM+'/'+id); bumpSig(); }
    else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>x.id===id)) continue;
        if(!await sSet(k, cur.filter(x=>x.id!==id))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 선수를 지울 때 그 사람 경기도 함께 지운다 */
async function deleteMatchesOf(pid){
  const targets=S.matches.filter(m=>m.aId===pid||m.bId===pid);
  if(!targets.length) return 0;
  try{
    if(FB){
      const obj={}; targets.forEach(m=>obj[m.id]=null);   // null 을 넣으면 그 레코드가 지워진다
      await FB.patch(FBM, obj); bumpSig();
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        const next=cur.filter(m=>m.aId!==pid && m.bId!==pid);
        if(next.length!==cur.length) await sSet(k,next);
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); return 0; }
  S.matches=S.matches.filter(m=>m.aId!==pid && m.bId!==pid); recompute();
  return targets.length;
}
/* 날짜만 바꾼다. 개별 레코드 방식이라 옮길 필요가 없다 */
async function moveMatchDate(m, newDate){
  const upd={...m, date:newDate, rev:(m.rev||0)+1, editedBy:S.me.id, editedAt:new Date().toISOString()};
  if(FB) return pushMatches([upd]);
  const newKey=KEY.shard(monthOf(newDate));
  if(!await commitMatch(upd)) return false;
  for(const k of (await sList(MPRE))){
    if(k===newKey) continue;
    const cur=(await sGet(k))||[];
    if(cur.some(x=>x.id===m.id)) await sSet(k, cur.filter(x=>x.id!==m.id));
  }
  await loadAll();
  return true;
}

/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>expOf(m)!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = expFor(m, w);
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=UPSET) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){

/* ── 내 정보 / 선수 상세 ── */
function sparkline(id,mode,ym){
  /* 시즌 첫날부터 오늘까지 매일 찍는다. 경기가 없던 날은 점수가 그대로 이어진다. */
  const p=P(id); if(!p) return '';
  const per = ym || (seasons().slice(-1)[0]) || monthOfNow();
  const hist=(trk(mode).H[id]||[]);
  const played=new Set((S._sorted||[]).filter(m=>m.aId===id||m.bId===id).map(m=>m.date));
  const byDay=new Map();
  for(const x of hist){ if(x.d && played.has(x.d)) byDay.set(x.d, x.r); }

  const addDay=(ds,n)=>{ const t=new Date(ds+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n);
    return t.toISOString().slice(0,10); };
  /* 시즌 키가 4자리면 그 해 전체, 7자리면 그 달 */
  const yearly = String(per).length===4;
  const start = yearly ? per+'-01-01' : per+'-01';
  const seasonEnd = yearly ? per+'-12-31' : addDay(shiftMonth(per,1)+'-01', -1);
  const end = today() < seasonEnd ? today() : seasonEnd;
  if(end < start) return '';

  /* 시즌 시작 시점의 점수 — 그 전 마지막 기록, 없으면 기준값 */
  let cur = mode==='form' ? st().formBase : baseFor(p.bu);
  [...byDay.keys()].sort().forEach(d=>{ if(d < start) cur = byDay.get(d); });

  const series=[]; let d=start, guard=0;
  while(d<=end && guard++<400){
    if(byDay.has(d)) cur=byDay.get(d);
    series.push([d, cur, byDay.has(d)]);
    d=addDay(d,1);
  }
  if(series.length<2) return '';
  const h=series.map(x=>x[1]);
  const w=300,ht=64;
  let lo=Math.min(...h), hi=Math.max(...h);
  if(hi-lo < 30){ const mid=(hi+lo)/2; lo=mid-15; hi=mid+15; }   // 변화가 작아도 납작하지 않게
  const sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const dd=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const dots=series.map((x,i)=> x[2]
    ? `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="2.2" fill="${col}">
        <title>${x[0]} · ${Math.round(x[1])}</title></circle>` : '').join('');
  const days=series.filter(x=>x[2]).length;
  const fmt=x=>(+x.slice(8))+'일';
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${dd} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${dd}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>
    <div class="split tiny dim"><span>${Math.round(Math.min(...h))}</span>
      <span>${+per.slice(5)}월 ${fmt(start)}~${fmt(end)} <span class="dim">· ${days}일 출전</span></span>
      <span>${Math.round(Math.max(...h))}</span></div>`;
}
const playDaysOf = (id, ym)=> new Set((S._sorted||[])
  .filter(m=>(m.aId===id||m.bId===id) && (!ym || m.date.slice(0,String(ym).length)===ym))

/* 마감된 시즌만 통산 기록에 넣는다. 진행 중인 시즌은 순위가 아직 확정이 아니다. */
const closedSeasons = ()=> seasons().filter(ym=>ym < monthOfNow());
function careerRank(id, mode){
  const yms=closedSeasons();
  const MIN=st().provisional||0;
  const rs=[];                       // {ym, r}
  for(const ym of yms){
    const all=standings(ym,mode).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    if(i>=0) rs.push({ym, r:i+1});
  }
  if(!rs.length) return {n:0};
  const nums=rs.map(x=>x.r);
  const best=Math.min(...nums);
  const bestAt=rs.find(x=>x.r===best);
  const winSeasons=rs.filter(x=>x.r===1).map(x=>x.ym);
  return {n:rs.length, best, bestYm:bestAt?bestAt.ym:null,
          avg:nums.reduce((a,b)=>a+b,0)/nums.length,
          wins:winSeasons.length, winYms:winSeasons};
}
/* 통산 순위 기록 */
function rankStats(id, mode){
  const dates=playDates(); if(!dates.length) return null;
  const first=(S._sorted||[]).find(m=>m.aId===id||m.bId===id);
  if(!first) return null;
  const rs=[];
  for(const d of dates){
    if(d<first.date) continue;
    const map=ranksAt(d, mode);
    if(map[id]) rs.push(map[id]);
  }
  if(!rs.length) return null;
  return {best:Math.min(...rs), avg:rs.reduce((a,b)=>a+b,0)/rs.length, n:rs.length};
}
function seasonWins(id, mode){
  const yms=seasons(); let wins=0, played=0;
  for(const ym of yms){
    const rows=standings(ym, mode).filter(r=>r.g>=(st().provisional||0));
    if(!rows.length) continue;
    if(rows.some(r=>r.p.id===id)) played++;
    if(rows[0].p.id===id) wins++;
  }
  return {wins, played};
}
/* 시즌별 세부 기록 — 탁구에서 의미 있는 것들 */
function seasonStats(id, ym, mode){
  const me=P(id); if(!me) return null;
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,String(ym).length)===ym && (m.aId===id||m.bId===id));
  let ups=0, hiW=0, hiL=0, loW=0, loL=0, faceSum=0, fn=0, gave=0, gaveW=0, got=0, gotW=0, best=null;
  const opps=new Set();
  for(const m of ms){
    const oid = m.aId===id ? m.bId : m.aId, o=P(oid); if(!o) continue;
    opps.add(oid);
    const won = winnerOf(m)===id;
    const e = expFor(m, id);
    if(won && e!=null && e<UPSET) ups++;
    if(o.bu < me.bu){ won?hiW++:hiL++; } else if(o.bu > me.bu){ won?loW++:loL++; }
    /* 상대 강도는 상대의 등록 부수로 본다. 엔진 내부값(_face)은 모드에 따라 덮여서 쓰면 안 된다. */
    faceSum += o.bu; fn++;
    if(won && (!best || o.bu < best.bu)) best={bu:o.bu, oid};
    if(m.handi && m.handi.pts){
      if(m.handi.toId!==id){ gave++; if(won) gaveW++; } else { got++; if(won) gotW++; }
    }
  }
  return {n:ms.length, ups, hiW, hiL, loW, loL, gave, gaveW, got, gotW, best,
          avgBu: fn?faceSum/fn:null, opps:opps.size};
}
/* 앞면 한 줄 문구 — 성적을 그대로 */
function seasonTag(id, ym, mode, rank, rec, st2){
  if(!rec.g) return '기록 없음';
  return `${rec.w}승 ${rec.l}패 · 승률 ${Math.round(rec.w/rec.g*100)}%`;

/* ── 클럽 분석 ──────────────────────────────────────────────
   손으로는 못 세는 것들: 팽팽한 매치업, 물고 물리는 삼각관계, 부수 조정 후보 */
function fairHandi(aId, bId){
  const A=P(aId), B=P(bId); if(!A||!B) return null;
  const ra=rateOf(aId,'skill'), rb=rateOf(bId,'skill');
  const gap=ra-rb;                                   // A가 유리한 정도
  const cur=(A.bu!==B.bu) ? handiPtsFor(A.bu,B.bu) : 0;
  const curTo=(A.bu>B.bu)?aId:(B.bu>A.bu?bId:null);  // 지금 관행상 핸디 받는 쪽
  const he=st().handiElo||1;
  const need=Math.round(Math.abs(gap)/he);           // 5:5로 만드는 데 필요한 점수
  const needTo=gap>0?bId:aId;
  const eff=gap + (curTo? (curTo===aId? cur*he : -cur*he) : 0);
  return {gap, cur, curTo, need, needTo, exp:1/(1+Math.pow(10,-eff/400))};
}
function pairStats(aId,bId){
  let w=0,l=0,last=null;
  for(const m of clubScope()){
    if((m.aId===aId&&m.bId===bId)||(m.aId===bId&&m.bId===aId)){
      (winnerOf(m)===aId)?w++:l++; last=m.date;
    }
  }
  return {w,l,n:w+l,last};
}
/* 물고 물리는 삼각관계 — A가 B를, B가 C를, C가 A를 이기는 고리 */
function findCycles(minGames){
  const ps=roster().filter(p=>(S.G[p.id]||0)>0);
  const edge={};      // edge[a][b] = true  (a가 b에게 우세)
  const info={};
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    const a=ps[i].id, b=ps[j].id, st2=pairStats(a,b);
    if(st2.n<minGames) continue;
    if(st2.w>st2.l){ (edge[a]=edge[a]||{})[b]=1; info[a+'>'+b]=`${st2.w}−${st2.l}`; }
    else if(st2.l>st2.w){ (edge[b]=edge[b]||{})[a]=1; info[b+'>'+a]=`${st2.l}−${st2.w}`; }
  }
  const out=[];
  const ids=ps.map(p=>p.id);
  for(let i=0;i<ids.length;i++) for(let j=0;j<ids.length;j++) for(let k=0;k<ids.length;k++){
    const a=ids[i],b=ids[j],c=ids[k];
    if(a===b||b===c||a===c) continue;
    if(a>=b||b>=c) continue;                          // 같은 고리 중복 방지
    if(edge[a]?.[b] && edge[b]?.[c] && edge[c]?.[a]) out.push([a,b,c,info]);
    else if(edge[a]?.[c] && edge[c]?.[b] && edge[b]?.[a]) out.push([a,c,b,info]);
  }
  return out;
}
/* 부수 조정 후보 — 체감과 등록 부수가 벌어진 사람 */
function buCandidates(){
  const MIN=Math.max(st().provisional||0, 8);
  return roster().map(p=>{
    const g=S.G[p.id]||0; if(g<MIN) return null;
    const felt=buScale(rateOf(p.id,'skill'));
    const d=p.bu-felt;                                 // +면 체감이 더 강함(승격 후보)
    if(Math.abs(d)<1.0) return null;
    return {p, g, felt, d};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
/* ── 대회 시뮬레이터 ──────────────────────────────────────────
   실력은 부수 레이팅(핸디를 걷어낸 값)으로 보고,
   핸디 적용 여부는 경기 조건으로 따로 고른다. */
function simWinProb(a, b, useHandi){
  let ea=a.r, eb=b.r;
  if(useHandi && a.bu!==b.bu){
    const pts=handiPtsFor(a.bu,b.bu);
    if(a.bu>b.bu) ea+=pts*st().handiElo; else eb+=pts*st().handiElo;
  }
  return 1/(1+Math.pow(10,(eb-ea)/400));
}
const nextPow2 = n => { let k=1; while(k<n) k*=2; return k; };
/* 스네이크 방식으로 조를 나눈다 (1조1번, 2조1번, 2조2번, 1조2번 …) */
function snakeGroups(list, n){
  const gs=Array.from({length:n},()=>[]);
  list.forEach((p,i)=>{ const row=Math.floor(i/n), col=i%n;
    gs[row%2 ? n-1-col : col].push(p); });
  return gs;
}
function playLeague(members, useHandi, rnd){
  const rec={}; members.forEach(m=>rec[m.id]={w:0,l:0,h2h:{}});
  for(let i=0;i<members.length;i++) for(let j=i+1;j<members.length;j++){
    const A=members[i], B=members[j];
    const aw = rnd() < simWinProb(A,B,useHandi);
    if(aw){ rec[A.id].w++; rec[B.id].l++; rec[A.id].h2h[B.id]=1; rec[B.id].h2h[A.id]=0; }
    else  { rec[B.id].w++; rec[A.id].l++; rec[B.id].h2h[A.id]=1; rec[A.id].h2h[B.id]=0; }
  }
  return members.slice().sort((x,y)=>{
    const d=rec[y.id].w-rec[x.id].w; if(d) return d;
    const h=rec[x.id].h2h[y.id];                 // 승자승
    if(h===1) return -1; if(h===0) return 1;
    return rnd()-0.5;
  }).map(p=>({...p, w:rec[p.id].w, l:rec[p.id].l}));
}
/* 표준 대진 순서 — 1위와 최하위가 반대편에 서고, 부전승이 고르게 흩어진다 */
function seedOrder(size){
  let o=[1];
  while(o.length<size){
    const n=o.length*2, next=[];
    o.forEach(x=>{ next.push(x); next.push(n+1-x); });
    o=next;
  }
  return o;
}
function playKnockout(seeds, useHandi, rnd){
  const size=nextPow2(seeds.length);
  const order=seedOrder(size);
  const slots=order.map(seedNo => seeds[seedNo-1] || null);   // 빈 번호는 부전승
  const rounds=[];                                // 각 라운드를 시작할 때 살아 있는 사람
  const log=[];
  let round=slots;
  while(round.length>1){
    rounds.push(round.filter(Boolean).map(p=>p.id));
    const next=[];
    for(let i=0;i<round.length;i+=2){
      const A=round[i], B=round[i+1];
      if(!A && !B){ next.push(null); continue; }
      if(!A || !B){ next.push(A||B); continue; }  // 부전승도 다음 라운드 명단에 들어간다
      const aw = rnd() < simWinProb(A,B,useHandi);
      const win = aw?A:B, lose = aw?B:A;
      log.push({size:round.length, win:win.id, lose:lose.id});
      next.push(win);
    }
    round=next;
  }
  rounds.push(round.filter(Boolean).map(p=>p.id)); // 마지막은 우승자
  return {champ:round[0]||null, rounds, log};
}
/* 조별리그 통과자를 토너먼트 대진으로. 같은 조 1위끼리 일찍 만나지 않게 교차 배치한다. */
function bracketSeeds(tops, adv){
  const A=[], B=[];
  tops.forEach((order,gi)=>order.slice(0,adv).forEach((p,k)=>{
    ((gi+k)%2===0 ? A : B).push(p);
  }));
  const out=[], n=Math.max(A.length,B.length);
  for(let k=0;k<n;k++){ if(A[k]) out.push(A[k]); if(B[k]) out.push(B[k]); }
  return out;
}
/* 조 편성 — 4명씩을 기본으로, 남으면 3명 조를 섞는다 */
function groupSizes(n, want){
  if(want>=3 && n>=want){
    /* 지정 인원에 가장 가깝게 나눈다. 딱 떨어지지 않으면 한 명씩만 차이 나게 */
    const k=Math.max(1, Math.round(n/want));
    const base=Math.floor(n/k), r=n%k;
    const sz=Array.from({length:k},(_,i)=>base+(i<r?1:0));
    /* 조 인원이 지정값에서 2명 이상 벌어지면 조 수를 하나 늘려 다시 나눈다 */
    if(Math.max(...sz)-want>=2){
      const k2=k+1, b2=Math.floor(n/k2), r2=n%k2;
      return Array.from({length:k2},(_,i)=>b2+(i<r2?1:0)).sort((a,b)=>b-a);
    }
    return sz.sort((a,b)=>b-a);
  }
  if(n<3) return n?[n]:[];
  if(n===3) return [3];
  if(n===4) return [4];
  if(n===5) return [3,2];
  let a=Math.floor(n/4), b=0, r=n%4;
  if(r===1){ a-=2; b=3; }            // 4+4+1 → 3+3+3
  else if(r===2){ a-=1; b=2; }       // 4+2   → 3+3
  else if(r===3){ b=1; }
  if(a<0){ a=0; b=Math.ceil(n/3); }
  const sz=Array.from({length:a},()=>4).concat(Array.from({length:b},()=>3));
  let diff=n-sz.reduce((x,y)=>x+y,0);
  for(let i=0; diff>0 && i<sz.length; i++){ sz[i]++; diff--; }
  return sz.sort((x,y)=>y-x);
}
/* 한 번 뽑아서 실제로 치러 본다 — 조 편성, 조별 결과, 대진표를 그대로 남긴다 */
function drawOnce(opts){
  const {ids, mode, useHandi, format, adv} = opts;
  const rnd=Math.random;
  const base=ids.map(id=>({id, r:rateOf(id,mode), bu:(P(id)||{}).bu||10, name:nameOf(id)}));
  const sh=base.slice();
  for(let i=sh.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [sh[i],sh[j]]=[sh[j],sh[i]]; }

  if(format==='league'){
    const order=playLeague(sh, useHandi, rnd);
    return {format, league:order, champ:order[0]||null};
  }
  if(format==='cup'){
    const ko=playKnockout(sh, useHandi, rnd);
    return {format, seeds:sh, ko, champ:ko.champ};
  }
  const sz=groupSizes(sh.length, opts.gsize);
  const gs=[]; let k=0;
  sz.forEach(n=>{ gs.push(sh.slice(k,k+n)); k+=n; });
  const tops=gs.map(g=>playLeague(g, useHandi, rnd));
  const seeds=bracketSeeds(tops, adv);
  const ko=playKnockout(seeds, useHandi, rnd);
  return {format, groups:tops, adv, seeds, ko, champ:ko.champ};
}
function runSim(opts){
  const {ids, mode, useHandi, format, groups, adv, runs} = opts;
  const base = ids.map(id=>({id, r:rateOf(id,mode), bu:(P(id)||{}).bu||10, name:nameOf(id)}))
                  .sort((a,b)=>b.r-a.r);
  const stat={}; ids.forEach(id=>stat[id]={champ:0, final:0, semi:0, adv:0});
  let seed=20260806;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const bump=(k,list)=>{ if(!list) return;
    new Set(list).forEach(id=>{ if(stat[id]) stat[id][k]++; }); };
  for(let t=0;t<runs;t++){
    if(format==='league'){
      const order=playLeague(base, useHandi, rnd);
      if(order[0]) stat[order[0].id].champ++;
      bump('final', order.slice(0,2).map(p=>p.id));
      bump('semi',  order.slice(0,4).map(p=>p.id));
      bump('adv',   order.map(p=>p.id));
      continue;
    }
    let seeds;
    if(format==='cup') seeds=base.slice();
    else {
      const gs=snakeGroups(base, Math.max(1,groups));
      const tops=gs.map(gm=>playLeague(gm, useHandi, rnd));
      tops.forEach(o=>bump('adv', o.slice(0,adv).map(p=>p.id)));
      seeds=bracketSeeds(tops, adv);
    }
    if(!seeds.length) continue;
    const {champ, rounds}=playKnockout(seeds, useHandi, rnd);
    /* rounds 의 끝에서부터: [우승자] [결승 진출자] [4강 진출자] … */
    const last=rounds.length-1;
    if(champ) stat[champ.id].champ++;
    bump('final', rounds[last-1]);
    bump('semi',  rounds[last-2] || rounds[last-1]);   // 4강 자체가 없으면 결승 명단과 같다
  }
  const rows=ids.map(id=>({id, name:nameOf(id), bu:(P(id)||{}).bu,
    r:Math.round(rateOf(id,mode)),
    champ:stat[id].champ/runs, final:stat[id].final/runs,
    semi:stat[id].semi/runs, adv:stat[id].adv/runs}))
    .sort((a,b)=>b.champ-a.champ || b.final-a.final || b.semi-a.semi);
  return {rows, runs};
}
/* 핸디 표 진단 — 부수 차 구간별로
   ① 실제 승률  ② 그 승률이 우연일 수 있는 범위  ③ 5:5로 만드는 적정 핸디 점수 */
function handiTable(){
  const rows={};
  for(const m of clubScope()){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    const d=Math.abs(A.bu-B.bu); if(!d) continue;
    const recv = A.bu>B.bu ? A.id : B.id;           // 부수가 높은 쪽 = 약한 쪽 = 핸디 받는 쪽
    const give = recv===A.id ? B.id : A.id;
    const r=rows[d]=rows[d]||{n:0,w:0,gap:0,pts:0,exp:0};
    r.n++; if(winnerOf(m)===recv) r.w++;
    if(m._expA!=null) r.exp += (recv===m.aId ? m._expA : 1-m._expA);
    r.gap += rateOf(give,'skill') - rateOf(recv,'skill');   // 핸디 빼고 순수 실력차
    r.pts += (m.handi && m.handi.pts) ? m.handi.pts : d*st().ptsPerBu;
  }
  const he=st().handiElo||1;
  return Object.entries(rows).map(([d,r])=>{
    const rate=r.w/r.n;
    const se=Math.sqrt(rate*(1-rate)/r.n);          // 표본이 작으면 넓어지는 오차
    const gap=r.gap/r.n;                            // 이 구간 평균 실력차 (점)
    const cur=r.pts/r.n;                            // 이 구간에서 실제로 준 평균 핸디 점수
    const A=Math.min(.95,Math.max(.05,rate));
    /* 이 구간만 놓고 봤을 때의 '핸디 후 남는 부수당 격차' */
    const own = -400*Math.log10(A/(1-A)) / (+d);
    return {d:+d, n:r.n, w:r.w, rate, own, expAvg: r.exp/r.n,
      lo:Math.max(0,rate-1.96*se), hi:Math.min(1,rate+1.96*se),
      gap, cur, fair: gap/he,                       // 5:5로 만드는 데 필요한 점수
      solid: r.n>=15 && (rate-1.96*se>0.5 || rate+1.96*se<0.5) };
  }).sort((a,b)=>a.d-b.d);
}
/* ── 부수별 분석 ────────────────────────────────────────── */
/* 1) 같은 부수끼리 붙은 경기만 추려 그 안의 순위를 낸다 */
function sameBuTable(bu){
  const ids=new Set(roster().filter(p=>p.bu===bu).map(p=>p.id));
  const st1={};
  ids.forEach(id=>st1[id]={id,g:0,w:0,l:0});
  for(const m of clubScope()){
    if(!ids.has(m.aId) || !ids.has(m.bId)) continue;
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    st1[w].g++; st1[w].w++; st1[l].g++; st1[l].l++;
  }
  return Object.values(st1).filter(x=>x.g>0)
    .sort((a,b)=>(b.w-b.l)-(a.w-a.l) || b.w-a.w || a.g-b.g);
}
/* 2) 부수별 평균 퍼포먼스가 달마다 어떻게 움직였나 */
function buTrend(){
  const ms=seasons();
  const out={};
  ms.forEach(ym=>{
    const t=monthStand(ym,'skill');
    const by={};
    roster().forEach(p=>{
      if((t.G[p.id]||0) < 3) return;
      (by[p.bu]=by[p.bu]||[]).push(t.R[p.id]);
    });
    Object.keys(by).forEach(bu=>{
      const arr=by[bu];
      (out[bu]=out[bu]||[]).push({ym, n:arr.length, avg:arr.reduce((a,x)=>a+x,0)/arr.length});
    });
  });
  return out;
}
/* 3) 부수마다 이달의 선수 */
function buMvp(ym){
  const t=monthStand(ym,'skill');
  const by={};
  roster().forEach(p=>{
    const g=t.G[p.id]||0; if(g<3) return;
    const w=t.W[p.id]||0, l=t.L[p.id]||0;
    (by[p.bu]=by[p.bu]||[]).push({p,g,w,l,r:t.R[p.id]});
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(bu=>{
    const list=by[bu].sort((x,y)=>(y.w-y.l)-(x.w-x.l) || (y.w/y.g)-(x.w/x.g) || y.g-x.g);
    return {bu, top:list[0], n:list.length};
  });
}
/* 4) 체감 부수가 달마다 어디로 가고 있나 → 언제쯤 한 부수를 넘어설까 */
function promoTrend(id){
  const p=P(id); if(!p) return null;
  const hist=(trk('skill').H[id]||[]).filter(x=>x.d);
  if(hist.length<6) return null;
  const ms=seasons().slice(-4);
  if(ms.length<2) return null;
  const pts=[];
  ms.forEach((ym,i)=>{
    const end=ym+'-31';
    let last=null;
    for(const x of hist){ if(x.d<=end) last=x; }
    if(last) pts.push({i, felt:buScale(last.r)});
  });
  if(pts.length<2) return null;
  const n=pts.length;
  const mx=pts.reduce((a,x)=>a+x.i,0)/n, my=pts.reduce((a,x)=>a+x.felt,0)/n;
  const den=pts.reduce((a,x)=>a+(x.i-mx)**2,0);
  if(!den) return null;
  const slope=pts.reduce((a,x)=>a+(x.i-mx)*(x.felt-my),0)/den;   // 달마다 체감 부수 변화(−면 강해짐)
  const cur=pts[n-1].felt;
  const target=p.bu-1;                                            // 한 부수 위
  if(slope>=-0.02) return {cur, slope, months:null};              // 좋아지는 추세가 아니다
  const months=Math.ceil((cur-target)/(-slope));
  return {cur, slope, months: (months>0&&months<=36)?months:null};
}
/* 부수 조합별 핸디 진단 — 같은 '차 1' 이라도 5↔6 과 9↔10 은 다르다 */
function handiPairs(){
  const rows={};
  for(const m of clubScope()){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    if(A.bu===B.bu) continue;
    const hi = A.bu<B.bu ? A : B;                 // 부수 숫자가 작은 쪽 = 고수
    const lo = A.bu<B.bu ? B : A;                 // 핸디 받는 쪽
    const k = hi.bu+'>'+lo.bu;
    const r = rows[k] = rows[k] || {hi:hi.bu, lo:lo.bu, d:lo.bu-hi.bu, n:0, w:0, pts:0};
    r.n++; if(winnerOf(m)===lo.id) r.w++;
    r.pts += (m.handi&&m.handi.pts) ? m.handi.pts : handiPtsIn(hi.bu, lo.bu, lgOf(m));
  }
  return Object.values(rows).map(r=>{
    const rate=r.w/r.n, A=Math.min(.95,Math.max(.05,rate));
    return {...r, rate, avgPts:r.pts/r.n,
      own: -400*Math.log10(A/(1-A)) / r.d,
      solid: r.n>=10 };
  }).sort((a,b)=> a.d-b.d || a.hi-b.hi);
}
/* 기록실 */
function hallOfFame(){
  const pair={}, ups=[], byId={};
  for(const m of (S._sorted||[])){
    const k=[m.aId,m.bId].sort().join('|');
    pair[k]=(pair[k]||0)+1;
    const w=winnerOf(m), e=expFor(m, w);
    if(e!=null && e<0.5) ups.push({m, e, w});
    [m.aId,m.bId].forEach(id=>{ const b=byId[id]=byId[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
  }
  const topPairs=Object.entries(pair).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([k,n])=>({a:k.split('|')[0], b:k.split('|')[1], n}));
  const topUps=ups.sort((a,b)=>a.e-b.e).slice(0,5);
  const arr=Object.entries(byId).map(([id,b])=>({id, ...b, days:b.days.size}));
  return { topPairs, topUps,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g).slice(0,5),
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days).slice(0,5),
    mostWins:  arr.slice().sort((a,b)=>b.w-a.w).slice(0,5) };
}
/* 출석 — 요일별 · 월별 */
function attendance(){
  const dow=[0,0,0,0,0,0,0], mon={}, dayPl={};
  for(const m of clubScope()){
    const [y,mo,dd]=m.date.split('-').map(Number);
    dow[new Date(y,mo-1,dd).getDay()]++;
    mon[m.date.slice(0,7)]=(mon[m.date.slice(0,7)]||0)+1;
    (dayPl[m.date]=dayPl[m.date]||new Set()).add(m.aId).add(m.bId);
  }
  const days=Object.keys(dayPl).sort();
  return {dow, mon:Object.entries(mon).sort(), days,
    avgPl: days.length? days.reduce((a,d)=>a+dayPl[d].size,0)/days.length : 0,
    dayPl};
}
/* 이달의 기록 */
function monthlyReport(ym){
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,String(ym).length)===ym);
  if(!ms.length) return null;
  const by={}, pair={}; let best=null;
  for(const m of ms){
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    [m.aId,m.bId].forEach(id=>{ const b=by[id]=by[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
    const k=[m.aId,m.bId].sort().join('|'); pair[k]=(pair[k]||0)+1;
    const e=expFor(m, w);
    if(e!=null && (!best || e<best.e)) best={m,e,w,l};
  }
  const arr=Object.entries(by).map(([id,b])=>({id,...b,days:b.days.size}));
  const rows=standings(ym,'skill').filter(r=>r.g>=(st().provisional||0));
  const pv=standings(ym,'skill',dayAgo(30)).filter(r=>r.g>=(st().provisional||0));
  const pvIdx={}; pv.forEach((r,i)=>pvIdx[r.p.id]=i+1);
  let rise=null;
  rows.forEach((r,i)=>{ const mv=pvIdx[r.p.id]?pvIdx[r.p.id]-(i+1):0;
    if(mv>0 && (!rise||mv>rise.mv)) rise={id:r.p.id, mv, rank:i+1}; });
  const tp=Object.entries(pair).sort((a,b)=>b[1]-a[1])[0];
  const MIN3=Math.max(3, Math.min(5, st().provisional||3));
  const mvp=arr.filter(x=>x.g>=MIN3).sort((a,b)=>
    (b.w-a.w) || ((b.w/b.g)-(a.w/a.g)) || (b.g-a.g))[0] || null;
  return { n:ms.length, days:new Set(ms.map(m=>m.date)).size, players:arr.length,
    mvp, minG:MIN3,
    champ: rows[0]||null,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g)[0],
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days)[0],
    bestWin:   arr.filter(x=>x.g>=3).sort((a,b)=>(b.w/b.g)-(a.w/a.g))[0],
    upset: best, rise,
    topPair: tp? {a:tp[0].split('|')[0], b:tp[0].split('|')[1], n:tp[1]} : null };
}
/* 기대 대비 성적 — 야구의 피타고리안 승률과 같은 발상.
   매 경기 기대 승률을 더한 값이 '실력대로면 이랬을 승수'다. */
function luckTable(ym){
  const by={};
  for(const m of (S._sorted||[])){
    if(ym && m.date.slice(0,7)!==ym) continue;
    const eA=expOf(m); if(eA==null) continue;
    const w=winnerOf(m);
    [[m.aId,eA],[m.bId,1-eA]].forEach(([id,e])=>{
      const b=by[id]=by[id]||{g:0,w:0,exp:0};
      b.g++; b.exp+=e; if(w===id) b.w++;
    });
  }
  return Object.entries(by).map(([id,b])=>({id, g:b.g, w:b.w, exp:b.exp,
      diff:b.w-b.exp, rate:(b.w-b.exp)/b.g}))
    .filter(x=>x.g>=5).sort((a,b)=>b.diff-a.diff);
}

/* 칭호 — 그 시즌의 성향을 한마디로. 한 사람당 최대 두 개만 붙인다. */
function playerTitles(period, mode){
  /* 시즌 키가 4자리(연 단위)일 수도 있다 — 대회형 리그는 해로 묶는다 */
  const inP = m => period==='all' ? true : m.date.slice(0,String(period).length)===period;
  const st1={};
  const push=(id)=> st1[id] = st1[id] ||
    {g:0,w:0, hiG:0,hiW:0, loG:0,loW:0, pmG:0,pmW:0, pnG:0,pnW:0,
     ups:0, upsN:0, upsExp:0, days:new Set(), day:{}, opps:new Set(),
     sameG:0, sameW:0, dayWL:{}, favG:0, favW:0};
  for(const m of (S._sorted||[])){
    if(!inP(m)) continue;
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    const w=winnerOf(m);
    for(const [me,op] of [[A,B],[B,A]]){
      push(me.id); const b=st1[me.id];
      b.g++; b.days.add(m.date); if(w===me.id) b.w++;
      if(op.bu < me.bu){ b.hiG++; if(w===me.id) b.hiW++; }        // 상위 부수 상대
      else if(op.bu > me.bu){ b.loG++; if(w===me.id) b.loW++; }   // 하위 부수 상대
      if(isPimple(op)){ b.pmG++; if(w===me.id) b.pmW++; }
      if(isPen(op)){    b.pnG++; if(w===me.id) b.pnW++; }
      if(op.bu===me.bu){ b.sameG++; if(w===me.id) b.sameW++; }
      b.opps.add(op.id);
      const dw=b.dayWL[m.date]=b.dayWL[m.date]||{w:0,l:0};
      if(w===me.id) dw.w++; else dw.l++;
      const e = expFor(m, me.id);
      if(e!=null && e<UPSET){                     // 불리하게 시작한 판
        b.upsN++; b.upsExp+=e;
        if(w===me.id) b.ups++;
      }
      if(e!=null && e>=1-UPSET){                  // 유리하게 시작한 판
        b.favG++; if(w===me.id) b.favW++;
      }
      const d = m.aId===me.id ? m._sA : m._sB;         // 그 경기로 움직인 점수
      if(d!=null) b.day[m.date] = (b.day[m.date]||0) + d;
    }
  }
  const ids=Object.keys(st1);
  if(!ids.length) return {};
  /* 기복 = 그날그날 레이팅이 얼마나 출렁였나. 날짜별 변동폭의 표준편차로 본다. */
  const swingRank={};
  /* 터줏대감 — 그 부수 안에서 승률 1위. 부수마다 한 명씩 나온다.
     같은 부수끼리 붙는 판이 원래 많지 않아 3경기를 기준으로 잡는다. */
  const sameBest={};
  {
    const byBu={};
    ids.forEach(id=>{ const p=P(id); if(!p) return;
      if(st1[id].sameG>=3) (byBu[p.bu]=byBu[p.bu]||[]).push(id); });
    Object.values(byBu).forEach(list=>{
      /* 자격자가 혼자여도 그 부수 1위는 1위다 */
      /* 이긴 판에서 진 판을 뺀 값이 가장 큰 사람. 같으면 승률로 가린다 */
      const net=x=>st1[x].sameW*2 - st1[x].sameG;
      const top=list.slice().sort((a,b)=>
        net(b)-net(a) || (st1[b].sameW/st1[b].sameG)-(st1[a].sameW/st1[a].sameG))[0];
      const b2=st1[top];
      if(b2 && b2.sameW*2 > b2.sameG) sameBest[top]=1;
    });
  }
  const maxOpps=Math.max(...ids.map(i=>st1[i].opps.size), 0);
  /* 전체 승률 1위 · 러버/그립/손별 1위 · 하루 전승한 날 */
  const bestOf=(pick, minG)=>{
    const cand=ids.filter(id=>{ const p=P(id); return p && pick(p) && st1[id].g>=(minG||8); });
    if(cand.length<3) return null;
    const top=cand.slice().sort((a,b)=>(st1[b].w/st1[b].g)-(st1[a].w/st1[a].g) || st1[b].w-st1[a].w)[0];
    return (st1[top].w/st1[top].g >= 0.6) ? top : null;
  };
  const kingId = bestOf(()=>true, 10);
  /* 퍼펙트 — 5경기 이상 친 날을 한 판도 안 지고 마친 적이 있는가 */
  const perfect={};
  ids.forEach(id=>{
    perfect[id]=Object.values(st1[id].dayWL).filter(x=>x.l===0 && x.w>=5).length;
  });
  /* 불사조 — 오래 쉬었다 돌아온 날 5할 이상 */
  const phoenix={};
  ids.forEach(id=>{
    const all=[...new Set((S._sorted||[]).filter(m=>m.aId===id||m.bId===id).map(m=>m.date))].sort();
    const mine=[...st1[id].days].sort();
    mine.forEach(d=>{
      const k=all.indexOf(d); if(k<1) return;
      if(daysBetween(all[k-1], d) < 30) return;
      const x=st1[id].dayWL[d];
      if(x && x.w+x.l>=3 && x.w*2>=x.w+x.l) phoenix[id]=1;
    });
  });
  /* 체력왕 — 많이 친 날에도 승률이 안 떨어지는 사람 */
  const stamina={};
  ids.forEach(id=>{
    const b=st1[id], days=Object.values(b.dayWL);
    const heavy=days.filter(x=>x.w+x.l>=6);
    if(heavy.length<2 || b.g<10) return;
    const hw=heavy.reduce((a,x)=>a+x.w,0), hg=heavy.reduce((a,x)=>a+x.w+x.l,0);
    const rest=days.filter(x=>x.w+x.l<6);
    const rw=rest.reduce((a,x)=>a+x.w,0), rg=rest.reduce((a,x)=>a+x.w+x.l,0);
    /* 적게 친 날이 없으면 전체 승률과 견준다 */
    const base = rg>=3 ? rw/rg : b.w/b.g;
    /* 많이 친 날 승률이 평소보다 8%p 넘게 안 떨어지고, 그 자체로도 5할은 될 것 */
    if(hw/hg >= base - 0.08 && hw*2 >= hg) stamina[id]={days:heavy.length, rate:hw/hg, base};
  });
  /* 이번 시즌 체감 부수가 가장 많이 좋아진 사람 */
  const riser=(()=>{
    let best=null;
    ids.forEach(id=>{
      const b=st1[id]; if(b.g<8) return;
      const v=Object.values(b.day);
      const gain=v.reduce((a,x)=>a+x,0);              // 그 시즌 순변동
      if(gain>=60 && (!best || gain>best.gain)) best={id, gain};
    });
    return best;
  })();
  const swings=ids.map(id=>{
    const b=st1[id], v=Object.values(b.day);
    if(v.length<4 || b.g<10) return null;
    const mean=v.reduce((a,x)=>a+x,0)/v.length;
    return {id, sd:Math.sqrt(v.reduce((a,x)=>a+(x-mean)**2,0)/v.length)};
  }).filter(Boolean).sort((a,b)=>a.sd-b.sd);
  swings.slice(0, Math.max(1, Math.round(swings.length/3))).forEach(x=>swingRank[x.id]='low');
  /* 그 기간에 클럽이 모인 날 전부 */
  const clubDays=new Set((S._sorted||[]).filter(inP).map(m=>m.date));
  const maxW=Math.max(...ids.map(i=>st1[i].w), 0);
  const out={};
  for(const id of ids){
    const b=st1[id], t=[];
    if(b.loG>=6 && b.loW/b.loG>=0.9)              t.push(['하위부 킬러','gold']);
    if(b.hiG>=5 && b.hiW/b.hiG>=0.5)              t.push(['고수 킬러','red']);
    if(b.pmG>=5 && b.pmW/b.pmG>=0.7)              t.push(['핌플 킬러','red']);
    if(b.pnG>=5 && b.pnW/b.pnG>=0.7)              t.push(['펜홀더 킬러','purple']);
    if(b.ups>=5)                                  t.push(['이변 제조기','warn']);
    /* 날마다 꾸준히 지는 것도 변동은 작다. 5할은 되어야 '기복 없음'이다 */
    if(swingRank[id]==='low' && b.w*2>=b.g)       t.push(['기복 없음','blue']);
    if(sameBest[id])                              t.push(['터줏대감','gold']);
    if(b.opps.size>=6 && b.opps.size===maxOpps)   t.push(['마당발','ok']);
    if(riser && riser.id===id)                    t.push(['상승폭 1위','red']);
    if(kingId===id)                               t.push(['승률왕','gold']);
    if(b.favG>=8 && b.favW/b.favG>=0.85)          t.push(['철벽','blue']);
    /* 강약약강 — 아랫 부수엔 강하고 윗 부수엔 유독 약하다 */
    if(b.loG>=6 && b.hiG>=5 && b.loW/b.loG>=0.80 && b.hiW/b.hiG<=0.25)
                                                  t.push(['강약약강','purple']);
    if(stamina[id])                               t.push(['체력왕','ok']);
    if(phoenix[id])                               t.push(['불사조','red']);
    (()=>{ const f=freshVsKnown(id);
      if(!f || f.fN<5 || f.kN<5) return;
      const d=(f.kRate??0)-(f.fRate??0);
      if(d>=0.15)      t.push(['적응형','purple']);
      else if(d<=-0.15) t.push(['초면 강자','warn']);
    })();
    if(perfect[id]>=1){
      const sx=sexOf(P(id));
      const nm=(sx==='m'?'Mr 퍼펙트':sx==='f'?'Ms 퍼펙트':'퍼펙트');
      t.push([perfect[id]>=2?`${nm} ×${perfect[id]}`:nm,'warn']);
    }
    if(clubDays.size>=3 && b.days.size===clubDays.size)
                                                  t.push(['개근','ok']);
    if(b.w>=5 && b.w===maxW)                      t.push(['다승왕','gold']);
    /* 귀한 칭호가 먼저 오도록 줄을 세운 뒤 두 개만 남긴다 */
    if(t.length) out[id]=t.sort((a,b)=>
      TITLE_RANK.indexOf(titleKey(a[0]))-TITLE_RANK.indexOf(titleKey(b[0]))).slice(0,4);
  }
  return out;
}
/* 초면 vs 구면 — 처음 만난 상대와, 이미 여러 번 붙어본 상대의 성적을 가른다.
   처음에 강하면 '기세로 누르는 형', 나중에 강하면 '적응하는 형'이다. */
function freshVsKnown(id){
  const byOpp={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const o = m.aId===id ? m.bId : m.aId;
    (byOpp[o]=byOpp[o]||[]).push(m);
  }
  let fW=0,fL=0,kW=0,kL=0, fE=0, kE=0;
  for(const o in byOpp){
    byOpp[o].forEach((m,i)=>{
      const won = winnerOf(m)===id;
      const e = expFor(m, id);
      if(i===0){ won?fW++:fL++; if(e!=null) fE+=e; }
      else     { won?kW++:kL++; if(e!=null) kE+=e; }
    });
  }
  const f=fW+fL, k=kW+kL;
  return { fW,fL,kW,kL, fN:f, kN:k,
    fRate: f?fW/f:null, kRate: k?kW/k:null,
    fEdge: f?fW-fE:0, kEdge: k?kW-kE:0,      // 기대 대비
    opps: Object.keys(byOpp).length };
}
/* 그 경기를 치를 당시의 예상 승률.
   레이팅은 계속 갱신되지만, 이미 지나간 경기의 '그때 예상'은 바뀌면 안 된다.
   저장할 때 박아둔 값을 쓰고, 없으면(옛 기록) 다시 계산한 값으로 대신한다. */
const expOf = m => (m && m.exp!=null) ? m.exp : (m ? m._expA : null);
const expFor = (m, id) => {
  const e = expOf(m); if(e==null) return null;
  return m.aId===id ? e : 1-e;
};
/* 지나간 날짜로 넣는 경기인가 — 그렇다면 지금 레이팅으로 예상을 박으면 안 된다 */
function isBackfill(date){
  const last=(S._sorted||[]).length ? S._sorted[S._sorted.length-1].date : null;
  return !!(last && date < last);
}
/* 지금 이 순간의 예상 승률 — 경기를 새로 만들 때 박아 넣는다 */
function expNow(aId, bId, handi){
  const a=P(aId), b=P(bId); if(!a||!b) return null;
  let ea=rateOf(aId,'skill'), eb=rateOf(bId,'skill');
  if(st().handiOn && handi && handi.pts>0){
    if(handi.toId===aId) ea += handi.pts*handiElo();
    if(handi.toId===bId) eb += handi.pts*handiElo();
  }
  return 1/(1+Math.pow(10,(eb-ea)/400));
}
/* 이름 고르는 칸 — 치면 아래로 후보가 뜨고, 눌러야 선택된다 */
function comboHTML(key, curId, opts){

function bindCombo(root, key, onPick, extra, opts){
  const R=root||document;
  const q=R.querySelector(`[data-cbq="${key}"]`);
  const box=R.querySelector(`[data-cblist="${key}"]`);
  if(!q||!box) return;
  const draw=()=>{
    const s2=q.value.trim();
    const hit=roster().filter(p=>matchName(p, s2)).slice(0,40);
    const ex=(extra||[]).filter(x=>!s2 || x.label.includes(s2));
    box.innerHTML = (hit.length||ex.length)
      ? hit.map(p=>`<button class="cbit" data-cbpick="${p.id}">${esc(p.name)}<i>${p.bu}부</i></button>`).join('')
        + ex.map(x=>`<button class="cbit alt" data-cbpick="${x.id}">${esc(x.label)}</button>`).join('')
      : `<div class="cbnone">맞는 사람이 없습니다</div>`;
    box.hidden=false;
    box.querySelectorAll('[data-cbpick]').forEach(b=>b.onmousedown=e=>{
      e.preventDefault();
      const id=b.dataset.cbpick, p=P(id);
      q.value = p ? p.name : b.textContent;
      box.hidden=true;
      onPick(id);
    });
  };
  q.onfocus=draw;
  q.oninput=draw;
  q.onblur=()=>setTimeout(()=>{ box.hidden=true; }, 120);
  const x=R.querySelector(`[data-cbclr="${key}"]`);
  if(x) x.onclick=()=>{
    q.value=''; q.focus(); draw();          // 비우고 바로 다시 찾을 수 있게
    if(opts && opts.clearable) onPick('');  // 건너뛰기가 가능한 칸만 선택도 푼다
  };
}
/* 이름 검색 — 초성만 쳐도 찾히게 */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function initials(str){
  return String(str||'').split('').map(ch=>{
    const c=ch.charCodeAt(0)-0xAC00;
    return (c>=0 && c<=11171) ? CHO[Math.floor(c/588)] : ch;
  }).join('');
}
function matchName(p, q){
  const s2=String(q||'').replace(/\s/g,'').toLowerCase();
  if(!s2) return true;
  const cand=[p.name, p.bandName, ...(p.aliases||[])].filter(Boolean);
  return cand.some(n=>{
    const x=String(n).replace(/\s/g,'').toLowerCase();
    return x.includes(s2) || initials(x).includes(s2);
  });
}
/* 요일별 성적 — 나는 어느 요일에 잘 치나 */
function dowStats(id, ym){
  const D=[0,0,0,0,0,0,0].map(()=>({g:0,w:0,exp:0,days:new Set()}));
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    if(ym && m.date.slice(0,7)!==ym) continue;
    const [y,mo,dd]=m.date.split('-').map(Number);
    const k=new Date(y,mo-1,dd).getDay();
    const b=D[k];
    b.g++; b.days.add(m.date);
    if(winnerOf(m)===id) b.w++;
    const e = expFor(m, id);
    if(e!=null) b.exp+=e;
  }
  return D.map((b,i)=>({dow:i, g:b.g, w:b.w, l:b.g-b.w, days:b.days.size,
    rate: b.g?b.w/b.g:null, diff: b.g?b.w-b.exp:0}));
}
/* ── 업적 — 단계가 오르는 통산 기록 ──
   50경기를 깨면 다음 목표가 200경기로 바뀐다. 단계마다 등급 이름이 붙는다. */
const TIER_NAME = ['브론즈','실버','골드','플래티넘','다이아'];
function achieveTracks(id){
  const ms=(S._sorted||[]).filter(m=>m.aId===id||m.bId===id);
  const me=P(id)||{};
  let w=0, ups=0, maxGap=0, gapWho=null;
  const opps=new Set(), byDay={};
  for(const m of ms){
    const o=P(m.aId===id?m.bId:m.aId); if(!o) continue;
    opps.add(o.id);
    (byDay[m.date]=byDay[m.date]||[]).push(m);
    const won=winnerOf(m)===id;
    if(won){
      w++;
      const gap=me.bu - o.bu;
      if(gap>maxGap){ maxGap=gap; gapWho=o.id; }
    }
    const e=expFor(m, id);
    if(won && e!=null && e<UPSET) ups++;
  }
  const days=Object.keys(byDay);
  const dayMax=days.reduce((a,d)=>Math.max(a, byDay[d].length), 0);
  const perfect=days.filter(d=>byDay[d].length>=5 && byDay[d].every(m=>winnerOf(m)===id)).length;

  const T=(key,name,now,tiers,unit,extra)=>{
    const lv=tiers.filter(t=>now>=t).length;          // 깬 단계 수
    const done=lv>=tiers.length;
    const next=done?null:tiers[lv];
    const from=lv?tiers[lv-1]:0;
    return {key,name,now,tiers,unit,extra,lv,done,next,
      pct: done?100:Math.round((now-from)/(next-from)*100),
      tier: lv?TIER_NAME[Math.min(lv-1,TIER_NAME.length-1)]:null};
  };
  return [
    T('game','경기 수', ms.length, [10,50,200,500,1000], '경기'),
    T('win','승수', w, [5,25,100,300,700], '승'),
    T('day','출전 일수', days.length, [5,20,50,120,250], '일'),
    T('opp','만나본 사람', opps.size, [5,15,30,50,80], '명'),
    T('ups','이변', ups, [1,5,20,50,100], '회'),
    T('perf','퍼펙트 데이', perfect, [1,3,10,25,50], '회',
      perfect?`5경기 이상 친 날 전승 ${perfect}회`:null),
    T('dmax','하루 최다', dayMax, [5,8,10,14,18], '경기',
      dayMax?`최다 ${dayMax}경기`:null),
    T('gap','윗 부수 격파', maxGap, [1,2,3,4,5], '부수 위',
      maxGap&&gapWho?`${nameOf(gapWho)} (${(P(gapWho)||{}).bu}부)`:null)
  ];
}
/* 명예의 전당 — 마감된 시즌의 1~3위 */
function hallOfFame2(mode){

/* 대진표 — 그 회차에 누가 누구와 몇 대 몇이었나 */
function crossTable(lg, rd, only){
  let ms=(S.matches||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd);
  if(only) ms=ms.filter(m=>only.includes(m.aId) && only.includes(m.bId));
  /* 경기가 들어온 순서를 그대로 쓴다 — 입력할 때의 명단 순서가 유지된다 */
  const ids=only ? only.filter(id=>P(id))
                 : [...new Set(ms.flatMap(m=>[m.aId,m.bId]))].filter(id=>P(id));
  const cell={}, rec={};
  ids.forEach(a=>{ rec[a]={w:0,l:0,g:0,sw:0,sl:0}; cell[a]={}; ids.forEach(b=>cell[a][b]=null); });
  ms.forEach(m=>{
    const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
    if(!rec[w]||!rec[l]) return;
    rec[w].w++; rec[w].g++; rec[l].l++; rec[l].g++;
    /* 세트 스코어가 있으면 함께 센다. 없으면 이긴 쪽 1:0 으로 본다 */
    const ws=(m.aId===w?m.aSets:m.bSets), ls=(m.aId===w?m.bSets:m.aSets);
    const a1=(ws==null?1:+ws), b1=(ls==null?0:+ls);
    rec[w].sw+=a1; rec[w].sl+=b1;
    rec[l].sw+=b1; rec[l].sl+=a1;
    (cell[w][l]=cell[w][l]||{w:0,l:0}).w++;
    (cell[l][w]=cell[l][w]||{w:0,l:0}).l++;
  });
  /* 순위: 승수 → 승자승 → 상대간 승패 → (세트수) → 게임수 → 부수 상위자.
     세트수는 지금 기록에 없어 건너뛴다. 게임수는 적게 치고 같은 승수면 앞선다. */
  const beat=(a,b)=>{ const x=cell[a][b]; return x ? (x.w>x.l ? 1 : x.w<x.l ? -1 : 0) : 0; };
  const byWin={};
  ids.forEach(id=>(byWin[rec[id].w]=byWin[rec[id].w]||[]).push(id));
  /* 같은 승수 무리 안에서만 다음 기준으로 다시 가린다 —
     세트수(딴 세트 − 준 세트) → 게임수 → 부수 상위자 */
  const tail=(a,b)=> ((rec[b].sw-rec[b].sl)-(rec[a].sw-rec[a].sl))   // 세트 득실
                  || (rec[a].g-rec[b].g)                             // 게임수 — 적게 치고 같은 승수면 위
                  || (P(a).bu-P(b).bu);                              // 부수 상위자
  const order=Object.keys(byWin).map(Number).sort((a,b)=>b-a).flatMap(w=>{
    const g=byWin[w];
    if(g.length===1) return g;
    if(g.length===2){                            // 둘뿐 — 맞대결로 가린다
      const [x,y]=g, h=beat(x,y);
      if(h>0) return [x,y];
      if(h<0) return [y,x];
      return g.slice().sort(tail);
    }
    /* 셋 이상 — 그 무리 안 맞대결 승수(승자승), 다음은 그 안 승패 차 */
    const sw={}, sd={};
    g.forEach(id=>{
      sw[id]=g.reduce((n,o)=>n+(beat(id,o)>0?1:0),0);
      sd[id]=g.reduce((n,o)=>n+beat(id,o),0);
    });
    const same = g.every(id=>sw[id]===sw[g[0]]) && g.every(id=>sd[id]===sd[g[0]]);
    if(same) return g.slice().sort(tail);        // 완전히 물고 물리면 다음 기준으로
    return g.slice().sort((a,b)=> (sw[b]-sw[a]) || (sd[b]-sd[a]) || tail(a,b));
  });
  const done=ms.length;
  const total=ids.length*(ids.length-1)/2;
  return {ids, order, cell, rec, done, total, players:ids.length};
}
/* 회차별 최종 순위 — 조별+순위전이면 그 결과대로, 아니면 승패 차 순 */
function roundStanding(lg, rd){
  const gs=roundGroups(lg, rd);
  if(gs.ko.length && gs.groups.length>1){
    const tabs=gs.groups.map(ids=>crossTable(lg,rd,ids));
    const seat={}; tabs.forEach(t=>t.order.forEach((id,i)=>seat[id]=i));
    const sorted=gs.ko.slice().sort((m1,m2)=>
      Math.min(seat[m1.aId]??99, seat[m1.bId]??99) - Math.min(seat[m2.aId]??99, seat[m2.bId]??99));
    const out=[];
    sorted.forEach(m=>{ const w=winnerOf(m); out.push(w); out.push(w===m.aId?m.bId:m.aId); });
    return out;
  }
  return crossTable(lg, rd).order;
}
/* 리그 통산 — 회차마다 몇 위였나, 그때 몇 부로 뛰었나, 1위를 이겼나 */
function lgRecord(lg){
  const rds=roundsOf(lg);
  const by={};
  rds.forEach(rd=>{
    const order=roundStanding(lg, rd);
    const champ=order[0];
    /* 그 회차 1위를 이긴 사람 */
    const beatChamp=new Set();
    if(champ) (S.matches||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd)
      .forEach(m=>{ if(winnerOf(m)!==champ && (m.aId===champ||m.bId===champ))
        beatChamp.add(winnerOf(m)); });
    order.forEach((id,i)=>{
      const b=by[id]=by[id]||{id, n:0, sum:0, best:99, podium:[0,0,0],
                              topBu:99, beat:0, hist:[]};
      b.n++; b.sum+=i+1; b.best=Math.min(b.best,i+1);
      if(i<3) b.podium[i]++;
      /* 그 회차에 뛴 부수 — 숫자가 작을수록 윗 부수 */
      const bu=rdBu(lg, rd, id) || (P(id)||{}).bu || 99;
      b.topBu=Math.min(b.topBu, bu);
      if(beatChamp.has(id)) b.beat++;
      b.hist.push({rd, r:i+1, bu});
    });
  });
  const list=Object.values(by).map(b=>({...b, avg:b.n?b.sum/b.n:0,
    podiumN:b.podium[0]+b.podium[1]+b.podium[2]}));
  /* 금·은·동 순으로, 같으면 평균 순위가 좋은 쪽 */
  list.sort((a,b)=>b.podium[0]-a.podium[0] || b.podium[1]-a.podium[1] || b.podium[2]-a.podium[2]
    || a.avg-b.avg || b.n-a.n);
  return {list, rounds:rds.length};
}
/* 그 회차를 조로 나눈다 — 서로 붙은 사람끼리 한 덩어리 */
function roundGroups(lg, rd){
  /* 리그가 전체 풀리그로 설정돼 있으면 조를 나누지 않는다.
     경기 기록만 보고 추론하면, 서로 못 붙은 사람들이 조처럼 보일 수 있다. */
  if(lgFmt(lg)==='league') return {groups:[], ko:[]};
  const ms=(S.matches||[]).filter(m=>!m.void && lgOf(m)===lg && rdOf(m)===rd);
  const ids=[...new Set(ms.flatMap(m=>[m.aId,m.bId]))].filter(id=>P(id));
  if(ids.length<6) return {groups:[], ko:[]};
  /* 상대 수가 많은 사람 기준으로 '조'를 찾는다.
     조별리그는 같은 조 안에서 서로 다 붙고, 순위 결정전은 딱 한 명씩만 붙는다. */
  const opp={}; ids.forEach(id=>opp[id]=new Set());
  ms.forEach(m=>{ opp[m.aId].add(m.bId); opp[m.bId].add(m.aId); });
  /* 서로 전부 붙은 덩어리 = 조 */
  const seen=new Set(), groups=[];
  ids.forEach(id=>{
    if(seen.has(id)) return;
    const cand=[id, ...opp[id]].filter(x=>!seen.has(x));
    /* 후보 중에서 서로 다 붙은 최대 묶음을 고른다 */
    const pick=[id];
    cand.filter(x=>x!==id).forEach(x=>{
      if(pick.every(y=>y===x || opp[x].has(y))) pick.push(x);
    });
    if(pick.length>=3){ pick.forEach(x=>seen.add(x)); groups.push(pick); }
  });
  if(groups.length<2) return {groups:[], ko:[]};
  const gOf={}; groups.forEach((g,i)=>g.forEach(id=>gOf[id]=i));
  const ko=ms.filter(m=>gOf[m.aId]!=null && gOf[m.bId]!=null && gOf[m.aId]!==gOf[m.bId]);
  return {groups, ko};
}
/* 그 리그에 기록이 있는 회차들 */
function roundsOf(lg){
  return [...new Set((S.matches||[]).filter(m=>!m.void && lgOf(m)===lg).map(rdOf))].sort().reverse();
}
/* 만난 상대 강도 · 같은 부수 평균이 같은 대진을 뛰었다면
   faceA 는 핸디까지 반영한 '내 기준 상대 강도'라 그대로 쓴다. */
function scheduleStats(id, ym){
  const me=P(id); if(!me) return null;
  const ms=(S._sorted||[]).filter(m=>(m.aId===id||m.bId===id) && (!ym || m.date.slice(0,String(ym).length)===ym));
  if(!ms.length) return null;
  /* 같은 부수 사람들의 통산 레이팅 평균 — 나를 뺀 값이라야 비교가 된다 */
  const peers=roster().filter(p=>p.bu===me.bu && p.id!==id && (S.G[p.id]||0)>=5);
  const peerR = peers.length
    ? peers.reduce((a,p)=>a+rateOf(p.id,'skill'),0)/peers.length
    : baseFor(me.bu);
  let faceSum=0, fn=0, w=0, expMe=0, expPeer=0;
  for(const m of ms){
    const face = m.aId===id ? m._faceA : m._faceB;
    if(face==null) continue;
    fn++; faceSum+=face;
    if(winnerOf(m)===id) w++;
    const mine = m.aId===id ? m._expA : (m._expA==null?null:1-m._expA);
    if(mine!=null) expMe+=mine;
    /* 같은 조건에서 부수 평균인 사람이 뛰었다면 */
    expPeer += 1/(1+Math.pow(10,(face-peerR)/400));
  }
  if(!fn) return null;
  /* 기준선은 클럽 전체 평균. 내 레이팅과 견주면 이미 일정이 반영돼 있어 뒤집혀 보인다. */
  const all=roster().filter(p=>(S.G[p.id]||0)>=5);
  const clubR = all.length ? all.reduce((a,p)=>a+rateOf(p.id,'skill'),0)/all.length : 1500;
  return {g:fn, w, l:fn-w,
    face: faceSum/fn,                 // 만난 상대 평균 강도 (핸디 반영)
    myR: rateOf(id,'skill'),
    clubR,                            // 클럽 평균 — 일정 강도의 기준선
    peerR, peers: peers.length,
    expMe, expPeer,
    vsPeer: w-expPeer,                // 같은 부수 평균 대비 몇 승 더/덜
    vsExp: expMe==null?null:w-expMe}; // 내 실력 대비
}
/* 상대별로 점수를 얼마나 주고받았나 */
function eloByOpp(id){
  const by={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const o = m.aId===id ? m.bId : m.aId;
    const d = m.aId===id ? m._sA : m._sB;
    if(d==null || !P(o)) continue;
    const b=by[o]=by[o]||{oid:o, n:0, w:0, l:0, gain:0, lose:0};
    b.n++;
    if(winnerOf(m)===id){ b.w++; b.gain+=d; } else { b.l++; b.lose+=-d; }
  }
  return Object.values(by).map(b=>({...b, net:b.gain-b.lose}))
    .sort((a,b)=>b.net-a.net);
}
/* 아직 안 붙어본 상대 */
function unplayed(id){
  const met=new Set();
  for(const m of (S._sorted||[])){
    if(m.aId===id) met.add(m.bId);
    else if(m.bId===id) met.add(m.aId);
  }
  return roster().filter(p=>p.id!==id && (S.G[p.id]||0)>0 && !met.has(p.id))
    .sort((a,b)=>rateOf(b.id,'skill')-rateOf(a.id,'skill'));
