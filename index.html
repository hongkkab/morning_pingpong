<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --bg:#0d1114; --bg2:#121a1e; --surf:#182227; --surf2:#1e2a30;
  --line:#26343c; --line2:#31434c;
  --txt:#e7eef1; --mut:#93a6b0; --dim:#637984;
  --blue:#2f92da; --blue-d:#1b5f92; --red:#e04b3f; --red-d:#8f2c24;
  --ball:#f3f0e6; --ok:#3fbf8f; --warn:#e0a53f;

  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 13px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px;letter-spacing:.02em}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{background:var(--blue);border:none;color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;width:100%}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.danger{background:transparent;border:1px solid var(--red-d);color:var(--red)}
.btn.sm{padding:9px 13px;font-size:13px;width:auto;border-radius:8px;min-height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.muted{color:var(--mut)}.dim{color:var(--dim)}.tiny{font-size:12px}
h2{font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:20px;margin:20px 0 10px}
.num{font-family:var(--display);font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(13,17,20,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;height:54px}
.logo{font-family:var(--body);font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo b{color:var(--blue);font-weight:700}
.logo i{color:var(--red);font-style:normal;font-family:var(--display);margin-left:1px}
.net{height:1px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.chip{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--dim)}
.dot.sync{background:var(--warn);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,17,20,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:none;padding:9px 2px 11px;color:var(--dim);font-size:11px;text-align:center;min-height:56px}
.tab .ic{display:block;font-size:19px;line-height:1.35}
.tab.on{color:var(--blue)}
.tab.on .ic{filter:drop-shadow(0 0 6px rgba(47,146,218,.5))}


/* rank rows */

.rk.me{border-color:var(--blue-d);background:linear-gradient(90deg,rgba(47,146,218,.10),var(--surf) 60%)}
.pos{font-family:var(--display);font-size:20px;width:30px;flex:none;text-align:center;color:var(--dim);line-height:1.05}

.pos.p1{color:var(--ball)}.pos.p2{color:#c3ccd2}.pos.p3{color:#b58b5a}
.who{flex:1;min-width:0}

.rt{text-align:right;flex:none}

.up{color:var(--ok)}.down{color:var(--red)}
.badge{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--mut);margin-left:5px;vertical-align:1px;white-space:nowrap}
.badge.b{border-color:var(--blue-d);color:var(--blue)}
.badge.g{border-color:#2c6b55;color:var(--ok)}
.badge.w{border-color:#6d5522;color:var(--warn)}
.badge.r{border-color:var(--red-d);color:var(--red)}
.form span{display:inline-block;width:17px;height:17px;border-radius:5px;font-size:10.5px;line-height:17px;text-align:center;margin-right:3px;font-weight:700}
.form .w{background:rgba(63,191,143,.16);color:var(--ok)}
.form .l{background:rgba(224,75,63,.16);color:var(--red)}
.form .d{background:rgba(147,166,176,.14);color:var(--mut)}

/* match list */
.mt{border:1px solid var(--line);border-radius:10px;background:var(--surf);margin-bottom:6px;overflow:hidden}
.mt.mine{border-left:4px solid var(--blue)}
.mt.mine.mw{border-left-color:var(--ok);background:linear-gradient(90deg,rgba(63,191,143,.10),transparent 45%)}
.mt.mine.ml{border-left-color:var(--red);background:linear-gradient(90deg,rgba(224,75,63,.09),transparent 45%)}
.side .pn.me{color:var(--ball);font-weight:700}
.side .pn.dim.me{color:var(--txt);font-weight:600}
.side .pn .mem{font-style:normal;font-size:10px;font-weight:700;background:var(--blue);color:#fff;

.mrow{display:block;width:100%;background:none;border:none;text-align:left;padding:9px 11px}
.side{display:flex;align-items:center;gap:8px;min-width:0;line-height:1.7}
.side .rs{font-size:10.5px;font-weight:700;width:19px;height:19px;line-height:19px;text-align:center;border-radius:5px;flex:none}
.side .rs.w{background:rgba(63,191,143,.18);color:var(--ok)}
.side .rs.l{background:rgba(224,75,63,.15);color:#c9756c}
.side .pn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.side .pn.dim{font-weight:400;color:var(--mut)}
.side .pn em{font-style:normal;font-weight:400;font-size:12px;color:var(--dim);margin-left:4px}
.side .dl{font-family:var(--display);font-size:14px;flex:none;letter-spacing:.02em}
.dayhd{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.splitrow{display:grid;grid-template-columns:1fr 60px 62px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.splitrow:last-of-type{border-bottom:none}
.splitrow .sl{font-size:14px;font-weight:600;line-height:1.25}
.splitrow .sl small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}
.splitrow .sr{font-family:var(--display);font-size:17px;text-align:right}
.splitrow .sp{font-size:13px;font-weight:600;text-align:right}
.h2hcard{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:14px}
.h2hnum{text-align:center;font-family:var(--display);font-size:32px;letter-spacing:.03em}
.h2hnum b{color:var(--ok);font-weight:400}
.h2hnum b.l{color:var(--red)}
.h2hnum span{color:var(--dim);margin:0 8px;font-size:22px}
.h2hbar{height:7px;border-radius:4px;background:var(--red-d);overflow:hidden;margin-top:10px}
.h2hbar i{display:block;height:100%;background:var(--ok)}
.pendbar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-top:12px;
  background:linear-gradient(90deg,rgba(224,165,63,.16),rgba(224,165,63,.04));
  border:1px solid #6d5522;border-radius:12px;padding:11px 13px}
.pendbar .pd{flex:none;width:26px;height:26px;border-radius:50%;background:var(--warn);color:#20160a;
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pendbar .pt{flex:1;min-width:0}
.pendbar .pt b{display:block;font-size:14px}

.pendbar .pg{color:var(--dim);font-size:20px;flex:none}
.tab .ic{position:relative}
.tbadge{position:absolute;top:-3px;left:calc(50% + 5px);background:var(--red);color:#fff;font-style:normal;

.pcard{display:grid;grid-template-columns:52px 1fr;gap:10px 11px;align-items:center;

.pcard .pi b{font-size:15px}
.pcard .pi small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.pcard .pb{grid-column:1 / -1;display:flex;gap:7px}
.pcard .pb .btn{flex:1}
.hls{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;padding-bottom:2px}
.hl{flex:1 0 auto;min-width:122px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.hl .k{font-size:10px;letter-spacing:.12em;color:var(--blue);margin-bottom:5px}
.hl .v{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .s{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhd b{font-size:14px;font-weight:700}
.dayhd span{font-size:11.5px;color:var(--dim)}
.mmeta .peak{color:#d8b45a}
.mmeta{display:flex;flex-wrap:wrap;gap:5px 9px;font-size:11px;color:var(--dim);margin-top:4px;align-items:center}
.mmeta b{color:var(--mut);font-weight:600}
.mmeta .hot{color:var(--warn)}
.mmeta .ups{color:var(--red);font-weight:600}
.macts{padding:2px 11px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.macts .info{font-size:11px;color:var(--dim);width:100%;margin-bottom:5px}
/* 기대 대비 성과 — 가운데 기준선에서 좌우로 뻗는 막대 */
.dbar{display:grid;grid-template-columns:82px 1fr 44px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dbar:last-child{border-bottom:none}
.dbar .lb{font-size:14px;font-weight:600;line-height:1.2}
.dbar .lb small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:3px}
.dbar .track{position:relative;height:24px}
.dbar .track::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.dbar .fill{position:absolute;top:5px;height:14px;border-radius:4px;min-width:2px}
.dbar .fill.pos{left:50%;background:linear-gradient(90deg,#2c6b55,var(--ok))}
.dbar .fill.neg{right:50%;background:linear-gradient(270deg,var(--red-d),var(--red))}
.dbar .val{text-align:right;font-family:var(--display);font-size:17px}
.dbar.thin{opacity:.4}
.verdict{background:linear-gradient(135deg,rgba(47,146,218,.16),rgba(47,146,218,0) 65%);
  border:1px solid var(--blue-d);border-radius:14px;padding:18px 16px;margin-bottom:12px}
.verdict.warn{background:linear-gradient(135deg,rgba(224,75,63,.16),rgba(224,75,63,0) 65%);border-color:var(--red-d)}
.verdict .eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--blue);margin-bottom:6px}
.verdict.warn .eyebrow{color:var(--red)}
.verdict .big{font-family:var(--display);font-size:27px;line-height:1.1;letter-spacing:.01em}
.verdict .sub{font-size:12.5px;color:var(--mut);margin-top:7px}
.secttl{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:0 2px 8px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg2)}
.stepper button{background:var(--surf2);border:none;width:40px;height:42px;font-size:18px;color:var(--mut)}
.stepper .v{flex:1;text-align:center;font-family:var(--display);font-size:20px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;padding:8px 4px;border-radius:7px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-size:11px;font-weight:500;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* modal + toast */
.cal{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;margin-bottom:12px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal .hd b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.05em}
.cal .nav{background:var(--surf2);border:1px solid var(--line);border-radius:8px;width:34px;height:32px;color:var(--mut);padding:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:10.5px;color:var(--dim);padding:2px 0 5px}
.dow.sun{color:#c9756c}
.day{min-height:40px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--dim);
     font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px}
.day.has{background:var(--surf2);color:var(--txt)}

.day.blank{visibility:hidden}
.day .pips{display:flex;gap:2px;height:5px;align-items:center}
.day .pip{width:4px;height:4px;border-radius:50%;background:var(--dim)}
.day .pip.mine{background:var(--blue)}
.day .more{font-size:9px;color:var(--dim);line-height:1}
.daterow{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px}
.daterow button{background:var(--surf2);border:1px solid var(--line);border-radius:8px;width:44px;height:42px;color:var(--txt);font-size:19px;padding:0;flex:none}
.daterow button[disabled]{opacity:.28}
.daterow .dlab{flex:1;text-align:center;font-size:15px;font-weight:600;line-height:1.25;
  background:none;border:none;color:var(--txt);padding:10px 4px;width:auto;height:auto}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
.pk{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--bg2);min-width:0}
.pk .nm{flex:1;min-width:0;background:none;border:none;padding:10px 8px 10px 11px;color:var(--mut);
  font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pk .nm small{color:var(--dim);font-size:10.5px;margin-left:4px}
.pk.w{border-color:#2c6b55;background:rgba(63,191,143,.13)}
.pk.w .nm{color:#8fe0c2;font-weight:600}
.pk.l{border-color:var(--red-d);background:rgba(224,75,63,.13)}
.pk.l .nm{color:#f0968e;font-weight:600}
.pk .ct{background:rgba(255,255,255,.05);border-left:1px solid var(--line);display:flex;align-items:center;
  padding:0 9px;font-size:12px;color:var(--txt);min-width:32px;font-weight:600;flex:none;justify-content:center}
.tally{display:flex;gap:14px;font-size:12px;color:var(--dim);margin:10px 2px 0}
.tally b{font-family:var(--display);font-size:16px;font-weight:400;margin-right:3px}
.mask{position:fixed;inset:0;background:rgba(5,8,10,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 16px 26px}
@media(min-width:620px){.mask{align-items:center;padding:20px}.sheet{border-radius:16px}}

  box-shadow:0 8px 24px rgba(0,0,0,.5)}

@keyframes sp{to{transform:rotate(360deg)}}

.toast.err{border-color:var(--red-d)}
.empty{text-align:center;color:var(--dim);padding:34px 16px;font-size:13.5px;border:1px dashed var(--line2);border-radius:var(--r)}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}

<script>
/* ─────────────────────────── 저장소 계층 ───────────────────────────
   같은 키 인터페이스 뒤에 두 가지 저장소를 둔다.
   · Firebase 설정이 채워져 있으면 → 실시간 공유 DB (어디서 보든 같은 결과)
   · 아니면 → 이 기기 전용 임시 저장                                    */
const CFG  = window.TT_CONFIG || {};
const CLUB = String(CFG.clubId || 'morning').replace(/[.#$\[\]\/]/g,'-');
const KEY = {
  players:'tt:players', meta:'tt:meta', audit:'tt:audit',
  shard: m => 'tt:matches:'+m, session:'tt:session'
};
const MPRE = 'tt:matches:';
const mem = new Map();
const hasStore = typeof window!=='undefined' && !!window.storage;
let FB = null;                                   // 연결 성공 시에만 채워진다
const online = ()=> !!FB;
const clean  = v => JSON.parse(JSON.stringify(v===undefined?null:v));
const CLIENT = Math.random().toString(36).slice(2,10);   // 내 변경인지 구분하는 값
const asList = v => Array.isArray(v) ? v : (v && typeof v==='object' ? Object.values(v) : v);

const FBM='matches';                 // Firebase 에서는 경기를 개별 레코드로 저장한다
function fbPath(k){
  if(k===KEY.players) return 'players';
  if(k===KEY.meta)    return 'meta';
  if(k===KEY.audit)   return 'audit';
  if(k.startsWith(MPRE)) return FBM;
  return 'misc/'+k.replace(/[.#$\[\]\/:]/g,'_');
}

/* 한쪽이 막힌 망에서도 붙도록 두 경로를 순서대로 시도한다 */
const SDK_SOURCES = [
  { app:'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js',
    db :'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js',
    au :'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js' },
  { app:'https://esm.sh/firebase@10.12.5/app',
    db :'https://esm.sh/firebase@10.12.5/database',
    au :'https://esm.sh/firebase@10.12.5/auth' }
];
async function loadSDK(){
  let last=null;
  for(const src of SDK_SOURCES){
    try{ return await Promise.all([import(src.app), import(src.db), import(src.au)]); }
    catch(e){ last=e; }
  }
  throw last;
}
async function initFirebase(){
  const c = CFG.firebase;
  if(!c || !c.databaseURL) return null;
  try{
    const [A,D,U] = await loadSDK();
    const app = A.initializeApp(c);
    try{ await U.signInAnonymously(U.getAuth(app)); }catch(e){ /* 익명 로그인 미사용이면 그대로 진행 */ }
    const db = D.getDatabase(app), base = 'clubs/'+CLUB;
    return {
      async get(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? snap.val() : null; },
      async set(pth,v){ await D.set(D.ref(db, base+'/'+pth), clean(v)); return true; },
      async patch(pth,obj){ await D.update(D.ref(db, base+'/'+pth), clean(obj)); return true; },
      async del(pth){ await D.remove(D.ref(db, base+'/'+pth)); return true; },
      async keys(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? Object.keys(snap.val()) : []; },
      watch(cb){ D.onValue(D.ref(db, base+'/sig'), snap=>cb(snap.val())); }
    };
  }catch(e){ console.warn('Firebase 연결 실패:', e); S.fbError=String(e&&e.message||e); return null; }
}
const fbConfigured = ()=> !!(CFG.firebase && CFG.firebase.databaseURL);
/* 예전 버전은 경기를 월별 묶음(shards)으로 저장했다. 개별 레코드 방식으로 한 번 옮긴다.
   원본은 지우지 않고 그대로 둔다. */
async function migrateShards(){
  if(!FB) return;
  try{
    const flat = await FB.get(FBM);
    if(flat && Object.keys(flat).length) return;          // 이미 옮겨졌다
    const sh = await FB.get('shards');
    if(!sh) return;
    const obj={};
    Object.values(sh).forEach(list=>{
      const arr = Array.isArray(list) ? list : Object.values(list||{});
      arr.forEach(m=>{ if(m && m.id) obj[m.id]=m; });
    });
    const n=Object.keys(obj).length;
    if(n){ await FB.patch(FBM, obj); console.info('기존 경기 '+n+'건을 새 저장 방식으로 옮겼습니다.'); }
  }catch(e){ console.warn('기존 데이터 이전 실패:', e); }
}

/* 세션(로그인 상태)은 기기별로만 남는다 */
function localGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ const v=mem.get('p:'+k); return v?JSON.parse(v):null; } }
function localSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem.set('p:'+k,JSON.stringify(v)); } return true; }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){ mem.delete('p:'+k); } return true; }

async function sGet(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localGet(k);
    try{ const r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
  }
  if(FB){ try{ const v=await FB.get(fbPath(k));
                return (k===KEY.players || k.startsWith(MPRE) || k===KEY.audit) ? asList(v) : v; }
          catch(e){ return null; } }
  if(!hasStore){ const v=mem.get('s:'+k); return v?JSON.parse(v):null; }
  try{ const r=await window.storage.get(k,true); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
}
async function sSet(k, val, shared=true){
  if(!shared){
    if(FB || !hasStore) return localSet(k,val);
    return !!(await window.storage.set(k, JSON.stringify(val), false));
  }
  if(FB){ try{ await FB.set(fbPath(k), val); return true; }
          catch(e){ S.lastError = e && (e.message||String(e)); return false; } }
  const str=JSON.stringify(val);
  if(!hasStore){ mem.set('s:'+k, str); return true; }
  return !!(await window.storage.set(k, str, true));
}
async function sDel(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localDel(k);
    try{ await window.storage.delete(k,false); return true; }catch(e){ return false; }
  }
  if(FB){ try{ await FB.del(fbPath(k)); return true; }catch(e){ return false; } }
  if(!hasStore){ mem.delete('s:'+k); return true; }
  try{ await window.storage.delete(k,true); return true; }catch(e){ return false; }
}
async function sList(prefix, shared=true){
  if(FB && prefix===MPRE) return [MPRE+'all'];
  if(FB) return [];
  if(!hasStore) return [...mem.keys()].filter(x=>x.startsWith('s:'+prefix)).map(x=>x.slice(2));
  try{ const r=await window.storage.list(prefix, shared); return r&&r.keys?r.keys:[]; }catch(e){ return []; }
}

/* ─────────────────────────── 기본 설정 ─────────────────────────── */
const DEFAULTS = {
  baseRating:1200,   // 최하위 부수 시작 점수 (부수 랭킹)
  formBase:1500,     // 핸디포함 랭킹 공통 시작 점수
  bestOf:5,          // 3 = 3판2선승, 5 = 5판3선승 (핸디 환산 기본값 산출용)
  handiElo:129,      // 핸디 1점당 레이팅 — 이게 기준값, 부수당 레이팅은 여기서 파생
  ptsPerBu:2,        // 부수 차 1당 핸디 점수 (클럽 관행 = 관측값)
  kNew:40, kMid:28, kBase:20,
  newGames:10, midGames:30,
  kHalfLife:30,      // 경험치 반감기(일) — 오래 쉬면 K가 다시 올라가 빨리 재조정된다
  formDays:30,       // '요즘' 변동을 보는 기간(일)
  handiOn:true,      // 핸디 보정 (부수 랭킹에만 적용)
  confirmedOnly:true,      // 양쪽이 확인한 경기만 랭킹에 반영
  provisional:5,     // 이 경기 수 미만은 임시 레이팅
  legacyBefore:'2026-08-05T00:00:00.000Z'   // 임시 운영 기간 — 이전 입력분은 입력자 대신 '관리자 입력'으로 표기
};
/* 11점제 랠리 모델로 푼 값 — 핸디 h점이 상쇄하는 실력차(Elo).
   큰 h에서는 모델이 무핸디 승률 100%를 예측해 신뢰도가 떨어지므로 선형 환산만 사용한다. */
const E_TABLE = { 3:[0,95,204,333,497,714,1019], 5:[0,119,258,429,655,968,1418] };
function modelHandiElo(bestOf, ptsPerBu){
  const t = E_TABLE[bestOf] || E_TABLE[5];
  const h = Math.min(Math.max(1, Math.round(ptsPerBu||1)), 6);
  return Math.round(t[h]/h);
}
const BU_MIN=3, BU_MAX=10;

const S = { players:[], matches:[], meta:null, me:null, tab:'rank', mode:'skill',
            tracks:{skill:{R:{},H:{}},form:{R:{},H:{}}},
            G:{}, W:{}, L:{}, HH:{}, ready:false, busy:false, connecting:true };

/* ─────────────────────────── 유틸 ─────────────────────────── */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* 클럽이 한국에 있으니 날짜·시간은 항상 한국 시간(KST) 기준으로 다룬다.
   기기 시간대가 달라도 같은 날짜를 보게 된다. */
const TZ='Asia/Seoul';
function ymdKST(d){
  try{
    return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }catch(e){
    return new Date(d.getTime()+9*36e5).toISOString().slice(0,10);
  }
}
const dayAgo = n=> ymdKST(new Date(Date.now()-n*864e5));
const today = ()=> ymdKST(new Date());
function fmtDateTime(iso){
  try{
    const p={};
    new Intl.DateTimeFormat('en-GB',{timeZone:TZ,month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(iso))
      .forEach(x=>{p[x.type]=x.value;});
    return `${p.month}-${p.day} ${p.hour}:${p.minute}`;
  }catch(e){ return String(iso).slice(5,16).replace('T',' '); }
}
const monthOf = d=>d.slice(0,7);
const P = id=>S.players.find(p=>p.id===id);
const nameOf = id=>{const p=P(id);return p?p.name:'(삭제됨)';};
const buOf = id=>{const p=P(id);return p?p.bu:null;};
const isAdmin = ()=>!!(S.me&&S.me.role==='admin');
/* 저장 중 표시 — 뭘 하고 있는지 안 보이면 멈춘 줄 안다 */
function busyOn(msg){
  let el=document.getElementById('busy');
  if(!el){ el=document.createElement('div'); el.id='busy'; el.className='busy'; document.body.appendChild(el); }
  el.innerHTML=`<span class="spin"></span><span>${esc(msg)}</span>`;
}
function busyOff(){ const el=document.getElementById('busy'); if(el) el.remove(); }
/* 실패했을 때 원인을 감추지 않는다 */
function errorSheet(title, msg){
  const why = S.lastError ? esc(S.lastError)
    : !online() && fbConfigured() ? '공유 저장소에 연결되어 있지 않습니다.'
    : '알 수 없는 오류입니다.';
  const hint = !online() && fbConfigured()
    ? '인터넷 연결을 확인하고 새로고침해주세요. 화면 위쪽 경고가 사라지면 정상입니다.'
    : /permission|denied|PERMISSION/i.test(why)
      ? 'Firebase 규칙에서 쓰기가 막혀 있습니다. 관리자에게 익명 로그인 설정과 규칙 확인을 요청하세요.'
      : '잠시 후 다시 시도해주세요. 계속되면 관리자에게 알려주세요.';
  sheet(title, `<p class="tiny" style="color:var(--mut);line-height:1.7">${esc(msg)}</p>
    <div class="notice warn" style="margin-top:12px"><b>원인</b><br>${why}</div>
    <p class="tiny dim" style="margin-top:10px">${hint}</p>`,
    `<button class="btn" style="margin-top:12px" onclick="location.reload()">새로고침</button>`);
}
function toast(msg,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
async function sha(txt){
  if(!(window.crypto&&crypto.subtle)) return 'plain:'+txt;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tt$'+txt));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function fmtDate(d){ const [y,m,dd]=d.split('-'); return `${+m}/${+dd}`; }
const DEFAULT_PIN='0000';
let defaultPinHash=null;                       // 부팅 때 한 번 계산해 둔다
async function defPin(){ if(!defaultPinHash) defaultPinHash=await sha(DEFAULT_PIN); return defaultPinHash; }
const usingDefaultPin = p => !!p && !!defaultPinHash && p.pinHash===defaultPinHash;

/* ─────────────────────────── Elo 엔진 ─────────────────────────── */
const st = ()=> (S.meta&&S.meta.settings) || DEFAULTS;
/* 인과 방향: 핸디 1점당 레이팅(추정값) × 부수당 핸디 점수(클럽 관행) = 부수당 레이팅(파생값) */
const handiElo = ()=> st().handiElo;
const perBu = ()=> st().ptsPerBu * st().handiElo;
const baseFor = bu => st().baseRating + (BU_MAX - Math.min(BU_MAX,Math.max(BU_MIN,bu||BU_MAX))) * perBu();
/* 레이팅 → 부수 환산. 점수만으로는 감이 안 오니 부수로 바꿔서 같이 보여준다. */
const buScale = r => Math.min(BU_MAX+0.9, Math.max(BU_MIN-0.9,
  BU_MAX - (r - st().baseRating)/(perBu()||1)));
const buText = r => (Math.round(buScale(r)*10)/10).toFixed(1)+'부';
const buFromRating = r => Math.min(BU_MAX,Math.max(BU_MIN, BU_MAX - Math.round((r-st().baseRating)/(perBu()||1))));
const kFor = n => n<st().newGames ? st().kNew : (n<st().midGames ? st().kMid : st().kBase);
const daysBetween = (a,b)=> Math.max(0,(Date.parse(b)-Date.parse(a))/864e5);
/* 최근성 가중 경험치: 지난 경기들이 반감기에 따라 서서히 사라진다.
   활발히 치면 경험치가 쌓여 K가 낮고(안정), 오래 쉬면 줄어들어 K가 올라간다(빠른 재조정). */
const decayExp = (n, days)=> n * Math.pow(0.5, days/(st().kHalfLife||30));
const isConfirmed = m => (m.confirmedBy||[]).length>=2 || (m.enteredAt||'') < (st().legacyBefore||'');
const liveMatches = ()=> S.matches.filter(m=>!m.void && (!st().confirmedOnly || isConfirmed(m)));
/* 승자 — 신규 기록은 winnerId, 예전 기록은 세트 스코어에서 읽는다 */
const winnerOf = m => m.winnerId || (m.aSets>m.bSets ? m.aId : m.bId);
const loserOf  = m => winnerOf(m)===m.aId ? m.bId : m.aId;
const MODES = { skill:{label:'부수', note:'부수를 시작점으로 두고 핸디를 걷어낸 값입니다. 핸디 조건을 넘어선 만큼만 오르내려요.'},
                form: {label:'핸디포함', note:'전원 같은 점수에서 시작하고 핸디를 그대로 인정한 값입니다. 붙은 그대로의 승패 순서예요.'} };

/* 한 트랙 계산 — mode: 'skill'=부수(부수 시작 + 핸디 보정) | 'form'=핸디포함(동일 시작 + 무보정) */
function runEngine(mode){
  const s=st(), hElo=handiElo(), skill=(mode==='skill');
  const dk = skill?['_sA','_sB']:['_fA','_fB'];
  const R={},H={},G={},LD={},PK={},RG={};
  S.players.forEach(p=>{
    R[p.id] = skill ? baseFor(p.bu) : s.formBase;
    H[p.id] = [{d:p.joinedAt?p.joinedAt.slice(0,10):'', r:R[p.id]}];
    G[p.id] = 0; LD[p.id] = null; PK[p.id] = R[p.id]; RG[p.id] = 0;
  });
  const expAt = id => {                       // 이 경기 시점의 감쇠 경험치
    const m=S._cur; if(!LD[id]) return 0;
    return decayExp(G[id], daysBetween(LD[id], m.date));
  };
  for(const m of S._sorted){
    if(!(m.aId in R)||!(m.bId in R)){ m[dk[0]]=m[dk[1]]=0; continue; }
    S._cur=m;
    const na=expAt(m.aId), nb=expAt(m.bId);
    const ra=R[m.aId], rb=R[m.bId];
    let ea=ra, eb=rb;
    if(skill && s.handiOn && m.handi && m.handi.pts>0){
      if(m.handi.toId===m.aId) ea += m.handi.pts*hElo;
      if(m.handi.toId===m.bId) eb += m.handi.pts*hElo;
    }
    const expA = 1/(1+Math.pow(10,(eb-ea)/400));
    const sa = winnerOf(m)===m.aId ? 1 : 0;
    const dA = kFor(na)*(sa-expA);
    const dB = kFor(nb)*((1-sa)-(1-expA));
    R[m.aId]=ra+dA; R[m.bId]=rb+dB;
    if(skill){
      m._expA=expA;
      m._faceA = eb-(ea-ra);        // 내 원래 레이팅 기준으로 환산한 상대 강도
      m._faceB = ea-(eb-rb);
      if(RG[m.aId]>=9 && R[m.aId]>PK[m.aId]){ m._peakA=Math.round(R[m.aId]); }
      if(RG[m.bId]>=9 && R[m.bId]>PK[m.bId]){ m._peakB=Math.round(R[m.bId]); }
      PK[m.aId]=Math.max(PK[m.aId],R[m.aId]); PK[m.bId]=Math.max(PK[m.bId],R[m.bId]);
    }
    m[dk[0]]=dA; m[dk[1]]=dB;
    G[m.aId]=na+1; G[m.bId]=nb+1; RG[m.aId]++; RG[m.bId]++;
    LD[m.aId]=m.date; LD[m.bId]=m.date;
    H[m.aId].push({d:m.date,r:R[m.aId],id:m.id}); H[m.bId].push({d:m.date,r:R[m.bId],id:m.id});
  }
  return {R,H};
}
function recompute(){
  S._sorted = liveMatches().slice().sort((a,b)=>(a.date+'|'+a.enteredAt).localeCompare(b.date+'|'+b.enteredAt));
  const G={},W={},L={},HH={};
  S.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;HH[p.id]={};});
  for(const m of S._sorted){
    if(!(m.aId in G)||!(m.bId in G)) continue;
    const aw = winnerOf(m)===m.aId;
    G[m.aId]++; G[m.bId]++;
    if(aw){ W[m.aId]++; L[m.bId]++; } else { W[m.bId]++; L[m.aId]++; }
    HH[m.aId][m.bId]=HH[m.aId][m.bId]||{w:0,l:0}; HH[m.bId][m.aId]=HH[m.bId][m.aId]||{w:0,l:0};
    if(aw){HH[m.aId][m.bId].w++;HH[m.bId][m.aId].l++;}else{HH[m.aId][m.bId].l++;HH[m.bId][m.aId].w++;}
  }
  const LAST={};
  S.players.forEach(p=>LAST[p.id]=null);
  for(const m of S._sorted){
    if(m.aId in LAST) LAST[m.aId] = !LAST[m.aId]||m.date>LAST[m.aId] ? m.date : LAST[m.aId];
    if(m.bId in LAST) LAST[m.bId] = !LAST[m.bId]||m.date>LAST[m.bId] ? m.date : LAST[m.bId];
  }
  S.G=G;S.W=W;S.L=L;S.HH=HH;S.LAST=LAST;
  S.tracks = { skill:runEngine('skill'), form:runEngine('form') };
  S.peak = {};
  for(const mode of ['skill','form']){
    S.peak[mode]={};
    for(const p of S.players){ const h=S.tracks[mode].H[p.id]||[];
      S.peak[mode][p.id] = h.reduce((best,x)=> x.r>best.r?x:best, h[0]||{r:0,d:''}); }
  }
}
const trk = mode => S.tracks[mode||S.mode] || {R:{},H:{}};
const rateOf = (id,mode)=>{ const v=trk(mode).R[id];
  return v!=null ? v : ((mode||S.mode)==='form' ? st().formBase : baseFor((P(id)||{}).bu)); };
function ranked(mode){
  return S.players.filter(p=>p.active!==false)
    .map(p=>({p, r:rateOf(p.id,mode), g:S.G[p.id]||0, w:S.W[p.id]||0, l:S.L[p.id]||0}))
    .sort((a,b)=> b.r-a.r || b.g-a.g || a.p.name.localeCompare(b.p.name));
}
/* 요즘 변동: 최근 formDays일 동안 레이팅이 얼마나 움직였나 */
function deltaOf(id,mode){
  const h=trk(mode).H[id]||[]; if(h.length<2) return 0;
  const cutoff=dayAgo(st().formDays||30);
  let base=h[0];
  for(const x of h){ if(x.d && x.d<=cutoff) base=x; else break; }
  return h[h.length-1].r - base.r;
}
/* 몰아서 입력하면 같은 날 경기의 순서는 실제 순서가 아니다.
   그래서 '연승' 같은 순서 통계는 쓰지 않고, 날짜 단위와 최근 N경기 집계만 쓴다. */
function dayRecords(id){
  const byDay={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const k=m.date; byDay[k]=byDay[k]||{d:k,w:0,l:0};
    if(winnerOf(m)===id) byDay[k].w++; else byDay[k].l++;
  }
  return Object.values(byDay).sort((a,b)=>a.d.localeCompare(b.d));
}
/* 최근 경기 결과 — 같은 날 안의 순서는 입력 순서라 참고용이다.
   연승 같은 순서 통계는 쓰지 않고, 최근 흐름을 보는 용도로만 표시한다. */
function recentForm(id,n=6){
  return (S._sorted||[]).filter(m=>m.aId===id||m.bId===id).slice(-n).reverse()
    .map(m=>({w:winnerOf(m)===id, opp:nameOf(m.aId===id?m.bId:m.aId), d:m.date}));
}
/* 최근 N경기도 날짜 경계에서 끊는다 — 하루 중간을 자르면 입력 순서에 따라 값이 달라진다 */
function recentRecord(id, want=20){
  const days=dayRecords(id); let w=0,l=0;
  for(let i=days.length-1;i>=0;i--){ w+=days[i].w; l+=days[i].l; if(w+l>=want) break; }
  return {w, l, g:w+l};
}
/* 특정 시점의 순위 — 리그 표처럼 순위 등락을 보여주기 위해 */
function ranksAt(dateStr, mode){
  const t=trk(mode);
  const arr=S.players.filter(p=>p.active!==false).map(p=>{
    const h=t.H[p.id]||[]; let r=h.length?h[0].r:0;
    for(const x of h){ if(!x.d || x.d<=dateStr) r=x.r; else break; }
    return {id:p.id, r};
  }).sort((a,b)=>b.r-a.r);
  const map={}; arr.forEach((x,i)=>map[x.id]=i+1);
  return map;
}
/* 내가 확인해줘야 하는 경기 */
function pendingForMe(){
  if(!S.me) return [];
  return S.matches.filter(m=>!m.void && !isConfirmed(m)
    && (m.aId===S.me.id || m.bId===S.me.id)
    && !(m.confirmedBy||[]).includes(S.me.id));
}
const idleDays = id => S.LAST&&S.LAST[id] ? Math.round(daysBetween(S.LAST[id], today())) : null;
/* 퍼포먼스 레이팅 — 그 성적을 냈을 때 레이팅 변동이 0이 되는 값.
   상대 강도와 실제 승수만 쓰기 때문에 표본이 적어도 뜻이 있다. */
function perfRating(ms, id){
  const g=ms.map(m=>({f: m.aId===id?m._faceA:m._faceB, s: winnerOf(m)===id?1:0}))
            .filter(x=>x.f!=null);
  if(!g.length) return null;
  const score=g.reduce((a,x)=>a+x.s,0);
  const avg=g.reduce((a,x)=>a+x.f,0)/g.length;
  if(score===0)         return {rp:avg-400, n:g.length, score, avg, edge:'low'};
  if(score===g.length)  return {rp:avg+400, n:g.length, score, avg, edge:'high'};
  let lo=0, hi=4000;
  for(let i=0;i<64;i++){
    const mid=(lo+hi)/2;
    const exp=g.reduce((a,x)=>a+1/(1+Math.pow(10,(x.f-mid)/400)),0);
    if(exp<score) lo=mid; else hi=mid;
  }
  return {rp:(lo+hi)/2, n:g.length, score, avg, edge:null};
}
/* 상대 분석 — 표본이 적어도 뜻이 있게, 기대 승수 대비 실제 승수로 본다.
   기대 승수는 그 경기 직전 레이팅과 핸디를 반영한 값이라 상대 수준이 자동으로 보정된다. */
function h2hStats(id){
  const me=P(id); if(!me) return null;
  const mine=(S._sorted||[]).filter(m=>(m.aId===id||m.bId===id) && m._faceA!=null);
  if(!mine.length) return null;
  const opp={};
  let best=null;
  for(const m of mine){
    const oid = m.aId===id ? m.bId : m.aId;
    const face = m.aId===id ? m._faceA : m._faceB;
    const won  = winnerOf(m)===id;
    const o=(opp[oid] = opp[oid] || {oid, w:0, l:0, face:0, n:0, hist:[], handi:null});
    o[won?'w':'l']++; o.face+=face; o.n++;
    o.hist.push({w:won, d:m.date});
    o.handi = (m.handi&&m.handi.pts) ? {mine:m.handi.toId===id, pts:m.handi.pts} : null;
    if(won && (!best || face>best.face)) best={face, oid, date:m.date};
  }
  const list=Object.values(opp).map(o=>({...o, avg:o.face/o.n, rate:rateOf(o.oid,'skill'),
                                         hist:o.hist.slice(-5).reverse()}))
                  .sort((a,b)=>b.rate-a.rate);
  const band={high:{w:0,l:0}, same:{w:0,l:0}, low:{w:0,l:0}};
  for(const m of mine){
    const oid=m.aId===id?m.bId:m.aId, o=P(oid); if(!o) continue;
    const k = o.bu<me.bu ? 'high' : o.bu===me.bu ? 'same' : 'low';
    band[k][winnerOf(m)===id?'w':'l']++;
  }
  const lefty={w:0,l:0};
  for(const o of Object.values(opp)){ const pp=P(o.oid);
    if(pp&&pp.hand==='L'){ lefty.w+=o.w; lefty.l+=o.l; } }
  const nemesis=list.slice().sort((a,b)=>(b.l-b.w)-(a.l-a.w))[0];
  const prey   =list.slice().sort((a,b)=>(b.w-b.l)-(a.w-a.l))[0];
  const solid = x => x && x.n>=3;
  return {list, best, lefty, band, perf:perfRating(mine,id), n:mine.length,
          nemesis: solid(nemesis)&&nemesis.l>nemesis.w ? nemesis : null,
          prey:    solid(prey)&&prey.w>prey.l ? prey : null};
}

/* 새로 들어온 사람의 시작 레이팅이 실제 실력과 맞는지 진단.
   첫 N경기에서 기대 승수보다 실제 승수가 크게 적으면 시작값이 후하다는 뜻이고,
   그만큼 기존 회원들이 점수를 가져가게 된다. */
function entryAccuracy(n=10){
  const seen={}; let exp=0, act=0, cnt=0;
  for(const m of (S._sorted||[])){
    for(const side of [0,1]){
      const id = side? m.bId : m.aId;
      if(!(id in S.G)) continue;
      const c = seen[id]||0;
      if(c<n){
        const e = side ? 1-(m._expA||0.5) : (m._expA||0.5);
        exp += e; act += (winnerOf(m)===id?1:0); cnt++;
      }
      seen[id]=c+1;
    }
  }
  return {cnt, exp, act};
}
/* 클럽 핸디가 실제로 공정한지 진단 */
function handiStat(){
  const ms=liveMatches().filter(m=>m.handi&&m.handi.pts>0);
  if(!ms.length) return {n:0};
  const w=ms.filter(m=> winnerOf(m)===m.handi.toId).length;
  return {n:ms.length, rate:Math.round(w/ms.length*100)};
}

/* 마지막으로 본 데이터를 기기에 남겨둔다. 다음 접속 때 네트워크를 기다리지 않고 바로 그린다. */
const CACHE_KEY='tt:cache:'+CLUB;
function saveCache(){
  try{

    if(json.length>1500000) return;                 // 너무 크면 캐시하지 않는다

async function loadAll(){
  const keys = await sList(MPRE);
  S._shards = keys.length;
  /* 셋을 동시에 가져온다 — 순서대로 기다리면 왕복이 그만큼 쌓인다 */
  const [meta0, players0, ...shards] = await Promise.all([
    sGet(KEY.meta), sGet(KEY.players), ...keys.map(k=>sGet(k))
  ]);
  let meta = meta0;
  if(!meta){ meta = {settings:{...DEFAULTS}, createdAt:new Date().toISOString(), v:1}; sSet(KEY.meta,meta); }
  meta.settings = {...DEFAULTS, ...(meta.settings||{})};
  S.meta = meta;
  S.players = players0 || [];
  const merged=new Map();                       // 같은 id가 여러 조각에 있으면 최신 rev만 남긴다
  for(const m of shards.flat().filter(Boolean)){
    const prev=merged.get(m.id);
    if(!prev || (m.rev||0) >= (prev.rev||0)) merged.set(m.id, m);
  }
  S.matches = [...merged.values()];
  recompute();
  saveCache();
}
/* 경기 저장: 해당 월 샤드만 재읽기 → id 기준 병합 → 기록 후 검증 재시도 */
/* 화면에 먼저 반영한다 — 저장은 뒤에서 끝나도 된다 */
function applyMatches(list){
  const local=new Map(S.matches.map(m=>[m.id,m]));
  list.forEach(m=>local.set(m.id,m));
  S.matches=[...local.values()]; recompute();
}
/* 저장만 담당. 실패하면 원래 상태로 되돌린다 */
async function pushMatches(list, label){
  const before=S.matches.slice();
  applyMatches(list);
  render();
  busyOn(label||'저장 중…');
  let ok=true;
  try{
    if(FB){
      const obj={}; list.forEach(m=>obj[m.id]=m);
      await (list.length>1 ? FB.patch(FBM, obj) : FB.set(FBM+'/'+list[0].id, list[0]));
      bumpSig();
    } else {
      const byShard={};
      list.forEach(m=>{ const k=KEY.shard(monthOf(m.date)); (byShard[k]=byShard[k]||[]).push(m); });
      for(const [k,ms] of Object.entries(byShard)){
        const cur=(await sGet(k))||[];
        const map=new Map(cur.map(m=>[m.id,m]));
        ms.forEach(m=>map.set(m.id,m));
        if(!await sSet(k,[...map.values()])){ ok=false; break; }
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
async function commitMatch(match){
  if(FB){
    try{ await FB.set(FBM+'/'+match.id, match); bumpSig(); }
    catch(e){ S.lastError = e && (e.message||String(e)); return false; }
    applyMatches([match]); return true;
  }
  const key = KEY.shard(monthOf(match.date));
  for(let attempt=0; attempt<3; attempt++){
    const cur = (await sGet(key)) || [];
    const map = new Map(cur.map(m=>[m.id,m]));
    map.set(match.id, match);
    const next = [...map.values()];
    await sSet(key, next);
    const check = (await sGet(key)) || [];
    if(check.some(m=>m.id===match.id && m.rev===match.rev)){
      const local = new Map(S.matches.map(m=>[m.id,m]));
      check.forEach(m=>local.set(m.id,m));
      S.matches=[...local.values()]; recompute(); return true;
    }
    await new Promise(r=>setTimeout(r, 120+Math.random()*250));
  }
  return false;
}
/* 여러 경기를 한 번에 저장 — 빠른 입력에서 왕복을 1회로 줄인다 */
async function commitMatches(list){ return list.length ? pushMatches(list) : true; }

/* 같은 날 · 같은 상대 · 같은 승패 = 중복 후보.
   상대가 먼저 넣은 미확인 건이 있으면 → 새 레코드 없이 '상호 확인'으로 승격.
   내가 넣은 건만 있으면 → 진짜 다른 경기인지 물어봄(하루에 같은 결과 반복 가능). */
function dupScan(date, meId, oppId, iWon){
  const same = S.matches.filter(m=>!m.void && m.date===date &&
    ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
  const sameResult = m => (winnerOf(m)===meId) === iWon;
  const cands = same.filter(sameResult);
  const cb = m => m.confirmedBy || [];
  const byOpp = cands.find(m=> m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m));
  const mine  = cands.filter(m=> m.enteredBy===meId || cb(m).includes(meId));
  const conflict = same.filter(m=>!sameResult(m) && m.enteredBy===oppId && !isConfirmed(m));
  return {byOpp, mineCount:mine.length, conflict:conflict[0]||null};
}

  return S.matches.length+':'+S.players.length+':'+h+':'+JSON.stringify(st());

  if(hasStore) return `<div class="notice warn">지금은 미리보기 저장소로 돌아가고 있습니다. 깃허브에 올려 여러 사람이 같이 쓰려면 파일 맨 위 TT_CONFIG에 Firebase 값을 채워주세요.</div>`;
  return `<div class="notice warn">저장소에 연결되지 않아 이 브라우저에서만 데이터가 남습니다. 파일 맨 위 TT_CONFIG에 Firebase 값을 채우면 어디서 접속하든 같은 기록을 보게 됩니다.</div>`;
}

  $('#view').innerHTML = `
    <h2 style="margin-top:20px">클럽 랭킹에 참여하기</h2>

      <div class="seg" style="margin-bottom:14px">

      : `<div class="field"><label>이름</label><select id="lname">${S.players.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.bu}부${p.pinHash?'':' · PIN 설정 필요'}</option>`).join('')}</select></div>
         <div class="field"><label id="lpinLab">PIN 4자리</label><input id="lpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
         <p class="tiny dim" id="lpinHint" style="margin:-6px 2px 12px"></p>
         <button class="btn" id="doLogin">로그인</button>`;
    const b=$('#doLogin'); if(b) b.onclick=doLogin;

    const sel=$('#lname');
    const syncPin=()=>{ const p=P(sel.value); const fresh=p&&!p.pinHash;
      $('#lpinLab').textContent = fresh ? '쓸 PIN 4자리 정하기' : 'PIN 4자리';
      $('#lpinHint').textContent = fresh ? '관리자가 미리 만들어 둔 계정입니다. 여기서 정한 PIN이 앞으로 본인 PIN이 됩니다.'
                                 : (usingDefaultPin(p) ? `초기 PIN ${DEFAULT_PIN}으로 로그인한 뒤 내 정보에서 바꿔주세요.` : '');
      $('#doLogin').textContent = fresh ? 'PIN 설정하고 시작' : '로그인'; };
    if(sel){ sel.onchange=syncPin; syncPin(); }
  };
  const join = ()=>{
    $('#authBody').innerHTML = `
      ${first?`<div class="notice">첫 등록자는 자동으로 관리자가 됩니다.</div>`:''}
      <div class="row"><div class="field" style="flex:2"><label>이름</label><input id="jname" maxlength="12" placeholder="클럽에서 부르는 이름"></div>
      <div class="field"><label>부수</label><select id="jbu">${Array.from({length:BU_MAX-BU_MIN+1},(_,i)=>BU_MIN+i).map(b=>`<option value="${b}" ${b===7?'selected':''}>${b}부</option>`).join('')}</select></div></div>

    $('#doJoin').onclick = doJoin;
  };
  $('#tabLogin').onclick = e=>{ $('#tabLogin').classList.add('on'); $('#tabJoin').classList.remove('on'); login(); };

async function doLogin(){
  const id=$('#lname').value, pin=($('#lpin').value||'').trim();
  const p=P(id); if(!p) return;
  if(!p.pinHash){                                  // 관리자가 만들어 둔 계정 넘겨받기
    if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
    const hash=await sha(pin);
    const ok=await savePlayers(map=>{const x=map.get(id); if(x)x.pinHash=hash;});
    if(!ok) return toast('설정에 실패했습니다. 다시 시도해주세요.',1);
    audit('PIN 설정', p.name);
  } else if(p.pinHash!==await sha(pin)) return toast('PIN이 맞지 않습니다.',1);
  S.me=P(id); await sSet(KEY.session,{playerId:id, at:Date.now()},false); S.tab='rank'; render();
  const n=pendingForMe().length;
  toast(n ? `${S.me.name}님 반갑습니다. 확인할 경기가 ${n}건 있습니다.` : `${S.me.name}님 반갑습니다.`);
}
async function doJoin(){
  const name=($('#jname').value||'').trim();
  const pin=($('#jpin').value||'').trim();
  if(name.length<1) return toast('이름을 입력하세요.',1);
  if(S.players.some(p=>p.name===name)) return toast('이미 있는 이름입니다.',1);
  if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
  const p={ id:uid('p'), name, bu:+$('#jbu').value, hand:$('#jhand').value,
            bio:($('#jbio').value||'').trim(), pinHash:await sha(pin),
            role:S.players.length===0?'admin':'member', active:true, joinedAt:new Date().toISOString() };
  const ok=await savePlayers(map=>map.set(p.id,p));
  if(!ok) return toast('등록에 실패했습니다. 다시 시도해주세요.',1);
  S.me=P(p.id); await sSet(KEY.session,{playerId:p.id, at:Date.now()},false);
  audit('선수 등록', name); S.tab='rank'; render(); toast('등록되었습니다.');
}

/* ── 경기 입력 ── */
/* 회원은 어제까지만 입력할 수 있다. 며칠 지난 기억으로 넣으면 서로 안 맞는 경우가 많아서다.
   관리자는 제한 없이 소급 입력할 수 있고, 이미 들어간 경기는 '날짜 수정'으로 언제든 옮긴다. */
const minEntryDate = ()=> isAdmin() ? '' : dayAgo(1);
const dateOK = d => !!d && d<=today() && (isAdmin() || d>=dayAgo(1));
const shiftDate = (d,n)=>{ const [y,m,dd]=d.split('-').map(Number);
  const x=new Date(y,m-1,dd+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dateLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  const wk=['일','월','화','수','목','금','토'][new Date(y,m-1,dd).getDay()];
  const rel = d===today()?' · 오늘' : d===dayAgo(1)?' · 어제' : '';
  return `${m}월 ${dd}일 (${wk})${rel}`;
}
/* 화살표로도 바꾸고 달력으로도 고를 수 있게 둘 다 둔다 — 기기에 따라 달력이 안 열리는 경우가 있어서다 */
function dateField(id, val){
  /* 달력 입력창은 숨겨두고 화살표로 조작한다. 가운데 날짜를 누르면 달력이 뜨는 기기에서는 달력도 열린다. */
  return `<div class="field" style="position:relative">
    <div class="daterow">
      <button data-ds="-1" ${dateOK(shiftDate(val,-1))?'':'disabled'}>‹</button>
      <button class="dlab" data-dpick>${dateLabel(val)}</button>
      <button data-ds="1" ${dateOK(shiftDate(val,1))?'':'disabled'}>›</button>
    </div>
    <input type="date" id="${id}" value="${val}" max="${today()}" min="${minEntryDate()}"
           style="position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;padding:0;border:none">
    <p class="tiny dim" style="margin:7px 2px 0">${isAdmin()?'관리자는 지난 날짜도 넣을 수 있습니다.':'오늘과 어제까지 입력할 수 있습니다. 더 지난 경기는 관리자에게 요청하세요.'}</p>
  </div>`;
}
function bindDateField(id, get, apply){
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
    const nd=shiftDate(get(), +b.dataset.ds);
    if(dateOK(nd)) apply(nd);
  });
  const el=$('#'+id); if(!el) return;
  const pick=document.querySelector('[data-dpick]');
  if(pick) pick.onclick=()=>{ try{ el.showPicker ? el.showPicker() : el.focus(); }catch(e){} };
  el.onchange=e=>{ const v=e.target.value;
    if(!v){ e.target.value=get(); return; }
    if(!dateOK(v)){ e.target.value=get(); return toast('입력할 수 없는 날짜입니다.',1); }
    apply(v);
  };
}

      </div>
      <div class="tally"><span><b>${wN}</b>승</span><span><b>${lN}</b>패</span>
        <span style="margin-left:auto">${wN+lN?`총 ${wN+lN}경기`:'아직 선택 없음'}</span></div>
      <hr class="sep">
      <button class="btn" id="bSave" ${wN+lN?'':'disabled'}>${wN+lN?`${wN+lN}경기 한 번에 등록`:'상대를 선택하세요'}</button>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost sm" id="bImp">밴드 글 붙여넣기</button>

      <p class="tiny dim" style="margin:9px 2px 0">핸디는 부수 차이로 자동 계산됩니다. 이미 등록됐거나 상대가 먼저 넣은 경기는 알아서 건너뛰거나 합칩니다.
      ${isAdmin()?'':'세부 조정이 필요하면 위에서 한 경기씩으로 바꾸세요.'}</p>
    </div>
    <h2>${bulk.date===today()?'오늘':bulk.date===dayAgo(1)?'어제':fmtDate(bulk.date)} 등록된 경기</h2>

  bindAddSeg();
  if(opp.length){
    bindDateField('bdate', ()=>bulk.date, v=>{ bulk.date=v; viewAddQuick(); });

      viewAddQuick();

    $('#bSave').onclick=submitBulk;

  }

}

/* picks = { 상대id: {r:'W'|'L', n:판수} } — 중복은 건너뛰고 상대 입력분은 합친다 */
async function planAndSave(date, meId, picks, label){
  const iAmIn = meId===S.me.id;
  const confirmIds = oppId => iAmIn ? [S.me.id] : [meId, oppId];
  const draftList = S.matches.slice();
  const scan = (oppId,iWon)=>{
    const same=draftList.filter(m=>!m.void && m.date===date &&
      ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
    const ok=m=>(winnerOf(m)===meId)===iWon;
    const cands=same.filter(ok), cb=m=>m.confirmedBy||[];
    return { byOpp: cands.find(m=>m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m)),
             mineCount: cands.filter(m=>m.enteredBy===meId || cb(m).includes(meId)).length };
  };
  const writes=[]; let created=0, merged=0, skipped=0;
  for(const [oppId,k] of Object.entries(picks)){
    if(!P(oppId) || oppId===meId) continue;
    const iWon = k.r==='W';
    const s0 = scan(oppId,iWon);
    let need = Math.max(0, k.n - s0.mineCount);
    skipped += k.n - need;
    while(need>0){
      const sc = scan(oppId,iWon);
      if(!sc.byOpp) break;
      const upd={...sc.byOpp, confirmedBy:[...new Set([...(sc.byOpp.confirmedBy||[]), ...confirmIds(oppId)])],
                 status:'confirmed', rev:(sc.byOpp.rev||0)+1};
      writes.push(upd);
      const i=draftList.findIndex(m=>m.id===upd.id); if(i>=0) draftList[i]=upd;
      merged++; need--;
    }
    const a=P(meId), b=P(oppId);
    const hTo = a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';
    const hPts = hTo ? Math.abs(a.bu-b.bu)*st().ptsPerBu : 0;
    for(let i=0;i<need;i++){
      const m={ id:uid('m'), rev:1, date, aId:meId, bId:oppId, winnerId: iWon?meId:oppId,
                handi: hTo?{toId:hTo, pts:hPts}:null, note:'',
                enteredBy:S.me.id, enteredAt:new Date(Date.now()+i).toISOString(),
                confirmedBy: confirmIds(oppId), status: iAmIn?'single':'confirmed', void:false };
      writes.push(m); draftList.push(m); created++;
    }
  }
  let ok=true;
  if(writes.length){ busyOn(`${writes.length}건 저장 중…`); ok=await commitMatches(writes); }
  return {ok, created, merged, skipped, count:writes.length};
}
async function submitBulk(){
  if(S.busy) return;
  const live=$('#bdate'); if(live&&live.value) bulk.date=live.value;
  const date=bulk.date, meId=bulk.meId;
  if(!dateOK(date)) return toast(date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);
  if(!Object.keys(bulk.picks).length) return;

  S.busy=true; busyOn('정리하는 중…');
  const r=await planAndSave(date, meId, bulk.picks);
  S.busy=false; busyOff();
  if(!r.ok) return errorSheet('저장하지 못했습니다','경기를 저장하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('빠른 입력', `${nameOf(meId)} · ${date} · 등록 ${r.created} / 합침 ${r.merged} / 건너뜀 ${r.skipped}`);
  bulk={ date, meId, picks:{} };
  render();
  const parts=[];
  if(r.created) parts.push(`${r.created}건 등록`);
  if(r.merged)  parts.push(`${r.merged}건 상대 입력과 합침`);
  if(r.skipped) parts.push(`${r.skipped}건 건너뜀`);
  toast(parts.length?parts.join(' · '):'새로 등록할 경기가 없었습니다.');
}

async function submitMatch(force){
  if(S.busy) return; 
  const d={...draft};
  const live=$('#fdate'); if(live&&live.value) d.date=draft.date=live.value;   // 달력에서 고르고 바로 등록해도 반영되게
  if(!d.bId||d.aId===d.bId) return toast('상대를 선택하세요.',1);

  if(!isAdmin() && d.aId!==S.me.id && d.bId!==S.me.id) return toast('본인 경기만 입력할 수 있습니다.',1);
  if(!dateOK(d.date)) return toast(d.date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);

  const meId = isAdmin()? d.aId : S.me.id;
  const oppId = meId===d.aId ? d.bId : d.aId;
  const winnerId = d.aWon ? d.aId : d.bId;
  const iWon = winnerId===meId;
  /* 관리자가 남의 경기를 대신 넣으면 양쪽 확인으로 간주한다 */
  const iAmIn = d.aId===S.me.id || d.bId===S.me.id;
  const confirmIds = iAmIn ? [S.me.id] : [d.aId, d.bId];

  if(force!==true){
    const {byOpp, mineCount, conflict} = dupScan(d.date, meId, oppId, iWon);
    if(byOpp){                                   // 상대가 먼저 넣은 동일 경기 → 확인 처리
      S.busy=true;
      const upd={...byOpp, confirmedBy:[...new Set([...(byOpp.confirmedBy||[]), ...confirmIds])], status:'confirmed', rev:(byOpp.rev||0)+1};
      busyOn('상대 입력분과 합치는 중…');
      const ok=await commitMatch(upd); S.busy=false; busyOff();
      if(!ok) return errorSheet('저장하지 못했습니다','상대가 올린 경기와 합치는 중 문제가 생겼습니다.');
      audit('중복 병합', `${nameOf(meId)} vs ${nameOf(oppId)} ${d.date}`);
      draft=null; render(); return toast('상대가 이미 입력한 경기라 하나로 합치고 상호 확인 처리했습니다.');
    }
    if(conflict){                                 // 같은 날 같은 상대인데 승패가 반대
      return confirmSheet('승패가 서로 다릅니다',
        `${esc(nameOf(oppId))}님은 같은 날 <b>본인이 ${winnerOf(conflict)===oppId?'이겼다':'졌다'}</b>고 입력했습니다.<br>지금 입력하려는 건 <b>내가 ${iWon?'이김':'짐'}</b>입니다.<br><br>다른 경기였다면 그대로 등록하고, 같은 경기인데 한쪽이 잘못 넣은 거라면 취소 후 상대와 맞춰주세요.`,
        '다른 경기입니다 · 등록', ()=>submitMatch(true));
    }
    if(mineCount>0){                              // 이미 등록된 경기
      return toast(`${nameOf(oppId)}님과의 그날 경기는 이미 등록돼 있습니다.`,1);
    }
  }

  const handiTo = draft.handiTo==='auto'
    ? (()=>{const a=P(d.aId),b=P(d.bId); return a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';})() : draft.handiTo;
  const handiPts = handiTo ? (draft.handiPts ?? Math.abs(P(d.aId).bu-P(d.bId).bu)*st().ptsPerBu) : 0;

  const m={ id:uid('m'), rev:1, date:d.date, aId:d.aId, bId:d.bId, winnerId,
            handi: handiTo? {toId:handiTo, pts:handiPts} : null,
            note:(d.note||'').trim(),
            enteredBy:S.me.id, enteredAt:new Date().toISOString(),
            confirmedBy:confirmIds, status:iAmIn?'single':'confirmed', void:false };
  S.busy=true;
  const ok=await pushMatches([m]);
  S.busy=false;
  if(!ok) return errorSheet('저장하지 못했습니다','경기를 등록하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('경기 등록', `${nameOf(winnerId)} 승 vs ${nameOf(winnerId===m.aId?m.bId:m.aId)} (${m.date})`);
  const saved=S.matches.find(x=>x.id===m.id)||m;
  const ds=Math.round(saved.aId===S.me.id?(saved._sA||0): saved.bId===S.me.id?(saved._sB||0):0);
  const df=Math.round(saved.aId===S.me.id?(saved._fA||0): saved.bId===S.me.id?(saved._fB||0):0);
  draft={...draft, note:''};
  render(); toast((ds||df)? `등록 완료 · ${MODES.skill.label} ${ds>0?'+':''}${ds} · ${MODES.form.label} ${df>0?'+':''}${df}` : '등록 완료');
}

/* ── 기록 ── */
function matchCardHTML(m){
  const win=winnerOf(m), lose=loserOf(m);
  const mine=isMine(m), done=isConfirmed(m);
  const iWon = mine && win===S.me.id;
  const meMark = pid => pid===meId() ? '<i class="mem">나</i>' : '';
  const canDel = !!S.me && (isAdmin() || (m.enteredBy===S.me.id && !done));
  const canOk  = !!S.me && mine && !done && !(m.confirmedBy||[]).includes(S.me.id);
  const legacy = (m.enteredAt||'') < (st().legacyBefore||'');
  const proxy  = m.enteredBy!==m.aId && m.enteredBy!==m.bId;
  const byLabel = (legacy||proxy) ? '관리자 입력' : esc(nameOf(m.enteredBy))+' 입력';

  const dW = Math.round(Math.abs(win===m.aId ? (m._sA||0) : (m._sB||0)));
  const dL = Math.round(Math.abs(win===m.aId ? (m._sB||0) : (m._sA||0)));
  const peakW = win===m.aId ? m._peakA : m._peakB;

  let meta='';
  if(m._expA!=null){
    const favId = m._expA>=0.5 ? m.aId : m.bId;
    const favP  = Math.min(99, Math.round(Math.max(m._expA,1-m._expA)*100));
    const up    = win!==favId && favP>=58;
    meta += up ? `<span class="ups">이변</span>` : '';
    meta += `<span class="${favP>=70?'hot':''}">예상 ${esc(nameOf(favId))} ${favP}%</span>`;
  }
  if(m.handi&&m.handi.pts) meta += `<span>핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}</span>`;
  if(peakW) meta += `<span class="peak" title="${MODES.skill.label} 랭킹 기준, 이 경기로 본인 최고 레이팅을 넘어섰습니다">개인 최고 ${peakW}</span>`;
  if(!done) meta += `<span class="hot">${(m.confirmedBy||[]).includes(meId())?'상대 확인 대기':'내 확인 필요'}${st().confirmedOnly?' · 랭킹 미반영':''}</span>`;

  return `<div class="mt ${mine?(iWon?'mine mw':'mine ml'):''}">
    <button class="mrow" data-exp="${m.id}">
      <div class="side"><span class="rs w">승</span>
        <span class="pn ${win===meId()?'me':''}">${esc(nameOf(win))}${meMark(win)}${buOf(win)?`<em>(${buOf(win)}부)</em>`:''}</span>
        <span class="dl up">+${dW}</span></div>
      <div class="side"><span class="rs l">패</span>
        <span class="pn dim ${lose===meId()?'me':''}">${esc(nameOf(lose))}${meMark(lose)}${buOf(lose)?`<em>(${buOf(lose)}부)</em>`:''}</span>
        <span class="dl down">−${dL}</span></div>
      ${meta?`<div class="mmeta">${meta}</div>`:''}
    </button>
    <div class="macts" id="act_${m.id}" style="display:none">
      <div class="info">${m.date} · ${done?'상호 확인':'상대가 확인하면 랭킹에 반영됩니다'} · ${byLabel}${m.note?' · '+esc(m.note):''}</div>
      ${canDel?`<button class="btn ghost sm" data-date="${m.id}">날짜 수정</button>
                <button class="btn ghost sm" data-void="${m.id}">삭제</button>`:''}
      ${canOk?`<button class="btn ghost sm" data-ok="${m.id}">이 경기 확인</button>`:''}
      ${(!canDel&&!canOk)?'<span class="tiny dim">수정 권한이 없습니다.</span>':''}
    </div>
  </div>`;
}
function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  const sorted=list.slice().sort((a,b)=>(b.date+b.enteredAt).localeCompare(a.date+a.enteredAt));
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
/* 경기 삭제 — 보관하지 않고 바로 지운다 */
async function deleteMatchById(id){
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>m.id!==id); recompute(); render();
  busyOn('삭제 중…');
  let ok=true;
  try{
    if(FB){ await FB.del(FBM+'/'+id); bumpSig(); }
    else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>x.id===id)) continue;
        if(!await sSet(k, cur.filter(x=>x.id!==id))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 선수를 지울 때 그 사람 경기도 함께 지운다 */
async function deleteMatchesOf(pid){
  const targets=S.matches.filter(m=>m.aId===pid||m.bId===pid);
  if(!targets.length) return 0;
  try{
    if(FB){
      const obj={}; targets.forEach(m=>obj[m.id]=null);   // null 을 넣으면 그 레코드가 지워진다
      await FB.patch(FBM, obj); bumpSig();
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        const next=cur.filter(m=>m.aId!==pid && m.bId!==pid);
        if(next.length!==cur.length) await sSet(k,next);
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); return 0; }
  S.matches=S.matches.filter(m=>m.aId!==pid && m.bId!==pid); recompute();
  return targets.length;
}
/* 날짜만 바꾼다. 개별 레코드 방식이라 옮길 필요가 없다 */
async function moveMatchDate(m, newDate){
  const upd={...m, date:newDate, rev:(m.rev||0)+1, editedBy:S.me.id, editedAt:new Date().toISOString()};
  if(FB) return pushMatches([upd]);
  const newKey=KEY.shard(monthOf(newDate));
  if(!await commitMatch(upd)) return false;
  for(const k of (await sList(MPRE))){
    if(k===newKey) continue;
    const cur=(await sGet(k))||[];
    if(cur.some(x=>x.id===m.id)) await sSet(k, cur.filter(x=>x.id!==m.id));
  }
  await loadAll();
  return true;
}
function dateSheet(id){
  const m=S.matches.find(x=>x.id===id); if(!m) return;
  const sh=sheet('경기 날짜 수정', `
    <p class="tiny dim">${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))}</p>
    <div class="field" style="margin-top:12px"><label>날짜</label>
      <input type="date" id="mdNew" value="${m.date}" max="${today()}" min="${minEntryDate()}"></div>
    <p class="tiny dim">몰아서 기록하다 날짜가 밀린 경우에 쓰세요. 날짜를 바꾸면 그 순서대로 레이팅이 다시 계산됩니다.</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" id="mdNo">취소</button><button class="btn" id="mdYes">저장</button></div>`);
  sh.querySelector('#mdNo').onclick=()=>sh.remove();
  sh.querySelector('#mdYes').onclick=async()=>{
    const nd=sh.querySelector('#mdNew').value;
    if(!nd) return toast('날짜를 선택하세요.',1);
    if(!dateOK(nd)) return toast(nd>today()?'미래 날짜는 넣을 수 없습니다.':'오늘과 어제로만 옮길 수 있습니다.',1);
    sh.remove();
    if(nd===m.date) return;
    const ok=await moveMatchDate(m, nd);
    if(!ok) return errorSheet('수정하지 못했습니다','날짜를 옮기는 중 문제가 생겼습니다.');
    audit('날짜 수정', `${m.date} → ${nd}`);
    viewLog.month=nd.slice(0,7); if(viewLog.day) viewLog.day=nd;
    render(); toast('날짜를 바꿨습니다.');
  };
}
function bindMatchActions(){
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('act_'+b.dataset.exp); if(!el) return;
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>dateSheet(b.dataset.date));
  document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{
    const m=S.matches.find(x=>x.id===b.dataset.void); if(!m) return;

      if(S.busy) return; S.busy=true;
      const info=`${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`;
      const ok=await deleteMatchById(m.id); S.busy=false;
      if(ok){ audit('경기 삭제', info); toast('삭제했습니다.'); }
      else errorSheet('삭제하지 못했습니다','경기를 지우는 중 문제가 생겼습니다.');
    });
  });
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{

    if(ok){ audit('경기 확인', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`); render(); toast('상호 확인되었습니다.'); }

}
/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>m._expA!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = w===m.aId ? m._expA : 1-m._expA;
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=0.42) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">${esc(nameOf(loserOf(ups)))} 상대 · 예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function viewLog(){
  let f=viewLog.filter||'all';
  if(!S.me && f!=='all' && f!=='upset') f=viewLog.filter='all';
  const month=viewLog.month || (viewLog.day ? viewLog.day.slice(0,7) : today().slice(0,7));
  viewLog.month=month;
  const live=S.matches.filter(m=>!m.void);
  const byDay={}; live.forEach(m=>{(byDay[m.date]=byDay[m.date]||[]).push(m);});

  const [Y,Mo]=month.split('-').map(Number);
  const dim=new Date(Y,Mo,0).getDate(), off=new Date(Y,Mo-1,1).getDay();
  const cells=[];
  for(let i=0;i<off;i++) cells.push('<button class="day blank" disabled></button>');
  for(let d=1;d<=dim;d++){
    const ds=`${month}-${String(d).padStart(2,'0')}`;
    const list=byDay[ds]||[];
    const mineN=S.me?list.filter(isMine).length:0;
    const pips=[]; const cap=Math.min(list.length,4);
    for(let i=0;i<cap;i++) pips.push(`<span class="pip ${i<mineN?'mine':''}"></span>`);
    cells.push(`<button class="day ${list.length?'has':''} ${ds===today()?'today':''} ${ds===viewLog.day?'sel':''}" data-day="${ds}">
      <span>${d}</span>
      <span class="pips">${pips.join('')}</span>
      ${list.length>4?`<span class="more">+${list.length-4}</span>`:''}</button>`);
  }
  const monthList = live.filter(m=>m.date.slice(0,7)===month);
  const scope = viewLog.day ? (byDay[viewLog.day]||[]) : monthList;
  let list = scope;
  if(f==='mine') list=list.filter(isMine);
  if(f==='upset') list=list.filter(m=>{
    if(m._expA==null) return false;
    const favId=m._expA>=0.5?m.aId:m.bId, favP=Math.max(m._expA,1-m._expA);
    return winnerOf(m)!==favId && favP>=0.58;
  });
  if(f==='pending') list=list.filter(m=>!isConfirmed(m));

  $('#view').innerHTML=`
    <h2>경기 기록</h2>
    <div class="cal">
      <div class="hd">
        <button class="nav" data-mv="-1">‹</button>
        <b>${Y}년 ${Mo}월</b>
        <button class="nav" data-mv="1">›</button>
      </div>
      <div class="grid">${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${i===0?'sun':''}">${d}</div>`).join('')}</div>
      <div class="grid">${cells.join('')}</div>
      <div class="split tiny dim" style="margin-top:10px">
        <span>${viewLog.day ? `${+viewLog.day.slice(8)}일 · 경기 ${(byDay[viewLog.day]||[]).length}건` : `이 달 경기 ${monthList.length}건`}</span>
        ${viewLog.day?`<button class="btn ghost sm" id="clrDay">이 달 전체 보기</button>`
                     :`<button class="btn ghost sm" id="goToday">오늘로</button>`}
      </div>
    </div>
    <div class="seg" style="margin-bottom:12px">
      <button data-f="all" class="${f==='all'?'on':''}">전체 ${scope.length}</button>
      <button data-f="upset" class="${f==='upset'?'on':''}">이변</button>
      ${S.me?`<button data-f="mine" class="${f==='mine'?'on':''}">내 경기</button>
      <button data-f="pending" class="${f==='pending'?'on':''}">확인 대기</button>`:''}
    </div>
    ${highlightHTML(scope)}
    ${list.length?matchListHTML(list,{group:!viewLog.day})
      :`<div class="empty">${viewLog.day?'이 날은 등록된 경기가 없습니다.':'이 달은 등록된 경기가 없습니다.'}</div>`}`;

  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    viewLog.month=shiftMonth(month,+b.dataset.mv); viewLog.day=null; viewLog(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    viewLog.day = viewLog.day===b.dataset.day ? null : b.dataset.day; viewLog(); });
  const clr=$('#clrDay'); if(clr) clr.onclick=()=>{ viewLog.day=null; viewLog(); };
  const gt=$('#goToday'); if(gt) gt.onclick=()=>{ viewLog.month=today().slice(0,7); viewLog.day=today(); viewLog(); };
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{viewLog.filter=b.dataset.f;viewLog();});
  bindMatchActions();
}

function sparkline(id,mode){
  const h=(trk(mode).H[id]||[]).map(x=>x.r); if(h.length<2) return '';
  const w=300,ht=64,lo=Math.min(...h),hi=Math.max(...h),sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${d} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>
    <div class="split tiny dim"><span>${Math.round(lo)}</span><span>${h.length-1}경기</span><span>${Math.round(hi)}</span></div>`;
}

    const oldPin=($('#pinOld').value||'').trim(), newPin=($('#pinNew').value||'').trim();
    if(p.pinHash && p.pinHash!==await sha(oldPin)) return toast('현재 PIN이 맞지 않습니다.',1);
    if(!/^\d{4}$/.test(newPin)) return toast('새 PIN은 숫자 4자리입니다.',1);
    if(newPin===DEFAULT_PIN) return toast(`${DEFAULT_PIN}은 초기 PIN이라 쓸 수 없습니다.`,1);
    const hash=await sha(newPin);
    const ok=await savePlayers(map=>{const x=map.get(p.id); if(x)x.pinHash=hash;});
    if(!ok) return toast('변경에 실패했습니다.',1);

  };
  $('#eOut').onclick=async()=>{ await sDel(KEY.session,false); S.me=null; render(); };
  document.querySelectorAll('.rk').forEach(b=>b.onclick=()=>playerSheet(b.dataset.pid));
}

function entryDiagHTML(){
  const {cnt, exp, act} = entryAccuracy();
  if(cnt<40) return `<p class="tiny dim" style="margin:0 2px 12px">새 회원 첫 10경기 표본이 ${cnt}건입니다. 40건은 넘어야 시작 레이팅이 맞는지 판단할 만합니다.</p>`;
  const diff = act-exp, per100 = diff/cnt*100;
  const verdict = per100 <= -6 ? '새 회원의 시작 레이팅이 후한 편입니다. 부수를 실제보다 높게 잡고 있거나 부수당 레이팅이 큽니다. 이대로면 기존 회원 점수가 조금씩 올라갑니다.'
                : per100 >= 6 ? '새 회원의 시작 레이팅이 박한 편입니다. 새로 들어온 분들이 예상보다 잘 치고 있습니다.'
                : '새 회원의 시작 레이팅이 실제와 잘 맞습니다.';
  return `<div class="notice ${Math.abs(per100)>=6?'warn':''}" style="margin:0 0 12px">
    새 회원 첫 10경기 ${cnt}건 · 기대 ${exp.toFixed(1)}승 vs 실제 ${act}승 (100경기당 ${diff>0?'+':''}${per100.toFixed(1)})<br>${verdict}</div>`;
}
function handiDiagHTML(){
  const {n,rate}=handiStat();
  if(!n) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기가 쌓이면 클럽 핸디가 실제로 공정한지 여기서 알려드립니다.</p>`;
  if(n<10) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기 ${n}건 · 핸디 받은 쪽 승률 ${rate}%. 10건은 넘어야 판단할 만합니다.</p>`;
  const verdict = rate>=58 ? '핸디가 후한 편입니다. 부수 차 1당 핸디 점수를 줄여보세요.'
                : rate<=42 ? '핸디가 박한 편입니다. 부수 차 1당 핸디 점수를 늘려보세요.'
                : '클럽 핸디가 공정하게 잡혀 있습니다. 지금 값을 유지하세요.';
  return `<div class="notice ${(rate>=58||rate<=42)?'warn':''}" style="margin:0 0 12px">
    핸디 경기 ${n}건 · 핸디 받은 쪽 승률 <b>${rate}%</b><br>${verdict}</div>`;
}

async function reassignEntrant(fromId, toId){
  let n=0;
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

/* ── 밴드 연동 ──────────────────────────────────────────────
   밴드 댓글은 "@이름 @이름 님 상대 승" 형태다.
   같은 상대와 여러 판이면 "@이름 ×2" 로 적는다. */
const bandNorm = n => String(n||'').replace(/\([^)]*\)/g,'').replace(/님$/,'').trim();
const bandLabel = p => (p && (p.bandName || p.name)) || '';
function parseBandText(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    const win = /승\s*$/.test(line), lose = /패\s*$/.test(line);
    if(!win && !lose) continue;
    const re=/@([^\s@×xX*]+(?:\([^)]*\))?)\s*(?:[×xX*]\s*(\d+))?/g;
    let m;
    while((m=re.exec(line))){
      const raw=String(m[1]).trim(), name=bandNorm(raw);
      if(!name) continue;
      rows.push({raw, name, r: win?'W':'L'});
    }
  }
  const seen={};
  return rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; });
}
/* 한 번 알려준 밴드 이름은 선수에 별칭으로 남겨두고 다음부터 자동으로 맞춘다 */
function matchPlayerByName(raw){
  const r=String(raw||'').trim(), n=bandNorm(r);
  if(!n) return null;
  const A=x=>x.aliases||[];
  let p = S.players.find(x=>x.bandName===r)
       || S.players.find(x=>A(x).includes(r))
       || S.players.find(x=>x.name===n)
       || S.players.find(x=>A(x).some(a=>bandNorm(a)===n))
       || S.players.find(x=>bandNorm(x.name)===n);
  if(p) return p;
  const cands=S.players.filter(x=>x.name.startsWith(n)||n.startsWith(x.name));
  return cands.length===1 ? cands[0] : null;
}
/* 이름 패턴 기억하기 */
async function learnAliases(pairs){          // [{pid, raw}]
  const need=pairs.filter(({pid,raw})=>{
    const p=P(pid); if(!p || !raw) return false;
    return p.bandName!==raw && !(p.aliases||[]).includes(raw);
  });
  if(!need.length) return;
  await savePlayers(map=>{
    for(const {pid,raw} of need){
      const x=map.get(pid); if(!x) continue;
      x.aliases=[...new Set([...(x.aliases||[]), raw])].slice(0,6);
      if(!x.bandName) x.bandName=raw;         // 내보낼 때 쓸 대표 이름
    }
  });
}
/* 내 경기를 밴드 댓글 형식으로 만든다 */
function bandTextFor(meIdStr, date){
  const win={}, lose={};
  for(const m of S.matches){
    if(m.void || m.date!==date) continue;
    if(m.aId!==meIdStr && m.bId!==meIdStr) continue;
    const opp = m.aId===meIdStr ? m.bId : m.aId;
    const box = winnerOf(m)===meIdStr ? win : lose;
    box[opp]=(box[opp]||0)+1;
  }
  const fmt = box => Object.keys(box).map(id=>`@${bandLabel(P(id))||nameOf(id)}`).join(' ');
  const out=[];
  if(Object.keys(win).length)  out.push(`${fmt(win)} 님 상대 승`);
  if(Object.keys(lose).length) out.push(`${fmt(lose)} 님 상대 패`);
  return out.join('\n');
}
