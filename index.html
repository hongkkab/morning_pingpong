}

<script>
/* ─────────────────────────── 저장소 계층 ───────────────────────────
   같은 키 인터페이스 뒤에 두 가지 저장소를 둔다.
   · Firebase 설정이 채워져 있으면 → 실시간 공유 DB (어디서 보든 같은 결과)
   · 아니면 → 이 기기 전용 임시 저장                                    */
const CFG  = window.TT_CONFIG || {};
const CLUB = String(CFG.clubId || 'morning').replace(/[.#$\[\]\/]/g,'-');
const KEY = {
  players:'tt:players', meta:'tt:meta', audit:'tt:audit',
  shard: m => 'tt:matches:'+m, session:'tt:session'
};
const MPRE = 'tt:matches:';
const mem = new Map();
const hasStore = typeof window!=='undefined' && !!window.storage;
let FB = null;                                   // 연결 성공 시에만 채워진다
const online = ()=> !!FB;
const clean  = v => JSON.parse(JSON.stringify(v===undefined?null:v));
const CLIENT = Math.random().toString(36).slice(2,10);   // 내 변경인지 구분하는 값
const asList = v => Array.isArray(v) ? v : (v && typeof v==='object' ? Object.values(v) : v);

const FBM='matches';                 // Firebase 에서는 경기를 개별 레코드로 저장한다
function fbPath(k){
  if(k===KEY.players) return 'players';
  if(k===KEY.meta)    return 'meta';
  if(k===KEY.audit)   return 'audit';
  if(k.startsWith(MPRE)) return FBM;
  if(k.startsWith('tt:photo:')) return 'photos/'+k.slice(9);
  return 'misc/'+k.replace(/[.#$\[\]\/:]/g,'_');
}

/* 한쪽이 막힌 망에서도 붙도록 두 경로를 순서대로 시도한다 */
const SDK_SOURCES = [
  { app:'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js',
    db :'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js',
    au :'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js' },
  { app:'https://esm.sh/firebase@10.12.5/app',
    db :'https://esm.sh/firebase@10.12.5/database',
    au :'https://esm.sh/firebase@10.12.5/auth' }
];
async function loadSDK(){
  let last=null;
  for(const src of SDK_SOURCES){
    try{ return await Promise.all([import(src.app), import(src.db), import(src.au)]); }
    catch(e){ last=e; }
  }
  throw last;
}
async function initFirebase(){
  const c = CFG.firebase;
  if(!c || !c.databaseURL) return null;
  try{
    const [A,D,U] = await loadSDK();
    const app = A.initializeApp(c);
    try{ await U.signInAnonymously(U.getAuth(app)); }catch(e){ /* 익명 로그인 미사용이면 그대로 진행 */ }
    const db = D.getDatabase(app), base = 'clubs/'+CLUB;
    return {
      async get(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? snap.val() : null; },
      async set(pth,v){ await D.set(D.ref(db, base+'/'+pth), clean(v)); return true; },
      async patch(pth,obj){ await D.update(D.ref(db, base+'/'+pth), clean(obj)); return true; },
      async del(pth){ await D.remove(D.ref(db, base+'/'+pth)); return true; },
      async keys(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? Object.keys(snap.val()) : []; },
      watch(cb){ D.onValue(D.ref(db, base+'/sig'), snap=>cb(snap.val())); }
    };
  }catch(e){ console.warn('Firebase 연결 실패:', e); S.fbError=String(e&&e.message||e); return null; }
}
const fbConfigured = ()=> !!(CFG.firebase && CFG.firebase.databaseURL);
/* 예전 버전은 경기를 월별 묶음(shards)으로 저장했다. 개별 레코드 방식으로 한 번 옮긴다.
   원본은 지우지 않고 그대로 둔다. */
async function migrateShards(){
  if(!FB) return;
  try{
    const flat = await FB.get(FBM);
    if(flat && Object.keys(flat).length) return;          // 이미 옮겨졌다
    const sh = await FB.get('shards');
    if(!sh) return;
    const obj={};
    Object.values(sh).forEach(list=>{
      const arr = Array.isArray(list) ? list : Object.values(list||{});
      arr.forEach(m=>{ if(m && m.id) obj[m.id]=m; });
    });
    const n=Object.keys(obj).length;
    if(n){ await FB.patch(FBM, obj); console.info('기존 경기 '+n+'건을 새 저장 방식으로 옮겼습니다.'); }
  }catch(e){ console.warn('기존 데이터 이전 실패:', e); }
}

/* 세션(로그인 상태)은 기기별로만 남는다 */
function localGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ const v=mem.get('p:'+k); return v?JSON.parse(v):null; } }
function localSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem.set('p:'+k,JSON.stringify(v)); } return true; }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){ mem.delete('p:'+k); } return true; }

async function sGet(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localGet(k);
    try{ const r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
  }
  if(FB){ try{ const v=await FB.get(fbPath(k));
                return (k===KEY.players || k.startsWith(MPRE) || k===KEY.audit) ? asList(v) : v; }
          catch(e){ return null; } }
  if(!hasStore){ const v=mem.get('s:'+k); return v?JSON.parse(v):null; }
  try{ const r=await window.storage.get(k,true); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
}
async function sSet(k, val, shared=true){
  if(!shared){
    if(FB || !hasStore) return localSet(k,val);
    return !!(await window.storage.set(k, JSON.stringify(val), false));
  }
  if(FB){ try{ await FB.set(fbPath(k), val); return true; }
          catch(e){ S.lastError = e && (e.message||String(e)); return false; } }
  const str=JSON.stringify(val);
  if(!hasStore){ mem.set('s:'+k, str); return true; }
  return !!(await window.storage.set(k, str, true));
}
async function sDel(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localDel(k);
    try{ await window.storage.delete(k,false); return true; }catch(e){ return false; }
  }
  if(FB){ try{ await FB.del(fbPath(k)); return true; }catch(e){ return false; } }
  if(!hasStore){ mem.delete('s:'+k); return true; }
  try{ await window.storage.delete(k,true); return true; }catch(e){ return false; }
}
async function sList(prefix, shared=true){
  if(FB && prefix===MPRE) return [MPRE+'all'];
  if(FB) return [];
  if(!hasStore) return [...mem.keys()].filter(x=>x.startsWith('s:'+prefix)).map(x=>x.slice(2));
  try{ const r=await window.storage.list(prefix, shared); return r&&r.keys?r.keys:[]; }catch(e){ return []; }
}

/* ─────────────────────────── 기본 설정 ─────────────────────────── */
const DEFAULTS = {
  baseRating:1200,   // 최하위 부수 시작 점수 (부수 랭킹)
  formBase:1500,     // 핸디포함 랭킹 공통 시작 점수
  bestOf:5,          // 3 = 3판2선승, 5 = 5판3선승 (핸디 환산 기본값 산출용)
  handiElo:129,      // 핸디 1점당 레이팅
  perBuOverride:0,   // 부수당 레이팅. 0이면 (부수차1당 핸디 × 핸디1점당)으로 자동 계산
  ptsPerBu:2,        // 부수 차 1당 핸디 점수 (클럽 관행 = 관측값)
  kNew:40, kMid:28, kBase:20,
  newGames:10, midGames:30,
  repeatN0:5,        // 같은 상대와 반복 대결 시 정보량 감쇠 기준 (0이면 사용 안 함)
  poolCeilingBu:0,   // 체감 부수 상한 — 기본은 끔. 데이터가 쌓인 뒤 문제가 보이면 켠다 (예: 1 = 이겨본 상대보다 1부수까지)
  kHalfLife:30,      // 경험치 반감기(일) — 오래 쉬면 K가 다시 올라가 빨리 재조정된다
  formDays:30,       // 선수 카드에서 '요즘'을 보는 기간(일)
  moveDays:1,        // 랭킹의 순위·점수 등락을 비교하는 기간(일). 1이면 직전 경기일 대비
  handiOn:true,      // 핸디 보정 (부수 랭킹에만 적용)
  confirmedOnly:true,      // 양쪽이 확인한 경기만 랭킹에 반영
  provisional:5,     // 이 경기 수 미만은 임시 레이팅
  legacyBefore:'2026-08-05T00:00:00.000Z'   // 임시 운영 기간 — 이전 입력분은 입력자 대신 '관리자 입력'으로 표기
};
/* 11점제 랠리 모델로 푼 값 — 핸디 h점이 상쇄하는 실력차(Elo).
   큰 h에서는 모델이 무핸디 승률 100%를 예측해 신뢰도가 떨어지므로 선형 환산만 사용한다. */
const E_TABLE = { 3:[0,95,204,333,497,714,1019], 5:[0,119,258,429,655,968,1418] };
function modelHandiElo(bestOf, ptsPerBu){
  const t = E_TABLE[bestOf] || E_TABLE[5];
  const h = Math.min(Math.max(1, Math.round(ptsPerBu||1)), 6);
  return Math.round(t[h]/h);
}
const BU_MIN=3, BU_MAX=10;

const S = { players:[], matches:[], meta:null, me:null, tab:'rank', mode:'skill',
            tracks:{skill:{R:{},H:{}},form:{R:{},H:{}}},
            G:{}, W:{}, L:{}, HH:{}, period:null, ready:false, busy:false, connecting:true };

/* ─────────────────────────── 유틸 ─────────────────────────── */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* 클럽이 한국에 있으니 날짜·시간은 항상 한국 시간(KST) 기준으로 다룬다.
   기기 시간대가 달라도 같은 날짜를 보게 된다. */
const TZ='Asia/Seoul';
function ymdKST(d){
  try{
    return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }catch(e){
    return new Date(d.getTime()+9*36e5).toISOString().slice(0,10);
  }
}
const dayAgo = n=> ymdKST(new Date(Date.now()-n*864e5));
const today = ()=> ymdKST(new Date());
function fmtDateTime(iso){
  try{
    const p={};
    new Intl.DateTimeFormat('en-GB',{timeZone:TZ,month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(iso))
      .forEach(x=>{p[x.type]=x.value;});
    return `${p.month}-${p.day} ${p.hour}:${p.minute}`;

function runEngine(mode){

  const R={},H={},G={},LD={},PK={},RG={},PAIR={};
  S.players.forEach(p=>{
    R[p.id] = skill ? baseFor(p.bu) : s.formBase;
    H[p.id] = [{d:p.joinedAt?p.joinedAt.slice(0,10):'', r:R[p.id]}];
    G[p.id] = 0; LD[p.id] = null; PK[p.id] = R[p.id]; RG[p.id] = 0;
  });
  const expAt = id => {                       // 이 경기 시점의 감쇠 경험치
    const m=S._cur; if(!LD[id]) return 0;

  for(const m of S._sorted){
    if(!(m.aId in R)||!(m.bId in R)){ m[dk[0]]=m[dk[1]]=0; continue; }
    S._cur=m;
    const na=expAt(m.aId), nb=expAt(m.bId);

    const pk = m.aId<m.bId ? m.aId+'|'+m.bId : m.bId+'|'+m.aId;
    let met = 0;
    if(PAIR[pk]) met = PAIR[pk].n * Math.pow(0.5, daysBetween(PAIR[pk].d, m.date)/(s.kHalfLife||30));

      if(m.handi.toId===m.bId) eb += m.handi.pts*hElo;
    }
    const expA = 1/(1+Math.pow(10,(eb-ea)/400));
    const sa = winnerOf(m)===m.aId ? 1 : 0;
    const dA = kFor(na)*rep*(sa-expA);

      if(RG[m.bId]>=9 && R[m.bId]>PK[m.bId]){ m._peakB=Math.round(R[m.bId]); }
      PK[m.aId]=Math.max(PK[m.aId],R[m.aId]); PK[m.bId]=Math.max(PK[m.bId],R[m.bId]);

    G[m.aId]=na+1; G[m.bId]=nb+1; RG[m.aId]++; RG[m.bId]++;

    G[m.aId]++; G[m.bId]++;

  S.cap = { skill:{}, form:{} };

  if(marg>0){

    const level = (oid,mode)=> Math.max(S.tracks[mode].R[oid] ?? -Infinity,

      const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
      if(!(w in G) || !(l in G)) continue;

/* 퍼포먼스 레이팅 — 그 성적을 냈을 때 레이팅 변동이 0이 되는 값.
   상대 강도와 실제 승수만 쓰기 때문에 표본이 적어도 뜻이 있다. */
function perfRating(ms, id){
  const g=ms.map(m=>({f: m.aId===id?m._faceA:m._faceB, s: winnerOf(m)===id?1:0}))
            .filter(x=>x.f!=null);
  if(!g.length) return null;
  const score=g.reduce((a,x)=>a+x.s,0);
  const avg=g.reduce((a,x)=>a+x.f,0)/g.length;
  if(score===0)         return {rp:avg-400, n:g.length, score, avg, edge:'low'};
  if(score===g.length)  return {rp:avg+400, n:g.length, score, avg, edge:'high'};
  let lo=0, hi=4000;
  for(let i=0;i<64;i++){
    const mid=(lo+hi)/2;
    const exp=g.reduce((a,x)=>a+1/(1+Math.pow(10,(x.f-mid)/400)),0);
    if(exp<score) lo=mid; else hi=mid;
  }
  return {rp:(lo+hi)/2, n:g.length, score, avg, edge:null};
}
/* 상대 분석 — 표본이 적어도 뜻이 있게, 기대 승수 대비 실제 승수로 본다.
   기대 승수는 그 경기 직전 레이팅과 핸디를 반영한 값이라 상대 수준이 자동으로 보정된다. */
function h2hStats(id){
  const me=P(id); if(!me) return null;
  const mine=(S._sorted||[]).filter(m=>(m.aId===id||m.bId===id) && m._faceA!=null);
  if(!mine.length) return null;
  const opp={};
  let best=null;
  for(const m of mine){
    const oid = m.aId===id ? m.bId : m.aId;
    const face = m.aId===id ? m._faceA : m._faceB;
    const won  = winnerOf(m)===id;
    const o=(opp[oid] = opp[oid] || {oid, w:0, l:0, face:0, n:0, hist:[], handi:null});
    o[won?'w':'l']++; o.face+=face; o.n++;
    o.hist.push({w:won, d:m.date});
    o.handi = (m.handi&&m.handi.pts) ? {mine:m.handi.toId===id, pts:m.handi.pts} : null;
    if(won && (!best || face>best.face)) best={face, oid, date:m.date};
  }
  const list=Object.values(opp).map(o=>({...o, avg:o.face/o.n, rate:rateOf(o.oid,'skill'),
                                         hist:o.hist.slice(-5).reverse()}))
                  .sort((a,b)=>b.rate-a.rate);
  const band={high:{w:0,l:0}, same:{w:0,l:0}, low:{w:0,l:0}};
  for(const m of mine){
    const oid=m.aId===id?m.bId:m.aId, o=P(oid); if(!o) continue;
    const k = o.bu<me.bu ? 'high' : o.bu===me.bu ? 'same' : 'low';
    band[k][winnerOf(m)===id?'w':'l']++;
  }
  const lefty={w:0,l:0}, pimp={w:0,l:0};
  for(const o of Object.values(opp)){ const pp=P(o.oid);
    if(pp&&pp.hand==='L'){ lefty.w+=o.w; lefty.l+=o.l; }
    if(pp&&isPimple(pp)){ pimp.w+=o.w; pimp.l+=o.l; } }
  const nemesis=list.slice().sort((a,b)=>(b.l-b.w)-(a.l-a.w))[0];
  const prey   =list.slice().sort((a,b)=>(b.w-b.l)-(a.w-a.l))[0];
  const solid = x => x && x.n>=3;
  return {list, best, lefty, pimp, band, perf:perfRating(mine,id), n:mine.length,
          nemesis: solid(nemesis)&&nemesis.l>nemesis.w ? nemesis : null,
          prey:    solid(prey)&&prey.w>prey.l ? prey : null};
}
function toggleEl(id,btn){

  el.style.display = open?'none':'block';

/* 새로 들어온 사람의 시작 레이팅이 실제 실력과 맞는지 진단.
   첫 N경기에서 기대 승수보다 실제 승수가 크게 적으면 시작값이 후하다는 뜻이고,
   그만큼 기존 회원들이 점수를 가져가게 된다. */
function entryAccuracy(n=10){
  const seen={}; let exp=0, act=0, cnt=0;
  for(const m of (S._sorted||[])){
    for(const side of [0,1]){
      const id = side? m.bId : m.aId;
      if(!(id in S.G)) continue;
      const c = seen[id]||0;
      if(c<n){
        const e = side ? 1-(m._expA||0.5) : (m._expA||0.5);
        exp += e; act += (winnerOf(m)===id?1:0); cnt++;
      }
      seen[id]=c+1;
    }
  }
  return {cnt, exp, act};
}
/* 부수당 레이팅과 핸디 1점의 값을 경기 결과에서 함께 추정한다.
   선수 개인 편차도 같이 잡아야 두 값이 섞이지 않는다. */
function estimateParams(){
  const ms=[], idx={}, ids=[];
  S.players.forEach(p=>{ idx[p.id]=ids.length; ids.push(p.id); });
  for(const m of (S._sorted||[])){
    if(!(m.aId in idx)||!(m.bId in idx)) continue;
    const A=P(m.aId), B=P(m.bId);
    let h=0;
    if(m.handi&&m.handi.pts) h = (m.handi.toId===m.aId ? m.handi.pts : -m.handi.pts);
    ms.push({a:idx[m.aId], b:idx[m.bId], dbu:(B.bu-A.bu), h, y:winnerOf(m)===m.aId?1:0});
  }
  if(ms.length<40) return {n:ms.length};
  const S0=400/Math.log(10), sig=d=>1/(1+Math.exp(-d/S0));
  let pb=perBu(), he=st().handiElo;
  const off=new Float64Array(ids.length), offSd=110;
  for(let it=0; it<2500; it++){
    let gpb=0, ghe=0; const go=new Float64Array(ids.length);
    for(const m of ms){
      const d = pb*m.dbu + he*m.h + off[m.a]-off[m.b];
      const e = (m.y - sig(d))/S0;
      gpb += e*m.dbu; ghe += e*m.h; go[m.a]+=e; go[m.b]-=e;
    }
    const L=S0*S0/ms.length;
    pb += L*gpb*0.12; he += L*ghe*0.12;
    for(let i=0;i<off.length;i++) off[i] += L*(go[i]-off[i]/(offSd*offSd))*3;
    pb=Math.max(20,Math.min(600,pb)); he=Math.max(5,Math.min(600,he));
  }
  let ll=0;
  for(const m of ms){ const p=sig(pb*m.dbu+he*m.h+off[m.a]-off[m.b]);
    ll += m.y?Math.log(p):Math.log(1-p); }
  return {n:ms.length, perBu:pb, handiElo:he, ll};
}
/* 클럽 핸디가 실제로 공정한지 진단 */
function handiStat(){
  const ms=liveMatches().filter(m=>m.handi&&m.handi.pts>0);
  if(!ms.length) return {n:0};
  const w=ms.filter(m=> winnerOf(m)===m.handi.toId).length;
  return {n:ms.length, rate:Math.round(w/ms.length*100)};
}

/* ─────────────────────────── 로드 / 커밋 ─────────────────────────── */
/* 마지막으로 본 데이터를 기기에 남겨둔다. 다음 접속 때 네트워크를 기다리지 않고 바로 그린다. */
const CACHE_KEY='tt:cache:'+CLUB;
function saveCache(){
  try{
    const json=JSON.stringify({meta:S.meta, players:S.players, matches:S.matches, at:Date.now()});
    if(json.length>1500000) return;                 // 너무 크면 캐시하지 않는다
    localStorage.setItem(CACHE_KEY, json);
  }catch(e){}
}
function loadCache(){
  try{ const v=localStorage.getItem(CACHE_KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
}
async function loadAll(){
  const keys = await sList(MPRE);
  S._shards = keys.length;
  /* 셋을 동시에 가져온다 — 순서대로 기다리면 왕복이 그만큼 쌓인다 */
  const [meta0, players0, ...shards] = await Promise.all([
    sGet(KEY.meta), sGet(KEY.players), ...keys.map(k=>sGet(k))
  ]);
  let meta = meta0;
  if(!meta){ meta = {settings:{...DEFAULTS}, createdAt:new Date().toISOString(), v:1}; sSet(KEY.meta,meta); }
  meta.settings = {...DEFAULTS, ...(meta.settings||{})};
  S.meta = meta;
  S.players = players0 || [];
  const merged=new Map();                       // 같은 id가 여러 조각에 있으면 최신 rev만 남긴다
  for(const m of shards.flat().filter(Boolean)){
    const prev=merged.get(m.id);
    if(!prev || (m.rev||0) >= (prev.rev||0)) merged.set(m.id, m);
  }
  S.matches = [...merged.values()];
  recompute();
  saveCache();
}
/* 경기 저장: 해당 월 샤드만 재읽기 → id 기준 병합 → 기록 후 검증 재시도 */
/* 화면에 먼저 반영한다 — 저장은 뒤에서 끝나도 된다 */
function applyMatches(list){
  const local=new Map(S.matches.map(m=>[m.id,m]));
  list.forEach(m=>local.set(m.id,m));
  S.matches=[...local.values()]; recompute();
}
/* 저장만 담당. 실패하면 원래 상태로 되돌린다 */
async function pushMatches(list, label){
  const before=S.matches.slice();
  applyMatches(list);
  render();
  busyOn(label||'저장 중…');
  let ok=true;
  try{
    if(FB){
      const obj={}; list.forEach(m=>obj[m.id]=m);
      await (list.length>1 ? FB.patch(FBM, obj) : FB.set(FBM+'/'+list[0].id, list[0]));
      bumpSig();
    } else {
      const byShard={};
      list.forEach(m=>{ const k=KEY.shard(monthOf(m.date)); (byShard[k]=byShard[k]||[]).push(m); });
      for(const [k,ms] of Object.entries(byShard)){
        const cur=(await sGet(k))||[];
        const map=new Map(cur.map(m=>[m.id,m]));
        ms.forEach(m=>map.set(m.id,m));
        if(!await sSet(k,[...map.values()])){ ok=false; break; }
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
async function commitMatch(match){
  if(FB){
    try{ await FB.set(FBM+'/'+match.id, match); bumpSig(); }
    catch(e){ S.lastError = e && (e.message||String(e)); return false; }
    applyMatches([match]); return true;
  }
  const key = KEY.shard(monthOf(match.date));
  for(let attempt=0; attempt<3; attempt++){
    const cur = (await sGet(key)) || [];
    const map = new Map(cur.map(m=>[m.id,m]));
    map.set(match.id, match);
    const next = [...map.values()];
    await sSet(key, next);
    const check = (await sGet(key)) || [];
    if(check.some(m=>m.id===match.id && m.rev===match.rev)){
      const local = new Map(S.matches.map(m=>[m.id,m]));
      check.forEach(m=>local.set(m.id,m));
      S.matches=[...local.values()]; recompute(); return true;
    }
    await new Promise(r=>setTimeout(r, 120+Math.random()*250));
  }
  return false;
}
/* 여러 경기를 한 번에 저장 — 빠른 입력에서 왕복을 1회로 줄인다 */
async function commitMatches(list){ return list.length ? pushMatches(list) : true; }
async function savePlayers(mut){
  for(let a=0;a<3;a++){
    const cur=(await sGet(KEY.players))||[];
    const map=new Map(cur.map(p=>[p.id,p]));
    mut(map);
    const next=[...map.values()];
    await sSet(KEY.players,next);
    const chk=(await sGet(KEY.players))||[];
    if(chk.length===next.length){ S.players=chk; recompute(); return true; }
    await new Promise(r=>setTimeout(r,150));
  }
  return false;
}
/* 변경 이력은 뒤에서 조용히 남긴다 — 저장을 기다리느라 화면이 멈추면 안 된다 */

/* ─────────────────────────── 중복 판정 ─────────────────────────── */
/* 같은 날 · 같은 상대 · 같은 승패 = 중복 후보.
   상대가 먼저 넣은 미확인 건이 있으면 → 새 레코드 없이 '상호 확인'으로 승격.
   내가 넣은 건만 있으면 → 진짜 다른 경기인지 물어봄(하루에 같은 결과 반복 가능). */
function dupScan(date, meId, oppId, iWon){
  const same = S.matches.filter(m=>!m.void && m.date===date &&
    ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
  const sameResult = m => (winnerOf(m)===meId) === iWon;
  const cands = same.filter(sameResult);
  const cb = m => m.confirmedBy || [];
  const byOpp = cands.find(m=> m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m));
  const mine  = cands.filter(m=> m.enteredBy===meId || cb(m).includes(meId));
  const conflict = same.filter(m=>!sameResult(m) && m.enteredBy===oppId && !isConfirmed(m));
  return {byOpp, mineCount:mine.length, conflict:conflict[0]||null};
}

function dataSig(){

  for(const m of S.matches){ const k=m.id+(m.rev||0)+(m.void?'v':''); for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; }
  for(const p of S.players){ const k=p.id+p.bu+(p.active===false?'0':'1')+(p.name||''); for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; }
  return S.matches.length+':'+S.players.length+':'+h+':'+JSON.stringify(st());
}

    const b=$('#doLogin'); if(b) b.onclick=doLogin;
    const pin=$('#lpin'); if(pin) pin.onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
    const sel=$('#lname');
    const syncPin=()=>{ const p=P(sel.value); const fresh=p&&!p.pinHash;
      $('#lpinLab').textContent = fresh ? '쓸 PIN 4자리 정하기' : 'PIN 4자리';
      $('#lpinHint').textContent = fresh ? '관리자가 미리 만들어 둔 계정입니다. 여기서 정한 PIN이 앞으로 본인 PIN이 됩니다.'
                                 : (usingDefaultPin(p) ? `초기 PIN ${DEFAULT_PIN}으로 로그인한 뒤 내 정보에서 바꿔주세요.` : '');
      $('#doLogin').textContent = fresh ? 'PIN 설정하고 시작' : '로그인'; };
    if(sel){ sel.onchange=syncPin; syncPin(); }
  };
  const join = ()=>{
    $('#authBody').innerHTML = `
      ${first?`<div class="notice">첫 등록자는 자동으로 관리자가 됩니다.</div>`:''}
      <div class="row"><div class="field" style="flex:2"><label>이름</label><input id="jname" maxlength="12" placeholder="클럽에서 부르는 이름"></div>
      <div class="field"><label>부수</label><select id="jbu">${Array.from({length:BU_MAX-BU_MIN+1},(_,i)=>BU_MIN+i).map(b=>`<option value="${b}" ${b===7?'selected':''}>${b}부</option>`).join('')}</select></div></div>
      <div class="row"><div class="field"><label>주 손</label><select id="jhand"><option value="R">오른손</option><option value="L">왼손</option></select></div>
      <div class="field"><label>러버</label>${rubberSelect('jrub','flat')}</div>
      <div class="field"><label>PIN 4자리</label><input id="jpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div></div>
      <div class="field"><label>한 줄 소개 (선택)</label><input id="jbio" maxlength="40" placeholder="예: 드라이브 위주 / 이면타법 연습 중"></div>
      <button class="btn" id="doJoin">등록하고 시작</button>`;
    $('#doJoin').onclick = doJoin;
  };
  $('#tabLogin').onclick = e=>{ $('#tabLogin').classList.add('on'); $('#tabJoin').classList.remove('on'); login(); };
  $('#tabJoin').onclick  = e=>{ $('#tabJoin').classList.add('on'); $('#tabLogin').classList.remove('on'); join(); };
  first ? ($('#tabJoin').click()) : login();
}
async function doLogin(){
  const id=$('#lname').value, pin=($('#lpin').value||'').trim();
  const p=P(id); if(!p) return;
  if(!p.pinHash){                                  // 관리자가 만들어 둔 계정 넘겨받기
    if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
    const hash=await sha(pin);
    const ok=await savePlayers(map=>{const x=map.get(id); if(x)x.pinHash=hash;});
    if(!ok) return toast('설정에 실패했습니다. 다시 시도해주세요.',1);
    audit('PIN 설정', p.name);
  } else if(p.pinHash!==await sha(pin)) return toast('PIN이 맞지 않습니다.',1);
  S.me=P(id); await sSet(KEY.session,{playerId:id, at:Date.now()},false); S.tab='rank'; render();
  const n=pendingForMe().length;
  toast(n ? `${S.me.name}님 반갑습니다. 확인할 경기가 ${n}건 있습니다.` : `${S.me.name}님 반갑습니다.`);
}
async function doJoin(){
  const name=($('#jname').value||'').trim();
  const pin=($('#jpin').value||'').trim();
  if(name.length<1) return toast('이름을 입력하세요.',1);
  if(S.players.some(p=>p.name===name)) return toast('이미 있는 이름입니다.',1);
  if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
  const p={ id:uid('p'), name, bu:+$('#jbu').value, hand:$('#jhand').value, rubber:$('#jrub').value,
            bio:($('#jbio').value||'').trim(), pinHash:await sha(pin),
            role:S.players.length===0?'admin':'member', active:true, joinedAt:new Date().toISOString() };
  const ok=await savePlayers(map=>map.set(p.id,p));
  if(!ok) return toast('등록에 실패했습니다. 다시 시도해주세요.',1);
  S.me=P(p.id); await sSet(KEY.session,{playerId:p.id, at:Date.now()},false);
  audit('선수 등록', name); S.tab='rank'; render(); toast('등록되었습니다.');
}

/* ── 랭킹 ── */
function viewRank(){
  const mode=S.mode, other = mode==='skill' ? 'form' : 'skill';
  const sl = seasons();
  if(!S.period) S.period = sl.length ? sl[sl.length-1] : monthOfNow();
  const per = S.period;
  const rows = standings(per, mode);
  const MV = st().moveDays || 1;
  let prevRank = {};
  if(per==='all'){ prevRank = ranksAt(dayAgo(MV), mode); }
  else {
    const idx=sl.indexOf(per), pv = idx>0 ? sl[idx-1] : null;
    if(pv) standings(pv, mode).filter(r=>r.g>=(st().provisional||0))
             .forEach((r,i)=>prevRank[r.p.id]=i+1);
  }
  const sIdx = sl.indexOf(per);
  const sPrev = sIdx>0 ? sl[sIdx-1] : null;
  const sNext = sIdx>=0 && sIdx<sl.length-1 ? sl[sIdx+1] : null;
  const seasonName = ym => ym.slice(0,4)+'년 '+(+ym.slice(5))+'월';
  $('#view').innerHTML = `
    <h2>랭킹</h2>
    <div class="seg" style="margin-bottom:10px">
      <button data-mode="skill" class="${mode==='skill'?'on':''}">${MODES.skill.label}</button>
      <button data-mode="form" class="${mode==='form'?'on':''}">${MODES.form.label}</button>
    </div>
    <div class="seasonbar">
      ${per==='all'
        ? `<div class="sl">통산 랭킹</div>
           <button class="sb" data-per="${sl.length?sl[sl.length-1]:monthOfNow()}">시즌으로</button>`
        : `<button class="sa" data-per="${sPrev||''}" ${sPrev?'':'disabled'}>‹</button>
           <div class="sl">${seasonName(per)} 시즌${sNext?'':' <span class="now">진행 중</span>'}</div>
           <button class="sa" data-per="${sNext||''}" ${sNext?'':'disabled'}>›</button>
           <button class="sb" data-per="all">통산</button>`}
    </div>
    <p class="tiny dim" style="margin:0 2px 12px">${per==='all'?MODES[mode].note
      :`그 달 경기만으로 부수에서 새로 계산한 시즌 순위입니다.${sPrev?' 화살표는 지난 시즌 순위 대비입니다.':''}`}</p>
    <div class="split tiny dim" style="margin:0 2px 9px">
      <span>선수 ${rows.length}명</span><span>총 ${liveMatches().length}경기</span></div>
    ${(()=>{ const MIN=st().provisional||0;
      const qual=rows.filter(r=>r.g>=MIN), few=rows.filter(r=>r.g<MIN);
      const card=(r,i,ranked)=>{
        const d=deltaOf(r.p.id,mode,MV);
        const idle=idleDays(r.p.id);
        const rr=recentRecord(r.p.id), rf=recentForm(r.p.id);
        const was=ranked?prevRank[r.p.id]:0, mv=(ranked&&was)?was-(i+1):0;
        const medal = ranked && i<3;
        return `<button class="rk ${medal?'md md'+(i+1):''} ${ranked?'':'unranked'} ${r.p.id===meId()?'me':''}" data-pid="${r.p.id}" style="${idle!==null&&idle>45?'opacity:.55':''}">
          <div class="pos">${medal?`<span class="medal m${i+1}">${i+1}</span>`:(ranked?i+1:'–')}${mv?`<span class="mv ${mv>0?'up':'down'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:''}</div>
          <div class="who">
            <div class="nm">${esc(r.p.name)}<span class="badge">${r.p.bu}부</span>${r.p.hand==='L'?'<span class="badge b">왼손</span>':''}${rubberTag(r.p)}</div>
            <div class="sub"><span>${per==='all'?'통산':'시즌'} ${r.w}−${r.l}${r.g?` · ${Math.round(r.w/r.g*100)}%`:''}</span>
              <span class="form">${rf.map(x=>`<span class="${x.w?'w':'l'}" title="${x.d} ${esc(x.opp)} 상대 ${x.w?'승':'패'}">${x.w?'W':'L'}</span>`).join('')}</span></div>
            <div class="sub2">${ranked
              ? (mode==='skill'
                  ? `체감 ${buText(r.r)}${Math.round(buScale(r.r))!==r.p.bu?` <span class="${buScale(r.r)<r.p.bu?'up':'down'}">(등록 ${r.p.bu}부)</span>`:''} · ${MODES.form.label} ${Math.round(rateOf(r.p.id,'form'))}`
                  : `체감 ${buText(rateOf(r.p.id,'skill'))}`)
              : `${r.g}경기 · ${st().provisional}경기부터 순위에 들어갑니다`
            }${ranked&&per==='all'&&rr.g>=5?` · 최근 ${rr.g}경기 ${rr.w}−${rr.l}`:''}${idle!==null&&idle>7?` · ${idle}일 전 출전`:''}</div>
          </div>
          <div class="rt"><div class="v">${Math.round(r.r)}</div>
          ${ranked?`<div class="d ${d>0.5?'up':d<-0.5?'down':'dim'}">${d>0?'▲':d<0?'▼':'–'} ${Math.abs(Math.round(d))||0}</div>`:''}</div>
        </button>`;
      };
      if(!rows.length) return `<div class="empty">아직 등록된 선수가 없습니다.</div>`;
      return (qual.length ? qual.map((r,i)=>card(r,i,true)).join('')
                          : `<div class="empty">아직 ${MIN}경기를 채운 선수가 없습니다.</div>`)
        + (few.length ? `<div class="secttl" style="margin:18px 2px 8px">경기 부족 · ${few.length}명</div>
            <p class="tiny dim" style="margin:0 2px 10px">${MIN}경기를 채우면 순위에 들어갑니다. 그전까지는 부수 기준값에 가깝게 표시됩니다.</p>`
            + few.map((r,i)=>card(r,i,false)).join('') : '');
    })()}
    ${S.me?'':`<div class="card" style="margin-top:12px"><div class="split">
      <div><div style="font-weight:600">나의 경기 기록</div>
      <div class="tiny dim" style="margin-top:3px">로그인하면 내 전적과 경기 입력을 쓸 수 있습니다.</div></div>
      <button class="btn sm" id="goLogin">로그인</button></div></div>`}
    ${per!=='all'?'':`<p class="tiny dim" style="margin:14px 2px 4px">${mode==='skill'
      ? `핸디 1점을 ${Math.round(handiElo())}점으로 보고, 여기서 부수당 ${Math.round(perBu())}점이 따라옵니다(${BU_MAX}부 ${baseFor(BU_MAX)} 시작). 핸디가 제대로 잡힌 경기는 기대 승률이 5:5라, 이겨야 오르고 져야 내려갑니다.`
      : `전원 ${st().formBase}점에서 시작합니다. 핸디를 그대로 인정하고 승패만 반영해서, 자기 부수·핸디 조건 대비 얼마나 잘 치는지를 봅니다.`} 오른쪽 화살표와 순위 옆 화살표는 ${MV===1?'직전 경기일':MV+'일 전'} 대비 등락이고, ${st().kHalfLife}일마다 예전 경기의 무게가 절반으로 줄어 지금 상태에 가깝게 유지됩니다.</p>`}`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;viewRank();});
  document.querySelectorAll('[data-per]').forEach(b=>{ if(b.dataset.per)
    b.onclick=()=>{S.period=b.dataset.per;viewRank();}; });
  if($('#goLogin')) $('#goLogin').onclick=()=>{ S.tab='login'; render(); };
  document.querySelectorAll('.rk').forEach(b=>b.onclick=()=>playerSheet(b.dataset.pid));
}

/* ── 경기 입력 ── */
/* 회원은 어제까지만 입력할 수 있다. 며칠 지난 기억으로 넣으면 서로 안 맞는 경우가 많아서다.
   관리자는 제한 없이 소급 입력할 수 있고, 이미 들어간 경기는 '날짜 수정'으로 언제든 옮긴다. */
const minEntryDate = ()=> isAdmin() ? '' : dayAgo(1);
const dateOK = d => !!d && d<=today() && (isAdmin() || d>=dayAgo(1));
const shiftDate = (d,n)=>{ const [y,m,dd]=d.split('-').map(Number);
  const x=new Date(y,m-1,dd+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dateLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  const wk=['일','월','화','수','목','금','토'][new Date(y,m-1,dd).getDay()];
  const rel = d===today()?' · 오늘' : d===dayAgo(1)?' · 어제' : '';
  return `${m}월 ${dd}일 (${wk})${rel}`;
}
/* 화살표로도 바꾸고 달력으로도 고를 수 있게 둘 다 둔다 — 기기에 따라 달력이 안 열리는 경우가 있어서다 */
function dateField(id, val){
  /* 달력 입력창은 숨겨두고 화살표로 조작한다. 가운데 날짜를 누르면 달력이 뜨는 기기에서는 달력도 열린다. */
  return `<div class="field" style="position:relative">
    <div class="daterow">
      <button data-ds="-1" ${dateOK(shiftDate(val,-1))?'':'disabled'}>‹</button>
      <button class="dlab" data-dpick>${dateLabel(val)}</button>
      <button data-ds="1" ${dateOK(shiftDate(val,1))?'':'disabled'}>›</button>
    </div>
    <input type="date" id="${id}" value="${val}" max="${today()}" min="${minEntryDate()}"
           style="position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;padding:0;border:none">
    <p class="tiny dim" style="margin:7px 2px 0">${isAdmin()?'관리자는 지난 날짜도 넣을 수 있습니다.':'오늘과 어제까지 입력할 수 있습니다. 더 지난 경기는 관리자에게 요청하세요.'}</p>
  </div>`;
}
function bindDateField(id, get, apply){
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
    const nd=shiftDate(get(), +b.dataset.ds);
    if(dateOK(nd)) apply(nd);
  });
  const el=$('#'+id); if(!el) return;
  const pick=document.querySelector('[data-dpick]');
  if(pick) pick.onclick=()=>{ try{ el.showPicker ? el.showPicker() : el.focus(); }catch(e){} };
  el.onchange=e=>{ const v=e.target.value;
    if(!v){ e.target.value=get(); return; }
    if(!dateOK(v)){ e.target.value=get(); return toast('입력할 수 없는 날짜입니다.',1); }
    apply(v);
  };
}
let draft = null;
let addMode = 'quick';
const addSeg = ()=>`<div class="seg" style="margin-bottom:12px">
  <button data-am="quick" class="${addMode==='quick'?'on':''}">빠른 입력</button>
  <button data-am="one" class="${addMode==='one'?'on':''}">한 경기씩</button></div>`;
const bindAddSeg = ()=>document.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>{addMode=b.dataset.am;viewAddRouter();});
function viewAddRouter(){ return addMode==='quick' ? viewAddQuick() : viewAdd(); }

/* 빠른 입력 — 그날 붙은 상대를 한 번에 찍고 저장한다.
   칩을 누를 때마다 승 → 패 → 해제로 돌고, 오른쪽 숫자를 누르면 판수가 늘어난다. */
let bulk = null;
function viewAddQuick(){

  if(!bulk) bulk = { date:today(), meId:S.me.id, picks:{} };
  if(!dateOK(bulk.date)) bulk.date = today();          // 하루 넘겨 열어둔 화면 보정
  if(!isAdmin()) bulk.meId = S.me.id;
  if(!P(bulk.meId)) bulk.meId = S.me.id;
  const opp = list.filter(p=>p.id!==bulk.meId);
  const picks = bulk.picks;
  const wN = Object.values(picks).filter(x=>x.r==='W').length;
  const lN = Object.values(picks).filter(x=>x.r==='L').length;

  $('#view').innerHTML = `
    <h2>경기 입력</h2>
    ${addSeg()}
    ${opp.length<1?`<div class="empty">상대할 선수가 아직 없습니다.</div>`:`
    <div class="card">
      ${dateField('bdate', bulk.date)}
      ${isAdmin()?`<div class="field"><label>기준 선수</label><select id="bme">
        ${list.map(p=>`<option value="${p.id}" ${p.id===bulk.meId?'selected':''}>${esc(p.name)} · ${p.bu}부</option>`).join('')}
      </select></div>`:''}
      <div class="field" style="margin-bottom:6px"><label>상대를 눌러 결과 표시 — 한 번 승, 두 번 패, 세 번 해제 (하루 한 판 기준)</label>
        <div class="picks">
          ${opp.map(p=>{ const k=picks[p.id];
            return `<div class="pk ${k?(k.r==='W'?'w':'l'):''}">
              <button class="nm" data-pick="${p.id}">${esc(p.name)}<small>${p.bu}부${p.hand==='L'?' · 왼손':''}${isPimple(p)?' · '+RUBBER[rubberOf(p)]:''}</small></button>
              ${k?`<span class="ct">${k.r==='W'?'승':'패'}</span>`:''}
            </div>`;}).join('')}
        </div>
      </div>
      <div class="tally"><span><b>${wN}</b>승</span><span><b>${lN}</b>패</span>
        <span style="margin-left:auto">${wN+lN?`총 ${wN+lN}경기`:'아직 선택 없음'}</span></div>
      <hr class="sep">
      <button class="btn" id="bSave" ${wN+lN?'':'disabled'}>${wN+lN?`${wN+lN}경기 한 번에 등록`:'상대를 선택하세요'}</button>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost sm" id="bImp">밴드 글 붙여넣기</button>
        <button class="btn ghost sm" id="bExp">밴드 형식으로 복사</button>
      </div>
      <p class="tiny dim" style="margin:9px 2px 0">핸디는 부수 차이로 자동 계산됩니다. 이미 등록됐거나 상대가 먼저 넣은 경기는 알아서 건너뛰거나 합칩니다.
      ${isAdmin()?'':'세부 조정이 필요하면 위에서 한 경기씩으로 바꾸세요.'}</p>
    </div>
    <h2>${bulk.date===today()?'오늘':bulk.date===dayAgo(1)?'어제':fmtDate(bulk.date)} 등록된 경기</h2>
    ${matchListHTML(S.matches.filter(m=>m.date===bulk.date&&!m.void))}`}`;

  bindAddSeg();
  if(opp.length){
    bindDateField('bdate', ()=>bulk.date, v=>{ bulk.date=v; viewAddQuick(); });
    if($('#bme')) $('#bme').onchange=e=>{ bulk.meId=e.target.value; bulk.picks={}; viewAddQuick(); };
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.pick, cur=picks[id];
      if(!cur) picks[id]={r:'W',n:1};
      else if(cur.r==='W') picks[id]={r:'L',n:1};
      else delete picks[id];
      viewAddQuick();
    });
    $('#bSave').onclick=submitBulk;
    $('#bImp').onclick=bandImportSheet;
    $('#bExp').onclick=bandExportSheet;
  }
  bindMatchActions();
}

/* picks = { 상대id: {r:'W'|'L', n:판수} } — 중복은 건너뛰고 상대 입력분은 합친다 */
async function planAndSave(date, meId, picks, label){
  /* 관리자가 입력한 경기는 본인이 뛴 것이든 아니든 바로 확정으로 본다.
     회원이 자기 경기를 넣은 경우에만 상대 확인을 기다린다. */
  const needConfirm = !isAdmin() && meId===S.me.id;
  const confirmIds = oppId => needConfirm ? [S.me.id] : [meId, oppId];
  const draftList = S.matches.slice();
  const scan = (oppId,iWon)=>{
    const same=draftList.filter(m=>!m.void && m.date===date &&
      ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
    const ok=m=>(winnerOf(m)===meId)===iWon;
    const cands=same.filter(ok), cb=m=>m.confirmedBy||[];
    return { byOpp: cands.find(m=>m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m)),
             mineCount: cands.filter(m=>m.enteredBy===meId || cb(m).includes(meId)).length };
  };
  const writes=[]; let created=0, merged=0, skipped=0;
  for(const [oppId,k] of Object.entries(picks)){
    if(!P(oppId) || oppId===meId) continue;
    const iWon = k.r==='W';
    const s0 = scan(oppId,iWon);
    let need = Math.max(0, k.n - s0.mineCount);
    skipped += k.n - need;
    while(need>0){
      const sc = scan(oppId,iWon);
      if(!sc.byOpp) break;
      const upd={...sc.byOpp, confirmedBy:[...new Set([...(sc.byOpp.confirmedBy||[]), ...confirmIds(oppId)])],
                 status:'confirmed', rev:(sc.byOpp.rev||0)+1};
      writes.push(upd);
      const i=draftList.findIndex(m=>m.id===upd.id); if(i>=0) draftList[i]=upd;
      merged++; need--;
    }
    const a=P(meId), b=P(oppId);
    const hTo = a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';
    const hPts = hTo ? Math.abs(a.bu-b.bu)*st().ptsPerBu : 0;
    for(let i=0;i<need;i++){
      const m={ id:uid('m'), rev:1, date, aId:meId, bId:oppId, winnerId: iWon?meId:oppId,
                handi: hTo?{toId:hTo, pts:hPts}:null, note:'',
                enteredBy:S.me.id, enteredAt:new Date(Date.now()+i).toISOString(),
                confirmedBy: confirmIds(oppId), status: needConfirm?'single':'confirmed', void:false };
      writes.push(m); draftList.push(m); created++;
    }
  }
  let ok=true;
  if(writes.length){ busyOn(`${writes.length}건 저장 중…`); ok=await commitMatches(writes); }
  return {ok, created, merged, skipped, count:writes.length};
}
async function submitBulk(){
  if(S.busy) return;
  const live=$('#bdate'); if(live&&live.value) bulk.date=live.value;
  const date=bulk.date, meId=bulk.meId;
  if(!dateOK(date)) return toast(date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);
  if(!Object.keys(bulk.picks).length) return;

  S.busy=true; busyOn('정리하는 중…');
  const r=await planAndSave(date, meId, bulk.picks);
  S.busy=false; busyOff();
  if(!r.ok) return errorSheet('저장하지 못했습니다','경기를 저장하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('빠른 입력', `${nameOf(meId)} · ${date} · 등록 ${r.created} / 합침 ${r.merged} / 건너뜀 ${r.skipped}`);
  bulk={ date, meId, picks:{} };
  render();
  const parts=[];
  if(r.created) parts.push(`${r.created}건 등록`);
  if(r.merged)  parts.push(`${r.merged}건 상대 입력과 합침`);
  if(r.skipped) parts.push(`${r.skipped}건 건너뜀`);
  toast(parts.length?parts.join(' · '):'새로 등록할 경기가 없었습니다.');
}

async function submitMatch(force){
  if(S.busy) return; 
  const d={...draft};
  const live=$('#fdate'); if(live&&live.value) d.date=draft.date=live.value;   // 달력에서 고르고 바로 등록해도 반영되게
  if(!d.bId||d.aId===d.bId) return toast('상대를 선택하세요.',1);

  if(!isAdmin() && d.aId!==S.me.id && d.bId!==S.me.id) return toast('본인 경기만 입력할 수 있습니다.',1);
  if(!dateOK(d.date)) return toast(d.date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);

  const meId = isAdmin()? d.aId : S.me.id;
  const oppId = meId===d.aId ? d.bId : d.aId;
  const winnerId = d.aWon ? d.aId : d.bId;
  const iWon = winnerId===meId;
  /* 관리자가 넣은 경기는 바로 확정. 회원이 자기 경기를 넣은 경우만 상대 확인을 기다린다 */
  const needConfirm = !isAdmin() && (d.aId===S.me.id || d.bId===S.me.id);
  const confirmIds = needConfirm ? [S.me.id] : [d.aId, d.bId];

  if(force!==true){
    const {byOpp, mineCount, conflict} = dupScan(d.date, meId, oppId, iWon);
    if(byOpp){                                   // 상대가 먼저 넣은 동일 경기 → 확인 처리
      S.busy=true;
      const upd={...byOpp, confirmedBy:[...new Set([...(byOpp.confirmedBy||[]), ...confirmIds])], status:'confirmed', rev:(byOpp.rev||0)+1};
      busyOn('상대 입력분과 합치는 중…');
      const ok=await commitMatch(upd); S.busy=false; busyOff();
      if(!ok) return errorSheet('저장하지 못했습니다','상대가 올린 경기와 합치는 중 문제가 생겼습니다.');
      audit('중복 병합', `${nameOf(meId)} vs ${nameOf(oppId)} ${d.date}`);
      draft=null; render(); return toast('상대가 이미 입력한 경기라 하나로 합치고 상호 확인 처리했습니다.');
    }
    if(conflict){                                 // 같은 날 같은 상대인데 승패가 반대
      return confirmSheet('승패가 서로 다릅니다',
        `${esc(nameOf(oppId))}님은 같은 날 <b>본인이 ${winnerOf(conflict)===oppId?'이겼다':'졌다'}</b>고 입력했습니다.<br>지금 입력하려는 건 <b>내가 ${iWon?'이김':'짐'}</b>입니다.<br><br>다른 경기였다면 그대로 등록하고, 같은 경기인데 한쪽이 잘못 넣은 거라면 취소 후 상대와 맞춰주세요.`,
        '다른 경기입니다 · 등록', ()=>submitMatch(true));
    }
    if(mineCount>0){                              // 이미 등록된 경기
      return toast(`${nameOf(oppId)}님과의 그날 경기는 이미 등록돼 있습니다.`,1);
    }
  }

  const handiTo = draft.handiTo==='auto'
    ? (()=>{const a=P(d.aId),b=P(d.bId); return a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';})() : draft.handiTo;
  const handiPts = handiTo ? (draft.handiPts ?? Math.abs(P(d.aId).bu-P(d.bId).bu)*st().ptsPerBu) : 0;

  const m={ id:uid('m'), rev:1, date:d.date, aId:d.aId, bId:d.bId, winnerId,
            handi: handiTo? {toId:handiTo, pts:handiPts} : null,
            note:(d.note||'').trim(),
            enteredBy:S.me.id, enteredAt:new Date().toISOString(),
            confirmedBy:confirmIds, status:needConfirm?'single':'confirmed', void:false };
  S.busy=true;
  const ok=await pushMatches([m]);
  S.busy=false;
  if(!ok) return errorSheet('저장하지 못했습니다','경기를 등록하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('경기 등록', `${nameOf(winnerId)} 승 vs ${nameOf(winnerId===m.aId?m.bId:m.aId)} (${m.date})`);
  const saved=S.matches.find(x=>x.id===m.id)||m;
  const ds=Math.round(saved.aId===S.me.id?(saved._sA||0): saved.bId===S.me.id?(saved._sB||0):0);
  const df=Math.round(saved.aId===S.me.id?(saved._fA||0): saved.bId===S.me.id?(saved._fB||0):0);
  draft={...draft, note:''};
  render(); toast((ds||df)? `등록 완료 · ${MODES.skill.label} ${ds>0?'+':''}${ds} · ${MODES.form.label} ${df>0?'+':''}${df}` : '등록 완료');
}

/* ── 기록 ── */
function matchCardHTML(m){
  const win=winnerOf(m), lose=loserOf(m);
  const mine=isMine(m), done=isConfirmed(m);
  const iWon = mine && win===S.me.id;
  const meMark = pid => pid===meId() ? '<i class="mem">나</i>' : '';
  const canDel = !!S.me && (isAdmin() || (m.enteredBy===S.me.id && !done));
  const canOk  = !!S.me && mine && !done && !(m.confirmedBy||[]).includes(S.me.id);
  const legacy = (m.enteredAt||'') < (st().legacyBefore||'');
  const proxy  = m.enteredBy!==m.aId && m.enteredBy!==m.bId;
  const byLabel = (legacy||proxy) ? '관리자 입력' : esc(nameOf(m.enteredBy))+' 입력';

  const dW = Math.round(Math.abs(win===m.aId ? (m._sA||0) : (m._sB||0)));
  const dL = Math.round(Math.abs(win===m.aId ? (m._sB||0) : (m._sA||0)));
  const peakW = win===m.aId ? m._peakA : m._peakB;

  let meta='';
  if(m._expA!=null){
    const favId = m._expA>=0.5 ? m.aId : m.bId;
    const favP  = Math.min(99, Math.round(Math.max(m._expA,1-m._expA)*100));
    const up    = win!==favId && favP>=58;
    meta += up ? `<span class="ups">이변</span>` : '';
    meta += `<span class="${favP>=70?'hot':''}">예상 ${esc(nameOf(favId))} ${favP}%</span>`;
  }
  if(m.handi&&m.handi.pts) meta += `<span>핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}</span>`;
  if(peakW) meta += `<span class="peak" title="${MODES.skill.label} 랭킹 기준, 이 경기로 본인 최고 레이팅을 넘어섰습니다">개인 최고 ${peakW}</span>`;
  if(!done) meta += `<span class="hot">${(m.confirmedBy||[]).includes(meId())?'상대 확인 대기':'내 확인 필요'}${st().confirmedOnly?' · 랭킹 미반영':''}</span>`;

  return `<div class="mt ${mine?(iWon?'mine mw':'mine ml'):''}">
    <button class="mrow" data-exp="${m.id}">
      <div class="side"><span class="rs w">승</span>
        <span class="pn ${win===meId()?'me':''}">${esc(nameOf(win))}${meMark(win)}${buOf(win)?`<em>(${buOf(win)}부)</em>`:''}</span>
        <span class="dl up">+${dW}</span></div>
      <div class="side"><span class="rs l">패</span>
        <span class="pn dim ${lose===meId()?'me':''}">${esc(nameOf(lose))}${meMark(lose)}${buOf(lose)?`<em>(${buOf(lose)}부)</em>`:''}</span>
        <span class="dl down">−${dL}</span></div>
      ${meta?`<div class="mmeta">${meta}</div>`:''}
    </button>
    <div class="macts" id="act_${m.id}" style="display:none">
      <div class="info">${m.date} · ${done?'상호 확인':'상대가 확인하면 랭킹에 반영됩니다'} · ${byLabel}${m.note?' · '+esc(m.note):''}</div>
      ${canDel?`<button class="btn ghost sm" data-date="${m.id}">날짜 수정</button>
                <button class="btn ghost sm" data-void="${m.id}">삭제</button>`:''}
      ${canOk?`<button class="btn ghost sm" data-ok="${m.id}">이 경기 확인</button>`:''}
      ${(!canDel&&!canOk)?'<span class="tiny dim">수정 권한이 없습니다.</span>':''}
    </div>
  </div>`;
}
function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  const sorted=list.slice().sort((a,b)=>(b.date+b.enteredAt).localeCompare(a.date+a.enteredAt));
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
/* 경기 삭제 — 보관하지 않고 바로 지운다 */
async function deleteMatchById(id){
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>m.id!==id); recompute(); render();
  busyOn('삭제 중…');
  let ok=true;
  try{
    if(FB){ await FB.del(FBM+'/'+id); bumpSig(); }
    else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>x.id===id)) continue;
        if(!await sSet(k, cur.filter(x=>x.id!==id))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 선수를 지울 때 그 사람 경기도 함께 지운다 */
async function deleteMatchesOf(pid){
  const targets=S.matches.filter(m=>m.aId===pid||m.bId===pid);
  if(!targets.length) return 0;
  try{
    if(FB){
      const obj={}; targets.forEach(m=>obj[m.id]=null);   // null 을 넣으면 그 레코드가 지워진다
      await FB.patch(FBM, obj); bumpSig();
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        const next=cur.filter(m=>m.aId!==pid && m.bId!==pid);
        if(next.length!==cur.length) await sSet(k,next);
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); return 0; }
  S.matches=S.matches.filter(m=>m.aId!==pid && m.bId!==pid); recompute();
  return targets.length;
}
/* 날짜만 바꾼다. 개별 레코드 방식이라 옮길 필요가 없다 */
async function moveMatchDate(m, newDate){
  const upd={...m, date:newDate, rev:(m.rev||0)+1, editedBy:S.me.id, editedAt:new Date().toISOString()};
  if(FB) return pushMatches([upd]);
  const newKey=KEY.shard(monthOf(newDate));
  if(!await commitMatch(upd)) return false;
  for(const k of (await sList(MPRE))){
    if(k===newKey) continue;
    const cur=(await sGet(k))||[];
    if(cur.some(x=>x.id===m.id)) await sSet(k, cur.filter(x=>x.id!==m.id));
  }
  await loadAll();
  return true;
}
function dateSheet(id){
  const m=S.matches.find(x=>x.id===id); if(!m) return;
  const sh=sheet('경기 날짜 수정', `
    <p class="tiny dim">${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))}</p>
    <div class="field" style="margin-top:12px"><label>날짜</label>
      <input type="date" id="mdNew" value="${m.date}" max="${today()}" min="${minEntryDate()}"></div>
    <p class="tiny dim">몰아서 기록하다 날짜가 밀린 경우에 쓰세요. 날짜를 바꾸면 그 순서대로 레이팅이 다시 계산됩니다.</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" id="mdNo">취소</button><button class="btn" id="mdYes">저장</button></div>`);
  sh.querySelector('#mdNo').onclick=()=>sh.remove();
  sh.querySelector('#mdYes').onclick=async()=>{
    const nd=sh.querySelector('#mdNew').value;
    if(!nd) return toast('날짜를 선택하세요.',1);
    if(!dateOK(nd)) return toast(nd>today()?'미래 날짜는 넣을 수 없습니다.':'오늘과 어제로만 옮길 수 있습니다.',1);
    sh.remove();
    if(nd===m.date) return;
    const ok=await moveMatchDate(m, nd);
    if(!ok) return errorSheet('수정하지 못했습니다','날짜를 옮기는 중 문제가 생겼습니다.');
    audit('날짜 수정', `${m.date} → ${nd}`);
    viewLog.month=nd.slice(0,7); if(viewLog.day) viewLog.day=nd;
    render(); toast('날짜를 바꿨습니다.');
  };
}

/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>m._expA!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = w===m.aId ? m._expA : 1-m._expA;
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=0.42) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function sparkline(id,mode){
  const h=(trk(mode).H[id]||[]).map(x=>x.r); if(h.length<2) return '';
  const w=300,ht=64,lo=Math.min(...h),hi=Math.max(...h),sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${d} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>

}

/* 얼굴만 동그랗게 잘라 저장한다. 확대·위치를 직접 맞출 수 있다. */
function faceCropSheet(file, done){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const st2={zoom:1.15, x:0, y:-0.08};
      const sh=sheet('얼굴 맞추기', `
        <p class="tiny dim">동그라미 안에 얼굴이 오도록 맞춰주세요.</p>
        <div class="cropwrap"><canvas id="cropCv" width="300" height="300"></canvas><div class="cropring"></div></div>
        <div class="field"><label>확대</label><input type="range" id="czoom" min="100" max="320" value="115"></div>
        <div class="row">
          <div class="field"><label>좌우</label><input type="range" id="cx" min="-50" max="50" value="0"></div>
          <div class="field"><label>상하</label><input type="range" id="cy" min="-50" max="50" value="-8"></div>
        </div>
        <button class="btn" id="cok">이 얼굴로 저장</button>`);
      const cv=sh.querySelector('#cropCv'), cx=cv.getContext('2d');
      const draw=()=>{
        const S2=300; cx.clearRect(0,0,S2,S2);
        cx.fillStyle='#0d1a23'; cx.fillRect(0,0,S2,S2);
        const base=Math.max(S2/im.width, S2/im.height)*st2.zoom;
        const w=im.width*base, h=im.height*base;
        cx.drawImage(im, (S2-w)/2 + st2.x*S2, (S2-h)/2 + st2.y*S2, w, h);
      };
      draw();
      sh.querySelector('#czoom').oninput=e=>{ st2.zoom=+e.target.value/100; draw(); };
      sh.querySelector('#cx').oninput=e=>{ st2.x=+e.target.value/100; draw(); };
      sh.querySelector('#cy').oninput=e=>{ st2.y=+e.target.value/100; draw(); };
      sh.querySelector('#cok').onclick=()=>{ sh.remove(); done(cv.toDataURL('image/jpeg',0.78)); };
    };
    im.onerror=()=>done(null);
    im.src=fr.result;
  };
  fr.onerror=()=>done(null);
  fr.readAsDataURL(file);
}

/* 통산 순위 기록 */
function rankStats(id, mode){
  const dates=playDates(); if(!dates.length) return null;
  const first=(S._sorted||[]).find(m=>m.aId===id||m.bId===id);
  if(!first) return null;
  const rs=[];
  for(const d of dates){
    if(d<first.date) continue;
    const map=ranksAt(d, mode);
    if(map[id]) rs.push(map[id]);
  }
  if(!rs.length) return null;
  return {best:Math.min(...rs), avg:rs.reduce((a,b)=>a+b,0)/rs.length, n:rs.length};
}
function seasonWins(id, mode){
  const yms=seasons(); let wins=0, played=0;
  for(const ym of yms){
    const rows=standings(ym, mode).filter(r=>r.g>=(st().provisional||0));
    if(!rows.length) continue;
    if(rows.some(r=>r.p.id===id)) played++;
    if(rows[0].p.id===id) wins++;
  }
  return {wins, played};
}

function renderCardBox(box, id){
  if(!box) return;

  const mine = S.me && (S.me.id===id || isAdmin());
  box.innerHTML = tradeCard(id, per) + `<div class="seasonchips">
    <button data-cs="all" class="${per==='all'?'on':''}">통산</button>
    ${yms.slice().reverse().map(y=>`<button data-cs="${y}" class="${per===y?'on':''}">${+y.slice(5)}월</button>`).join('')}
  </div>${mine?`<div class="phrow">
    <button class="btn ghost sm" data-ph>${(S.photos||{})[id]?'얼굴 바꾸기':'얼굴 넣기'}</button>
    ${(S.photos||{})[id]?`<button class="btn ghost sm" data-phdel>얼굴 지우기</button>`:''}
  </div>`:''}`;
  box.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{ S.cardSeason=b.dataset.cs; renderCardBox(box,id); });

  if(card) card.onclick=()=>card.classList.toggle('flipped');
  const ph=box.querySelector('[data-ph]');
  if(ph) ph.onclick=()=>{

      faceCropSheet(f, async data=>{

        S.photos=S.photos||{}; S.photos[id]=data;
        renderCardBox(box,id); toast('카드에 얼굴을 넣었습니다.');
      });
    };
    inp.click();
  };
  const pd=box.querySelector('[data-phdel]');
  if(pd) pd.onclick=async()=>{ await sDel(photoKey(id)); (S.photos||{})[id]=null;

/* 맞대결 상세 — 테니스 H2H처럼 두 사람을 고른 뒤에만 자세히 본다 */
function renderH2H(meIdStr, oppId){
  const box=document.getElementById('h2hBox'); if(!box) return;
  if(!oppId){ box.innerHTML=''; return; }
  const a=h2hStats(meIdStr); if(!a) return;
  const o=a.list.find(x=>x.oid===oppId); if(!o){ box.innerHTML=''; return; }
  const g=o.w+o.l, pct=Math.round(o.w/g*100);
  const last=o.hist[0];
  box.innerHTML=`<div class="h2hcard">
    <div class="h2hnum"><b>${o.w}</b><span>−</span><b class="l">${o.l}</b></div>
    <div class="h2hbar"><i style="width:${pct}%"></i></div>
    <div class="split tiny dim" style="margin-top:7px"><span>내 승 ${o.w}</span><span>${esc(nameOf(oppId))} 승 ${o.l}</span></div>
    <div class="split tiny" style="margin-top:12px"><span class="dim">핸디</span>
      <span>${o.handi?`${o.handi.pts}점 ${o.handi.mine?'받음':'줌'}`:'없음'}</span></div>

    <div class="split tiny" style="margin-top:6px"><span class="dim">마지막 경기</span><span>${last?last.d:'-'}</span></div>
  </div>`;
}

function estimateHTML(){
  const e = S._est;
  if(!e) return `<button class="btn ghost sm" id="sEst" style="margin-bottom:12px">경기 결과로 두 값 추정하기</button>`;
  if(!e.perBu) return `<p class="tiny dim" style="margin:0 2px 12px">경기 ${e.n}건으로는 추정이 어렵습니다. 40건 이상 쌓이면 다시 눌러보세요.
    <button class="btn ghost sm" id="sEst" style="margin-left:4px">다시 추정</button></p>`;
  const gap = e.perBu - st().ptsPerBu*e.handiElo;
  return `<div class="notice ${Math.abs(gap)>40?'warn':''}" style="margin:0 0 12px">
    경기 ${e.n}건으로 추정한 값<br>
    부수당 <b>${Math.round(e.perBu)}점</b> · 핸디 1점당 <b>${Math.round(e.handiElo)}점</b><br>
    <span class="dim">핸디를 주고도 부수당 ${Math.round(gap)}점이 남습니다. ${gap>40?'핸디가 부족하다는 뜻입니다.':gap<-40?'핸디가 과하다는 뜻입니다.':'거의 공정합니다.'}</span><br>
    <button class="btn ghost sm" id="sApply" style="margin-top:8px">이 값으로 설정</button>
    <button class="btn ghost sm" id="sEst" style="margin-top:8px">다시 추정</button>
  </div>`;
}
function entryDiagHTML(){
  const {cnt, exp, act} = entryAccuracy();
  if(cnt<40) return `<p class="tiny dim" style="margin:0 2px 12px">새 회원 첫 10경기 표본이 ${cnt}건입니다. 40건은 넘어야 시작 레이팅이 맞는지 판단할 만합니다.</p>`;
  const diff = act-exp, per100 = diff/cnt*100;
  const verdict = per100 <= -6 ? '새 회원의 시작 레이팅이 후한 편입니다. 부수를 실제보다 높게 잡고 있거나 부수당 레이팅이 큽니다. 이대로면 기존 회원 점수가 조금씩 올라갑니다.'
                : per100 >= 6 ? '새 회원의 시작 레이팅이 박한 편입니다. 새로 들어온 분들이 예상보다 잘 치고 있습니다.'
                : '새 회원의 시작 레이팅이 실제와 잘 맞습니다.';
  return `<div class="notice ${Math.abs(per100)>=6?'warn':''}" style="margin:0 0 12px">
    새 회원 첫 10경기 ${cnt}건 · 기대 ${exp.toFixed(1)}승 vs 실제 ${act}승 (100경기당 ${diff>0?'+':''}${per100.toFixed(1)})<br>${verdict}</div>`;
}
function handiDiagHTML(){
  const {n,rate}=handiStat();
  if(!n) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기가 쌓이면 클럽 핸디가 실제로 공정한지 여기서 알려드립니다.</p>`;
  if(n<10) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기 ${n}건 · 핸디 받은 쪽 승률 ${rate}%. 10건은 넘어야 판단할 만합니다.</p>`;
  const verdict = rate>=58 ? '핸디가 후한 편입니다. 부수 차 1당 핸디 점수를 줄여보세요.'
                : rate<=42 ? '핸디가 박한 편입니다. 부수 차 1당 핸디 점수를 늘려보세요.'
                : '클럽 핸디가 공정하게 잡혀 있습니다. 지금 값을 유지하세요.';
  return `<div class="notice ${(rate>=58||rate<=42)?'warn':''}" style="margin:0 0 12px">
    핸디 경기 ${n}건 · 핸디 받은 쪽 승률 <b>${rate}%</b><br>${verdict}</div>`;
}

async function reassignSheet(){

  S.matches.filter(m=>!m.void).forEach(m=>{ mCount[m.enteredBy]=(mCount[m.enteredBy]||0)+1; });
  const log=(await sGet(KEY.audit))||[];
  const aCount={};
  log.forEach(x=>{ if(x.by) aCount[x.by]=(aCount[x.by]||0)+1; });

  const ids=[...new Set([...S.players.map(p=>p.id), ...Object.keys(mCount)])];
  const rows=ids.map(id=>({id, name:nameOf(id), m:mCount[id]||0, a:aCount[nameOf(id)]||0}))
                .filter(r=>r.m||r.a||P(r.id))
                .sort((x,y)=>(y.m+y.a)-(x.m+x.a));
  if(!rows.some(r=>r.m||r.a)) return toast('바꿀 기록이 없습니다.');
  const rs=roster();

  const sh=sheet('입력자 일괄 변경', `
    <p class="tiny dim">'누가 입력했는지'만 바꿉니다. 경기 결과·날짜·핸디·레이팅은 그대로입니다.</p>
    <div class="field" style="margin-top:12px"><label>지금 입력자로 되어 있는 사람</label>
      <select id="raFrom">${rows.map(r=>`<option value="${r.id}">${esc(r.name)} · 경기 ${r.m}건 · 이력 ${r.a}건</option>`).join('')}</select></div>
    <div class="field"><label>이 사람이 넣은 것으로 바꾸기</label>
      <select id="raTo">${rs.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.bu}부</option>`).join('')}</select></div>
    <div class="field"><label style="display:flex;gap:8px;align-items:center">
      <input type="checkbox" id="raShow" ${st().legacyBefore>new Date().toISOString()?'':'checked'} style="width:auto"> 바꾼 뒤 실제 입력자 이름이 보이게 하기</label>
      <p class="tiny dim" style="margin:5px 2px 0">임시 운영 기간에는 예전 기록이 전부 '관리자 입력'으로 표시됩니다. 이걸 켜면 임시 기간을 끝내고 바뀐 이름이 그대로 보입니다.</p></div>
    <button class="btn" id="raGo">변경</button>`);

  sh.querySelector('#raGo').onclick=async()=>{
    const from=sh.querySelector('#raFrom').value, to=sh.querySelector('#raTo').value;
    const show=sh.querySelector('#raShow').checked;
    if(from===to){ sh.remove(); return toast('같은 사람입니다.',1); }
    const r=rows.find(x=>x.id===from)||{m:0,a:0};
    const fromName=nameOf(from), toName=nameOf(to);
    sh.remove();
    confirmSheet('입력자를 바꿀까요?',
      `${esc(fromName)} → ${esc(toName)}<br>경기 <b>${r.m}건</b> · 변경 이력 <b>${r.a}건</b>을 바꿉니다.${show?'<br>바꾼 뒤 실제 입력자 이름이 표시됩니다.':''}`,
      '변경', async()=>{
        if(S.busy) return; S.busy=true;
        const movedM = await reassignEntrant(from, to);
        const movedA = await reassignAudit(fromName, toName);
        if(show){ S.meta={...S.meta, settings:{...st(), legacyBefore:new Date().toISOString()}};
                  await sSet(KEY.meta, S.meta); }
        S.busy=false;
        audit('입력자 일괄 변경', `${fromName} → ${toName} (경기 ${movedM} · 이력 ${movedA})`);
        await loadAll(); render();
        toast(`경기 ${movedM}건 · 이력 ${movedA}건을 ${toName}님으로 바꿨습니다.`);
      });
  };
}
async function reassignEntrant(fromId, toId){
  let n=0;
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

async function applyBackup(j){
  await sSet(KEY.players, j.players);
  if(j.meta) await sSet(KEY.meta, j.meta);
  const byMonth={}; j.matches.forEach(m=>{(byMonth[monthOf(m.date)] ||= []).push(m);});
  for(const [mo,list] of Object.entries(byMonth)) await sSet(KEY.shard(mo), list);
  await loadAll();
  S.me = (S.me && P(S.me.id)) || null;
  audit('백업 복원', `선수 ${j.players.length} · 경기 ${j.matches.length}`);
  render(); toast('복원했습니다.');
}
/* ── 밴드 연동 ──────────────────────────────────────────────
   밴드 댓글은 "@이름 @이름 님 상대 승" 형태다.
   같은 상대와 여러 판이면 "@이름 ×2" 로 적는다. */
const bandNorm = n => String(n||'').replace(/\([^)]*\)/g,'').replace(/님$/,'').trim();
const bandLabel = p => (p && (p.bandName || p.name)) || '';
function parseBandText(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    const win = /승\s*$/.test(line), lose = /패\s*$/.test(line);
    if(!win && !lose) continue;
    const re=/@([^\s@×xX*]+(?:\([^)]*\))?)\s*(?:[×xX*]\s*(\d+))?/g;
    let m;
    while((m=re.exec(line))){
      const raw=String(m[1]).trim(), name=bandNorm(raw);
      if(!name) continue;
      rows.push({raw, name, r: win?'W':'L'});
    }
  }
  const seen={};
  return rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; });
}
/* 한 번 알려준 밴드 이름은 선수에 별칭으로 남겨두고 다음부터 자동으로 맞춘다 */
function matchPlayerByName(raw){
  const r=String(raw||'').trim(), n=bandNorm(r);
  if(!n) return null;
  const A=x=>x.aliases||[];
  let p = S.players.find(x=>x.bandName===r)
       || S.players.find(x=>A(x).includes(r))
       || S.players.find(x=>x.name===n)
       || S.players.find(x=>A(x).some(a=>bandNorm(a)===n))
       || S.players.find(x=>bandNorm(x.name)===n);
  if(p) return p;
  const cands=S.players.filter(x=>x.name.startsWith(n)||n.startsWith(x.name));
  return cands.length===1 ? cands[0] : null;
}
/* 이름 패턴 기억하기 */
async function learnAliases(pairs){          // [{pid, raw}]
  const need=pairs.filter(({pid,raw})=>{
    const p=P(pid); if(!p || !raw) return false;
    return p.bandName!==raw && !(p.aliases||[]).includes(raw);
  });
  if(!need.length) return;
  await savePlayers(map=>{
    for(const {pid,raw} of need){
      const x=map.get(pid); if(!x) continue;
      x.aliases=[...new Set([...(x.aliases||[]), raw])].slice(0,6);
      if(!x.bandName) x.bandName=raw;         // 내보낼 때 쓸 대표 이름
    }
  });
}
/* 내 경기를 밴드 댓글 형식으로 만든다 */
function bandTextFor(meIdStr, date){
  const win={}, lose={};
  for(const m of S.matches){
    if(m.void || m.date!==date) continue;
    if(m.aId!==meIdStr && m.bId!==meIdStr) continue;
    const opp = m.aId===meIdStr ? m.bId : m.aId;
    const box = winnerOf(m)===meIdStr ? win : lose;
    box[opp]=(box[opp]||0)+1;
  }
  const fmt = box => Object.keys(box).map(id=>`@${bandLabel(P(id))||nameOf(id)}`).join(' ');
  const out=[];
  if(Object.keys(win).length)  out.push(`${fmt(win)} 님 상대 승`);
  if(Object.keys(lose).length) out.push(`${fmt(lose)} 님 상대 패`);
  return out.join('\n');
}

/* 밴드 글 가져오기 — 모르는 이름은 물어보고, 답을 기억해 다음부터 자동으로 맞춘다 */

function bandImportSheet(){
  bandImp = bandImp || { date:(bulk&&bulk.date)||today(), meId:(bulk&&bulk.meId)||meId(), text:'', rows:null, fix:{}, bu:{} };
  if(!dateOK(bandImp.date)) bandImp.date=today();
  const rs=roster();
  let sh;
  const draw=()=>{
    const rows=bandImp.rows;
    const known   = rows ? rows.filter(r=>matchPlayerByName(r.raw)) : [];
    const unknown = rows ? rows.filter(r=>!matchPlayerByName(r.raw)) : [];
    return `
      <p class="tiny dim">밴드 댓글을 그대로 붙여넣으세요. @뒤의 이름과 줄 끝의 승/패만 읽습니다.</p>

        <input type="date" id="biDate" value="${bandImp.date}" max="${today()}" min="${minEntryDate()}"></div>
      ${isAdmin()?`<div class="field"><label>기준 선수 (글쓴이)</label><select id="biMe">
        ${rs.map(p=>`<option value="${p.id}" ${p.id===bandImp.meId?'selected':''}>${esc(p.name)} · ${p.bu}부</option>`).join('')}
      </select></div>`:''}
      <div class="field"><label>밴드 댓글</label>
        <textarea id="biTxt" style="height:100px;font-size:13px;line-height:1.6"
          placeholder="@최종우 @안치훈 님 상대 패&#10;@홍은기 @정종연 님 상대 승">${esc(bandImp.text)}</textarea></div>
      <button class="btn ghost" id="biParse">읽어들이기</button>
      ${rows?`
        <hr class="sep">
        <div class="secttl">알아본 이름 ${known.length}개</div>
        ${known.length?known.map(r=>{const p=matchPlayerByName(r.raw);
          return `<div class="split tiny" style="padding:5px 0">
            <span>${esc(r.raw)}${r.raw!==p.name?` <span class="dim">→ ${esc(p.name)}</span>`:''}</span>
            <span class="${r.r==='W'?'up':'down'}">${r.r==='W'?'승':'패'}</span></div>`;}).join('')
          :`<div class="tiny dim">알아본 이름이 없습니다.</div>`}
        ${unknown.length?`
          <hr class="sep">
          <div class="secttl" style="color:var(--warn)">누구인지 알려주세요 · ${unknown.length}개</div>
          ${unknown.map(r=>{ const i=rows.indexOf(r); const fx=bandImp.fix[i]||'';
            return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
              <div class="split tiny" style="margin-bottom:6px">
                <b style="font-size:14px">${esc(r.raw)}</b>
                <span class="${r.r==='W'?'up':'down'}">${r.r==='W'?'승':'패'}</span></div>
              <div class="row">
                <select data-fix="${i}">
                  <option value="">건너뛰기</option>
                  ${rs.map(p=>`<option value="${p.id}" ${fx===p.id?'selected':''}>${esc(p.name)} · ${p.bu}부</option>`).join('')}
                  ${isAdmin()?`<option value="__new__" ${fx==='__new__'?'selected':''}>새 선수로 추가</option>`:''}
                </select>
                ${fx==='__new__'?`<select data-newbu="${i}" style="flex:none;width:88px">
                  ${Array.from({length:BU_MAX-BU_MIN+1},(_,k)=>BU_MIN+k).map(b=>`<option value="${b}" ${String(b)===String(bandImp.bu[i]||7)?'selected':''}>${b}부</option>`).join('')}
                </select>`:''}
              </div></div>`;}).join('')}
          <p class="tiny dim" style="margin:8px 2px 0">한 번 알려주면 그 이름을 기억해서 다음부터는 자동으로 맞춥니다. 내보낼 때도 이 이름으로 나갑니다.</p>
        `:''}
        <button class="btn" id="biGo" style="margin-top:14px">경기 등록</button>
      `:''}`;
  };
  const rebind=()=>{
    const bd=sh.querySelector('#biDate');
    if(bd) bd.onchange=e=>{ if(dateOK(e.target.value)) bandImp.date=e.target.value;
      else { e.target.value=bandImp.date; toast('입력할 수 없는 날짜입니다.',1);} };
    const bm=sh.querySelector('#biMe'); if(bm) bm.onchange=e=>{ bandImp.meId=e.target.value; };
    const tx=sh.querySelector('#biTxt'); if(tx) tx.oninput=e=>{ bandImp.text=e.target.value; };
    const bp=sh.querySelector('#biParse');
    if(bp) bp.onclick=()=>{
      bandImp.text=(sh.querySelector('#biTxt').value||'');
      const rows=parseBandText(bandImp.text);
      if(!rows.length) return toast('읽을 내용을 찾지 못했습니다. 줄 끝이 승 또는 패여야 합니다.',1);
      bandImp.rows=rows; bandImp.fix={}; redraw();
    };
    sh.querySelectorAll('[data-fix]').forEach(el=>el.onchange=()=>{ bandImp.fix[+el.dataset.fix]=el.value; redraw(); });
    sh.querySelectorAll('[data-newbu]').forEach(el=>el.onchange=()=>{ bandImp.bu[+el.dataset.newbu]=el.value; });
    const go=sh.querySelector('#biGo'); if(go) go.onclick=doBandImport;
  };
  const redraw=()=>{ sh.remove(); sh=sheet('밴드 글에서 가져오기', draw()); rebind(); };
  sh=sheet('밴드 글에서 가져오기', draw()); rebind();

  async function doBandImport(){
    if(S.busy) return;
    const date=bandImp.date, meIdStr=bandImp.meId, rows=bandImp.rows||[];
    if(!dateOK(date)) return toast('입력할 수 없는 날짜입니다.',1);
    const picks={}, learn=[]; let added=0;
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      let p=matchPlayerByName(r.raw);
      let explicit=false;
      if(!p){
        const fx=bandImp.fix[i];
        if(!fx) continue;
        explicit=true;
        if(fx==='__new__'){
          if(!isAdmin()) continue;
          const exist=S.players.find(x=>x.name===bandNorm(r.raw));
          if(exist) p=exist;
          else{
            const np={ id:uid('p'), name:bandNorm(r.raw), bu:+(bandImp.bu[i]||7), hand:'R', bio:'',
                       bandName:r.raw, aliases:[r.raw], pinHash:await defPin(), role:'member', active:true,
                       joinedAt:new Date().toISOString(), addedBy:S.me.id };
            if(!await savePlayers(map=>map.set(np.id,np)))
              return errorSheet('저장하지 못했습니다','새 선수를 추가하는 중 문제가 생겼습니다.');
            p=P(np.id); added++;
          }
        } else p=P(fx);
      }
      if(!p || p.id===meIdStr) continue;
      if(explicit || r.raw!==p.name) learn.push({pid:p.id, raw:r.raw});
      picks[p.id]={r:r.r, n:1};
    }
    if(!Object.keys(picks).length) return toast('등록할 경기가 없습니다.',1);
    sh.remove();
    S.busy=true; busyOn('정리하는 중…');
    await learnAliases(learn);
    const res=await planAndSave(date, meIdStr, picks);
    S.busy=false; busyOff();
    if(!res.ok) return errorSheet('저장하지 못했습니다','밴드 글에서 읽은 경기를 저장하지 못했습니다.');
    audit('밴드 가져오기', `${nameOf(meIdStr)} · ${date} · 등록 ${res.created} / 합침 ${res.merged} / 건너뜀 ${res.skipped}`);
    bandImp=null; render();
    const parts=[];
    if(res.created) parts.push(`${res.created}건 등록`);
    if(res.merged)  parts.push(`${res.merged}건 합침`);
    if(res.skipped) parts.push(`${res.skipped}건 건너뜀`);
    if(added) parts.push(`선수 ${added}명 추가`);
    if(learn.length) parts.push(`이름 ${learn.length}개 기억`);
    toast(parts.join(' · ')||'등록할 경기가 없었습니다.');
  }
}
/* 확인 대기 처리 — 맞으면 확인, 아니면 반려 */
function confirmQueue(){
  const list=pendingForMe();
  if(!list.length) return toast('확인할 경기가 없습니다.');
  const sh=sheet(`확인 대기 ${list.length}건`, `
    <p class="tiny dim">상대가 올린 경기입니다. 맞으면 확인, 기억과 다르면 반려하세요. 확인해야 랭킹에 반영됩니다.</p>
    <div id="pendList" style="margin-top:12px">
      ${list.map(m=>{
        const win=winnerOf(m), iWon=win===S.me.id, opp=iWon?loserOf(m):win;
        return `<div class="pcard" id="pc_${m.id}">
          <div class="pw ${iWon?'w':'l'}">${iWon?'내 승':'내 패'}</div>
          <div class="pi"><b>${esc(nameOf(opp))}</b><small>${dateLabel(m.date)}${
            m.handi&&m.handi.pts?` · 핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}`:''}</small></div>
          <div class="pb">
            <button class="btn sm" data-yes="${m.id}">확인</button>
            <button class="btn ghost sm" data-no="${m.id}">반려</button>
          </div></div>`;
      }).join('')}
    </div>`);
  const refresh=()=>{ sh.remove(); render(); if(pendingForMe().length) confirmQueue(); else toast('확인 대기가 모두 처리됐습니다.'); };
  sh.querySelectorAll('[data-yes]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.yes); if(!m) return;
    const ok=await commitMatch({...m, confirmedBy:[...new Set([...(m.confirmedBy||[]),S.me.id])],
                                status:'confirmed', rev:(m.rev||0)+1});
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 확인', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`);
    refresh();
  });
  sh.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.no); if(!m) return;
    const ok=await deleteMatchById(m.id);
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 반려', `${nameOf(m.enteredBy)} 입력분 (${m.date})`);
    refresh();
  });
}

    <div class="field"><label>밴드에서 쓰는 이름</label>
      <input id="pmBand" maxlength="20" value="${esc(p.bandName||'')}" placeholder="${esc(p.name)}"></div>
    <button class="btn" id="pmSave">선수 정보 저장</button>
    <hr class="sep">
    <button class="btn ghost" id="pmAct">${p.active===false?'다시 활성화':'비활성으로 돌리기'}</button>
    <p class="tiny dim" style="margin:8px 2px 0">비활성은 기록을 그대로 두고 랭킹에서만 뺍니다. 잠깐 안 나오는 사람은 이쪽이 맞습니다.</p>
    <hr class="sep">
    <label>완전 삭제</label>
    <p class="tiny dim" style="margin:0 0 9px">선수 정보를 지우고 관련 경기 ${n}건을 랭킹에서 제외합니다.
    ${n?'상대했던 사람들의 레이팅도 그 경기를 뺀 값으로 다시 계산됩니다. ':''}되돌리려면 백업 파일이 필요합니다.</p>
    ${onlyAdmin?`<div class="notice warn">관리자가 이 사람뿐입니다. 다른 사람을 관리자로 올린 뒤에 삭제할 수 있습니다.</div>`:`
    <input id="pmName" placeholder="확인용으로 이름을 그대로 입력하세요">
    <button class="btn danger" id="pmDel" style="margin-top:9px">완전 삭제</button>`}
  `);
  m.querySelector('#pmSave').onclick=async()=>{
    const bu=+m.querySelector('#pmBu').value, hand=m.querySelector('#pmHand').value;
    const rub=m.querySelector('#pmRub').value, bio=(m.querySelector('#pmBio').value||'').trim();
    const band=(m.querySelector('#pmBand').value||'').trim();
    const ok=await savePlayers(map=>{ const x=map.get(id); if(!x) return;
      x.bu=bu; x.hand=hand; x.rubber=rub; x.bio=bio;
      x.bandName = band || null;
      if(band) x.aliases=[...new Set([...(x.aliases||[]), band])].slice(0,6);
    });
    if(!ok) return toast('저장에 실패했습니다.',1);
    m.remove();
    if(S.me && S.me.id===id) S.me=P(id);
    audit('선수 정보 수정', p.name); render(); toast(`${p.name} 정보를 저장했습니다.`);
  };
  m.querySelector('#pmAct').onclick=async()=>{
    m.remove();
    await savePlayers(map=>{const x=map.get(id); if(x)x.active=x.active===false;});
    audit('활성 상태 변경',p.name); render(); toast('바꿨습니다.');
  };
  const del=m.querySelector('#pmDel');
  if(del) del.onclick=async()=>{
    if((m.querySelector('#pmName').value||'').trim()!==p.name) return toast('이름이 일치하지 않습니다.',1);
    m.remove();
    S.busy=true;
    const removed=await deleteMatchesOf(id);
    const ok=await savePlayers(map=>{map.delete(id);});
    S.busy=false;
    if(!ok) return toast('삭제에 실패했습니다. 다시 시도해주세요.',1);
    audit('선수 삭제', `${p.name} (경기 ${removed}건 제외)`);
    await loadAll();
    if(S.me&&S.me.id===id){ await sDel(KEY.session,false); S.me=null; }
    render(); toast(`${p.name}님을 삭제했습니다.`);
  };
}
function findDuplicates(){
  const out=[], live=S.matches.filter(m=>!m.void);
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    if(a.date!==b.date) continue;
    const samePair=(a.aId===b.aId&&a.bId===b.bId)||(a.aId===b.bId&&a.bId===b.aId);
    if(!samePair) continue;
    if(winnerOf(a)!==winnerOf(b)) continue;
    if(a.enteredBy===b.enteredBy) continue;
    if(isConfirmed(a)&&isConfirmed(b)) continue;
    out.push({a,b});
  }
  return out;
}

/* ── 시트 / 확인 ── */
function sheet(title, html, footer){
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="sheet"><h3>${esc(title)}</h3>${html}${footer||''}</div>`;
  mask.onclick=e=>{ if(e.target===mask) mask.remove(); };
  document.body.appendChild(mask); return mask;
}
function confirmSheet(title, html, okLabel, fn){
  const m=sheet(title,`<p class="tiny" style="line-height:1.7;color:var(--mut)">${html}</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" data-no>취소</button><button class="btn" data-yes>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-no]').onclick=()=>m.remove();
  m.querySelector('[data-yes]').onclick=async()=>{ m.remove(); await fn(); };
}

try{ document.title='모닝탁구 랭킹'; }catch(e){}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
/* 내가 쓴 뒤 남기는 신호 — 다른 기기만 이걸 보고 새로고침한다 */
function bumpSig(){ if(FB) FB.set('sig', {t:Date.now(), by:CLIENT}).catch(()=>{}); }
/* 새 확인 요청이 들어오면 화면에서만 알린다 (브라우저 알림은 쓰지 않는다) */
function notifyPending(added){ toast(`확인할 경기 ${added}건이 새로 들어왔습니다.`); }
/* 다른 사람이 경기를 넣으면 알아서 새로고침 — 입력 중일 때는 건드리지 않는다 */
function watchRemote(){
  if(!FB) return;
  let t=null, first=true;
  FB.watch(sig=>{
    if(first){ first=false; return; }
    if(sig && sig.by===CLIENT) return;          // 내가 쓴 변경은 이미 화면에 반영돼 있다
    clearTimeout(t);
    t=setTimeout(async()=>{
      if(S.busy) return;
      const a=document.activeElement;
      if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;   // 입력 중이면 다음 기회에
      if(document.querySelector('.mask')) return;                     // 확인창 떠 있으면 대기
      const before = pendingForMe().length;
      await loadAll();
      if(S.me){ const me=P(S.me.id); if(me) S.me=me; }
      const after = pendingForMe().length;
      if(after>before) notifyPending(after-before);
      softRender();
    }, 500);
  });
}
(async()=>{
  render();
  await defPin();

  /* 1) 캐시가 있으면 네트워크를 기다리지 않고 바로 보여준다 */
  const cached = loadCache();
  if(cached && cached.players){
    S.meta = cached.meta || {settings:{...DEFAULTS}};
    S.meta.settings = {...DEFAULTS, ...(S.meta.settings||{})};
    S.players = cached.players || [];
    S.matches = cached.matches || [];
    recompute();
    const ses0 = await sGet(KEY.session,false);
    if(ses0 && ses0.playerId){ const p=P(ses0.playerId); if(p && p.active!==false) S.me=p; }
    S.ready = true; S.stale = true;
    render();
  }

  /* 2) 최신 데이터를 받아 갱신한다 */
  FB = await initFirebase();
  S.connecting = false;
  await loadAll();
  if(!S.matches.length) await migrateShards();      // 예전 저장 방식이 남아 있을 때만
  if(S.matches.length===0 && FB) await loadAll();
  const ses = await sGet(KEY.session,false);
  if(ses && ses.playerId){
    const p=P(ses.playerId);
    if(p && p.active!==false){ S.me=p; sSet(KEY.session,{playerId:p.id, at:Date.now()},false); }
    else if(!p){ S.me=null; sDel(KEY.session,false); }     // 계정이 지워진 경우
  }
  S.ready = true; S.stale = false;
  softRender();
  const np = pendingForMe().length;
  if(np) setTimeout(()=>toast(`확인할 경기가 ${np}건 있습니다.`), 700);
  watchRemote();
})();
