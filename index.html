/* 상대 부수별 승률 — 어느 부수부터 벽인가 */
function wallByBu(id){
  const me=P(id); if(!me) return [];
  const by={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const o=P(m.aId===id?m.bId:m.aId); if(!o) continue;
    const b=by[o.bu]=by[o.bu]||{n:0,w:0};
    b.n++; if(winnerOf(m)===id) b.w++;
  }
  return Object.entries(by).map(([bu,x])=>({bu:+bu, n:x.n, w:x.w, rate:x.w/x.n}))
    .sort((a,b)=>a.bu-b.bu);
}
/* 요즘 기세 — 최근 N일 동안 기대 승수 대비 얼마나 더/덜 이겼나 */
const HEAT_DAYS = 7;                 // 한 주 단위로 본다
function heatMap(days){
  const from=dayAgo(days||HEAT_DAYS), by={};
  for(const m of (S._sorted||[])){
    if(m.date<from) continue;
    const eA=expOf(m); if(eA==null) continue;
    const w=winnerOf(m);
    [[m.aId,eA],[m.bId,1-eA]].forEach(([id,e])=>{
      const b=by[id]=by[id]||{g:0,w:0,exp:0};
      b.g++; b.exp+=e; if(w===id) b.w++; });
  }
  const out={};
  for(const id in by){ const b=by[id];
    if(b.g<4) continue;                                   // 표본이 너무 적으면 판단하지 않는다
    const d=b.w-b.exp;
    out[id]={...b, diff:d, rate:d/b.g, heat: d>=1.2?'hot' : d<=-1.2?'cold' : ''};
  }
  return out;
}
/* 라이벌 — 양쪽 다 이겨봤고, 승률이 5:5 언저리이며, 많이 붙은 짝.
   한쪽이 쓸어담은 짝은 아무리 많이 붙어도 라이벌이 아니다. */
function rivalries(minG){
  const MIN=minG||3, seen={}, out=[];
  for(const m of clubScope()){
    const k=[m.aId,m.bId].sort().join('|');
    const b=seen[k]=seen[k]||{a:k.split('|')[0], b:k.split('|')[1], n:0, aw:0, last:''};
    b.n++; if(winnerOf(m)===b.a) b.aw++; b.last=m.date;
  }
  for(const k in seen){
    const x=seen[k];
    if(x.n<MIN || !P(x.a) || !P(x.b)) continue;
    const lose=x.n-x.aw, gap=Math.abs(x.aw-lose);
    if(x.aw===0 || lose===0) continue;              // 한쪽이 전승이면 라이벌이 아니다
    const rate=x.aw/x.n;
    /* 박빙 기준: 승률 40~60%. 경기가 적으면 그 안에 떨어지는 조합이 없으므로
       '승패 차 1' 까지 인정한다. */
    if(!(gap<=1 || (rate>=0.40 && rate<=0.60))) continue;
    x.rate=rate;
    x.score = x.n * (1 - 2*Math.abs(rate-0.5));     // 팽팽할수록 · 많이 붙을수록
    out.push(x);
  }
  return out.sort((p,q)=>q.n-p.n || (Math.abs(p.rate-0.5)-Math.abs(q.rate-0.5)));
}
/* 클럽 분석 화면 — 세 갈래로 묶는다 */
let clubTab='month', clubPer='all', cupLg='', cupRd='', matchPick={a:'',b:''};
/* 클럽 분석에서 보고 있는 기간의 경기만 — 'all' 이면 전체 */
const inClubPer = m => clubPer==='all' || (m && m.date.slice(0,String(clubPer).length)===clubPer);
const clubScope = ()=> (S._sorted||[]).filter(inClubPer);
const perLabel  = ()=> clubPer==='all' ? '통산' : seasonLabel(clubPer);
function clubSheet(host){
  /* host 를 주면 그 안에 그리고(분석 탭), 없으면 예전처럼 시트로 띄운다 */
  let sh = host || null;
  const pct=x=>Math.round(x*100);

  /* ── 조각들 ── */
  /* 통산을 고르면 달 단위 요약 대신 누적 순위를 보여준다 */
  const secCareerTop=()=>{
    const rows=roster().map(p=>{
      const ms=clubScope().filter(m=>m.aId===p.id||m.bId===p.id);
      const w=ms.filter(m=>winnerOf(m)===p.id).length;
      const days=new Set(ms.map(m=>m.date)).size;
      return {p, g:ms.length, w, l:ms.length-w, days};
    }).filter(x=>x.g>0);
    if(!rows.length) return `<div class="empty">기록이 없습니다.</div>`;
    const MED=['🥇','🥈','🥉'];
    const col=(ttl, list, val)=>`<div class="ctop">
      <div class="ct-h">${ttl}</div>
      ${list.slice(0,5).map((x,i)=>`<div class="ctr ${i<3?'m'+(i+1):''}">
        <span class="i">${i<3?MED[i]:i+1}</span>
        <span class="n">${esc(x.p.name)}</span>
        <span class="v">${val(x)}</span></div>`).join('')}</div>`;
    const byW=rows.slice().sort((a,b)=>b.w-a.w);
    const byG=rows.slice().sort((a,b)=>b.g-a.g);
    const byD=rows.slice().sort((a,b)=>b.days-a.days);
    const byR=rows.filter(x=>x.g>=10).sort((a,b)=>(b.w/b.g)-(a.w/a.g));
    return `<p class="tiny dim" style="margin:0 0 8px">전체 기간 · 경기 ${clubScope().length}건 ·
        ${new Set(clubScope().map(m=>m.date)).size}일</p>
      <div class="ctgrid">
        ${col('다승', byW, x=>x.w+'승')}
        ${col('최다 경기', byG, x=>x.g)}
        ${col('최다 출석', byD, x=>x.days+'일')}
        ${byR.length?col('승률 (10경기+)', byR, x=>Math.round(x.w/x.g*100)+'%'):''}
      </div>`;
  };
  const secMonthly=()=>{
    if(clubPer==='all') return secCareerTop();
    const ym=clubPer;
    const r=monthlyReport(ym);
    if(!r) return `<div class="empty">이 달 기록이 없습니다.</div>`;
    return `<div class="card mrpt">
        <div class="mr-ttl">${seasonLabel(ym)}</div>
        <div class="mr-hero"><span class="cap">이달의 선수</span>
          <b>${r.mvp?esc(nameOf(r.mvp.id)):'–'}</b>
          ${r.mvp?`<span class="sub">${r.mvp.w}승 ${r.mvp.g-r.mvp.w}패 · 승률 ${Math.round(r.mvp.w/r.mvp.g*100)}% · ${r.mvp.days}일 출전</span>`
                 :`<span class="sub">${r.minG}경기 이상 친 사람이 없습니다</span>`}</div>
      </div>
      <div class="card">
        <div class="secttl">클럽 전체 <span class="dim" style="font-weight:400;letter-spacing:0">· 선수 개인 기록이 아닙니다</span></div>
        <div class="mr-num">
          <div><b>${r.n}</b><span>경기</span></div>
          <div><b>${r.days}</b><span>모인 날</span></div>
          <div><b>${r.players}</b><span>참가자</span></div>
          <div><b>${(r.n/r.days).toFixed(1)}</b><span>하루 평균</span></div>
        </div>
      </div>
      <div class="card">
        <div class="secttl">이달의 기록</div>
        ${[['부수 1위', r.champ&&r.champ.p.name, r.champ&&`${Math.round(r.champ.r)}점 · ${r.champ.w}−${r.champ.l}`],
           ['최다 출전', r.mostDays&&nameOf(r.mostDays.id), r.mostDays&&`${r.mostDays.days}일`],
           ['최다 경기', r.mostGames&&nameOf(r.mostGames.id), r.mostGames&&`${r.mostGames.g}경기`],
           ['최고 승률', r.bestWin&&nameOf(r.bestWin.id), r.bestWin&&`${r.bestWin.w}−${r.bestWin.g-r.bestWin.w} · ${Math.round(r.bestWin.w/r.bestWin.g*100)}%`],
           ['최대 이변', r.upset&&nameOf(r.upset.w), r.upset&&`${nameOf(r.upset.l)} 상대 · 예상 ${pct(r.upset.e)}%`],
           ['최다 맞대결', r.topPair&&`${nameOf(r.topPair.a)} · ${nameOf(r.topPair.b)}`, r.topPair&&`${r.topPair.n}경기`],
           ['순위 급상승', r.rise&&nameOf(r.rise.id), r.rise&&`▲${r.rise.mv} → ${r.rise.rank}위`]]
          .filter(x=>x[1]).map(([k,v,d])=>`<div class="mr-row">
            <span class="k">${k}</span><b>${esc(v)}</b><em>${esc(d||'')}</em></div>`).join('')}
      </div>
      `;
  };
  const secRival=()=>{
    const MIN=3, rv=rivalries(MIN);
    return `<div class="secttl" style="margin-top:16px">라이벌</div>
      <p class="tiny dim" style="margin:0 0 8px">승부가 갈리지 않는 짝입니다. ${MIN}경기 이상 · 승률 40~60%
        <span class="dim">(경기가 적으면 승패 차 1까지)</span> · 많이 붙은 순.</p>
      ${!rv.length?`<div class="empty">아직 ${MIN}경기 이상 붙은 짝이 없습니다. 경기가 쌓이면 나타납니다.</div>`:''}
      ${rv.slice(0,8).map(x=>`<div class="rv">
        <div class="p"><b>${esc(nameOf(x.a))}</b><span>${x.aw}</span></div>
        <div class="mid"><div class="bar"><i style="width:${Math.round(x.rate*100)}%"></i></div>
          <em>${x.n}경기</em></div>
        <div class="p r"><span>${x.n-x.aw}</span><b>${esc(nameOf(x.b))}</b></div>
      </div>`).join('')}`;
  };
  const secHall=()=>{
    const h=hallOfFame();
    const tile=(k,top,val,sub)=>`<div class="rtile">
      <span class="k">${k}</span>
      <b>${top?esc(top):'–'}</b>
      <span class="v">${val||''}${sub?`<i>${esc(sub)}</i>`:''}</span></div>`;
    const list=(t,arr,nf,vf,numf)=>{ if(!arr.length) return '';
      const mx=Math.max(...arr.map(numf),1);
      return `<div class="rlist"><div class="rl-t">${t}</div>${arr.map((x,i)=>`<div class="rl-r">
        <span class="i">${i+1}</span><span class="n">${esc(nf(x))}</span>
        <span class="b"><i style="width:${Math.round(numf(x)/mx*100)}%"></i></span>
        <span class="v">${vf(x)}</span></div>`).join('')}</div>`; };
    const p0=h.topPairs[0],u0=h.topUps[0],d0=h.mostDays[0],g0=h.mostGames[0],w0=h.mostWins[0];
    return `<div class="secttl">통산 기록실</div>
      <div class="card rgrid">
        ${tile('최다 대결', p0&&`${nameOf(p0.a)} · ${nameOf(p0.b)}`, p0?`${p0.n}경기`:'')}
        ${tile('최대 이변', u0&&nameOf(u0.w), u0?`${pct(u0.e)}%`:'', u0&&`${nameOf(u0.w===u0.m.aId?u0.m.bId:u0.m.aId)} 상대`)}
        ${tile('최다 출전', d0&&nameOf(d0.id), d0?`${d0.days}일`:'')}
        ${tile('최다 경기', g0&&nameOf(g0.id), g0?`${g0.g}경기`:'')}
        ${tile('최다 승', w0&&nameOf(w0.id), w0?`${w0.w}승`:'')}
      </div>
      <details class="advbox" style="margin-top:8px"><summary>순위 전체 보기</summary><div class="advin">
        ${list('최다 대결', h.topPairs, x=>`${nameOf(x.a)} · ${nameOf(x.b)}`, x=>`${x.n}`, x=>x.n)}
        ${list('최대 이변', h.topUps, x=>`${nameOf(x.w)} → ${nameOf(x.w===x.m.aId?x.m.bId:x.m.aId)}`,
             x=>`${pct(x.e)}%`, x=>1-x.e)}
        ${list('최다 출전', h.mostDays, x=>nameOf(x.id), x=>`${x.days}일`, x=>x.days)}
        ${list('최다 경기', h.mostGames, x=>nameOf(x.id), x=>`${x.g}`, x=>x.g)}
        ${list('최다 승', h.mostWins, x=>nameOf(x.id), x=>`${x.w}승`, x=>x.w)}
      </div></details>`;
  };
  /* 맞대결·클럽 진단은 시즌으로 쪼개면 표본이 너무 적다 — 늘 통산으로 본다 */
  const allTime=(fn)=>{ const keep=clubPer; clubPer='all';
    const html=fn(); clubPer=keep; return html; };
  const secMatch=(rs)=>{
    const sel=(id,cur)=>`<select id="${id}">${rs.map(p=>
      `<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)} · ${p.bu}부</option>`).join('')}</select>`;
    const A=P(matchPick.a), B=P(matchPick.b);
    const ok=A&&B&&A.id!==B.id;
    const f=ok?fairHandi(A.id,B.id):null, ps=ok?pairStats(A.id,B.id):null;
    return `<div class="secttl">붙으면 어떻게 될까</div>
      <div class="row" style="margin-bottom:8px">
        <div class="field">${sel('mpA',matchPick.a)}</div>
        <div class="field">${sel('mpB',matchPick.b)}</div></div>
      ${!ok?`<div class="empty">서로 다른 두 선수를 골라주세요.</div>`:`
      <div class="card vs">
        <div class="vs-top">
          <div class="vs-p"><b>${esc(A.name)}</b><span>${A.bu}부 · ${Math.round(rateOf(A.id,'skill'))}</span></div>
          <div class="vs-x">VS</div>
          <div class="vs-p r"><b>${esc(B.name)}</b><span>${B.bu}부 · ${Math.round(rateOf(B.id,'skill'))}</span></div>
        </div>
        <div class="vs-bar"><i style="width:${pct(f.exp)}%"></i>
          <span class="l">${pct(f.exp)}%</span><span class="r">${100-pct(f.exp)}%</span></div>
        <div class="vs-note">${f.cur?`<b>${esc(nameOf(f.curTo))}</b>이 ${f.cur}점 받고 붙으면 `:'핸디 없이 붙으면 '}
          <b>${esc(f.exp>=0.5?A.name:B.name)}</b> 쪽이 ${pct(Math.max(f.exp,1-f.exp))}%로 앞섭니다</div>
        <div class="vs-fair"><span>5:5로 만들려면</span><b>${esc(nameOf(f.needTo))}</b><em>+${f.need}점</em></div>
        <div class="vs-foot">
          <div><b>${Math.abs(Math.round(f.gap))}</b><span>실력 차</span></div>
          <div><b>${(Math.abs(f.gap)/perBu()).toFixed(1)}</b><span>부수 차이</span></div>
          <div><b>${ps.n?`${ps.w}−${ps.l}`:'–'}</b><span>맞대결</span></div>
        </div>
      </div>`}`;
  };
  const secCycle=()=>{
    const cy=findCycles(2);
    return `<div class="secttl" style="margin-top:16px">물고 물리는 삼각관계</div>
      <p class="tiny dim" style="margin:0 0 8px">2경기 이상 붙어 우열이 갈린 짝만 셉니다.
        A가 B에게 강한데 B는 C에게, 그 C가 다시 A에게 강한 고리입니다.</p>
      ${cy.length?cy.slice(0,20).map(([a,b,c,info])=>`<div class="tri">
        ${[[a,b],[b,c],[c,a]].map(([x,y])=>`<div class="leg">
          <span class="w">${esc(nameOf(x))}</span><i class="ar">${info[x+'>'+y]||''}</i>
          <span class="l">${esc(nameOf(y))}</span></div>`).join('')}
      </div>`).join(''):`<div class="empty">아직 삼각관계가 없습니다.</div>`}`;
  };
  const secHandi=()=>{
    const t=handiTable(), tot=t.reduce((a,x)=>a+x.n,0);
    const solid=t.filter(x=>x.solid);
    /* 한 줄 진단 — 핸디가 전체적으로 박한가 후한가 */
    const avg=solid.length ? solid.reduce((a,x)=>a+x.rate*x.n,0)/solid.reduce((a,x)=>a+x.n,0) : null;
    const verdict = avg==null ? null
      : avg<0.42 ? {t:'핸디가 박합니다', s:'윗 부수가 그만큼 유리합니다', c:'lo'}
      : avg>0.58 ? {t:'핸디가 후합니다', s:'아랫 부수가 그만큼 유리합니다', c:'hi'}
      :            {t:'대체로 맞습니다', s:'핸디를 받으면 서로 비슷해집니다', c:'ok'};
    return `<div class="secttl">부수 차별 핸디 진단</div>
      ${verdict?`<div class="dsum ${verdict.c}">
        <div class="big">${pct(avg)}<em>%</em></div>
        <div class="tx"><b>${verdict.t}</b><i>${verdict.s} · 핸디 받는 쪽 승률</i></div>
      </div>`:''}
      <div class="card" style="padding:8px 12px">
        ${t.length?t.map(x=>{
          const off=x.rate-0.5, w=Math.min(50,Math.abs(off)*100);
          return `<div class="dv ${!x.solid?'weak':off<-0.08?'lo':off>0.08?'hi':'ok'}">
            <div class="k">차 ${x.d}</div>
            <div class="track"><div class="mid"></div><i style="${off<0?'right:50%':'left:50%'};width:${w}%"></i></div>
            <div class="v"><b>${pct(x.rate)}%</b><span>${x.n}경기 · 부수당 ${Math.round(x.own)}점</span></div>
          </div>`;}).join('')
          :`<div class="empty">아직 핸디 경기가 없습니다.</div>`}
      </div>
      <p class="tiny dim" style="margin:6px 2px 0">핸디 경기 ${tot}건. 가운데가 50%이고 왼쪽으로 갈수록 핸디가 박한 쪽입니다.
        경기 수가 적은 구간은 흐리게 표시됩니다.
        ${st().autoCalib
          ? `부수당 남는 격차를 <b>${Math.round(residualNow())}점</b>으로 잡아 레이팅에 반영 중입니다.`
          : '자동 보정이 꺼져 있어 이 표는 레이팅에 반영되지 않습니다.'}</p>`;
  };
  /* 대회형 리그의 통산 성적 — 1위 몇 회, 2위 몇 회 */
  const secLgRecord=()=>{
    const lg=curLg();
    const {list, rounds}=lgRecord(lg);
    if(!rounds) return `<div class="empty">아직 기록된 회차가 없습니다.</div>`;
    const MED=['🥇','🥈','🥉'];
    const win=list.filter(x=>x.podium[0]>0);
    return `<div class="split" style="align-items:baseline;margin-bottom:8px">
        <div class="secttl" style="margin:0">${esc(lgName(lg))} 통산</div>
        <div class="tiny dim">${rounds}회차 · ${list.length}명</div>
      </div>
      ${win.length?`<p class="tiny dim" style="margin:0 0 8px">우승 경험자
        ${win.slice(0,4).map(x=>`${esc(nameOf(x.id))} ${x.podium[0]}회`).join(' · ')}</p>`:''}
      <div class="ctwrap"><table class="ctb lgr">
        <thead><tr><th class="cn">선수</th>
          <th>🥇</th><th>🥈</th><th>🥉</th><th>입상</th>
          <th>최고</th><th>평균</th><th>최고<br>부수</th><th>1위<br>격파</th><th class="rc">참가</th></tr></thead>
        <tbody>${list.map((x,i)=>`<tr>
          <th class="cn tapname" data-psheet="${x.id}"><i>${i+1}</i>${esc(nameOf(x.id))}<em>${(P(x.id)||{}).bu}부</em></th>
          ${x.podium.map((n,k)=>`<td class="${n?'m'+(k+1):'none'}">${n||'·'}</td>`).join('')}
          <td class="${x.podiumN?'':'none'}">${x.podiumN||'·'}</td>
          <td>${x.best}위</td>
          <td class="dim">${x.avg.toFixed(1)}</td>
          <td class="${x.topBu<((P(x.id)||{}).bu||99)?'m1':'dim'}">${x.topBu<99?x.topBu+'부':'·'}</td>
          <td class="${x.beat?'m2':'none'}">${x.beat||'·'}</td>
          <td class="rc">${x.n}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <p class="tiny dim" style="margin:8px 2px 0">회차마다의 최종 순위를 모은 것입니다.
        <b>최고 부수</b>는 지금까지 가장 윗 부수로 뛴 기록이고,
        <b>1위 격파</b>는 그 회차 우승자를 이긴 횟수입니다.</p>
      <div class="secttl" style="margin-top:16px">회차별 우승</div>
      <div class="card">${roundsOf(lg).map(rd=>{
        const st2=roundStanding(lg, rd);
        return `<div class="hof"><span class="md">🥇</span>
          <span class="nm">${st2[0]?esc(nameOf(st2[0])):'–'}${st2[1]?`<i>2위 ${esc(nameOf(st2[1]))}</i>`:''}</span>
          <span class="rt"><em>${roundLabel(rd)}</em></span></div>`;
      }).join('')}</div>`;
  };
  /* 대회형 리그의 회차별 대진표 */
  const secRound=()=>{
    if(curLg()!=='all' && lgIsCup(curLg())) cupLg=curLg();
    const cups=leagues().filter(x=>x.cup);
    if(!cups.length) return `<div class="empty">대회형 리그가 없습니다.<br>
      <span class="tiny dim">관리 · 리그에서 '대회형'을 켜면 여기에 대진표가 생깁니다.</span></div>`;
    if(!cups.some(x=>x.id===cupLg)) cupLg=cups[0].id;
    const rds=roundsOf(cupLg);
    if(!rds.length) return `${cupBar(cups)}<div class="empty">아직 기록된 경기가 없습니다.</div>`;
    if(!rds.includes(cupRd)) cupRd=rds[0];
    const gs=roundGroups(cupLg, cupRd);
    const all=crossTable(cupLg, cupRd);
    const oneTable=(t, title)=>`
      ${title?`<div class="split" style="align-items:baseline;margin:14px 0 6px">
        <div class="secttl" style="margin:0">${title}</div>
        <div class="tiny dim">${t.players}명 · ${t.done}경기</div></div>`:''}
      <div class="ctwrap"><table class="ctb">
        <thead><tr><th class="cn"></th>
          ${t.ids.map(id=>`<th>${esc(nameOf(id)).slice(0,3)}</th>`).join('')}<th class="rc">전적</th></tr></thead>
        <tbody>${t.ids.map(a=>`<tr>
          <th class="cn"><i>${t.order.indexOf(a)+1}</i>${esc(nameOf(a))}<em class="${rdBu(cupLg,cupRd,a)?'tb':''}">${rdBu(cupLg,cupRd,a)||P(a).bu}부</em></th>
          ${t.ids.map(b=>{
            if(a===b) return `<td class="self"></td>`;
            const x=t.cell[a][b];
            if(!x) return `<td class="none">·</td>`;
            /* 한 판만 붙었으면 승·패로, 여러 판이면 전적으로 */
            const one = (x.w+x.l)===1;
            const txt = one ? (x.w?'승':'패') : `${x.w}-${x.l}`;
            return `<td class="${x.w>x.l?'win':x.w<x.l?'lose':''}">${txt}</td>`;
          }).join('')}
          <td class="rc"><b>${t.rec[a].w}</b>−${t.rec[a].l}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    /* 순위 결정전은 조별 순위가 같은 사람끼리 붙는다. 그 순서대로 최종 순위가 정해진다 */
    const koHTML = (()=>{
      if(!gs.ko.length) return '';
      const gTables=gs.groups.map(ids=>crossTable(cupLg,cupRd,ids));
      const seat={};                                   // 그 사람의 조별 등수
      gTables.forEach(t=>t.order.forEach((id,i)=>seat[id]=i));
      const sorted=gs.ko.slice().sort((m1,m2)=>
        Math.min(seat[m1.aId]??99, seat[m1.bId]??99) - Math.min(seat[m2.aId]??99, seat[m2.bId]??99));
      const fin=[];
      sorted.forEach(m=>{ const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
        fin.push(w); fin.push(l); });
      return `<div class="secttl" style="margin-top:16px">순위 결정전</div>
        <div class="card">${sorted.map((m,i)=>{
          const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
          return `<div class="korow"><span class="rk">${i+1}위전</span>
            <span class="kop on">${esc(nameOf(w))}<i>${(P(w)||{}).bu}부</i></span>
            <span class="vs">이김</span>
            <span class="kop">${esc(nameOf(l))}<i>${(P(l)||{}).bu}부</i></span></div>`;
        }).join('')}</div>
        <div class="split" style="align-items:baseline;margin:16px 0 8px">
          <div class="secttl" style="margin:0">최종 순위</div>
          <button class="btn ghost sm" data-cfrank="${fin.join(',')}">복사</button>
        </div>
        <div class="card">${fin.map((id,i)=>`<div class="gp ${i<3?'adv':''}">
          <span class="rk">${i+1}</span>
          <span class="n">${esc(nameOf(id))}<i>${(P(id)||{}).bu}부</i></span></div>`).join('')}</div>`;
    })();
    /* 순위표 — 대진표 아래에 최종 순위를 적는다 */
    const standTable=(t, ttl)=>{
      if(!t.order.length) return '';
      const MED=['🥇','🥈','🥉'];
      return `<div class="secttl" style="margin-top:16px">${ttl||'순위'}</div>
        <div class="card">${t.order.map((id,i)=>`<div class="hof tapname ${i<3?'m'+(i+1):''}" data-psheet="${id}">
          <span class="md">${i<3?MED[i]:i+1}</span>
          <span class="nm">${esc(nameOf(id))}<i>${rdBu(cupLg,cupRd,id)||P(id).bu}부</i></span>
          <span class="rt">${t.rec[id].w}−${t.rec[id].l}<em>${t.rec[id].g}경기</em></span>
        </div>`).join('')}</div>
        <p class="tiny dim" style="margin:8px 2px 0">승수 → 승자승 → 게임수 → 부수 순으로 매깁니다.</p>`;
    };
    const body = gs.groups.length>1
      ? gs.groups.map((ids,i)=>{ const t=crossTable(cupLg,cupRd,ids);
          return oneTable(t, String.fromCharCode(65+i)+'조') + standTable(t, String.fromCharCode(65+i)+'조 순위');
        }).join('') + koHTML
      : oneTable(all, '') + standTable(all, '순위');
    return `${cupBar(cups)}
      ${rdPickHTML('crd', rds, cupRd)}
      <div class="split" style="align-items:baseline;margin-bottom:8px">
        <div class="secttl" style="margin:0">${esc(lgName(cupLg))} ${roundLabel(cupRd)}</div>
        <div class="tiny dim">${all.players}명 · ${all.done}경기</div>
      </div>
      ${body}
      <p class="tiny dim" style="margin:8px 2px 0">가로줄이 그 사람 기준입니다. 점은 서로 붙지 않은 대진입니다.</p>`;
  };
  const cupBar=(cups)=> cups.length<2 ? '' : `<div class="lgbar" style="margin-bottom:8px">
    ${cups.map(x=>`<button class="lgb ${cupLg===x.id?'on':''}" data-clg="${x.id}">${esc(x.name)}</button>`).join('')}</div>`;
  const secHof=()=>{
    const MED=['🥇','🥈','🥉'];
    const board=(mk)=>{
      const rows=hallOfFame2(mk);
      if(!rows.length) return '';
      const cnt={};
      rows.forEach(r=>{ const w=r.top[0]; if(w) cnt[w.p.id]=(cnt[w.p.id]||0)+1; });
      const kings=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=2).slice(0,3);
      return `<div class="secttl" style="margin-top:14px">${MODES[mk].label} 랭킹</div>
        ${kings.length?`<p class="tiny dim" style="margin:0 0 8px">여러 번 1위:
          ${kings.map(([id,n])=>`${esc(nameOf(id))} ${n}회`).join(' · ')}</p>`:''}
        ${rows.map((r,i)=>`<div class="card hofc ${i===0?'now':''}">
          <div class="hof-h">${seasonLabel(r.ym)} 시즌</div>
          ${r.top.map((x,k)=>`<div class="hof m${k+1}">
            <span class="md">${MED[k]}</span>
            <span class="nm">${esc(x.p.name)}<i>${x.p.bu}부</i></span>
            <span class="rt">${x.r}</span>
          </div>`).join('')}
        </div>`).join('')}`;
    };
    /* 개인 최고 레이팅 — 전체와 부수별 */
    const peaks=()=>{
      const list=peakBoard('skill');
      if(list.length<2) return '';
      const byBu={};
      list.forEach(x=>{ if(!byBu[x.p.bu]) byBu[x.p.bu]=x; });   // 이미 높은 순이라 첫 번째가 그 부수 최고
      const bus=Object.keys(byBu).map(Number).sort((a,b)=>a-b);
      return `<div class="secttl" style="margin-top:18px">역대 최고 레이팅</div>
        <p class="tiny dim" style="margin:0 0 8px">각 선수의 통산 레이팅이 가장 높았던 순간입니다.</p>
        <div class="card">${list.slice(0,10).map((x,i)=>`<div class="hof tapname ${i<3?'m'+(i+1):''}" data-psheet="${x.id}">
          <span class="md">${i<3?MED[i]:i+1}</span>
          <span class="nm">${esc(x.p.name)}<i>${x.p.bu}부</i></span>
          <span class="rt">${x.r}<em>${fmtDateY(x.d)}</em></span>
        </div>`).join('')}</div>
        <div class="secttl" style="margin-top:16px">부수별 최고</div>
        <p class="tiny dim" style="margin:0 0 8px">그 부수에서 가장 높이 올라간 사람입니다.</p>
        <div class="card">${bus.map(bu=>{ const x=byBu[bu];
          return `<div class="hof"><span class="md bu">${bu}부</span>
            <span class="nm">${esc(x.p.name)}</span>
            <span class="rt">${x.r}<em>${fmtDateY(x.d)}</em></span></div>`;}).join('')}</div>`;
    };
    /* 시즌 최고 퍼포먼스 — 부수와 무관하게 겨루는 값 */
    const perf=()=>{
      const list=bestSeasons('skill');
      if(list.length<3) return '';
      return `<div class="secttl" style="margin-top:18px">시즌 최고 퍼포먼스</div>
        <p class="tiny dim" style="margin:0 0 8px">부수와 상관없이 그 달 성적만으로 매긴 값입니다. 낮은 부수도 상위권에 오를 수 있습니다.</p>
        <div class="card">${list.map((x,i)=>`<div class="hof ${i<3?'m'+(i+1):''}">
          <span class="md">${i<3?MED[i]:i+1}</span>
          <span class="nm">${esc(x.p.name)}<i>${x.p.bu}부</i></span>
          <span class="rt">${x.r}<em>${seasonLabel(x.ym)} · ${x.w}−${x.l}</em></span>
        </div>`).join('')}</div>`;
    };
    const a=board('skill'), b=board('form');
    if(!a && !b) return `<div class="empty">아직 마감된 시즌이 없습니다.<br>
      <span class="tiny dim">이번 달이 끝나면 첫 이름이 올라갑니다.</span></div>${peaks()}`;
    return `<p class="tiny dim" style="margin:0 0 4px">마감된 시즌의 1~3위가 올라갑니다. 이번 달은 끝나야 등록됩니다.</p>
      ${a}${b}${peaks()}${perf()}`;
  };
  const secBuMvp=()=>{
    if(clubPer==='all') return '';
    const ym=clubPer;
    const list=buMvp(ym);
    if(!list.length) return '';
    return `<div class="secttl">부수별 이달의 선수</div>
      <p class="tiny dim" style="margin:0 0 8px">${seasonLabel(ym)} · 3경기 이상 친 사람 중 승패 차가 가장 큰 사람입니다.</p>
      <div class="card">${list.map(x=>`<div class="bmv">
        <span class="b">${x.bu}부</span>
        <span class="n">${esc(x.top.p.name)}</span>
        <span class="r">${x.top.w}−${x.top.l}</span>
        <span class="g">${x.n}명 중</span>
      </div>`).join('')}</div>`;
  };
  const secSameBu=()=>{
    const bus=[...new Set(roster().map(p=>p.bu))].sort((a,b)=>a-b);
    const blocks=bus.map(bu=>{
      const t=sameBuTable(bu);
      if(t.length<2) return '';
      const tot=t.reduce((a,x)=>a+x.g,0)/2;
      return `<div class="card" style="margin-bottom:8px">
        <div class="secttl" style="margin:0 0 8px">${bu}부 <span class="dim" style="font-weight:400">· ${Math.round(tot)}경기</span></div>
        ${t.map((x,i)=>`<div class="sbu">
          <span class="i">${i+1}</span><span class="n">${esc(nameOf(x.id))}</span>
          <span class="r">${x.w}−${x.l}</span>
          <span class="d ${x.w-x.l>0?'up':x.w-x.l<0?'down':''}">${x.w-x.l>0?'+':''}${x.w-x.l}</span>
        </div>`).join('')}
      </div>`;
    }).filter(Boolean);
    if(!blocks.length) return '';
    return `<div class="secttl" style="margin-top:16px">부수 안에서만</div>
      <p class="tiny dim" style="margin:0 0 8px">같은 부수끼리 붙은 경기만 셉니다. 핸디도 부수 차도 없는 순수 맞대결입니다.</p>
      ${blocks.join('')}`;
  };
  const secBuTrend=()=>{
    const t=buTrend();
    const bus=Object.keys(t).map(Number).sort((a,b)=>a-b).filter(bu=>t[bu].length>=2);
    if(!bus.length) return '';
    return `<div class="secttl" style="margin-top:16px">부수 평균 추이</div>
      <p class="tiny dim" style="margin:0 0 8px">그 달 3경기 이상 친 사람들의 평균입니다. 오르면 그 부수가 세지고 있다는 뜻입니다.</p>
      <div class="card">${bus.map(bu=>{
        const a=t[bu], first=a[0], last=a[a.length-1], d=last.avg-first.avg;
        return `<div class="btr">
          <span class="b">${bu}부</span>
          <span class="s">${a.map(x=>`<i title="${x.ym} · ${Math.round(x.avg)} · ${x.n}명">${Math.round(x.avg)}</i>`).join('<em>→</em>')}</span>
          <span class="d ${d>15?'up':d<-15?'down':''}">${d>0?'+':''}${Math.round(d)}</span>
        </div>`;}).join('')}</div>`;
  };
  const secPromo=()=>{
    const cand=roster().map(p=>({p, t:promoTrend(p.id)}))
      .filter(x=>x.t && x.t.months!=null)
      .sort((a,b)=>a.t.months-b.t.months).slice(0,8);
    if(!cand.length) return '';
    return `<div class="secttl" style="margin-top:16px">이 페이스면 한 부수 위까지</div>
      <p class="tiny dim" style="margin:0 0 8px">달마다 체감 부수가 어떻게 움직였는지로 계산한 예상 기간입니다.
        지금 흐름이 그대로 이어진다고 가정한 값이니 참고만 해주세요.</p>
      ${cand.map(x=>`<div class="pro">
        <div class="n"><b>${esc(x.p.name)}</b><span>${x.p.bu}부 · 체감 ${x.t.cur.toFixed(1)}부</span></div>
        <div class="v"><b>${x.t.months}개월</b><span>달마다 ${Math.abs(x.t.slope).toFixed(2)}부수</span></div>
      </div>`).join('')}`;
  };
  const secPairs=()=>{
    const t=handiPairs();
    if(!t.length) return '';
    const byD={};
    t.forEach(x=>(byD[x.d]=byD[x.d]||[]).push(x));
    return `<div class="secttl" style="margin-top:16px">부수 조합별</div>
      <p class="tiny dim" style="margin:0 0 8px">같은 부수 차라도 어느 구간이냐에 따라 다릅니다.
        핸디 받는 쪽(부수 숫자가 큰 쪽) 승률입니다. 10경기 미만은 흐리게.</p>
      ${Object.keys(byD).sort((a,b)=>a-b).map(d=>`<div class="card" style="margin-bottom:8px">
        <div class="secttl" style="margin:0 0 8px">부수 차 ${d}</div>
        ${byD[d].map(x=>`<div class="pr ${!x.solid?'weak':x.rate<0.42?'lo':x.rate>0.58?'hi':'ok'}">
          <div class="k">${x.hi}부 <i>vs</i> ${x.lo}부</div>
          <div class="track"><div class="mid"></div>
            <i style="${x.rate<0.5?'right:50%':'left:50%'};width:${Math.min(50,Math.abs(x.rate-0.5)*100)}%"></i></div>
          <div class="v"><b>${pct(x.rate)}%</b><span>${x.n}경기</span></div>
          <div class="o">핸디 ${x.avgPts.toFixed(1)}점 · 부수당 ${Math.round(x.own)}점 유리</div>
        </div>`).join('')}
      </div>`).join('')}`;
  };
  const secBu=()=>{
    const cs=buCandidates();
    const up=cs.filter(c=>c.d>0), dn=cs.filter(c=>c.d<0);
    const col=(ttl, arr, cls)=>`<div class="bucol ${cls}">
      <div class="bc-h">${ttl}<span>${arr.length}명</span></div>
      ${arr.length?arr.map(c=>`<div class="bcr">
        <span class="n">${esc(c.p.name)}</span>
        <span class="v">${c.p.bu}<i>→</i><b>${c.felt.toFixed(1)}</b></span>
      </div>`).join(''):`<div class="bc-none">없음</div>`}</div>`;
    return `<div class="secttl" style="margin-top:16px">체감 부수 차이</div>
      <p class="tiny dim" style="margin:0 0 8px">등록 부수와 체감이 1부수 이상 벌어진 사람입니다. (8경기 이상)
        핸디를 정할 때 참고하시라고 보여드리는 값입니다. 부수 조정은 클럽에서 결정합니다.</p>
      ${cs.length?`<div class="bugrid">${col('등록보다 잘 치는 중', up, 'up')}${col('요즘 고전 중', dn, 'down')}</div>`
        :`<div class="empty">등록 부수와 크게 다른 사람이 없습니다.</div>`}`;
  };
  const secAtt=()=>{
    const a=attendance(), D=['일','월','화','수','목','금','토'];
    const mx=Math.max(...a.dow,1), mm=Math.max(...a.mon.map(x=>x[1]),1);
    const top=a.dow.indexOf(mx);
    const totG=a.dow.reduce((x,y)=>x+y,0);
    return `<div class="secttl" style="margin-top:16px">언제 많이 치나</div>
      <div class="atsum">
        <div><b>${a.days.length}</b><span>모인 날</span></div>
        <div><b>${D[top]}</b><span>가장 붐빔</span></div>
        <div><b>${a.avgPl.toFixed(1)}</b><span>하루 평균</span></div>
        <div><b>${totG?Math.round(totG/a.days.length):0}</b><span>하루 경기</span></div>
      </div>
      <div class="card" style="padding:10px 12px">
        <div class="dowgrid">${a.dow.map((n,i)=>`<div class="${i===0?'sun':''} ${n===mx&&n?'peak':''}">
          <em>${n||''}</em><div class="bar"><i style="height:${n?Math.max(6,Math.round(n/mx*100)):0}%"></i></div>
          <span>${D[i]}</span></div>`).join('')}</div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
        ${a.mon.map(([ym,n])=>`<div class="mrow2">
          <div class="k">${seasonLabel(ym)}</div>
          <div class="track"><i style="width:${Math.round(n/mm*100)}%"></i></div>
          <div class="v"><b>${n}</b><span>${a.days.filter(d=>d.slice(0,String(ym).length)===ym).length}일</span></div>
        </div>`).join('')}</div>
      </div>`;
  };

  const draw=()=>{
    const rs=roster().filter(p=>(S.G[p.id]||0)>0);
    /* 이 시트 안에서만 쓰는 기간 — 'all' 이면 통산 */
    const sl=seasons();
    if(clubPer!=='all' && !sl.includes(clubPer)) clubPer = sl.length ? sl[sl.length-1] : 'all';
    if(!matchPick.a) matchPick.a=(S.me&&S.me.id)||(rs[0]||{}).id||'';
    if(!matchPick.b) matchPick.b=(rs.find(p=>p.id!==matchPick.a)||{}).id||'';
    /* 기간이 의미 있는 탭에만 안쪽에 기간 줄을 둔다 */
    const perBar = sl.length>1 ? `<div class="lgbar" style="margin-bottom:10px">
        <button class="lgb ${clubPer==='all'?'on':''}" data-cper="all">통산</button>
        ${sl.slice().reverse().map(ym=>`<button class="lgb ${clubPer===ym?'on':''}" data-cper="${ym}">${seasonLabel(ym)}</button>`).join('')}
      </div>` : '';
    const body = clubTab==='month' ? perBar+secMonthly()+(clubPer==='all'?secHall():'')
               : clubTab==='lgrec' ? secLgRecord()
               : clubTab==='round' ? secRound()
               : clubTab==='vs'    ? allTime(()=>secMatch(rs)+secRival()+secCycle())
               : clubTab==='bu'    ? perBar+secBuMvp()+secSameBu()+secBuTrend()+secPromo()
               : clubTab==='hof'   ? secHof()
               :                     allTime(()=>secHandi()+secPairs()+secBu()+secAtt());
    /* 리그를 골라 보고 있으면 그 리그에 뜻이 있는 탭만 남긴다 */
    const cTabs = curLg()!=='all'
      ? (lgIsCup(curLg())
          ? [['lgrec','통산 성적'],['round','대진표'],['month','기록']]
          : [['month','기록'],['hof','명예의 전당']])   // 맞대결·부수별·진단은 통합에서만
      : [['month','기록'],['vs','맞대결'],['bu','부수별'],['hof','명예의 전당'],['diag','클럽 진단']];
    if(!cTabs.some(t=>t[0]===clubTab)) clubTab='month';
    return `${lgBarHTML()}
      ${cTabs.length<2?'':`<div class="seg" style="margin-bottom:12px">
      ${cTabs
        .map(([k,v])=>`<button data-ct="${k}" class="${clubTab===k?'on':''}">${v}</button>`).join('')}
    </div>`}${body}`;
  };
  const bind=()=>{
    bindNameTaps(sh);
    sh.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ clubTab=b.dataset.ct; redraw(); });
    sh.querySelectorAll('[data-cper]').forEach(b=>b.onclick=()=>{ clubPer=b.dataset.cper; redraw(); });
    sh.querySelectorAll('[data-clg]').forEach(b=>b.onclick=()=>{ cupLg=b.dataset.clg; cupRd=''; redraw(); });
    sh.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{
      S.lg=b.dataset.lg;
      cupLg=(S.lg!=='all'&&lgIsCup(S.lg))?S.lg:cupLg; cupRd='';
      /* 리그마다 있는 탭이 다르다. 없는 탭이면 첫 탭으로 되돌린다 */
      const ok = S.lg==='all' ? ['month','vs','bu','hof','diag']
               : lgIsCup(S.lg) ? ['lgrec','round','month']
               : ['month','hof'];
      if(!ok.includes(clubTab)) clubTab=ok[0];
      recompute(); redraw(); });
    sh.querySelectorAll('[data-crdnav]').forEach(b=>b.onclick=()=>{
      if(b.dataset.crdnav){ cupRd=b.dataset.crdnav; redraw(); } });
    { const sel=sh.querySelector('[data-crdsel]');
      if(sel) sel.onchange=()=>{ cupRd=sel.value; redraw(); }; }
    sh.querySelectorAll('[data-cfrank]').forEach(b=>b.onclick=()=>{
      const ids=b.dataset.cfrank.split(',');
      copyText(`${lgName(cupLg)} ${roundLabel(cupRd)} 최종순위\n`
        + ids.map((id,i)=>`${i+1}위 ${nameOf(id)}`).join('\n'));
    });
    const a=sh.querySelector('#mpA'), b=sh.querySelector('#mpB');
    if(a) a.onchange=()=>{ matchPick.a=a.value; redraw(); };
    if(b) b.onchange=()=>{ matchPick.b=b.value; redraw(); };
  };
  const redraw=()=>{
    if(host){ host.innerHTML=draw(); bind(); return; }
    const o=sh; sh=sheet('클럽 분석', draw()); o.remove(); bind();
  };
  if(host){ host.innerHTML=draw(); bind(); return; }
  sh=sheet('클럽 분석', draw()); bind();
}
/* 대회 시뮬레이터 화면 */
let simCfg=null;
function simSheet(host){
  const MIN=st().provisional||0;
  /* 시뮬레이터는 리그와 무관하게 클럽 전원을 대상으로 본다.
     S.G 는 지금 보고 있는 리그로 걸러진 값이라 여기서는 쓰지 않는다. */
  const gAll={};
  (S.matches||[]).filter(m=>!m.void).forEach(m=>{ gAll[m.aId]=(gAll[m.aId]||0)+1; gAll[m.bId]=(gAll[m.bId]||0)+1; });
  const pool=roster().filter(p=>(gAll[p.id]||0)>0);
  simCfg = simCfg || { ids:pool.filter(p=>(gAll[p.id]||0)>=MIN).map(p=>p.id),
                       mode:'skill', handi:true, format:'both', groups:2, adv:2, runs:2000, q:'' };
  if(simCfg.q==null) simCfg.q='';
  let sh;
  const roundName = n => n<=2?'결승':n<=4?'4강':n<=8?'8강':n<=16?'16강':n+'강';

  /* 방식에 따른 안내 — 이 부분만 따로 갈아끼운다 */
  const noteHTML=()=>{
    const c=simCfg, n=c.ids.length;
    if(c.format==='league')
      return `${n}명 풀리그 — 서로 한 번씩, 한 사람당 ${Math.max(0,n-1)}경기 (총 ${n*(n-1)/2}경기). 승수로 순위를 매깁니다.`;
    if(c.format==='cup')
      return `${n}명 → ${roundName(nextPow2(n))}부터, 남는 자리는 부전승입니다.`;
    const sz=groupSizes(n, c.gsize);
    const kn=sz.length*c.adv;
    const tot=sz.reduce((a,x)=>a+x*(x-1)/2,0);
    return `${c.gsize?`${c.gsize}명씩`:'4명씩을 기본으로'} <b>${sz.length}개 조</b> — ${sz.join('·')}명`
      + `<br>각 조 ${c.adv}명씩 <b>${kn}명</b>이 올라가 ${roundName(nextPow2(kn))}부터 시작합니다.`
      + (n?` 조별리그는 총 ${tot}경기.`:'');
  };
  /* 참가자 격자 — 부수로 묶고 검색으로 좁힌다 */
  const pickHTML=()=>{
    const q=(simCfg.q||'').trim();
    const hit=q ? pool.filter(p=>matchName(p,q)) : pool;
    if(!hit.length) return `<div class="empty">'${esc(q)}'와 맞는 사람이 없습니다.</div>`;
    const byBu={}; hit.forEach(p=>(byBu[p.bu]=byBu[p.bu]||[]).push(p));
    return Object.keys(byBu).map(Number).sort((a,b)=>a-b).map(bu=>{
      const on=byBu[bu].filter(p=>simCfg.ids.includes(p.id)).length;
      return `<div class="pkgrp">
        <div class="pg-h">${bu}부 <span>${on}/${byBu[bu].length}</span>
          <button class="btn ghost sm" data-bua="${bu}" style="margin-left:auto;padding:2px 8px;font-size:10px">
            ${on===byBu[bu].length?'해제':'전체'}</button></div>
        <div class="picks">${byBu[bu].map(p=>`<button class="pk ${simCfg.ids.includes(p.id)?'w':''}" data-tog="${p.id}">
          <span class="nm">${esc(p.name)}</span></button>`).join('')}</div>
      </div>`;}).join('');
  };
  const headHTML=()=>`참가자 <b>${simCfg.ids.length}명</b>`;

  const draw=()=>{
    const c=simCfg;
    return `
      <p class="tiny dim">대진을 무작위로 뽑아 실제 대회처럼 치러 봅니다. 다시 뽑을 때마다 결과가 달라집니다.</p>
      <div class="secttl" style="margin-top:14px">방식</div>
      <div class="seg">
        <button data-f="league" class="${c.format==='league'?'on':''}">리그전</button>
        <button data-f="cup" class="${c.format==='cup'?'on':''}">토너먼트</button>
        <button data-f="both" class="${c.format==='both'?'on':''}">리그+토너먼트</button>
      </div>
      <div id="simGrp" style="${c.format==='both'?'':'display:none'}">
        <div class="fgrid" style="margin-top:11px">
          <div class="field"><label>조당 인원</label>
            <select id="sgS">
              <option value="0" ${!c.gsize?'selected':''}>자동 (4명 기준)</option>
              ${[3,4,5,6,8].map(n=>`<option value="${n}" ${n===c.gsize?'selected':''}>${n}명씩</option>`).join('')}
            </select></div>
          <div class="field"><label>조당 진출</label>
            <select id="sgA">${[1,2,3,4].map(n=>`<option value="${n}" ${n===c.adv?'selected':''}>${n}명</option>`).join('')}</select></div>
        </div>
      </div>
      <p class="tiny dim" id="simNote" style="margin:6px 2px 0">${noteHTML()}</p>

      <div class="secttl" style="margin-top:16px">경기 조건</div>
      <div class="seg">
        <button data-h="1" class="${c.handi?'on':''}">핸디 적용</button>
        <button data-h="0" class="${!c.handi?'on':''}">노핸디</button>
      </div>

      <div class="split" style="align-items:center;margin-top:16px">
        <div class="secttl" style="margin:0" id="simHead">${headHTML()}</div>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm" data-all>전체</button>
          <button class="btn ghost sm" data-none>해제</button>
        </div>
      </div>
      <div class="findbox" style="margin:8px 0 10px">
        <input id="simFind" placeholder="이름 검색  예) 홍길동, ㅎㄱㄷ" value="${esc(c.q||'')}" autocomplete="off">
        <button class="fx" id="simClear" ${c.q?'':'style="display:none"'}>✕</button>
      </div>
      <div id="simPick">${pickHTML()}</div>
      <button class="btn" id="simGo" style="margin-top:16px" ${c.ids.length<3?'disabled':''}>
        ${c.ids.length<3?'3명 이상 선택하세요':'대진 뽑고 대회 열기'}</button>
      <div id="simOut"></div>`;
  };

  /* 참가자만 다시 그린다 — 시트 전체를 다시 만들면 스크롤이 튄다 */
  const refreshPicks=()=>{
    const box=sh.querySelector('#simPick'); if(box) box.innerHTML=pickHTML();
    const hd=sh.querySelector('#simHead'); if(hd) hd.innerHTML=headHTML();
    const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML();
    const go=sh.querySelector('#simGo');
    if(go){ go.disabled=simCfg.ids.length<3;
      go.textContent=simCfg.ids.length<3?'3명 이상 선택하세요':'대진 뽑고 대회 열기'; }
    const x=sh.querySelector('#simClear'); if(x) x.style.display=simCfg.q?'':'none';
    bindPicks();
  };
  const bindPicks=()=>{
    sh.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.tog, i=simCfg.ids.indexOf(id);
      if(i<0) simCfg.ids.push(id); else simCfg.ids.splice(i,1);
      refreshPicks();
    });
    sh.querySelectorAll('[data-bua]').forEach(b=>b.onclick=()=>{
      const bu=+b.dataset.bua, ms=pool.filter(p=>p.bu===bu);
      const all=ms.every(p=>simCfg.ids.includes(p.id));
      ms.forEach(p=>{ const i=simCfg.ids.indexOf(p.id);
        if(all){ if(i>=0) simCfg.ids.splice(i,1); } else if(i<0) simCfg.ids.push(p.id); });
      refreshPicks();
    });
  };
  const bind=()=>{
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
      simCfg.format=b.dataset.f;
      sh.querySelectorAll('[data-f]').forEach(x=>x.className = x.dataset.f===simCfg.format?'on':'');
      const g=sh.querySelector('#simGrp'); if(g) g.style.display = simCfg.format==='both'?'':'none';
      const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML();
    });
    sh.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{
      simCfg.handi=b.dataset.h==='1';
      sh.querySelectorAll('[data-h]').forEach(x=>x.className = (x.dataset.h==='1')===simCfg.handi?'on':'');
    });
    const a=sh.querySelector('[data-all]'); if(a) a.onclick=()=>{ simCfg.ids=pool.map(p=>p.id); refreshPicks(); };
    const n=sh.querySelector('[data-none]'); if(n) n.onclick=()=>{ simCfg.ids=[]; refreshPicks(); };
    const ga=sh.querySelector('#sgA'); if(ga) ga.onchange=()=>{ simCfg.adv=+ga.value;
      const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML(); };
    const gsz=sh.querySelector('#sgS'); if(gsz) gsz.onchange=()=>{ simCfg.gsize=+gsz.value||0;
      const nt=sh.querySelector('#simNote'); if(nt) nt.innerHTML=noteHTML(); };
    const f=sh.querySelector('#simFind');
    if(f) f.oninput=()=>{ simCfg.q=f.value; refreshPicks(); };
    const cx=sh.querySelector('#simClear');
    if(cx) cx.onclick=()=>{ simCfg.q=''; const el=sh.querySelector('#simFind');
      if(el){ el.value=''; el.focus(); } refreshPicks(); };
    const roll=()=>{
      busyOn('대진 뽑는 중…');
      setTimeout(()=>{
        const d=drawOnce({...simCfg, useHandi:simCfg.handi});
        busyOff();
        const out=sh.querySelector('#simOut');
        if(out){
          out.innerHTML=drawResultHTML(d, simCfg)
            + `<button class="btn ghost" id="simAgain" style="margin-top:12px">다시 뽑기</button>`;
          const ag=sh.querySelector('#simAgain'); if(ag) ag.onclick=roll;
          out.scrollIntoView({behavior:'smooth', block:'start'});
        }
      }, 30);
    };
    const go=sh.querySelector('#simGo');
    if(go) go.onclick=roll;
    bindPicks();
  };
  if(host){ sh=host; host.innerHTML=draw(); bind(); return; }
  sh=sheet('대회 시뮬레이터', draw()); bind();
}

function drawResultHTML(d, c){
  const roundName = n => n<=2?'결승':n<=4?'4강':n<=8?'8강':n<=16?'16강':n+'강';
  const nm = p => esc(p.name)+`<i>${p.bu}부</i>`;
  const champLine = p => p ? `<div class="simchamp"><span class="cup">🏆</span>
      <span class="t"><b>${esc(p.name)}</b><i>${p.bu}부 · ${Math.round(p.r)}</i></span>
      <span class="lab">우승</span></div>` : '';
  const koHTML = ko => {
    if(!ko || !ko.log.length) return '<div class="empty">치를 경기가 없습니다.</div>';
    const by={};
    ko.log.forEach(x=>(by[x.size]=by[x.size]||[]).push(x));
    return Object.keys(by).map(Number).sort((a,b)=>b-a).map(size=>`
      <div class="kor"><div class="ko-h">${roundName(size)}</div>
        ${by[size].map(x=>{
          const W=P(x.win)||{}, L=P(x.lose)||{};
          return `<div class="komat">
            <span class="w">${esc(nameOf(x.win))}<i>${W.bu||'?'}부</i></span>
            <span class="vs">▸</span>
            <span class="l">${esc(nameOf(x.lose))}<i>${L.bu||'?'}부</i></span>
          </div>`;}).join('')}
      </div>`).join('');
  };
  if(d.format==='league'){
    return `<hr class="sep">${champLine(d.league[0])}
      <div class="secttl" style="margin-top:14px">풀리그 결과</div>
      <div class="card">${d.league.map((p,i)=>`<div class="gp ${i===0?'adv':''}">
        <span class="rk">${i+1}</span><span class="n">${nm(p)}</span>
        <span class="wl">${p.w}−${p.l}</span></div>`).join('')}</div>`;
  }
  if(d.format==='cup'){
    return `<hr class="sep">${champLine(d.champ)}
      <div class="secttl" style="margin-top:14px">대진 추첨 (${d.seeds.length}명)</div>
      <p class="tiny dim" style="margin:0 0 8px">뽑힌 순서대로 ${roundName(nextPow2(d.seeds.length))}부터 시작합니다. 빈자리는 부전승입니다.</p>
      <div class="card">${koHTML(d.ko)}</div>`;
  }
  const advIds=new Set((d.seeds||[]).map(p=>p.id));
  return `<hr class="sep">${champLine(d.champ)}
    <div class="secttl" style="margin-top:14px">조 편성 · 조별리그</div>
    <p class="tiny dim" style="margin:0 0 8px">조별 인원 ${d.groups.map(g=>g.length).join('·')}명. 각 조 ${d.adv}명이 본선에 오릅니다. 파란색이 진출자입니다.</p>
    <div class="ggrid">${d.groups.map((g,gi)=>`<div class="card gcard">
      <div class="gc-h">${String.fromCharCode(65+gi)}조</div>
      ${g.map((p,i)=>`<div class="gp ${advIds.has(p.id)?'adv':''}">
        <span class="rk">${i+1}</span><span class="n">${nm(p)}</span>
        <span class="wl">${p.w}−${p.l}</span></div>`).join('')}
    </div>`).join('')}</div>
    <div class="secttl" style="margin-top:16px">본선 토너먼트</div>
    <div class="card">${koHTML(d.ko)}</div>`;
}
/* 시즌별 요약 — 한 시즌이 카드 한 장 */
function seasonRowsHTML(id, mode){
  const yms=seasons().slice().reverse();
  const MIN=st().provisional||0;
  const other = mode==='skill' ? 'form' : 'skill';
  const rankIn=(ym,md)=>{
    const all=standings(ym,md).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    return i<0?0:i+1;
  };
  const out=yms.map((ym,idx)=>{
    const all=standings(ym,mode);
    const me=all.find(r=>r.p.id===id);
    if(!me || !me.g) return '';
    const oth=standings(ym,other).find(r=>r.p.id===id);
    const rank=rankIn(ym,mode);
    const prevYm=yms[idx+1];
    const prev=prevYm?rankIn(prevYm,mode):0;
    const mv=(rank&&prev)?prev-rank:0;
    const ss=seasonStats(id,ym,mode);
    const pct=me.g?Math.round(me.w/me.g*100):0;
    const hiN=ss?(ss.hiW+ss.hiL):0, loN=ss?(ss.loW+ss.loL):0;
    const chips=[
      ['경기', `${me.g}`, ''],
      ['출석', `${playDaysOf(id, ym)}일`, ''],
      ['상위 부수', hiN?`${ss.hiW}−${ss.hiL}`:'0−0', hiN&&ss.hiW>ss.hiL?'up':''],
      ['하위 부수', loN?`${ss.loW}−${ss.loL}`:'0−0', ''],
      ['이변', `${ss?ss.ups:0}`, ss&&ss.ups?'hot':''],
      ['상대 평균', ss&&ss.avgBu?ss.avgBu.toFixed(1)+'부':'–', ''],
      ['이긴 최강 상대', ss&&ss.best?`${nameOf(ss.best.oid)} (${ss.best.bu}부)`:'–', ss&&ss.best?'best':'']
    ];
    return `<div class="sez ${rank>=1&&rank<=3?'m'+rank:''}">
      <div class="sz-top">
        <div class="sz-rk">${rank?`<span class="rn">${rank}</span><span class="ru">위</span>`
          :`<span class="rn dim">–</span>`}${mv?`<span class="mv ${mv>0?'up':'down'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:''}</div>
        <div class="sz-tt">
          <b>'${ym.slice(2,4)} ${ym.slice(5)}</b>
          <span class="rec"><em>${me.w}−${me.l}</em><i>${pct}%</i></span>
        </div>
        <div class="sz-rt">
          <div class="on"><b>${Math.round(me.r)}</b><span>${MODES[mode].label}</span></div>
          ${oth?`<div class="off"><b>${Math.round(oth.r)}</b><span>${MODES[other].label}</span></div>`:''}
        </div>
      </div>
      <div class="sz-chips">${chips.map(([k,v,c])=>
        `<span class="chip ${c}"><i>${k}</i><b>${esc(v)}</b></span>`).join('')}</div>
    </div>`;
  }).filter(Boolean);
  return out.length ? out.join('') : `<div class="empty">아직 시즌 기록이 없습니다.</div>`;
}
function seasonBlockHTML(id){

  return `<div class="card">

      <div class="seg mini">
        <button data-sz="skill" class="${m==='skill'?'on':''}">${MODES.skill.label}</button>

/* 선수 카드 — 그림은 그대로 두고 순위·시즌·이름·레이팅만 얹는다 */
function cardHTML(id, per, mode){
  const p=P(id); if(!p) return '';
  const m = mode || S.mode || 'skill';
  const ym = (per && per!=='all') ? per : ((seasons().slice(-1)[0])||monthOfNow());
  const rows = standings(ym, m).filter(r=>r.g>=(st().provisional||0));
  const i = rows.findIndex(r=>r.p.id===id);
  const me = i>=0 ? rows[i] : null;
  const rank = i>=0 ? i+1 : null;
  const rate = me ? Math.round(me.r) : Math.round(rateOf(id,m));
  const sz = seasonStats(id, ym, m);
  const ms = monthStand(ym, m);
  const G=ms.G[id]||0, W=ms.W[id]||0, L=ms.L[id]||0;
  const T  = (playerTitles(ym, m)||{})[id] || [];
  const days = playDaysOf(id, ym);
  const hi = sz && sz.best ? sz.best : null;
  /* mark 가 있으면 그 줄을 강조하고, 왜 강조됐는지를 딱지로 붙인다 */
  const line = (k,v,mark)=>`<div class="cb-r${mark?' hot':''}">
    <span>${k}</span><b>${v}</b>${mark?`<i class="mk">${mark}</i>`:''}</div>`;
  return `<div class="pcwrap"><div class="pcflip" data-flip>
    <div class="pcface front" style="background-image:url('${cardBgFor(p)}')">
      <div class="pc-rank">${rank?`<b>${rank}</b>`:`<b class="na">–</b>`}</div>
      ${(()=>{ const e=[];
        const MED={1:'🥇',2:'🥈',3:'🥉'};
        /* 전 부수 통합 랭킹은 트로피, 부수 안 순위는 메달 */
        const cup =(cls,cap,n)=>`<div class="em ${cls} cup${n===1?' first':''}">
          <i class="tr">🏆</i><span class="cap">${cap}</span><b>${n}위</b></div>`;
        const medal=(cap,n)=>`<div class="em bu${n===1?' first':''}">
          <i class="tr">${MED[n]}</i><span class="cap">${cap}</span><b>${n}위</b></div>`;
        const rankIn=(mk)=>{
          const rs=standings(ym, mk).filter(r=>r.g>=(st().provisional||0));
          const i2=rs.findIndex(r=>r.p.id===id);
          return i2>=0 && i2<3 ? i2+1 : null;
        };
        const rs2=rankIn('skill'), rf=rankIn('form');
        if(rs2) e.push(cup('m'+rs2, MODES.skill.label, rs2));
        if(rf)  e.push(cup('m'+rf,  MODES.form.label,  rf));

/* 그 선수의 경기 원본 — 날짜만 죽 늘어놓고, 누르면 그날 경기가 펼쳐진다 */
let pLogOpen = {}, pLogMon = {};
function playerLogHTML(id){
  const all=(S._sorted||[]).filter(m=>m.aId===id||m.bId===id);
  if(!all.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  const ord={}; (S._sorted||[]).forEach((m,i)=>ord[m.id]=i);
  const byDay={};
  all.forEach(m=>(byDay[m.date]=byDay[m.date]||[]).push(m));
  const days=Object.keys(byDay).sort();
  const months=[...new Set(days.map(d=>d.slice(0,7)))].sort();
  /* 보고 있는 달과 펼친 날 */
  pLogMon[id] = pLogMon[id] && months.includes(pLogMon[id]) ? pLogMon[id] : months[months.length-1];
  const ym=pLogMon[id];
  const openD = pLogOpen[id];
  const dayStat=d=>{ const ms=byDay[d]||[];
    const w=ms.filter(m=>winnerOf(m)===id).length;
    const net=ms.reduce((a,m)=>a+((m.aId===id?m._sA:m._sB)||0),0);
    return {n:ms.length, w, l:ms.length-w, net}; };

  const first=new Date(Y, M-1, 1), lead=first.getDay();

  const monTot=days.filter(d=>d.slice(0,String(ym).length)===ym).reduce((a,d)=>{ const x=dayStat(d);
    return {n:a.n+x.n, w:a.w+x.w, net:a.net+x.net}; }, {n:0,w:0,net:0});
  const mi=months.indexOf(ym);

      <div class="pd-b">${ms.map(m=>{

        const won = winnerOf(m)===id;
        const dR  = Math.round((m.aId===id ? m._sA : m._sB)||0);
        const e   = expFor(m, id);
        const pk  = m.aId===id ? m._peakA : m._peakB;
        const h   = m.handi&&m.handi.pts ? (m.handi.toId===id?`+${m.handi.pts}`:`상대 +${m.handi.pts}`) : '';
        return `<div class="plrow ${won?'w':'l'}">
          <span class="rs">${won?'승':'패'}</span>
          <span class="op">${esc(nameOf(opp))}<i>${(P(opp)||{}).bu||'?'}부</i></span>
          ${h?`<span class="hd">${h}</span>`:''}
          ${e!=null&&won&&e<UPSET?`<span class="ux">이변</span>`:''}
          ${pk!=null?`<span class="pkx">최고 ${pk}</span>`:''}
          <span class="dr ${dR>0?'up':dR<0?'down':'dim'}">${dR>0?'+':''}${dR}</span>
        </div>`;}).join('')}</div>
    </div>`;})() : `<p class="tiny dim" style="text-align:center;margin:10px 2px 0">날짜를 누르면 그날 치른 경기가 표시됩니다.</p>`;

  return `<div class="pcalh">
      <button class="pcnav" data-pmon="${months[mi-1]||''}" ${mi>0?'':'disabled'}>‹</button>
      <div class="ct"><b>'${ym.slice(2,4)} ${ym.slice(5)}</b>
        <span>${monTot.n}경기 · ${monTot.w}승 ${monTot.n-monTot.w}패 ·
          <i class="${monTot.net>0.5?'up':monTot.net<-0.5?'down':''}">${monTot.net>0?'+':''}${Math.round(monTot.net)}</i></span></div>
      <button class="pcnav" data-pmon="${months[mi+1]||''}" ${mi<months.length-1?'':'disabled'}>›</button>
    </div>
    <div class="pcal">
      ${['일','월','화','수','목','금','토'].map((d,k)=>`<div class="pcw ${k===0?'sun':''}">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d) return `<div class="pcd empty"></div>`;
        const x=dayStat(d);
        if(!x.n) return `<div class="pcd off">${+d.slice(8)}</div>`;
        const rate=x.w/x.n;

      이긴 날은 초록색, 진 날은 붉은색으로 표시되며 전승·전패는 더 진하게 나타납니다.</p>
    ${detail}`;

        </div>
        ${x.peers>=2?`<div class="sosr">

        <p class="tiny dim" style="margin:8px 2px 0">${x.vsPeer>0
            ? `같은 부수 평균보다 <b>${x.vsPeer.toFixed(1)}승</b> 더 거뒀습니다.`
            : x.vsPeer<-0.5 ? `같은 부수 평균보다 <b>${(-x.vsPeer).toFixed(1)}승</b> 모자랍니다.`
            : '같은 부수 평균과 비슷합니다.'} (${(P(id)||{}).bu}부 평균 ${Math.round(x.peerR)} · ${x.peers}명 기준)</p>`:''}
      </div>`; })()}
    ${(()=>{ const e=eloByOpp(id).filter(x=>x.n>=2);
      if(e.length<2) return '';
      const mx=Math.max(...e.map(x=>Math.abs(x.net)),1);
      const up=e.filter(x=>x.net>0).slice(0,5);
      const dn=e.filter(x=>x.net<0).slice(-5).reverse();
      const row=x=>`<div class="eo ${x.net>0?'up':'down'}">

        <span class="r">${x.w}−${x.l}</span>

        <span class="v">${x.net>0?'+':''}${Math.round(x.net)}</span>
      </div>`;
      return `<div class="card">
        <div class="secttl">상대별 점수 주고받기</div>
        <p class="tiny dim" style="margin:0 0 10px">상대별로 주고받은 레이팅의 합계입니다. 2경기 이상 겨룬 상대만 표시됩니다.</p>

<div class="card">

/* 맞대결 상세 — 테니스 H2H처럼 두 사람을 고른 뒤에만 자세히 본다 */
function renderH2H(meIdStr, oppId){
  const box=document.getElementById('h2hBox'); if(!box) return;
  if(!oppId){ box.innerHTML=''; return; }
  const a=h2hStats(meIdStr); if(!a) return;
  const o=a.list.find(x=>x.oid===oppId); if(!o){ box.innerHTML=''; return; }
  const g=o.w+o.l, pct=Math.round(o.w/g*100);
  const last=o.hist[0];
  box.innerHTML=`<div class="h2hcard">
    <div class="h2hnum"><b>${o.w}</b><span>−</span><b class="l">${o.l}</b></div>
    <div class="h2hbar"><i style="width:${pct}%"></i></div>
    <div class="split tiny dim" style="margin-top:7px"><span>내 승 ${o.w}</span><span>${esc(nameOf(oppId))} 승 ${o.l}</span></div>
    <div class="split tiny" style="margin-top:12px"><span class="dim">핸디</span>
      <span>${o.handi?`${o.handi.pts}점 ${o.handi.mine?'받음':'줌'}`:'없음'}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">최근 결과</span>
      <span class="form">${o.hist.map(x=>`<span class="${x.w?'w':'l'}" title="${x.d}">${x.w?'W':'L'}</span>`).join('')}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">마지막 경기</span><span>${last?last.d:'-'}</span></div>
  </div>`;
}

async function reassignEntrant(fromId, toId){
  let n=0;
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

/* ── 밴드 연동 ──────────────────────────────────────────────
   밴드 댓글은 "@이름 @이름 님 상대 승" 형태다.
   같은 상대와 여러 판이면 "@이름 ×2" 로 적는다. */
const bandNorm = n => String(n||'').replace(/\([^)]*\)/g,'').replace(/님$/,'').trim();
const bandLabel = p => (p && (p.bandName || p.name)) || '';
/* 한 줄 안에 승과 패가 같이 있을 수 있다.
   '@A 상대 패 @B @C 님 상대 승' → A는 패, B·C는 승.
   승/패 표시가 나올 때마다 그 앞의 이름들을 묶는다. */
function parseResultLine(line){
  const out=[];
  const re=/@([^\s@×xX*]+(?:\([^)]*\))?)|(승|패)/g;
  let m, buf=[];
  while((m=re.exec(line))){
    if(m[1]){ const raw=String(m[1]).trim(); const name=bandNorm(raw); if(name) buf.push({raw,name}); }
    else if(buf.length){
      const r = m[2]==='승' ? 'W' : 'L';
      buf.forEach(x=>out.push({...x, r}));
      buf=[];
    }
  }
  return out;
}
function parseBandText(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    parseResultLine(line).forEach(x=>rows.push(x));
  }
  const seen={};
  return rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; });
}

  const out=[]; let cur=null;
  const push=()=>{ if(cur && cur.rows.length) out.push(cur); cur=null; };
  for(const raw of String(text||'').split(/\n+/)){
    let line=raw.trim(); if(!line) continue;
    /* [멤버](주소)홍길동 → 홍길동 */
    line=line.replace(/^\[[^\]]*\]\([^)]*\)\s*/, '');
    if(!line || BAND_NOISE.test(line)) continue;
    const t=line.match(BAND_TIME);
    if(t){                                        // 시각 줄 — 한 사람 댓글이 끝난 자리
      if(cur && t[1]) cur.date=`${Y}-${String(+t[1]).padStart(2,'0')}-${String(+t[2]).padStart(2,'0')}`;
      push(); continue;
    }
    if(line.includes('@')){
      if(!cur) continue;                          // 글쓴이를 아직 모르면 건너뛴다
      parseResultLine(line).forEach(x=>cur.rows.push(x));
      continue;
    }
    /* 남은 건 글쓴이 이름 */
    push();
    cur={author:line, authorNorm:bandNorm(line), date:null, rows:[]};
  }
  push();
  /* 같은 사람이 같은 상대를 두 번 적었으면 한 번만 */
  out.forEach(c=>{ const seen={};
    c.rows=c.rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; }); });
  return out;
}
/* 한 번 알려준 밴드 이름은 선수에 별칭으로 남겨두고 다음부터 자동으로 맞춘다 */
function matchPlayerByName(raw){
  const r=String(raw||'').trim(), n=bandNorm(r);
  if(!n) return null;
  const A=x=>x.aliases||[];
  let p = S.players.find(x=>x.bandName===r)
       || S.players.find(x=>A(x).includes(r))
       || S.players.find(x=>x.name===n)
       || S.players.find(x=>A(x).some(a=>bandNorm(a)===n))
       || S.players.find(x=>bandNorm(x.name)===n);
  if(p) return p;
  const cands=S.players.filter(x=>x.name.startsWith(n)||n.startsWith(x.name));
  if(cands.length===1) return cands[0];
  /* 대진표 머리글처럼 이름 뒷부분만 적힌 경우 — '주형' → '이주형' */
  if(n.length>=2){
    const tail=S.players.filter(x=>x.name.endsWith(n));
    if(tail.length===1) return tail[0];
  }
  return null;
}
/* 이름 패턴 기억하기 */
async function learnAliases(pairs){          // [{pid, raw}]
  const need=pairs.filter(({pid,raw})=>{
    const p=P(pid); if(!p || !raw) return false;
    return p.bandName!==raw && !(p.aliases||[]).includes(raw);
  });
  if(!need.length) return;
  await savePlayers(map=>{
    for(const {pid,raw} of need){
      const x=map.get(pid); if(!x) continue;
      x.aliases=[...new Set([...(x.aliases||[]), raw])].slice(0,6);
      if(!x.bandName) x.bandName=raw;         // 내보낼 때 쓸 대표 이름
    }
  });
}
/* 내 경기를 밴드 댓글 형식으로 만든다 */
function bandTextFor(meIdStr, date){
  const win={}, lose={};
  for(const m of S.matches){
    if(m.void || m.date!==date) continue;
    if(m.aId!==meIdStr && m.bId!==meIdStr) continue;
    const opp = m.aId===meIdStr ? m.bId : m.aId;
    const box = winnerOf(m)===meIdStr ? win : lose;
    box[opp]=(box[opp]||0)+1;
  }
  const fmt = box => Object.keys(box).map(id=>`@${bandLabel(P(id))||nameOf(id)}`).join(' ');
  const out=[];
  if(Object.keys(win).length)  out.push(`${fmt(win)} 님 상대 승`);
  if(Object.keys(lose).length) out.push(`${fmt(lose)} 님 상대 패`);
  return out.join('\n');
}

                       joinedAt:new Date().toISOString(), addedBy:S.me.id };
            if(!await savePlayers(map=>map.set(np.id,np)))
              return errorSheet('저장하지 못했습니다','새 선수를 추가하는 중 문제가 생겼습니다.');
            p=P(np.id); added++;
          }
        } else p=P(fx);
      }
      if(!p || p.id===meIdStr) continue;
      if(explicit || r.raw!==p.name) learn.push({pid:p.id, raw:r.raw});
      picks[p.id]={r:r.r, n:1};
    }
    if(!Object.keys(picks).length) return toast('등록할 경기가 없습니다.',1);
    sh.remove();
    S.busy=true; busyOn('정리하는 중…');
    await learnAliases(learn);
    const res=await planAndSave(date, meIdStr, picks, bandImp.lg||defLeague());
    S.busy=false; busyOff();
    if(!res.ok) return errorSheet('저장하지 못했습니다','밴드 글에서 읽은 경기를 저장하지 못했습니다.');
    audit('밴드 가져오기', `${nameOf(meIdStr)} · ${date} · 등록 ${res.created} / 합침 ${res.merged} / 건너뜀 ${res.skipped}`);
    bandImp=null; render();
    const parts=[];
    if(res.created) parts.push(`${res.created}건 등록`);
    if(res.merged)  parts.push(`${res.merged}건 합침`);
    if(res.skipped) parts.push(`${res.skipped}건 건너뜀`);
    if(added) parts.push(`선수 ${added}명 추가`);
    if(learn.length) parts.push(`이름 ${learn.length}개 기억`);
    toast(parts.join(' · ')||'등록할 경기가 없었습니다.');
  }
}
/* 확인 대기 처리 — 맞으면 확인, 아니면 반려 */
function confirmQueue(){
  const list=pendingForMe();
  if(!list.length) return toast('확인할 경기가 없습니다.');
  const sh=sheet(`확인 대기 ${list.length}건`, `
    <p class="tiny dim">상대가 올린 경기입니다. 맞으면 확인, 기억과 다르면 반려하세요. 확인해야 랭킹에 반영됩니다.</p>
    <div id="pendList" style="margin-top:12px">
      ${list.map(m=>{
        const win=winnerOf(m), iWon=win===S.me.id, opp=iWon?loserOf(m):win;
        return `<div class="pndc" id="pc_${m.id}">
          <div class="pw ${iWon?'w':'l'}">${iWon?'내 승':'내 패'}</div>
          <div class="pi"><b>${esc(nameOf(opp))}</b><small>${dateLabel(m.date)}${
            m.handi&&m.handi.pts?` · 핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}`:''}</small></div>
          <div class="pb">
            <button class="btn sm" data-yes="${m.id}">확인</button>
            <button class="btn ghost sm" data-no="${m.id}">반려</button>
          </div></div>`;
      }).join('')}
    </div>`);
  const refresh=()=>{ sh.remove(); render(); if(pendingForMe().length) confirmQueue(); else toast('확인 대기가 모두 처리됐습니다.'); };
  sh.querySelectorAll('[data-yes]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.yes); if(!m) return;
    const ok=await commitMatch({...m, confirmedBy:[...new Set([...(m.confirmedBy||[]),S.me.id])],
                                status:'confirmed', rev:(m.rev||0)+1});
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 확인', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`);
    refresh();
  });
  sh.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.no); if(!m) return;
    const ok=await deleteMatchById(m.id);
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 반려', `${nameOf(m.enteredBy)} 입력분 (${m.date})`);
    refresh();
  });
}

/* 같은 날 · 같은 두 사람 · 같은 승자 = 중복 의심.
   누가 넣었는지, 확정됐는지는 따지지 않는다. 진짜 두 판 쳤을 수도 있으니 판단은 사람이 한다. */
function findDuplicates(){
  const live=S.matches.filter(m=>!m.void);
  const by={};
  live.forEach(m=>{
    const k=[m.aId,m.bId].sort().join('|')+'|'+m.date+'|'+winnerOf(m)+'|'+lgOf(m);
    (by[k]=by[k]||[]).push(m);
  });
  const out=[];
  Object.values(by).forEach(g=>{
    if(g.length<2) return;
    /* 넣은 순서대로 두고, 앞의 것을 남기고 뒤의 것을 지우게 한다 */
    g.sort((x,y)=>String(x.enteredAt||'').localeCompare(String(y.enteredAt||'')));
    for(let i=1;i<g.length;i++) out.push({a:g[0], b:g[i], n:g.length});
  });
  return out;
}

/* ── 시트 / 확인 ── */
function sheet(title, html, footer){
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="sheet">
    <div class="sh-bar ${title?'':'bare'}"><div class="grip"></div>
      ${title?`<h3>${esc(title)}</h3>`:''}
      <button class="sh-x" aria-label="닫기">✕</button></div>
    ${html}${footer||''}</div>`;
  const onKey=e=>{ if(e.key==='Escape') close(); };
  const close=()=>{ if(!mask.isConnected) return;
    mask.classList.add('out'); setTimeout(()=>mask.remove(), 140); };
  mask.close=close;
  mask.onclick=e=>{ if(e.target===mask) close(); };            // 바깥을 눌러도 닫힌다
  mask.querySelector('.sh-x').onclick=close;
  window.addEventListener('keydown', onKey);
  /* 시트가 떠 있는 동안 뒷화면이 같이 밀리지 않게 잠근다 */
  const lockY = window.scrollY || 0;
  const openCount = (S._sheets = (S._sheets||0) + 1);
  if(openCount===1){
    document.body.style.position='fixed';
    document.body.style.top = (-lockY)+'px';
    document.body.style.left='0'; document.body.style.right='0';
    document.body.style.width='100%';
    S._lockY = lockY;
  }
  const origRemove=mask.remove.bind(mask);
  mask.remove=()=>{
    window.removeEventListener('keydown', onKey);
    S._sheets = Math.max(0, (S._sheets||1) - 1);
    if(S._sheets===0){
      document.body.style.position='';
      document.body.style.top=''; document.body.style.left='';
      document.body.style.right=''; document.body.style.width='';
      window.scrollTo(0, S._lockY||0);
    }
    origRemove();
  };
  /* 위에서 아래로 밀어서 닫기 — 시트가 맨 위로 올라와 있을 때만 */
  const box=mask.querySelector('.sheet');
  let y0=null, dy=0;
  box.addEventListener('touchstart', e=>{ if(box.scrollTop>0){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; }, {passive:true});
  box.addEventListener('touchmove', e=>{ if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){ box.style.transition='none'; box.style.transform='translateY('+dy+'px)'; }
  }, {passive:true});
  box.addEventListener('touchend', ()=>{ if(y0==null) return;
    box.style.transition='transform .16s ease';
    if(dy>90) close(); else box.style.transform='';
    y0=null; });
  document.body.appendChild(mask); return mask;
}
function confirmSheet(title, html, okLabel, fn){
  const m=sheet(title,`<p class="tiny" style="line-height:1.7;color:var(--mut)">${html}</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" data-no>취소</button><button class="btn" data-yes>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-no]').onclick=()=>m.remove();
  m.querySelector('[data-yes]').onclick=async()=>{ m.remove(); await fn(); };
}

/* 내가 쓴 뒤 남기는 신호 — 다른 기기만 이걸 보고 새로고침한다 */
function bumpSig(){ if(FB) FB.set('sig', {t:Date.now(), by:CLIENT}).catch(()=>{}); }
/* 새 확인 요청이 들어오면 화면에서만 알린다 (브라우저 알림은 쓰지 않는다) */
function notifyPending(added){ toast(`확인할 경기 ${added}건이 새로 들어왔습니다.`); }
/* 다른 사람이 경기를 넣으면 알아서 새로고침 — 입력 중일 때는 건드리지 않는다 */
function watchRemote(){
  if(!FB) return;
  let t=null, first=true;
  FB.watch(sig=>{
    if(first){ first=false; return; }
    if(sig && sig.by===CLIENT) return;          // 내가 쓴 변경은 이미 화면에 반영돼 있다
    clearTimeout(t);
    t=setTimeout(async()=>{
      if(S.busy) return;
      const a=document.activeElement;
      if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;   // 입력 중이면 다음 기회에
      if(document.querySelector('.mask')) return;                     // 확인창 떠 있으면 대기
      const before = pendingForMe().length;
      await loadAll();
      if(S.me){ const me=P(S.me.id); if(me) S.me=me; }
      const after = pendingForMe().length;
      if(after>before) notifyPending(after-before);
      softRender();
    }, 500);
  });
}
(async()=>{
  render();
  await defPin();

  /* 1) 캐시가 있으면 네트워크를 기다리지 않고 바로 보여준다 */
  const cached = loadCache();
  if(cached && cached.players){
    S.meta = cached.meta || {settings:{...DEFAULTS}};
    S.meta.settings = {...DEFAULTS, ...(S.meta.settings||{})};
    S.players = cached.players || [];
    S.matches = cached.matches || [];
    recompute();
    const ses0 = await sGet(KEY.session,false);
    if(ses0 && ses0.playerId){ const p=P(ses0.playerId); if(p && p.active!==false) S.me=p; }
    S.ready = true; S.stale = true;
    render();
  }

  /* 2) 최신 데이터를 받아 갱신한다 */
  FB = await initFirebase();
  S.connecting = false;
  await loadAll();
  if(!S.matches.length) await migrateShards();      // 예전 저장 방식이 남아 있을 때만
  if(S.matches.length===0 && FB) await loadAll();
  const ses = await sGet(KEY.session,false);
  if(ses && ses.playerId){
    const p=P(ses.playerId);
    if(p && p.active!==false){ S.me=p; sSet(KEY.session,{playerId:p.id, at:Date.now()},false); }
    else if(!p){ S.me=null; sDel(KEY.session,false); }     // 계정이 지워진 경우
  }
  S.ready = true; S.stale = false;
  softRender();
  const np = pendingForMe().length;
  if(np) setTimeout(()=>toast(`확인할 경기가 ${np}건 있습니다.`), 700);
  watchRemote();
})();
