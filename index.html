@import url('https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --bg:#0d1114; --bg2:#121a1e; --surf:#182227; --surf2:#1e2a30;
  --line:#26343c; --line2:#31434c;
  --txt:#e7eef1; --mut:#93a6b0; --dim:#637984;
  --blue:#2f92da; --blue-d:#1b5f92; --red:#e04b3f; --red-d:#8f2c24;
  --ball:#f3f0e6; --ok:#3fbf8f; --warn:#e0a53f;
  --tt:#f0a03c;                      /* 탁구공 오렌지 */
  --display:'Anton','IBM Plex Sans KR',sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;background:var(--bg2);
  border:1px solid var(--line);color:var(--txt);border-radius:8px;width:100%;padding:8px 12px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px;letter-spacing:.02em}
.field{margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--blue);border:none;color:#fff;border-radius:8px;padding:12px 16px;font-weight:600;width:100%}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.danger{background:transparent;border:1px solid var(--red-d);color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:8px;min-height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.muted{color:var(--mut)}.dim{color:var(--dim)}.tiny{font-size:11px;line-height:1.6}
h2{font-family:var(--display);font-size:26px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.2}
.num{font-family:var(--body);font-weight:600;font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(13,17,20,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;height:54px}
.logo{font-family:var(--body);font-weight:600;font-size:17px;letter-spacing:-.01em}
.logo b{color:var(--blue);font-weight:700}
.logo .ball{margin-left:5px}
@media (prefers-reduced-motion:no-preference){
  .logo .ball{animation:tt-bounce 2.6s cubic-bezier(.3,0,.4,1) infinite}
  @keyframes tt-bounce{0%,58%,100%{transform:translateY(0)}20%{transform:translateY(-7px)}
    38%{transform:translateY(0)}46%{transform:translateY(-3px)}}
}
/* 탁구공 */
.ball{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:1px;
  background:radial-gradient(circle at 32% 28%, #fff5e6, var(--tt) 55%, #c8761a);
  box-shadow:0 0 7px rgba(240,160,60,.45)}

.chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--dim)}
.dot.sync{background:var(--warn);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,17,20,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:none;padding:8px 4px 12px;color:var(--dim);font-size:11px;text-align:center;min-height:56px}
.tab .ic{display:block;font-size:20px;line-height:1.35}
.tab.on{color:var(--blue)}
.tab.on .ic{filter:drop-shadow(0 0 6px rgba(47,146,218,.5))}


/* rank rows — 스포츠 앱 톤 */
.rk{position:relative;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 10px;
  border:1px solid var(--line);border-radius:12px;background:var(--surf);

.rk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.rk.me{border-color:var(--blue-d);background:linear-gradient(100deg,rgba(47,146,218,.12),var(--surf) 55%)}
.rk.me::before{background:var(--blue)}
.rk.unranked{opacity:.66;border-style:dashed}
/* 순위 칸 */
.pos{width:30px;flex:none;text-align:center;line-height:1}
.pos .num{font-family:var(--body);font-weight:700;font-size:22px;font-weight:800;color:var(--mut);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rk.unranked .pos .num{font-size:17px;color:var(--dim)}
.pos .mv{display:block;font-size:10px;font-weight:700;margin-top:4px}
/* 이름 · 지표 */
.nm{display:flex;align-items:center;gap:3px;font-size:17px;font-weight:700;letter-spacing:-.02em;
  flex-wrap:wrap;row-gap:4px;min-width:0}

.nm .badge,.nm .heat,.nm .t{flex:none}
.meta{display:flex;align-items:baseline;gap:8px;margin-top:4px;

.meta .wl{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--body);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.meta .wl em{font-style:normal;font-size:15px;font-weight:600;color:var(--dim);margin-left:4px}

  color:var(--dim);margin-right:2px}
.meta .pc{font-family:var(--body);font-weight:600;font-size:13px;font-weight:800;color:var(--blue);letter-spacing:0;font-variant-numeric:tabular-nums}

.heat{font-size:12px;line-height:1;margin-left:1px;cursor:pointer}
.t{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;white-space:nowrap;
  background:rgba(255,255,255,.06);color:var(--mut);letter-spacing:0;cursor:pointer}
.tdesc{display:flex;align-items:baseline;gap:8px;padding:8px 0;font-size:12px}
.tdesc+.tdesc{border-top:1px solid var(--line)}
.tdesc b{flex:none;width:82px;font-size:12px;color:var(--mut)}
.tdesc span{flex:1;min-width:0;color:var(--dim);font-size:11px;line-height:1.5}
.tdesc.on b{color:var(--blue)}
.tdesc.on span{color:var(--mut)}
.t.gold{background:rgba(216,180,90,.18);color:#f2dea2}
.t.red{background:rgba(224,75,63,.18);color:#f0837a}
.t.warn{background:rgba(224,165,63,.16);color:var(--warn)}
.t.blue{background:rgba(47,146,218,.16);color:#8fc8ee}
.t.purple{background:rgba(170,120,220,.18);color:#c79bf0}
.t.ok{background:rgba(63,191,143,.16);color:var(--ok)}
.sub3{margin-top:5px;font-size:11px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub3 b{font-weight:700;color:var(--mut)}
.sub3 b.up,.sub3 .up{color:var(--ok)}
.sub3 b.down,.sub3 .down{color:var(--red)}
/* 레이팅 */
.rt .v{font-family:var(--body);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rt .d{font-family:var(--body);font-weight:600;font-size:11px;font-weight:700;margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:0}
/* 시상대 — 1·2·3위 메달 */
.bmv{display:grid;grid-template-columns:38px 1fr auto auto;align-items:baseline;gap:8px;padding:7px 0;font-size:13px}
.bmv+.bmv{border-top:1px solid var(--line)}
.bmv .b{font-size:11px;font-weight:800;color:var(--blue)}
.bmv .n{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sbu{display:grid;grid-template-columns:16px 1fr auto 34px;align-items:baseline;gap:8px;padding:5px 0;
  font-size:12.5px;font-variant-numeric:tabular-nums}
.sbu+.sbu{border-top:1px solid var(--line)}
.sbu .i{color:var(--dim);font-size:10px}
.sbu .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbu .r{color:var(--mut)}
.sbu .d{text-align:right;font-weight:700;color:var(--dim)}
.sbu .d.up{color:var(--ok)}.sbu .d.down{color:var(--red)}

.btr .s{font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap;overflow:hidden}
.btr .s i{font-style:normal}

.btr .d{text-align:right;font-weight:700;color:var(--dim)}
.btr .d.up{color:var(--ok)}.btr .d.down{color:var(--red)}
.pro{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.pro .n b{font-size:14px}.pro .n span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.pro .v{text-align:right}
.pro .v b{font-size:16px;color:var(--ok);font-variant-numeric:tabular-nums}
.pro .v span{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.bugrp{margin-bottom:12px}
.bg-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 6px}
.bg-h b{font-size:14px;font-weight:800}
.bg-h span{flex:1;font-size:11px;color:var(--dim)}
.bg-h em{font-style:normal;font-size:11px;font-weight:700;color:#f0837a}
.medal{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--body);font-weight:700;font-size:17px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.medal.m1{background:linear-gradient(145deg,#f7e296,#d8b45a 45%,#a5801f);color:#241a02;
  box-shadow:0 2px 12px rgba(216,180,90,.55), inset 0 1px 0 rgba(255,255,255,.5)}
.medal.m2{background:linear-gradient(145deg,#f0f4f8,#c2ccd7 45%,#8b97a4);color:#1b2026;
  box-shadow:0 2px 8px rgba(190,203,214,.3), inset 0 1px 0 rgba(255,255,255,.6)}
.medal.m3{background:linear-gradient(145deg,#eec5a0,#c2895a 45%,#8a5b34);color:#2a1704;
  box-shadow:0 2px 8px rgba(194,137,90,.3), inset 0 1px 0 rgba(255,255,255,.4)}
.rk.md{position:relative;overflow:hidden}
.rk.md .nm{font-size:20px}
.rk.md .rt .v{font-size:26px}
.rk.md1::before{background:linear-gradient(180deg,#f7e296,#a5801f)}
.rk.md2::before{background:linear-gradient(180deg,#f0f4f8,#8b97a4)}
.rk.md3::before{background:linear-gradient(180deg,#eec5a0,#8a5b34)}
.rk.md1{border-color:#a5801f;background:linear-gradient(100deg,rgba(216,180,90,.15),var(--surf) 58%);
  box-shadow:0 0 0 1px rgba(216,180,90,.18), 0 6px 20px -10px rgba(216,180,90,.55)}
.rk.md2{border-color:#6f7b88;background:linear-gradient(100deg,rgba(194,204,215,.11),var(--surf) 58%)}
.rk.md3{border-color:#8a5b34;background:linear-gradient(100deg,rgba(194,137,90,.11),var(--surf) 58%)}
.rk.md1 .rt .v{color:#f2dea2;text-shadow:0 0 14px rgba(216,180,90,.35)}
.rk.md2 .rt .v{color:#e2e9f0}
.rk.md3 .rt .v{color:#eccdae}
.who{flex:1;min-width:0}
.who .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.who .sub{font-size:12px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .sub2{font-size:11px;color:#54686f;margin-top:2px}
.rt{flex:none;text-align:right;min-width:48px}
.up{color:var(--ok)}.down{color:var(--red)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;border:none;background:rgba(255,255,255,.07);color:var(--mut);margin-left:5px;vertical-align:1px;white-space:nowrap}
.badge.b{border-color:var(--blue-d);color:var(--blue)}
.badge.g{border-color:#2c6b55;color:var(--ok)}
.badge.w{border-color:#6d5522;color:var(--warn)}
.badge.r{border-color:var(--red-d);color:var(--red)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form span{display:inline-block;width:18px;height:18px;border-radius:8px;font-size:11px;line-height:18px;text-align:center;font-family:var(--body);font-weight:600;letter-spacing:0}
.form .w{background:rgba(63,191,143,.22);color:#5fd6a8;box-shadow:inset 0 0 0 1px rgba(63,191,143,.35)}
.form .l{background:rgba(224,75,63,.2);color:#f0837a;box-shadow:inset 0 0 0 1px rgba(224,75,63,.32)}
.form .d{background:rgba(147,166,176,.14);color:var(--mut)}

/* match list */
.mt{border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:6px;overflow:hidden}
.mt.mine{border-left:4px solid var(--blue)}
.mt.mine.mw{border-left-color:var(--ok);background:linear-gradient(90deg,rgba(63,191,143,.10),transparent 45%)}
.mt.mine.ml{border-left-color:var(--red);background:linear-gradient(90deg,rgba(224,75,63,.09),transparent 45%)}
.side .pn.me{color:var(--ball);font-weight:700}
.side .pn.dim.me{color:var(--txt);font-weight:600}
.side .pn .mem{font-style:normal;font-size:10px;font-weight:700;background:var(--blue);color:#fff;
  border-radius:8px;padding:4px 4px;margin-left:6px;vertical-align:2px;letter-spacing:.02em}
.mrow{display:block;width:100%;background:none;border:none;text-align:left;padding:8px 12px}
.side{display:flex;align-items:center;gap:8px;min-width:0;line-height:1.7}
.side .rs{font-size:10px;font-weight:700;width:19px;height:19px;line-height:19px;text-align:center;border-radius:8px;flex:none}
.side .rs.w{background:rgba(63,191,143,.18);color:var(--ok)}
.side .rs.l{background:rgba(224,75,63,.15);color:#c9756c}
.side .pn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.side .pn.dim{font-weight:400;color:var(--mut)}
.side .pn em{font-style:normal;font-weight:400;font-size:12px;color:var(--dim);margin-left:4px}

.dayhd{display:flex;align-items:baseline;justify-content:space-between;margin:16px 4px 8px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.sumcard{padding:12px;font-variant-numeric:tabular-nums}
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sc-grid b{display:block;font-family:var(--body);font-weight:600;font-size:20px;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sc-grid span{display:block;font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.02em}
.sc-dual{font-variant-numeric:tabular-nums}
.pw .mv.up{color:var(--ok)}.rv .mid{text-align:center}
.rv .mid em{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:4px}
.rv{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;

  background:var(--surf);font-size:12px}
.rv .p{display:flex;align-items:baseline;gap:4px;min-width:0}
.rv .p.r{justify-content:flex-end}
.rv .p b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .p span{font-family:var(--body);font-weight:600;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rv .bar{height:6px;border-radius:20px;background:rgba(224,75,63,.3);overflow:hidden}
.rv .bar i{display:block;height:100%;background:var(--blue)}
.fk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fk>div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2);text-align:center}
.fk span{display:block;font-size:10px;color:var(--blue);font-weight:700;letter-spacing:.06em}

.fk i.up{color:var(--ok)}.fk i.down{color:var(--red)}
.pcwrap{width:100%;max-width:340px;margin:0 auto;perspective:1200px}

  transform-style:preserve-3d;cursor:pointer}
.pcflip.flip{transform:rotateY(180deg)}
.pcface{position:absolute;inset:0;border-radius:16px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;

.pcface.back{transform:rotateY(180deg);background:linear-gradient(160deg,#12233a,#0a1420 60%,#0d1a2a);
  border:1px solid rgba(120,170,220,.25);padding:20px 18px;display:flex;flex-direction:column}
.cb-h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.cb-h span{width:100%;font-size:11px;color:#7fb4dd;font-weight:700;letter-spacing:.06em}

function fbPath(k){

  if(k===KEY.meta)    return 'meta';

const SDK_SOURCES = [
  { app:'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js',
    db :'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js',

  { app:'https://esm.sh/firebase@10.12.5/app',
    db :'https://esm.sh/firebase@10.12.5/database',
    au :'https://esm.sh/firebase@10.12.5/auth' }
];
async function loadSDK(){
  let last=null;
  for(const src of SDK_SOURCES){
    try{ return await Promise.all([import(src.app), import(src.db), import(src.au)]); }
    catch(e){ last=e; }
  }
  throw last;
}
async function initFirebase(){
  const c = CFG.firebase;
  if(!c || !c.databaseURL) return null;
  try{
    const [A,D,U] = await loadSDK();
    const app = A.initializeApp(c);
    try{ await U.signInAnonymously(U.getAuth(app)); }catch(e){ /* 익명 로그인 미사용이면 그대로 진행 */ }
    const db = D.getDatabase(app), base = 'clubs/'+CLUB;
    return {
      async get(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? snap.val() : null; },
      async set(pth,v){ await D.set(D.ref(db, base+'/'+pth), clean(v)); return true; },
      async patch(pth,obj){ await D.update(D.ref(db, base+'/'+pth), clean(obj)); return true; },
      async del(pth){ await D.remove(D.ref(db, base+'/'+pth)); return true; },
      async keys(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? Object.keys(snap.val()) : []; },
      watch(cb){ D.onValue(D.ref(db, base+'/sig'), snap=>cb(snap.val())); }
    };
  }catch(e){ console.warn('Firebase 연결 실패:', e); S.fbError=String(e&&e.message||e); return null; }
}

/* 예전 버전은 경기를 월별 묶음(shards)으로 저장했다. 개별 레코드 방식으로 한 번 옮긴다.
   원본은 지우지 않고 그대로 둔다. */
async function migrateShards(){
  if(!FB) return;
  try{
    const flat = await FB.get(FBM);
    if(flat && Object.keys(flat).length) return;          // 이미 옮겨졌다
    const sh = await FB.get('shards');
    if(!sh) return;
    const obj={};
    Object.values(sh).forEach(list=>{
      const arr = Array.isArray(list) ? list : Object.values(list||{});
      arr.forEach(m=>{ if(m && m.id) obj[m.id]=m; });
    });
    const n=Object.keys(obj).length;
    if(n){ await FB.patch(FBM, obj); console.info('기존 경기 '+n+'건을 새 저장 방식으로 옮겼습니다.'); }
  }catch(e){ console.warn('기존 데이터 이전 실패:', e); }
}

function localGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ const v=mem.get('p:'+k); return v?JSON.parse(v):null; } }
function localSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem.set('p:'+k,JSON.stringify(v)); } return true; }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){ mem.delete('p:'+k); } return true; }

async function sGet(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localGet(k);
    try{ const r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
  }
  if(FB){ try{ const v=await FB.get(fbPath(k));
                return (k===KEY.players || k.startsWith(MPRE) || k===KEY.audit) ? asList(v) : v; }
          catch(e){ return null; } }
  if(!hasStore){ const v=mem.get('s:'+k); return v?JSON.parse(v):null; }
  try{ const r=await window.storage.get(k,true); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
}
async function sSet(k, val, shared=true){
  if(!shared){
    if(FB || !hasStore) return localSet(k,val);
    return !!(await window.storage.set(k, JSON.stringify(val), false));
  }
  if(FB){ try{ await FB.set(fbPath(k), val); return true; }
          catch(e){ S.lastError = e && (e.message||String(e)); return false; } }
  const str=JSON.stringify(val);
  if(!hasStore){ mem.set('s:'+k, str); return true; }
  return !!(await window.storage.set(k, str, true));
}
async function sDel(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localDel(k);
    try{ await window.storage.delete(k,false); return true; }catch(e){ return false; }
  }
  if(FB){ try{ await FB.del(fbPath(k)); return true; }catch(e){ return false; } }
  if(!hasStore){ mem.delete('s:'+k); return true; }
  try{ await window.storage.delete(k,true); return true; }catch(e){ return false; }
}
async function sList(prefix, shared=true){
  if(FB && prefix===MPRE) return [MPRE+'all'];
  if(FB) return [];
  if(!hasStore) return [...mem.keys()].filter(x=>x.startsWith('s:'+prefix)).map(x=>x.slice(2));
  try{ const r=await window.storage.list(prefix, shared); return r&&r.keys?r.keys:[]; }catch(e){ return []; }
}

/* 11점제 랠리 모델로 푼 값 — 핸디 h점이 상쇄하는 실력차(Elo).
   큰 h에서는 모델이 무핸디 승률 100%를 예측해 신뢰도가 떨어지므로 선형 환산만 사용한다. */
const E_TABLE = { 3:[0,95,204,333,497,714,1019], 5:[0,119,258,429,655,968,1418] };
function modelHandiElo(bestOf, ptsPerBu){
  const t = E_TABLE[bestOf] || E_TABLE[5];
  const h = Math.min(Math.max(1, Math.round(ptsPerBu||1)), 6);
  return Math.round(t[h]/h);
}

const handiPtsFor = (buA, buB) => {
  const raw = Math.abs((buA||0)-(buB||0)) * st().ptsPerBu;
  const cap = st().maxHandi||0;

const cleanName = x => String(x||'').replace(/\s/g,'');
const baseName  = x => cleanName(x).replace(/[A-Za-z]$/,'');   // 이경호A → 이경호
function dirMap(){
  if(S._dir) return S._dir;
  const raw = (S.meta && S.meta.directory) || DIR_SEED;
  const exact={}, base={};
  raw.split('|').forEach(block=>{
    const i=block.indexOf(':'); if(i<0) return;
    const bu=+block.slice(0,i).trim();
    block.slice(i+1).trim().split(/[\s,]+/).filter(Boolean).forEach(n=>{
      const c=cleanName(n);
      exact[c]=bu;                                     // 이경호A 는 그대로 둔다
      (base[baseName(c)] = base[baseName(c)] || []).push({name:c, bu});
    });
  });
  return (S._dir={exact, base, n:Object.keys(exact).length});
}
function dirLookup(name){
  const d=dirMap(), c=cleanName(name);
  if(d.exact[c]!=null) return {bu:d.exact[c], exact:true, as:c};
  const cand=d.base[baseName(c)]||[];
  if(cand.length===1) return {bu:cand[0].bu, exact:false, as:cand[0].name};
  if(cand.length>1)   return {ambiguous:true, cand};   // 동명이인은 사람이 골라야 한다
  return null;

const UPSET = 0.40;                 // 이 예상 승률 이하에서 이기면 '이변'
const RUBBER = { flat:'평면', pimple:'핌플' };
const GRIP   = { shake:'셰이크', pen:'펜홀더' };
const gripOf = p => (p && p.grip==='pen') ? 'pen' : 'shake';
const isPen  = p => gripOf(p)==='pen';
const gripTag = p => isPen(p) ? `<span class="badge g">${GRIP.pen}</span>` : '';
const gripSelect = (id,cur)=>`<select id="${id}">${Object.entries(GRIP)
  .map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join('')}</select>`;
const rubberOf = p => (p && p.rubber && p.rubber!=='flat') ? 'pimple' : 'flat';
const isPimple = p => rubberOf(p)!=='flat';
const rubberTag = p => isPimple(p) ? `<span class="badge r">${RUBBER[rubberOf(p)]}</span>` : '';
const rubberSelect = (id,cur)=>`<select id="${id}">${Object.entries(RUBBER)
  .map(([k,v])=>`<option value="${k}" ${k===(cur||'flat')?'selected':''}>${v}</option>`).join('')}</select>`;
const byName = (a,b)=> String(a.name||'').localeCompare(String(b.name||''),'ko');
const roster = (activeOnly=true)=> S.players.filter(p=>!activeOnly||p.active!==false).slice().sort(byName);

async function sha(txt){
  if(!(window.crypto&&crypto.subtle)) return 'plain:'+txt;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tt$'+txt));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const st = ()=> (S.meta&&S.meta.settings) || DEFAULTS;
/* 인과 방향: 핸디 1점당 레이팅(추정값) × 부수당 핸디 점수(클럽 관행) = 부수당 레이팅(파생값) */
const handiElo = ()=> st().handiElo;
/* 부수당 레이팅 = 핸디가 지우는 몫 + 핸디로도 안 지워지는 몫(residualBu).
   residualBu 가 0이면 '핸디로 완전히 대등해진다'는 뜻이고,
   그 경우 부수 랭킹과 핸디포함 랭킹은 시작점만 다른 같은 지표가 된다. */
/* 자동 보정이 켜져 있으면 경기 결과에서 뽑은 값을 쓴다 */
const residualNow = ()=> st().autoCalib ? (S._calib==null ? (st().residualBu||0) : S._calib)
                                        : (st().residualBu||0);
const perBu = ()=> st().ptsPerBu * st().handiElo + residualNow();
/* 핸디를 받은 쪽이 실제로 얼마나 이겼는지와 모델의 예상을 맞춰
   '핸디 후 남는 부수당 격차'를 되풀이해 좁혀 나간다. */
function calibrateResidual(){
  /* 세션 상태와 무관하게 항상 같은 값이 나오도록, 늘 설정값에서 출발해 수렴까지 돈다 */
  const start = st().residualBu||0;
  let res = start;
  for(let k=0;k<20;k++){
    S._calib = res;
    S.tracks = { skill:runEngine('skill'), form:runEngine('form') };
    let num=0, den=0;
    for(const x of handiTable()){
      if(x.n<15) continue;                       // 표본이 모자란 구간은 쓰지 않는다
      const A=Math.min(.95,Math.max(.05,x.rate));
      const E=Math.min(.95,Math.max(.05,x.expAvg));
      const bias = 400*(Math.log10(A/(1-A)) - Math.log10(E/(1-E)));
      num += (-bias)/x.d * x.n; den += x.n;      // 예상보다 못 이겼으면 격차를 키운다
    }
    if(!den) return start;                       // 판단할 표본이 없으면 그대로
    const next = Math.max(0, Math.min(400, res + 0.5*(num/den)));
    if(Math.abs(next-res) < 0.3){ res=next; break; }
    res = next;
  }
  return Math.round(res);
}
const baseFor = bu => st().baseRating + (BU_MAX - Math.min(BU_MAX,Math.max(BU_MIN,bu||BU_MAX))) * perBu();
/* 레이팅 → 체감 부수. 점수만으로는 감이 안 오니 부수로 바꿔서 같이 보여준다. */
const buScale = r => Math.min(BU_MAX+0.9, Math.max(BU_MIN-0.9,
  BU_MAX - (r - st().baseRating)/(perBu()||1)));
const buText = r => (Math.round(buScale(r)*10)/10).toFixed(1)+'부';
const buFromRating = r => Math.min(BU_MAX,Math.max(BU_MIN, BU_MAX - Math.round((r-st().baseRating)/(perBu()||1))));
const kFor = n => n<st().newGames ? st().kNew : (n<st().midGames ? st().kMid : st().kBase);
const daysBetween = (a,b)=> Math.max(0,(Date.parse(b)-Date.parse(a))/864e5);
/* 최근성 가중 경험치: 지난 경기들이 반감기에 따라 서서히 사라진다.
   활발히 치면 경험치가 쌓여 K가 낮고(안정), 오래 쉬면 줄어들어 K가 올라간다(빠른 재조정). */
const decayExp = (n, days)=> n * Math.pow(0.5, days/(st().kHalfLife||30));
/* 상호 확인을 끄면 확인 절차 자체가 없다 — 입력한 순간 확정으로 본다 */
const isConfirmed = m => !st().confirmedOnly
  || (m.confirmedBy||[]).length>=2 || (m.enteredAt||'') < (st().legacyBefore||'');
const liveMatches = ()=> S.matches.filter(m=>!m.void && (!st().confirmedOnly || isConfirmed(m)));
/* 승자 — 신규 기록은 winnerId, 예전 기록은 세트 스코어에서 읽는다 */
const winnerOf = m => m.winnerId || (m.aSets>m.bSets ? m.aId : m.bId);
const loserOf  = m => winnerOf(m)===m.aId ? m.bId : m.aId;
const MODES = { skill:{label:'부수', note:'통산은 부수를 시작점으로 두고 쌓아 올린 값이고, 시즌은 그 달 상대 강도를 가중한 성적입니다.'},
                form: {label:'핸디포함', note:'핸디를 받으면 서로 대등해진다고 보고 매긴 값입니다. 전원 같은 점수에서 시작해 붙은 그대로의 승패만 반영해요.'} };

/* 한 트랙 계산 — mode: 'skill'=부수(부수 시작 + 핸디 보정) | 'form'=핸디포함(동일 시작 + 무보정) */
function runEngine(mode){
  const s=st(), hElo=handiElo(), skill=(mode==='skill');
  const dk = skill?['_sA','_sB']:['_fA','_fB'];
  const R={},H={},G={},LD={},PK={},RG={},PAIR={};
  S.players.forEach(p=>{
    R[p.id] = skill ? baseFor(p.bu) : s.formBase;
    H[p.id] = [{d:p.joinedAt?p.joinedAt.slice(0,10):'', r:R[p.id]}];
    G[p.id] = 0; LD[p.id] = null; PK[p.id] = R[p.id]; RG[p.id] = 0;
  });
  const expAt = id => {                       // 이 경기 시점의 감쇠 경험치
    const m=S._cur; if(!LD[id]) return 0;
    return decayExp(G[id], daysBetween(LD[id], m.date));
  };
  for(const m of S._sorted){
    if(!(m.aId in R)||!(m.bId in R)){ m[dk[0]]=m[dk[1]]=0; continue; }
    S._cur=m;
    const na=expAt(m.aId), nb=expAt(m.bId);
    /* 같은 사람을 100번 이기는 건 100개의 근거가 아니라 같은 근거의 반복이다.
       만날수록 한 경기가 주는 정보량을 줄인다. 오래 안 만났으면 다시 회복된다. */
    const pk = m.aId<m.bId ? m.aId+'|'+m.bId : m.bId+'|'+m.aId;
    let met = 0;
    if(PAIR[pk]) met = PAIR[pk].n * Math.pow(0.5, daysBetween(PAIR[pk].d, m.date)/(s.kHalfLife||30));
    const rep = s.repeatN0>0 ? 1/(1+met/s.repeatN0) : 1;
    PAIR[pk] = {n:met+1, d:m.date};
    const ra=R[m.aId], rb=R[m.bId];
    let ea=ra, eb=rb;
    if(skill && s.handiOn && m.handi && m.handi.pts>0){
      if(m.handi.toId===m.aId) ea += m.handi.pts*hElo;
      if(m.handi.toId===m.bId) eb += m.handi.pts*hElo;
    }
    const expA = 1/(1+Math.pow(10,(eb-ea)/400));
    const sa = winnerOf(m)===m.aId ? 1 : 0;
    const dA = kFor(na)*rep*(sa-expA);
    const dB = kFor(nb)*rep*((1-sa)-(1-expA));
    R[m.aId]=ra+dA; R[m.bId]=rb+dB;
    if(skill && S._fullList){
      m._expA=expA;
      m._faceA = eb-(ea-ra);        // 내 원래 레이팅 기준으로 환산한 상대 강도
      m._faceB = ea-(eb-rb);
      if(S._fullPass){
        if(RG[m.aId]>=9 && R[m.aId]>PK[m.aId]){ m._peakA=Math.round(R[m.aId]); }
        if(RG[m.bId]>=9 && R[m.bId]>PK[m.bId]){ m._peakB=Math.round(R[m.bId]); }
      }
      PK[m.aId]=Math.max(PK[m.aId],R[m.aId]); PK[m.bId]=Math.max(PK[m.bId],R[m.bId]);
    }
    m[dk[0]]=dA; m[dk[1]]=dB;
    G[m.aId]=na+1; G[m.bId]=nb+1; RG[m.aId]++; RG[m.bId]++;
    LD[m.aId]=m.date; LD[m.bId]=m.date;
    H[m.aId].push({d:m.date,r:R[m.aId],id:m.id}); H[m.bId].push({d:m.date,r:R[m.bId],id:m.id});
  }
  return {R,H};
}
function recompute(){
  S._sorted = liveMatches().slice().sort((a,b)=>(a.date+'|'+a.enteredAt).localeCompare(b.date+'|'+b.enteredAt));
  S._fullList = true;                       // 지금 S._sorted 는 전체 경기 목록이다
  S._fullPass = true;                       // 전체 이력 계산일 때만 개인 최고를 기록한다
  S.matches.forEach(m=>{ delete m._peakA; delete m._peakB; });
  if(st().autoCalib){ S._fullPass=false; S._calib = calibrateResidual(); S._fullPass=true; }
  const G={},W={},L={},HH={};
  S.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;HH[p.id]={};});
  for(const m of S._sorted){
    if(!(m.aId in G)||!(m.bId in G)) continue;
    const aw = winnerOf(m)===m.aId;
    G[m.aId]++; G[m.bId]++;
    if(aw){ W[m.aId]++; L[m.bId]++; } else { W[m.bId]++; L[m.aId]++; }
    HH[m.aId][m.bId]=HH[m.aId][m.bId]||{w:0,l:0}; HH[m.bId][m.aId]=HH[m.bId][m.aId]||{w:0,l:0};
    if(aw){HH[m.aId][m.bId].w++;HH[m.bId][m.aId].l++;}else{HH[m.aId][m.bId].l++;HH[m.bId][m.aId].w++;}
  }
  const LAST={};
  S.players.forEach(p=>LAST[p.id]=null);
  for(const m of S._sorted){
    if(m.aId in LAST) LAST[m.aId] = !LAST[m.aId]||m.date>LAST[m.aId] ? m.date : LAST[m.aId];
    if(m.bId in LAST) LAST[m.bId] = !LAST[m.bId]||m.date>LAST[m.bId] ? m.date : LAST[m.bId];
  }
  S.G=G;S.W=W;S.L=L;S.HH=HH;S.LAST=LAST;
  S.tracks = { skill:runEngine('skill'), form:runEngine('form') };
  /* 상대 풀 천장 — 안 붙어본 수준까지 레이팅을 늘려 잡지 않는다.
     8부만 상대해서 전승했다고 3부로 올려버리면 근거가 없다. */
  S.cap = { skill:{}, form:{} };
  const marg = (st().poolCeilingBu||0) * perBu();
  if(marg>0){
    /* 기준은 '이겨본' 상대다. 붙어보기만 한 건 근거가 되지 않는다.
       상대 수준은 지금 레이팅과 등록 부수 기준값 중 높은 쪽으로 본다 —
       내가 계속 이겨서 상대가 내려가면 천장까지 같이 내려가는 걸 막는다. */
    const level = (oid,mode)=> Math.max(S.tracks[mode].R[oid] ?? -Infinity,
                                        mode==='skill' ? baseFor((P(oid)||{}).bu) : st().formBase);
    const bestOpp = {};
    for(const m of S._sorted){
      const w=winnerOf(m), l=(w===m.aId?m.bId:m.aId);
      if(!(w in G) || !(l in G)) continue;
      const b = bestOpp[w] = bestOpp[w] || {skill:-Infinity, form:-Infinity};
      b.skill = Math.max(b.skill, level(l,'skill'));   // 이긴 상대만 센다
      b.form  = Math.max(b.form,  level(l,'form'));
    }
    for(const mode of ['skill','form']){
      const floor = p => mode==='skill' ? baseFor(p.bu) : st().formBase;   // 등록 부수 아래로는 안 내린다
      for(const p of S.players){
        const b=bestOpp[p.id] && bestOpp[p.id][mode];
        if(b!=null && b>-Infinity) S.cap[mode][p.id] = Math.max(floor(p), b + marg);
      }
    }
  }
  S.peak = {};
  for(const mode of ['skill','form']){
    S.peak[mode]={};
    for(const p of S.players){ const h=S.tracks[mode].H[p.id]||[];
      S.peak[mode][p.id] = h.reduce((best,x)=> x.r>best.r?x:best, h[0]||{r:0,d:''}); }
  }
  /* '개인 최고' 배지는 최종 최고 기록을 세운 그 한 경기에만 남긴다.
     하루에 여러 번 갱신하면 그때마다 붙어서 어느 게 진짜인지 알 수 없었다. */
  S._fullPass = false;
  const bestId={};
  for(const p of S.players){
    const pk=S.peak.skill[p.id];
    if(pk && pk.id) bestId[p.id]=pk.id;
  }
  for(const m of (S._sorted||[])){
    if(m._peakA!=null && bestId[m.aId]!==m.id) delete m._peakA;
    if(m._peakB!=null && bestId[m.bId]!==m.id) delete m._peakB;
  }
}
const trk = mode => S.tracks[mode||S.mode] || {R:{},H:{}};
/* 월간 시즌 — 그 달 경기만으로 부수 기준값에서 새로 계산한다 */
const monthOfNow = ()=> today().slice(0,7);
const prevMonth  = ym => shiftMonth(ym,-1);
/* 시즌 순위.
   부수 기준은 '그 달 상대 강도를 가중한 성적'(퍼포먼스 레이팅)으로 매긴다.
   부수 출발점에서 Elo 를 다시 굴리면 한 달 열 경기로는 출발점을 못 흔들어
   매달 부수 순서가 그대로 재현된다.
   핸디포함 기준은 종전대로 전원 같은 점수에서 시작해 승패만 반영한다. */
function monthStand(ym, mode, until){
  S._mcache = S._mcache || {};
  const key = ym+'|'+mode+'|'+(until||'')+'|'+(S._sig||'');
  if(S._mcache[key]) return S._mcache[key];
  const keep=S._sorted, fp=S._fullPass, fl=S._fullList; S._fullPass=false; S._fullList=false;
  const list = keep.filter(m=>m.date.slice(0,7)===ym && (!until || m.date<=until));
  const G={},W={},L={};
  S.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;});
  for(const m of list){
    if(!(m.aId in G)||!(m.bId in G)) continue;
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    G[w]++;G[l]++;W[w]++;L[l]++;
  }
  let R;
  if(mode==='skill'){
    R={};
    const byId={}; S.players.forEach(p=>byId[p.id]=[]);
    for(const m of list){ if(byId[m.aId]) byId[m.aId].push(m); if(byId[m.bId]) byId[m.bId].push(m); }
    S.players.forEach(p=>{
      const pr = byId[p.id].length ? perfRating(byId[p.id], p.id) : null;
      R[p.id] = pr ? pr.rp : baseFor(p.bu);
    });
  } else {
    S._sorted=list; R=runEngine(mode).R;
  }
  S._sorted=keep; S._fullPass=fp; S._fullList=fl;
  const res={R,G,W,L};
  S._mcache[key]=res;
  return res;
}
const seasons = ()=> [...new Set(S.matches.filter(m=>!m.void).map(m=>m.date.slice(0,7)))].sort();
/* 최근 N일만으로 새로 계산한 순위 — 파워랭킹의 재료 */
function recentStand(days, mode){
  S._rcache = S._rcache || {};
  const from = dayAgo(days);
  const key = days+'|'+mode+'|'+(S._sig||'');
  if(S._rcache[key]) return S._rcache[key];
  const keep=S._sorted, fp=S._fullPass, fl=S._fullList; S._fullPass=false; S._fullList=false;
  S._sorted = keep.filter(m=>m.date>=from);
  const R=runEngine(mode).R;
  const G={},W={},L={};
  S.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;});
  for(const m of S._sorted){
    if(!(m.aId in G)||!(m.bId in G)) continue;
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    G[w]++;G[l]++;W[w]++;L[l]++;
  }
  S._sorted=keep; S._fullPass=fp; S._fullList=fl;
  const res=S.players.filter(p=>p.active!==false).map(p=>({p, r:R[p.id]??baseFor(p.bu),
    g:G[p.id]||0, w:W[p.id]||0, l:L[p.id]||0})).sort((a,b)=>b.r-a.r);
  S._rcache[key]=res;
  return res;
}
function standings(period, mode, until){
  if(period==='all'){
    return S.players.filter(p=>p.active!==false)
      .map(p=>({p, r:rateOf(p.id,mode), g:S.G[p.id]||0, w:S.W[p.id]||0, l:S.L[p.id]||0}))
      .sort((a,b)=> b.r-a.r || b.g-a.g || a.p.name.localeCompare(b.p.name,'ko'));
  }
  const ym = period;
  const t = monthStand(ym, mode, until);
  const C = st().shrinkC||0;
  return S.players.filter(p=>p.active!==false).map(p=>{
    const g=t.G[p.id]||0, raw=t.R[p.id];
    const b = mode==='form' ? st().formBase : baseFor(p.bu);
    const r = C>0 ? b+(raw-b)*g/(g+C) : raw;
    return {p, r, g, w:t.W[p.id]||0, l:t.L[p.id]||0};
  }).sort((a,b)=> b.r-a.r || b.g-a.g || a.p.name.localeCompare(b.p.name,'ko'));
}
const rawRate = (id,mode)=>{ const v=trk(mode).R[id];
  return v!=null ? v : ((mode||S.mode)==='form' ? st().formBase : baseFor((P(id)||{}).bu)); };
const capOf = (id,mode)=> (S.cap && S.cap[mode||S.mode] && S.cap[mode||S.mode][id]);
/* 경기가 적으면 아직 근거가 얇다. 부수 기준값 쪽으로 당겨서 초반 출렁임을 줄인다.
   경기가 쌓일수록 성적 그대로에 가까워진다. */
function shrunk(id,mode){
  const r=rawRate(id,mode), C=st().shrinkC||0;
  if(!C) return r;
  const b = (mode||S.mode)==='form' ? st().formBase : baseFor((P(id)||{}).bu);
  const g = S.G[id]||0;
  return b + (r-b)*g/(g+C);
}
const rateOf = (id,mode)=>{ const r=shrunk(id,mode), c=capOf(id,mode);
  return (c!=null && r>c) ? c : r; };
function ranked(mode){
  return S.players.filter(p=>p.active!==false)
    .map(p=>({p, r:rateOf(p.id,mode), g:S.G[p.id]||0, w:S.W[p.id]||0, l:S.L[p.id]||0}))
    .sort((a,b)=> b.r-a.r || b.g-a.g || a.p.name.localeCompare(b.p.name));
}
/* 요즘 변동: 최근 formDays일 동안 레이팅이 얼마나 움직였나 */
function deltaOf(id,mode,days){
  const h=trk(mode).H[id]||[]; if(h.length<2) return 0;
  const cutoff=dayAgo(days||st().formDays||30);
  let base=h[0];
  for(const x of h){ if(x.d && x.d<=cutoff) base=x; else break; }
  return h[h.length-1].r - base.r;
}
/* 몰아서 입력하면 같은 날 경기의 순서는 실제 순서가 아니다.
   그래서 '연승' 같은 순서 통계는 쓰지 않고, 날짜 단위와 최근 N경기 집계만 쓴다. */
function dayRecords(id){
  const byDay={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const k=m.date; byDay[k]=byDay[k]||{d:k,w:0,l:0};
    if(winnerOf(m)===id) byDay[k].w++; else byDay[k].l++;
  }
  return Object.values(byDay).sort((a,b)=>a.d.localeCompare(b.d));
}
/* 최근 경기 결과 — 같은 날 안의 순서는 입력 순서라 참고용이다.
   연승 같은 순서 통계는 쓰지 않고, 최근 흐름을 보는 용도로만 표시한다. */
function recentForm(id,n=6){
  return (S._sorted||[]).filter(m=>m.aId===id||m.bId===id).slice(-n).reverse()
    .map(m=>({w:winnerOf(m)===id, opp:nameOf(m.aId===id?m.bId:m.aId), d:m.date}));
}
/* 최근 N경기도 날짜 경계에서 끊는다 — 하루 중간을 자르면 입력 순서에 따라 값이 달라진다 */
function recentRecord(id, want=20){
  const days=dayRecords(id); let w=0,l=0;
  for(let i=days.length-1;i>=0;i--){ w+=days[i].w; l+=days[i].l; if(w+l>=want) break; }
  return {w, l, g:w+l};
}
/* 특정 시점의 순위 — 리그 표처럼 순위 등락을 보여주기 위해 */
function ranksAt(dateStr, mode){
  const t=trk(mode);
  const arr=S.players.filter(p=>p.active!==false).map(p=>{
    const h=t.H[p.id]||[]; let r=h.length?h[0].r:0;
    for(const x of h){ if(!x.d || x.d<=dateStr) r=x.r; else break; }
    return {id:p.id, r};
  }).sort((a,b)=>b.r-a.r);
  const map={}; arr.forEach((x,i)=>map[x.id]=i+1);
  return map;
}
/* 내가 확인해줘야 하는 경기 */
function pendingForMe(){
  if(!S.me || !st().confirmedOnly) return [];
  return S.matches.filter(m=>!m.void && !isConfirmed(m)
    && (m.aId===S.me.id || m.bId===S.me.id)
    && !(m.confirmedBy||[]).includes(S.me.id));
}
const idleDays = id => S.LAST&&S.LAST[id] ? Math.round(daysBetween(S.LAST[id], today())) : null;
/* 퍼포먼스 레이팅 — 그 성적을 냈을 때 레이팅 변동이 0이 되는 값.
   상대 강도와 실제 승수만 쓰기 때문에 표본이 적어도 뜻이 있다. */
function perfRating(ms, id){
  const g=ms.map(m=>({f: m.aId===id?m._faceA:m._faceB, s: winnerOf(m)===id?1:0}))
            .filter(x=>x.f!=null);
  if(!g.length) return null;
  const score=g.reduce((a,x)=>a+x.s,0);
  const avg=g.reduce((a,x)=>a+x.f,0)/g.length;
  if(score===0)         return {rp:avg-400, n:g.length, score, avg, edge:'low'};
  if(score===g.length)  return {rp:avg+400, n:g.length, score, avg, edge:'high'};
  let lo=0, hi=4000;
  for(let i=0;i<64;i++){
    const mid=(lo+hi)/2;
    const exp=g.reduce((a,x)=>a+1/(1+Math.pow(10,(x.f-mid)/400)),0);
    if(exp<score) lo=mid; else hi=mid;
  }
  return {rp:(lo+hi)/2, n:g.length, score, avg, edge:null};
}
/* 상대 분석 — 표본이 적어도 뜻이 있게, 기대 승수 대비 실제 승수로 본다.
   기대 승수는 그 경기 직전 레이팅과 핸디를 반영한 값이라 상대 수준이 자동으로 보정된다. */
function h2hStats(id){
  const me=P(id); if(!me) return null;
  const mine=(S._sorted||[]).filter(m=>(m.aId===id||m.bId===id) && m._faceA!=null);
  if(!mine.length) return null;
  const opp={};
  let best=null;
  for(const m of mine){
    const oid = m.aId===id ? m.bId : m.aId;
    const face = m.aId===id ? m._faceA : m._faceB;
    const won  = winnerOf(m)===id;
    const o=(opp[oid] = opp[oid] || {oid, w:0, l:0, face:0, n:0, hist:[], handi:null});
    o[won?'w':'l']++; o.face+=face; o.n++;
    o.hist.push({w:won, d:m.date});
    o.handi = (m.handi&&m.handi.pts) ? {mine:m.handi.toId===id, pts:m.handi.pts} : null;
    if(won && (!best || face>best.face)) best={face, oid, date:m.date};
  }
  const list=Object.values(opp).map(o=>({...o, avg:o.face/o.n, rate:rateOf(o.oid,'skill'),
                                         hist:o.hist.slice(-5).reverse()}))
                  .sort((a,b)=>b.rate-a.rate);
  const band={high:{w:0,l:0}, same:{w:0,l:0}, low:{w:0,l:0}};
  for(const m of mine){
    const oid=m.aId===id?m.bId:m.aId, o=P(oid); if(!o) continue;
    const k = o.bu<me.bu ? 'high' : o.bu===me.bu ? 'same' : 'low';
    band[k][winnerOf(m)===id?'w':'l']++;
  }
  const lefty={w:0,l:0}, pimp={w:0,l:0}, pen={w:0,l:0};
  for(const o of Object.values(opp)){ const pp=P(o.oid);
    if(pp&&pp.hand==='L'){ lefty.w+=o.w; lefty.l+=o.l; }
    if(pp&&isPimple(pp)){ pimp.w+=o.w; pimp.l+=o.l; }
    if(pp&&isPen(pp)){ pen.w+=o.w; pen.l+=o.l; } }
  const nemesis=list.slice().sort((a,b)=>(b.l-b.w)-(a.l-a.w))[0];
  const prey   =list.slice().sort((a,b)=>(b.w-b.l)-(a.w-a.l))[0];
  const solid = x => x && x.n>=3;
  return {list, best, lefty, pimp, pen, band, perf:perfRating(mine,id), n:mine.length,
          nemesis: solid(nemesis)&&nemesis.l>nemesis.w ? nemesis : null,
          prey:    solid(prey)&&prey.w>prey.l ? prey : null};
}
function toggleEl(id,btn){

  el.style.display = open?'none':'block';

/* 새로 들어온 사람의 시작 레이팅이 실제 실력과 맞는지 진단.
   첫 N경기에서 기대 승수보다 실제 승수가 크게 적으면 시작값이 후하다는 뜻이고,
   그만큼 기존 회원들이 점수를 가져가게 된다. */
function entryAccuracy(n=10){
  const seen={}; let exp=0, act=0, cnt=0;
  for(const m of (S._sorted||[])){
    for(const side of [0,1]){
      const id = side? m.bId : m.aId;
      if(!(id in S.G)) continue;
      const c = seen[id]||0;
      if(c<n){
        const e = side ? 1-(m._expA||0.5) : (m._expA||0.5);
        exp += e; act += (winnerOf(m)===id?1:0); cnt++;
      }
      seen[id]=c+1;
    }
  }
  return {cnt, exp, act};
}
/* 부수당 레이팅과 핸디 1점의 값을 경기 결과에서 함께 추정한다.
   선수 개인 편차도 같이 잡아야 두 값이 섞이지 않는다. */
function estimateParams(){
  const ms=[], idx={}, ids=[];
  S.players.forEach(p=>{ idx[p.id]=ids.length; ids.push(p.id); });
  for(const m of (S._sorted||[])){
    if(!(m.aId in idx)||!(m.bId in idx)) continue;
    const A=P(m.aId), B=P(m.bId);
    let h=0;
    if(m.handi&&m.handi.pts) h = (m.handi.toId===m.aId ? m.handi.pts : -m.handi.pts);
    ms.push({a:idx[m.aId], b:idx[m.bId], dbu:(B.bu-A.bu), h, y:winnerOf(m)===m.aId?1:0});
  }
  if(ms.length<40) return {n:ms.length};
  const S0=400/Math.log(10), sig=d=>1/(1+Math.exp(-d/S0));
  let pb=perBu(), he=st().handiElo;
  const off=new Float64Array(ids.length), offSd=110;
  for(let it=0; it<2500; it++){
    let gpb=0, ghe=0; const go=new Float64Array(ids.length);
    for(const m of ms){
      const d = pb*m.dbu + he*m.h + off[m.a]-off[m.b];
      const e = (m.y - sig(d))/S0;
      gpb += e*m.dbu; ghe += e*m.h; go[m.a]+=e; go[m.b]-=e;
    }
    const L=S0*S0/ms.length;
    pb += L*gpb*0.12; he += L*ghe*0.12;
    for(let i=0;i<off.length;i++) off[i] += L*(go[i]-off[i]/(offSd*offSd))*3;
    pb=Math.max(20,Math.min(600,pb)); he=Math.max(5,Math.min(600,he));
  }
  let ll=0;
  for(const m of ms){ const p=sig(pb*m.dbu+he*m.h+off[m.a]-off[m.b]);
    ll += m.y?Math.log(p):Math.log(1-p); }
  return {n:ms.length, perBu:pb, handiElo:he, ll};
}
/* 클럽 핸디가 실제로 공정한지 진단 */
function handiStat(){
  const ms=liveMatches().filter(m=>m.handi&&m.handi.pts>0);
  if(!ms.length) return {n:0};
  const w=ms.filter(m=> winnerOf(m)===m.handi.toId).length;
  return {n:ms.length, rate:Math.round(w/ms.length*100)};
}

/* ─────────────────────────── 로드 / 커밋 ─────────────────────────── */
/* 마지막으로 본 데이터를 기기에 남겨둔다. 다음 접속 때 네트워크를 기다리지 않고 바로 그린다. */
const CACHE_KEY='tt:cache:'+CLUB;
function saveCache(){
  try{
    const json=JSON.stringify({meta:S.meta, players:S.players, matches:S.matches, at:Date.now()});
    if(json.length>1500000) return;                 // 너무 크면 캐시하지 않는다
    localStorage.setItem(CACHE_KEY, json);
  }catch(e){}
}
function loadCache(){
  try{ const v=localStorage.getItem(CACHE_KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
}
async function loadAll(){
  const keys = await sList(MPRE);
  S._shards = keys.length;
  /* 셋을 동시에 가져온다 — 순서대로 기다리면 왕복이 그만큼 쌓인다 */
  const [meta0, players0, ...shards] = await Promise.all([
    sGet(KEY.meta), sGet(KEY.players), ...keys.map(k=>sGet(k))
  ]);
  let meta = meta0;
  if(!meta){ meta = {settings:{...DEFAULTS}, createdAt:new Date().toISOString(), v:1}; sSet(KEY.meta,meta); }
  meta.settings = {...DEFAULTS, ...(meta.settings||{})};
  S.meta = meta;
  S.players = players0 || [];
  const merged=new Map();                       // 같은 id가 여러 조각에 있으면 최신 rev만 남긴다
  for(const m of shards.flat().filter(Boolean)){
    const prev=merged.get(m.id);
    if(!prev || (m.rev||0) >= (prev.rev||0)) merged.set(m.id, m);
  }
  S.matches = [...merged.values()];
  recompute();
  saveCache();
}
/* 경기 저장: 해당 월 샤드만 재읽기 → id 기준 병합 → 기록 후 검증 재시도 */
/* 화면에 먼저 반영한다 — 저장은 뒤에서 끝나도 된다 */
function applyMatches(list){
  const local=new Map(S.matches.map(m=>[m.id,m]));
  list.forEach(m=>local.set(m.id,m));
  S.matches=[...local.values()]; recompute();
}
/* 저장만 담당. 실패하면 원래 상태로 되돌린다 */
async function pushMatches(list, label){
  const before=S.matches.slice();
  applyMatches(list);
  render();
  busyOn(label||'저장 중…');
  let ok=true;
  try{
    if(FB){
      const obj={}; list.forEach(m=>obj[m.id]=m);
      await (list.length>1 ? FB.patch(FBM, obj) : FB.set(FBM+'/'+list[0].id, list[0]));
      bumpSig();
    } else {
      const byShard={};
      list.forEach(m=>{ const k=KEY.shard(monthOf(m.date)); (byShard[k]=byShard[k]||[]).push(m); });
      for(const [k,ms] of Object.entries(byShard)){
        const cur=(await sGet(k))||[];
        const map=new Map(cur.map(m=>[m.id,m]));
        ms.forEach(m=>map.set(m.id,m));
        if(!await sSet(k,[...map.values()])){ ok=false; break; }
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
async function commitMatch(match){
  if(FB){
    try{ await FB.set(FBM+'/'+match.id, match); bumpSig(); }
    catch(e){ S.lastError = e && (e.message||String(e)); return false; }
    applyMatches([match]); return true;
  }
  const key = KEY.shard(monthOf(match.date));
  for(let attempt=0; attempt<3; attempt++){
    const cur = (await sGet(key)) || [];
    const map = new Map(cur.map(m=>[m.id,m]));
    map.set(match.id, match);
    const next = [...map.values()];
    await sSet(key, next);
    const check = (await sGet(key)) || [];
    if(check.some(m=>m.id===match.id && m.rev===match.rev)){
      const local = new Map(S.matches.map(m=>[m.id,m]));
      check.forEach(m=>local.set(m.id,m));
      S.matches=[...local.values()]; recompute(); return true;
    }
    await new Promise(r=>setTimeout(r, 120+Math.random()*250));
  }
  return false;
}
/* 여러 경기를 한 번에 저장 — 빠른 입력에서 왕복을 1회로 줄인다 */

/* ─────────────────────────── 중복 판정 ─────────────────────────── */
/* 같은 날 · 같은 상대 · 같은 승패 = 중복 후보.
   상대가 먼저 넣은 미확인 건이 있으면 → 새 레코드 없이 '상호 확인'으로 승격.
   내가 넣은 건만 있으면 → 진짜 다른 경기인지 물어봄(하루에 같은 결과 반복 가능). */
function dupScan(date, meId, oppId, iWon){
  const same = S.matches.filter(m=>!m.void && m.date===date &&
    ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
  const sameResult = m => (winnerOf(m)===meId) === iWon;
  const cands = same.filter(sameResult);
  const cb = m => m.confirmedBy || [];
  const byOpp = cands.find(m=> m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m));
  const mine  = cands.filter(m=> m.enteredBy===meId || cb(m).includes(meId));
  const conflict = same.filter(m=>!sameResult(m) && m.enteredBy===oppId && !isConfirmed(m));
  return {byOpp, mineCount:mine.length, conflict:conflict[0]||null};
}

  for(const p of S.players){ const k=p.id+p.bu+(p.active===false?'0':'1')+(p.name||''); for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; }
  return S.matches.length+':'+S.players.length+':'+h+':'+JSON.stringify(st());
}

  if(pend.length) html += `<button class="pendbar" id="goPend">
      <span class="pd">${pend.length}</span>
      <span class="pt"><b>확인 대기 ${pend.length}건</b><small>상대가 올린 경기입니다. 확인해야 랭킹에 반영됩니다.</small></span>
      <span class="pg">›</span></button>`;
  box.innerHTML=html;
  if($('#goPend')) $('#goPend').onclick=confirmQueue;
}
let _lastTab=null;
function render(){
  const keepY = (_lastTab===S.tab && S.ready) ? window.scrollY : null;   // 같은 탭이면 보던 위치 유지
  const guest = !S.me;
  const pend  = S.ready ? pendingForMe() : [];        // 탭 배지에서도 쓰므로 먼저 구한다
  const conn = S.stale ? ' sync' : online() ? '' : ' off';
  $('#chip').title = S.stale ? '저장된 화면 · 최신 정보를 받는 중'
                   : online() ? '공유 저장소에 연결됨' : '이 기기에만 저장 중';
  $('#chip').innerHTML = guest
    ? `<span class="dot${conn}"></span><span>로그인</span>`
    : `<span class="dot${conn}"></span><span>${esc(S.me.name)} · ${S.me.bu}부${isAdmin()?' · 관리자':''}</span>`;
  $('#chip').onclick = ()=>{ S.tab = guest ? 'login' : 'me'; render(); };
  $('#chip').style.cursor='pointer';

  const tabs=tabList();
  if(!tabs.some(t=>t[0]===S.tab)) S.tab='rank';
  $('#tabs').innerHTML = tabs.map(([k,ic,lab])=>
    `<button class="tab ${k===S.tab?'on':''}" data-tab="${k}"><span class="ic">${ic}${
      (k==='log'&&pend.length)?`<i class="tbadge">${pend.length}</i>`:''}</span>${lab}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });

  renderAlert();
  if(!S.ready){ $('#view').innerHTML = `<div class="empty" style="margin-top:40px">불러오는 중…</div>`; return; }
  ({rank:viewRank, add:viewAddRouter, log:viewLog, me:viewMe, admin:viewAdmin, login:viewAuth}[S.tab]||viewRank)();
  _lastTab = S.tab;
  S._sig = dataSig();
  if(keepY!=null && keepY>0) window.scrollTo(0, keepY);
}

function storeNotice(){
  if(online()) return '';
  if(hasStore) return `<div class="notice warn">지금은 미리보기 저장소로 돌아가고 있습니다. 깃허브에 올려 여러 사람이 같이 쓰려면 파일 맨 위 TT_CONFIG에 Firebase 값을 채워주세요.</div>`;
  return `<div class="notice warn">저장소에 연결되지 않아 이 브라우저에서만 데이터가 남습니다. 파일 맨 위 TT_CONFIG에 Firebase 값을 채우면 어디서 접속하든 같은 기록을 보게 됩니다.</div>`;
}

/* ── 로그인 / 가입 ── */
function viewAuth(){
  const first = S.players.length===0;
  $('#view').innerHTML = `
    <h2 style="margin-top:20px">클럽 랭킹에 참여하기</h2>

    <div class="notice">클럽 데이터(선수·경기·랭킹)는 이 페이지를 여는 모든 사람이 함께 보고 함께 씁니다. PIN은 내 계정으로 남이 경기를 넣지 못하게 막는 용도이며, 민감한 정보는 적지 마세요.</div>
    <div class="card">
      <div class="seg" style="margin-bottom:14px">
        <button class="on" id="tabLogin">로그인</button><button id="tabJoin">선수 등록</button>
      </div>
      <div id="authBody"></div>
    </div>`;

    $('#authBody').innerHTML = S.players.length===0
      ? `<div class="empty">아직 등록된 선수가 없습니다. 먼저 선수 등록을 해주세요.<br>첫 번째로 등록하는 사람이 관리자가 됩니다.</div>`
      : `<div class="field"><label>이름</label><select id="lname">${roster(false).map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.bu}부${p.pinHash?'':' · PIN 설정 필요'}</option>`).join('')}</select></div>
         <div class="field"><label id="lpinLab">PIN 4자리</label><input id="lpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
         <p class="tiny dim" id="lpinHint" style="margin:-6px 2px 12px"></p>
         <button class="btn" id="doLogin">로그인</button>`;
    const b=$('#doLogin'); if(b) b.onclick=doLogin;
    const pin=$('#lpin'); if(pin) pin.onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
    const sel=$('#lname');
    const syncPin=()=>{ const p=P(sel.value); const fresh=p&&!p.pinHash;
      $('#lpinLab').textContent = fresh ? '쓸 PIN 4자리 정하기' : 'PIN 4자리';
      $('#lpinHint').textContent = fresh ? '관리자가 미리 만들어 둔 계정입니다. 여기서 정한 PIN이 앞으로 본인 PIN이 됩니다.'
                                 : (usingDefaultPin(p) ? `초기 PIN ${DEFAULT_PIN}으로 로그인한 뒤 내 정보에서 바꿔주세요.` : '');
      $('#doLogin').textContent = fresh ? 'PIN 설정하고 시작' : '로그인'; };
    if(sel){ sel.onchange=syncPin; syncPin(); }
  };
  const join = ()=>{
    $('#authBody').innerHTML = `
      ${first?`<div class="notice">첫 등록자는 자동으로 관리자가 됩니다.</div>`:''}
      <div class="row"><div class="field" style="flex:2"><label>이름</label><input id="jname" maxlength="12" placeholder="클럽에서 부르는 이름"></div>
      <div class="field"><label>부수</label><select id="jbu">${Array.from({length:BU_MAX-BU_MIN+1},(_,i)=>BU_MIN+i).map(b=>`<option value="${b}" ${b===7?'selected':''}>${b}부</option>`).join('')}</select></div></div>
      <div class="row"><div class="field"><label>주 손</label><select id="jhand"><option value="R">오른손</option><option value="L">왼손</option></select></div>
      <div class="field"><label>러버</label>${rubberSelect('jrub','flat')}</div>
      <div class="field"><label>그립</label>${gripSelect('jgrip','shake')}</div>
      <div class="field"><label>PIN 4자리</label><input id="jpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div></div>
      <div class="field"><label>한 줄 소개 (선택)</label><input id="jbio" maxlength="40" placeholder="예: 드라이브 위주 / 이면타법 연습 중"></div>

  $('#tabLogin').onclick = e=>{ $('#tabLogin').classList.add('on'); $('#tabJoin').classList.remove('on'); login(); };

async function doLogin(){
  const id=$('#lname').value, pin=($('#lpin').value||'').trim();
  const p=P(id); if(!p) return;
  if(!p.pinHash){                                  // 관리자가 만들어 둔 계정 넘겨받기
    if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
    const hash=await sha(pin);
    const ok=await savePlayers(map=>{const x=map.get(id); if(x)x.pinHash=hash;});
    if(!ok) return toast('설정에 실패했습니다. 다시 시도해주세요.',1);
    audit('PIN 설정', p.name);
  } else if(p.pinHash!==await sha(pin)) return toast('PIN이 맞지 않습니다.',1);
  S.me=P(id); await sSet(KEY.session,{playerId:id, at:Date.now()},false); S.tab='rank'; render();
  const n=pendingForMe().length;
  toast(n ? `${S.me.name}님 반갑습니다. 확인할 경기가 ${n}건 있습니다.` : `${S.me.name}님 반갑습니다.`);
}
async function doJoin(){
  const name=($('#jname').value||'').trim();
  const pin=($('#jpin').value||'').trim();
  if(name.length<1) return toast('이름을 입력하세요.',1);
  if(S.players.some(p=>p.name===name)) return toast('이미 있는 이름입니다.',1);
  if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
  const p={ id:uid('p'), name, bu:+$('#jbu').value, hand:$('#jhand').value, rubber:$('#jrub').value,
    grip:$('#jgrip').value,
            bio:($('#jbio').value||'').trim(), pinHash:await sha(pin),
            role:S.players.length===0?'admin':'member', active:true, joinedAt:new Date().toISOString() };
  const ok=await savePlayers(map=>map.set(p.id,p));
  if(!ok) return toast('등록에 실패했습니다. 다시 시도해주세요.',1);
  S.me=P(p.id); await sSet(KEY.session,{playerId:p.id, at:Date.now()},false);
  audit('선수 등록', name); S.tab='rank'; render(); toast('등록되었습니다.');
}

/* ── 랭킹 ── */
function viewRank(){
  const mode=S.mode, other = mode==='skill' ? 'form' : 'skill';
  const sl = seasons();
  if(!S.period) S.period = sl.length ? sl[sl.length-1] : monthOfNow();
  const per = S.period;
  const rows = standings(per, mode);
  const MV = st().moveDays || 1;
  let prevRank = {};
  if(per==='all'){ prevRank = ranksAt(dayAgo(MV), mode); }
  else {
    /* 어제까지의 성적으로 매긴 순위와 비교한다 */
    standings(per, mode, dayAgo(MV)).filter(r=>r.g>=(st().provisional||0))
      .forEach((r,i)=>prevRank[r.p.id]=i+1);
  }
  const HEAT = heatMap(HEAT_DAYS);
  const LUCK = {}; luckTable(per==='all'?null:per).forEach(x=>LUCK[x.id]=x);
  const TITLE = playerTitles(per, mode);
  const sIdx = sl.indexOf(per);
  const sPrev = sIdx>0 ? sl[sIdx-1] : null;
  const sNext = sIdx>=0 && sIdx<sl.length-1 ? sl[sIdx+1] : null;
  const seasonName = ym => ym.slice(0,4)+'. '+(+ym.slice(5))+'월 시즌';
  $('#view').innerHTML = `
    <h2>랭킹</h2>
    <div class="seg" style="margin-bottom:10px">
      <button data-mode="skill" class="${mode==='skill'?'on':''}">${MODES.skill.label}</button>
      <button data-mode="form" class="${mode==='form'?'on':''}">${MODES.form.label}</button>
    </div>
    <div class="seasonbar">
      ${per==='all'
        ? `<div class="sl">통산 랭킹</div>
           <button class="sb" data-per="${sl.length?sl[sl.length-1]:monthOfNow()}">시즌으로</button>`
        : `<button class="sa" data-per="${sPrev||''}" ${sPrev?'':'disabled'}>‹</button>
           <div class="sl">${sNext?'':'<span class="now"></span>'}${seasonName(per)}</div>
           <button class="sa" data-per="${sNext||''}" ${sNext?'':'disabled'}>›</button>
           <button class="sb" data-per="all">통산</button>`}
    </div>
    <p class="tiny dim" style="margin:0 2px 12px">${per==='all'?MODES[mode].note
      :`그 달 성적만으로 매긴 시즌 순위입니다. 누구를 이겼는지를 가중하기 때문에 부수가 낮아도 올라올 수 있습니다.
        화살표는 ${MV===1?'어제':MV+'일 전'}까지의 순위 대비, <b>상승세·주춤</b>은 최근 일주일,
        <b>기대</b>는 상대 실력을 감안한 예상 승수 대비입니다.`}</p>
    <div class="split tiny dim" style="margin:0 2px 9px">
      <span>선수 ${rows.length}명</span>
      <span style="display:flex;gap:6px">
        <button class="btn ghost sm" id="buToggle" style="padding:3px 9px;font-size:11px">${S.byBu?'전체 보기':'부수별'}</button>
        <button class="btn ghost sm" id="clubOpen" style="padding:3px 9px;font-size:11px">클럽 분석</button>
        <button class="btn ghost sm" id="simOpen" style="padding:3px 9px;font-size:11px">대회 시뮬레이터</button></span></div>
    ${(()=>{ const MIN=st().provisional||0;
      const qual=rows.filter(r=>r.g>=MIN), few=rows.filter(r=>r.g<MIN);
      const card=(r,i,ranked)=>{
        const d=deltaOf(r.p.id,mode,MV);
        const idle=idleDays(r.p.id);
        const rr=recentRecord(r.p.id), rf=recentForm(r.p.id);
        const was=ranked?prevRank[r.p.id]:0, mv=(ranked&&was)?was-(i+1):0;
        const medal = ranked && i<3;
        const pctW=r.g?Math.round(r.w/r.g*100):0;
        const felt=mode==='skill'?buScale(r.r):buScale(rateOf(r.p.id,'skill'));
        return `<button class="rk ${medal?'md md'+(i+1):''} ${ranked?'':'unranked'} ${r.p.id===meId()?'me':''}" data-pid="${r.p.id}" style="${idle!==null&&idle>45?'opacity:.5':''}">
          <div class="pos">${medal?`<span class="medal m${i+1}">${i+1}</span>`:`<span class="num">${ranked?i+1:'–'}</span>`}
            ${mv?`<span class="mv ${mv>0?'up':'down'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:''}</div>
          <div class="who">
            <div class="nm"><span class="pn">${esc(r.p.name)}</span><span class="badge">${r.p.bu}부</span>${r.p.hand==='L'?'<span class="badge b">왼손</span>':''}${rubberTag(r.p)}${gripTag(r.p)}
              ${(HEAT[r.p.id]&&HEAT[r.p.id].heat==='hot')?`<span class="heat" data-tt="상승세" title="최근 ${HEAT_DAYS}일 ${HEAT[r.p.id].g}경기, 예상보다 ${HEAT[r.p.id].diff.toFixed(1)}승 더 이김">🔥</span>`
               :(HEAT[r.p.id]&&HEAT[r.p.id].heat==='cold')?`<span class="heat" data-tt="주춤" title="최근 ${HEAT_DAYS}일 ${HEAT[r.p.id].g}경기, 예상보다 ${(-HEAT[r.p.id].diff).toFixed(1)}승 모자람">🧊</span>`:''}
              ${(TITLE[r.p.id]||[]).slice(0,2).map(([t,c])=>`<span class="t ${c}" data-tt="${t}">${t}</span>`).join('')}</div>
            <div class="meta">
              ${ranked?`<span class="wl"><b>${r.w}</b><i>승</i><em>${r.l}</em><i>패</i></span>
                        <span class="pc">${pctW}<i>%</i></span>`
                      :`<span class="pc">${r.g}<i>경기</i></span>`}
              <span class="form">${rf.map(x=>`<span class="${x.w?'w':'l'}" title="${x.d} ${esc(x.opp)} 상대 ${x.w?'승':'패'}">${x.w?'W':'L'}</span>`).join('')}</span>
            </div>
            <div class="sub3">${ranked
              ? `<b class="${felt<r.p.bu-0.4?'up':felt>r.p.bu+0.4?'down':''}"
                   title="성적으로 환산한 실력 위치">체감 ${felt.toFixed(1)}부</b>`
                + (LUCK[r.p.id]&&Math.abs(LUCK[r.p.id].diff)>=0.8
                    ? ` · <span class="${LUCK[r.p.id].diff>0?'up':'down'}"
                        title="${LUCK[r.p.id].g}경기에서 ${LUCK[r.p.id].exp.toFixed(1)}승이 예상됐는데 실제 ${LUCK[r.p.id].w}승">기대 ${LUCK[r.p.id].exp.toFixed(1)}승 → ${LUCK[r.p.id].w}승</span>` : '')
                + (mode==='skill'?` · ${MODES.form.label} ${Math.round(rateOf(r.p.id,'form'))}`:'')
                + (idle!==null&&idle>7?` · ${idle}일 전`:'')
              : `${st().provisional}경기부터 순위 반영`}</div>
          </div>
          <div class="rt"><div class="v">${Math.round(r.r)}</div>
          ${ranked?`<div class="d ${d>0.5?'up':d<-0.5?'down':'dim'}">${d>0?'▲':d<0?'▼':'–'}${Math.abs(Math.round(d))||0}</div>`:''}</div>
        </button>`;
      };
      if(!rows.length) return `<div class="empty">아직 등록된 선수가 없습니다.</div>`;
      if(S.byBu && qual.length){
      /* 부수별로 묶어서 본다 — 전체 순위는 어차피 부수 순서라, 같은 부수 안의 싸움이 궁금하다 */
      const hot0=r=>(HEAT[r.p.id]||{diff:0}).diff;
      const grp={};
      qual.forEach(r=>(grp[r.p.bu]=grp[r.p.bu]||[]).push(r));
      const bus=Object.keys(grp).map(Number).sort((a,b)=>a-b);
      return bus.map(bu=>{
        const list=grp[bu];
        const avg=list.reduce((a,r)=>a+r.r,0)/list.length;
        const hot=list.filter(r=>HEAT[r.p.id]&&HEAT[r.p.id].heat==='hot')
                      .sort((a,b)=>HEAT[b.p.id].diff-HEAT[a.p.id].diff)[0];
        return `<div class="bugrp">
          <div class="bg-h"><b>${bu}부</b><span>${list.length}명 · 평균 ${Math.round(avg)}</span>
            ${hot?`<em title="최근 일주일 예상보다 ${hot0(hot).toFixed(1)}승 더 이겼습니다">이번 주 🔥 ${esc(hot.p.name)}</em>`:''}</div>
          ${list.map((r,i)=>card(r,i,true)).join('')}
        </div>`;
      }).join('')
      + (few.length?`<div class="bugrp"><div class="bg-h"><b>경기 부족</b><span>${few.length}명</span></div>
          ${few.map((r,i)=>card(r,i,false)).join('')}</div>`:'');
    }
    return (qual.length ? qual.map((r,i)=>card(r,i,true)).join('')
                          : `<div class="empty">아직 ${MIN}경기를 채운 선수가 없습니다.</div>`)
        + (few.length ? `<div class="secttl" style="margin:18px 2px 8px">경기 부족 · ${few.length}명</div>
            <p class="tiny dim" style="margin:0 2px 10px">${MIN}경기를 채우면 순위에 들어갑니다. 그전까지는 부수 기준값에 가깝게 표시됩니다.</p>`
            + few.map((r,i)=>card(r,i,false)).join('') : '');
    })()}
    ${S.me?'':`<div class="card" style="margin-top:12px"><div class="split">
      <div><div style="font-weight:600">나의 경기 기록</div>
      <div class="tiny dim" style="margin-top:3px">로그인하면 내 전적과 경기 입력을 쓸 수 있습니다.</div></div>
      <button class="btn sm" id="goLogin">로그인</button></div></div>`}
    ${per!=='all'?'':`<p class="tiny dim" style="margin:14px 2px 4px">${mode==='skill'
      ? `핸디 1점을 ${Math.round(handiElo())}점으로 보고, 여기서 부수당 ${Math.round(perBu())}점이 따라옵니다(${BU_MAX}부 ${baseFor(BU_MAX)} 시작). 핸디가 제대로 잡힌 경기는 기대 승률이 5:5라, 이겨야 오르고 져야 내려갑니다.`
      : `전원 ${st().formBase}점에서 시작합니다. 핸디를 그대로 인정하고 승패만 반영해서, 자기 부수·핸디 조건 대비 얼마나 잘 치는지를 봅니다.`} 오른쪽 화살표와 순위 옆 화살표는 ${MV===1?'직전 경기일':MV+'일 전'} 대비 등락이고, ${st().kHalfLife}일마다 예전 경기의 무게가 절반으로 줄어 지금 상태에 가깝게 유지됩니다.</p>`}`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;viewRank();});
  if($('#simOpen')) $('#simOpen').onclick=simSheet;
  if($('#clubOpen')) $('#clubOpen').onclick=clubSheet;
  if($('#buToggle')) $('#buToggle').onclick=()=>{ S.byBu=!S.byBu; viewRank(); };
  document.querySelectorAll('[data-per]').forEach(b=>{ if(b.dataset.per)
    b.onclick=()=>{S.period=b.dataset.per;viewRank();}; });
  if($('#goLogin')) $('#goLogin').onclick=()=>{ S.tab='login'; render(); };
  document.querySelectorAll('.rk').forEach(b=>b.onclick=()=>playerSheet(b.dataset.pid));
  document.querySelectorAll('[data-tt]').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); e.preventDefault(); titleSheet(el.dataset.tt); });
}

/* ── 경기 입력 ── */
/* 회원은 어제까지만 입력할 수 있다. 며칠 지난 기억으로 넣으면 서로 안 맞는 경우가 많아서다.
   관리자는 제한 없이 소급 입력할 수 있고, 이미 들어간 경기는 '날짜 수정'으로 언제든 옮긴다. */
const minEntryDate = ()=> isAdmin() ? '' : dayAgo(1);
const dateOK = d => !!d && d<=today() && (isAdmin() || d>=dayAgo(1));
const shiftDate = (d,n)=>{ const [y,m,dd]=d.split('-').map(Number);
  const x=new Date(y,m-1,dd+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dateLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  const wk=['일','월','화','수','목','금','토'][new Date(y,m-1,dd).getDay()];
  const rel = d===today()?' · 오늘' : d===dayAgo(1)?' · 어제' : '';
  return `${m}월 ${dd}일 (${wk})${rel}`;
}
/* 화살표로도 바꾸고 달력으로도 고를 수 있게 둘 다 둔다 — 기기에 따라 달력이 안 열리는 경우가 있어서다 */
function dateField(id, val){
  /* 달력 입력창은 숨겨두고 화살표로 조작한다. 가운데 날짜를 누르면 달력이 뜨는 기기에서는 달력도 열린다. */
  return `<div class="field" style="position:relative">
    <div class="daterow">
      <button data-ds="-1" ${dateOK(shiftDate(val,-1))?'':'disabled'}>‹</button>
      <button class="dlab" data-dpick>${dateLabel(val)}</button>
      <button data-ds="1" ${dateOK(shiftDate(val,1))?'':'disabled'}>›</button>
    </div>
    <input type="date" id="${id}" value="${val}" max="${today()}" min="${minEntryDate()}"
           style="position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;padding:0;border:none">
    <p class="tiny dim" style="margin:7px 2px 0">${isAdmin()?'관리자는 지난 날짜도 넣을 수 있습니다.':'오늘과 어제까지 입력할 수 있습니다. 더 지난 경기는 관리자에게 요청하세요.'}</p>
  </div>`;
}
function bindDateField(id, get, apply){
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
    const nd=shiftDate(get(), +b.dataset.ds);
    if(dateOK(nd)) apply(nd);
  });
  const el=$('#'+id); if(!el) return;
  const pick=document.querySelector('[data-dpick]');
  if(pick) pick.onclick=()=>{ try{ el.showPicker ? el.showPicker() : el.focus(); }catch(e){} };
  el.onchange=e=>{ const v=e.target.value;
    if(!v){ e.target.value=get(); return; }
    if(!dateOK(v)){ e.target.value=get(); return toast('입력할 수 없는 날짜입니다.',1); }
    apply(v);
  };
}

/* picks = { 상대id: {r:'W'|'L', n:판수} } — 중복은 건너뛰고 상대 입력분은 합친다 */
async function planAndSave(date, meId, picks, label){
  /* 관리자가 입력한 경기는 본인이 뛴 것이든 아니든 바로 확정으로 본다.
     회원이 자기 경기를 넣은 경우에만 상대 확인을 기다린다. */
  const needConfirm = !isAdmin() && meId===S.me.id;
  const confirmIds = oppId => needConfirm ? [S.me.id] : [meId, oppId];
  const draftList = S.matches.slice();
  const scan = (oppId,iWon)=>{
    const same=draftList.filter(m=>!m.void && m.date===date &&
      ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
    const ok=m=>(winnerOf(m)===meId)===iWon;
    const cands=same.filter(ok), cb=m=>m.confirmedBy||[];
    return { byOpp: cands.find(m=>m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m)),
             mineCount: cands.filter(m=>m.enteredBy===meId || cb(m).includes(meId)).length };
  };
  const writes=[]; let created=0, merged=0, skipped=0;
  for(const [oppId,k] of Object.entries(picks)){
    if(!P(oppId) || oppId===meId) continue;
    const iWon = k.r==='W';
    const s0 = scan(oppId,iWon);
    let need = Math.max(0, k.n - s0.mineCount);
    skipped += k.n - need;
    while(need>0){
      const sc = scan(oppId,iWon);
      if(!sc.byOpp) break;
      const upd={...sc.byOpp, confirmedBy:[...new Set([...(sc.byOpp.confirmedBy||[]), ...confirmIds(oppId)])],
                 status:'confirmed', rev:(sc.byOpp.rev||0)+1};
      writes.push(upd);
      const i=draftList.findIndex(m=>m.id===upd.id); if(i>=0) draftList[i]=upd;
      merged++; need--;
    }
    const a=P(meId), b=P(oppId);
    const hTo = a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';
    const hPts = hTo ? handiPtsFor(a.bu,b.bu) : 0;
    for(let i=0;i<need;i++){
      const m={ id:uid('m'), rev:1, date, aId:meId, bId:oppId, winnerId: iWon?meId:oppId,
                handi: hTo?{toId:hTo, pts:hPts}:null, note:'',
                enteredBy:S.me.id, enteredAt:new Date(Date.now()+i).toISOString(),
                confirmedBy: confirmIds(oppId), status: needConfirm?'single':'confirmed', void:false };
      writes.push(m); draftList.push(m); created++;
    }
  }
  let ok=true;
  if(writes.length){ busyOn(`${writes.length}건 저장 중…`); ok=await commitMatches(writes); }
  return {ok, created, merged, skipped, count:writes.length};
}
async function submitBulk(){
  if(S.busy) return;
  const live=$('#bdate'); if(live&&live.value) bulk.date=live.value;
  const date=bulk.date, meId=bulk.meId;
  if(!dateOK(date)) return toast(date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);
  if(!Object.keys(bulk.picks).length) return;

  S.busy=true; busyOn('정리하는 중…');
  const r=await planAndSave(date, meId, bulk.picks);
  S.busy=false; busyOff();
  if(!r.ok) return errorSheet('저장하지 못했습니다','경기를 저장하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('빠른 입력', `${nameOf(meId)} · ${date} · 등록 ${r.created} / 합침 ${r.merged} / 건너뜀 ${r.skipped}`);
  bulk={ date, meId, picks:{} };
  render();
  const parts=[];
  if(r.created) parts.push(`${r.created}건 등록`);
  if(r.merged)  parts.push(`${r.merged}건 상대 입력과 합침`);
  if(r.skipped) parts.push(`${r.skipped}건 건너뜀`);
  toast(parts.length?parts.join(' · '):'새로 등록할 경기가 없었습니다.');
}

function matchCardHTML(m){
  const win=winnerOf(m), lose=loserOf(m);
  const mine=isMine(m), done=isConfirmed(m);
  const iWon = mine && win===S.me.id;
  const meMark = pid => pid===meId() ? '<i class="mem">나</i>' : '';
  const canDel = !!S.me && (isAdmin() || (m.enteredBy===S.me.id && !done));
  const canOk  = !!S.me && mine && !done && !(m.confirmedBy||[]).includes(S.me.id);
  const legacy = (m.enteredAt||'') < (st().legacyBefore||'');
  const proxy  = m.enteredBy!==m.aId && m.enteredBy!==m.bId;
  const byLabel = (legacy||proxy) ? '관리자 입력' : esc(nameOf(m.enteredBy))+' 입력';

  const dW = Math.round(Math.abs(win===m.aId ? (m._sA||0) : (m._sB||0)));
  const dL = Math.round(Math.abs(win===m.aId ? (m._sB||0) : (m._sA||0)));
  /* 점수가 오르는 건 이긴 쪽뿐이라, 최고 기록도 이긴 쪽에서만 나온다 */
  const peakW = win===m.aId ? m._peakA : m._peakB;

  let meta='';
  if(m._expA!=null){
    const favId = m._expA>=0.5 ? m.aId : m.bId;
    const favP  = Math.min(99, Math.round(Math.max(m._expA,1-m._expA)*100));
    const up    = win!==favId && favP>=58;
    meta += up ? `<span class="ups">이변</span>` : '';
    meta += `<span class="${favP>=70?'hot':''}">예상 ${esc(nameOf(favId))} ${favP}%</span>`;
  }
  if(m.handi&&m.handi.pts) meta += `<span>핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}</span>`;

  if(!done) meta += `<span class="hot">${(m.confirmedBy||[]).includes(meId())?'상대 확인 대기':'내 확인 필요'}${st().confirmedOnly?' · 랭킹 미반영':''}</span>`;

  return `<div class="mt ${mine?(iWon?'mine mw':'mine ml'):''}">
    <button class="mrow" data-exp="${m.id}">
      <div class="side"><span class="rs w">승</span>
        <span class="pn ${win===meId()?'me':''}">${esc(nameOf(win))}${meMark(win)}${buOf(win)?`<em>(${buOf(win)}부)</em>`:''}</span>
        ${peakW?`<span class="pkin" title="${MODES.skill.label} 랭킹 기준, 이 경기로 본인 최고 레이팅을 넘어섰습니다">${peakW} 개인 최고</span>`:''}
        <span class="dl up">+${dW}</span></div>
      <div class="side"><span class="rs l">패</span>
        <span class="pn dim ${lose===meId()?'me':''}">${esc(nameOf(lose))}${meMark(lose)}${buOf(lose)?`<em>(${buOf(lose)}부)</em>`:''}</span>
        <span class="dl down">−${dL}</span></div>
      ${meta?`<div class="mmeta">${meta}</div>`:''}
    </button>
    <div class="macts" id="act_${m.id}" style="display:none">
      <div class="info">${m.date} · ${done?'상호 확인':'상대가 확인하면 랭킹에 반영됩니다'} · ${byLabel}${m.note?' · '+esc(m.note):''}</div>
      ${canDel?`<button class="btn ghost sm" data-date="${m.id}">날짜 수정</button>
                <button class="btn ghost sm" data-void="${m.id}">삭제</button>`:''}
      ${canOk?`<button class="btn ghost sm" data-ok="${m.id}">이 경기 확인</button>`:''}
      ${(!canDel&&!canOk)?'<span class="tiny dim">수정 권한이 없습니다.</span>':''}
    </div>
  </div>`;
}
function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  /* 엔진이 계산한 순서(오래된 것부터)를 그대로 뒤집어 쓴다.
     화면 순서와 계산 순서가 어긋나면 '개인 최고' 같은 표시가 엉뚱한 줄에 붙는다. */
  const ord={}; (S._sorted||[]).forEach((m,i)=>ord[m.id]=i);
  const key=m=> ord[m.id]!=null ? ord[m.id]
    : 1e9 + (m.date+'|'+(m.enteredAt||'')).localeCompare('');
  const sorted=list.slice().sort((a,b)=>{
    const ka=ord[a.id], kb=ord[b.id];
    if(ka!=null && kb!=null) return kb-ka;                 // 최신이 위
    return (b.date+'|'+(b.enteredAt||'')).localeCompare(a.date+'|'+(a.enteredAt||''));
  });
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
/* 경기 삭제 — 보관하지 않고 바로 지운다 */
async function deleteMatchById(id){
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>m.id!==id); recompute(); render();
  busyOn('삭제 중…');
  let ok=true;
  try{
    if(FB){ await FB.del(FBM+'/'+id); bumpSig(); }
    else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>x.id===id)) continue;
        if(!await sSet(k, cur.filter(x=>x.id!==id))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 선수를 지울 때 그 사람 경기도 함께 지운다 */
async function deleteMatchesOf(pid){
  const targets=S.matches.filter(m=>m.aId===pid||m.bId===pid);
  if(!targets.length) return 0;
  try{
    if(FB){
      const obj={}; targets.forEach(m=>obj[m.id]=null);   // null 을 넣으면 그 레코드가 지워진다
      await FB.patch(FBM, obj); bumpSig();
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        const next=cur.filter(m=>m.aId!==pid && m.bId!==pid);
        if(next.length!==cur.length) await sSet(k,next);
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); return 0; }
  S.matches=S.matches.filter(m=>m.aId!==pid && m.bId!==pid); recompute();
  return targets.length;
}
/* 날짜만 바꾼다. 개별 레코드 방식이라 옮길 필요가 없다 */
async function moveMatchDate(m, newDate){
  const upd={...m, date:newDate, rev:(m.rev||0)+1, editedBy:S.me.id, editedAt:new Date().toISOString()};
  if(FB) return pushMatches([upd]);
  const newKey=KEY.shard(monthOf(newDate));
  if(!await commitMatch(upd)) return false;
  for(const k of (await sList(MPRE))){
    if(k===newKey) continue;
    const cur=(await sGet(k))||[];
    if(cur.some(x=>x.id===m.id)) await sSet(k, cur.filter(x=>x.id!==m.id));
  }
  await loadAll();
  return true;
}
function dateSheet(id){
  const m=S.matches.find(x=>x.id===id); if(!m) return;
  const sh=sheet('경기 날짜 수정', `
    <p class="tiny dim">${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))}</p>
    <div class="field" style="margin-top:12px"><label>날짜</label>
      <input type="date" id="mdNew" value="${m.date}" max="${today()}" min="${minEntryDate()}"></div>
    <p class="tiny dim">몰아서 기록하다 날짜가 밀린 경우에 쓰세요. 날짜를 바꾸면 그 순서대로 레이팅이 다시 계산됩니다.</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" id="mdNo">취소</button><button class="btn" id="mdYes">저장</button></div>`);
  sh.querySelector('#mdNo').onclick=()=>sh.remove();
  sh.querySelector('#mdYes').onclick=async()=>{
    const nd=sh.querySelector('#mdNew').value;
    if(!nd) return toast('날짜를 선택하세요.',1);
    if(!dateOK(nd)) return toast(nd>today()?'미래 날짜는 넣을 수 없습니다.':'오늘과 어제로만 옮길 수 있습니다.',1);
    sh.remove();
    if(nd===m.date) return;
    const ok=await moveMatchDate(m, nd);
    if(!ok) return errorSheet('수정하지 못했습니다','날짜를 옮기는 중 문제가 생겼습니다.');
    audit('날짜 수정', `${m.date} → ${nd}`);
    viewLog.month=nd.slice(0,7); if(viewLog.day) viewLog.day=nd;
    render(); toast('날짜를 바꿨습니다.');
  };
}
function bindMatchActions(){
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('act_'+b.dataset.exp); if(!el) return;
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>dateSheet(b.dataset.date));
  document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{
    const m=S.matches.find(x=>x.id===b.dataset.void); if(!m) return;

/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>m._expA!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = w===m.aId ? m._expA : 1-m._expA;
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=UPSET) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

/* ── 내 정보 / 선수 상세 ── */
function sparkline(id,mode,ym){
  /* 시즌 첫날부터 오늘까지 매일 찍는다. 경기가 없던 날은 점수가 그대로 이어진다. */
  const p=P(id); if(!p) return '';
  const per = ym || (seasons().slice(-1)[0]) || monthOfNow();
  const hist=(trk(mode).H[id]||[]);
  const played=new Set((S._sorted||[]).filter(m=>m.aId===id||m.bId===id).map(m=>m.date));
  const byDay=new Map();
  for(const x of hist){ if(x.d && played.has(x.d)) byDay.set(x.d, x.r); }

  const addDay=(ds,n)=>{ const t=new Date(ds+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n);
    return t.toISOString().slice(0,10); };
  const start = per+'-01';
  const monthEnd = addDay(shiftMonth(per,1)+'-01', -1);
  const end = today() < monthEnd ? today() : monthEnd;
  if(end < start) return '';

  /* 시즌 시작 시점의 점수 — 그 전 마지막 기록, 없으면 기준값 */
  let cur = mode==='form' ? st().formBase : baseFor(p.bu);
  [...byDay.keys()].sort().forEach(d=>{ if(d < start) cur = byDay.get(d); });

  const series=[]; let d=start, guard=0;
  while(d<=end && guard++<400){
    if(byDay.has(d)) cur=byDay.get(d);
    series.push([d, cur, byDay.has(d)]);
    d=addDay(d,1);
  }
  if(series.length<2) return '';
  const h=series.map(x=>x[1]);
  const w=300,ht=64;
  let lo=Math.min(...h), hi=Math.max(...h);
  if(hi-lo < 30){ const mid=(hi+lo)/2; lo=mid-15; hi=mid+15; }   // 변화가 작아도 납작하지 않게
  const sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const dd=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const dots=series.map((x,i)=> x[2]
    ? `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="2.2" fill="${col}">
        <title>${x[0]} · ${Math.round(x[1])}</title></circle>` : '').join('');
  const days=series.filter(x=>x[2]).length;
  const fmt=x=>(+x.slice(8))+'일';
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${dd} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${dd}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>
    <div class="split tiny dim"><span>${Math.round(Math.min(...h))}</span>
      <span>${+per.slice(5)}월 ${fmt(start)}~${fmt(end)} <span class="dim">· ${days}일 출전</span></span>
      <span>${Math.round(Math.max(...h))}</span></div>`;
}
const playDaysOf = (id, ym)=> new Set((S._sorted||[])
  .filter(m=>(m.aId===id||m.bId===id) && (!ym || m.date.slice(0,7)===ym))
