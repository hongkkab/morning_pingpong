<script>
/* ─────────────────────────── 저장소 계층 ───────────────────────────
   같은 키 인터페이스 뒤에 두 가지 저장소를 둔다.
   · Firebase 설정이 채워져 있으면 → 실시간 공유 DB (어디서 보든 같은 결과)
   · 아니면 → 이 기기 전용 임시 저장                                    */
const CFG  = window.TT_CONFIG || {};
const CLUB = String(CFG.clubId || 'morning').replace(/[.#$\[\]\/]/g,'-');
const KEY = {
  players:'tt:players', meta:'tt:meta', audit:'tt:audit',
  shard: m => 'tt:matches:'+m, session:'tt:session'
};
const MPRE = 'tt:matches:';
const mem = new Map();
const hasStore = typeof window!=='undefined' && !!window.storage;
let FB = null;                                   // 연결 성공 시에만 채워진다
const online = ()=> !!FB;
const clean  = v => JSON.parse(JSON.stringify(v===undefined?null:v));
const asList = v => Array.isArray(v) ? v : (v && typeof v==='object' ? Object.values(v) : v);

function fbPath(k){
  if(k===KEY.players) return 'players';
  if(k===KEY.meta)    return 'meta';
  if(k===KEY.audit)   return 'audit';
  if(k.startsWith(MPRE)) return 'shards/'+k.slice(MPRE.length);
  return 'misc/'+k.replace(/[.#$\[\]\/:]/g,'_');
}

/* 한쪽이 막힌 망에서도 붙도록 두 경로를 순서대로 시도한다 */
const SDK_SOURCES = [
  { app:'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js',
    db :'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js',
    au :'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js' },
  { app:'https://esm.sh/firebase@10.12.5/app',
    db :'https://esm.sh/firebase@10.12.5/database',
    au :'https://esm.sh/firebase@10.12.5/auth' }
];
async function loadSDK(){
  let last=null;
  for(const src of SDK_SOURCES){
    try{ return await Promise.all([import(src.app), import(src.db), import(src.au)]); }
    catch(e){ last=e; }
  }
  throw last;
}
async function initFirebase(){
  const c = CFG.firebase;
  if(!c || !c.databaseURL) return null;
  try{
    const [A,D,U] = await loadSDK();
    const app = A.initializeApp(c);
    try{ await U.signInAnonymously(U.getAuth(app)); }catch(e){ /* 익명 로그인 미사용이면 그대로 진행 */ }
    const db = D.getDatabase(app), base = 'clubs/'+CLUB;
    return {
      async get(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? snap.val() : null; },
      async set(pth,v){ await D.set(D.ref(db, base+'/'+pth), clean(v)); return true; },
      async del(pth){ await D.remove(D.ref(db, base+'/'+pth)); return true; },
      async keys(pth){ const snap = await D.get(D.ref(db, base+'/'+pth)); return snap.exists()? Object.keys(snap.val()) : []; },
      watch(cb){ D.onValue(D.ref(db, base), ()=>cb()); }
    };
  }catch(e){ console.warn('Firebase 연결 실패:', e); S.fbError=String(e&&e.message||e); return null; }
}
const fbConfigured = ()=> !!(CFG.firebase && CFG.firebase.databaseURL);

/* 세션(로그인 상태)은 기기별로만 남는다 */
function localGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ const v=mem.get('p:'+k); return v?JSON.parse(v):null; } }
function localSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem.set('p:'+k,JSON.stringify(v)); } return true; }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){ mem.delete('p:'+k); } return true; }

async function sGet(k, shared=true){
  if(!shared){
    if(FB || !hasStore) return localGet(k);

const st = ()=> (S.meta&&S.meta.settings) || DEFAULTS;
/* 인과 방향: 핸디 1점당 레이팅(추정값) × 부수당 핸디 점수(클럽 관행) = 부수당 레이팅(파생값) */
const handiElo = ()=> st().handiElo;

const baseFor = bu => st().baseRating + (BU_MAX - Math.min(BU_MAX,Math.max(BU_MIN,bu||BU_MAX))) * perBu();

/* 최근성 가중 경험치: 지난 경기들이 반감기에 따라 서서히 사라진다.
   활발히 치면 경험치가 쌓여 K가 낮고(안정), 오래 쉬면 줄어들어 K가 올라간다(빠른 재조정). */
const decayExp = (n, days)=> n * Math.pow(0.5, days/(st().kHalfLife||30));

const winnerOf = m => m.winnerId || (m.aSets>m.bSets ? m.aId : m.bId);

const MODES = { skill:{label:'부수', note:'부수를 시작점으로 두고 핸디를 걷어낸 값입니다. 핸디 조건을 넘어선 만큼만 오르내려요.'},
                form: {label:'핸디포함', note:'전원 같은 점수에서 시작하고 핸디를 그대로 인정한 값입니다. 붙은 그대로의 승패 순서예요.'} };

/* 한 트랙 계산 — mode: 'skill'=부수(부수 시작 + 핸디 보정) | 'form'=핸디포함(동일 시작 + 무보정) */
function runEngine(mode){
  const s=st(), hElo=handiElo(), skill=(mode==='skill');
  const dk = skill?['_sA','_sB']:['_fA','_fB'];
  const R={},H={},G={},LD={},PK={},RG={};
  S.players.forEach(p=>{
    R[p.id] = skill ? baseFor(p.bu) : s.formBase;
    H[p.id] = [{d:p.joinedAt?p.joinedAt.slice(0,10):'', r:R[p.id]}];
    G[p.id] = 0; LD[p.id] = null; PK[p.id] = R[p.id]; RG[p.id] = 0;
  });
  const expAt = id => {                       // 이 경기 시점의 감쇠 경험치
    const m=S._cur; if(!LD[id]) return 0;
    return decayExp(G[id], daysBetween(LD[id], m.date));
  };
  for(const m of S._sorted){
    if(!(m.aId in R)||!(m.bId in R)){ m[dk[0]]=m[dk[1]]=0; continue; }
    S._cur=m;
    const na=expAt(m.aId), nb=expAt(m.bId);
    const ra=R[m.aId], rb=R[m.bId];
    let ea=ra, eb=rb;
    if(skill && s.handiOn && m.handi && m.handi.pts>0){
      if(m.handi.toId===m.aId) ea += m.handi.pts*hElo;
      if(m.handi.toId===m.bId) eb += m.handi.pts*hElo;
    }
    const expA = 1/(1+Math.pow(10,(eb-ea)/400));
    const sa = winnerOf(m)===m.aId ? 1 : 0;
    const dA = kFor(na)*(sa-expA);
    const dB = kFor(nb)*((1-sa)-(1-expA));
    R[m.aId]=ra+dA; R[m.bId]=rb+dB;
    if(skill){
      m._expA=expA;
      if(RG[m.aId]>=9 && R[m.aId]>PK[m.aId]){ m._peakA=true; }
      if(RG[m.bId]>=9 && R[m.bId]>PK[m.bId]){ m._peakB=true; }
      PK[m.aId]=Math.max(PK[m.aId],R[m.aId]); PK[m.bId]=Math.max(PK[m.bId],R[m.bId]);
    }
    m[dk[0]]=dA; m[dk[1]]=dB;
    G[m.aId]=na+1; G[m.bId]=nb+1; RG[m.aId]++; RG[m.bId]++;
    LD[m.aId]=m.date; LD[m.bId]=m.date;
    H[m.aId].push({d:m.date,r:R[m.aId],id:m.id}); H[m.bId].push({d:m.date,r:R[m.bId],id:m.id});
  }
  return {R,H};
}
function recompute(){
  S._sorted = liveMatches().slice().sort((a,b)=>(a.date+'|'+a.enteredAt).localeCompare(b.date+'|'+b.enteredAt));
  const G={},W={},L={},HH={};
  S.players.forEach(p=>{G[p.id]=0;W[p.id]=0;L[p.id]=0;HH[p.id]={};});
  for(const m of S._sorted){
    if(!(m.aId in G)||!(m.bId in G)) continue;
    const aw = winnerOf(m)===m.aId;
    G[m.aId]++; G[m.bId]++;
    if(aw){ W[m.aId]++; L[m.bId]++; } else { W[m.bId]++; L[m.aId]++; }
    HH[m.aId][m.bId]=HH[m.aId][m.bId]||{w:0,l:0}; HH[m.bId][m.aId]=HH[m.bId][m.aId]||{w:0,l:0};
    if(aw){HH[m.aId][m.bId].w++;HH[m.bId][m.aId].l++;}else{HH[m.aId][m.bId].l++;HH[m.bId][m.aId].w++;}
  }
  const LAST={};
  S.players.forEach(p=>LAST[p.id]=null);
  for(const m of S._sorted){
    if(m.aId in LAST) LAST[m.aId] = !LAST[m.aId]||m.date>LAST[m.aId] ? m.date : LAST[m.aId];
    if(m.bId in LAST) LAST[m.bId] = !LAST[m.bId]||m.date>LAST[m.bId] ? m.date : LAST[m.bId];
  }
  S.G=G;S.W=W;S.L=L;S.HH=HH;S.LAST=LAST;
  S.tracks = { skill:runEngine('skill'), form:runEngine('form') };
  S.peak = {};
  for(const mode of ['skill','form']){
    S.peak[mode]={};
    for(const p of S.players){ const h=S.tracks[mode].H[p.id]||[];
      S.peak[mode][p.id] = h.reduce((best,x)=> x.r>best.r?x:best, h[0]||{r:0,d:''}); }
  }
}
const trk = mode => S.tracks[mode||S.mode] || {R:{},H:{}};
const rateOf = (id,mode)=>{ const v=trk(mode).R[id];
  return v!=null ? v : ((mode||S.mode)==='form' ? st().formBase : baseFor((P(id)||{}).bu)); };

function deltaOf(id,mode){
  const h=trk(mode).H[id]||[]; if(h.length<2) return 0;
  const cutoff=new Date(Date.now()-(st().formDays||30)*864e5).toISOString().slice(0,10);
  let base=h[0];
  for(const x of h){ if(x.d && x.d<=cutoff) base=x; else break; }
  return h[h.length-1].r - base.r;
}

function streakOf(id){

  if(!ms.length) return null;
  const last=ms[ms.length-1], w=winnerOf(last)===id;

  for(let i=ms.length-1;i>=0;i--){ if((winnerOf(ms[i])===id)===w) n++; else break; }

function ranksAt(dateStr, mode){

    for(const x of h){ if(!x.d || x.d<=dateStr) r=x.r; else break; }
    return {id:p.id, r};

/* 상대 분석 — 표본이 적어도 뜻이 있게, 기대 승수 대비 실제 승수로 본다.
   기대 승수는 그 경기 직전 레이팅과 핸디를 반영한 값이라 상대 수준이 자동으로 보정된다. */
function h2hStats(id){
  const me=P(id); if(!me) return null;
  const opp={}, bu={high:{w:0,l:0,e:0}, same:{w:0,l:0,e:0}, low:{w:0,l:0,e:0}},
        hand={R:{w:0,l:0,e:0}, L:{w:0,l:0,e:0}};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    if(m._expA==null) continue;
    const oid = m.aId===id ? m.bId : m.aId;
    const o=P(oid); if(!o) continue;
    const e = m.aId===id ? m._expA : 1-m._expA;
    const w = winnerOf(m)===id ? 1 : 0;
    (opp[oid] = opp[oid] || {w:0,l:0,e:0})[w?'w':'l']++;
    opp[oid].e += e;
    const band = o.bu < me.bu ? 'high' : o.bu === me.bu ? 'same' : 'low';   // 부수 숫자가 작을수록 상위
    bu[band][w?'w':'l']++; bu[band].e += e;
    const h = o.hand==='L' ? 'L' : 'R';
    hand[h][w?'w':'l']++; hand[h].e += e;
  }
  const list=Object.entries(opp).map(([oid,x])=>({oid, ...x, g:x.w+x.l, d:x.w-x.e}))
                 .sort((a,b)=> b.g-a.g || b.d-a.d);
  return {list, bu, hand};
}
function dbar(label, x, maxAbs, note){
  const g=x.w+x.l; if(!g) return '';
  const d=x.w-x.e, thin=g<3;
  const w=maxAbs>0 ? Math.min(50, Math.abs(d)/maxAbs*50) : 0;
  const cls = thin ? 'dim' : d>=0.8?'up' : d<=-0.8?'down' : 'dim';
  return `<div class="dbar ${thin?'thin':''}">
    <div class="lb">${esc(label)}<small>${x.w}−${x.l}${note?' · '+note:''}</small></div>
    <div class="track"><span class="fill ${d>=0?'pos':'neg'}" style="width:${w}%"></span></div>
    <div class="val ${cls}">${d>0?'+':''}${d.toFixed(1)}</div>
  </div>`;
}

}

/* 새로 들어온 사람의 시작 레이팅이 실제 실력과 맞는지 진단.
   첫 N경기에서 기대 승수보다 실제 승수가 크게 적으면 시작값이 후하다는 뜻이고,
   그만큼 기존 회원들이 점수를 가져가게 된다. */
function entryAccuracy(n=10){
  const seen={}; let exp=0, act=0, cnt=0;
  for(const m of (S._sorted||[])){
    for(const side of [0,1]){
      const id = side? m.bId : m.aId;
      if(!(id in S.G)) continue;
      const c = seen[id]||0;
      if(c<n){
        const e = side ? 1-(m._expA||0.5) : (m._expA||0.5);
        exp += e; act += (winnerOf(m)===id?1:0); cnt++;
      }
      seen[id]=c+1;
    }
  }
  return {cnt, exp, act};
}

function handiStat(){

  if(!ms.length) return {n:0};
  const w=ms.filter(m=> winnerOf(m)===m.handi.toId).length;
  return {n:ms.length, rate:Math.round(w/ms.length*100)};
}

/* ─────────────────────────── 로드 / 커밋 ─────────────────────────── */
async function loadAll(){
  let meta = await sGet(KEY.meta);
  if(!meta){ meta = {settings:{...DEFAULTS}, createdAt:new Date().toISOString(), v:1}; await sSet(KEY.meta,meta); }
  meta.settings = {...DEFAULTS, ...(meta.settings||{})};
  S.meta = meta;
  S.players = (await sGet(KEY.players)) || [];
  const keys = await sList('tt:matches:');
  S._shards = keys.length;
  const shards = await Promise.all(keys.map(k=>sGet(k)));
  const merged=new Map();                       // 같은 id가 여러 조각에 있으면 최신 rev만 남긴다
  for(const m of shards.flat().filter(Boolean)){
    const prev=merged.get(m.id);
    if(!prev || (m.rev||0) >= (prev.rev||0)) merged.set(m.id, m);
  }
  S.matches = [...merged.values()];
  recompute();
}
/* 경기 저장: 해당 월 샤드만 재읽기 → id 기준 병합 → 기록 후 검증 재시도 */
async function commitMatch(match){
  const key = KEY.shard(monthOf(match.date));
  for(let attempt=0; attempt<3; attempt++){
    const cur = (await sGet(key)) || [];
    const map = new Map(cur.map(m=>[m.id,m]));
    map.set(match.id, match);
    const next = [...map.values()];
    await sSet(key, next);
    const check = (await sGet(key)) || [];
    if(check.some(m=>m.id===match.id && m.rev===match.rev)){
      const local = new Map(S.matches.map(m=>[m.id,m]));
      check.forEach(m=>local.set(m.id,m));
      S.matches=[...local.values()]; recompute(); return true;
    }
    await new Promise(r=>setTimeout(r, 120+Math.random()*250));
  }
  return false;
}
async function savePlayers(mut){
  for(let a=0;a<3;a++){
    const cur=(await sGet(KEY.players))||[];
    const map=new Map(cur.map(p=>[p.id,p]));
    mut(map);
    const next=[...map.values()];
    await sSet(KEY.players,next);
    const chk=(await sGet(KEY.players))||[];
    if(chk.length===next.length){ S.players=chk; recompute(); return true; }
    await new Promise(r=>setTimeout(r,150));
  }
  return false;
}
async function audit(action, detail){
  const log=(await sGet(KEY.audit))||[];
  log.unshift({t:new Date().toISOString(), by:S.me?S.me.name:'-', action, detail});
  await sSet(KEY.audit, log.slice(0,200));
}

/* ─────────────────────────── 중복 판정 ─────────────────────────── */
/* 같은 날 · 같은 상대 · 같은 승패 = 중복 후보.
   상대가 먼저 넣은 미확인 건이 있으면 → 새 레코드 없이 '상호 확인'으로 승격.
   내가 넣은 건만 있으면 → 진짜 다른 경기인지 물어봄(하루에 같은 결과 반복 가능). */
function dupScan(date, meId, oppId, iWon){
  const same = S.matches.filter(m=>!m.void && m.date===date &&
    ((m.aId===meId&&m.bId===oppId)||(m.aId===oppId&&m.bId===meId)));
  const sameResult = m => (winnerOf(m)===meId) === iWon;
  const cands = same.filter(sameResult);
  const cb = m => m.confirmedBy || [];
  const byOpp = cands.find(m=> m.enteredBy===oppId && !cb(m).includes(meId) && !isConfirmed(m));
  const mine  = cands.filter(m=> m.enteredBy===meId || cb(m).includes(meId));
  const conflict = same.filter(m=>!sameResult(m) && m.enteredBy===oppId && !isConfirmed(m));
  return {byOpp, mineCount:mine.length, conflict:conflict[0]||null};
}

async function doLogin(){
  const id=$('#lname').value, pin=($('#lpin').value||'').trim();
  const p=P(id); if(!p) return;
  if(!p.pinHash){                                  // 관리자가 만들어 둔 계정 넘겨받기
    if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
    const hash=await sha(pin);
    const ok=await savePlayers(map=>{const x=map.get(id); if(x)x.pinHash=hash;});
    if(!ok) return toast('설정에 실패했습니다. 다시 시도해주세요.',1);
    await audit('PIN 설정', p.name);
  } else if(p.pinHash!==await sha(pin)) return toast('PIN이 맞지 않습니다.',1);
  S.me=P(id); await sSet(KEY.session,{playerId:id},false); S.tab='rank'; render(); toast(`${S.me.name}님 반갑습니다.`);
}
async function doJoin(){
  const name=($('#jname').value||'').trim();
  const pin=($('#jpin').value||'').trim();
  if(name.length<1) return toast('이름을 입력하세요.',1);
  if(S.players.some(p=>p.name===name)) return toast('이미 있는 이름입니다.',1);
  if(!/^\d{4}$/.test(pin)) return toast('PIN은 숫자 4자리입니다.',1);
  const p={ id:uid('p'), name, bu:+$('#jbu').value, hand:$('#jhand').value,
            bio:($('#jbio').value||'').trim(), pinHash:await sha(pin),
            role:S.players.length===0?'admin':'member', active:true, joinedAt:new Date().toISOString() };
  const ok=await savePlayers(map=>map.set(p.id,p));
  if(!ok) return toast('등록에 실패했습니다. 다시 시도해주세요.',1);
  S.me=P(p.id); await sSet(KEY.session,{playerId:p.id},false);
  await audit('선수 등록', name); S.tab='rank'; render(); toast('등록되었습니다.');
}

/* ── 경기 입력 ── */
/* 회원은 어제까지만 입력할 수 있다. 며칠 지난 기억으로 넣으면 서로 안 맞는 경우가 많아서다.
   관리자는 제한 없이 소급 입력할 수 있고, 이미 들어간 경기는 '날짜 수정'으로 언제든 옮긴다. */
const minEntryDate = ()=> isAdmin() ? '' : dayAgo(1);
const dateOK = d => !!d && d<=today() && (isAdmin() || d>=dayAgo(1));
const shiftDate = (d,n)=>{ const [y,m,dd]=d.split('-').map(Number);
  const x=new Date(y,m-1,dd+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dateLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  const wk=['일','월','화','수','목','금','토'][new Date(y,m-1,dd).getDay()];
  const rel = d===today()?' · 오늘' : d===dayAgo(1)?' · 어제' : '';
  return `${m}월 ${dd}일 (${wk})${rel}`;
}
/* 화살표로도 바꾸고 달력으로도 고를 수 있게 둘 다 둔다 — 기기에 따라 달력이 안 열리는 경우가 있어서다 */
function dateField(id, val){
  /* 달력 입력창은 숨겨두고 화살표로 조작한다. 가운데 날짜를 누르면 달력이 뜨는 기기에서는 달력도 열린다. */
  return `<div class="field" style="position:relative">
    <div class="daterow">
      <button data-ds="-1" ${dateOK(shiftDate(val,-1))?'':'disabled'}>‹</button>
      <button class="dlab" data-dpick>${dateLabel(val)}</button>
      <button data-ds="1" ${dateOK(shiftDate(val,1))?'':'disabled'}>›</button>
    </div>
    <input type="date" id="${id}" value="${val}" max="${today()}" min="${minEntryDate()}"
           style="position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;padding:0;border:none">
    <p class="tiny dim" style="margin:7px 2px 0">${isAdmin()?'관리자는 지난 날짜도 넣을 수 있습니다.':'오늘과 어제까지 입력할 수 있습니다. 더 지난 경기는 관리자에게 요청하세요.'}</p>
  </div>`;
}
function bindDateField(id, get, apply){
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
    const nd=shiftDate(get(), +b.dataset.ds);
    if(dateOK(nd)) apply(nd);
  });
  const el=$('#'+id); if(!el) return;
  const pick=document.querySelector('[data-dpick]');
  if(pick) pick.onclick=()=>{ try{ el.showPicker ? el.showPicker() : el.focus(); }catch(e){} };
  el.onchange=e=>{ const v=e.target.value;
    if(!v){ e.target.value=get(); return; }
    if(!dateOK(v)){ e.target.value=get(); return toast('입력할 수 없는 날짜입니다.',1); }
    apply(v);
  };
}

function viewAddQuick(){
  const roster = S.players.filter(p=>p.active!==false);
  if(!bulk) bulk = { date:today(), meId:S.me.id, picks:{} };
  if(!dateOK(bulk.date)) bulk.date = today();          // 하루 넘겨 열어둔 화면 보정
  if(!isAdmin()) bulk.meId = S.me.id;
  if(!P(bulk.meId)) bulk.meId = S.me.id;
  const opp = roster.filter(p=>p.id!==bulk.meId);
  const picks = bulk.picks;
  const wN = Object.values(picks).filter(x=>x.r==='W').reduce((a,x)=>a+x.n,0);
  const lN = Object.values(picks).filter(x=>x.r==='L').reduce((a,x)=>a+x.n,0);

  $('#view').innerHTML = `
    <h2>경기 입력</h2>
    ${addSeg()}
    ${opp.length<1?`<div class="empty">상대할 선수가 아직 없습니다.</div>`:`
    <div class="card">
      ${dateField('bdate', bulk.date)}
      ${isAdmin()?`<div class="field"><label>기준 선수</label><select id="bme">
        ${roster.map(p=>`<option value="${p.id}" ${p.id===bulk.meId?'selected':''}>${esc(p.name)} · ${p.bu}부</option>`).join('')}
      </select></div>`:''}
      <div class="field" style="margin-bottom:6px"><label>상대를 눌러 결과 표시 — 한 번 승, 두 번 패, 세 번 해제</label>
        <div class="picks">
          ${opp.map(p=>{ const k=picks[p.id];
            return `<div class="pk ${k?(k.r==='W'?'w':'l'):''}">
              <button class="nm" data-pick="${p.id}">${esc(p.name)}<small>${p.bu}부</small></button>
              ${k?`<button class="ct" data-cnt="${p.id}">${k.r==='W'?'승':'패'}${k.n>1?' ×'+k.n:''}</button>`:''}
            </div>`;}).join('')}
        </div>
      </div>
      <div class="tally"><span><b>${wN}</b>승</span><span><b>${lN}</b>패</span>
        <span style="margin-left:auto">${wN+lN?`총 ${wN+lN}경기`:'아직 선택 없음'}</span></div>
      <hr class="sep">
      <button class="btn" id="bSave" ${wN+lN?'':'disabled'}>${wN+lN?`${wN+lN}경기 한 번에 등록`:'상대를 선택하세요'}</button>
      <p class="tiny dim" style="margin:9px 2px 0">핸디는 부수 차이로 자동 계산됩니다. 이미 등록됐거나 상대가 먼저 넣은 경기는 알아서 건너뛰거나 합칩니다.
      ${isAdmin()?'':'세부 조정이 필요하면 위에서 한 경기씩으로 바꾸세요.'}</p>
    </div>
    <h2>${bulk.date===today()?'오늘':bulk.date===dayAgo(1)?'어제':fmtDate(bulk.date)} 등록된 경기</h2>
    ${matchListHTML(S.matches.filter(m=>m.date===bulk.date&&!m.void))}`}`;

  bindAddSeg();
  if(opp.length){
    bindDateField('bdate', ()=>bulk.date, v=>{ bulk.date=v; viewAddQuick(); });
    if($('#bme')) $('#bme').onchange=e=>{ bulk.meId=e.target.value; bulk.picks={}; viewAddQuick(); };
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.pick, cur=picks[id];
      if(!cur) picks[id]={r:'W',n:1};
      else if(cur.r==='W') picks[id]={r:'L',n:cur.n};
      else delete picks[id];
      viewAddQuick();
    });
    document.querySelectorAll('[data-cnt]').forEach(b=>b.onclick=()=>{
      const k=picks[b.dataset.cnt]; if(!k) return;
      k.n = k.n>=5 ? 1 : k.n+1; viewAddQuick();
    });
    $('#bSave').onclick=submitBulk;
  }
  bindMatchActions();
}

async function submitBulk(){
  if(S.busy) return;
  const live=$('#bdate'); if(live&&live.value) bulk.date=live.value;
  const date=bulk.date, meId=bulk.meId;
  if(!dateOK(date)) return toast(date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);
  const entries=Object.entries(bulk.picks);
  if(!entries.length) return;
  const iAmIn = meId===S.me.id;

  S.busy=true;
  let created=0, merged=0, skipped=0, failed=0;
  const detail=[];
  for(const [oppId,k] of entries){
    const iWon = k.r==='W';
    const scan0 = dupScan(date, meId, oppId, iWon);
    let remaining = Math.max(0, k.n - scan0.mineCount);
    const skip = k.n - remaining;
    if(skip){ skipped+=skip; detail.push(`${nameOf(oppId)} ${skip}건 건너뜀(이미 등록)`); }

    while(remaining>0){                              // 상대가 먼저 넣어둔 건 흡수
      const sc = dupScan(date, meId, oppId, iWon);
      if(!sc.byOpp) break;
      const upd={...sc.byOpp, confirmedBy:[...new Set([...(sc.byOpp.confirmedBy||[]), meId, ...(iAmIn?[]:[oppId])])],
                 status:'confirmed', rev:(sc.byOpp.rev||0)+1};
      if(await commitMatch(upd)){ merged++; remaining--; detail.push(`${nameOf(oppId)} 상대 입력분과 합침`); }
      else { failed++; break; }
    }

    const a=P(meId), b=P(oppId);
    const hTo = a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';
    const hPts = hTo ? Math.abs(a.bu-b.bu)*st().ptsPerBu : 0;
    for(let i=0;i<remaining;i++){
      const m={ id:uid('m'), rev:1, date, aId:meId, bId:oppId, winnerId: iWon?meId:oppId,
                handi: hTo?{toId:hTo, pts:hPts}:null, note:'',
                enteredBy:S.me.id, enteredAt:new Date(Date.now()+i).toISOString(),
                confirmedBy: iAmIn?[S.me.id]:[meId,oppId], status: iAmIn?'single':'confirmed', void:false };
      if(await commitMatch(m)) created++; else failed++;
    }
  }
  S.busy=false;

  await audit('빠른 입력', `${nameOf(meId)} · ${date} · 등록 ${created} / 합침 ${merged} / 건너뜀 ${skipped}`);
  bulk={ date, meId, picks:{} };
  render();
  const parts=[`${created}건 등록`];
  if(merged) parts.push(`${merged}건 상대 입력과 합침`);
  if(skipped) parts.push(`${skipped}건 건너뜀`);
  if(failed) parts.push(`${failed}건 실패`);
  toast(parts.join(' · '), failed?1:0);
}

async function submitMatch(force){
  if(S.busy) return; 
  const d={...draft};
  const live=$('#fdate'); if(live&&live.value) d.date=draft.date=live.value;   // 달력에서 고르고 바로 등록해도 반영되게
  if(!d.bId||d.aId===d.bId) return toast('상대를 선택하세요.',1);

  if(!isAdmin() && d.aId!==S.me.id && d.bId!==S.me.id) return toast('본인 경기만 입력할 수 있습니다.',1);
  if(!dateOK(d.date)) return toast(d.date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);

  const meId = isAdmin()? d.aId : S.me.id;
  const oppId = meId===d.aId ? d.bId : d.aId;
  const winnerId = d.aWon ? d.aId : d.bId;
  const iWon = winnerId===meId;
  /* 관리자가 남의 경기를 대신 넣으면 양쪽 확인으로 간주한다 */
  const iAmIn = d.aId===S.me.id || d.bId===S.me.id;
  const confirmIds = iAmIn ? [S.me.id] : [d.aId, d.bId];

  if(force!==true){
    const {byOpp, mineCount, conflict} = dupScan(d.date, meId, oppId, iWon);
    if(byOpp){                                   // 상대가 먼저 넣은 동일 경기 → 확인 처리
      S.busy=true;
      const upd={...byOpp, confirmedBy:[...new Set([...(byOpp.confirmedBy||[]), ...confirmIds])], status:'confirmed', rev:(byOpp.rev||0)+1};
      const ok=await commitMatch(upd); S.busy=false;
      if(!ok) return toast('저장 충돌이 있었습니다. 다시 시도해주세요.',1);
      await audit('중복 병합', `${nameOf(meId)} vs ${nameOf(oppId)} ${d.date}`);
      draft=null; render(); return toast('상대가 이미 입력한 경기라 하나로 합치고 상호 확인 처리했습니다.');
    }
    if(conflict){                                 // 같은 날 같은 상대인데 승패가 반대
      return confirmSheet('승패가 서로 다릅니다',
        `${esc(nameOf(oppId))}님은 같은 날 <b>본인이 ${winnerOf(conflict)===oppId?'이겼다':'졌다'}</b>고 입력했습니다.<br>지금 입력하려는 건 <b>내가 ${iWon?'이김':'짐'}</b>입니다.<br><br>다른 경기였다면 그대로 등록하고, 같은 경기인데 한쪽이 잘못 넣은 거라면 취소 후 상대와 맞춰주세요.`,
        '다른 경기입니다 · 등록', ()=>submitMatch(true));
    }
    if(mineCount>0){                              // 내가 이미 같은 결과를 넣음
      return confirmSheet('같은 결과가 이미 있습니다',
        `오늘 ${esc(nameOf(oppId))}님에게 <b>${iWon?'이긴':'진'}</b> 경기가 이미 ${mineCount}건 등록되어 있습니다.<br>같은 결과로 한 판 더 친 경우라면 등록하세요.`,
        '한 판 더 · 등록', ()=>submitMatch(true));
    }
  }

  const handiTo = draft.handiTo==='auto'
    ? (()=>{const a=P(d.aId),b=P(d.bId); return a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';})() : draft.handiTo;
  const handiPts = handiTo ? (draft.handiPts ?? Math.abs(P(d.aId).bu-P(d.bId).bu)*st().ptsPerBu) : 0;

  const m={ id:uid('m'), rev:1, date:d.date, aId:d.aId, bId:d.bId, winnerId,
            handi: handiTo? {toId:handiTo, pts:handiPts} : null,
            note:(d.note||'').trim(),
            enteredBy:S.me.id, enteredAt:new Date().toISOString(),
            confirmedBy:confirmIds, status:iAmIn?'single':'confirmed', void:false };
  S.busy=true; const ok=await commitMatch(m); S.busy=false;
  if(!ok) return toast('저장에 실패했습니다. 잠시 후 다시 시도해주세요.',1);
  await audit('경기 등록', `${nameOf(winnerId)} 승 vs ${nameOf(winnerId===m.aId?m.bId:m.aId)} (${m.date})`);
  const saved=S.matches.find(x=>x.id===m.id)||m;
  const ds=Math.round(saved.aId===S.me.id?(saved._sA||0): saved.bId===S.me.id?(saved._sB||0):0);
  const df=Math.round(saved.aId===S.me.id?(saved._fA||0): saved.bId===S.me.id?(saved._fB||0):0);
  draft={...draft, note:''};
  render(); toast((ds||df)? `등록 완료 · ${MODES.skill.label} ${ds>0?'+':''}${ds} · ${MODES.form.label} ${df>0?'+':''}${df}` : '등록 완료');
}

/* ── 기록 ── */
function matchCardHTML(m){
  const win=winnerOf(m), lose=loserOf(m);
  const mine=isMine(m), done=isConfirmed(m);
  const canDel = !!S.me && (isAdmin() || (m.enteredBy===S.me.id && !done));
  const canOk  = !!S.me && mine && !done && !(m.confirmedBy||[]).includes(S.me.id);
  const legacy = (m.enteredAt||'') < (st().legacyBefore||'');
  const proxy  = m.enteredBy!==m.aId && m.enteredBy!==m.bId;
  const byLabel = (legacy||proxy) ? '관리자 입력' : esc(nameOf(m.enteredBy))+' 입력';

  const dW = Math.round(Math.abs(win===m.aId ? (m._sA||0) : (m._sB||0)));
  const dL = Math.round(Math.abs(win===m.aId ? (m._sB||0) : (m._sA||0)));
  const peakW = win===m.aId ? m._peakA : m._peakB;

  let meta='';
  if(m._expA!=null){
    const favId = m._expA>=0.5 ? m.aId : m.bId;
    const favP  = Math.min(99, Math.round(Math.max(m._expA,1-m._expA)*100));
    const up    = win!==favId && favP>=58;
    meta += up ? `<span class="ups">이변</span>` : '';
    meta += `<span class="${favP>=70?'hot':''}">예상 ${esc(nameOf(favId))} ${favP}%</span>`;
  }
  if(m.handi&&m.handi.pts) meta += `<span>핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}</span>`;
  if(peakW) meta += `<span class="peak">최고 기록 경신</span>`;
  if(!done) meta += `<span class="hot">단독 입력</span>`;

  return `<div class="mt ${mine?'mine':''}">
    <button class="mrow" data-exp="${m.id}">
      <div class="side"><span class="rs w">승</span><span class="pn">${esc(nameOf(win))}</span>
        <span class="dl up">+${dW}</span></div>
      <div class="side"><span class="rs l">패</span><span class="pn dim">${esc(nameOf(lose))}</span>
        <span class="dl down">−${dL}</span></div>
      ${meta?`<div class="mmeta">${meta}</div>`:''}
    </button>
    <div class="macts" id="act_${m.id}" style="display:none">
      <div class="info">${m.date} · ${done?'상호 확인':'단독 입력 — 상대가 확인하면 확정됩니다'} · ${byLabel}${m.note?' · '+esc(m.note):''}</div>
      ${canDel?`<button class="btn ghost sm" data-date="${m.id}">날짜 수정</button>
                <button class="btn ghost sm" data-void="${m.id}">삭제</button>`:''}
      ${canOk?`<button class="btn ghost sm" data-ok="${m.id}">이 경기 확인</button>`:''}
      ${(!canDel&&!canOk)?'<span class="tiny dim">수정 권한이 없습니다.</span>':''}
    </div>
  </div>`;
}
function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  const sorted=list.slice().sort((a,b)=>(b.date+b.enteredAt).localeCompare(a.date+a.enteredAt));
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
function bindMatchActions(){
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('act_'+b.dataset.exp); if(!el) return;
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>dateSheet(b.dataset.date));
  document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{
    const m=S.matches.find(x=>x.id===b.dataset.void); if(!m) return;
    confirmSheet('경기를 삭제할까요?', `${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))} · ${m.date}<br>기록은 보관되고 랭킹에서만 제외됩니다.`, '삭제', async()=>{
      if(S.busy) return; S.busy=true;
      const ok=await voidMatchById(m.id); S.busy=false;
      if(ok){ await audit('경기 삭제', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`);
              render(); toast('삭제했습니다.'); }
      else toast('삭제하지 못했습니다. 다시 시도해주세요.',1);
    });
  });
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.ok);
    const ok=await commitMatch({...m, confirmedBy:[...new Set([...(m.confirmedBy||[]),S.me.id])], status:'confirmed', rev:(m.rev||0)+1});
    if(ok){ await audit('경기 확인', m.id); render(); toast('상호 확인되었습니다.'); }
  });
}
/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>m._expA!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = w===m.aId ? m._expA : 1-m._expA;
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=0.42) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">${esc(nameOf(loserOf(ups)))} 상대 · 예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function viewLog(){
  let f=viewLog.filter||'all';
  if(!S.me && f!=='all' && f!=='upset') f=viewLog.filter='all';
  const month=viewLog.month || (viewLog.day ? viewLog.day.slice(0,7) : today().slice(0,7));
  viewLog.month=month;
  const live=S.matches.filter(m=>!m.void);
  const byDay={}; live.forEach(m=>{(byDay[m.date]=byDay[m.date]||[]).push(m);});

  const [Y,Mo]=month.split('-').map(Number);
  const dim=new Date(Y,Mo,0).getDate(), off=new Date(Y,Mo-1,1).getDay();
  const cells=[];
  for(let i=0;i<off;i++) cells.push('<button class="day blank" disabled></button>');
  for(let d=1;d<=dim;d++){
    const ds=`${month}-${String(d).padStart(2,'0')}`;
    const list=byDay[ds]||[];
    const mineN=S.me?list.filter(isMine).length:0;
    const pips=[]; const cap=Math.min(list.length,4);
    for(let i=0;i<cap;i++) pips.push(`<span class="pip ${i<mineN?'mine':''}"></span>`);
    cells.push(`<button class="day ${list.length?'has':''} ${ds===today()?'today':''} ${ds===viewLog.day?'sel':''}" data-day="${ds}">
      <span>${d}</span>
      <span class="pips">${pips.join('')}</span>
      ${list.length>4?`<span class="more">+${list.length-4}</span>`:''}</button>`);
  }
  const monthList = live.filter(m=>m.date.slice(0,7)===month);
  const scope = viewLog.day ? (byDay[viewLog.day]||[]) : monthList;
  let list = scope;
  if(f==='mine') list=list.filter(isMine);
  if(f==='upset') list=list.filter(m=>{
    if(m._expA==null) return false;
    const favId=m._expA>=0.5?m.aId:m.bId, favP=Math.max(m._expA,1-m._expA);
    return winnerOf(m)!==favId && favP>=0.58;
  });
  if(f==='pending') list=list.filter(m=>!isConfirmed(m));

  $('#view').innerHTML=`
    <h2>경기 기록</h2>
    <div class="cal">
      <div class="hd">
        <button class="nav" data-mv="-1">‹</button>
        <b>${Y}년 ${Mo}월</b>
        <button class="nav" data-mv="1">›</button>
      </div>
      <div class="grid">${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${i===0?'sun':''}">${d}</div>`).join('')}</div>
      <div class="grid">${cells.join('')}</div>
      <div class="split tiny dim" style="margin-top:10px">
        <span>${viewLog.day ? `${+viewLog.day.slice(8)}일 · 경기 ${(byDay[viewLog.day]||[]).length}건` : `이 달 경기 ${monthList.length}건`}</span>
        ${viewLog.day?`<button class="btn ghost sm" id="clrDay">이 달 전체 보기</button>`
                     :`<button class="btn ghost sm" id="goToday">오늘로</button>`}
      </div>
    </div>
    <div class="seg" style="margin-bottom:12px">
      <button data-f="all" class="${f==='all'?'on':''}">전체 ${scope.length}</button>
      <button data-f="upset" class="${f==='upset'?'on':''}">이변</button>
      ${S.me?`<button data-f="mine" class="${f==='mine'?'on':''}">내 경기</button>
      <button data-f="pending" class="${f==='pending'?'on':''}">확인 대기</button>`:''}
    </div>
    ${highlightHTML(scope)}
    ${list.length?matchListHTML(list,{group:!viewLog.day})
      :`<div class="empty">${viewLog.day?'이 날은 등록된 경기가 없습니다.':'이 달은 등록된 경기가 없습니다.'}</div>`}`;

  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    viewLog.month=shiftMonth(month,+b.dataset.mv); viewLog.day=null; viewLog(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    viewLog.day = viewLog.day===b.dataset.day ? null : b.dataset.day; viewLog(); });
  const clr=$('#clrDay'); if(clr) clr.onclick=()=>{ viewLog.day=null; viewLog(); };
  const gt=$('#goToday'); if(gt) gt.onclick=()=>{ viewLog.month=today().slice(0,7); viewLog.day=today(); viewLog(); };
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{viewLog.filter=b.dataset.f;viewLog();});
  bindMatchActions();
}

function sparkline(id,mode){
  const h=(trk(mode).H[id]||[]).map(x=>x.r); if(h.length<2) return '';
  const w=300,ht=64,lo=Math.min(...h),hi=Math.max(...h),sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${d} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>
    <div class="split tiny dim"><span>${Math.round(lo)}</span><span>${h.length-1}경기</span><span>${Math.round(hi)}</span></div>`;
}

function entryDiagHTML(){
  const {cnt, exp, act} = entryAccuracy();
  if(cnt<40) return `<p class="tiny dim" style="margin:0 2px 12px">새 회원 첫 10경기 표본이 ${cnt}건입니다. 40건은 넘어야 시작 레이팅이 맞는지 판단할 만합니다.</p>`;
  const diff = act-exp, per100 = diff/cnt*100;
  const verdict = per100 <= -6 ? '새 회원의 시작 레이팅이 후한 편입니다. 부수를 실제보다 높게 잡고 있거나 부수당 레이팅이 큽니다. 이대로면 기존 회원 점수가 조금씩 올라갑니다.'
                : per100 >= 6 ? '새 회원의 시작 레이팅이 박한 편입니다. 새로 들어온 분들이 예상보다 잘 치고 있습니다.'
                : '새 회원의 시작 레이팅이 실제와 잘 맞습니다.';
  return `<div class="notice ${Math.abs(per100)>=6?'warn':''}" style="margin:0 0 12px">
    새 회원 첫 10경기 ${cnt}건 · 기대 ${exp.toFixed(1)}승 vs 실제 ${act}승 (100경기당 ${diff>0?'+':''}${per100.toFixed(1)})<br>${verdict}</div>`;
}
function handiDiagHTML(){
  const {n,rate}=handiStat();
  if(!n) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기가 쌓이면 클럽 핸디가 실제로 공정한지 여기서 알려드립니다.</p>`;
  if(n<10) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기 ${n}건 · 핸디 받은 쪽 승률 ${rate}%. 10건은 넘어야 판단할 만합니다.</p>`;
  const verdict = rate>=58 ? '핸디가 후한 편입니다. 부수 차 1당 핸디 점수를 줄여보세요.'
                : rate<=42 ? '핸디가 박한 편입니다. 부수 차 1당 핸디 점수를 늘려보세요.'
                : '클럽 핸디가 공정하게 잡혀 있습니다. 지금 값을 유지하세요.';
  return `<div class="notice ${(rate>=58||rate<=42)?'warn':''}" style="margin:0 0 12px">
    핸디 경기 ${n}건 · 핸디 받은 쪽 승률 <b>${rate}%</b><br>${verdict}</div>`;
}
/* 입력자 일괄 변경 — 처음에 한 계정으로 몰아 넣은 기록을 실제 입력자에게 넘길 때 쓴다.

async function reassignSheet(){
  const mCount={};
  S.matches.filter(m=>!m.void).forEach(m=>{ mCount[m.enteredBy]=(mCount[m.enteredBy]||0)+1; });

  const ids=[...new Set([...S.players.map(p=>p.id), ...Object.keys(mCount)])];
  const rows=ids.map(id=>({id, name:nameOf(id), m:mCount[id]||0, a:aCount[nameOf(id)]||0}))
                .filter(r=>r.m||r.a||P(r.id))
                .sort((x,y)=>(y.m+y.a)-(x.m+x.a));
  if(!rows.some(r=>r.m||r.a)) return toast('바꿀 기록이 없습니다.');
  const roster=S.players.filter(p=>p.active!==false);

  const sh=sheet('입력자 일괄 변경', `

    <div class="field" style="margin-top:12px"><label>지금 입력자로 되어 있는 사람</label>
      <select id="raFrom">${rows.map(r=>`<option value="${r.id}">${esc(r.name)} · 경기 ${r.m}건 · 이력 ${r.a}건</option>`).join('')}</select></div>
    <div class="field"><label>이 사람이 넣은 것으로 바꾸기</label>
      <select id="raTo">${roster.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.bu}부</option>`).join('')}</select></div>
    <div class="field"><label style="display:flex;gap:8px;align-items:center">
      <input type="checkbox" id="raShow" ${st().legacyBefore>new Date().toISOString()?'':'checked'} style="width:auto"> 바꾼 뒤 실제 입력자 이름이 보이게 하기</label>
      <p class="tiny dim" style="margin:5px 2px 0">임시 운영 기간에는 예전 기록이 전부 '관리자 입력'으로 표시됩니다. 이걸 켜면 임시 기간을 끝내고 바뀐 이름이 그대로 보입니다.</p></div>
    <button class="btn" id="raGo">변경</button>`);

  sh.querySelector('#raGo').onclick=async()=>{
    const from=sh.querySelector('#raFrom').value, to=sh.querySelector('#raTo').value;

    if(from===to){ sh.remove(); return toast('같은 사람입니다.',1); }

    const fromName=nameOf(from), toName=nameOf(to);
    sh.remove();
    confirmSheet('입력자를 바꿀까요?',
      `${esc(fromName)} → ${esc(toName)}<br>경기 <b>${r.m}건</b> · 변경 이력 <b>${r.a}건</b>을 바꿉니다.${show?'<br>바꾼 뒤 실제 입력자 이름이 표시됩니다.':''}`,
      '변경', async()=>{
        if(S.busy) return; S.busy=true;
        const movedM = await reassignEntrant(from, to);
        const movedA = await reassignAudit(fromName, toName);
        if(show){ S.meta={...S.meta, settings:{...st(), legacyBefore:new Date().toISOString()}};
                  await sSet(KEY.meta, S.meta); }
        S.busy=false;
        await audit('입력자 일괄 변경', `${fromName} → ${toName} (경기 ${movedM} · 이력 ${movedA})`);
        await loadAll(); render();
        toast(`경기 ${movedM}건 · 이력 ${movedA}건을 ${toName}님으로 바꿨습니다.`);
      });
  };
}
async function reassignEntrant(fromId, toId){
  let n=0;
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

              meta:S.meta, players:S.players, matches:S.matches};
  const txt=JSON.stringify(data);
  const sh=sheet('백업 내보내기', `
    <p class="tiny dim">선수 ${S.players.length}명 · 경기 ${S.matches.length}건 (삭제분 포함).
    아래 내용을 통째로 복사해 두면 다른 주소에서 '복원하기'로 그대로 옮길 수 있습니다.</p>
    <textarea id="exTxt" readonly style="height:150px;margin-top:10px;font-family:var(--mono);font-size:11px;line-height:1.4"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="exCopy">전체 복사</button>
      <button class="btn ghost" id="exFile">파일로 저장</button>
    </div>
    <p class="tiny dim" style="margin-top:9px">미리보기 화면에서는 파일 저장이 막혀 있을 수 있습니다. 그럴 때는 복사를 쓰세요.</p>`);
  const ta=sh.querySelector('#exTxt'); ta.value=txt;
  sh.querySelector('#exCopy').onclick=async()=>{
    ta.focus(); ta.select(); try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    let ok=false;
    try{ await navigator.clipboard.writeText(ta.value); ok=true; }catch(e){}
    if(!ok){ try{ ok=document.execCommand('copy'); }catch(e){} }
    toast(ok?'복사했습니다. 메모장 등에 붙여넣어 보관하세요.':'복사가 막혀 있습니다. 위 칸을 길게 눌러 직접 선택해주세요.', ok?0:1);
  };
  sh.querySelector('#exFile').onclick=()=>{
    try{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`모닝탁구랭킹-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast('저장 창이 안 뜨면 위 복사를 이용해주세요.');
    }catch(e){ toast('파일 저장이 막혀 있습니다. 복사를 이용해주세요.',1); }
  };
}
function importSheet(){
  const sh=sheet('백업 복원하기', `
    <p class="tiny dim">내보내기로 복사한 내용을 붙여넣거나, 저장해 둔 파일을 고르세요. 현재 데이터는 덮어써집니다.</p>
    <textarea id="imTxt" placeholder="여기에 붙여넣기" style="height:120px;margin-top:10px;font-family:var(--mono);font-size:11px"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="imGo">붙여넣은 내용으로 복원</button>
      <button class="btn ghost" id="imFile">파일 고르기</button>
    </div>`);
  const run=raw=>{
    let j; try{ j=JSON.parse(raw); }catch(e){ return toast('읽을 수 없는 내용입니다.',1); }
    if(!j||!j.players||!j.matches) return toast('백업 형식이 아닙니다.',1);
    sh.remove();
    confirmSheet('백업을 복원할까요?', `선수 ${j.players.length}명 · 경기 ${j.matches.length}건으로 현재 데이터를 덮어씁니다.`,
      '복원', ()=>applyBackup(j));
  };
  sh.querySelector('#imGo').onclick=()=>run((sh.querySelector('#imTxt').value||'').trim());
  sh.querySelector('#imFile').onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; run(await f.text()); };
    inp.click();
  };
}
async function applyBackup(j){
  await sSet(KEY.players, j.players);
  if(j.meta) await sSet(KEY.meta, j.meta);
  const byMonth={}; j.matches.forEach(m=>{(byMonth[monthOf(m.date)] ||= []).push(m);});
  for(const [mo,list] of Object.entries(byMonth)) await sSet(KEY.shard(mo), list);
  await loadAll();
  S.me = (S.me && P(S.me.id)) || null;
  await audit('백업 복원', `선수 ${j.players.length} · 경기 ${j.matches.length}`);
  render(); toast('복원했습니다.');
}
/* 선수 관리 시트 — 비활성 / 완전 삭제 */
function playerAdminSheet(id){
  const p=P(id); if(!p) return;
  const n=S.matches.filter(m=>!m.void&&(m.aId===id||m.bId===id)).length;
  const onlyAdmin = p.role==='admin' && S.players.filter(x=>x.role==='admin').length<2;
  const m=sheet(p.name+' 관리', `
    <p class="tiny dim">${p.bu}부 · 경기 ${n}건 · ${p.role==='admin'?'관리자':'회원'} · ${p.active===false?'비활성':'활성'}</p>
    <hr class="sep">
    <button class="btn ghost" id="pmAct">${p.active===false?'다시 활성화':'비활성으로 돌리기'}</button>
    <p class="tiny dim" style="margin:8px 2px 0">비활성은 기록을 그대로 두고 랭킹에서만 뺍니다. 잠깐 안 나오는 사람은 이쪽이 맞습니다.</p>
    <hr class="sep">
    <label>완전 삭제</label>
    <p class="tiny dim" style="margin:0 0 9px">선수 정보를 지우고 관련 경기 ${n}건을 랭킹에서 제외합니다.
    ${n?'상대했던 사람들의 레이팅도 그 경기를 뺀 값으로 다시 계산됩니다. ':''}되돌리려면 백업 파일이 필요합니다.</p>
    ${onlyAdmin?`<div class="notice warn">관리자가 이 사람뿐입니다. 다른 사람을 관리자로 올린 뒤에 삭제할 수 있습니다.</div>`:`
    <input id="pmName" placeholder="확인용으로 이름을 그대로 입력하세요">
    <button class="btn danger" id="pmDel" style="margin-top:9px">완전 삭제</button>`}
  `);
  m.querySelector('#pmAct').onclick=async()=>{
    m.remove();
    await savePlayers(map=>{const x=map.get(id); if(x)x.active=x.active===false;});
    await audit('활성 상태 변경',p.name); render(); toast('바꿨습니다.');
  };
  const del=m.querySelector('#pmDel');
  if(del) del.onclick=async()=>{
    if((m.querySelector('#pmName').value||'').trim()!==p.name) return toast('이름이 일치하지 않습니다.',1);
    m.remove();
    S.busy=true;
    const removed=await voidMatchesOf(id);
    const ok=await savePlayers(map=>{map.delete(id);});
    S.busy=false;
    if(!ok) return toast('삭제에 실패했습니다. 다시 시도해주세요.',1);
    await audit('선수 삭제', `${p.name} (경기 ${removed}건 제외)`);
    await loadAll();
    if(S.me&&S.me.id===id){ await sDel(KEY.session,false); S.me=null; }
    render(); toast(`${p.name}님을 삭제했습니다.`);
  };
}
/* 저장 단위가 월별이든 연도별이든 상관없이 전체를 훑어 처리 */
async function voidMatchesOf(id){
  const keys=await sList('tt:matches:'); let n=0;
  for(const k of keys){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(mm=>{
      if(!mm.void && (mm.aId===id||mm.bId===id)){ touched=true; n++;
        return {...mm, void:true, voidBy:S.me?S.me.id:null, voidReason:'player-deleted', rev:(mm.rev||0)+1}; }
      return mm;
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
function findDuplicates(){
  const out=[], live=S.matches.filter(m=>!m.void);
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    if(a.date!==b.date) continue;
    const samePair=(a.aId===b.aId&&a.bId===b.bId)||(a.aId===b.bId&&a.bId===b.aId);
    if(!samePair) continue;
    if(winnerOf(a)!==winnerOf(b)) continue;
    if(a.enteredBy===b.enteredBy) continue;
    if(isConfirmed(a)&&isConfirmed(b)) continue;
    out.push({a,b});
  }
  return out;
}

/* ── 시트 / 확인 ── */
function sheet(title, html, footer){
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="sheet"><h3>${esc(title)}</h3>${html}${footer||''}</div>`;
  mask.onclick=e=>{ if(e.target===mask) mask.remove(); };
  document.body.appendChild(mask); return mask;
}
function confirmSheet(title, html, okLabel, fn){
  const m=sheet(title,`<p class="tiny" style="line-height:1.7;color:var(--mut)">${html}</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" data-no>취소</button><button class="btn" data-yes>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-no]').onclick=()=>m.remove();
  m.querySelector('[data-yes]').onclick=async()=>{ m.remove(); await fn(); };
}

/* ─────────────────────────── 부팅 ─────────────────────────── */
try{ document.title='모닝탁구 랭킹'; }catch(e){}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
/* 다른 사람이 경기를 넣으면 알아서 새로고침 — 입력 중일 때는 건드리지 않는다 */
function watchRemote(){
  if(!FB) return;
  let t=null, first=true;
  FB.watch(()=>{
    if(first){ first=false; return; }
    clearTimeout(t);
    t=setTimeout(async()=>{
      if(S.busy) return;
      const a=document.activeElement;
      if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;   // 입력 중이면 다음 기회에
      if(document.querySelector('.mask')) return;                     // 확인창 떠 있으면 대기
      await loadAll();
      if(S.me){ const me=P(S.me.id); if(me) S.me=me; }
      render();
    }, 500);
  });
}
(async()=>{
  render();
  await defPin();
  FB = await initFirebase();
  await loadAll();
  const ses=await sGet(KEY.session,false);
  if(ses&&ses.playerId){ const p=P(ses.playerId); if(p&&p.active!==false) S.me=p; }
  S.ready=true; render();
  watchRemote();
})();
</script>
