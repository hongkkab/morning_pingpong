/* 마감된 시즌만 통산 기록에 넣는다. 진행 중인 시즌은 순위가 아직 확정이 아니다. */
const closedSeasons = ()=> seasons().filter(ym=>ym < monthOfNow());
function careerRank(id, mode){
  const yms=closedSeasons();
  const MIN=st().provisional||0;
  const rs=[];
  for(const ym of yms){
    const all=standings(ym,mode).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    if(i>=0) rs.push(i+1);
  }
  if(!rs.length) return {n:0};
  return {n:rs.length, best:Math.min(...rs),
          avg:rs.reduce((a,b)=>a+b,0)/rs.length,
          wins:rs.filter(x=>x===1).length};
}
/* 통산 순위 기록 */
function rankStats(id, mode){
  const dates=playDates(); if(!dates.length) return null;
  const first=(S._sorted||[]).find(m=>m.aId===id||m.bId===id);
  if(!first) return null;
  const rs=[];
  for(const d of dates){
    if(d<first.date) continue;
    const map=ranksAt(d, mode);
    if(map[id]) rs.push(map[id]);
  }
  if(!rs.length) return null;
  return {best:Math.min(...rs), avg:rs.reduce((a,b)=>a+b,0)/rs.length, n:rs.length};
}
function seasonWins(id, mode){
  const yms=seasons(); let wins=0, played=0;
  for(const ym of yms){
    const rows=standings(ym, mode).filter(r=>r.g>=(st().provisional||0));
    if(!rows.length) continue;
    if(rows.some(r=>r.p.id===id)) played++;
    if(rows[0].p.id===id) wins++;
  }
  return {wins, played};
}
/* 시즌별 세부 기록 — 탁구에서 의미 있는 것들 */
function seasonStats(id, ym, mode){
  const me=P(id); if(!me) return null;
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,7)===ym && (m.aId===id||m.bId===id));
  let ups=0, hiW=0, hiL=0, loW=0, loL=0, faceSum=0, fn=0, gave=0, gaveW=0, got=0, gotW=0, best=null;
  const opps=new Set();
  for(const m of ms){
    const oid = m.aId===id ? m.bId : m.aId, o=P(oid); if(!o) continue;
    opps.add(oid);
    const won = winnerOf(m)===id;
    const e = m._expA==null ? null : (m.aId===id ? m._expA : 1-m._expA);
    if(won && e!=null && e<UPSET) ups++;
    if(o.bu < me.bu){ won?hiW++:hiL++; } else if(o.bu > me.bu){ won?loW++:loL++; }
    /* 상대 강도는 상대의 등록 부수로 본다. 엔진 내부값(_face)은 모드에 따라 덮여서 쓰면 안 된다. */
    faceSum += o.bu; fn++;
    if(won && (!best || o.bu < best.bu)) best={bu:o.bu, oid};
    if(m.handi && m.handi.pts){
      if(m.handi.toId!==id){ gave++; if(won) gaveW++; } else { got++; if(won) gotW++; }
    }
  }
  return {n:ms.length, ups, hiW, hiL, loW, loL, gave, gaveW, got, gotW, best,
          avgBu: fn?faceSum/fn:null, opps:opps.size};
}
/* 앞면 한 줄 문구 — 성적을 그대로 */
function seasonTag(id, ym, mode, rank, rec, st2){
  if(!rec.g) return '기록 없음';

/* ── 클럽 분석 ──────────────────────────────────────────────
   손으로는 못 세는 것들: 팽팽한 매치업, 물고 물리는 삼각관계, 부수 조정 후보 */
function fairHandi(aId, bId){
  const A=P(aId), B=P(bId); if(!A||!B) return null;
  const ra=rateOf(aId,'skill'), rb=rateOf(bId,'skill');
  const gap=ra-rb;                                   // A가 유리한 정도
  const cur=(A.bu!==B.bu) ? handiPtsFor(A.bu,B.bu) : 0;
  const curTo=(A.bu>B.bu)?aId:(B.bu>A.bu?bId:null);  // 지금 관행상 핸디 받는 쪽
  const he=st().handiElo||1;
  const need=Math.round(Math.abs(gap)/he);           // 5:5로 만드는 데 필요한 점수
  const needTo=gap>0?bId:aId;
  const eff=gap + (curTo? (curTo===aId? cur*he : -cur*he) : 0);
  return {gap, cur, curTo, need, needTo, exp:1/(1+Math.pow(10,-eff/400))};
}
function pairStats(aId,bId){
  let w=0,l=0,last=null;
  for(const m of (S._sorted||[])){
    if((m.aId===aId&&m.bId===bId)||(m.aId===bId&&m.bId===aId)){
      (winnerOf(m)===aId)?w++:l++; last=m.date;
    }
  }
  return {w,l,n:w+l,last};
}
/* 물고 물리는 삼각관계 — A가 B를, B가 C를, C가 A를 이기는 고리 */
function findCycles(minGames){
  const ps=roster().filter(p=>(S.G[p.id]||0)>0);
  const edge={};      // edge[a][b] = true  (a가 b에게 우세)
  const info={};
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    const a=ps[i].id, b=ps[j].id, st2=pairStats(a,b);
    if(st2.n<minGames) continue;
    if(st2.w>st2.l){ (edge[a]=edge[a]||{})[b]=1; info[a+'>'+b]=`${st2.w}−${st2.l}`; }
    else if(st2.l>st2.w){ (edge[b]=edge[b]||{})[a]=1; info[b+'>'+a]=`${st2.l}−${st2.w}`; }
  }
  const out=[];
  const ids=ps.map(p=>p.id);
  for(let i=0;i<ids.length;i++) for(let j=0;j<ids.length;j++) for(let k=0;k<ids.length;k++){
    const a=ids[i],b=ids[j],c=ids[k];
    if(a===b||b===c||a===c) continue;
    if(a>=b||b>=c) continue;                          // 같은 고리 중복 방지
    if(edge[a]?.[b] && edge[b]?.[c] && edge[c]?.[a]) out.push([a,b,c,info]);
    else if(edge[a]?.[c] && edge[c]?.[b] && edge[b]?.[a]) out.push([a,c,b,info]);
  }
  return out;
}
/* 부수 조정 후보 — 체감과 등록 부수가 벌어진 사람 */
function buCandidates(){
  const MIN=Math.max(st().provisional||0, 8);
  return roster().map(p=>{
    const g=S.G[p.id]||0; if(g<MIN) return null;
    const felt=buScale(rateOf(p.id,'skill'));
    const d=p.bu-felt;                                 // +면 체감이 더 강함(승격 후보)
    if(Math.abs(d)<1.0) return null;
    return {p, g, felt, d};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
/* ── 대회 시뮬레이터 ──────────────────────────────────────────
   실력은 부수 레이팅(핸디를 걷어낸 값)으로 보고,
   핸디 적용 여부는 경기 조건으로 따로 고른다. */
function simWinProb(a, b, useHandi){
  let ea=a.r, eb=b.r;
  if(useHandi && a.bu!==b.bu){
    const pts=handiPtsFor(a.bu,b.bu);
    if(a.bu>b.bu) ea+=pts*st().handiElo; else eb+=pts*st().handiElo;
  }
  return 1/(1+Math.pow(10,(eb-ea)/400));
}
const nextPow2 = n => { let k=1; while(k<n) k*=2; return k; };
/* 스네이크 방식으로 조를 나눈다 (1조1번, 2조1번, 2조2번, 1조2번 …) */
function snakeGroups(list, n){
  const gs=Array.from({length:n},()=>[]);
  list.forEach((p,i)=>{ const row=Math.floor(i/n), col=i%n;
    gs[row%2 ? n-1-col : col].push(p); });
  return gs;
}
function playLeague(members, useHandi, rnd){
  const rec={}; members.forEach(m=>rec[m.id]={w:0,l:0,h2h:{}});
  for(let i=0;i<members.length;i++) for(let j=i+1;j<members.length;j++){
    const A=members[i], B=members[j];
    const aw = rnd() < simWinProb(A,B,useHandi);
    if(aw){ rec[A.id].w++; rec[B.id].l++; rec[A.id].h2h[B.id]=1; rec[B.id].h2h[A.id]=0; }
    else  { rec[B.id].w++; rec[A.id].l++; rec[B.id].h2h[A.id]=1; rec[A.id].h2h[B.id]=0; }
  }
  return members.slice().sort((x,y)=>{
    const d=rec[y.id].w-rec[x.id].w; if(d) return d;
    const h=rec[x.id].h2h[y.id];                 // 승자승
    if(h===1) return -1; if(h===0) return 1;
    return rnd()-0.5;
  }).map(p=>({...p, w:rec[p.id].w, l:rec[p.id].l}));
}
/* 표준 대진 순서 — 1위와 최하위가 반대편에 서고, 부전승이 고르게 흩어진다 */
function seedOrder(size){
  let o=[1];
  while(o.length<size){
    const n=o.length*2, next=[];
    o.forEach(x=>{ next.push(x); next.push(n+1-x); });
    o=next;
  }
  return o;
}
function playKnockout(seeds, useHandi, rnd){
  const size=nextPow2(seeds.length);
  const order=seedOrder(size);
  const slots=order.map(seedNo => seeds[seedNo-1] || null);   // 빈 번호는 부전승
  const rounds=[];                                // 각 라운드를 시작할 때 살아 있는 사람
  const log=[];
  let round=slots;
  while(round.length>1){
    rounds.push(round.filter(Boolean).map(p=>p.id));
    const next=[];
    for(let i=0;i<round.length;i+=2){
      const A=round[i], B=round[i+1];
      if(!A && !B){ next.push(null); continue; }
      if(!A || !B){ next.push(A||B); continue; }  // 부전승도 다음 라운드 명단에 들어간다
      const aw = rnd() < simWinProb(A,B,useHandi);
      const win = aw?A:B, lose = aw?B:A;
      log.push({size:round.length, win:win.id, lose:lose.id});
      next.push(win);
    }
    round=next;
  }
  rounds.push(round.filter(Boolean).map(p=>p.id)); // 마지막은 우승자
  return {champ:round[0]||null, rounds, log};
}
/* 조별리그 통과자를 토너먼트 대진으로. 같은 조 1위끼리 일찍 만나지 않게 교차 배치한다. */
function bracketSeeds(tops, adv){
  const A=[], B=[];
  tops.forEach((order,gi)=>order.slice(0,adv).forEach((p,k)=>{
    ((gi+k)%2===0 ? A : B).push(p);
  }));
  const out=[], n=Math.max(A.length,B.length);
  for(let k=0;k<n;k++){ if(A[k]) out.push(A[k]); if(B[k]) out.push(B[k]); }
  return out;
}
function runSim(opts){
  const {ids, mode, useHandi, format, groups, adv, runs} = opts;
  const base = ids.map(id=>({id, r:rateOf(id,mode), bu:(P(id)||{}).bu||10, name:nameOf(id)}))
                  .sort((a,b)=>b.r-a.r);
  const stat={}; ids.forEach(id=>stat[id]={champ:0, final:0, semi:0, adv:0});
  let seed=20260806;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const bump=(k,list)=>{ if(!list) return;
    new Set(list).forEach(id=>{ if(stat[id]) stat[id][k]++; }); };
  for(let t=0;t<runs;t++){
    if(format==='league'){
      const order=playLeague(base, useHandi, rnd);
      if(order[0]) stat[order[0].id].champ++;
      bump('final', order.slice(0,2).map(p=>p.id));
      bump('semi',  order.slice(0,4).map(p=>p.id));
      bump('adv',   order.map(p=>p.id));
      continue;
    }
    let seeds;
    if(format==='cup') seeds=base.slice();
    else {
      const gs=snakeGroups(base, Math.max(1,groups));
      const tops=gs.map(gm=>playLeague(gm, useHandi, rnd));
      tops.forEach(o=>bump('adv', o.slice(0,adv).map(p=>p.id)));
      seeds=bracketSeeds(tops, adv);
    }
    if(!seeds.length) continue;
    const {champ, rounds}=playKnockout(seeds, useHandi, rnd);
    /* rounds 의 끝에서부터: [우승자] [결승 진출자] [4강 진출자] … */
    const last=rounds.length-1;
    if(champ) stat[champ.id].champ++;
    bump('final', rounds[last-1]);
    bump('semi',  rounds[last-2] || rounds[last-1]);   // 4강 자체가 없으면 결승 명단과 같다
  }
  const rows=ids.map(id=>({id, name:nameOf(id), bu:(P(id)||{}).bu,
    r:Math.round(rateOf(id,mode)),
    champ:stat[id].champ/runs, final:stat[id].final/runs,
    semi:stat[id].semi/runs, adv:stat[id].adv/runs}))
    .sort((a,b)=>b.champ-a.champ || b.final-a.final || b.semi-a.semi);
  return {rows, runs};
}
/* 핸디 표 진단 — 부수 차 구간별로
   ① 실제 승률  ② 그 승률이 우연일 수 있는 범위  ③ 5:5로 만드는 적정 핸디 점수 */
function handiTable(){
  const rows={};
  for(const m of (S._sorted||[])){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    const d=Math.abs(A.bu-B.bu); if(!d) continue;
    const recv = A.bu>B.bu ? A.id : B.id;           // 부수가 높은 쪽 = 약한 쪽 = 핸디 받는 쪽
    const give = recv===A.id ? B.id : A.id;
    const r=rows[d]=rows[d]||{n:0,w:0,gap:0,pts:0,exp:0};
    r.n++; if(winnerOf(m)===recv) r.w++;
    if(m._expA!=null) r.exp += (recv===m.aId ? m._expA : 1-m._expA);
    r.gap += rateOf(give,'skill') - rateOf(recv,'skill');   // 핸디 빼고 순수 실력차
    r.pts += (m.handi && m.handi.pts) ? m.handi.pts : d*st().ptsPerBu;
  }
  const he=st().handiElo||1;
  return Object.entries(rows).map(([d,r])=>{
    const rate=r.w/r.n;
    const se=Math.sqrt(rate*(1-rate)/r.n);          // 표본이 작으면 넓어지는 오차
    const gap=r.gap/r.n;                            // 이 구간 평균 실력차 (점)
    const cur=r.pts/r.n;                            // 이 구간에서 실제로 준 평균 핸디 점수
    const A=Math.min(.95,Math.max(.05,rate));
    /* 이 구간만 놓고 봤을 때의 '핸디 후 남는 부수당 격차' */
    const own = -400*Math.log10(A/(1-A)) / (+d);
    return {d:+d, n:r.n, w:r.w, rate, own, expAvg: r.exp/r.n,
      lo:Math.max(0,rate-1.96*se), hi:Math.min(1,rate+1.96*se),
      gap, cur, fair: gap/he,                       // 5:5로 만드는 데 필요한 점수
      solid: r.n>=15 && (rate-1.96*se>0.5 || rate+1.96*se<0.5) };
  }).sort((a,b)=>a.d-b.d);
}
/* ── 부수별 분석 ────────────────────────────────────────── */
/* 1) 같은 부수끼리 붙은 경기만 추려 그 안의 순위를 낸다 */
function sameBuTable(bu){
  const ids=new Set(roster().filter(p=>p.bu===bu).map(p=>p.id));
  const st1={};
  ids.forEach(id=>st1[id]={id,g:0,w:0,l:0});
  for(const m of (S._sorted||[])){
    if(!ids.has(m.aId) || !ids.has(m.bId)) continue;
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    st1[w].g++; st1[w].w++; st1[l].g++; st1[l].l++;
  }
  return Object.values(st1).filter(x=>x.g>0)
    .sort((a,b)=>(b.w-b.l)-(a.w-a.l) || b.w-a.w || a.g-b.g);
}
/* 2) 부수별 평균 퍼포먼스가 달마다 어떻게 움직였나 */
function buTrend(){
  const ms=seasons();
  const out={};
  ms.forEach(ym=>{
    const t=monthStand(ym,'skill');
    const by={};
    roster().forEach(p=>{
      if((t.G[p.id]||0) < 3) return;
      (by[p.bu]=by[p.bu]||[]).push(t.R[p.id]);
    });
    Object.keys(by).forEach(bu=>{
      const arr=by[bu];
      (out[bu]=out[bu]||[]).push({ym, n:arr.length, avg:arr.reduce((a,x)=>a+x,0)/arr.length});
    });
  });
  return out;
}
/* 3) 부수마다 이달의 선수 */
function buMvp(ym){
  const t=monthStand(ym,'skill');
  const by={};
  roster().forEach(p=>{
    const g=t.G[p.id]||0; if(g<3) return;
    const w=t.W[p.id]||0, l=t.L[p.id]||0;
    (by[p.bu]=by[p.bu]||[]).push({p,g,w,l,r:t.R[p.id]});
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(bu=>{
    const list=by[bu].sort((x,y)=>(y.w-y.l)-(x.w-x.l) || (y.w/y.g)-(x.w/x.g) || y.g-x.g);
    return {bu, top:list[0], n:list.length};
  });
}
/* 4) 체감 부수가 달마다 어디로 가고 있나 → 언제쯤 한 부수를 넘어설까 */
function promoTrend(id){
  const p=P(id); if(!p) return null;
  const hist=(trk('skill').H[id]||[]).filter(x=>x.d);
  if(hist.length<6) return null;
  const ms=seasons().slice(-4);
  if(ms.length<2) return null;
  const pts=[];
  ms.forEach((ym,i)=>{
    const end=ym+'-31';
    let last=null;
    for(const x of hist){ if(x.d<=end) last=x; }
    if(last) pts.push({i, felt:buScale(last.r)});
  });
  if(pts.length<2) return null;
  const n=pts.length;
  const mx=pts.reduce((a,x)=>a+x.i,0)/n, my=pts.reduce((a,x)=>a+x.felt,0)/n;
  const den=pts.reduce((a,x)=>a+(x.i-mx)**2,0);
  if(!den) return null;
  const slope=pts.reduce((a,x)=>a+(x.i-mx)*(x.felt-my),0)/den;   // 달마다 체감 부수 변화(−면 강해짐)
  const cur=pts[n-1].felt;
  const target=p.bu-1;                                            // 한 부수 위
  if(slope>=-0.02) return {cur, slope, months:null};              // 좋아지는 추세가 아니다
  const months=Math.ceil((cur-target)/(-slope));
  return {cur, slope, months: (months>0&&months<=36)?months:null};
}
/* 부수 조합별 핸디 진단 — 같은 '차 1' 이라도 5↔6 과 9↔10 은 다르다 */
function handiPairs(){
  const rows={};
  for(const m of (S._sorted||[])){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    if(A.bu===B.bu) continue;
    const hi = A.bu<B.bu ? A : B;                 // 부수 숫자가 작은 쪽 = 고수
    const lo = A.bu<B.bu ? B : A;                 // 핸디 받는 쪽
    const k = hi.bu+'>'+lo.bu;
    const r = rows[k] = rows[k] || {hi:hi.bu, lo:lo.bu, d:lo.bu-hi.bu, n:0, w:0, pts:0};
    r.n++; if(winnerOf(m)===lo.id) r.w++;
    r.pts += (m.handi&&m.handi.pts) ? m.handi.pts : handiPtsFor(hi.bu, lo.bu);
  }
  return Object.values(rows).map(r=>{
    const rate=r.w/r.n, A=Math.min(.95,Math.max(.05,rate));
    return {...r, rate, avgPts:r.pts/r.n,
      own: -400*Math.log10(A/(1-A)) / r.d,
      solid: r.n>=10 };
  }).sort((a,b)=> a.d-b.d || a.hi-b.hi);
}
/* 기록실 */
function hallOfFame(){
  const pair={}, ups=[], byId={};
  for(const m of (S._sorted||[])){
    const k=[m.aId,m.bId].sort().join('|');
    pair[k]=(pair[k]||0)+1;
    const w=winnerOf(m), e=m._expA==null?null:(w===m.aId?m._expA:1-m._expA);
    if(e!=null && e<0.5) ups.push({m, e, w});
    [m.aId,m.bId].forEach(id=>{ const b=byId[id]=byId[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
  }
  const topPairs=Object.entries(pair).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([k,n])=>({a:k.split('|')[0], b:k.split('|')[1], n}));
  const topUps=ups.sort((a,b)=>a.e-b.e).slice(0,5);
  const arr=Object.entries(byId).map(([id,b])=>({id, ...b, days:b.days.size}));
  return { topPairs, topUps,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g).slice(0,5),
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days).slice(0,5),
    mostWins:  arr.slice().sort((a,b)=>b.w-a.w).slice(0,5) };
}
/* 출석 — 요일별 · 월별 */
function attendance(){
  const dow=[0,0,0,0,0,0,0], mon={}, dayPl={};
  for(const m of (S._sorted||[])){
    const [y,mo,dd]=m.date.split('-').map(Number);
    dow[new Date(y,mo-1,dd).getDay()]++;
    mon[m.date.slice(0,7)]=(mon[m.date.slice(0,7)]||0)+1;
    (dayPl[m.date]=dayPl[m.date]||new Set()).add(m.aId).add(m.bId);
  }
  const days=Object.keys(dayPl).sort();
  return {dow, mon:Object.entries(mon).sort(), days,
    avgPl: days.length? days.reduce((a,d)=>a+dayPl[d].size,0)/days.length : 0,
    dayPl};
}
/* 이달의 기록 */
function monthlyReport(ym){
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,7)===ym);
  if(!ms.length) return null;
  const by={}, pair={}; let best=null;
  for(const m of ms){
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    [m.aId,m.bId].forEach(id=>{ const b=by[id]=by[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
    const k=[m.aId,m.bId].sort().join('|'); pair[k]=(pair[k]||0)+1;
    const e=m._expA==null?null:(w===m.aId?m._expA:1-m._expA);
    if(e!=null && (!best || e<best.e)) best={m,e,w,l};
  }
  const arr=Object.entries(by).map(([id,b])=>({id,...b,days:b.days.size}));
  const rows=standings(ym,'skill').filter(r=>r.g>=(st().provisional||0));
  const pv=standings(ym,'skill',dayAgo(30)).filter(r=>r.g>=(st().provisional||0));
  const pvIdx={}; pv.forEach((r,i)=>pvIdx[r.p.id]=i+1);
  let rise=null;
  rows.forEach((r,i)=>{ const mv=pvIdx[r.p.id]?pvIdx[r.p.id]-(i+1):0;
    if(mv>0 && (!rise||mv>rise.mv)) rise={id:r.p.id, mv, rank:i+1}; });
  const tp=Object.entries(pair).sort((a,b)=>b[1]-a[1])[0];
  const MIN3=Math.max(3, Math.min(5, st().provisional||3));
  const mvp=arr.filter(x=>x.g>=MIN3).sort((a,b)=>
    (b.w-a.w) || ((b.w/b.g)-(a.w/a.g)) || (b.g-a.g))[0] || null;
  return { n:ms.length, days:new Set(ms.map(m=>m.date)).size, players:arr.length,
    mvp, minG:MIN3,
    champ: rows[0]||null,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g)[0],
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days)[0],
    bestWin:   arr.filter(x=>x.g>=3).sort((a,b)=>(b.w/b.g)-(a.w/a.g))[0],
    upset: best, rise,
    topPair: tp? {a:tp[0].split('|')[0], b:tp[0].split('|')[1], n:tp[1]} : null };
}
/* 기대 대비 성적 — 야구의 피타고리안 승률과 같은 발상.
   매 경기 기대 승률을 더한 값이 '실력대로면 이랬을 승수'다. */
function luckTable(ym){
  const by={};
  for(const m of (S._sorted||[])){
    if(ym && m.date.slice(0,7)!==ym) continue;
    const eA=m._expA; if(eA==null) continue;
    const w=winnerOf(m);
    [[m.aId,eA],[m.bId,1-eA]].forEach(([id,e])=>{
      const b=by[id]=by[id]||{g:0,w:0,exp:0};
      b.g++; b.exp+=e; if(w===id) b.w++;
    });
  }
  return Object.entries(by).map(([id,b])=>({id, g:b.g, w:b.w, exp:b.exp,
      diff:b.w-b.exp, rate:(b.w-b.exp)/b.g}))
    .filter(x=>x.g>=5).sort((a,b)=>b.diff-a.diff);
}

/* 칭호 — 그 시즌의 성향을 한마디로. 한 사람당 최대 두 개만 붙인다. */
function playerTitles(period, mode){
  const inP = m => period==='all' ? true : m.date.slice(0,7)===period;
  const st1={};
  const push=(id)=> st1[id] = st1[id] ||
    {g:0,w:0, hiG:0,hiW:0, loG:0,loW:0, pmG:0,pmW:0, pnG:0,pnW:0,
     ups:0, upsN:0, upsExp:0, days:new Set(), day:{}};
  for(const m of (S._sorted||[])){
    if(!inP(m)) continue;
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    const w=winnerOf(m);
    for(const [me,op] of [[A,B],[B,A]]){
      push(me.id); const b=st1[me.id];
      b.g++; b.days.add(m.date); if(w===me.id) b.w++;
      if(op.bu < me.bu){ b.hiG++; if(w===me.id) b.hiW++; }        // 상위 부수 상대
      else if(op.bu > me.bu){ b.loG++; if(w===me.id) b.loW++; }   // 하위 부수 상대
      if(isPimple(op)){ b.pmG++; if(w===me.id) b.pmW++; }
      if(isPen(op)){    b.pnG++; if(w===me.id) b.pnW++; }
      const e = m._expA==null?null:(m.aId===me.id?m._expA:1-m._expA);
      if(e!=null && e<UPSET){                     // 불리하게 시작한 판
        b.upsN++; b.upsExp+=e;
        if(w===me.id) b.ups++;
      }
      const d = m.aId===me.id ? m._sA : m._sB;         // 그 경기로 움직인 점수
      if(d!=null) b.day[m.date] = (b.day[m.date]||0) + d;
    }
  }
  const ids=Object.keys(st1);
  if(!ids.length) return {};
  /* 기복 = 그날그날 레이팅이 얼마나 출렁였나. 날짜별 변동폭의 표준편차로 본다. */
  const swingRank={};
  const swings=ids.map(id=>{
    const b=st1[id], v=Object.values(b.day);
    if(v.length<4 || b.g<10) return null;
    const mean=v.reduce((a,x)=>a+x,0)/v.length;
    return {id, sd:Math.sqrt(v.reduce((a,x)=>a+(x-mean)**2,0)/v.length)};
  }).filter(Boolean).sort((a,b)=>a.sd-b.sd);
  swings.slice(0, Math.max(1, Math.round(swings.length/3))).forEach(x=>swingRank[x.id]='low');
  const maxDays=Math.max(...ids.map(i=>st1[i].days.size), 0);
  const maxW=Math.max(...ids.map(i=>st1[i].w), 0);
  const out={};
  for(const id of ids){
    const b=st1[id], t=[];
    if(b.loG>=6 && b.loW/b.loG>=0.9)              t.push(['하위부 킬러','gold']);
    if(b.hiG>=5 && b.hiW/b.hiG>=0.5)              t.push(['고수 킬러','red']);
    if(b.pmG>=5 && b.pmW/b.pmG>=0.7)              t.push(['핌플 킬러','red']);
    if(b.pnG>=5 && b.pnW/b.pnG>=0.7)              t.push(['펜홀더 킬러','purple']);
    /* 불리한 판 8번 이상에서, 예상보다 2승 이상 더 건졌을 때만 */
    if(b.upsN>=8 && b.ups>=4 && (b.ups-b.upsExp)>=2)
                                                  t.push(['이변 제조기','warn']);
    if(swingRank[id]==='low')                     t.push(['기복 없음','blue']);
    if(b.days.size>=4 && b.days.size===maxDays)   t.push(['개근','ok']);
    if(b.w>=5 && b.w===maxW)                      t.push(['다승왕','gold']);
    if(t.length) out[id]=t.slice(0,2);
  }
  return out;
}
/* 초면 vs 구면 — 처음 만난 상대와, 이미 여러 번 붙어본 상대의 성적을 가른다.
   처음에 강하면 '기세로 누르는 형', 나중에 강하면 '적응하는 형'이다. */
function freshVsKnown(id){
  const byOpp={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const o = m.aId===id ? m.bId : m.aId;
    (byOpp[o]=byOpp[o]||[]).push(m);
  }
  let fW=0,fL=0,kW=0,kL=0, fE=0, kE=0;
  for(const o in byOpp){
    byOpp[o].forEach((m,i)=>{
      const won = winnerOf(m)===id;
      const e = m._expA==null?null:(m.aId===id?m._expA:1-m._expA);
      if(i===0){ won?fW++:fL++; if(e!=null) fE+=e; }
      else     { won?kW++:kL++; if(e!=null) kE+=e; }
    });
  }
  const f=fW+fL, k=kW+kL;
  return { fW,fL,kW,kL, fN:f, kN:k,
    fRate: f?fW/f:null, kRate: k?kW/k:null,
    fEdge: f?fW-fE:0, kEdge: k?kW-kE:0,      // 기대 대비
    opps: Object.keys(byOpp).length };
}
/* 요일별 성적 — 나는 어느 요일에 잘 치나 */
function dowStats(id, ym){
  const D=[0,0,0,0,0,0,0].map(()=>({g:0,w:0,exp:0,days:new Set()}));
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    if(ym && m.date.slice(0,7)!==ym) continue;
    const [y,mo,dd]=m.date.split('-').map(Number);
    const k=new Date(y,mo-1,dd).getDay();
    const b=D[k];
    b.g++; b.days.add(m.date);
    if(winnerOf(m)===id) b.w++;
    const e = m._expA==null?null:(m.aId===id?m._expA:1-m._expA);
    if(e!=null) b.exp+=e;
  }
  return D.map((b,i)=>({dow:i, g:b.g, w:b.w, l:b.g-b.w, days:b.days.size,
    rate: b.g?b.w/b.g:null, diff: b.g?b.w-b.exp:0}));
}
/* 아직 안 붙어본 상대 */
function unplayed(id){
  const met=new Set();
  for(const m of (S._sorted||[])){
    if(m.aId===id) met.add(m.bId);
    else if(m.bId===id) met.add(m.aId);
  }
  return roster().filter(p=>p.id!==id && (S.G[p.id]||0)>0 && !met.has(p.id))
    .sort((a,b)=>rateOf(b.id,'skill')-rateOf(a.id,'skill'));
}
/* 상대 부수별 승률 — 어느 부수부터 벽인가 */
function wallByBu(id){
  const me=P(id); if(!me) return [];
  const by={};
  for(const m of (S._sorted||[])){
    if(m.aId!==id && m.bId!==id) continue;
    const o=P(m.aId===id?m.bId:m.aId); if(!o) continue;
    const b=by[o.bu]=by[o.bu]||{n:0,w:0};
    b.n++; if(winnerOf(m)===id) b.w++;
  }
  return Object.entries(by).map(([bu,x])=>({bu:+bu, n:x.n, w:x.w, rate:x.w/x.n}))
    .sort((a,b)=>a.bu-b.bu);
}
/* 요즘 기세 — 최근 N일 동안 기대 승수 대비 얼마나 더/덜 이겼나 */
const HEAT_DAYS = 7;                 // 한 주 단위로 본다
function heatMap(days){
  const from=dayAgo(days||HEAT_DAYS), by={};
  for(const m of (S._sorted||[])){
    if(m.date<from) continue;
    const eA=m._expA; if(eA==null) continue;
    const w=winnerOf(m);
    [[m.aId,eA],[m.bId,1-eA]].forEach(([id,e])=>{
      const b=by[id]=by[id]||{g:0,w:0,exp:0};
      b.g++; b.exp+=e; if(w===id) b.w++; });
  }
  const out={};
  for(const id in by){ const b=by[id];
    if(b.g<4) continue;                                   // 표본이 너무 적으면 판단하지 않는다
    const d=b.w-b.exp;
    out[id]={...b, diff:d, rate:d/b.g, heat: d>=1.2?'hot' : d<=-1.2?'cold' : ''};
  }
  return out;
}
/* 라이벌 — 양쪽 다 이겨봤고, 승률이 5:5 언저리이며, 많이 붙은 짝.
   한쪽이 쓸어담은 짝은 아무리 많이 붙어도 라이벌이 아니다. */
function rivalries(minG){
  const MIN=minG||3, seen={}, out=[];
  for(const m of (S._sorted||[])){
    const k=[m.aId,m.bId].sort().join('|');
    const b=seen[k]=seen[k]||{a:k.split('|')[0], b:k.split('|')[1], n:0, aw:0, last:''};
    b.n++; if(winnerOf(m)===b.a) b.aw++; b.last=m.date;
  }
  for(const k in seen){
    const x=seen[k];
    if(x.n<MIN || !P(x.a) || !P(x.b)) continue;
    const lose=x.n-x.aw, gap=Math.abs(x.aw-lose);
    if(x.aw===0 || lose===0) continue;              // 한쪽이 전승이면 라이벌이 아니다
    const rate=x.aw/x.n;
    /* 박빙 기준: 승률 40~60%. 경기가 적으면 그 안에 떨어지는 조합이 없으므로
       '승패 차 1' 까지 인정한다. */
    if(!(gap<=1 || (rate>=0.40 && rate<=0.60))) continue;
    x.rate=rate;
    x.score = x.n * (1 - 2*Math.abs(rate-0.5));     // 팽팽할수록 · 많이 붙을수록
    out.push(x);
  }
  return out.sort((p,q)=>q.n-p.n || (Math.abs(p.rate-0.5)-Math.abs(q.rate-0.5)));
}

    const cy=findCycles(2);
    return `<div class="secttl" style="margin-top:16px">물고 물리는 삼각관계</div>
      <p class="tiny dim" style="margin:0 0 8px">2경기 이상 붙어 우열이 갈린 짝만 셉니다.
        A가 B에게 강한데 B는 C에게, 그 C가 다시 A에게 강한 고리입니다.</p>
      ${cy.length?cy.slice(0,20).map(([a,b,c,info])=>`<div class="tri">
        ${[[a,b],[b,c],[c,a]].map(([x,y])=>`<div class="leg">
          <span class="w">${esc(nameOf(x))}</span><i class="ar">${info[x+'>'+y]||''}</i>
          <span class="l">${esc(nameOf(y))}</span></div>`).join('')}
      </div>`).join(''):`<div class="empty">아직 삼각관계가 없습니다.</div>`}`;
  };
  const secHandi=()=>{
    const t=handiTable(), tot=t.reduce((a,x)=>a+x.n,0);
    return `<div class="secttl">부수 차별 핸디 진단</div>
      <p class="tiny dim" style="margin:0 0 8px">핸디 받는 쪽(부수가 낮은 쪽)의 실제 승률입니다.
        가운데가 50%, 왼쪽이면 핸디가 박하고 오른쪽이면 후합니다.</p>
      <div class="card">
        ${t.length?t.map(x=>{
          const off=x.rate-0.5, w=Math.min(50,Math.abs(off)*100);
          return `<div class="dv ${!x.solid?'weak':off<0?'lo':'hi'}">
            <div class="k">부수 차 ${x.d}</div>
            <div class="track"><div class="mid"></div><i style="${off<0?'right:50%':'left:50%'};width:${w}%"></i></div>
            <div class="v"><b>${pct(x.rate)}%</b><span>${x.n}경기</span></div>
          </div>
          <div class="dvo ${!x.solid?'weak':''}">이 구간만 보면 부수당 <b>${Math.round(x.own)}점</b> 유리</div>`;}).join('')
          :`<div class="empty">아직 핸디 경기가 없습니다.</div>`}
        <p class="tiny dim" style="margin:8px 0 0">핸디 경기 ${tot}건 ·
          승률 범위가 50%를 걸치면 표본이 모자란 것으로 보고 흐리게 표시합니다.<br>
          ${st().autoCalib
            ? `이 표를 바탕으로 <b>부수당 남는 격차를 ${Math.round(residualNow())}점</b>으로 잡아 레이팅에 반영하고 있습니다.
               구간별 값이 들쭉날쭉하면 표본이 적어서이고, 경기가 쌓이면 자동으로 다시 맞춥니다.`
            : '자동 보정이 꺼져 있어 이 표는 레이팅에 반영되지 않습니다. 관리 탭에서 켤 수 있습니다.'}</p>
      </div>`;
  };
  const secBuMvp=()=>{
    const ym=(seasons().slice(-1)[0])||monthOfNow();
    const list=buMvp(ym);
    if(!list.length) return '';
    return `<div class="secttl">부수별 이달의 선수</div>
      <p class="tiny dim" style="margin:0 0 8px">${+ym.slice(5)}월 · 3경기 이상 친 사람 중 승패 차가 가장 큰 사람입니다.</p>
      <div class="card">${list.map(x=>`<div class="bmv">
        <span class="b">${x.bu}부</span>
        <span class="n">${esc(x.top.p.name)}</span>
        <span class="r">${x.top.w}−${x.top.l}</span>
        <span class="g">${x.n}명 중</span>
      </div>`).join('')}</div>`;
  };
  const secSameBu=()=>{
    const bus=[...new Set(roster().map(p=>p.bu))].sort((a,b)=>a-b);
    const blocks=bus.map(bu=>{
      const t=sameBuTable(bu);
      if(t.length<2) return '';
      const tot=t.reduce((a,x)=>a+x.g,0)/2;
      return `<div class="card" style="margin-bottom:8px">
        <div class="secttl" style="margin:0 0 8px">${bu}부 <span class="dim" style="font-weight:400">· ${Math.round(tot)}경기</span></div>
        ${t.map((x,i)=>`<div class="sbu">
          <span class="i">${i+1}</span><span class="n">${esc(nameOf(x.id))}</span>
          <span class="r">${x.w}−${x.l}</span>
          <span class="d ${x.w-x.l>0?'up':x.w-x.l<0?'down':''}">${x.w-x.l>0?'+':''}${x.w-x.l}</span>
        </div>`).join('')}
      </div>`;
    }).filter(Boolean);
    if(!blocks.length) return '';
    return `<div class="secttl" style="margin-top:16px">부수 안에서만</div>
      <p class="tiny dim" style="margin:0 0 8px">같은 부수끼리 붙은 경기만 셉니다. 핸디도 부수 차도 없는 순수 맞대결입니다.</p>
      ${blocks.join('')}`;
  };
  const secBuTrend=()=>{
    const t=buTrend();
    const bus=Object.keys(t).map(Number).sort((a,b)=>a-b).filter(bu=>t[bu].length>=2);
    if(!bus.length) return '';
    return `<div class="secttl" style="margin-top:16px">부수 평균 추이</div>
      <p class="tiny dim" style="margin:0 0 8px">그 달 3경기 이상 친 사람들의 평균입니다. 오르면 그 부수가 세지고 있다는 뜻입니다.</p>
      <div class="card">${bus.map(bu=>{
        const a=t[bu], first=a[0], last=a[a.length-1], d=last.avg-first.avg;
        return `<div class="btr">
          <span class="b">${bu}부</span>
          <span class="s">${a.map(x=>`<i title="${x.ym} · ${Math.round(x.avg)} · ${x.n}명">${Math.round(x.avg)}</i>`).join('<em>→</em>')}</span>
          <span class="d ${d>15?'up':d<-15?'down':''}">${d>0?'+':''}${Math.round(d)}</span>
        </div>`;}).join('')}</div>`;
  };
  const secPromo=()=>{
    const cand=roster().map(p=>({p, t:promoTrend(p.id)}))
      .filter(x=>x.t && x.t.months!=null)
      .sort((a,b)=>a.t.months-b.t.months).slice(0,8);
    if(!cand.length) return '';
    return `<div class="secttl" style="margin-top:16px">이 페이스면 승격</div>
      <p class="tiny dim" style="margin:0 0 8px">달마다 체감 부수가 어디로 가는지 보고 한 부수 위까지 남은 기간을 어림합니다.
        추세가 그대로 이어진다는 가정이라 참고용입니다.</p>
      ${cand.map(x=>`<div class="pro">
        <div class="n"><b>${esc(x.p.name)}</b><span>${x.p.bu}부 · 체감 ${x.t.cur.toFixed(1)}부</span></div>
        <div class="v"><b>${x.t.months}개월</b><span>달마다 ${Math.abs(x.t.slope).toFixed(2)}부수</span></div>
      </div>`).join('')}`;
  };
  const secPairs=()=>{
    const t=handiPairs();
    if(!t.length) return '';
    const byD={};
    t.forEach(x=>(byD[x.d]=byD[x.d]||[]).push(x));
    return `<div class="secttl" style="margin-top:16px">부수 조합별</div>
      <p class="tiny dim" style="margin:0 0 8px">같은 부수 차라도 어느 구간이냐에 따라 다릅니다.
        핸디 받는 쪽(부수 숫자가 큰 쪽) 승률입니다. 10경기 미만은 흐리게.</p>
      ${Object.keys(byD).sort((a,b)=>a-b).map(d=>`<div class="card" style="margin-bottom:8px">
        <div class="secttl" style="margin:0 0 8px">부수 차 ${d}</div>
        ${byD[d].map(x=>`<div class="pr ${!x.solid?'weak':x.rate<0.42?'lo':x.rate>0.58?'hi':'ok'}">
          <div class="k">${x.hi}부 <i>vs</i> ${x.lo}부</div>
          <div class="track"><div class="mid"></div>
            <i style="${x.rate<0.5?'right:50%':'left:50%'};width:${Math.min(50,Math.abs(x.rate-0.5)*100)}%"></i></div>
          <div class="v"><b>${pct(x.rate)}%</b><span>${x.n}경기</span></div>
          <div class="o">핸디 ${x.avgPts.toFixed(1)}점 · 부수당 ${Math.round(x.own)}점 유리</div>
        </div>`).join('')}
      </div>`).join('')}`;
  };
  const secBu=()=>{
    const cs=buCandidates();
    return `<div class="secttl" style="margin-top:16px">부수 조정 후보</div>
      <p class="tiny dim" style="margin:0 0 8px">체감이 등록 부수와 1부수 이상 벌어진 사람 · 8경기 이상</p>
      ${cs.length?cs.map(c=>`<div class="bur ${c.d>0?'up':'down'}">
        <div class="n"><b>${esc(c.p.name)}</b><span>${c.g}경기</span></div>
        <div class="v"><b>${c.p.bu}부</b><i>→</i><b class="${c.d>0?'up':'down'}">${c.felt.toFixed(1)}부</b></div>
        <div class="t">${c.d>0?'승격 검토':'강등 검토'}<span>${Math.abs(c.d).toFixed(1)}부수</span></div>
      </div>`).join(''):`<div class="empty">조정이 필요해 보이는 사람이 없습니다.</div>`}`;
  };
  const secAtt=()=>{
    const a=attendance(), D=['일','월','화','수','목','금','토'];
    const mx=Math.max(...a.dow,1), mm=Math.max(...a.mon.map(x=>x[1]),1);
    return `<div class="secttl" style="margin-top:16px">언제 많이 치나</div>
      <div class="card">
        <div class="dowgrid">${a.dow.map((n,i)=>`<div class="${i===0?'sun':''} ${n===mx&&n?'peak':''}">
          <em>${n||''}</em><div class="bar"><i style="height:${n?Math.max(6,Math.round(n/mx*100)):0}%"></i></div>
          <span>${D[i]}</span></div>`).join('')}</div>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        ${a.mon.map(([ym,n])=>`<div class="mrow2">
          <div class="k">${ym.slice(2,4)}. ${String(+ym.slice(5)).padStart(2,'0')}</div>
          <div class="track"><i style="width:${Math.round(n/mm*100)}%"></i></div>
          <div class="v"><b>${n}</b><span>${a.days.filter(d=>d.slice(0,7)===ym).length}일</span></div>
        </div>`).join('')}</div>
        <p class="tiny dim" style="margin:8px 0 0">하루 평균 ${a.avgPl.toFixed(1)}명</p>
      </div>`;
  };

  const draw=()=>{
    const rs=roster().filter(p=>(S.G[p.id]||0)>0);
    if(!matchPick.a) matchPick.a=(S.me&&S.me.id)||(rs[0]||{}).id||'';
    if(!matchPick.b) matchPick.b=(rs.find(p=>p.id!==matchPick.a)||{}).id||'';
    const body = clubTab==='month' ? secMonthly()+secHall()
               : clubTab==='vs'    ? secMatch(rs)+secRival()+secCycle()
               : clubTab==='bu'    ? secBuMvp()+secSameBu()+secBuTrend()+secPromo()
               :                     secHandi()+secPairs()+secBu()+secAtt();
    return `<div class="seg" style="margin-bottom:12px">
      ${[['month','이달의 기록'],['vs','맞대결'],['bu','부수별'],['diag','클럽 진단']]
        .map(([k,v])=>`<button data-ct="${k}" class="${clubTab===k?'on':''}">${v}</button>`).join('')}
    </div>${body}`;
  };
  const bind=()=>{
    sh.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ clubTab=b.dataset.ct; redraw(); });
    const a=sh.querySelector('#mpA'), b=sh.querySelector('#mpB');
    if(a) a.onchange=()=>{ matchPick.a=a.value; redraw(); };
    if(b) b.onchange=()=>{ matchPick.b=b.value; redraw(); };
  };
  const redraw=()=>{ const o=sh; sh=sheet('클럽 분석', draw()); o.remove(); bind(); };
  sh=sheet('클럽 분석', draw()); bind();
}
/* 대회 시뮬레이터 화면 */
let simCfg=null;
function simSheet(){
  const MIN=st().provisional||0;
  const pool=roster().filter(p=>(S.G[p.id]||0)>0);
  simCfg = simCfg || { ids:pool.filter(p=>(S.G[p.id]||0)>=MIN).map(p=>p.id),
                       mode:'skill', handi:true, format:'both', groups:2, adv:2, runs:2000 };
  let sh;
  const draw=()=>{
    const c=simCfg;
    const kn=c.format==='both' ? c.groups*c.adv : (c.format==='cup'? c.ids.length : 0);
    const roundName = n => n<=2?'결승':n<=4?'4강':n<=8?'8강':n<=16?'16강':n+'강';
    return `
      <p class="tiny dim">지금 실력으로 대회를 열면 누가 우승할지 예측합니다.</p>
      <div class="secttl" style="margin-top:14px">방식</div>
      <div class="seg">
        <button data-f="league" class="${c.format==='league'?'on':''}">리그전</button>
        <button data-f="cup" class="${c.format==='cup'?'on':''}">토너먼트</button>
        <button data-f="both" class="${c.format==='both'?'on':''}">리그+토너먼트</button>
      </div>
      ${c.format==='both'?`
        <div class="row" style="margin-top:11px">
          <div class="field"><label>조 개수</label>
            <select id="sgN">${[2,3,4,5,6].map(n=>`<option value="${n}" ${n===c.groups?'selected':''}>${n}개 조</option>`).join('')}</select></div>
          <div class="field"><label>조당 진출</label>
            <select id="sgA">${[1,2,3].map(n=>`<option value="${n}" ${n===c.adv?'selected':''}>${n}명</option>`).join('')}</select></div>
        </div>
        <p class="tiny dim" style="margin:-4px 2px 0">${c.groups}개 조 × ${c.adv}명 = <b>${kn}명</b>이 올라가 ${roundName(nextPow2(kn))} 부터 시작합니다.
        ${(()=>{ const n=c.ids.length; if(!n) return '';
          const sz=Array.from({length:c.groups},(_,i)=>Math.floor(n/c.groups)+(i<n%c.groups?1:0));
          const tot=sz.reduce((a,x)=>a+x*(x-1)/2,0);
          const per=sz.map(x=>x-1);
          return `조 편성 ${sz.join('·')}명 · 조별리그 한 사람당 ${Math.min(...per)}~${Math.max(...per)}경기 (총 ${tot}경기)`;
        })()}</p>`:''}
      ${c.format==='cup'?`<p class="tiny dim" style="margin:8px 2px 0">${c.ids.length}명 → ${roundName(nextPow2(c.ids.length))} 부터, 남는 자리는 부전승입니다.</p>`:''}
      ${c.format==='league'?`<p class="tiny dim" style="margin:8px 2px 0">${c.ids.length}명 풀리그 — 서로 한 번씩,
        한 사람당 ${c.ids.length-1}경기 (총 ${c.ids.length*(c.ids.length-1)/2}경기). 승수로 순위를 매깁니다.</p>`:''}

      <div class="secttl" style="margin-top:16px">경기 조건</div>
      <div class="seg">
        <button data-h="1" class="${c.handi?'on':''}">핸디 적용</button>
        <button data-h="0" class="${!c.handi?'on':''}">노핸디</button>
      </div>

      <div class="split" style="align-items:center;margin-top:16px">
        <div class="secttl" style="margin:0">참가자 ${c.ids.length}명</div>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm" data-all>전체</button>
          <button class="btn ghost sm" data-none>해제</button>
        </div>
      </div>
      <div class="picks" style="margin-top:8px">
        ${pool.map(p=>`<div class="pk ${c.ids.includes(p.id)?'w':''}">
          <button class="nm" data-tog="${p.id}">${esc(p.name)}<small>${p.bu}부</small></button></div>`).join('')}
      </div>
      <button class="btn" id="simGo" style="margin-top:16px" ${c.ids.length<3?'disabled':''}>
        ${c.ids.length<3?'3명 이상 선택하세요':'대회 열기'}</button>
      <div id="simOut"></div>`;
  };
  const bind=()=>{
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ simCfg.format=b.dataset.f; redraw(); });
    sh.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ simCfg.handi=b.dataset.h==='1'; redraw(); });
    sh.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.tog, i=simCfg.ids.indexOf(id);
      if(i<0) simCfg.ids.push(id); else simCfg.ids.splice(i,1); redraw(); });
    const a=sh.querySelector('[data-all]'); if(a) a.onclick=()=>{ simCfg.ids=pool.map(p=>p.id); redraw(); };
    const n=sh.querySelector('[data-none]'); if(n) n.onclick=()=>{ simCfg.ids=[]; redraw(); };
    const gn=sh.querySelector('#sgN'); if(gn) gn.onchange=()=>{ simCfg.groups=+gn.value; redraw(); };
    const ga=sh.querySelector('#sgA'); if(ga) ga.onchange=()=>{ simCfg.adv=+ga.value; redraw(); };
    const go=sh.querySelector('#simGo');
    if(go) go.onclick=()=>{
      busyOn('대회 진행 중…');
      setTimeout(()=>{
        const res=runSim({...simCfg, useHandi:simCfg.handi});
        busyOff();
        sh.querySelector('#simOut').innerHTML=simResultHTML(res, simCfg);
      }, 30);
    };
  };
  const redraw=()=>{ const o=sh; sh=sheet('대회 시뮬레이터', draw()); o.remove(); bind(); };
  sh=sheet('대회 시뮬레이터', draw()); bind();
}
function simResultHTML(res, c){
  const pc=x=>x>=0.995?'100%':x<0.005?'–':(x*100).toFixed(x<0.1?1:0)+'%';
  const top=res.rows[0];
  return `<hr class="sep">
    <div class="notice" style="margin-bottom:12px">
      우승 후보 <b>${esc(top.name)}</b> · 우승 확률 <b>${pc(top.champ)}</b>
      <span class="dim">· ${c.handi?'핸디 적용':'노핸디'}</span></div>
    <table class="tbl"><thead><tr><th>선수</th><th class="n">우승</th><th class="n">결승</th>
      <th class="n">4강</th>${c.format==='both'?'<th class="n">조별 통과</th>':''}</tr></thead><tbody>
      ${res.rows.map(r=>`<tr><td>${esc(r.name)} <span class="dim">${r.bu}부 · ${r.r}</span></td>
        <td class="n"><b>${pc(r.champ)}</b></td><td class="n">${pc(r.final)}</td>
        <td class="n">${pc(r.semi)}</td>${c.format==='both'?`<td class="n">${pc(r.adv)}</td>`:''}</tr>`).join('')}
    </tbody></table>`;
}
/* 시즌별 요약 — 한 시즌이 카드 한 장 */
function seasonRowsHTML(id, mode){
  const yms=seasons().slice().reverse();
  const MIN=st().provisional||0;
  const other = mode==='skill' ? 'form' : 'skill';
  const rankIn=(ym,md)=>{
    const all=standings(ym,md).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    return i<0?0:i+1;
  };
  const out=yms.map((ym,idx)=>{
    const all=standings(ym,mode);
    const me=all.find(r=>r.p.id===id);
    if(!me || !me.g) return '';
    const oth=standings(ym,other).find(r=>r.p.id===id);
    const rank=rankIn(ym,mode);
    const prevYm=yms[idx+1];
    const prev=prevYm?rankIn(prevYm,mode):0;
    const mv=(rank&&prev)?prev-rank:0;
    const ss=seasonStats(id,ym,mode);
    const pct=me.g?Math.round(me.w/me.g*100):0;
    const hiN=ss?(ss.hiW+ss.hiL):0, loN=ss?(ss.loW+ss.loL):0;
    const chips=[
      ['경기', `${me.g}`, ''],
      ['출석', `${playDaysOf(id, ym)}일`, ''],
      ['상위 부수', hiN?`${ss.hiW}−${ss.hiL}`:'0−0', hiN&&ss.hiW>ss.hiL?'up':''],
      ['하위 부수', loN?`${ss.loW}−${ss.loL}`:'0−0', ''],
      ['이변', `${ss?ss.ups:0}`, ss&&ss.ups?'hot':''],
      ['상대 평균', ss&&ss.avgBu?ss.avgBu.toFixed(1)+'부':'–', ''],
      ['이긴 최강 상대', ss&&ss.best?`${nameOf(ss.best.oid)} (${ss.best.bu}부)`:'–', ss&&ss.best?'best':'']
    ];
    return `<div class="sez ${rank>=1&&rank<=3?'m'+rank:''}">
      <div class="sz-top">

        <div class="sz-tt">
          <b>${ym.slice(0,4)}. ${String(+ym.slice(5)).padStart(2,'0')}</b>

function bindPlayerTabs(root, id){

    [['season','#pvSeason'],['recent','#pvRecent'],['career','#pvCareer'],['log','#pvLog']].forEach(([k,sel])=>{

/* 경기 기록에서 날짜를 눌러 접었다 펴기 */

/* 선수 카드 — 그림은 그대로 두고 순위·시즌·이름·레이팅만 얹는다 */

/* 그 선수의 경기 원본 — 날짜만 죽 늘어놓고, 누르면 그날 경기가 펼쳐진다 */
let pLogOpen = {};
function playerLogHTML(id){
  const all=(S._sorted||[]).filter(m=>m.aId===id||m.bId===id);
  if(!all.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  const ord={}; (S._sorted||[]).forEach((m,i)=>ord[m.id]=i);
  const byDay={};
  all.forEach(m=>(byDay[m.date]=byDay[m.date]||[]).push(m));
  const days=Object.keys(byDay).sort().reverse();
  const openSet = pLogOpen[id] || (pLogOpen[id] = { [days[0]]:true });   // 최근 하루는 열어둔다
  const tot=all.length, wAll=all.filter(m=>winnerOf(m)===id).length;
  return `<p class="tiny dim" style="margin:0 2px 10px">${days.length}일 · ${tot}경기 · ${wAll}승 ${tot-wAll}패 · 날짜를 누르면 펼쳐집니다</p>
    ${days.map(d=>{
      const ms=byDay[d].slice().sort((a,b)=>ord[b.id]-ord[a.id]);
      const w=ms.filter(m=>winnerOf(m)===id).length;
      const net=ms.reduce((a,m)=>a+((m.aId===id?m._sA:m._sB)||0),0);
      const on=!!openSet[d];
      return `<div class="plday ${on?'on':''}">
        <button class="pd-h" data-plday="${d}">
          <b>${dateLabel(d)}</b>
          <span>${ms.length}경기</span>
          <span class="rec">${w}−${ms.length-w}</span>
          <em class="${net>0.5?'up':net<-0.5?'down':'dim'}">${net>0?'+':''}${Math.round(net)}</em>
          <i class="cv">${on?'▴':'▾'}</i>
        </button>
        ${on?`<div class="pd-b">${ms.map(m=>{
          const opp = m.aId===id ? m.bId : m.aId;
          const won = winnerOf(m)===id;
          const dR  = Math.round((m.aId===id ? m._sA : m._sB)||0);
          const e   = m._expA==null?null:(m.aId===id?m._expA:1-m._expA);
          const pk  = m.aId===id ? m._peakA : m._peakB;
          const h   = m.handi&&m.handi.pts ? (m.handi.toId===id?`+${m.handi.pts}`:`상대 +${m.handi.pts}`) : '';
          return `<div class="plrow ${won?'w':'l'}">
            <span class="rs">${won?'승':'패'}</span>
            <span class="op">${esc(nameOf(opp))}<i>${(P(opp)||{}).bu||'?'}부</i></span>
            ${h?`<span class="hd">${h}</span>`:''}
            ${e!=null&&won&&e<UPSET?`<span class="ux">이변</span>`:''}
            ${pk!=null?`<span class="pkx">최고 ${pk}</span>`:''}
            <span class="dr ${dR>0?'up':dR<0?'down':'dim'}">${dR>0?'+':''}${dR}</span>
          </div>`;}).join('')}</div>`:''}
      </div>`;}).join('')}`;
}

/* 맞대결 상세 — 테니스 H2H처럼 두 사람을 고른 뒤에만 자세히 본다 */
function renderH2H(meIdStr, oppId){
  const box=document.getElementById('h2hBox'); if(!box) return;
  if(!oppId){ box.innerHTML=''; return; }
  const a=h2hStats(meIdStr); if(!a) return;
  const o=a.list.find(x=>x.oid===oppId); if(!o){ box.innerHTML=''; return; }
  const g=o.w+o.l, pct=Math.round(o.w/g*100);
  const last=o.hist[0];
  box.innerHTML=`<div class="h2hcard">
    <div class="h2hnum"><b>${o.w}</b><span>−</span><b class="l">${o.l}</b></div>
    <div class="h2hbar"><i style="width:${pct}%"></i></div>
    <div class="split tiny dim" style="margin-top:7px"><span>내 승 ${o.w}</span><span>${esc(nameOf(oppId))} 승 ${o.l}</span></div>
    <div class="split tiny" style="margin-top:12px"><span class="dim">핸디</span>
      <span>${o.handi?`${o.handi.pts}점 ${o.handi.mine?'받음':'줌'}`:'없음'}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">최근 결과</span>
      <span class="form">${o.hist.map(x=>`<span class="${x.w?'w':'l'}" title="${x.d}">${x.w?'W':'L'}</span>`).join('')}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">마지막 경기</span><span>${last?last.d:'-'}</span></div>
  </div>`;
}

function estimateHTML(){
  const e = S._est;
  if(!e) return `<button class="btn ghost sm" id="sEst" style="margin-bottom:12px">경기 결과로 두 값 추정하기</button>`;
  if(!e.perBu) return `<p class="tiny dim" style="margin:0 2px 12px">경기 ${e.n}건으로는 추정이 어렵습니다. 40건 이상 쌓이면 다시 눌러보세요.
    <button class="btn ghost sm" id="sEst" style="margin-left:4px">다시 추정</button></p>`;
  const gap = e.perBu - st().ptsPerBu*e.handiElo;
  return `<div class="notice ${Math.abs(gap)>40?'warn':''}" style="margin:0 0 12px">
    경기 ${e.n}건으로 추정한 값<br>
    부수당 <b>${Math.round(e.perBu)}점</b> · 핸디 1점당 <b>${Math.round(e.handiElo)}점</b><br>
    <span class="dim">핸디를 주고도 부수당 ${Math.round(gap)}점이 남습니다. ${gap>40?'핸디가 부족하다는 뜻입니다.':gap<-40?'핸디가 과하다는 뜻입니다.':'거의 공정합니다.'}</span><br>
    <button class="btn ghost sm" id="sApply" style="margin-top:8px">이 값으로 설정</button>
    <button class="btn ghost sm" id="sEst" style="margin-top:8px">다시 추정</button>
  </div>`;
}
function entryDiagHTML(){
  const {cnt, exp, act} = entryAccuracy();
  if(cnt<40) return `<p class="tiny dim" style="margin:0 2px 12px">새 회원 첫 10경기 표본이 ${cnt}건입니다. 40건은 넘어야 시작 레이팅이 맞는지 판단할 만합니다.</p>`;
  const diff = act-exp, per100 = diff/cnt*100;
  const verdict = per100 <= -6 ? '새 회원의 시작 레이팅이 후한 편입니다. 부수를 실제보다 높게 잡고 있거나 부수당 레이팅이 큽니다. 이대로면 기존 회원 점수가 조금씩 올라갑니다.'
                : per100 >= 6 ? '새 회원의 시작 레이팅이 박한 편입니다. 새로 들어온 분들이 예상보다 잘 치고 있습니다.'
                : '새 회원의 시작 레이팅이 실제와 잘 맞습니다.';
  return `<div class="notice ${Math.abs(per100)>=6?'warn':''}" style="margin:0 0 12px">
    새 회원 첫 10경기 ${cnt}건 · 기대 ${exp.toFixed(1)}승 vs 실제 ${act}승 (100경기당 ${diff>0?'+':''}${per100.toFixed(1)})<br>${verdict}</div>`;
}
function handiDiagHTML(){
  const {n,rate}=handiStat();
  if(!n) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기가 쌓이면 클럽 핸디가 실제로 공정한지 여기서 알려드립니다.</p>`;
  if(n<10) return `<p class="tiny dim" style="margin:0 2px 12px">핸디 경기 ${n}건 · 핸디 받은 쪽 승률 ${rate}%. 10건은 넘어야 판단할 만합니다.</p>`;
  const verdict = rate>=58 ? '핸디가 후한 편입니다. 부수 차 1당 핸디 점수를 줄여보세요.'
                : rate<=42 ? (st().autoCalib
    ? '핸디를 줘도 윗 부수가 유리하다는 뜻입니다. 그 격차는 자동 보정으로 이미 레이팅에 반영돼 있습니다. 실제 경기에서 핸디를 더 주고 싶다면 부수 차 1당 핸디 점수를 늘리세요.'
    : '핸디가 박한 편입니다. 부수 차 1당 핸디 점수를 늘리거나, 자동 보정을 켜서 레이팅에 반영하세요.')
                : '클럽 핸디가 공정하게 잡혀 있습니다. 지금 값을 유지하세요.';
  return `<div class="notice ${(rate>=58||rate<=42)?'warn':''}" style="margin:0 0 12px">
    핸디 경기 ${n}건 · 핸디 받은 쪽 승률 <b>${rate}%</b><br>${verdict}</div>`;
}

      '변경', async()=>{

                  await sSet(KEY.meta, S.meta); }

}
async function reassignEntrant(fromId, toId){
  let n=0;
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

/* ── 밴드 연동 ──────────────────────────────────────────────
   밴드 댓글은 "@이름 @이름 님 상대 승" 형태다.
   같은 상대와 여러 판이면 "@이름 ×2" 로 적는다. */
const bandNorm = n => String(n||'').replace(/\([^)]*\)/g,'').replace(/님$/,'').trim();
const bandLabel = p => (p && (p.bandName || p.name)) || '';
function parseBandText(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    const win = /승\s*$/.test(line), lose = /패\s*$/.test(line);
    if(!win && !lose) continue;
    const re=/@([^\s@×xX*]+(?:\([^)]*\))?)\s*(?:[×xX*]\s*(\d+))?/g;
    let m;
    while((m=re.exec(line))){
      const raw=String(m[1]).trim(), name=bandNorm(raw);
      if(!name) continue;
      rows.push({raw, name, r: win?'W':'L'});
    }
  }
  const seen={};
  return rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; });
}
/* 한 번 알려준 밴드 이름은 선수에 별칭으로 남겨두고 다음부터 자동으로 맞춘다 */
function matchPlayerByName(raw){
  const r=String(raw||'').trim(), n=bandNorm(r);
  if(!n) return null;
  const A=x=>x.aliases||[];
  let p = S.players.find(x=>x.bandName===r)
       || S.players.find(x=>A(x).includes(r))
       || S.players.find(x=>x.name===n)
       || S.players.find(x=>A(x).some(a=>bandNorm(a)===n))
       || S.players.find(x=>bandNorm(x.name)===n);
  if(p) return p;
  const cands=S.players.filter(x=>x.name.startsWith(n)||n.startsWith(x.name));
  return cands.length===1 ? cands[0] : null;
}
/* 이름 패턴 기억하기 */
async function learnAliases(pairs){          // [{pid, raw}]
  const need=pairs.filter(({pid,raw})=>{
    const p=P(pid); if(!p || !raw) return false;
    return p.bandName!==raw && !(p.aliases||[]).includes(raw);
  });
  if(!need.length) return;
  await savePlayers(map=>{
    for(const {pid,raw} of need){
      const x=map.get(pid); if(!x) continue;
      x.aliases=[...new Set([...(x.aliases||[]), raw])].slice(0,6);
      if(!x.bandName) x.bandName=raw;         // 내보낼 때 쓸 대표 이름
    }
  });
}
/* 내 경기를 밴드 댓글 형식으로 만든다 */
function bandTextFor(meIdStr, date){
  const win={}, lose={};
  for(const m of S.matches){
    if(m.void || m.date!==date) continue;
    if(m.aId!==meIdStr && m.bId!==meIdStr) continue;
    const opp = m.aId===meIdStr ? m.bId : m.aId;
    const box = winnerOf(m)===meIdStr ? win : lose;
    box[opp]=(box[opp]||0)+1;
  }
  const fmt = box => Object.keys(box).map(id=>`@${bandLabel(P(id))||nameOf(id)}`).join(' ');
  const out=[];
  if(Object.keys(win).length)  out.push(`${fmt(win)} 님 상대 승`);
  if(Object.keys(lose).length) out.push(`${fmt(lose)} 님 상대 패`);
  return out.join('\n');
}

      picks[p.id]={r:r.r, n:1};
    }
    if(!Object.keys(picks).length) return toast('등록할 경기가 없습니다.',1);
    sh.remove();
    S.busy=true; busyOn('정리하는 중…');
    await learnAliases(learn);
    const res=await planAndSave(date, meIdStr, picks);
    S.busy=false; busyOff();
    if(!res.ok) return errorSheet('저장하지 못했습니다','밴드 글에서 읽은 경기를 저장하지 못했습니다.');
    audit('밴드 가져오기', `${nameOf(meIdStr)} · ${date} · 등록 ${res.created} / 합침 ${res.merged} / 건너뜀 ${res.skipped}`);
    bandImp=null; render();
    const parts=[];
    if(res.created) parts.push(`${res.created}건 등록`);
    if(res.merged)  parts.push(`${res.merged}건 합침`);
    if(res.skipped) parts.push(`${res.skipped}건 건너뜀`);
    if(added) parts.push(`선수 ${added}명 추가`);
    if(learn.length) parts.push(`이름 ${learn.length}개 기억`);
    toast(parts.join(' · ')||'등록할 경기가 없었습니다.');
  }
}
/* 확인 대기 처리 — 맞으면 확인, 아니면 반려 */
function confirmQueue(){
  const list=pendingForMe();
  if(!list.length) return toast('확인할 경기가 없습니다.');
  const sh=sheet(`확인 대기 ${list.length}건`, `
    <p class="tiny dim">상대가 올린 경기입니다. 맞으면 확인, 기억과 다르면 반려하세요. 확인해야 랭킹에 반영됩니다.</p>
    <div id="pendList" style="margin-top:12px">
      ${list.map(m=>{
        const win=winnerOf(m), iWon=win===S.me.id, opp=iWon?loserOf(m):win;
        return `<div class="pndc" id="pc_${m.id}">
          <div class="pw ${iWon?'w':'l'}">${iWon?'내 승':'내 패'}</div>
          <div class="pi"><b>${esc(nameOf(opp))}</b><small>${dateLabel(m.date)}${
            m.handi&&m.handi.pts?` · 핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}`:''}</small></div>
          <div class="pb">
            <button class="btn sm" data-yes="${m.id}">확인</button>
            <button class="btn ghost sm" data-no="${m.id}">반려</button>
          </div></div>`;
      }).join('')}
    </div>`);
  const refresh=()=>{ sh.remove(); render(); if(pendingForMe().length) confirmQueue(); else toast('확인 대기가 모두 처리됐습니다.'); };
  sh.querySelectorAll('[data-yes]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.yes); if(!m) return;
    const ok=await commitMatch({...m, confirmedBy:[...new Set([...(m.confirmedBy||[]),S.me.id])],
                                status:'confirmed', rev:(m.rev||0)+1});
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 확인', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`);
    refresh();
  });
  sh.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.no); if(!m) return;
    const ok=await deleteMatchById(m.id);
    if(!ok) return toast('처리에 실패했습니다.',1);
    audit('경기 반려', `${nameOf(m.enteredBy)} 입력분 (${m.date})`);
    refresh();
  });
}

function findDuplicates(){
  const out=[], live=S.matches.filter(m=>!m.void);
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    if(a.date!==b.date) continue;
    const samePair=(a.aId===b.aId&&a.bId===b.bId)||(a.aId===b.bId&&a.bId===b.aId);
    if(!samePair) continue;
    if(winnerOf(a)!==winnerOf(b)) continue;
    if(a.enteredBy===b.enteredBy) continue;
    if(isConfirmed(a)&&isConfirmed(b)) continue;
    out.push({a,b});
  }
  return out;
}

/* ── 시트 / 확인 ── */
function sheet(title, html, footer){
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="sheet">
    <div class="sh-bar ${title?'':'bare'}"><div class="grip"></div>
      ${title?`<h3>${esc(title)}</h3>`:''}
      <button class="sh-x" aria-label="닫기">✕</button></div>
    ${html}${footer||''}</div>`;
  const onKey=e=>{ if(e.key==='Escape') close(); };
  const close=()=>{ if(!mask.isConnected) return;
    mask.classList.add('out'); setTimeout(()=>mask.remove(), 140); };
  mask.close=close;
  mask.onclick=e=>{ if(e.target===mask) close(); };            // 바깥을 눌러도 닫힌다
  mask.querySelector('.sh-x').onclick=close;
  window.addEventListener('keydown', onKey);
  /* 시트가 떠 있는 동안 뒷화면이 같이 밀리지 않게 잠근다 */
  const lockY = window.scrollY || 0;
  const openCount = (S._sheets = (S._sheets||0) + 1);
  if(openCount===1){
    document.body.style.position='fixed';
    document.body.style.top = (-lockY)+'px';
    document.body.style.left='0'; document.body.style.right='0';
    document.body.style.width='100%';
    S._lockY = lockY;
  }
  const origRemove=mask.remove.bind(mask);
  mask.remove=()=>{
    window.removeEventListener('keydown', onKey);
    S._sheets = Math.max(0, (S._sheets||1) - 1);
    if(S._sheets===0){
      document.body.style.position='';
      document.body.style.top=''; document.body.style.left='';
      document.body.style.right=''; document.body.style.width='';
      window.scrollTo(0, S._lockY||0);
    }
    origRemove();
  };
  /* 위에서 아래로 밀어서 닫기 — 시트가 맨 위로 올라와 있을 때만 */
  const box=mask.querySelector('.sheet');
  let y0=null, dy=0;
  box.addEventListener('touchstart', e=>{ if(box.scrollTop>0){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; }, {passive:true});
  box.addEventListener('touchmove', e=>{ if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){ box.style.transition='none'; box.style.transform='translateY('+dy+'px)'; }
  }, {passive:true});
  box.addEventListener('touchend', ()=>{ if(y0==null) return;
    box.style.transition='transform .16s ease';
    if(dy>90) close(); else box.style.transform='';
    y0=null; });
  document.body.appendChild(mask); return mask;
}
function confirmSheet(title, html, okLabel, fn){
  const m=sheet(title,`<p class="tiny" style="line-height:1.7;color:var(--mut)">${html}</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" data-no>취소</button><button class="btn" data-yes>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-no]').onclick=()=>m.remove();
  m.querySelector('[data-yes]').onclick=async()=>{ m.remove(); await fn(); };
}

/* 내가 쓴 뒤 남기는 신호 — 다른 기기만 이걸 보고 새로고침한다 */
function bumpSig(){ if(FB) FB.set('sig', {t:Date.now(), by:CLIENT}).catch(()=>{}); }
/* 새 확인 요청이 들어오면 화면에서만 알린다 (브라우저 알림은 쓰지 않는다) */
function notifyPending(added){ toast(`확인할 경기 ${added}건이 새로 들어왔습니다.`); }
/* 다른 사람이 경기를 넣으면 알아서 새로고침 — 입력 중일 때는 건드리지 않는다 */
function watchRemote(){
  if(!FB) return;
  let t=null, first=true;
  FB.watch(sig=>{
    if(first){ first=false; return; }
    if(sig && sig.by===CLIENT) return;          // 내가 쓴 변경은 이미 화면에 반영돼 있다
    clearTimeout(t);
    t=setTimeout(async()=>{
      if(S.busy) return;
      const a=document.activeElement;
      if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;   // 입력 중이면 다음 기회에
      if(document.querySelector('.mask')) return;                     // 확인창 떠 있으면 대기
      const before = pendingForMe().length;
      await loadAll();
      if(S.me){ const me=P(S.me.id); if(me) S.me=me; }
      const after = pendingForMe().length;
      if(after>before) notifyPending(after-before);
      softRender();
    }, 500);
  });
}
(async()=>{
  render();
  await defPin();

  /* 1) 캐시가 있으면 네트워크를 기다리지 않고 바로 보여준다 */
  const cached = loadCache();
  if(cached && cached.players){
    S.meta = cached.meta || {settings:{...DEFAULTS}};
    S.meta.settings = {...DEFAULTS, ...(S.meta.settings||{})};
    S.players = cached.players || [];
    S.matches = cached.matches || [];
    recompute();
    const ses0 = await sGet(KEY.session,false);
    if(ses0 && ses0.playerId){ const p=P(ses0.playerId); if(p && p.active!==false) S.me=p; }
    S.ready = true; S.stale = true;
    render();
  }

  /* 2) 최신 데이터를 받아 갱신한다 */
  FB = await initFirebase();
  S.connecting = false;
  await loadAll();
  if(!S.matches.length) await migrateShards();      // 예전 저장 방식이 남아 있을 때만
  if(S.matches.length===0 && FB) await loadAll();
  const ses = await sGet(KEY.session,false);
  if(ses && ses.playerId){
    const p=P(ses.playerId);
    if(p && p.active!==false){ S.me=p; sSet(KEY.session,{playerId:p.id, at:Date.now()},false); }
    else if(!p){ S.me=null; sDel(KEY.session,false); }     // 계정이 지워진 경우
  }
  S.ready = true; S.stale = false;
  softRender();
  const np = pendingForMe().length;
  if(np) setTimeout(()=>toast(`확인할 경기가 ${np}건 있습니다.`), 700);
  watchRemote();
})();
