async function submitMatch(force){
  if(S.busy) return; 
  const d={...draft};
  const live=$('#fdate'); if(live&&live.value) d.date=draft.date=live.value;   // 달력에서 고르고 바로 등록해도 반영되게
  if(!d.bId||d.aId===d.bId) return toast('상대를 선택하세요.',1);

  if(!isAdmin() && d.aId!==S.me.id && d.bId!==S.me.id) return toast('본인 경기만 입력할 수 있습니다.',1);
  if(!dateOK(d.date)) return toast(d.date>today()?'미래 날짜는 입력할 수 없습니다.':'오늘과 어제까지만 입력할 수 있습니다.',1);

  const meId = isAdmin()? d.aId : S.me.id;
  const oppId = meId===d.aId ? d.bId : d.aId;
  const winnerId = d.aWon ? d.aId : d.bId;
  const iWon = winnerId===meId;
  /* 관리자가 넣은 경기는 바로 확정. 회원이 자기 경기를 넣은 경우만 상대 확인을 기다린다 */
  const needConfirm = !isAdmin() && (d.aId===S.me.id || d.bId===S.me.id);
  const confirmIds = needConfirm ? [S.me.id] : [d.aId, d.bId];

  if(force!==true){
    const {byOpp, mineCount, conflict} = dupScan(d.date, meId, oppId, iWon);
    if(byOpp){                                   // 상대가 먼저 넣은 동일 경기 → 확인 처리
      S.busy=true;
      const upd={...byOpp, confirmedBy:[...new Set([...(byOpp.confirmedBy||[]), ...confirmIds])], status:'confirmed', rev:(byOpp.rev||0)+1};
      busyOn('상대 입력분과 합치는 중…');
      const ok=await commitMatch(upd); S.busy=false; busyOff();
      if(!ok) return errorSheet('저장하지 못했습니다','상대가 올린 경기와 합치는 중 문제가 생겼습니다.');
      audit('중복 병합', `${nameOf(meId)} vs ${nameOf(oppId)} ${d.date}`);
      draft=null; render(); return toast('상대가 이미 입력한 경기라 하나로 합치고 상호 확인 처리했습니다.');
    }
    if(conflict){                                 // 같은 날 같은 상대인데 승패가 반대
      return confirmSheet('승패가 서로 다릅니다',
        `${esc(nameOf(oppId))}님은 같은 날 <b>본인이 ${winnerOf(conflict)===oppId?'이겼다':'졌다'}</b>고 입력했습니다.<br>지금 입력하려는 건 <b>내가 ${iWon?'이김':'짐'}</b>입니다.<br><br>다른 경기였다면 그대로 등록하고, 같은 경기인데 한쪽이 잘못 넣은 거라면 취소 후 상대와 맞춰주세요.`,
        '다른 경기입니다 · 등록', ()=>submitMatch(true));
    }
    if(mineCount>0){                              // 이미 등록된 경기
      return toast(`${nameOf(oppId)}님과의 그날 경기는 이미 등록돼 있습니다.`,1);
    }
  }

  const handiTo = draft.handiTo==='auto'
    ? (()=>{const a=P(d.aId),b=P(d.bId); return a&&b&&a.bu!==b.bu ? (a.bu>b.bu?a.id:b.id) : '';})() : draft.handiTo;
  const handiPts = handiTo ? (draft.handiPts ?? Math.abs(P(d.aId).bu-P(d.bId).bu)*st().ptsPerBu) : 0;

  const m={ id:uid('m'), rev:1, date:d.date, aId:d.aId, bId:d.bId, winnerId,
            handi: handiTo? {toId:handiTo, pts:handiPts} : null,
            note:(d.note||'').trim(),
            enteredBy:S.me.id, enteredAt:new Date().toISOString(),
            confirmedBy:confirmIds, status:needConfirm?'single':'confirmed', void:false };
  S.busy=true;
  const ok=await pushMatches([m]);
  S.busy=false;
  if(!ok) return errorSheet('저장하지 못했습니다','경기를 등록하는 중 문제가 생겼습니다. 화면은 원래대로 돌려놨습니다.');
  audit('경기 등록', `${nameOf(winnerId)} 승 vs ${nameOf(winnerId===m.aId?m.bId:m.aId)} (${m.date})`);
  const saved=S.matches.find(x=>x.id===m.id)||m;
  const ds=Math.round(saved.aId===S.me.id?(saved._sA||0): saved.bId===S.me.id?(saved._sB||0):0);
  const df=Math.round(saved.aId===S.me.id?(saved._fA||0): saved.bId===S.me.id?(saved._fB||0):0);
  draft={...draft, note:''};
  render(); toast((ds||df)? `등록 완료 · ${MODES.skill.label} ${ds>0?'+':''}${ds} · ${MODES.form.label} ${df>0?'+':''}${df}` : '등록 완료');
}

/* ── 기록 ── */
function matchCardHTML(m){
  const win=winnerOf(m), lose=loserOf(m);
  const mine=isMine(m), done=isConfirmed(m);
  const iWon = mine && win===S.me.id;
  const meMark = pid => pid===meId() ? '<i class="mem">나</i>' : '';
  const canDel = !!S.me && (isAdmin() || (m.enteredBy===S.me.id && !done));
  const canOk  = !!S.me && mine && !done && !(m.confirmedBy||[]).includes(S.me.id);
  const legacy = (m.enteredAt||'') < (st().legacyBefore||'');
  const proxy  = m.enteredBy!==m.aId && m.enteredBy!==m.bId;
  const byLabel = (legacy||proxy) ? '관리자 입력' : esc(nameOf(m.enteredBy))+' 입력';

  const dW = Math.round(Math.abs(win===m.aId ? (m._sA||0) : (m._sB||0)));
  const dL = Math.round(Math.abs(win===m.aId ? (m._sB||0) : (m._sA||0)));
  const peakW = win===m.aId ? m._peakA : m._peakB;

  let meta='';
  if(m._expA!=null){
    const favId = m._expA>=0.5 ? m.aId : m.bId;
    const favP  = Math.min(99, Math.round(Math.max(m._expA,1-m._expA)*100));
    const up    = win!==favId && favP>=58;
    meta += up ? `<span class="ups">이변</span>` : '';
    meta += `<span class="${favP>=70?'hot':''}">예상 ${esc(nameOf(favId))} ${favP}%</span>`;
  }
  if(m.handi&&m.handi.pts) meta += `<span>핸디 ${esc(nameOf(m.handi.toId))} +${m.handi.pts}</span>`;
  if(peakW) meta += `<span class="peak" title="${MODES.skill.label} 랭킹 기준, 이 경기로 본인 최고 레이팅을 넘어섰습니다">개인 최고 ${peakW}</span>`;
  if(!done) meta += `<span class="hot">${(m.confirmedBy||[]).includes(meId())?'상대 확인 대기':'내 확인 필요'}${st().confirmedOnly?' · 랭킹 미반영':''}</span>`;

  return `<div class="mt ${mine?(iWon?'mine mw':'mine ml'):''}">
    <button class="mrow" data-exp="${m.id}">
      <div class="side"><span class="rs w">승</span>
        <span class="pn ${win===meId()?'me':''}">${esc(nameOf(win))}${meMark(win)}${buOf(win)?`<em>(${buOf(win)}부)</em>`:''}</span>
        <span class="dl up">+${dW}</span></div>
      <div class="side"><span class="rs l">패</span>
        <span class="pn dim ${lose===meId()?'me':''}">${esc(nameOf(lose))}${meMark(lose)}${buOf(lose)?`<em>(${buOf(lose)}부)</em>`:''}</span>
        <span class="dl down">−${dL}</span></div>
      ${meta?`<div class="mmeta">${meta}</div>`:''}
    </button>
    <div class="macts" id="act_${m.id}" style="display:none">
      <div class="info">${m.date} · ${done?'상호 확인':'상대가 확인하면 랭킹에 반영됩니다'} · ${byLabel}${m.note?' · '+esc(m.note):''}</div>
      ${canDel?`<button class="btn ghost sm" data-date="${m.id}">날짜 수정</button>
                <button class="btn ghost sm" data-void="${m.id}">삭제</button>`:''}
      ${canOk?`<button class="btn ghost sm" data-ok="${m.id}">이 경기 확인</button>`:''}
      ${(!canDel&&!canOk)?'<span class="tiny dim">수정 권한이 없습니다.</span>':''}
    </div>
  </div>`;
}
function matchListHTML(list, opts){
  if(!list.length) return `<div class="empty">아직 경기가 없습니다.</div>`;
  const sorted=list.slice().sort((a,b)=>(b.date+b.enteredAt).localeCompare(a.date+a.enteredAt));
  if(!opts||!opts.group) return sorted.map(matchCardHTML).join('');
  const out=[]; let cur=null;
  for(const m of sorted){
    if(m.date!==cur){
      cur=m.date;
      const n=sorted.filter(x=>x.date===cur).length;
      out.push(`<div class="dayhd"><b>${dateLabel(cur)}</b><span>${n}경기</span></div>`);
    }
    out.push(matchCardHTML(m));
  }
  return out.join('');
}
/* 경기 삭제 — 보관하지 않고 바로 지운다 */
async function deleteMatchById(id){
  const before=S.matches.slice();
  S.matches=S.matches.filter(m=>m.id!==id); recompute(); render();
  busyOn('삭제 중…');
  let ok=true;
  try{
    if(FB){ await FB.del(FBM+'/'+id); bumpSig(); }
    else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        if(!cur.some(x=>x.id===id)) continue;
        if(!await sSet(k, cur.filter(x=>x.id!==id))) ok=false;
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); ok=false; }
  busyOff();
  if(!ok){ S.matches=before; recompute(); render(); }
  return ok;
}
/* 선수를 지울 때 그 사람 경기도 함께 지운다 */
async function deleteMatchesOf(pid){
  const targets=S.matches.filter(m=>m.aId===pid||m.bId===pid);
  if(!targets.length) return 0;
  try{
    if(FB){
      const obj={}; targets.forEach(m=>obj[m.id]=null);   // null 을 넣으면 그 레코드가 지워진다
      await FB.patch(FBM, obj); bumpSig();
    } else {
      for(const k of (await sList(MPRE))){
        const cur=(await sGet(k))||[];
        const next=cur.filter(m=>m.aId!==pid && m.bId!==pid);
        if(next.length!==cur.length) await sSet(k,next);
      }
    }
  }catch(e){ S.lastError = e && (e.message||String(e)); return 0; }
  S.matches=S.matches.filter(m=>m.aId!==pid && m.bId!==pid); recompute();
  return targets.length;
}
/* 날짜만 바꾼다. 개별 레코드 방식이라 옮길 필요가 없다 */
async function moveMatchDate(m, newDate){
  const upd={...m, date:newDate, rev:(m.rev||0)+1, editedBy:S.me.id, editedAt:new Date().toISOString()};
  if(FB) return pushMatches([upd]);
  const newKey=KEY.shard(monthOf(newDate));
  if(!await commitMatch(upd)) return false;
  for(const k of (await sList(MPRE))){
    if(k===newKey) continue;
    const cur=(await sGet(k))||[];
    if(cur.some(x=>x.id===m.id)) await sSet(k, cur.filter(x=>x.id!==m.id));
  }
  await loadAll();
  return true;
}
function dateSheet(id){
  const m=S.matches.find(x=>x.id===id); if(!m) return;
  const sh=sheet('경기 날짜 수정', `
    <p class="tiny dim">${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))}</p>
    <div class="field" style="margin-top:12px"><label>날짜</label>
      <input type="date" id="mdNew" value="${m.date}" max="${today()}" min="${minEntryDate()}"></div>
    <p class="tiny dim">몰아서 기록하다 날짜가 밀린 경우에 쓰세요. 날짜를 바꾸면 그 순서대로 레이팅이 다시 계산됩니다.</p>`,
    `<div class="row" style="margin-top:14px"><button class="btn ghost" id="mdNo">취소</button><button class="btn" id="mdYes">저장</button></div>`);
  sh.querySelector('#mdNo').onclick=()=>sh.remove();
  sh.querySelector('#mdYes').onclick=async()=>{
    const nd=sh.querySelector('#mdNew').value;
    if(!nd) return toast('날짜를 선택하세요.',1);
    if(!dateOK(nd)) return toast(nd>today()?'미래 날짜는 넣을 수 없습니다.':'오늘과 어제로만 옮길 수 있습니다.',1);
    sh.remove();
    if(nd===m.date) return;
    const ok=await moveMatchDate(m, nd);
    if(!ok) return errorSheet('수정하지 못했습니다','날짜를 옮기는 중 문제가 생겼습니다.');
    audit('날짜 수정', `${m.date} → ${nd}`);
    viewLog.month=nd.slice(0,7); if(viewLog.day) viewLog.day=nd;
    render(); toast('날짜를 바꿨습니다.');
  };
}
function bindMatchActions(){
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('act_'+b.dataset.exp); if(!el) return;
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>dateSheet(b.dataset.date));
  document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{
    const m=S.matches.find(x=>x.id===b.dataset.void); if(!m) return;
    confirmSheet('경기를 삭제할까요?', `${esc(nameOf(winnerOf(m)))} 승 vs ${esc(nameOf(loserOf(m)))} · ${m.date}<br>완전히 지워집니다. 되돌리려면 백업이 필요합니다.`, '삭제', async()=>{
      if(S.busy) return; S.busy=true;
      const info=`${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`;
      const ok=await deleteMatchById(m.id); S.busy=false;
      if(ok){ audit('경기 삭제', info); toast('삭제했습니다.'); }
      else errorSheet('삭제하지 못했습니다','경기를 지우는 중 문제가 생겼습니다.');
    });
  });
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    const m=S.matches.find(x=>x.id===b.dataset.ok);
    const ok=await commitMatch({...m, confirmedBy:[...new Set([...(m.confirmedBy||[]),S.me.id])], status:'confirmed', rev:(m.rev||0)+1});
    if(ok){ audit('경기 확인', `${nameOf(winnerOf(m))} 승 vs ${nameOf(loserOf(m))} (${m.date})`); render(); toast('상호 확인되었습니다.'); }
  });
}
/* 그 기간의 볼거리 — 최대 이변 / 최다 출전 / 최다 상승 */
function highlightHTML(scope){
  const ms=scope.filter(m=>m._expA!=null);
  if(ms.length<3) return '';
  let ups=null, upP=1;
  const games={}, gain={};
  for(const m of ms){
    const w=winnerOf(m), l=loserOf(m);
    const pw = w===m.aId ? m._expA : 1-m._expA;
    if(pw<upP){ upP=pw; ups=m; }
    games[w]=(games[w]||0)+1; games[l]=(games[l]||0)+1;
    gain[m.aId]=(gain[m.aId]||0)+(m._sA||0);
    gain[m.bId]=(gain[m.bId]||0)+(m._sB||0);
  }
  const most=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];
  const top=Object.entries(gain).sort((a,b)=>b[1]-a[1])[0];
  const cards=[];
  if(ups && upP<=0.42) cards.push(`<div class="hl"><div class="k">최대 이변</div>
    <div class="v">${esc(nameOf(winnerOf(ups)))}</div>
    <div class="s">예상 ${Math.round(upP*100)}%</div></div>`);
  if(top && top[1]>=5) cards.push(`<div class="hl"><div class="k">최다 상승</div>
    <div class="v">${esc(nameOf(top[0]))}</div><div class="s">+${Math.round(top[1])}점</div></div>`);
  if(most && most[1]>=3) cards.push(`<div class="hl"><div class="k">최다 출전</div>
    <div class="v">${esc(nameOf(most[0]))}</div><div class="s">${most[1]}경기</div></div>`);
  if(!cards.length) return '';
  return `<div class="hls">${cards.join('')}</div>`;
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* 경기가 있는 날짜 목록 (오름차순) */
function playDates(){
  return [...new Set(S.matches.filter(m=>!m.void).map(m=>m.date))].sort();
}
function viewLog(){
  let f=viewLog.filter||'all';
  if(!S.me && f!=='all' && f!=='upset') f=viewLog.filter='all';
  const live=S.matches.filter(m=>!m.void);
  const days=playDates();

  /* 처음 들어오면 가장 최근 경기일을 보여준다. 한 달치를 통째로 뿌리면 스크롤이 감당이 안 된다. */
  if(!viewLog.init){ viewLog.init=1; viewLog.day = days.length ? days[days.length-1] : null; }
  if(viewLog.day && !viewLog.month) viewLog.month = viewLog.day.slice(0,7);
  const month=viewLog.month || (viewLog.day ? viewLog.day.slice(0,7) : today().slice(0,7));
  viewLog.month=month;

  const byDay={}; live.forEach(m=>{(byDay[m.date]=byDay[m.date]||[]).push(m);});
  const who = viewLog.who || '';
  const pass=m=>{
    if(who && m.aId!==who && m.bId!==who) return false;
    if(f==='mine')    return isMine(m);
    if(f==='pending') return !isConfirmed(m);
    if(f==='upset'){ if(m._expA==null) return false;
      const fav=m._expA>=0.5?m.aId:m.bId, p=Math.max(m._expA,1-m._expA);
      return winnerOf(m)!==fav && p>=0.58; }
    return true;
  };

  const [Y,Mo]=month.split('-').map(Number);
  const dim=new Date(Y,Mo,0).getDate(), off=new Date(Y,Mo-1,1).getDay();
  const cells=[];
  for(let i=0;i<off;i++) cells.push('<button class="day blank" disabled></button>');
  for(let d=1;d<=dim;d++){
    const ds=`${month}-${String(d).padStart(2,'0')}`;
    const list=byDay[ds]||[];
    const mineN=S.me?list.filter(isMine).length:0;
    const pips=[]; const cap=Math.min(list.length,4);
    for(let i=0;i<cap;i++) pips.push(`<span class="pip ${i<mineN?'mine':''}"></span>`);
    cells.push(`<button class="day ${list.length?'has':''} ${ds===today()?'today':''} ${ds===viewLog.day?'sel':''}" data-day="${ds}">
      <span>${d}</span><span class="pips">${pips.join('')}</span>
      ${list.length>4?`<span class="more">+${list.length-4}</span>`:''}</button>`);
  }

  const dayIdx = viewLog.day ? days.indexOf(viewLog.day) : -1;
  const prevDay = dayIdx>0 ? days[dayIdx-1] : null;
  const nextDay = dayIdx>=0 && dayIdx<days.length-1 ? days[dayIdx+1] : null;
  const monthDays = days.filter(d=>d.slice(0,7)===month);

  const scope = viewLog.day ? (byDay[viewLog.day]||[]) : live.filter(m=>m.date.slice(0,7)===month);
  const list  = scope.filter(pass);
  /* 날짜를 안 고른 채 '전체' 를 보면 목록 대신 날짜 색인만 보여준다 */
  const indexMode = !viewLog.day && f==='all' && !who;

  $('#view').innerHTML=`
    <h2>경기 기록</h2>
    ${viewLog.day?`<div class="daterow" style="margin-bottom:12px">
      <button data-dnav="${prevDay||''}" ${prevDay?'':'disabled'}>‹</button>
      <div class="dlab">${dateLabel(viewLog.day)}</div>
      <button data-dnav="${nextDay||''}" ${nextDay?'':'disabled'}>›</button>
    </div>`:''}
    <details class="calbox" ${viewLog.day?'':'open'}>
      <summary>달력에서 날짜 고르기</summary>
      <div class="cal">
        <div class="hd"><button class="nav" data-mv="-1">‹</button><b>${Y}년 ${Mo}월</b><button class="nav" data-mv="1">›</button></div>
        <div class="grid">${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${i===0?'sun':''}">${d}</div>`).join('')}</div>
        <div class="grid">${cells.join('')}</div>
        <div class="split tiny dim" style="margin-top:10px"><span>이 달 ${monthDays.length}일 · ${live.filter(m=>m.date.slice(0,7)===month).length}경기</span>
          <button class="btn ghost sm" id="goToday">최근 경기일</button></div>
      </div>
    </details>
    <div class="field" style="margin:12px 0 10px">
      <select id="logWho"><option value="">선수 전체</option>
        ${roster(false).map(p=>`<option value="${p.id}" ${p.id===who?'selected':''}>${esc(p.name)} · ${p.bu}부</option>`).join('')}
      </select></div>
    <div class="seg" style="margin:0 0 12px">
      <button data-f="all" class="${f==='all'?'on':''}">전체 ${scope.filter(m=>!who||m.aId===who||m.bId===who).length}</button>
      <button data-f="upset" class="${f==='upset'?'on':''}">이변</button>
      ${S.me?`<button data-f="mine" class="${f==='mine'?'on':''}">내 경기</button>
      <button data-f="pending" class="${f==='pending'?'on':''}">확인 대기</button>`:''}
    </div>
    ${viewLog.day?highlightHTML(scope):''}
    ${indexMode
      ? (monthDays.length
          ? `<div class="secttl">날짜를 고르세요</div>${monthDays.slice().reverse().map(d=>{
              const n=(byDay[d]||[]).length, mn=S.me?(byDay[d]||[]).filter(isMine).length:0;
              return `<button class="dayrow" data-day="${d}"><span class="dl">${dateLabel(d)}</span>
                <span class="dn">${n}경기${mn?` <span class="mine">내 ${mn}</span>`:''}</span><span class="dg">›</span></button>`;
            }).join('')}`
          : `<div class="empty">이 달은 등록된 경기가 없습니다.</div>`)
      : (list.length ? matchListHTML(list, {group:!viewLog.day})
                     : `<div class="empty">${viewLog.day?'이 날은 조건에 맞는 경기가 없습니다.':'이 달은 조건에 맞는 경기가 없습니다.'}</div>`)}`;

  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    viewLog.month=shiftMonth(month,+b.dataset.mv); viewLog.day=null; viewLog(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    viewLog.day=b.dataset.day; viewLog.month=viewLog.day.slice(0,7); viewLog(); });
  document.querySelectorAll('[data-dnav]').forEach(b=>{ if(b.dataset.dnav) b.onclick=()=>{
    viewLog.day=b.dataset.dnav; viewLog.month=viewLog.day.slice(0,7); viewLog(); }; });
  const gt=$('#goToday'); if(gt) gt.onclick=()=>{
    const d=playDates(); viewLog.day = d.length?d[d.length-1]:today();
    viewLog.month=viewLog.day.slice(0,7); viewLog(); };
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{viewLog.filter=b.dataset.f;viewLog();});
  const lw=$('#logWho'); if(lw) lw.onchange=()=>{ viewLog.who=lw.value; viewLog(); };
  bindMatchActions();
}

/* ── 내 정보 / 선수 상세 ── */
function sparkline(id,mode){
  const h=(trk(mode).H[id]||[]).map(x=>x.r); if(h.length<2) return '';
  const w=300,ht=64,lo=Math.min(...h),hi=Math.max(...h),sp=hi-lo||1;
  const col = mode==='form' ? 'var(--red)' : 'var(--blue)';
  const fill = mode==='form' ? 'rgba(224,75,63,.12)' : 'rgba(47,146,218,.12)';
  const pts=h.map((r,i)=>[i/(h.length-1)*w, ht-4-((r-lo)/sp)*(ht-12)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;display:block">
    <path d="${d} L${w} ${ht} L0 ${ht} Z" fill="${fill}"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="var(--ball)"/></svg>
    <div class="split tiny dim"><span>${Math.round(lo)}</span><span>${h.length-1}경기</span><span>${Math.round(hi)}</span></div>`;
}
const playDaysOf = (id, ym)=> new Set((S._sorted||[])
  .filter(m=>(m.aId===id||m.bId===id) && (!ym || m.date.slice(0,7)===ym))
  .map(m=>m.date)).size;
/* 마감된 시즌만 통산 기록에 넣는다. 진행 중인 시즌은 순위가 아직 확정이 아니다. */
const closedSeasons = ()=> seasons().filter(ym=>ym < monthOfNow());
function careerRank(id, mode){
  const yms=closedSeasons();
  const MIN=st().provisional||0;
  const rs=[];
  for(const ym of yms){
    const all=standings(ym,mode).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    if(i>=0) rs.push(i+1);
  }
  if(!rs.length) return {n:0};
  return {n:rs.length, best:Math.min(...rs),
          avg:rs.reduce((a,b)=>a+b,0)/rs.length,
          wins:rs.filter(x=>x===1).length};
}
/* 통산 순위 기록 */
function rankStats(id, mode){
  const dates=playDates(); if(!dates.length) return null;
  const first=(S._sorted||[]).find(m=>m.aId===id||m.bId===id);
  if(!first) return null;
  const rs=[];
  for(const d of dates){
    if(d<first.date) continue;
    const map=ranksAt(d, mode);
    if(map[id]) rs.push(map[id]);
  }
  if(!rs.length) return null;
  return {best:Math.min(...rs), avg:rs.reduce((a,b)=>a+b,0)/rs.length, n:rs.length};
}
function seasonWins(id, mode){
  const yms=seasons(); let wins=0, played=0;
  for(const ym of yms){
    const rows=standings(ym, mode).filter(r=>r.g>=(st().provisional||0));
    if(!rows.length) continue;
    if(rows.some(r=>r.p.id===id)) played++;
    if(rows[0].p.id===id) wins++;
  }
  return {wins, played};
}
/* 시즌별 세부 기록 — 탁구에서 의미 있는 것들 */
function seasonStats(id, ym, mode){
  const me=P(id); if(!me) return null;
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,7)===ym && (m.aId===id||m.bId===id));
  let ups=0, hiW=0, hiL=0, loW=0, loL=0, faceSum=0, fn=0, gave=0, gaveW=0, got=0, gotW=0, best=null;
  const opps=new Set();
  for(const m of ms){
    const oid = m.aId===id ? m.bId : m.aId, o=P(oid); if(!o) continue;
    opps.add(oid);
    const won = winnerOf(m)===id;
    const e = m._expA==null ? null : (m.aId===id ? m._expA : 1-m._expA);
    if(won && e!=null && e<0.42) ups++;
    if(o.bu < me.bu){ won?hiW++:hiL++; } else if(o.bu > me.bu){ won?loW++:loL++; }
    /* 상대 강도는 상대의 등록 부수로 본다. 엔진 내부값(_face)은 모드에 따라 덮여서 쓰면 안 된다. */
    faceSum += o.bu; fn++;
    if(won && (!best || o.bu < best.bu)) best={bu:o.bu, oid};
    if(m.handi && m.handi.pts){
      if(m.handi.toId!==id){ gave++; if(won) gaveW++; } else { got++; if(won) gotW++; }
    }
  }
  return {n:ms.length, ups, hiW, hiL, loW, loL, gave, gaveW, got, gotW, best,
          avgBu: fn?faceSum/fn:null, opps:opps.size};
}
/* 앞면 한 줄 문구 — 성적을 그대로 */
function seasonTag(id, ym, mode, rank, rec, st2){
  if(!rec.g) return '기록 없음';
  return `${rec.w}승 ${rec.l}패 · 승률 ${Math.round(rec.w/rec.g*100)}%`;
}
/* ── 클럽 분석 ──────────────────────────────────────────────
   손으로는 못 세는 것들: 팽팽한 매치업, 물고 물리는 삼각관계, 부수 조정 후보 */
function fairHandi(aId, bId){
  const A=P(aId), B=P(bId); if(!A||!B) return null;
  const ra=rateOf(aId,'skill'), rb=rateOf(bId,'skill');
  const gap=ra-rb;                                   // A가 유리한 정도
  const cur=(A.bu!==B.bu) ? Math.abs(A.bu-B.bu)*st().ptsPerBu : 0;
  const curTo=(A.bu>B.bu)?aId:(B.bu>A.bu?bId:null);  // 지금 관행상 핸디 받는 쪽
  const he=st().handiElo||1;
  const need=Math.round(Math.abs(gap)/he);           // 5:5로 만드는 데 필요한 점수
  const needTo=gap>0?bId:aId;
  const eff=gap + (curTo? (curTo===aId? cur*he : -cur*he) : 0);
  return {gap, cur, curTo, need, needTo, exp:1/(1+Math.pow(10,-eff/400))};
}
function pairStats(aId,bId){
  let w=0,l=0,last=null;
  for(const m of (S._sorted||[])){
    if((m.aId===aId&&m.bId===bId)||(m.aId===bId&&m.bId===aId)){
      (winnerOf(m)===aId)?w++:l++; last=m.date;
    }
  }
  return {w,l,n:w+l,last};
}
/* 물고 물리는 삼각관계 — A가 B를, B가 C를, C가 A를 이기는 고리 */
function findCycles(minGames){
  const ps=roster().filter(p=>(S.G[p.id]||0)>0);
  const edge={};      // edge[a][b] = true  (a가 b에게 우세)
  const info={};
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    const a=ps[i].id, b=ps[j].id, st2=pairStats(a,b);
    if(st2.n<minGames) continue;
    if(st2.w>st2.l){ (edge[a]=edge[a]||{})[b]=1; info[a+'>'+b]=`${st2.w}−${st2.l}`; }
    else if(st2.l>st2.w){ (edge[b]=edge[b]||{})[a]=1; info[b+'>'+a]=`${st2.l}−${st2.w}`; }
  }
  const out=[];
  const ids=ps.map(p=>p.id);
  for(let i=0;i<ids.length;i++) for(let j=0;j<ids.length;j++) for(let k=0;k<ids.length;k++){
    const a=ids[i],b=ids[j],c=ids[k];
    if(a===b||b===c||a===c) continue;
    if(a>=b||b>=c) continue;                          // 같은 고리 중복 방지
    if(edge[a]?.[b] && edge[b]?.[c] && edge[c]?.[a]) out.push([a,b,c,info]);
    else if(edge[a]?.[c] && edge[c]?.[b] && edge[b]?.[a]) out.push([a,c,b,info]);
  }
  return out;
}
/* 부수 조정 후보 — 체감과 등록 부수가 벌어진 사람 */
function buCandidates(){
  const MIN=Math.max(st().provisional||0, 8);
  return roster().map(p=>{
    const g=S.G[p.id]||0; if(g<MIN) return null;
    const felt=buScale(rateOf(p.id,'skill'));
    const d=p.bu-felt;                                 // +면 체감이 더 강함(승격 후보)
    if(Math.abs(d)<1.0) return null;
    return {p, g, felt, d};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
/* ── 대회 시뮬레이터 ──────────────────────────────────────────
   실력은 부수 레이팅(핸디를 걷어낸 값)으로 보고,
   핸디 적용 여부는 경기 조건으로 따로 고른다. */
function simWinProb(a, b, useHandi){
  let ea=a.r, eb=b.r;
  if(useHandi && a.bu!==b.bu){
    const pts=Math.abs(a.bu-b.bu)*st().ptsPerBu;
    if(a.bu>b.bu) ea+=pts*st().handiElo; else eb+=pts*st().handiElo;
  }
  return 1/(1+Math.pow(10,(eb-ea)/400));
}
const nextPow2 = n => { let k=1; while(k<n) k*=2; return k; };
/* 스네이크 방식으로 조를 나눈다 (1조1번, 2조1번, 2조2번, 1조2번 …) */
function snakeGroups(list, n){
  const gs=Array.from({length:n},()=>[]);
  list.forEach((p,i)=>{ const row=Math.floor(i/n), col=i%n;
    gs[row%2 ? n-1-col : col].push(p); });
  return gs;
}
function playLeague(members, useHandi, rnd){
  const rec={}; members.forEach(m=>rec[m.id]={w:0,l:0,h2h:{}});
  for(let i=0;i<members.length;i++) for(let j=i+1;j<members.length;j++){
    const A=members[i], B=members[j];
    const aw = rnd() < simWinProb(A,B,useHandi);
    if(aw){ rec[A.id].w++; rec[B.id].l++; rec[A.id].h2h[B.id]=1; rec[B.id].h2h[A.id]=0; }
    else  { rec[B.id].w++; rec[A.id].l++; rec[B.id].h2h[A.id]=1; rec[A.id].h2h[B.id]=0; }
  }
  return members.slice().sort((x,y)=>{
    const d=rec[y.id].w-rec[x.id].w; if(d) return d;
    const h=rec[x.id].h2h[y.id];                 // 승자승
    if(h===1) return -1; if(h===0) return 1;
    return rnd()-0.5;
  }).map(p=>({...p, w:rec[p.id].w, l:rec[p.id].l}));
}
function playKnockout(seeds, useHandi, rnd, track){
  const size=nextPow2(seeds.length);
  const slots=new Array(size).fill(null);
  seeds.forEach((p,i)=>slots[i]=p);             // 남는 자리는 부전승
  let round=slots, rn=0;
  while(round.length>1){
    const next=[];
    for(let i=0;i<round.length;i+=2){
      const A=round[i], B=round[i+1];
      if(!A && !B){ next.push(null); continue; }
      if(!A || !B){ next.push(A||B); continue; }
      const aw = rnd() < simWinProb(A,B,useHandi);
      const win = aw?A:B, lose = aw?B:A;
      if(track) track.push({r:round.length, win:win.id, lose:lose.id});
      next.push(win);
    }
    round=next; rn++;
  }
  return round[0];
}
function runSim(opts){
  const {ids, mode, useHandi, format, groups, adv, runs} = opts;
  const base = ids.map(id=>({id, r:rateOf(id,mode), bu:(P(id)||{}).bu||10, name:nameOf(id)}))
                  .sort((a,b)=>b.r-a.r);
  const stat={}; ids.forEach(id=>stat[id]={champ:0, final:0, semi:0, adv:0, lgTop:0});
  let seed=20260806;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  let sample=null;
  for(let t=0;t<runs;t++){
    const track = (t===0) ? [] : null;
    let champ=null, finalists=[], semis=[];
    if(format==='league'){
      const order=playLeague(base, useHandi, rnd);
      champ=order[0]; finalists=order.slice(0,2); semis=order.slice(0,4);
      order.slice(0,Math.min(3,order.length)).forEach(p=>stat[p.id].lgTop++);
      if(track) sample={type:'league', order};
    } else {
      let seeds;
      if(format==='cup'){ seeds=base.slice(); }
      else {
        const gs=snakeGroups(base, Math.max(1,groups));
        const tops=gs.map(gm=>playLeague(gm, useHandi, rnd));
        tops.forEach(o=>o.slice(0,adv).forEach(p=>stat[p.id].adv++));
        seeds=[];
        for(let k=0;k<adv;k++) tops.forEach((o,gi)=>{ if(o[k]) seeds.push(o[gi%2? (k) : k]); });
        /* 조 1위끼리 만나지 않게 교차 배치 */
        const A=[],B=[];
        tops.forEach((o,gi)=>o.slice(0,adv).forEach((p,k)=>((k%2===0)?A:B).push(p)));
        seeds=[]; const n=Math.max(A.length,B.length);
        for(let k=0;k<n;k++){ if(A[k]) seeds.push(A[k]); if(B[k]) seeds.push(B[k]); }
        if(track) sample={type:'group', tops};
      }
      const trk=[];
      champ=playKnockout(seeds, useHandi, rnd, trk);
      const fin=trk.filter(x=>x.r===2); finalists=fin.length?[champ,{id:fin[0].win===champ.id?fin[0].lose:fin[0].win}]:[champ];
      trk.filter(x=>x.r===4).forEach(x=>semis.push({id:x.win},{id:x.lose}));
      if(track && sample) sample.bracket=trk; else if(track) sample={type:'cup', bracket:trk};
    }
    if(champ) stat[champ.id].champ++;
    finalists.forEach(p=>{ if(p&&stat[p.id]) stat[p.id].final++; });
    semis.forEach(p=>{ if(p&&stat[p.id]) stat[p.id].semi++; });
  }
  const rows=ids.map(id=>({id, name:nameOf(id), bu:(P(id)||{}).bu,
    r:Math.round(rateOf(id,mode)),
    champ:stat[id].champ/runs, final:stat[id].final/runs,
    semi:stat[id].semi/runs, adv:stat[id].adv/runs, lgTop:stat[id].lgTop/runs}))
    .sort((a,b)=>b.champ-a.champ || b.final-a.final);
  return {rows, sample, runs};
}
/* 핸디 표 진단 — 부수 차 구간별 실제 승률 */
function handiTable(){
  const rows={};
  for(const m of (S._sorted||[])){
    const A=P(m.aId), B=P(m.bId); if(!A||!B) continue;
    const d=Math.abs(A.bu-B.bu); if(!d) continue;
    const lower = A.bu>B.bu ? A.id : B.id;          // 부수가 높은 쪽 = 약한 쪽 = 핸디 받는 쪽
    const r=rows[d]=rows[d]||{n:0,w:0};
    r.n++; if(winnerOf(m)===lower) r.w++;
  }
  return Object.entries(rows).map(([d,r])=>({d:+d, n:r.n, w:r.w, rate:r.w/r.n}))
    .sort((a,b)=>a.d-b.d);
}
/* 기록실 */
function hallOfFame(){
  const pair={}, ups=[], byId={};
  for(const m of (S._sorted||[])){
    const k=[m.aId,m.bId].sort().join('|');
    pair[k]=(pair[k]||0)+1;
    const w=winnerOf(m), e=m._expA==null?null:(w===m.aId?m._expA:1-m._expA);
    if(e!=null && e<0.5) ups.push({m, e, w});
    [m.aId,m.bId].forEach(id=>{ const b=byId[id]=byId[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
  }
  const topPairs=Object.entries(pair).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([k,n])=>({a:k.split('|')[0], b:k.split('|')[1], n}));
  const topUps=ups.sort((a,b)=>a.e-b.e).slice(0,5);
  const arr=Object.entries(byId).map(([id,b])=>({id, ...b, days:b.days.size}));
  return { topPairs, topUps,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g).slice(0,5),
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days).slice(0,5),
    mostWins:  arr.slice().sort((a,b)=>b.w-a.w).slice(0,5) };
}
/* 출석 — 요일별 · 월별 */
function attendance(){
  const dow=[0,0,0,0,0,0,0], mon={}, dayPl={};
  for(const m of (S._sorted||[])){
    const [y,mo,dd]=m.date.split('-').map(Number);
    dow[new Date(y,mo-1,dd).getDay()]++;
    mon[m.date.slice(0,7)]=(mon[m.date.slice(0,7)]||0)+1;
    (dayPl[m.date]=dayPl[m.date]||new Set()).add(m.aId).add(m.bId);
  }
  const days=Object.keys(dayPl).sort();
  return {dow, mon:Object.entries(mon).sort(), days,
    avgPl: days.length? days.reduce((a,d)=>a+dayPl[d].size,0)/days.length : 0,
    dayPl};
}
/* 이달의 기록 */
function monthlyReport(ym){
  const ms=(S._sorted||[]).filter(m=>m.date.slice(0,7)===ym);
  if(!ms.length) return null;
  const by={}, pair={}; let best=null;
  for(const m of ms){
    const w=winnerOf(m), l=w===m.aId?m.bId:m.aId;
    [m.aId,m.bId].forEach(id=>{ const b=by[id]=by[id]||{g:0,w:0,days:new Set()};
      b.g++; b.days.add(m.date); if(w===id) b.w++; });
    const k=[m.aId,m.bId].sort().join('|'); pair[k]=(pair[k]||0)+1;
    const e=m._expA==null?null:(w===m.aId?m._expA:1-m._expA);
    if(e!=null && (!best || e<best.e)) best={m,e,w,l};
  }
  const arr=Object.entries(by).map(([id,b])=>({id,...b,days:b.days.size}));
  const rows=standings(ym,'skill').filter(r=>r.g>=(st().provisional||0));
  const pv=standings(ym,'skill',dayAgo(30)).filter(r=>r.g>=(st().provisional||0));
  const pvIdx={}; pv.forEach((r,i)=>pvIdx[r.p.id]=i+1);
  let rise=null;
  rows.forEach((r,i)=>{ const mv=pvIdx[r.p.id]?pvIdx[r.p.id]-(i+1):0;
    if(mv>0 && (!rise||mv>rise.mv)) rise={id:r.p.id, mv, rank:i+1}; });
  const tp=Object.entries(pair).sort((a,b)=>b[1]-a[1])[0];
  const MIN3=Math.max(3, Math.min(5, st().provisional||3));
  const mvp=arr.filter(x=>x.g>=MIN3).sort((a,b)=>
    (b.w-a.w) || ((b.w/b.g)-(a.w/a.g)) || (b.g-a.g))[0] || null;
  return { n:ms.length, days:new Set(ms.map(m=>m.date)).size, players:arr.length,
    mvp, minG:MIN3,
    champ: rows[0]||null,
    mostGames: arr.slice().sort((a,b)=>b.g-a.g)[0],
    mostDays:  arr.slice().sort((a,b)=>b.days-a.days)[0],
    bestWin:   arr.filter(x=>x.g>=3).sort((a,b)=>(b.w/b.g)-(a.w/a.g))[0],
    upset: best, rise,
    topPair: tp? {a:tp[0].split('|')[0], b:tp[0].split('|')[1], n:tp[1]} : null };
}

        한 사람당 ${c.ids.length-1}경기 (총 ${c.ids.length*(c.ids.length-1)/2}경기). 승수로 순위를 매깁니다.</p>`:''}

      <div class="secttl" style="margin-top:16px">경기 조건</div>
      <div class="seg">
        <button data-h="1" class="${c.handi?'on':''}">핸디 적용</button>
        <button data-h="0" class="${!c.handi?'on':''}">노핸디</button>
      </div>

      <div class="split" style="align-items:center;margin-top:16px">
        <div class="secttl" style="margin:0">참가자 ${c.ids.length}명</div>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm" data-all>전체</button>
          <button class="btn ghost sm" data-none>해제</button>
        </div>
      </div>
      <div class="picks" style="margin-top:8px">
        ${pool.map(p=>`<div class="pk ${c.ids.includes(p.id)?'w':''}">
          <button class="nm" data-tog="${p.id}">${esc(p.name)}<small>${p.bu}부</small></button></div>`).join('')}
      </div>
      <button class="btn" id="simGo" style="margin-top:16px" ${c.ids.length<3?'disabled':''}>
        ${c.ids.length<3?'3명 이상 선택하세요':'대회 열기'}</button>
      <div id="simOut"></div>`;
  };
  const bind=()=>{
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ simCfg.format=b.dataset.f; redraw(); });
    sh.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ simCfg.handi=b.dataset.h==='1'; redraw(); });
    sh.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.tog, i=simCfg.ids.indexOf(id);
      if(i<0) simCfg.ids.push(id); else simCfg.ids.splice(i,1); redraw(); });
    const a=sh.querySelector('[data-all]'); if(a) a.onclick=()=>{ simCfg.ids=pool.map(p=>p.id); redraw(); };
    const n=sh.querySelector('[data-none]'); if(n) n.onclick=()=>{ simCfg.ids=[]; redraw(); };
    const gn=sh.querySelector('#sgN'); if(gn) gn.onchange=()=>{ simCfg.groups=+gn.value; redraw(); };
    const ga=sh.querySelector('#sgA'); if(ga) ga.onchange=()=>{ simCfg.adv=+ga.value; redraw(); };
    const go=sh.querySelector('#simGo');
    if(go) go.onclick=()=>{
      busyOn('대회 진행 중…');
      setTimeout(()=>{
        const res=runSim({...simCfg, useHandi:simCfg.handi});
        busyOff();
        sh.querySelector('#simOut').innerHTML=simResultHTML(res, simCfg);
      }, 30);
    };
  };
  const redraw=()=>{ const o=sh; sh=sheet('대회 시뮬레이터', draw()); o.remove(); bind(); };
  sh=sheet('대회 시뮬레이터', draw()); bind();
}
function simResultHTML(res, c){
  const pc=x=>x>=0.995?'100%':x<0.005?'–':(x*100).toFixed(x<0.1?1:0)+'%';

  return `<hr class="sep">
    <div class="notice" style="margin-bottom:12px">

      ${res.rows.map(r=>`<tr><td>${esc(r.name)} <span class="dim">${r.bu}부 · ${r.r}</span></td>
        <td class="n"><b>${pc(r.champ)}</b></td><td class="n">${pc(r.final)}</td>

}
/* 시즌별 요약 — 한 시즌이 카드 한 장 */
function seasonRowsHTML(id, mode){
  const yms=seasons().slice().reverse();
  const MIN=st().provisional||0;
  const other = mode==='skill' ? 'form' : 'skill';
  const rankIn=(ym,md)=>{
    const all=standings(ym,md).filter(r=>r.g>=MIN);
    const i=all.findIndex(r=>r.p.id===id);
    return i<0?0:i+1;
  };
  const out=yms.map((ym,idx)=>{
    const all=standings(ym,mode);
    const me=all.find(r=>r.p.id===id);
    if(!me || !me.g) return '';
    const oth=standings(ym,other).find(r=>r.p.id===id);
    const rank=rankIn(ym,mode);
    const prevYm=yms[idx+1];
    const prev=prevYm?rankIn(prevYm,mode):0;
    const mv=(rank&&prev)?prev-rank:0;
    const ss=seasonStats(id,ym,mode);
    const pct=me.g?Math.round(me.w/me.g*100):0;
    const hiN=ss?(ss.hiW+ss.hiL):0, loN=ss?(ss.loW+ss.loL):0;
    const chips=[
      ['경기', `${me.g}`, ''],
      ['출석', `${playDaysOf(id, ym)}일`, ''],
      ['상위 부수', hiN?`${ss.hiW}−${ss.hiL}`:'0−0', hiN&&ss.hiW>ss.hiL?'up':''],
      ['하위 부수', loN?`${ss.loW}−${ss.loL}`:'0−0', ''],
      ['이변', `${ss?ss.ups:0}`, ss&&ss.ups?'hot':''],
      ['상대 평균', ss&&ss.avgBu?ss.avgBu.toFixed(1)+'부':'–', ''],
      ['이긴 최강 상대', ss&&ss.best?`${nameOf(ss.best.oid)} (${ss.best.bu}부)`:'–', ss&&ss.best?'best':'']
    ];
    return `<div class="sez ${rank>=1&&rank<=3?'m'+rank:''}">
      <div class="sz-top">
        <div class="sz-rk">${rank?`<span class="rn">${rank}</span><span class="ru">위</span>`
          :`<span class="rn dim">–</span>`}${mv?`<span class="mv ${mv>0?'up':'down'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:''}</div>
        <div class="sz-tt">
          <b>${ym.slice(0,4)}. ${String(+ym.slice(5)).padStart(2,'0')}</b>
          <span class="rec"><em>${me.w}−${me.l}</em><i>${pct}%</i></span>
        </div>
        <div class="sz-rt">
          <div class="on"><b>${Math.round(me.r)}</b><span>${MODES[mode].label}</span></div>
          ${oth?`<div class="off"><b>${Math.round(oth.r)}</b><span>${MODES[other].label}</span></div>`:''}
        </div>
      </div>
      <div class="sz-chips">${chips.map(([k,v,c])=>
        `<span class="chip ${c}"><i>${k}</i><b>${esc(v)}</b></span>`).join('')}</div>
    </div>`;
  }).filter(Boolean);
  return out.length ? out.join('') : `<div class="empty">아직 시즌 기록이 없습니다.</div>`;
}

/* 맞대결 상세 — 테니스 H2H처럼 두 사람을 고른 뒤에만 자세히 본다 */
function renderH2H(meIdStr, oppId){
  const box=document.getElementById('h2hBox'); if(!box) return;
  if(!oppId){ box.innerHTML=''; return; }
  const a=h2hStats(meIdStr); if(!a) return;
  const o=a.list.find(x=>x.oid===oppId); if(!o){ box.innerHTML=''; return; }
  const g=o.w+o.l, pct=Math.round(o.w/g*100);
  const last=o.hist[0];
  box.innerHTML=`<div class="h2hcard">
    <div class="h2hnum"><b>${o.w}</b><span>−</span><b class="l">${o.l}</b></div>
    <div class="h2hbar"><i style="width:${pct}%"></i></div>
    <div class="split tiny dim" style="margin-top:7px"><span>내 승 ${o.w}</span><span>${esc(nameOf(oppId))} 승 ${o.l}</span></div>
    <div class="split tiny" style="margin-top:12px"><span class="dim">핸디</span>
      <span>${o.handi?`${o.handi.pts}점 ${o.handi.mine?'받음':'줌'}`:'없음'}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">최근 결과</span>
      <span class="form">${o.hist.map(x=>`<span class="${x.w?'w':'l'}" title="${x.d}">${x.w?'W':'L'}</span>`).join('')}</span></div>
    <div class="split tiny" style="margin-top:6px"><span class="dim">마지막 경기</span><span>${last?last.d:'-'}</span></div>
  </div>`;
}

      x.bandName = bn || null;
      if(bn) x.aliases=[...new Set([...(x.aliases||[]), bn])].slice(0,6);
    }});
    if(ok){ S.me=P(p.id); audit('프로필 수정',p.name); render(); toast('저장했습니다.'); } else toast('저장 실패',1);
  };

    const oldPin=($('#pinOld').value||'').trim(), newPin=($('#pinNew').value||'').trim();
    if(p.pinHash && p.pinHash!==await sha(oldPin)) return toast('현재 PIN이 맞지 않습니다.',1);
    if(!/^\d{4}$/.test(newPin)) return toast('새 PIN은 숫자 4자리입니다.',1);
    if(newPin===DEFAULT_PIN) return toast(`${DEFAULT_PIN}은 초기 PIN이라 쓸 수 없습니다.`,1);
    const hash=await sha(newPin);
    const ok=await savePlayers(map=>{const x=map.get(p.id); if(x)x.pinHash=hash;});
    if(!ok) return toast('변경에 실패했습니다.',1);
    S.me=P(p.id); audit('PIN 변경',p.name); render(); toast('PIN을 바꿨습니다.');
  };
  $('#eOut').onclick=async()=>{ await sDel(KEY.session,false); S.me=null; render(); };
  bindSeason(document, p.id); bindPlayerTabs(document, p.id);
  document.querySelectorAll('.rk').forEach(b=>b.onclick=()=>playerSheet(b.dataset.pid));
}
function playerSheet(id){

}

async function reassignEntrant(fromId, toId){
  let n=0;
  for(const k of (await sList('tt:matches:'))){
    const cur=(await sGet(k))||[]; let touched=false;
    const next=cur.map(m=>{
      if(m.enteredBy!==fromId) return m;
      touched=true; n++;
      const wasPlayer = m.aId===fromId || m.bId===fromId;   // 직접 뛴 경기면 확인자 명단은 건드리지 않는다
      const cb=(m.confirmedBy||[]).map(x=> (!wasPlayer && x===fromId) ? toId : x);
      return {...m, enteredBy:toId, confirmedBy:[...new Set(cb)], rev:(m.rev||0)+1};
    });
    if(touched) await sSet(k,next);
  }
  return n;
}
/* 변경 이력은 이름 문자열로 저장되므로 이름 기준으로 바꾼다 */
async function reassignAudit(fromName, toName){
  const log=(await sGet(KEY.audit))||[];
  let n=0;
  const next=log.map(x=>{
    let y=x;
    if(x.by===fromName){ n++; y={...y, by:toName}; }
    if(typeof y.detail==='string' && fromName && y.detail.includes(fromName))
      y={...y, detail:y.detail.split(fromName).join(toName)};
    return y;
  });
  if(n || JSON.stringify(next)!==JSON.stringify(log)) await sSet(KEY.audit, next);
  return n;
}

/* ── 밴드 연동 ──────────────────────────────────────────────
   밴드 댓글은 "@이름 @이름 님 상대 승" 형태다.
   같은 상대와 여러 판이면 "@이름 ×2" 로 적는다. */
const bandNorm = n => String(n||'').replace(/\([^)]*\)/g,'').replace(/님$/,'').trim();
const bandLabel = p => (p && (p.bandName || p.name)) || '';
function parseBandText(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    const win = /승\s*$/.test(line), lose = /패\s*$/.test(line);
    if(!win && !lose) continue;
    const re=/@([^\s@×xX*]+(?:\([^)]*\))?)\s*(?:[×xX*]\s*(\d+))?/g;
    let m;
    while((m=re.exec(line))){
      const raw=String(m[1]).trim(), name=bandNorm(raw);
      if(!name) continue;
      rows.push({raw, name, r: win?'W':'L'});
    }
  }
  const seen={};
  return rows.filter(r=>{ const k=r.name+'|'+r.r; if(seen[k]) return false; seen[k]=1; return true; });
}
/* 한 번 알려준 밴드 이름은 선수에 별칭으로 남겨두고 다음부터 자동으로 맞춘다 */
function matchPlayerByName(raw){
  const r=String(raw||'').trim(), n=bandNorm(r);
  if(!n) return null;
  const A=x=>x.aliases||[];
  let p = S.players.find(x=>x.bandName===r)
       || S.players.find(x=>A(x).includes(r))
       || S.players.find(x=>x.name===n)
       || S.players.find(x=>A(x).some(a=>bandNorm(a)===n))
       || S.players.find(x=>bandNorm(x.name)===n);
  if(p) return p;
  const cands=S.players.filter(x=>x.name.startsWith(n)||n.startsWith(x.name));
  return cands.length===1 ? cands[0] : null;
}
/* 이름 패턴 기억하기 */
async function learnAliases(pairs){          // [{pid, raw}]
  const need=pairs.filter(({pid,raw})=>{
    const p=P(pid); if(!p || !raw) return false;
    return p.bandName!==raw && !(p.aliases||[]).includes(raw);
  });
  if(!need.length) return;
  await savePlayers(map=>{
    for(const {pid,raw} of need){
      const x=map.get(pid); if(!x) continue;
      x.aliases=[...new Set([...(x.aliases||[]), raw])].slice(0,6);
      if(!x.bandName) x.bandName=raw;         // 내보낼 때 쓸 대표 이름
    }
  });
}
/* 내 경기를 밴드 댓글 형식으로 만든다 */
function bandTextFor(meIdStr, date){
  const win={}, lose={};
  for(const m of S.matches){
    if(m.void || m.date!==date) continue;
    if(m.aId!==meIdStr && m.bId!==meIdStr) continue;
    const opp = m.aId===meIdStr ? m.bId : m.aId;
    const box = winnerOf(m)===meIdStr ? win : lose;
    box[opp]=(box[opp]||0)+1;
  }
  const fmt = box => Object.keys(box).map(id=>`@${bandLabel(P(id))||nameOf(id)}`).join(' ');
  const out=[];
  if(Object.keys(win).length)  out.push(`${fmt(win)} 님 상대 승`);
  if(Object.keys(lose).length) out.push(`${fmt(lose)} 님 상대 패`);
  return out.join('\n');
}

function findDuplicates(){
  const out=[], live=S.matches.filter(m=>!m.void);
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    if(a.date!==b.date) continue;
    const samePair=(a.aId===b.aId&&a.bId===b.bId)||(a.aId===b.bId&&a.bId===b.aId);
    if(!samePair) continue;
    if(winnerOf(a)!==winnerOf(b)) continue;
    if(a.enteredBy===b.enteredBy) continue;
    if(isConfirmed(a)&&isConfirmed(b)) continue;
    out.push({a,b});
  }
  return out;
}

function watchRemote(){
  if(!FB) return;
  let t=null, first=true;
  FB.watch(sig=>{
    if(first){ first=false; return; }
    if(sig && sig.by===CLIENT) return;          // 내가 쓴 변경은 이미 화면에 반영돼 있다
    clearTimeout(t);
    t=setTimeout(async()=>{
      if(S.busy) return;
      const a=document.activeElement;
      if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;   // 입력 중이면 다음 기회에
      if(document.querySelector('.mask')) return;                     // 확인창 떠 있으면 대기
      const before = pendingForMe().length;
      await loadAll();
      if(S.me){ const me=P(S.me.id); if(me) S.me=me; }
      const after = pendingForMe().length;
      if(after>before) notifyPending(after-before);
      softRender();
    }, 500);
  });
}
(async()=>{
  render();
  await defPin();

  /* 1) 캐시가 있으면 네트워크를 기다리지 않고 바로 보여준다 */
  const cached = loadCache();
  if(cached && cached.players){
    S.meta = cached.meta || {settings:{...DEFAULTS}};
    S.meta.settings = {...DEFAULTS, ...(S.meta.settings||{})};
    S.players = cached.players || [];
    S.matches = cached.matches || [];
    recompute();
    const ses0 = await sGet(KEY.session,false);
    if(ses0 && ses0.playerId){ const p=P(ses0.playerId); if(p && p.active!==false) S.me=p; }
    S.ready = true; S.stale = true;
    render();
  }

  /* 2) 최신 데이터를 받아 갱신한다 */
  FB = await initFirebase();
  S.connecting = false;
  await loadAll();
  if(!S.matches.length) await migrateShards();      // 예전 저장 방식이 남아 있을 때만
  if(S.matches.length===0 && FB) await loadAll();
  const ses = await sGet(KEY.session,false);
  if(ses && ses.playerId){
    const p=P(ses.playerId);
    if(p && p.active!==false){ S.me=p; sSet(KEY.session,{playerId:p.id, at:Date.now()},false); }
    else if(!p){ S.me=null; sDel(KEY.session,false); }     // 계정이 지워진 경우
  }
  S.ready = true; S.stale = false;
  softRender();
  const np = pendingForMe().length;
  if(np) setTimeout(()=>toast(`확인할 경기가 ${np}건 있습니다.`), 700);
  watchRemote();
})();
</script>
